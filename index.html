是 4:10——祭是神自己預備的，不是人去平息一位生氣的神。基督的死足夠為普天下人的罪，凡信神兒子的都得生命；普救論不採，有限與無限救贖之爭不在本卷裁判（揀選沿用以弗所書講義立場二）。","care":"席上有人從小被教導神很兇，對神只有怕；也有人覺得自己的過去太髒——墮胎、坐過牢、傷害過家人——心想十字架大概不包括我。不要把挽回祭講成「耶穌替你擋住一位要打你的父親」，也不要在講台上用預定論去回答一個正在問「我可以來嗎」的人。讓他聽見 4:10 的主詞是神，2:2 的範圍是普天下；然後陪他禱告，不催他。"},{"id":"ISS00_4","t":"愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？","r":"3:16--18；4:20--21；1:5--7","ch":[],"why":"四、愛是命令，但愛要在行為和誠實上；原諒交給神，和好需要對方的悔改與安全——本講義的全卷立場之四（本卷新立）。約翰一書是全聖經講「彼此相愛」最密集的書卷，也最常被拿來壓受傷的人：被家暴的妻子被人拿 4:20 勸她回家，被侵犯的孩子被要求用 3:16 的捨命去成全家庭的面子，被教會領袖傷害的人被說「不原諒就不能愛神」。約翰的愛從來不是沒有界線的。這一題必須在開卷講定，免得一封叫人知道自己被愛的信，被講成叫人留在危險裡的信。","pos":[["【一】經文問的是甚麼","","<p>約翰的命令很清楚：「我們應當彼此相愛」（3:11）；「主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命」（3:16）；「愛神的，也當愛弟兄，這是我們從神所受的命令」（4:21）。他也說得很重：「凡恨他弟兄的，就是殺人的」（3:15）。</p><p>可是會眾席上的問題很具體：<strong>我被傷害了，還要愛嗎？愛是不是表示要原諒？原諒是不是表示要回到原來的關係？如果對方還在傷害我呢？</strong>經文自己給了三個要素。①愛有內容：「我們相愛，不要只在言語和舌頭上，總要在行為和誠實上」（3:18）——「誠實」原文 ἀλήθεια，是真理、真相。②愛有源頭：「我們愛，因為神先愛我們」（4:19）。③約翰的光與愛是一起的：「神就是光」（1:5），「我們若在光明中行……就彼此相交」（1:7）——相交是在光裡的，不是在掩蓋裡的。</p>"],["無條件和好說：愛就是原諒，原諒就是恢復關係","","<p>這是華人教會很常聽到的勸法：基督徒要愛、要饒恕七十個七次，所以受了傷的人應該放下、和好、恢復原來的關係；不肯恢復，就是心裡還有苦毒，就是不愛弟兄。它引用的經文是真的：3:16 的「為弟兄捨命」，以及「不愛他所看見的弟兄，就不能愛沒有看見的神」（4:20）。這一說的優點是嚴肅看待饒恕，不讓仇恨在教會裡生根。</p><p><strong>難處：</strong>它把三件事混成一件：愛、原諒、和好。約翰說的「恨」，是像該隱那樣盼望對方消失的心（3:12、15），不是「不敢再和傷害我的人同住一個屋簷下」。更嚴重的是，它常把責任全部壓在受害者身上，卻不問加害者有沒有悔改、受害者安不安全。聖經的和好從來需要罪被面對：「倘若你的弟兄得罪你，你就去……指出他的錯來」（太 18:15）；而同一段經文接著帶進見證人與教會（太 18:16--17），不是叫受傷的人獨自去面對傷害他的人。叫受傷的人留在危險裡，不是約翰一書的愛。</p>"],["自我保護優先說：受了傷就可以切斷，不必再談愛","","<p>另一個極端是當代文化的語言：保護自己最重要，傷害你的人就從生命中刪除，不需要原諒，也不需要為他禱告。它的優點是正視創傷，承認受害者有權說「不」，也承認有些關係確實必須結束。</p><p><strong>難處：</strong>約翰一書不讓恨在心裡定居：「惟獨恨弟兄的，是在黑暗裡」（2:11）。主耶穌也說：「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44）。保持距離與心裡放不下仇恨，是兩件事；前者可以是智慧，後者會讓受害者一輩子被加害者綁住。只講界線、不講愛，最後受傷最深的往往是自己。</p>"],["有界線的愛說：愛是命令，但愛要在誠實上；原諒與和好分開","","<p>這一說把愛、原諒、和好三件事分開。<strong>愛</strong>是神的命令，是不以惡報惡、願對方悔改得救的心，可以在遠處為他禱告。<strong>原諒</strong>是把審判交給神：「不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19）——不是說事情沒有發生過，是不由我來執行報應。<strong>和好</strong>是雙方的事，需要對方的悔改，也需要安全：「若是能行，總要盡力與眾人和睦」（羅 12:18）——「若是能行」承認有時不能。3:18 的「誠實」包括說出真相：把傷害說出來、讓它被看見，本身就是在光裡行。約翰自己也有界線，他要人不接待傳假教訓的人（約貳 1:10）——愛真理的人，不是甚麼都接納。</p><p><strong>難處：</strong>這一說需要很多牧養的判斷：甚麼時候算是「不能」？悔改怎樣才算數？它也可能被濫用，讓人以「界線」為名，逃避一切需要謙卑面對的衝突。所以界線本身也要在光裡被檢驗：我設這個界線，是為了安全與真實，還是為了懲罰對方？</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：愛是命令，也要在行為和誠實上（3:18）；誠實包括說出真相。原諒交給神，和好需要對方的悔改與安全；不叫受傷的人留在危險裡。</strong></p><p>「我們也當為弟兄捨命」（3:16），是自願的、為了對方益處的捨己，像主為我們捨命；它不是要受害者把自己交在暴力底下。對一個正在施暴的人一再忍讓，不會使他得益處，只會讓罪繼續。真正的愛，有時正是讓罪被揭露，讓加害的人面對後果。</p><p><strong>涉及家暴、性侵、虐待（包括對兒童、長者，以及在教會裡發生的）時，</strong>受害者先保護自己的安全；鼓勵向可信的人與相關機構求助——家人、牧者、社工、輔導、醫療與保護專線；涉及刑事的，建議報警。教會不可為了「見證」或「家醜不外揚」要人隱忍，也不可要求受害者與加害者當面和解。這不違背 4:20；光本來就要照出黑暗。</p><p>321 的落點：謙卑不是讓人踐踏，是回到本位——<strong>讓神作審判者，讓自己作被愛的人。</strong>受傷的人不需要用忍耐來證明自己愛神。「我們愛，因為神先愛我們」（4:19）——先被愛夠了的人，才有力量在安全的距離裡為對方禱告，也才有勇氣說出真相。</p>"],["【四】這件事該不該影響你的信心","","<p>這件事不該讓你懷疑自己是不是基督徒。如果你因為不敢回到那個傷害你的人身邊，就覺得自己不夠愛、不夠屬靈，請聽清楚：約翰沒有這樣要求你。愛與安全不衝突，原諒與報警不衝突，為人禱告與保持距離也不衝突。</p><p>但有一件事值得你帶到神面前：<strong>我心裡的恨，是不是正在把我綁住？</strong>不必急著原諒，原諒常常是一段路，不是一個按鈕。你可以先把那份恨與痛，原原本本地說給神聽——他是光，他看得見；他也是愛，他不會嫌你。審判交給他，你只要作被愛的人。</p>"]],"con":[],"say":"本講義的立場：愛是命令，但愛要在行為和誠實上（3:18），誠實包括說出真相；原諒交給神，和好需要對方的悔改與安全，不叫受傷的人留在危險裡。家暴、性侵、虐待要向可信的人與機構求助，涉及刑事建議報警。謙卑不是讓人踐踏，是讓神作審判者、讓自己作被愛的人。","care":"席上可能坐著正被配偶打、卻被長輩勸「為了孩子忍一忍」的姊妹；小時候被親人侵犯、每次聽到「要原諒」就發抖的弟兄；被教會領袖傷害、不敢再走進聚會的人。不要說「你不原諒就是不愛神」「回去就是背十字架」「家醜不要外揚」。先相信他，陪他到安全的地方，協助他找社工、醫療、法律與保護專線；涉及刑事，陪他報警。講台上一句「你不必回到危險裡」，可能救一個人。"},{"id":"ISS00_5","t":"分辨：誰是敵基督、假先知？怎樣試驗諸靈？","r":"2:18--27；4:1--6","ch":[],"why":"五、分辨的標準是基督論——認耶穌基督是成了肉身來的；每一代都要分辨，但不算日子、不貼標籤——本講義的全卷立場之五（本卷新立；沿用彼得後書講義對假教師的處理）。「敵基督」這個詞全聖經只出現在約翰書信，卻常被講成末日預言的核心：有人據此推算時間、在國際新聞裡找人選，有人把它貼在別的宗派或族群身上；也有人在教會內鬥時，把意見不同的同工叫作「敵基督的靈」。約翰給的標準其實很清楚，也很謙卑。2:18--27 與 4:1--6 的各章議題都回指這裡。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來；現在已經有好些敵基督的出來了，從此我們就知道如今是末時了」（2:18）。接著他下定義：「誰是說謊話的呢？不是那不認耶穌為基督的嗎？不認父與子的，這就是敵基督的」（2:22）。到第四章，他吩咐：「一切的靈，你們不可都信，總要試驗那些靈是出於神的不是，因為世上有許多假先知已經出來了」（4:1）；標準是：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）。</p><p>ἀντίχριστος 這個詞，全聖經只出現在約翰一書與約翰二書（2:18、22；4:3；約貳 1:7）；有單數的「那敵基督的」，也有複數的「好些敵基督的」。「試驗」δοκιμάζω 是驗金子的字。<strong>所以經文問的是：敵基督是末世的一個人，還是一股靈、一種教訓？我們要用甚麼標準來試驗？</strong></p>"],["末世單一人物說：「那敵基督的」是末後要來的一個人","","<p>許多時代論與傳統的末世論，把 2:18 單數的「那敵基督的要來」，與帖撒羅尼迦後書的「大罪人」（帖後 2:3）、啟示錄 13 章的獸連在一起，認為歷史末了會出現一位集反基督之大成的人物。約翰說「你們曾聽見說」，表示初代教會確實有這樣的期待。這一說嚴肅看待末世，也提醒信徒歷史有一個終局。</p><p><strong>難處：</strong>約翰在這裡的重點恰好不是那一位將來的人物，而是「現在已經有好些敵基督的出來了」（2:18）；而這些人，是「從我們中間出去」（2:19）的。把焦點全放在未來的一個人身上，很容易變成解讀新聞、推算時間、在名人身上找記號——教會歷史上每一個這樣的猜測都落空了，還傷了許多人的信心。</p>"],["靈／趨勢說：敵基督是一股否認基督的靈與教訓，每個時代都有","","<p>這一說看重 4:3：「凡靈不認耶穌，就不是出於神，這是那敵基督者的靈。你們從前聽見他要來，現在已經在世上了」（4:3）。敵基督不是先指一個人，而是一種「靈」——一種否認耶穌是基督、否認他成了肉身的教訓與勢力，藉著人說話。約翰當時面對的，正是離開教會、否認耶穌真實肉身的那批人。這一讀讓每一代的信徒都必須分辨，不把責任推給將來。</p><p><strong>難處：</strong>若完全拿掉末世的盼望與警告，會把「那敵基督的要來」淡化成一般的錯誤思想；而且「靈」這個詞若用得太寬，人就會把一切自己不喜歡的東西都冠上這個名號——從流行音樂到意見不同的同工。約翰的標準很窄，是基督論，不是個人好惡。</p>"],["二者並存說：「好些敵基督的」已經在，「那敵基督的」將來也要來","","<p>許多解經家認為兩者都在經文裡：約翰沒有否認「那敵基督的要來」，但他說同樣的靈「現在已經在世上了」（4:3）；末後那一位，是這股貫穿歷史的靈最後、最集中的表現。這一讀同時保留了末世的盼望與當下的警醒，也與主耶穌的提醒一致：「因為假基督、假先知將要起來」（太 24:24）。</p><p><strong>難處：</strong>它需要很節制的講法，否則又會滑回「那麼那一位是誰？甚麼時候來？」的猜測。約翰自己在一世紀就說「如今是末時了」（2:18）——對他來說，從基督第一次來到第二次來，整段都在這個時期之內；這不是一個可以倒數的時鐘。主耶穌也說：「但那日子，那時辰，沒有人知道」（太 24:36）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三說並陳，講台採節制的二者並存讀法；分辨的標準是基督論——認耶穌基督是成了肉身來的（4:2），不認耶穌為基督的就是說謊的（2:22）。每一代都要分辨；不算日子，也不把這兩個名稱貼在任何政治人物、國家、宗派或群體身上。</strong></p><p>約翰的試驗很具體，也很謙卑。<strong>第一，看他怎麼講耶穌。</strong>耶穌是不是真實地成了肉身、真實地死、真實地復活？他是不是基督、是神的兒子（2:22--23；5:1、5）？<strong>第二，看他和「從起初所聽見的」（2:24）是否一致</strong>——所謂新的啟示若越過了基督的教訓（約貳 1:9），就不是從神來的。<strong>第三，看愛與順服的果子</strong>（3:10；4:7--8）。這也沿用彼得後書講義對假教師的處理：看他的教訓，看他的生活，看他把人帶到基督面前，還是帶到自己身邊；不看名氣，不看神蹟，也不看他站在哪一個陣營。</p><p>約翰同時給了安慰：「小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大」（4:4）。分辨不是活在恐懼裡，是住在真理裡。分辨也不是個人英雄主義：4:1 的「你們」是複數，分辨是在群體裡、對著聖經、謙卑地一起做的——「但要凡事察驗；善美的要持守」（帖前 5:21）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。那一位是一個人還是一股靈、末後的細節怎樣排列，這些討論都不該叫你害怕，更不該叫你天天盯著新聞找記號。約翰寫這段的目的，是要你知道「那在你們裡面的，比那在世界上的更大」（4:4）。</p><p>但有一個問題該問：<strong>我信的耶穌，是聖經裡那一位成了肉身、為我的罪死、又復活的耶穌嗎？</strong>如果是，你已經站在約翰所說「出於神」的那一邊。如果有人拿末日嚇你，要你交出財產、離開家人、只聽他一個人，那正是約翰要你試驗的那種靈；去找你信任的牧者與弟兄姊妹，一起回到聖經。</p>"]],"con":[],"say":"本講義的立場：敵基督與假先知三說並陳，講台採節制的二者並存讀法；分辨的標準是基督論——認耶穌基督是成了肉身來的（4:2），不認耶穌為基督的就是說謊的（2:22）。每一代都要分辨，在群體裡對著聖經分辨；不算日子、不貼標籤。","care":"席上有人小時候被「末日就要到了」的講道嚇過，到現在一看到國際新聞就心慌；也有人曾被極端團體控制，被說「離開我們就是跟從敵基督」。不要在講台上猜那一位是誰，也不要把意見不同的同工、別的宗派、某個國家或族群冠上這個名號。讓害怕的人聽見 4:4；讓受過操控的人知道，試驗諸靈也包括試驗那些要你只聽他一個人的人。"},{"id":"ISS00_6","t":"寫作年代與地點：約翰一書寫於何時何地？","r":"2:18--19；5:21","ch":[],"why":"六、照教會的傳統，約翰一書寫於一世紀末的以弗所一帶；早期說並陳，與約翰福音的先後不影響解經——本講義的全卷立場之六。年代與地點聽起來是學術問題，卻影響講台怎樣描述 2:19 的分裂、5:21 的偶像，以及這封信與約翰福音的關係。講得太確定，會把傳統講成史實；講得太懷疑，又會讓會眾以為聖經的歷史根基很鬆。這一題要給一個誠實、節制的說法，讓講台知道哪些可以說「確定」，哪些只能說「相傳」。","pos":[["【一】經文問的是甚麼","","<p>約翰一書沒有寫日期，也沒有寫地點。經文給的線索只有幾條：①寫的人年長，稱讀者為「小子們」，也分別對父老、少年人說話（2:12--14）。②教會已經經歷了一次分裂：「他們從我們中間出去」（2:19）。③要對付的錯誤牽涉耶穌的肉身（4:2--3），這類輕看肉身的思想在一世紀末越來越明顯。④全信最後一句是「小子們哪，你們要自守，遠避偶像」（5:21）。⑤用字與約翰福音極近，顯示兩者出自同一個傳承。<strong>經文問的是：這些線索指向甚麼時候、甚麼地方？它與約翰福音誰先誰後？</strong></p>"],["傳統說：約主後 85--95 年，寫於以弗所","","<p>這是多數學者接受的看法。照教會的傳統（愛任紐、優西比烏等的記載），使徒約翰晚年住在以弗所，牧養亞細亞一帶的教會；啟示錄 2--3 章的七個教會也在這個地區。4:2 所對付的肉身問題，與教父記載的克林妥思想相近——相傳他教導基督是在受洗時降在耶穌身上、在受難前離開。5:21 的偶像也合乎以弗所的處境：那是亞底米大廟所在的城，「大哉！以弗所人的亞底米啊」（徒 19:34）的呼聲曾在那裡響了約兩小時。</p><p><strong>難處：</strong>教父的記載晚於事件幾十年；克林妥與約翰相遇的故事只是相傳；信中沒有一個字提到以弗所。所以這一說是可能性最高的推論，不是經文直接說的。</p>"],["早期說：主後 70 年以前，寫於巴勒斯坦或敘利亞","","<p>少數學者（例如羅賓遜）主張新約各卷大多寫於耶路撒冷聖殿被毀之前，約翰一書也不例外。理由是：信中沒有提到聖殿被毀這樣的大事；信裡強烈的緊迫感，以及作者對猶太背景的熟悉，也可以放在較早的年代。</p><p><strong>難處：</strong>沒有提到某件事，不能證明它還沒發生；約翰一書幾乎不提任何外在事件。而否認耶穌肉身的思想，在一世紀末的證據比較多。這一說提醒我們傳統年代不是鐵板一塊，但支持它的正面證據有限。</p>"],["與約翰福音的先後：福音書在先，還是書信在先","","<p>多數學者認為約翰福音先成形，約翰一書在後：1:1 的「從起初」與「生命之道」回應約 1:1--4；書信像是在處理有人把福音書讀歪之後的局面——只強調靈，輕看肉身。也有學者主張書信在前、福音書在後，或兩者在同一段時期裡形成、彼此影響。</p><p><strong>難處：</strong>先後次序主要是從內容推測，兩邊都說得出理由；而且約翰福音本身可能經過一段時間才定稿——它的結尾說「我們也知道他的見證是真的」（約 21:24），暗示還有別人參與。把先後講得太確定，等於把推測當成經文。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：照教會的傳統，約翰一書約寫於主後 85--95 年，地點在以弗所一帶，寫給亞細亞的家庭教會；早期說並陳；約翰福音的主體大概先於書信，但先後不影響解經。</strong></p><p>講台使用這些背景時要守兩個分寸。<strong>第一，傳統要標明是傳統。</strong>說「照教會的傳統，約翰晚年住在以弗所」「相傳約翰在澡堂遇見克林妥就轉身離開」，不說「歷史證明」。<strong>第二，不讓背景搶走經文。</strong>約翰一書刻意不提地名、人名，讓每一個時代的教會都能在 2:19 認出自己的處境：有人離開了，留下的人被動搖了。無論寫於哪一年、在以弗所還是別處，這封信對留下的人說的話都一樣：「小子們哪，你們要住在主裡面」（2:28）。</p><p>5:21 的偶像，也不必只限於亞底米。在約翰一書裡，真神是在「他兒子耶穌基督裡面」（5:20）被認識的；任何取代那一位的東西——包括一套更高深的屬靈理論——都是偶像。這一層，每個城市都適用；今天的偶像也許不是廟裡的像，而是成就、金錢、別人的眼光，或一位取代了基督的屬靈名人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約書卷的年代與地點，許多都只能推到「大約」；這不表示聖經的歷史根基鬆動，而是表示我們誠實。約翰一書的權威不在它寫於哪一年，而在它見證的那一位：「親眼看過、親手摸過的」（1:1）。</p><p>倒是有一件事可以放進你的信心裡：這封信是一位老牧者寫的。他陪著教會走過分裂、走過假教訓、走過在異教大城裡作少數的日子，最後留下的不是一套策略，而是一句很短的叮嚀：「小子們哪，你們要自守，遠避偶像！」（5:21）。今天你也在你的城裡作少數；同一位主，同樣保守你。</p>"]],"con":[],"say":"本講義的立場：照教會的傳統，約翰一書約寫於主後 85--95 年、以弗所一帶，寫給亞細亞的家庭教會；早期說並陳；約翰福音主體大概在先，先後不影響解經。講台引用以弗所、克林妥等記載要標明「相傳」，不讓背景搶走經文。","care":"席上有喜歡讀考古與歷史的弟兄，也有一聽到「學者認為」就緊張、怕聖經被推翻的長輩。不要把傳統講成鐵證，也不要在講台上炫耀學術爭議，讓人以為信心要等考據定案。誠實地說「大約」「相傳」，再把焦點帶回經文。對在異教環境裡作少數的信徒——家族裡唯一信主、公司裡唯一不拜拜的人——5:21 不是一條冷冰冰的禁令，是一位老牧者的掛念。"},{"id":"ISS00_7","t":"約翰一書是書信還是講章？為甚麼沒有問安？","r":"1:1--4；2:1；2:12--14","ch":[],"why":"七、約翰一書是寫給一群熟悉的教會、可以被宣讀的牧養書信，帶著講章與勸勉的性質；螺旋式結構與「光・住・兒・愛・勝」只是講台記憶，不取代學術分法——本講義的全卷立場之七。文體決定讀法：當書信讀，會找處境；當講章讀，會聽重複的節奏；當論文讀，會找大綱。約翰一書最常被讀壞的方式，是硬套一個直線大綱，把螺旋的重複當作囉嗦，或把每一個「從此就知道」都當作考題。這一題要誠實地講結構，也誠實地說本講義的五字只是記憶工具。","pos":[["【一】經文問的是甚麼","","<p>一般的新約書信，開頭有「某某寫信給某某，願恩惠平安歸與你們」，結尾有問安與祝福。約翰一書兩樣都沒有：它一開口就是「論到從起初原有的生命之道」（1:1），結尾是「小子們哪，你們要自守，遠避偶像！」（5:21），然後就停了。可是它又不是一篇與讀者無關的論文：作者一再說他「寫給你們」（2:1、7、12--14、21、26；5:13），稱讀者「小子們」「親愛的弟兄」，也知道他們經歷了甚麼（2:19）。2:12--14 更是一段有節奏的修辭：「小子們哪……父老啊……少年人哪」（2:12--13），三組稱呼重複兩次，像在講台上對會眾一排一排地說話。<strong>經文問的是：這是一封信、一篇講章，還是一份勸勉文？它的結構是甚麼？</strong></p>"],["書信說（通函）：寫給一群教會的牧養信","","<p>許多學者認為它是一封通函——寫給亞細亞一帶幾間家庭教會、由人帶去各處宣讀的信；因為收信的對象不只一處，所以省略了個別的問安。它有書信最重要的特徵：明確的寫信人與讀者關係、具體的處境（2:19、26），以及「寫給你們」的反覆聲明。約貳、約參都有正常的書信格式，顯示作者會寫一般的信；約翰一書可能是較正式、要在各處宣讀的那一封。</p><p><strong>難處：</strong>一封信完全沒有寫信人、收信人、問安與結尾祝福，在新約與當時的書信裡都很少見；以弗所書雖常被認為是通函，至少還有開頭與結尾。「通函」也只是推測。</p>"],["講章說：一篇寫下來的講道","","<p>有人認為約翰一書是一篇講章，或是作者在各教會講過的信息的書面版。理由是：它像講道一樣重複、迴旋，同一主題講了又講；它的口吻像牧者對會眾直接說話；希伯來書也自稱是「勸勉的話」（來 13:22），同樣近乎講章。這一讀幫助我們聽見它的聲音——不是給人拆解分析的，是給人聽、給人回應的。</p><p><strong>難處：</strong>作者明明一再說「寫」，不是「說」；講章通常不會這麼強調「我將這些話寫給你們」（2:1）。而且它對讀者的處境有具體掌握，不像一篇可以在任何地方講的道。</p>"],["勸勉文／論文說：一份為教會寫的教導文件","","<p>也有人把它歸為勸勉文或小論文：一份為了回應分裂、堅固信徒而寫的教導文件，可能附在約翰福音旁邊流傳，幫助人正確地讀福音書。1:1--4 與約 1:1--18 的序言相近，支持兩者成對。這一讀看重它的教導目的：「要叫你們知道」（5:13）。</p><p><strong>難處：</strong>它的語氣太溫暖、太個人，不像一般的論文；作者稱讀者「我小子們」（2:1），是父親對孩子說話，不是老師對學生授課。「論文」這個詞也容易讓人去找一個嚴密的大綱，偏偏約翰一書最不合這種讀法。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約翰一書是寫給一群熟悉的教會、可以被宣讀的牧養書信，帶著講章與勸勉的性質——三說各抓住它的一面。它的結構是螺旋式的；「光・住・兒・愛・勝」五字只是講台記憶，不取代學術分法。</strong>沒有問安，可能正因為它要在不同的家庭教會宣讀；但它一點也不冷淡——「我小子們哪」（2:1）比任何問安都親。</p><p>結構方面，學者大致有三種分法。<strong>兩段式：</strong>1:5--3:10 以「神就是光」為主，3:11--5:12 以「神就是愛」為主，前後加序言與結語。<strong>三段式：</strong>以生命的三種試驗——行義、彼此相愛、相信耶穌——為主題，各循環一次。<strong>螺旋式：</strong>不強分段落，光、愛、信三個主題每章都回來，一圈比一圈深。三種分法都有道理，也都承認約翰一書不是直線前進的。</p><p>本講義採螺旋式的讀法，用五個字為五章各標出最亮的一面：光（被看見，也被洗淨）、住（不再流浪）、兒（知道自己是誰的孩子）、愛（被愛的人開始會愛）、勝（靠所信的那一位勝過世界）。<strong>這五個字是為了講台與小組記得住，不是說約翰照這五個字分章；</strong>每一章裡其他主題的回聲也要講。同樣，2:12--14 的三組稱呼，可以讓 321 在末端認出屬靈成長的不同階段，但那是講台的應用，不是這段經文的定義。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。一卷書是書信還是講章、分兩段還是三段，學者各有理由；神的話不會因為我們分錯段落而失去能力。</p><p>倒是約翰一書的寫法，可以安慰一種人：讀不懂大綱、記不住重點、覺得自己讀經沒有系統的人。約翰自己就是一圈一圈地講，同一件事講很多次——因為人需要被提醒很多次。你今天讀到「神就是愛」（4:8），明天又讀到，下個月還讀到；這不是重複，是一位父親在孩子耳邊一再地說。你只要一直聽下去。</p>"]],"con":[],"say":"本講義的立場：約翰一書是寫給一群熟悉的教會、可被宣讀的牧養書信，帶著講章與勸勉的性質；沒有問安，不減它的親切。結構採螺旋式讀法——光、愛、信每章回來；「光・住・兒・愛・勝」只是講台記憶，不取代兩段式、三段式等學術分法。","care":"席上有喜歡畫大綱、讀到約翰一書就覺得「怎麼一直重複」而卡住的弟兄；也有識字不多、讀經跟不上進度、覺得自己不夠屬靈的長輩。不要把五字講成約翰自己的大綱，也不要把結構講成讀經的門檻。告訴他們：約翰一圈一圈地講，是因為我們需要一再聽見；能記住一句「神就是愛」（4:8），就已經抓住這封信的心。"},{"id":"ISS00_8","t":"約翰一、二、三書是甚麼關係？","r":"2:18--19；4:1--3","ch":[],"why":"八、約翰一、二、三書出自同一位長老，是同一場分裂的三個面向：約壹對群體講真理與愛，約貳警告一間教會不要接待否認基督肉身的人，約參鼓勵接待忠心的同工——本講義的全卷立場之八。三封信常被分開讀，結果約壹被讀成只講愛，約貳被讀成只講拒絕，約參被讀成教會的人事糾紛。合起來讀，才看得見一位牧者怎樣在真理與愛之間拿捏：對假教訓有界線，對同工有接待。約貳、約參本講義尚未製作，這裡只標出處。","pos":[["【一】經文問的是甚麼","","<p>三封信在新約裡排在一起，傳統上都歸給約翰。約貳、約參的作者自稱「作長老的」：「作長老的寫信給蒙揀選的太太」（約貳 1:1）；「作長老的寫信給親愛的該猶」（約參 1:1）。約貳的關鍵句幾乎重複約壹：「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的」（約貳 1:7），對照「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）與「世上有許多假先知已經出來了」（4:1）。約參則講到教會裡有一位「好為首的丟特腓不接待我們」（約參 1:9）。<strong>經文問的是：這三封信是同一個人寫的嗎？它們之間有甚麼關係？先後怎樣？</strong></p>"],["同一作者、同一場危機說：三封信是一組","","<p>這是傳統與多數福音派學者的看法：三封信出自同一位作者（本講義認為是使徒約翰，見 〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉），背景是同一場分裂。約壹是寫給一群教會的牧養書信，處理分裂後的教義與確據；約貳寫給一間教會——「蒙揀選的太太」很可能是對教會的稱呼，和合本小字也註明「或譯：教會」——警告巡迴的假教師；約參寫給一位弟兄，處理接待真教師的問題。三封信的用字、思路、語氣高度一致：真理、愛、遵行命令、從起初、喜樂滿足（約貳 1:12）。</p><p><strong>難處：</strong>約壹沒有自稱長老，約貳、約參也沒有提到約壹，三封信的關聯主要靠內容推論。約參完全沒有提到假教訓，丟特腓的問題可能只是權力與接待，未必與同一場分裂有關。</p>"],["不同作者說：長老與使徒是不同的人","","<p>有學者根據帕皮亞的記載，認為約貳、約參出自「長老約翰」，約壹則可能出自另一位，或同一群體裡的另一人。早期教會接納約貳、約參也比約壹慢，有些教父只引用約壹。這一說提醒我們，不要把三封信的關係講得過於確定。</p><p><strong>難處：</strong>三封信的文字與思想太接近，尤其約貳 1:7 與約壹 4:2--3 幾乎是同一句話，最簡單的解釋就是同一位作者。約貳、約參篇幅短、內容私人，流傳較慢是自然的，不一定表示作者不同。</p>"],["先後次序各說：約壹在前，或約貳、約參在前","","<p>多數人照正典次序讀：約壹先寫，處理大局；約貳、約參隨後，處理具體的教會。也有人主張約貳、約參在前——約貳先簡短提醒，後來問題擴大，才寫了詳盡的約壹；或主張約參在前，丟特腓的抗拒是分裂的前奏。</p><p><strong>難處：</strong>每一種次序都能說出一個合理的故事，但都缺少直接證據。約貳的結尾說「我還有許多事要寫給你們，卻不願意用紙墨寫出來」（約貳 1:12），既可以讀成「詳細的以後再說」，也可能只是當時書信結尾的慣用語。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約翰一、二、三書出自同一位長老——本講義認為就是使徒約翰——是同一場分裂的三個面向；先後次序不作定論。</strong></p><p>三封信合起來，是一幅很完整的牧養圖畫。<strong>約壹</strong>對整個群體說：你們要知道自己是誰、信的是誰，要彼此相愛，也要試驗諸靈（4:1--3）。<strong>約貳</strong>對一間教會說：愛要在真理裡；巡迴的人若不傳基督的教訓，不要接他到家裡（約貳 1:10）——這是約翰自己為愛畫的界線（見 〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。<strong>約參</strong>對一位忠心的弟兄說：要接待為主名出外的同工；也點出一位好為首、不接待人的領袖（約參 1:9）——驕傲不只在假教師身上，也可能在教會的領袖身上。</p><p>所以約翰的愛有兩隻手：一隻手對假教訓說「不」，一隻手對忠心的同工打開門。只讀約壹，會以為愛沒有界線；只讀約貳，會以為信仰就是關門；只讀約參，會以為那只是人事問題。本講義在約壹各章碰到這些關聯時，只標約貳、約參的出處，等這兩卷製作時再詳講；三封信一起讀時，請記得約翰的次序：先是真理裡的相交，然後才是門該開或該關的判斷。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三封信是誰寫的、誰先誰後，不影響它們一起見證的那一位：成了肉身來的耶穌基督。</p><p>但三封信合讀，可以幫助你處理一個很實際的問題：<strong>我對人的接納，界線在哪裡？</strong>約翰教我們，接待人是愛，拒絕假教訓也是愛；向忠心的同工敞開門，向操控人、否認基督的教訓說不。你不必在「全都接納」與「全都拒絕」之間二選一；你可以像那位老長老一樣，在真理裡愛人。</p>"]],"con":[],"say":"本講義的立場：約翰一、二、三書出自同一位長老（本講義認為是使徒約翰），是同一場分裂的三個面向——約壹堅固群體，約貳為愛畫出真理的界線，約參鼓勵接待忠心的同工；先後次序不作定論。約貳、約參尚未製作，本卷只標出處。","care":"席上有人曾因為教會「不接待」而被冷落，也有人因為甚麼人都接待，家裡被假教師或傳銷式的團體鑽了空子。不要用約貳 1:10 叫人對未信的家人、對有疑問的慕道友關門——約翰說的是傳假教訓、否認基督的巡迴教師。也不要拿約參 1:9 在講台上影射某位同工。讓會眾看見一位既有原則、又有溫度的牧者。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"5:13；4:19；3:20","ch":[],"why":"九、宗派與學術之爭不該動搖一個人的信心；但「我知道自己有永生嗎」該問——答案在神的兒子，不在自己的表現——本講義的全卷立場之九。前面八條談了作者、罪與確據、挽回祭、愛與界線、敵基督、年代、文體、三書關係，每一條都有並陳的立場。有人讀完覺得踏實，也有人會想：原來連這些都有爭議，那我還能信甚麼？約翰一書是一封要人「知道」的信，這一題要把所有議題收回到它的終點：確據。","pos":[["【一】經文問的是甚麼","","<p>約翰一書的寫作目的寫得很清楚：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。約翰福音叫人信：「但記這些事要叫你們信耶穌是基督，是神的兒子」（約 20:31）；約翰一書叫信的人知道。可是同一封信又充滿了試驗：「我們若遵守他的誡命，就曉得是認識他」（2:3）；「我們因為愛弟兄，就曉得是已經出死入生了」（3:14）。再加上學者之間的種種爭議，一個認真的信徒會問兩個問題：<strong>這些我不懂的爭議，會不會讓我的信心站不住？那些「從此就知道」的試驗，是要讓我安心，還是要讓我一直檢查自己？</strong></p>"],["先解決再相信說：信心要等問題都弄清楚","","<p>有些理性傾向強的人認為：作者、年代、經文、解釋上的爭議若沒有解決，信心就沒有根據；所以要先研究清楚，才能真正相信。這一說的優點是認真，不願意盲信，也合乎約翰重視見證的精神——他說的是「我們所聽見、所看見」（1:1）的事。</p><p><strong>難處：</strong>這些爭議有許多已經談了上千年，等它們全部解決，一輩子也信不了。而且信心本來就不建立在所有問題都有答案，而建立在可信的見證與那位被見證的主。約翰沒有說等你弄懂了，就知道有永生；他說「人有了神的兒子就有生命」（5:12）。</p>"],["教義無所謂說：只要有愛，信甚麼都一樣","","<p>另一個極端是：教義太複雜、太會分裂人，乾脆都不要談；只要彼此相愛就好，信甚麼都一樣。這一說看重約翰一書的愛，也厭倦了教會裡為教義爭吵帶來的傷。</p><p><strong>難處：</strong>約翰一書正是一封為了教義而寫的信：「凡不認子的，就沒有父」（2:23）；「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）。約翰的愛不是放棄真理的愛——4:2 與 4:7 在同一章裡。把教義全丟掉，最後連「神就是愛」（4:8）是甚麼意思都說不清楚。</p>"],["核心與次要之分說：守住核心，次要的謙卑並陳","","<p>這是本講義九條全卷立場一路採用的作法：分清楚哪些是信仰的核心，哪些是可以並陳的次要問題。核心是約翰自己標出來的：耶穌是基督、是神的兒子、是成了肉身來的（2:22；4:2；5:1、5）；神差他的兒子作了挽回祭（4:10）；信他的人有永生（5:12--13）。作者是哪一位約翰、年代早晚、文體怎麼分、挽回祭的兩面怎麼平衡、救贖範圍怎麼表述、那敵基督的是一人還是一靈——敬虔的信徒可以有不同看法，仍然彼此相交。</p><p><strong>難處：</strong>「核心」與「次要」的界線本身也會有爭議，有人會覺得某些次要問題其實很重要。這一說需要謙卑：承認自己的立場可能有盲點，也願意與不同傳統的弟兄姊妹同坐一桌。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：宗派與學術之爭不該動搖一個人的信心；但「我知道自己有永生嗎」該問——答案在神的兒子，不在自己的表現。</strong></p><p>約翰一書的試驗，是給人「知道」的，不是給人「害怕」的。它們像身體檢查，不像審判庭：遵守命令、彼此相愛、相信耶穌，是生命的記號，不是買門票的錢。所以約翰在一連串試驗中間，放了一句很重要的話：「我們的心若責備我們，神比我們的心大，一切事沒有不知道的」（3:20）。當你的心一直告你、說你不夠好的時候，約翰不是叫你更用力地檢查自己，而是叫你抬頭看那位比你的心更大的神。</p><p>確據的根在 4:19：「我們愛，因為神先愛我們」（4:19）。先愛的是他；我們的愛、我們的順服、我們的確據，都是回應。確據的根也在 5:11--12：「這見證就是神賜給我們永生；這永生也是在他兒子裡面。人有了神的兒子就有生命」（5:11--12）。永生在他兒子裡面，不在我的表現裡面。所以這一題的回答很簡單：<strong>你有神的兒子嗎？</strong>你是不是信他、靠他、向他認罪、願意跟隨他？如果是，你可以知道。</p><p>這也是 321 在末端認出的焦點轉移：從看自己，轉向看耶穌。讀完約翰一書，若你更確知自己被愛、更願意去愛人，就是讀對了。</p>"],["【四】這件事該不該影響你的信心","","<p>宗派之爭不該，學術之爭不該，講台上立場的不同也不該。你不必站在哪一派，才算真的信；你也不必解決每一條爭議，才可以安心。</p><p>但如果你心裡有一個問題已經藏了很久——我真的得救了嗎？——請不要把它壓下去，也不要一個人反覆咀嚼。這個問題約翰是歡迎的，他整封信就是為這個問題寫的。把它帶到神面前，也帶到一位可信的牧者或弟兄姊妹面前。答案不在你昨天表現得怎麼樣，而在那一位「為我們的罪作了挽回祭」（2:2）的主身上。看著他，你可以知道。</p>"]],"con":[],"say":"本講義的立場：作者、年代、文體與各家解釋之爭不該動搖一個人的信心；核心守住，次要的謙卑並陳。但「我知道自己有永生嗎」該問——答案在神的兒子，不在自己的表現（5:12--13）；心若責備我們，神比我們的心大（3:20）。","care":"席上有剛信主、一聽到「學者有爭議」就慌了的慕道友；也有信主幾十年、卻每晚睡前問自己「我真的得救了嗎」的長輩；還有因強迫思想或憂鬱，總覺得自己被神丟棄的人。不要拿約翰一書的試驗逼人一條一條檢查自己，也不要說「懷疑就是信心不夠」。陪他讀 3:20 與 5:13，必要時陪他尋求輔導與醫療；讓他知道，問這個問題的人，約翰正在等他。"},{"id":"ISS01_1","t":"1:1「親手摸過」——本卷要對付的錯誤是甚麼？","r":"1:1--3；4:2--3；5:6","ch":[1],"why":"約翰一開口就說「親眼看過、親手摸過的」（1:1），語氣強得近乎固執。為甚麼？因為有人在說另一套耶穌。這一題決定我們怎樣讀全卷：若不知道約翰在對付甚麼，「人若說」容易被拿去審查任何不同意見的人；若知道了，就明白約翰守的是一件很具體的事——耶穌真有血肉。會受傷的，是那些被說成「信得不夠屬靈」的平凡信徒。","pos":[["【一】經文問的是甚麼","","<p>約翰沒有直接點名對手，我們只能從信中的線索推想。線索有三：①序言一再強調耳朵、眼睛、手（1:1--3）；②試驗諸靈的標準是「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）；③5:6 說耶穌基督「不是單用水，乃是用水又用血」（5:6）。再加上 2:19 說有人「從我們中間出去」（2:19），可見群體剛經歷分裂。</p><p><strong>經文問的是：那些出去的人，教導的是哪一種耶穌？為甚麼約翰非要強調「摸過」不可？</strong></p>"],["幻影說：耶穌只是看起來像人","","<p>幻影說（Docetism，來自希臘文「看起來」）認為神聖的不可能沾染物質，所以耶穌的身體只是表象，他沒有真的受苦、流血。第二世紀初的伊格那丟書信已經在反駁這種說法，可見它出現得很早。這一說最能解釋 1:1 為甚麼要說「親手摸過」：幻影摸不到。也能解釋 4:2 為甚麼要「成了肉身來的」。</p><p><strong>難處：</strong>成熟的幻影說是第二世紀的現象，約翰面對的多半只是它的早期萌芽；而且幻影說不太能解釋 5:6「用水又用血」為甚麼特別強調「血」，也不太能解釋信中那麼多關於罪與愛弟兄的爭論。</p>"],["克林妥說：基督在受洗時降下、受難前離開","","<p>照教會的傳統，愛任紐記載克林妥（Cerinthus）教導：耶穌是約瑟和馬利亞所生的普通人，在受洗時「基督」降在他身上，受難以前又離開了，所以受苦的只是人耶穌。相傳約翰在以弗所澡堂遇見克林妥，立刻起身離開。這一說最能解釋 5:6：對手接受「水」（受洗時基督降下），卻不接受「血」（基督也受了死）；也能解釋 2:22 為甚麼說「不認耶穌為基督」（2:22）。</p><p><strong>難處：</strong>澡堂故事是傳說，不能當成確定的史實；把信中每一句都對準克林妥，也容易過度重建，彷彿我們手上有一份對手的教義書。</p>"],["不必指名：一種「輕看肉身與行為」的趨勢","","<p>第三種讀法認為，與其給對手一個名字，不如描述他們的趨勢：屬靈地看輕基督的肉身，也屬靈地看輕自己的行為。他們自稱與神相交、自稱無罪（參 1:6、8），卻不愛弟兄（2:9）。這一說的長處是把基督論和倫理連在一起：不在乎耶穌身體的人，也不太在乎弟兄的身體——饑餓、缺乏（3:17）。</p><p><strong>難處：</strong>描述得太一般，會失去歷史的稜角，讀者可能以為約翰只是在講普遍的道德提醒。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約翰對付的是一種否認耶穌基督真有血肉、真實受死的教導；幻影說與克林妥說都屬於這個方向，可以並陳，不必鎖定其中一個。</strong>標準是約翰給的基督論：認耶穌基督是成了肉身來的（4:2）。</p><p>這有兩個講台上的後果。第一，「人若說」不是讓我們給今天任何不同意見的人貼「異端」標籤；分辨的標準很窄，也很清楚，就是基督論（全卷的分辨原則見 〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉）。第二，基督的肉身不是學術問題：「他兒子耶穌的血也洗淨我們一切的罪」（1:7），一個只是看起來像人的耶穌，不會流血，也不能洗淨。</p>"],["【四】這件事該不該影響你的信心","","<p>對手到底叫甚麼名字，學者會一直討論下去，這不該動搖你的信心。約翰不是要你記住一個異端的名字，是要你知道：你信的那一位，是真的被人聽見、看見、摸過的。</p><p>灰心的日子，感覺會退潮；但信仰從來不是建立在感覺上，是建立在一位有手有腳、為你流過血的主身上。這件事該影響你的，不是懷疑，而是踏實。</p>"]],"con":[],"say":"本講義的立場：約翰對付的是否認耶穌基督真有血肉、真實受死的教導；幻影說與克林妥說並陳，不必鎖定。標準是基督論（4:2），不是給今天不同意見的人貼標籤。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉","care":"席上會有人聽到「異端」就緊張，怕自己哪一句信錯了；也會有人喜歡拿這段去批評別的教會。對前者要說：約翰的標準很清楚，你若承認耶穌是成了肉身來的、為你流血的主，你就站在約翰這一邊。對後者要溫柔提醒：三次「若說」的主詞是「我們」。還有些人信主多年從未有過特別的經歷，要讓他知道，你的信建立在見證人摸過的事實上，不是建立在你摸到了甚麼。"},{"id":"ISS01_2","t":"1:1 作者是誰？「我們」是誰？","r":"1:1--4；約 21:24","ch":[1],"why":"1:1--4 的「我們」出現了十幾次：我們所聽見、所看見、我們傳、我們寫。這個「我們」是誰，牽涉到這封信的權威從哪裡來：如果是目擊者，這封信就是第一手見證；如果只是後來的群體，信的份量似乎就不同了。這一題也牽動今天的信徒：我們沒有摸過主，能不能也站進這個「我們」？讀錯了，有人會覺得自己的信仰永遠是二手的。","pos":[["【一】經文問的是甚麼","","<p>這封信沒有署名，沒有問安。作者用「我們」開口：「就是我們所聽見、所看見、親眼看過、親手摸過的」（1:1）；「我們將所看見、所聽見的傳給你們」（1:3）。可是到了 2:1 他又改用單數：「我小子們哪，我將這些話寫給你們」（2:1）。約翰福音末了也有類似的轉換：「為這些事作見證，並且記載這些事的就是這門徒；我們也知道他的見證是真的」（約 21:24）。</p><p><strong>經文問的是：作者是誰？序言的「我們」是一群目擊者，是作者自稱，還是整個群體？</strong></p>"],["見證人群體說：「我們」是親眼見過主的使徒一群","","<p>這一說認為，「我們」指耶穌在世時跟隨他的一群見證人，作者是其中一位，代表這群人說話。證據是感官動詞的具體——聽見、看見、親眼看過、親手摸過——以及 1:3 「我們」與「你們」的清楚對照：見證人把看見的傳給沒看見的人。教會早期的傳統一致認為作者是使徒約翰。</p><p><strong>難處：</strong>信寫成時，十二使徒多半已經不在了；「我們」若只指一群目擊者，作者寫信時恐怕是這群人中僅存的少數。這一說要承認：「我們」的範圍比字面看起來更窄。</p>"],["作者自稱說：「我們」是約翰的鄭重自稱","","<p>這一說認為「我們」是一種帶權威的自稱，像今天的人在正式場合說「我們認為」。2:1 起改用單數「我」，正說明是同一個人。這一說的長處是與 2:1 以後的語氣一致，也解釋了為甚麼序言的「我們」那麼篤定。</p><p><strong>難處：</strong>1:1 的感官動詞太具體，不太像修辭上的自稱；而且 1:3 明明把「我們」與「你們」分開，若只是作者一人，那句「使你們與我們相交」就有點奇怪。</p>"],["約翰群體說：「我們」是傳承約翰見證的群體","","<p>有學者認為，這封信出自一個傳承使徒約翰教導的群體，「我們」是這個群體，包括可能的長老約翰（照教會的傳統，帕皮亞曾提到一位「長老約翰」）。這一說的長處是說明約翰福音與書信的共同語言與共同記憶。</p><p><strong>難處：</strong>若「我們」只是後來沒有見過主的群體，1:1「親手摸過」就失去它在信中的分量，而那正是約翰要對付錯誤的關鍵證據；這樣讀，序言的論證就斷了。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒約翰，沿用約翰福音講義的判斷；長老約翰說、約翰群體說並陳。</strong>序言的「我們」，最自然的讀法是以作者為核心的見證人群體：他親眼見過主，也代表那一群見證人說話；2:1 改用單數，是他以屬靈父親的身分轉向「小子們」。</p><p>這個「我們」是敞開的。1:3 說得很清楚：傳給你們，是要「使你們與我們相交」——後來沒有摸過主的人，可以和摸過他的人坐在同一張桌子旁。見證人的「我們」是一扇門，不是一道牆。</p>"],["【四】這件事該不該影響你的信心","","<p>作者是誰，教會兩千年來大多相信是使徒約翰，學者仍有不同看法；但這封信被教會接納為正典，不是因為我們百分之百知道筆跡，是因為它所見證的基督與四福音、與使徒的信息一致。</p><p>真正該影響你的，是 1:3 的那扇門：你沒有摸過主，但你被邀請進入那些摸過主的人的相交裡。你的信不是二手的，是被帶進同一個生命裡的。</p>"]],"con":[],"say":"本講義的立場：作者是使徒約翰；「我們」以作者為核心，指親眼見過主的見證人，2:1 起他以屬靈父親的身分改用單數。這個「我們」是敞開的，1:3 邀請後來的人一同相交。本講義的全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉","care":"席上會有人讀過一些網路文章，說「聖經作者都是後人假託的」，心裡默默不安。不要嘲笑他的疑問，也不要用權威壓下去；陪他看見，教會接受這封信，憑的是它所見證的基督。也會有人覺得自己離耶穌太遠，信仰都是聽來的。告訴他：1:3 就是為你寫的，你被邀請坐到摸過主的人的桌子旁。"},{"id":"ISS01_3","t":"1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？","r":"1:3；1:7；來 10:25","ch":[1],"why":"約翰寫信的目的是「使你們與我們相交」（1:3）。今天許多基督徒——特別是國度321空中團契散在各國的弟兄姊妹——大部分的聚會在螢幕上。有人因此被說成「沒有真正的教會生活」，心裡受傷；也有人以為看直播就算有了相交，其實多年沒有人叫得出他的名字。這一題要公平回答，因為兩邊都有真實的人，而且都坐在我們的會眾席上。","pos":[["【一】經文問的是甚麼","","<p>1:3 有兩層相交：「使你們與我們相交」，以及「我們乃是與父並他兒子耶穌基督相交的」（1:3）。κοινωνία 的核心是共同擁有，一同有分於同一個生命；1:7 又說，在光明中行的人「就彼此相交」（1:7）。希伯來書則提醒：「你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉」（來 10:25）。</p><p><strong>經文問的是兩件事：與神相交和與人相交，哪一個先？以及在今天的處境裡，只在網路上聚會，算不算這樣的相交？</strong></p>"],["與神相交為先：彼此相交是果子","","<p>這一說看重 1:3 下半句的強調：「我們乃是與父並他兒子」。真正的根是與父和子的相交，人與人的相交是從這個根長出來的果子。這一說的長處是不讓團契變成俱樂部，不讓熱鬧取代神。</p><p><strong>難處：</strong>講過了頭，會變成「我有神就夠了，不需要教會」。約翰的次序其實是先說「與我們」，而且 1:7 說光裡最先發生的是「彼此相交」；與神的相交從來不是一個人的事。</p>"],["與人相交為先：經過見證人的群體才進入與神相交","","<p>這一說看重文法次序：先「與我們」，再「與父並子」。後來的人是經過使徒的見證、在群體裡，才被帶進與神的相交；沒有脫離群體的獨自屬靈。這一說的長處是嚴肅看待教會。</p><p><strong>難處：</strong>講過了頭，會讓某一個群體壟斷通往神的門：「離開我們，就失去與神的相交」——這正是本卷要小心的控制（2:19 是給留下的人的安慰，不是用來論斷離開的人）。</p>"],["網上聚會不算相交：相交需要身體同在","","<p>有人認為，道成肉身的信仰需要肉身的同在：擘餅、按手、擁抱、探訪，都不是螢幕可以取代的。1:1 強調「親手摸過」，似乎也支持這一點；約翰自己也說「盼望到你們那裡，與你們當面談論」（約貳 1:12）。這一說的長處是提醒我們身體的重要。</p><p><strong>難處：</strong>約翰說這句話的地方，正是一封信——他自己正在隔著距離用文字建立相交，保羅也說「我身子雖與你們相離，心卻與你們同在」（西 2:5）。把網上聚會一律說成不算數，等於說臥病的長輩、輪班的工人、移居異鄉的人、在教會受過傷暫時不敢走進禮堂的人，都在相交之外；這不是約翰的心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：源頭是父與子，入口是見證人的信息，形狀是彼此相交；三者是同一個相交，不是先後兩件事。網上聚會可以是真實的相交，但不等於相交的全部。</strong></p><p>判斷相交的，不是有沒有在同一個房間，而是 κοινωνία 有沒有發生：有沒有一同有分於基督，有沒有人叫得出你的名字、知道你的近況、在你難處裡伸出手。照這個標準，一個用心的線上小組，可能比一個坐了十年卻沒有人認識你的實體會堂更像相交；一個只看直播、從不出聲的人，也可能只是觀眾。</p><p>所以國度321空中團契要刻意建構相交，而不是只提供聚會：①小組不宜太大，每個人都被叫得出名字、輪流開口；②每位組員配一位固定的禱告同伴，每週私下聯絡一次；③定期一起擘餅、守聖餐，照所屬教會的傳統安排；④同一城市的弟兄姊妹，一年至少實體相聚幾次；⑤有人生病、喪親、失業時，附近的人能真的出現在門口，遠方的人能具體地代禱、奉獻、陪伴。螢幕是一條路，不是終點。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你此刻只能在網上聚會，不必覺得自己是次等的基督徒；與父並子的相交不受網速限制，你在螢幕這端真實的禱告、真實的分享，神都看重。</p><p>但可以問自己兩個問題：<strong>這一週，有沒有一位弟兄姊妹叫得出我的名字、知道我的難處？</strong><strong>在我能見面的範圍裡，我是不是刻意在躲？</strong>相交不是一種形式，是一種被認識、也去認識別人的生活。</p>"]],"con":[],"say":"本講義的立場：相交的源頭是父與子，入口是見證人的信息，形狀是彼此相交，三者同一個相交。網上聚會可以是真實的相交，但不等於全部；要刻意建構：叫得出名字的小組、固定的禱告同伴、擘餅、實體相聚與具體的扶持。","care":"席上有臥病的長輩、照顧失智父母走不開的人、輪夜班的護理師，網上聚會是他們僅有的教會；不要讓他們聽見自己「不算數」。也有人躲在螢幕後很久，鏡頭從不打開，名字從沒被叫過；溫柔地去找他，不是責備他不來。還有在實體教會受過傷的人，網上是他回來的第一步，請保護這一步，不要催他。"},{"id":"ISS01_4","t":"1:4 是「你們的」還是「我們的」喜樂充足？","r":"1:4；約 15:11；約 16:24","ch":[1],"why":"和合本 1:4 在「你們」旁邊註著「有古卷：我們」。細心的讀者會問：聖經不是一字不差的嗎？為甚麼會有不同的抄本？這一題看起來是抄本學的小事，卻碰到兩件大事：一是我們怎樣面對經文異文而不失去信心；二是約翰寫信時心裡掛念的是誰的喜樂。會受影響的，是剛開始認真讀經、第一次發現異文而心裡動搖的人。","pos":[["【一】經文問的是甚麼","","<p>和合本作：「我們將這些話寫給你們，使你們（有古卷：我們）的喜樂充足」（1:4）。差別只在一個希臘字母：ἡμῶν（hēmōn）「我們的」與 ὑμῶν（hymōn）「你們的」。SBLGNT 與今天主要的校勘本作 ἡμῶν；部分抄本與公認經文（TR）作 ὑμῶν，KJV 的 your joy 依此；SBLGNT 異文附錄所列的 RP 在這一處沒有另列，表示它也作 ἡμῶν。附錄在本節另記一處：RP 作「寫給你們」，其他各家作「我們寫」。</p><p><strong>經文問的是：約翰原來寫的是誰的喜樂？這個差別會改變意思嗎？</strong></p>"],["「你們的」：順著上下文與福音書","","<p>主張「你們的」的人指出，上下文一直說「傳給你們」，寫信本來就是為了收信的人；耶穌在最後一晚也說「並叫你們的喜樂可以滿足」（約 15:11），又說「叫你們的喜樂可以滿足」（約 16:24）。約翰把主的話接過來，寫成「你們的喜樂」很自然。</p><p><strong>難處：</strong>正因為「你們的」那麼順，抄寫的人比較可能把「我們」改成「你們」，反過來改的動機少；而且支持「你們的」的抄本整體上較晚。</p>"],["「我們的」：較難的讀法常是原來的讀法","","<p>主張「我們的」的人指出，校勘上有一條常用的原則：較難、較不順的讀法往往是原來的，因為抄寫的人傾向把難讀的改順。「我們的喜樂」在這裡有點出人意料，卻有較早的抄本支持；今天主要的校勘本都採這個讀法。意思也很美：見證人的喜樂，要等收信的人進入相交才充足。約翰自己在約參 1:4 也說，聽見兒女們按真理而行，他的喜樂就沒有比這個大的。</p><p><strong>難處：</strong>「較難讀法」只是傾向，不是定律；有時抄寫的人也會改出較難的句子。這一說仍需要抄本的實際證據來撐。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採 ἡμῶν「我們的」。這是今天主要校勘本的讀法，SBLGNT 附錄所列的 RP 在這一處也作 ἡμῶν；ὑμῶν「你們的」是部分抄本與公認經文 TR、KJV 的讀法，和合本正文從之、並在旁註保留另一讀法。</strong></p><p>兩種讀法並不衝突，反而互相成全：父母做好一桌菜，孩子不回家，自己吃不算團圓；孩子回到桌前，大家的喜樂一起滿足。約翰的喜樂（我們的）要等讀者進入相交（你們的）才滿；而相交裡的喜樂，本來就是共同擁有的——這正是 κοινωνία 的意思。講台上照和合本讀「你們的」完全可以，講到這一處，可以順帶說出這份牧者的心。</p>"],["【四】這件事該不該影響你的信心","","<p>異文不該動搖你的信心。新約的抄本數量遠多於任何古代文獻，絕大部分異文像這一處一樣，是一個字母、一個字序的差別，沒有一處影響基本的信仰。和合本的譯者把另一讀法誠實地註在旁邊，正是對讀者的尊重。</p><p>這一節真正該影響你的，是約翰的心：他寫信不是為了贏辯論，是為了喜樂。如果你的信仰只剩下責任，可以從這一節重新開始——回到相交裡，讓喜樂被填滿。</p>"]],"con":[],"say":"本講義的立場：採 ἡμῶν「我們的」；ὑμῶν「你們的」是部分抄本與公認經文 TR、KJV 的讀法，SBLGNT 附錄所列 RP 這一處也作 ἡμῶν。兩讀互相成全：見證人的喜樂，要等讀者進入相交才充足；講台照和合本讀「你們的」也無妨。","care":"席上可能有一位剛開始讀原文或讀到網路文章的年輕人，發現「聖經有不同版本」而心裡動搖；不要閃躲，也不要誇大，陪他看見異文怎樣被誠實地處理。也可能有一位很盡責、卻很久沒有喜樂的同工，這一節要對他說：約翰寫信，是為了你的喜樂，也是為了他自己的喜樂。"},{"id":"ISS01_5","t":"1:5「神就是光」與 4:8「神就是愛」怎樣合看？","r":"1:5；4:8；4:16","ch":[1],"why":"約翰說「神就是光」（1:5），後來又說「神就是愛」（4:8）。有人把兩句對立起來：嚴厲的講台只講光，叫人害怕；溫柔的講台只講愛，叫人放心卻不悔改。也有人心裡默默以為，神有時是光、有時是愛，看心情。這一題會影響一個人怎樣靠近神：是戰戰兢兢地躲，還是隨隨便便地來。兩種都不是約翰要的；他要人既敢靠近，又願意被光照。","pos":[["【一】經文問的是甚麼","","<p>1:5 說：「神就是光，在他毫無黑暗」（1:5）。4:8 說：「沒有愛心的，就不認識神，因為神就是愛」（4:8），4:16 再說一次。兩處的句型相同，「光」和「愛」都沒有冠詞，說的是神的本性；約翰福音也說「神是個靈」（約 4:24）。</p><p><strong>經文問的是：同一位神「是光」又「是愛」，這兩句怎樣合在一起讀？會不會一句壓過另一句？</strong></p>"],["以光為主：神首先是聖潔的","","<p>這一說認為光指聖潔與公義，是神最根本的屬性；愛必須在聖潔的框架裡理解，不然就成了縱容。1:6 緊接著說「卻仍在黑暗裡行，就是說謊話」，可見光帶著道德的要求。這一說的長處是不讓恩典變成廉價。</p><p><strong>難處：</strong>講過了頭，會把神講成監視器，只看見光照出污點，看不見光裡還有彼此相交、還有血的洗淨（1:7）；已經很自責的人會更不敢靠近。</p>"],["以愛為主：光只是愛的一種表達","","<p>這一說認為愛是神的核心，光只是愛的表現方式：神照亮人，是因為他愛人。4:8 的「神就是愛」常被視為全本聖經最高的一句話。這一說的長處是讓受傷、自責的人敢回到神面前。</p><p><strong>難處：</strong>講過了頭，愛會被縮成「接納一切」，罪就不必面對；可是約翰說愛的時候，立刻說的是「差他的兒子為我們的罪作了挽回祭」（4:10）——沒有罪，就不需要挽回祭。愛若沒有光，連愛自己都說不清楚。</p>"],["光與愛是同一位神的兩面，彼此解釋","","<p>這一說認為兩句不分主次，互相定義：神的愛是聖潔的愛，所以不會縱容黑暗；神的光是救人的光，所以照出黑暗是為了洗淨。1:7 把兩者放在同一節裡：光照出罪，血洗淨罪。十字架就是光與愛相遇的地方——罪被嚴肅地審判，罪人被完全地愛。</p><p><strong>難處：</strong>這一說在講台上需要更多的說明，容易被簡化成「兩邊都要」的口號，失去兩句各自的鋒利。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：光與愛不是兩位神，也不是兩種輪流出現的性情；神的愛是聖潔的愛，神的光是為了救人而照。</strong>本卷是螺旋寫法，光、愛兩個主題每章都回來：第一章最亮的是光，到第四章最亮的是愛，但第一章的光裡已經有愛（洗淨、赦免），第四章的愛裡也還有光（挽回祭、在行為和誠實上）。</p><p>講台上的檢驗很簡單：講光的時候，有沒有講到 1:7 的血與 1:9 的信實？講愛的時候，有沒有講到 4:10 的挽回祭？光沒有愛會叫人躲，愛沒有光會叫人停在原地。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題不需要你先把神學釐清才能靠近神。你可以帶著兩個問題來：他看見了我的一切嗎？——看見了，他是光。他還要我嗎？——要，他是愛。這兩個答案是同一位神給的。</p><p>如果你一聽到「神是光」就緊張，好像要被抓包，請記得約翰接下去說的是洗淨與赦免。光照到你，是因為他要醫治你，不是要羞辱你。</p>"]],"con":[],"say":"本講義的立場：光與愛不是兩位神，也不是輪流出現的性情；神的愛是聖潔的愛，神的光是為了救人而照，十字架是兩者相遇之處。講光必講血與信實，講愛必講挽回祭。","care":"席上會有從小在嚴厲家庭或嚴厲教會長大的人，一聽到「神在看」就發抖；對他要多講 1:7 的洗淨與 1:9 的信實。也會有人長期把「神是愛」當成不必改變的理由；對他要溫柔而清楚地講 1:6。如果有人因過去的屬靈傷害而對「光」這個字有創傷反應，不要催他，陪他慢慢看見那光是溫暖的。"},{"id":"ISS01_6","t":"1:7「在光明中行」——是無罪完全，還是誠實透明？","r":"1:6--7；2:9--11","ch":[1],"why":"「在光明中行」（1:7）是本章最常被引用、也最常被講歪的一句。講成無罪完全，會讓所有還在跌倒的人覺得自己在黑暗裡；講成「甚麼都要公開」，又會讓小組變成審問室，讓有創傷的人被迫揭開不該被逼揭開的傷。這一題要找到經文本身的意思：不躲，而不是不跌。這會決定一個小組是安全的地方，還是表演的舞台。","pos":[["【一】經文問的是甚麼","","<p>1:6 與 1:7 是一組對照：「我們若說是與神相交，卻仍在黑暗裡行，就是說謊話」（1:6）；「我們若在光明中行，如同神在光明中，就彼此相交，他兒子耶穌的血也洗淨我們一切的罪」（1:7）。2:9--11 把它具體化：「人若說自己在光明中，卻恨他的弟兄，他到如今還是在黑暗裡」（2:9）；「愛弟兄的，就是住在光明中」（2:10）。</p><p><strong>經文問的是：在光明中行，是指不再犯罪，還是指一種誠實、不躲藏的生活？</strong></p>"],["無罪完全說：在光中就是不再犯罪","","<p>有些聖潔運動傳統把「在光明中行」理解為一種已經勝過罪的狀態：在光中的人不再故意犯罪，生活在完全的愛裡。這一說的長處是嚴肅對待約翰的倫理要求，不讓「在光中」只成為口號。</p><p><strong>難處：</strong>同一節說，在光明中行的人，耶穌的血「也洗淨我們一切的罪」——現在式，正在洗；若在光中就沒有罪，就不需要血了。下一節緊接著說「我們若說自己無罪，便是自欺」（1:8）。這一說會讓認真的人陷入失望，或者逼人把罪藏起來，以維持「在光中」的形象，正好走回黑暗。</p>"],["誠實透明說：在光中就是不再躲藏","","<p>這一說認為光的作用是顯明，在光中行就是讓神的光照到生命的每個角落，不再遮掩；這與 1:9 的「認」最接近，也與約 3:21「行真理的必來就光」相合。這一說的長處是給跌倒的人一條路：你不必先變乾淨，才配走進光裡。</p><p><strong>難處：</strong>講過了頭，會變成「透明就是甚麼都要說」，把在神面前的誠實，誤當成對所有人全盤公開；也容易只講態度，不講方向，好像只要誠實地承認，怎樣生活都無所謂。</p>"],["順從啟示說：照著神顯明的真理生活","","<p>這一說認為在光中行就是照著神所啟示的真理與誡命而活，2:9--11 把它具體化為愛弟兄。這一說的長處是把「光」拉回日常：不是一種感覺，是怎樣對待身邊的人。</p><p><strong>難處：</strong>若只講順從，容易滑回以行為衡量自己，忽略 1:7 的血與 1:9 的認罪；人會開始用表現證明自己在光中。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：誠實透明說與順從啟示說合讀。在光中行不是沒有罪，是不再躲；不躲的人會面對自己的罪，也會走向弟兄。</strong>證據就在 1:7：在光中行的人，仍然需要血正在潔淨；光裡最先發生的，是彼此相交。</p><p>還要補一句界線：在光中行是在神面前不躲，並在可信、安全的關係裡說真話，不是把每一件私事攤給所有人，也不是逼別人說他還沒準備好說的事。光中的相交會保守秘密；被侵害的人更不需要為別人的惡「在光中交代」，他需要的是保護與陪伴。光是溫暖的燈，不是審問的探照燈。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你還會跌倒，不要因此以為自己在黑暗裡。問題不是你有沒有罪，而是你有沒有在躲。你可以帶著還沒洗淨的部分走進光裡，血正在那裡等著洗淨你。</p><p>可以從一個安全的人開始：一位可信的屬靈同伴，或小組裡一個能保守秘密的人。在那裡說真話，你會發現光裡不只有被看見，還有被接納。</p>"]],"con":[],"say":"本講義的立場：在光中行不是無罪完全，是不再躲藏，並照著神顯明的真理走向弟兄；在光中的人仍需要血正在洗淨（1:7）。誠實透明有界線：在神面前不躲，在安全的關係裡說真話，不是全盤公開。","care":"席上有人很想變好，卻一次次跌倒，以為自己永遠走不進光；要讓他聽見，光是為他開的。也有小組長以為「透明」就是要組員把事情說清楚；要提醒他，保守秘密、不逼問，才是光中相交。有受過性侵、家暴的人，不可要求他在小組裡交代細節；陪他找到安全的人與專業協助。"},{"id":"ISS01_7","t":"1:8--10 與 3:6--9——基督徒還會犯罪嗎？","r":"1:8--10；3:6--9；2:1","ch":[1],"why":"這是全卷最容易傷人的一題。同一封信說「我們若說自己無罪，便是自欺」（1:8），又說「凡從神生的，就不犯罪」（3:9）。講錯了，一邊會讓掙扎中的信徒懷疑自己沒有得救，另一邊會讓刻意不悔改的人拿 1:8 當擋箭牌。這兩種人都坐在會眾席上，所以這一題必須講得準，也必須讀到 2:1 的中保，免得一節經文被拿去傷害另一種人。","pos":[["【一】經文問的是甚麼","","<p>1:8--10 連用兩次「若說」，堵住人說自己無罪、沒有犯過罪的退路；中間是「我們若認自己的罪」（1:9）。可是 3:6 說「凡住在他裡面的，就不犯罪」（3:6），3:9 甚至說「他也不能犯罪，因為他是由神生的」（3:9）。夾在兩者之間的是 2:1：「我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。</p><p><strong>經文問的是：基督徒還會犯罪嗎？如果會，3:9 是甚麼意思？</strong></p>"],["現在式持續說","","<p>3:6、9 的動詞是現在式，指習慣性、持續地活在罪中；1:8--10 說的是個別的罪。所以基督徒會跌倒，但不會以罪為生活的常態。這是華人教會最常聽到的解釋，長處是清楚好講。</p><p><strong>難處：</strong>希臘文現在式不一定帶「持續」的意思，1:8 的「有罪」本身也是現在式；把整個解釋壓在時態上，文法撐不太住。</p>"],["兩種罪說","","<p>3:9 說的是某一種罪——例如 5:16「至於死的罪」，或故意背道、否認基督——從神生的人不會犯這一種；1:8 說的是一般的過犯。這一說的長處是讓兩處各有所指。</p><p><strong>難處：</strong>3:9 的上下文沒有這樣限定；而且講台上一旦開始分「哪一種罪」，很容易讓人陷入「我犯的是不是那一種」的恐懼。</p>"],["身分與方向說","","<p>從神生的人，生命的方向已經改變，罪不再是他的歸屬；1:8 防的是驕傲（以為自己不需要恩典），3:9 防的是放縱（以為行為無關緊要）。這一說的長處是兩邊都照顧到，也與 2:1 的「方向是不犯罪，跌倒時有中保」最吻合。</p><p><strong>難處：</strong>仍要解釋 3:9「不能犯罪」這樣強的說法，不能只說「大方向」就帶過。</p>"],["針對假教師說","","<p>1:8 對付自稱已經無罪的人，3:6--9 對付說行為無關緊要的人，兩處對準不同的錯誤，所以說法不同。這一說的長處是重視書信處境。</p><p><strong>難處：</strong>對手的面貌只能從信中推想；而且即使對手不同，約翰的話仍是寫給「我們」的，不能只當成對別人說的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：以身分與方向說為主，現在式持續說與針對假教師說可以補充。落點在 2:1：方向是不犯罪，跌倒時有中保。</strong>兩句都要講，少一句都會傷人：只講 3:9，掙扎的人會絕望；只講 1:8，刻意不悔改的人會安心。講 3:9 必同時講 2:1。</p><p>基督徒還會犯罪嗎？會。這不是藉口，是誠實；所以 1:9 的認罪是神兒女一再回家的路。刻意、持續地不肯悔改，在 1:8 找不到掩護。完整的四說並陳見全卷立場 〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你今天正為自己的罪難過，這份難過本身就說明真理在你裡面作工；真正自欺的人，是看不見的。不要用 3:9 審判自己，先讀 2:1：在父那裡，你有一位中保。</p><p>如果你今天心裡很平靜，卻知道有一件事一直不肯放下，這一題也是寫給你的：1:8 不是讓你安心留在那裡的地方，1:9 的門現在就開著。</p>"]],"con":[],"say":"本講義的立場：以身分與方向說為主，現在式持續說、針對假教師說補充；方向是不犯罪，跌倒時有中保（2:1）。不用 3:9 讓掙扎者失去確據，也不用 1:8 合理化不悔改。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉","care":"席上一定有人帶著得救的焦慮來：一位多年與色情、賭博或憤怒搏鬥的弟兄，一位有強迫思想、反覆懷疑自己的姊妹。不要對他說「真基督徒不會這樣」，陪他讀 2:1，必要時轉介輔導與專業協助。也有人把「人人都有罪」當成不必改的理由；對他要溫柔而誠實地說，1:8 是走向 1:9 的路，不是停車場。"},{"id":"ISS01_8","t":"1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？","r":"1:9；雅 5:16；詩 32:5","ch":[1],"why":"華人教會對認罪有兩種極端的經驗：有人信主多年從不認罪，覺得那是初信的事；有人被要求在小組、甚至台上把隱私交代清楚，才算「真悔改」，從此再也不敢說真話。還有人背負著「不向牧者交代就沒被赦免」的恐懼。這一題要說清楚：向誰認，為甚麼認，界線在哪裡，免得認罪從回家的路變成新的枷鎖。","pos":[["【一】經文問的是甚麼","","<p>1:9 說：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義」（1:9）。「認」的動詞是現在式，寫給已經信主的「我們」。雅各書說：「所以你們要彼此認罪，互相代求，使你們可以得醫治」（雅 5:16）。詩篇說：「我向你陳明我的罪，不隱瞞我的惡」（詩 32:5）。</p><p><strong>經文問的是兩件事：已經被稱義的人，為甚麼還要認罪？認罪的對象是神，還是也必須向人？</strong></p>"],["只需向神認：已得救的人認罪是恢復相交","","<p>這一說認為，赦罪的是神，1:9 的對象是神，因為「他是信實的」。信徒在信主時已經被稱義，日後的認罪不是為了重新得救，而是為了恢復與父的相交，像孩子做錯事回家把話說清楚。這一說的長處是保護救恩的確據，也保護人的隱私。</p><p><strong>難處：</strong>講過了頭，會讓人只在心裡跟神說，得罪了人卻從不道歉、不賠償；雅 5:16 與太 5:23--24 的人際面向就被忽略了。</p>"],["也要彼此認罪：在群體中承認","","<p>這一說看重雅 5:16：認罪不只是個人與神之間的事，也要在信任的群體中彼此承認、互相代求，才能得醫治。許多復興運動與小組傳統都經歷過這樣的釋放。這一說的長處是打破孤立，讓罪不再在暗處長大。</p><p><strong>難處：</strong>雅各說的是「彼此」，是互相的，目的是代求與醫治；一旦變成單向的交代、公開的檢討，甚至在群組或直播裡曝光，就從醫治變成羞辱，人以後只會更會躲。</p>"],["向神職人員告解：教會的赦罪職分","","<p>天主教與部分傳統根據約 20:23 等經文，發展出向神職人員告解的聖事。這一說的長處是讓人有一個具體、保密的場合說出罪，並聽見赦免的宣告。</p><p><strong>難處：</strong>1:9 沒有提到中介者，赦免的根據是神的信實；若把向某一個人告解當成赦免的條件，就與約翰的重點不同，也可能為屬靈控制開門。本講義尊重其他傳統，但不以此為赦免的條件。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：已經得救的人仍需要認罪，不是為了重新得救，是為了回到相交裡；1:9 的對象是神，赦免掛在神的信實與公義上。向人承認是智慧，不是赦免的條件。</strong></p><p>三種情形要向人說：①得罪了某人——在安全的前提下向他承認、請求原諒，該補償的補償（太 5:23--24）；②長年的捆綁——找一位可信、能保守秘密的屬靈同伴，彼此認罪、互相代求（雅 5:16）；③涉及他人安全或刑事的事——要負起法律責任，不能只在禱告裡處理。三種界線也要守：不要求人在不安全的場合公開隱私；不讓任何人以「向我交代」掌握別人的秘密；受害者不需要為別人加在他身上的惡認罪。</p>"],["【四】這件事該不該影響你的信心","","<p>你不需要找到一個夠屬靈的人，神才肯赦免你；你今晚就可以對神說：「主啊，你說得對，這是罪。」然後相信他的信實比你的感覺更可靠。</p><p>但也可以問自己：<strong>有沒有一個人，我得罪了他，卻一直只跟神說、沒有跟他說？</strong><strong>有沒有一件事，我一個人扛了太久，需要讓一個安全的人陪我一起禱告？</strong></p>"]],"con":[],"say":"本講義的立場：已得救的人仍需要認罪，為的是回到相交，不是重新得救；1:9 的對象是神，赦免掛在他的信實上。向人承認是智慧，得罪了人要向他說，長年捆綁可找安全的同伴，但不是赦免的條件，也不可要求公開羞辱。","care":"席上有人曾被要求當眾認罪而受傷，從此只說安全的話；要讓他知道，那不是 1:9。有人背著一件幾十年的事，從來沒有跟任何人說過；陪他先到神面前，再找一個安全的人。有被侵害的人，曾被說成「你也有錯，要認罪」；要清楚告訴他：別人的惡不是你的罪，你需要的是保護、陪伴，必要時協助報警與尋求專業協助。"},{"id":"ISS01_9","t":"1:9 認罪得赦免之後，後果與信任怎麼辦？","r":"1:9；撒下 12:13--14；路 19:8","ch":[1],"why":"「神都赦免了，你們為甚麼還要追究？」這句話在教會裡傷過很多人：被詐騙的弟兄、被背叛的配偶、被侵害的孩子。反過來，也有人認罪蒙赦免之後，一輩子被人用過去定義，再也回不了家。赦免、後果與信任，是三件相關卻不相同的事；混在一起，不是傷了受害者，就是壓垮了悔改的人，教會也會失去它被信任的見證。","pos":[["【一】經文問的是甚麼","","<p>1:9 應許「必要赦免我們的罪，洗淨我們一切的不義」（1:9）。可是大衛認罪後，拿單說「耶和華已經除掉你的罪，你必不至於死」（撒下 12:13），緊接著又說「你所得的孩子必定要死」（撒下 12:14）。撒該蒙恩之後，自己說：「我若訛詐了誰，就還他四倍」（路 19:8）。</p><p><strong>經文問的是：神的赦免會不會取消罪的後果？被得罪的人要不要立刻恢復對悔改者的信任？</strong></p>"],["赦免抹去一切：既然神赦免了，後果與追究都該停止","","<p>這一說強調 1:9 的「一切」：神赦免得完全，人也應該像神一樣，不再提、不再追究，立刻恢復關係與職分。這一說的長處是認真看待恩典的徹底，不讓悔改的人被永遠定罪。</p><p><strong>難處：</strong>大衛與撒該的例子都說明，赦免不自動抹去後果。這一說最大的危險，是讓受害者被催著「當作沒事」，讓加害者用屬靈語言逃避責任；在侵害、虐待、詐欺的事上，這會讓同樣的傷害再發生。</p>"],["赦免但後果仍在：神的管教與自然結果","","<p>這一說認為赦免處理的是罪責與關係，後果卻可能仍然存在：有的是神的管教，有的是罪本身帶來的自然結果——健康、名聲、信任、法律責任。這一說的長處是誠實，也解釋了撒下 12 章的張力。</p><p><strong>難處：</strong>講得不小心，會讓人以為一切苦難都是神在懲罰他的舊罪，或讓人覺得赦免不夠真實；也要分辨哪些是後果，哪些只是人不肯原諒的報復。</p>"],["赦免與重建信任分開：原諒交給神，和好需要時間與悔改的果子","","<p>這一說把三件事分開：神的赦免是完全的；被得罪的人的原諒，是把報復交給神；和好與信任，則需要悔改者以行動證明，需要時間，也需要對方的安全。撒該主動還四倍，正是悔改結出的果子，不是赦免的條件。</p><p><strong>難處：</strong>信任要多久才算重建？誰來判斷？這一說無法給一個時間表，需要群體有智慧地陪伴，也容易被濫用成「永遠不信任你」的冷懲罰。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：神的赦免是完全的，恢復的是與神的關係；它不自動取消後果與責任，也不要求被得罪的人立刻恢復信任。原諒交給神，和好需要悔改的果子與安全。</strong></p><p>具體地說：①悔改的人可以完全相信自己蒙了赦免，不必用一生償還；但要承擔該承擔的——道歉、賠償、法律責任，像撒該一樣主動。②被得罪的人可以把報復交給神，同時保持界線；信任按著對方的行為一點一點重建，不必被催促。③涉及侵害、虐待、詐欺的事，赦免不取代法律責任，也不取代對受害者的保護；教會不可因為某人「認罪了」就讓他回到能再傷人的位置。全卷的愛、界線與和好見 〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你是那個認了罪、卻還在承擔後果的人，後果不等於神沒有赦免你；大衛在後果中仍然寫下詩篇 32 篇的喜樂。神的赦免在你認罪的那一刻就是完整的。</p><p>如果你是那個被得罪的人，你不信任對方，不等於你不屬靈。你可以把審判交給神，也可以慢慢來；神看重你的安全。</p>"]],"con":[],"say":"本講義的立場：神的赦免是完全的，但不自動取消後果與責任；原諒交給神，和好與信任需要悔改的果子、時間與安全。涉及侵害的事，赦免不取代法律與保護。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉","care":"席上有被背叛的配偶、被教會裡的人詐騙的長輩、小時候被侵害的人，曾被催著「快點原諒、當作沒事」；要對他說，你的安全被神看重，信任可以慢慢來，必要時尋求專業協助與法律途徑。也有認罪悔改多年、卻仍被人用過去定義的人；要讓他聽見，神的赦免早已完整，教會也要給他一條回家的路。"},{"id":"ISS02_1","t":"2:2「挽回祭」——平息神的忿怒，還是除去罪污？","r":"2:2；4:10；羅 3:25","ch":[2],"why":"「挽回祭」是約翰一書最重的一個詞，2:2 第一次出現，4:10 再回來。講台若把它講成「兒子替我們擋住了一位生氣的父」，會眾會愛耶穌、卻一輩子怕天父；若把神的忿怒完全拿掉，又會把罪講輕，十字架也跟著變輕。從小在嚴厲家庭長大、把天父想成會翻臉的父親的人，最容易在這一題上受傷。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪」（2:2）。「挽回祭」原文 ἱλασμός（hilasmos），新約只出現兩次，都在本書（2:2；4:10）；同字根的 ἱλαστήριον 在羅馬書譯作挽回祭：「神設立耶穌作挽回祭，是憑著耶穌的血」（羅 3:25）。</p><p>問題是：這祭的作用，主要是對神——使神的忿怒得以平息？還是對罪——把罪污除去、潔淨？前者英文譯 propitiation，後者譯 expiation。這不只是字典的問題，它決定我們怎樣想像父、子與我們之間的關係。</p>"],["平息說（propitiation）：罪惹動神聖潔的忿怒，基督的祭使忿怒得以平息","","<p>這是改革宗與許多福音派的傳統讀法。ἱλάσκομαι 這一組字在希臘文獻裡常指使神明息怒；羅馬書的上下文也先講「神的忿怒」（羅 1:18），再講神設立耶穌作挽回祭。罪不是一個抽象的污點，是對聖潔之神的冒犯；神若不對罪發怒，就不是公義的。這一說的優點是嚴肅看待罪，也嚴肅看待神的聖潔。</p><p><strong>難處：</strong>講得不小心，就變成異教式的獻祭：人或子去說服一位冷漠、不情願的神。這和約翰的句子正好相反——4:10 的主詞是神：「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭」（4:10）。忿怒是真的，但預備祭的就是那位發怒的神自己。</p>"],["除罪說（expiation）：祭的作用是遮蓋、除去罪污，使人潔淨","","<p>一些學者指出，七十士譯本常用這一組字翻譯希伯來文的「遮蓋、贖罪」，對象多半是罪，而不是神；贖罪日的經文說「在耶和華面前得以潔淨，脫盡一切的罪愆」，重點在潔淨（這使我們想起利 16:30）。約翰一書的上下文也談潔淨：「耶穌的血也洗淨我們一切的罪」（1:7）。這一說的優點是避免把神講成要被收買的神明。</p><p><strong>難處：</strong>若完全拿掉神的忿怒，會把罪講成只是一種污染，不再是對一位有位格之神的冒犯；約翰福音也記下「神的震怒常在他身上」（約 3:36）。只講潔淨、不講審判，十字架的分量也就跟著輕了。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：兩說並陳，各有根據；決定性的是 4:10——祭是神自己預備的，不是人去平息一位生氣的神。</strong>不論取「平息」或「除罪」，主詞都是愛我們的神：他差了兒子，他使兒子作挽回祭。</p><p>所以講台可以說罪是嚴重的、神的公義是真實的，卻不可把父與子對立。2:1 的「中保」也要放在這裡讀：子在父那裡替我們說話，不是因為父不想聽，而是父自己安排了這位中保。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。學者對一個希臘字的辯論，不會改變一件事：你的罪已經有了一個夠大的祭，而預備這祭的，是愛你的神。</p><p>你若從小就怕一位會翻臉的父親，也把這份怕帶到天父面前，請慢慢讀 4:9–10：差兒子來的，就是天父自己。你不必在耶穌背後躲著天父。</p>"]],"con":[],"say":"本講義的立場：「平息忿怒」與「除去罪污」兩說並陳，各有根據；決定性的是 4:10——挽回祭是神自己預備的，不是人或子去平息一位不情願的神。罪是嚴重的，神的愛更早。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉","care":"席上有人從小被嚴厲的父親打罵，一聽「神的忿怒」就縮起來；也有人覺得自己的罪太重，挽回祭大概不夠用。不要說「耶穌替你擋住了父神的拳頭」，也不要把罪講成無所謂。請讓他們聽見：差兒子來的是天父，這祭夠大，連你也夠。若有人提起童年的傷，先聽，必要時陪他尋求輔導。"},{"id":"ISS02_2","t":"2:2「普天下人的罪」——基督為所有人死了嗎？人人都會得救嗎？","r":"2:2；4:14；約 3:16","ch":[2],"why":"「也是為普天下人的罪」（2:2）一句話，牽動教會史上幾個最大的爭論：普救論、有限救贖、無限救贖。家裡有未信親人的弟兄姊妹最在意這一題，親人過世的人更在意。講台若把普救論講成定論，會讓人覺得傳福音無關緊要；若把有限救贖講成冷冰冰的名單，又會讓人懷疑自己、懷疑神的邀請是不是真心的。","pos":[["【一】經文問的是甚麼","","<p>約翰說挽回祭「不是單為我們的罪，也是為普天下人的罪」（2:2）。「普天下」原文是 ὅλου τοῦ κόσμου，「全世界」。第四章又說：「父差子作世人的救主」（4:14）。約翰福音最有名的一節也說：「神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生」（約 3:16）。</p><p>問題是：「全世界」指誰？基督是為每一個人死了嗎？如果是，是不是人人最後都會得救？如果不是，神的邀請還是真心的嗎？</p>"],["普救論：基督為所有人死，所有人終必得救","","<p>這一說從 2:2、4:14 和「他願意萬人得救」（提前 2:4）讀出：神的愛最後會勝過一切的抗拒，沒有人永遠失落。它的吸引力在於相信神的愛真的夠大，也安慰了許多為未信親人擔憂的人。</p><p><strong>難處：</strong>同一章就說「凡不認子的，就沒有父」（2:23）；約翰福音 3:16 的永生是給「一切信他的」，緊接著也說「不信的人，罪已經定了」（約 3:18）。普救論拿掉了信的必要，也拿掉了福音的急迫。本講義不採。</p>"],["有限救贖（特定救贖）：基督的死有效地拯救神所揀選的人，「全世界」指各族各方","","<p>改革宗傳統認為，基督的死不只是使人「可能」得救，而是真正、有效地救了神所揀選的人：「好牧人為羊捨命」（約 10:11）。2:2 的「全世界」對照的是「我們」——不只是約翰身邊這一小群信徒，也包括各地、各族的神的兒女（這使我們想起約 11:52）。這一說的優點是強調救恩全然出於神，不會落空。</p><p><strong>難處：</strong>「全世界」在約翰筆下常常是指離開神的世人（約 3:16–17），很難只讀成「選民遍布全世界」；而講得不小心，會讓人以為神的邀請不是向每一個人真誠發出的，也會叫敏感的人一直懷疑自己在不在名單上。</p>"],["無限救贖（普遍的供應）：基督的祭足夠全人類，卻要藉著信才得著","","<p>阿民念派與許多福音派認為，基督為每一個人死了，這祭的價值足以除去全人類的罪；但要藉著信，才在一個人身上生效。這一說最直接地讀 2:2 與 4:14，也最直接支持向每一個人傳福音的真誠邀請。</p><p><strong>難處：</strong>若基督為每一個人付了罪價，為甚麼還有人被定罪？這一說要回答「祭的價值」與「祭的效力」之間的距離；講得不小心，又會把得救的關鍵移到人的決定上，好像人的信才是使祭生效的那一半功勞。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：不採普救論；有限救贖與無限救贖之爭，本卷不作裁判。</strong>兩派都承認：基督的祭足夠全世界，福音要真誠地傳給每一個人，得救要藉著信。約翰在 2:2 的焦點，不是替加爾文與阿民念的辯論定案，而是告訴小子們：這祭不是只夠我們這一小群人用的。</p><p>所以講台可以有把握地說：這祭也夠你用，也夠你那位還沒信主的家人用；也要有把握地說：要到子這裡來，因為「認子的，連父也有了」（2:23）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會史上愛主的人在這一題上站在不同的地方，卻一起傳福音、一起敬拜。你不必先在這場辯論裡選邊，才能確知自己得救；「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。</p><p>若你為已過世的親人擔心，請把他交給那位比我們更愛他的神。我們不知道一個人最後一刻與神之間發生了甚麼，我們知道的是神的心意。</p>"]],"con":[],"say":"本講義的立場：不採普救論，因為「凡不認子的，就沒有父」；有限救贖與無限救贖之爭，本卷不作裁判。可以確定的是：這祭足夠全世界，福音要真誠地傳給每一個人，得救要藉著信。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉","care":"席上有人的父母到臨終都沒有信主，每次聽到這一題就心裡一緊；也有人家裡只有自己一個人信，正在為兄弟姊妹禱告。不要在講台上斷言任何一位已過世的人去了哪裡，也不要用預定論的辯論嚇人。請讓他們聽見：這祭夠大，神的邀請是真心的，未信的家人仍可以帶到神面前，而過世的親人可以交給那位審判全地、也愛世人的神。"},{"id":"ISS02_3","t":"2:3--6 遵守命令與得救確據——是靠行為得救嗎？","r":"2:3--6；5:3；弗 2:8--10","ch":[2],"why":"「我們若遵守他的誡命，就曉得是認識他」（2:3）是最容易被讀成考卷的一節：遵守得夠多才算得救。完美主義、強迫性自我檢查、常常懷疑自己沒有得救的人，最容易在這一節受傷；反過來，也有人把恩典講成不必順服，讓這節失去力量。這一題要在第二章就講清楚：遵守是記號，不是代價。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「我們若遵守他的誡命，就曉得是認識他。人若說『我認識他』，卻不遵守他的誡命，便是說謊話的」（2:3–4）。又說：「人若說他住在主裡面，就該自己照主所行的去行」（2:6）。可是保羅說：「你們得救是本乎恩，也因著信……也不是出於行為」（弗 2:8–9）。</p><p>問題是：約翰是在說「遵守命令才能得救」嗎？遵守多少才夠？一個仍會跌倒的人，還可以確知自己認識神嗎？</p>"],["條件說：遵守命令是保持得救的條件","","<p>有些傳統把這段讀成條件：遵守，就留在恩典裡；不遵守，就可能失去認識神的身分。這一說的優點是嚴肅看待順服，不讓恩典變成便宜的通行證；約翰的話也確實很重，他說不遵守的人「是說謊話的」。</p><p><strong>難處：</strong>約翰用的動詞時態不支持這種讀法：「我們已經認識他」是完成式，遵守是用來「曉得」（知道）的記號，不是用來「得著」的代價。更要緊的是同一段的開頭：「若有人犯罪，在父那裡我們有一位中保」（2:1）。條件說會叫敏感的人每天檢查自己是否及格，而約翰寫信的目的是要人「知道自己有永生」（5:13）。</p>"],["記號說：遵守是認識他的果子和證據，不是原因","","<p>多數福音派的讀法：遵守命令不是使人認識神的原因，而是已經認識神的人身上長出來的記號，像果子證明樹是活的，卻不是叫樹活的原因。保羅在弗 2:10 接著說：「我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善」（弗 2:10）。2:5 也說，在遵守主道的人身上，神的愛「實在是完全的」——神的愛走完了全程。</p><p><strong>難處：</strong>記號說若講得太輕，會被人用來說「反正行為不重要」，忽略約翰那句很重的「便是說謊話的」（2:4）。記號說要同時保留兩件事：遵守不是代價，但沒有任何遵守的「認識」，約翰說不是真的。</p>"],["針對假教師說：「人若說」是在回應那些自稱有知識、卻不在乎怎麼活的人","","<p>另一些學者強調處境：那些出去的人很可能自稱有更高的「認識」，卻認為怎麼活無關緊要。約翰的「人若說」先是對這種說法的回應：真認識神的人，不可能對他的命令毫不在乎。這一說的優點是提醒我們，這段不是寫來讓真誠掙扎的信徒自我審查的。</p><p><strong>難處：</strong>若只讀成「這是講他們的」，會讓今天的讀者輕易放過自己；約翰在第一章三次「人若說」用的主詞都是「我們」，他先把自己放進去。處境讀法是補充，不能取代每個人照自己的鏡子。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：以記號說為主，並採處境的提醒——遵守是認識他的記號，不是得救的條件；方向是照主所行的去行，跌倒時有中保。</strong></p><p>這和全卷立場一致：方向是不犯罪，跌倒時有中保。約翰的「人若說」不是拿來審查別人的，是給每一個人先照自己。被愛的人自然會開始遵守，因為「我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的」（5:3）。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你讀 2:3 會心裡發緊，覺得自己永遠不夠，請先讀 2:1。約翰不是要你數算自己遵守了多少，而是要你看見：你心裡想要順服，本身就是神的愛在你裡面作工的記號。</p><p>如果你讀 2:3 心裡毫無感覺，覺得怎麼活都無所謂，那就該停下來問：我說我認識他，我的生命和我的話有沒有分家？</p>"]],"con":[],"say":"本講義的立場：遵守命令是認識神的記號，不是得救的條件；得救本乎恩、也因著信，遵守是被愛的人自然長出來的樣子。「人若說」先照自己，不是量別人；方向是照主所行的去行，跌倒時有中保。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉","care":"席上有人每天睡前一條一條檢查自己今天有沒有犯罪，越檢查越不確定自己有沒有得救；也有人因為長期的某種軟弱，早就不敢稱自己是基督徒。不要說「做不到的，證明你根本不認識他」。請讓他們先聽見 2:1 的中保，再聽見 2:3 的方向。若有人的自我檢查已經變成強迫性的焦慮，溫柔地建議他找可信的輔導者談。"},{"id":"ISS02_4","t":"2:7--8 為甚麼說「不是新命令」又說「是一條新命令」？","r":"2:7--8；約 13:34；利 19:18","ch":[2],"why":"這一題看似只是文字遊戲，其實牽動一個很實際的問題：教會常常追求「新的」——新的啟示、新的方法、新的運動。約翰在一封面對「更新教導」的信裡，故意說命令既舊又新。讀清楚這兩節，可以保護那些厭倦了一波又一波新潮流的人，也提醒那些以為「我早就聽過了」的人：舊的那一條還沒有活完。","pos":[["【一】經文問的是甚麼","","<p>約翰先說：「我寫給你們的，不是一條新命令，乃是你們從起初所受的舊命令」（2:7）；下一節又說：「我寫給你們的，是一條新命令，在主是真的，在你們也是真的」（2:8）。那命令是甚麼？從上下文看是愛弟兄（2:9–10）。</p><p>問題是：同一條命令，怎麼可能既不是新的、又是新的？約翰是在自相矛盾，還是在說一件很深的事？</p>"],["救恩歷史說：舊是摩西律法，新是基督加上的尺度","","<p>律法早已說：「卻要愛人如己」（利 19:18）；這是舊的。主耶穌在最後晚餐說：「我賜給你們一條新命令，乃是叫你們彼此相愛；我怎樣愛你們，你們也要怎樣相愛」（約 13:34）。新的不是內容，是尺度——「我怎樣愛你們」。這一說的優點是把約翰一書接回約翰福音，也接回整本聖經。</p><p><strong>難處：</strong>約翰在 2:7 說的「起初」，較自然是讀者初聽福音的時候（對照 2:24），不一定指摩西；只讀成律法與福音的對比，會漏掉約翰對讀者本身經歷的訴求。</p>"],["讀者經歷說：舊是你們信主時就聽見的，新是相對於那些「新教導」","","<p>這一說注意處境：那些出去的人正在兜售更新的說法，約翰說，我不給你們新花樣，這是你們從起初就聽見的。對讀者來說，愛弟兄的命令一點都不新；他們信主第一天就聽過。這一說的優點是很貼近書信的處境。</p><p><strong>難處：</strong>只講「不是新的」，無法解釋 2:8 為甚麼又鄭重地說「是一條新命令」。約翰不只是在拒絕新教導，他也在說這命令本身帶著一種新。</p>"],["新時代說：命令是新的，因為它屬於已經開始的新世界","","<p>2:8 的理由子句是關鍵：「因為黑暗漸漸過去，真光已經照耀」（2:8）。καινός 指品質上的新，不是剛發明。這命令之所以新，是因為它屬於基督已經帶來的新時代：先在主身上成了真，現在也在信徒身上成真。這一說的優點是解釋了「在主是真的，在你們也是真的」。</p><p><strong>難處：</strong>若只講時代，容易變得抽象，忘了這命令落在很具體的人身上——那個坐在你旁邊、你很難愛的弟兄。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三說不互斥，可以合讀。</strong>命令是舊的，因為律法早說了、讀者起初就聽見了，不必去追新的花樣；命令是新的，因為主用「我怎樣愛你們」給了它新的尺度，而且它屬於真光已經照耀的新時代，現在要在你身上成真。</p><p>這也是一個溫柔的提醒：屬靈長進常常不是聽到更新的東西，而是把最舊的那一條活出來。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。解經家對「舊」與「新」的重點有不同看法，但沒有人懷疑命令的內容：彼此相愛。</p><p>真正該問的是：我是不是一直在找新的屬靈刺激，卻還沒有好好愛身邊那一個人？天還沒有全亮，但東邊已經白了；今天，在已經亮的那一小塊地方，多走一步就好。</p>"]],"con":[],"say":"本講義的立場：愛弟兄的命令既舊又新。舊，是律法早說、讀者從起初就聽見，不必追新的花樣；新，是主用「我怎樣愛你們」給了它新的尺度，並且它屬於真光已經照耀的新時代，現在也要在我們身上成真。","care":"席上有人信主幾十年，覺得「彼此相愛」這幾個字早就聽膩了；也有人剛從一個不斷追新啟示、追新運動的群體出來，累壞了。請讓前者聽見：舊的那一條還沒有活完；讓後者聽見：你不必再追了，最好的已經在起初給了你。也記得席上有人正和某位弟兄姊妹有很深的心結，愛的第一步可以很小，例如一句真實的祝福禱告。"},{"id":"ISS02_5","t":"2:12--14 小子、少年人、父老——三種屬靈年齡，還是全體信徒的三個面向？","r":"2:12--14","ch":[2],"why":"2:12–14 很容易被拿來分級：誰是小子、誰是少年人、誰是父老。華人教會重視輩分，這段若被讀成屬靈的階級表，剛信主的人會不敢開口，資深的人會以為自己不必再學；321 的 235 也講屬靈父母與屬靈兒女，更容易被直接拿來對號入座。這一題要守住一件事：先讓經文自己講完，321 只在末端認出亮光。","pos":[["【一】經文問的是甚麼","","<p>約翰連說六句「我寫信給你們」，用了三種稱呼：「小子們哪，我寫信給你們，因為你們的罪藉著主名得了赦免」（2:12）；「父老啊……因為你們認識那從起初原有的」；「少年人哪……因為你們勝了那惡者」（2:13）。接著 2:14 用「我曾寫」再對小子們、父老、少年人各說一次：「小子們哪，我曾寫信給你們，因為你們認識父」（2:14）。所以 2:12–13 是三句現在式「我寫」，2:14 是三句過去式「我曾寫」。</p><p>問題是：小子、少年人、父老是教會裡三群不同的人、三個屬靈階段？還是每一個信徒身上的三個面向？</p>"],["屬靈階段說：教會裡真有剛信主的、正在爭戰的、成熟的","","<p>這一說按字面讀：約翰的教會裡有初信的、有正在屬靈爭戰的年輕一代、也有走了很久的長輩，約翰對每一群說合適的話。這一說的優點是保留了牧養上的真實——教會確實有不同階段的人，需要不同的餵養。</p><p><strong>難處：</strong>稱呼的次序是小子、父老、少年人，不是由小到大；而且「小子們」（τεκνία、παιδία）在全卷都是稱呼所有讀者（2:1、18、28）。若把這段讀成分級表，會讓人用年資排座次，正好違背每一句「因為」後面都是恩典的語氣。</p>"],["全體三面向說：每一個信徒都是蒙赦免的孩子、得勝的少年人、認識神的父老","","<p>這一說注意全卷用法：既然「小子們」稱呼全體，那麼三種稱呼可能是從三個角度描寫同一群人。每一個信徒都是罪藉著主名得了赦免的孩子；都要像少年人剛強，讓神的道常存心裡；也都要像父老，認識那從起初原有的。這一說的優點是讓每一句宣告都屬於每一個人。</p><p><strong>難處：</strong>若完全拿掉年齡與階段的意思，可能忽略約翰也許真的在看著台下不同的臉；而且同樣的話分三次對三種人說，似乎不只是修辭。</p>"],["兩組說：小子指全體，父老與少年人是其中兩群","","<p>第三種讀法折衷：「小子們」是約翰對全體的稱呼，然後再分別對其中年長的與年輕的說話。這一說的優點是兼顧全卷用法與字面。</p><p><strong>難處：</strong>它仍要解釋為甚麼 2:14 開頭又單獨對「小子們」說話；而且一旦分出父老與少年人，仍有被讀成階級的風險。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：以全體三面向說為主，也承認教會裡確有不同階段的人。</strong>經文本身先講的是身分，不是制度：每一句「因為」後面都是已經成就的事——罪已赦免、已經認識父、已經勝了那惡者。</p><p>經文講完，321 在末端認出「235」裡面那個「3」——屬靈父母與屬靈兒女，一代接一代的陪伴；但這段經文不是 235 的定義，也不是為 321 背書。講台不可用「就是」把兩者綁在一起。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你讀成三群人或三個面向，約翰對你說的話都一樣：你的罪是藉著主名得了赦免，你已經認識父，你是從得勝的地方出發。</p><p>如果你剛信主，你不是次等的；約翰溫柔地叫你「小子」。如果你已經走了很久，你也還是小子，還要在認識那從起初原有的裡面繼續長大。</p>"]],"con":[],"say":"本講義的立場：以「全體信徒的三個面向」為主，也承認教會裡確有不同階段的人；經文先宣告身分——已蒙赦免、已認識父、已勝了那惡者。321 只在末端認出屬靈傳承的亮光，這段不是 235 的定義。","care":"席上有剛信主、不敢在小組開口的人，也有服事幾十年、心裡其實很疲倦、不敢承認自己也需要被餵養的長輩。不要用「你還是小子」打斷人的發問，也不要用「你是父老了」要求長輩永遠剛強。請讓每一個人都聽見三句恩典：你被赦免、你認識父、你已經得勝。也留意那些在教會裡被輩分壓過、不敢說話的年輕人。"},{"id":"ISS02_6","t":"2:15「不要愛世界」與約 3:16「神愛世人」——基督徒可以享受文化、參與社會嗎？","r":"2:15--17；4:9；約 3:16","ch":[2],"why":"「不要愛世界」（2:15）被用錯過很多次：有人因此不敢聽音樂、看電影、讀小說，有人輕看身體與家庭，有人拒絕參與社會、投票、公共服務，覺得那都是「世界的事」。在演藝、媒體、設計、公部門工作的弟兄姊妹最容易因此受傷，覺得自己的工作是次等的。可是同一位約翰也寫下「神愛世人」。兩句話要一起讀。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了」（2:15）。同一位約翰在福音書寫：「神愛世人，甚至將他的獨生子賜給他們」（約 3:16）；在本書第四章又說：「神差他獨生子到世間來，使我們藉著他得生」（4:9），「父差子作世人的救主」（4:14）。</p><p>問題是：神愛世界，卻叫我們不要愛世界，這兩句怎樣同時成立？基督徒可以享受文化、藝術、娛樂嗎？可以參與社會嗎？</p>"],["分離說：世界是危險的，基督徒要盡量與文化保持距離","","<p>有些傳統（包括部分敬虔運動與基要派）把 2:15 讀成與文化分離：電影、流行音樂、小說、運動、政治都可能把人拉離神，最安全的是盡量不碰。這一說的優點是嚴肅看待世界的吸引力，也保護了一些軟弱的人遠離試探。</p><p><strong>難處：</strong>約翰自己在 2:16 定義了世界：「肉體的情慾、眼目的情慾，並今生的驕傲」——是三種慾望與驕傲，不是受造界，也不是人類的文化本身。「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的」（提前 4:4）。分離說把問題放在外面，卻常常放過心裡最隱密的那一樣：今生的驕傲，在教會裡照樣可以長得很茂盛。</p>"],["價值體系說：2:15 的世界是離開神、自成一套的價值，不是受造界與世人","","<p>多數福音派學者注意到 κόσμος 在約翰筆下有三層意思：受造的世界（「世界也是藉著他造的」，約 1:10）、世上的人（約 3:16）、離開神的價值體系。2:15 是第三層。所以神愛世人（第二層），我們也要愛世人；神造了世界（第一層），我們可以感謝領受；我們不愛的，是那一套叫人離開父的慾望與驕傲（第三層）。主耶穌禱告說：「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）。</p><p><strong>難處：</strong>這一說很容易被人拿來說「那我做甚麼都可以」，把 2:15 的鋒利磨掉了。約翰的話仍然是命令，三種慾望也會穿著文化、娛樂、甚至事工的衣服出現；分辨仍然要做，而且要誠實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採價值體系說。</strong>2:15 的「世界」是 2:16 定義的三種慾望與驕傲，不是受造界，也不是世人；神愛世人、差子作世人的救主，基督徒也被差到世上去愛人。我們可以感謝領受文化、藝術、娛樂中美好的東西，可以參與社會、承擔公共責任；要分辨的是：這件事是在餵養情慾與驕傲，還是在榮耀神、服事人。</p><p>最該留意的是第三樣：今生的驕傲，是用擁有來定義自己。它不在電影院裡才有，也可以在教會的座次、事工的規模裡。解藥不是更恨世界，是更被父的愛充滿；「這世界和其上的情慾都要過去，惟獨遵行神旨意的，是永遠常存」（2:17）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。基督徒對文化的參與程度有不同的良心尺度，彼此要尊重；有人為了軟弱選擇不碰某些東西，那是他的自由，不是所有人的規條。</p><p>真正該問的是：我用甚麼來定義我是誰？如果答案是我的擁有、我的成就、別人怎麼看我，那麼即使我從不看電影，也已經在愛世界了。</p>"]],"con":[],"say":"本講義的立場：2:15 的「世界」是 2:16 定義的三種慾望與今生的驕傲，不是受造界，也不是世人；神愛世人（約 3:16），也差子作世人的救主（4:14）。基督徒可以感謝領受文化中美好的東西、參與社會；要分辨的是心被甚麼佔有。","care":"席上有在影視、音樂、廣告、設計業工作的弟兄姊妹，常被暗示「你的工作很世界」；也有從小被禁止一切娛樂、長大後帶著罪疚與反彈的人；還有為了「不愛世界」而冷落家人、輕看自己身體的人。不要說「藝術都是世界的」「關心社會就是不屬靈」。請讓他們聽見：神愛這個世界，你可以在自己的崗位上不被世界佔有，並且帶著感謝享受神所造的好東西。"},{"id":"ISS02_7","t":"2:18--22「敵基督」是一個人、一種靈、還是很多人？「末時」是今天嗎？","r":"2:18--22；4:3；帖後 2:3--4","ch":[2],"why":"「敵基督」是華人教會最容易被炒作的題目之一：網路影片、預言講座、轉傳文章，把這個名號貼在政治人物、國家、宗派、科技產品上，甚至推算年份。被嚇到的人失眠、囤糧、變賣家產；算錯了，又有人整個離開信仰。全聖經只有約翰書信用這個詞，本書四次、約貳一次，而且他在一世紀就說「如今是末時了」。這一題必須講得清楚而安靜。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來；現在已經有好些敵基督的出來了，從此我們就知道如今是末時了」（2:18）。他接著下定義：「誰是說謊話的呢？不是那不認耶穌為基督的嗎？不認父與子的，這就是敵基督的」（2:22）。第四章又說：「這是那敵基督者的靈。你們從前聽見他要來，現在已經在世上了」（4:3）。</p><p>問題是：敵基督是末後一個具體的人物、一種貫穿歷史的靈，還是很多人？「末時」是指今天嗎？我們能從徵兆推算主再來的日子嗎？</p>"],["一人說：末後會有一位具體的敵基督出現","","<p>讀者「曾聽見說，那敵基督的要來」（2:18），顯示早期教會已經有一個關於末後人物的教導；保羅也說，那日子以前「必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來」（帖後 2:3）。這一說的優點是嚴肅看待聖經對末後的預言。</p><p><strong>難處：</strong>約翰並不否認讀者所聽見的，但他的焦點明顯不在那一位，而在「現在已經有好些」。歷史上每一次有人急著指認那一位——羅馬皇帝、教宗、各時代的獨裁者——結果都證明是錯的，留下的常常是恐懼與分裂。</p>"],["一靈說：重點是一種否認基督的屬靈勢力，貫穿整個教會時代","","<p>4:3 說「這是那敵基督者的靈」，「現在已經在世上了」。這一說認為敵基督主要是一種靈、一種教導的方向：否認耶穌是基督、否認他是成了肉身來的。這一說的優點是讓每一代信徒都知道要分辨，而分辨的標準是基督論。</p><p><strong>難處：</strong>若只講「一種靈」，可能把帖後 2 章與讀者「曾聽見」的末後人物完全抹掉；也可能讓「敵基督的靈」變成一個可以隨便貼在任何不喜歡的事物上的標籤。</p>"],["很多人說：約翰指的是當時那些否認基督、離開教會的教師","","<p>2:18 明說「現在已經有好些敵基督的出來了」，2:19 接著說「他們從我們中間出去」，2:26 說是「那引誘你們的人」。這一說認為約翰最直接說的是一世紀那一群教師。這一說的優點是最貼近上下文。</p><p><strong>難處：</strong>若只停在一世紀，今天的讀者會以為這段與自己無關；但約翰給的標準——認不認耶穌是基督——每一代都要拿來分辨，包括先問自己的講台。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三說各有根據，約翰的焦點在已經出現的很多人，和他們背後否認基督的靈；他不否認末後的人物，但沒有給我們名單或日期。</strong>辨認的標準是基督論：他怎樣看耶穌。「末時」是從基督第一次來到他再來的整段日子——新約說神「就在這末世藉著他兒子曉諭我們」（來 1:2）——每一代都活在末時，都要警醒分辨，卻沒有一代受託去推算日子：「但那日子，那時辰，沒有人知道」（太 24:36）。</p><p>講台不把這個名號貼在任何政治人物、國家、宗派或群體身上；約翰要的不是驚慌，是「你們要住在主裡面」（2:28）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕。約翰在說這些話的同一段裡，三次叫讀者「小子們」，又說「你們從那聖者受了恩膏」（2:20）。末時不是叫人驚慌的時候，是叫人留在主身邊的時候。</p><p>如果你最近被網路上的末日影片嚇到，可以把手機放下，問一個約翰的問題：這個說法怎樣看耶穌？然後回到起初所聽見的福音，安靜地照常愛人、做工。</p>"]],"con":[],"say":"本講義的立場：約翰的焦點在已經出現的「好些敵基督」和否認基督的靈；他不否認末後的人物，但沒有給名單或日期。分辨的標準是基督論；每一代都活在末時，要警醒，卻不算日子、不貼標籤。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉","care":"席上可能有人看了太多末日影片，夜裡睡不著，甚至在考慮辭職、變賣房子；也有人曾經跟過一個預言日期落空的群體，信心被掏空了；還有人的政治立場剛好和講員不同。不要說任何具體的人或國家就是敵基督，也不要說「主一定在幾年內回來」。請讓他們聽見一聲「小子們哪」：住在主裡面的人，可以坦然。若有人因此恐慌到影響生活，陪他就醫或找輔導談。"},{"id":"ISS02_8","t":"2:19「他們從我們中間出去」——怎樣看待離開教會的人？","r":"2:19；來 10:25；約 6:66--68","ch":[2],"why":"這是本章最需要牧養溫度的一題。2:19「他們從我們中間出去，卻不是屬我們的」常被用來論斷離開教會的人，甚至被不健康的帶領拿來建立控制：離開這裡，就是不屬神。可是會眾席上，有在教會受過傷而離開的人的父母、配偶、兒女，每個主日替他們坐在這裡；也有人此刻正在考慮離開，因為他受傷了、累壞了、或是在信仰裡掙扎。他們聽完這一題，應該更確知神沒有放棄任何人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「他們從我們中間出去，卻不是屬我們的；若是屬我們的，就必仍舊與我們同在；他們出去，顯明都不是屬我們的」（2:19）。前一節剛講到「好些敵基督的出來了」（2:18），後面又說他們不認耶穌為基督（2:22），並且是「那引誘你們的人」（2:26）。</p><p>問題是：這節經文是在說每一個離開教會的人嗎？今天有人不再來聚會、轉到別的教會、或者說「我不想去教會了」，我們可以用 2:19 判斷他屬不屬神嗎？</p>"],["普遍判準說：有人說，凡離開教會群體的，都顯明他不是真信徒","","<p>有些講台把 2:19 當成一條普遍的原則：真信徒會留下，離開的人證明他從來不屬主。它常和「你們不可停止聚會，好像那些停止慣了的人」（來 10:25）一起引用。這一說的優點是嚴肅看待群體生活；信仰確實不是一個人的事，長期離開肢體也確實會讓人軟弱。</p><p><strong>難處：</strong>約翰說的「他們」有很具體的身分：否認耶穌是基督、帶著另一套教導離開、還回頭來引誘留下的人的教師。2:19 沒有把「屬我們」等同於某一間地方教會的會籍。把它變成普遍判準，會叫所有搬家的、受傷的、逃離不健康環境的人都被定罪，也讓不健康的帶領得到最好的保護傘。這正是第三封信裡丟特腓做的事——他「將接待弟兄的人趕出教會」（約參 1:10），約翰並不站在他那一邊。</p>"],["處境說：2:19 是寫給留下來的人的安慰，說的是那一群否認基督的教師","","<p>多數解經家注意到這節的語氣：約翰不是在發布一條開除規則，是在對被分裂搖動的小子們說：你們沒有錯，他們的離開不證明他們比較屬靈；這件事反而顯明了他們本來就不在這信仰裡。這一說的優點是忠於上下文，也把這節還給它原本的功用——安慰。</p><p><strong>難處：</strong>如果只講處境，可能讓人忽略一件事：約翰確實看重留下、住在群體裡；信徒長期孤立，屬靈生命容易乾枯。而且今天也確實有人離開，是因為被錯誤的教導帶走了。</p>"],["牧養分辨說：要分清「離開基督」與「離開某個教會」，後者原因很多","","<p>這一說在處境說的基礎上再往前走一步：約翰在意的是有沒有認子（2:23），不是在哪一間教會。今天有人離開教會，有許多原因：搬家、工作、婚姻、在教會受過傷、被權柄濫用、信仰的疑惑、一段很深的憂鬱。福音書裡也有人離開主：「從此，他門徒中多有退去的，不再和他同行」（約 6:66），主沒有追著咒詛，只轉身問留下的人：「你們也要去嗎？」（約 6:67）。</p><p><strong>難處：</strong>這一說若講得太軟，可能讓人覺得離不離開都無所謂，失去約翰對群體與真理的看重；它需要牧者真的去聽、去分辨，而不是用一條原則一概而論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：2:19 是給留下的人的安慰，說的是那一群否認基督、帶著另一套教導離開的教師；它不是交給我們一把尺，去量每一個不再來聚會的人。</strong>人離開教會有許多原因，包括在教會受傷；約翰從來沒有給我們權柄宣判誰屬神、誰不屬神。</p><p>所以教會的回應不是論斷，而是三件事：對留下的人，堅固他們住在起初所聽見的道裡；對離開的人，留一張空椅子，持續禱告，不散播猜測，若他在這裡受過傷，要有勇氣承認、道歉、改正；對想離開的人，願意誠實地談，若他需要離開一個不安全的環境，祝福他，而不是恐嚇他。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你是留下來的人，有人離開了，你不必因此懷疑自己所信的；約翰說，你們從那聖者受了恩膏，你們知道真理。</p><p>如果你是離開的人的家人，請聽清楚：這節經文沒有宣判你的孩子、配偶或朋友。牧人的心是「到我這裡來的，我總不丟棄他」（約 6:37）。如果你自己正在考慮離開，請先問一個約翰的問題：我是在離開一間教會，還是在離開耶穌？前者有時是必要的，你可以帶著主離開；後者，彼得說：「主啊，你有永生之道，我們還歸從誰呢？」（約 6:68）</p>"]],"con":[],"say":"本講義的立場：2:19 是約翰給留下的人的安慰，說的是一世紀那一群否認基督、帶著另一套教導離開的教師；不是用來論斷每一個離開教會的人，也不是「離開我們就是不屬神」的控制。人離開教會有許多原因，包括在教會受傷。","care":"席上有一位母親，她的兒子在青年團契被同工羞辱後再也沒有回來；有人的配偶因為教會處理錯一件事而離開；也有人今天是最後一次來，正在想要不要走。不要說「離開的都不屬神」「轉教會就是背叛遮蓋」。請讓他們聽見：神沒有放棄任何一個人，教會若傷了人，要承認、要道歉；離開的家人可以繼續被帶到神面前。想離開的人，歡迎來談，我們願意聽。"},{"id":"ISS02_9","t":"2:20、27「恩膏」與「不用人教訓你們」——還需要教會的教導嗎？","r":"2:20；2:27；弗 4:11--12","ch":[2],"why":"2:27「並不用人教訓你們」有兩種完全相反的誤用：一種說「我有聖靈，不需要講道、查經、教會」；另一種說「我有恩膏，我說的就是神說的，你們不可質疑」。前者讓人孤立地讀經、容易被各種說法帶走；後者讓不健康的領袖壟斷解經與屬靈權柄。被屬靈權柄傷害過的人、剛信主不知道該信誰的人，最需要這一題講得清楚。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「你們從那聖者受了恩膏，並且知道這一切的事（或譯：都有知識）」（2:20）；又說：「你們從主所受的恩膏常存在你們心裡，並不用人教訓你們，自有主的恩膏在凡事上教訓你們」（2:27）。2:20 的原文有異文：WH、NA28 作 πάντες「你們眾人都知道」，Treg、RP 作 πάντα「知道一切」。和合本正文「知道這一切的事」跟 πάντα，小字「或譯：都有知識」接近 πάντες。</p><p>問題是：恩膏是甚麼？「不用人教訓你們」是指信徒不再需要任何教導嗎？誰有恩膏，誰就有解經的最後權柄嗎？</p>"],["個人主義說：有了聖靈，就不需要人的教導","","<p>有些人從 2:27 讀出：每個信徒都有聖靈直接教導，所以講道、神學、查經班都可有可無，甚至是人意的攙雜。這一說的優點是相信聖靈真的住在每一個信徒裡面，每個人都可以直接親近神、讀懂聖經。</p><p><strong>難處：</strong>約翰自己正在寫信教導他們——一個說「你們不需要人教導」的人，寫了整整五章來教導，可見他的意思不是取消教導。新約也說：「他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，為要成全聖徒，各盡其職，建立基督的身體」（弗 4:11–12）。孤立的「我有聖靈」，最容易被下一個自稱有新亮光的人帶走——那正是約翰在防備的。</p>"],["權柄壟斷說：有恩膏的人說的話就是神的話","","<p>另一種用法正好相反：某位領袖或某個群體宣稱自己有特別的恩膏，因此他們的解經不容質疑，質疑他們就是「摸神的受膏者」。這一說常以舊約君王、先知受膏的經文為根據，優點是看重屬靈權柄與秩序。</p><p><strong>難處：</strong>2:20 的「你們」是複數，原文很可能是「你們眾人都知道」——恩膏是給全體信徒的，不是少數人的牌子。那些自稱有獨家知識的人，正是約翰要信徒分辨的「那引誘你們的人」（2:26）。新約說聖靈「顯在各人身上，是叫人得益處」（林前 12:7），也稱讚庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11）。</p>"],["處境與新約應許說：「人」指引誘人的教師；恩膏是叫人認得真道、住在主裡面的能力","","<p>多數解經家從上下文讀：2:26 剛說「我將這些話寫給你們，是指著那引誘你們的人說的」，所以 2:27 的「不用人教訓你們」，是說你們不需要那些人來補充一套新的福音。恩膏較好的理解是聖靈藉著從起初所聽見的道在信徒裡面作工（對照 2:24），像主所應許的保惠師「要將一切的事指教你們」（約 14:26）。這也使我們想起新約的應許：「他們從最小的到至大的都必認識我」（耶 31:34）。恩膏的方向，是「你們要按這恩膏的教訓住在主裡面」（2:27）。</p><p><strong>難處：</strong>這一說需要信徒在群體裡、在聖經裡分辨，而不是一個簡單的口號；它要求教導者謙卑，也要求學習者負責，兩邊都不輕鬆。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：2:20 取 πάντες「你們眾人都知道」，與和合本小字「或譯：都有知識」一致；恩膏是給全體信徒的，不是少數人的特權。2:27 的「人」指 2:26 那些引誘人的教師；恩膏不是拒絕教導的理由，是叫人認得真教導的能力，並且把人帶回從起初所聽見的道、住在主裡面。</strong></p><p>約翰自己正在寫信教導他們，這就是最清楚的註解。所以教會需要教導，教導者也要被聖經檢驗；沒有人可以用「我有恩膏」壟斷解經，也沒有人可以用「我有聖靈」拒絕一切受教。恩膏在群體裡、在聖經裡、在彼此的印證裡最清楚。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你自卑。如果你覺得自己讀經不多、懂得不深，請聽約翰這一句：你們眾人都知道。那位聖者沒有漏掉你，你認得真道的聲音，像一個人認得親人的聲音。</p><p>也不該讓你驕傲。恩膏把人帶回主那裡，不是帶到自己的意見那裡；最認得聖靈聲音的人，通常也最願意和弟兄姊妹一起受教。</p>"]],"con":[],"say":"本講義的立場：2:20 取 πάντες「你們眾人都知道」（和合本小字「或譯：都有知識」），恩膏是給全體信徒的。「不用人教訓你們」指不需要那些引誘人的教師；約翰自己正在寫信教導，恩膏不是拒絕教導的理由，也不容任何人壟斷解經。","care":"席上有人曾在一個「只有牧師有恩膏」的教會裡被控制多年，現在聽到「權柄」兩個字就發抖；也有人自從在網路上聽了很多講員以後，已經不太願意受地方教會的教導；還有剛信主、不知道該信誰的人。不要說「質疑我就是摸受膏者」，也不要嘲笑人「自以為有聖靈」。請讓他們聽見：恩膏是給你們眾人的，也歡迎大家拿聖經來考查講台上的每一句話。"},{"id":"ISS03_1","t":"3:2「我們必要像他」——基督徒會變成神嗎？","r":"3:2；彼後 1:4；林前 13:12","ch":[3],"why":"「我們必要像他」（3:2）是全卷最高的盼望，也是最容易被講歪的一句。有人從這裡推出人終要變成神，把東方教會的 theosis 和新紀元的「你裡面有神性」混成一談；也有人反過來把它講成現在就要完美，叫一個還在成長的人每天活在焦慮裡。這題要講清楚：像他，像到哪裡？甚麼時候？靠甚麼？誰會受傷：對自己的不完全很焦躁的人，以及被「人人皆可成神」的說法吸引的慕道朋友。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「我們現在是神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體」（3:2）。這一句有三個時間：現在（已經是兒女）、還沒有（將來如何還未顯明）、那一天（主顯現時必要像他）。接著是一個現在的回應：「凡向他有這指望的，就潔淨自己，像他潔淨一樣」（3:3）。</p><p>原文 ὅμοιοι αὐτῷ ἐσόμεθα（homoioi autō esometha），「與他相似」。ὅμοιος 是「相似、同類」，不是 ὁ αὐτός（同一個）。後半句 ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν，「因為我們要看見他，照他本來的樣子」。會眾會問：像他是指甚麼？品格？身體？還是本質？基督徒最後會變成神嗎？我們現在要怎樣面對自己還不像他的地方？<strong>經文問的是：成聖與得榮的界線在哪裡，盼望怎樣改變現在。</strong></p>"],["神化說（theosis）：人終要分享神的生命","","<p>東方教會從教父時代就說：「神成為人，好叫人成為神。」意思不是人變成另一位神，而是人藉著聖靈與基督聯合，分享神的生命、榮耀與不朽。它引的經文是「得與神的性情有分」（彼後 1:4），以及本節的「必要像他」。這一說的長處，是把救恩看得很大：不只是免罪，是被帶進與三一神的相交，正呼應 1:3 的「與父並他兒子耶穌基督相交」。</p><p><strong>難處：</strong>「神化」這個詞在華語語境裡極容易被聽成「人變成神」，與民間「修道成仙」、新紀元「喚醒你的神性」混在一起。東方教會自己也強調「分享神的能（energies），不分享神的本質（essence）」，但講台上很少人講得出這個分別。講得不小心，就模糊了創造主與受造者之間那條永遠的界線。</p>"],["道德相似說：像他只是品格聖潔","","<p>許多福音派註釋把「像他」讀成道德上的相似：那一天我們的品格要完全聖潔，像基督一樣。理由是下一節立刻說「就潔淨自己，像他潔淨一樣」（3:3），整段的語境是倫理的；約翰全卷也一直在講行義、愛弟兄。這一說保護了界線：我們不會在本質上變成神，只是在品格上被完全。</p><p><strong>難處：</strong>它把盼望講小了。保羅說主要「將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似」（腓 3:21），得榮包括身體的復活與改變，不只是品格。而且如果只講品格，3:2 就容易變成另一條道德要求，壓在本來就焦慮的人身上。</p>"],["看見而改變說：見他的面，就被改變","","<p>這一說把重心放在後半句的「因為必得見他的真體」。保羅說「到那時就要面對面了」（林前 13:12），又說「我們眾人既然敞著臉得以看見主的榮光……就變成主的形狀，榮上加榮」（林後 3:18）。看見與改變是連在一起的：現在模糊地看，就逐漸地變；那一天面對面地看，就完全地變。這一說的長處，是把改變的主動權放回神手裡：不是我們爬上去，是他顯現。</p><p><strong>難處：</strong>原文的 ὅτι 可以讀成原因（因為看見，所以像他），也可以讀成證明（我們知道會像他，因為我們能看見他——只有相似的才能看見）。兩種讀法都有學者支持，不能只取一邊，也不宜在講台上把一個文法選項講成定論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：我們要像復活得榮的基督，身體與品格都被改變，卻永遠是受造的兒女，不會變成神。</strong>ὅμοιοι 是相似，不是同一；約翰在這封信裡用 τέκνα（孩子）稱信徒，把 υἱός（兒子）留給耶穌一人，這個用字本身就守著界線。</p><p>本講義吸收第三說的亮光：改變的源頭是「他顯現」與「我們看見」，不是我們的努力；也吸收第一說的長處：救恩的終點是相交，不只是免罪。東方教會的 theosis 若照它自己的分別（分享神的生命、不分享神的本質）來講，是可以對話的弟兄傳統；但本講義在講台上不用「成神」這個詞。</p><p>現在與將來的關係，是 3:2 與 3:3 的次序：先有盼望，然後潔淨自己。潔淨不是為了配得盼望，是盼望自然的結果；就像一個知道下個月要去見久別父親的孩子，會自己把房間收拾好。321 的落點是「改變觀點」：從地上看到天上，你現在的樣子不是你最後的樣子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這題的各家分歧，多半在用詞與重點，不在核心：大公教會的信經一致承認，人永遠是受造的，神永遠是神。你不必弄懂 theosis 的全部歷史，才能有這個盼望。</p><p>倒是有一件事該問：<strong>我現在看自己的時候，是帶著焦慮，還是帶著盼望？</strong>約翰承認「將來如何，還未顯明」，連使徒也不知道細節。你不必知道細節，只要知道你要見的是誰。今天帶著還沒完成的自己來到他面前，完成這件事的，是他的顯現。</p>"]],"con":[],"say":"本講義的立場：我們要像復活得榮的基督，身體與品格都被改變，卻永遠是受造的兒女，不會變成神。改變的源頭是他顯現、我們見他；盼望使人潔淨自己，潔淨不是配得盼望的條件。","care":"席上會有對自己很嚴厲的人，聽到「必要像他」就想到自己還差多遠；要讓他聽見次序：先是兒女，然後才慢慢長得像，完成這件事的是主的顯現。也會有被身心靈課程、「喚醒內在神性」吸引的慕道朋友；不要嘲笑，溫和地說明：福音不是叫人成神，是叫人回家作神的孩子。不要說「你還不像他，表示你不夠努力」。"},{"id":"ISS03_2","t":"3:6、9「凡從神生的，就不犯罪」——各家怎樣解？","r":"3:6--9；1:8--10；2:1","ch":[3],"why":"這是約翰一書最常讓認真的信徒失眠的經文。一位昨晚又發脾氣、又看了不該看的東西的弟兄，讀到「凡從神生的，就不犯罪」「他也不能犯罪」（3:9），心就沉下去：我是不是根本沒有被神生過？另一邊，也有人拿 1:8 當擋箭牌：人人都有罪，所以我這件事不必改。兩種讀法都會傷人。這一題必須同時講 3:9 與 2:1，並陳各家，讓掙扎的人得安慰，也讓放縱的人聽見呼召。","pos":[["【一】經文問的是甚麼","","<p>同一封信裡有兩組看似相反的話。一組說：「我們若說自己無罪，便是自欺，真理不在我們心裡了」（1:8）；「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。另一組說：「凡住在他裡面的，就不犯罪」（3:6）；「凡從神生的，就不犯罪，因神的道（原文是種）存在他心裡；他也不能犯罪，因為他是由神生的」（3:9）。</p><p>約翰不是寫完就忘了前面的人。同一位作者、同一封短信、相隔不到兩章，他一定認為兩組話可以同時成立。會眾會問：基督徒到底會不會犯罪？我還在跌倒，是不是表示我沒有得救？<strong>經文問的是：從神生的人與罪的關係是甚麼——而跌倒的人要往哪裡去。</strong></p>"],["現在式持續說：不是不再跌倒，是不再以犯罪為常","","<p>3:6、9 的動詞多是現在式（ἁμαρτάνει、ποιεῖ、ἁμαρτάνειν），希臘文的現在式常表示持續的動作。所以許多譯本作「不繼續犯罪」「不以犯罪為常」：從神生的人仍可能跌倒，卻不會一直活在罪中。這一說簡單清楚，很適合牧養，也是華人教會最常聽到的解釋。</p><p><strong>難處：</strong>約翰在 5:16 也用現在分詞說「弟兄犯了不至於死的罪」（5:16），1:8 的「無罪」也不靠時態。單靠時態撐不住全部的分別；而且「多常才算常」，會讓敏感的人開始數自己跌倒的次數，反而更焦慮。</p>"],["兩種罪說：這裡的罪專指背棄基督或「不法」","","<p>3:4 說「違背律法就是罪」，原文 ἀνομία 帶末世背叛的色彩；有人據此認為 3:6–9 說的罪，是根本拒絕基督的那一種，或 5:16 的「至於死的罪」。從神生的人不會犯這種罪；一般的軟弱與過犯，則照 1:9、2:1 處理。這一說的長處，是認真看待約翰在這段的用字和處境。</p><p><strong>難處：</strong>經文用的是一般的「罪」字，沒有特別標明；講不小心，會把罪分成「可以容忍的」與「不可以的」兩類，讓人對日常的罪不再敏感。而且會讓怕自己犯了那種罪的人更怕。</p>"],["身分與方向說：約翰在說新生命的本性與走向","","<p>約翰的理由是「因神的道（原文是種）存在他心裡」（3:9），重點在源頭：神把他的生命種在人裡面，這生命的本性是往光長。罪可能絆倒他，卻不再是他的家；就像一顆種子會被風吹歪，卻不會長成荊棘。3:6 的「住在他裡面」與 2:28 的「住在主裡面」相連，說的是一個人生命的方向。</p><p><strong>難處：</strong>若只講本性與方向，容易變成一句美麗的理想，失去約翰原本的催逼——他確實在呼召讀者「不要被人誘惑。行義的才是義人」（3:7）。也要小心不讓「方向對了」成為不處理具體罪的藉口。</p>"],["針對假教師說：這是對那些輕看罪的人說的","","<p>當時有人自稱認識神、有屬靈的知識，卻說身體做甚麼都無所謂。1:8 是對「自稱無罪」的人說的，3:6–9 是對「自稱認識神卻活在罪中」的人說的；約翰在兩邊各堵一條路。3:7 的「不要被人誘惑」就是證據。這一說的長處，是把經文放回它的處境。</p><p><strong>難處：</strong>對手的面貌只能從經文重建，學者看法不一；而且經文不能只拿來量別人。約翰的「我們」常常包括他自己，這段也是寫給教會內每一個人的自省。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：以第三說（身分與方向）為主，吸收第一說（持續）與第四說（處境）的亮光；落點在 2:1：從神生的人，方向是不犯罪；跌倒的時候，在父那裡我們有一位中保。</strong></p><p>3:9 講的是種的力量，2:1 講的是中保的恩典；兩節一定要一起讀。只讀 3:9，會讓仍在掙扎的人懷疑自己的身分；只讀 2:1，會讓人把恩典當成放縱的許可。約翰寫信的目的兩句話都說了：「我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保」（2:1）。</p><p>所以一個人為自己的罪憂傷，本身就是好消息：不在乎的人不會難過，那份難過說明裡面有一位叫你不安的聖靈。反過來，一個明知故犯、毫不在意、還拿 1:8 為自己辯護的人，要聽見 3:6 的警告。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑得救，但該讓你回頭。如果你讀這段經文覺得心慌，請先讀 2:1，再讀 3:9：種還在，中保還在。你今天跌倒了，就今天回到父那裡，照 1:9 認罪，領受赦免，再站起來。</p><p>如果你發現自己對某一件罪已經不再難過，甚至替它找理由，那就該停下來。<strong>我是在跌倒後回家，還是已經住在那裡了？</strong>這一問不是為了定罪，是為了叫你趁著門還開著，轉身回去。</p>"]],"con":[],"say":"本講義的立場：3:9 說的是從神生的人的本性與方向——罪不再是他的家；跌倒時，在父那裡我們有一位中保（2:1）。兩節必須一起讀，不叫掙扎的人懷疑得救，也不讓人拿恩典合理化刻意的罪。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。","care":"席上有每晚為同一個軟弱掙扎、羞愧到不敢領聖餐的人，有正在戒癮、反覆跌倒的人，也有天性良心敏感、讀到「不能犯罪」就整夜睡不著的人。不要說「真基督徒是不會犯罪的」「你還會跌倒，就要檢查自己有沒有重生」。要說：種還在，中保還在，今天就可以回家。若有人長期陷在得救焦慮裡，陪他找牧者與專業輔導。"},{"id":"ISS03_3","t":"3:8「魔鬼從起初就犯罪」——魔鬼從哪裡來？「除滅魔鬼的作為」是甚麼意思？","r":"3:8；約 8:44；來 2:14","ch":[3],"why":"華人教會在屬靈爭戰上常走兩個極端：一邊是事事見鬼，頭痛、塞車、孩子哭鬧都說是魔鬼作怪，憂鬱症要趕鬼不要吃藥；一邊是避而不談，把魔鬼講成古人的比喻。3:8 是新約講基督與魔鬼最直接的一句，必須讀準：約翰在意的是魔鬼的起源，還是基督的目的？誰會受傷：被當成「被鬼壓」而延誤就醫的病人，和活在屬靈恐懼裡的信徒。","pos":[["【一】經文問的是甚麼","","<p>「犯罪的是屬魔鬼，因為魔鬼從起初就犯罪。神的兒子顯現出來，為要除滅魔鬼的作為」（3:8）。這一節有兩個問題。第一，「從起初」是從甚麼時候？魔鬼是神造的嗎？牠怎樣墮落的？第二，「除滅」是甚麼意思？既然已經除滅了，為甚麼世界上還有這麼多惡？</p><p>原文「除滅」是 λύω（lyō），基本意思是「鬆開」：拉撒路出來時，主說「解開，叫他走」（約 11:44）；也可以指拆毀建築。「從起初」呼應主的話：「他從起初是殺人的，不守真理」（約 8:44）。<strong>經文問的是：在罪與救恩的故事裡，魔鬼佔甚麼位置，基督來做了甚麼。</strong></p>"],["墮落天使說：魔鬼是受造的天使，因驕傲墮落","","<p>教會傳統的主流看法：神所造的都是好的，魔鬼原是受造的靈體，因驕傲背叛而墮落。經文的線索包括「不守本位、離開自己住處的天使」（猶 6），以及主說牠「不守真理」（約 8:44）。有人也用以賽亞書 14 章、以西結書 28 章來描寫牠的墮落。這一說保護了一個重要真理：神不是惡的創造者，魔鬼不是與神平起平坐的另一位神。</p><p><strong>難處：</strong>以賽亞書 14 章與以西結書 28 章表面上是對巴比倫王與推羅王的審判，能不能讀成魔鬼的墮落，學者意見分歧；聖經並沒有給一個完整的魔鬼傳記。把細節講得太確定，會把推想當成啟示。</p>"],["「從起初」指人類歷史的起初說","","<p>也有學者認為，約翰的「從起初」不是在講天使的墮落，而是指人類歷史的開端：從伊甸園的蛇，到該隱殺弟（3:12），魔鬼一直在犯罪、一直是殺人的。這個讀法和上下文接得最緊：3:8 講魔鬼「從起初」，3:12 立刻講該隱，3:15 講恨與殺人，約翰福音 8:44 也把「說謊」與「殺人」連在一起。</p><p><strong>難處：</strong>它回答了約翰的意思，卻沒有回答會眾真正想問的「魔鬼從哪裡來」。不過這可能正是重點：約翰本來就不打算回答那個問題。</p>"],["除滅＝已經決定性得勝，仍在等候完成","","<p>對「除滅」最普遍的理解是「已然與未然」：基督在十字架上已經決定性地勝過魔鬼——「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝」（西 2:15）；「特要藉著死敗壞那掌死權的，就是魔鬼」（來 2:14），「並要釋放那些一生因怕死而為奴僕的人」（來 2:15）。但最後的完成，要等主再來。</p><p><strong>難處：</strong>若講成「一切已經完成」，人會困惑為甚麼還有苦難；若只講「還沒完成」，又會讓人活在恐懼裡。兩邊都要講，而且要講出對今天的意義：不是我們自己跟魔鬼摔角，是基督在解開。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：魔鬼是受造的、墮落的，不是與神對等的另一位；約翰在意的不是魔鬼的起源，是基督的目的——神的兒子顯現，為要解開、拆毀魔鬼的作為。</strong>本講義採第一說為背景、第二說為本節的主要讀法、第三說為對「除滅」的理解。</p><p>屬靈爭戰的分寸有三條。第一，不輕看：罪有源頭，說謊、毀謗、仇恨、控告是那一家的手藝，約翰說得很嚴肅。第二，不誇大：不把每一次病痛、意外、情緒低落都說成魔鬼作怪；憂鬱症、焦慮症、思覺失調要看醫生，禱告不取代醫療。第三，焦點在基督：拆毀的工作是他做的，而且他已經來了。</p><p>321 的落點是「讓耶穌作王」：不是我們自己跟黑暗摔角，是讓那位已經得勝的王來解開纏了多年的繩子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經沒有告訴我們魔鬼的全部故事，這是刻意的：神沒有要我們研究黑暗，是要我們認識光。你不必弄清楚魔鬼從哪裡來，才能得著基督的釋放。</p><p>該問的是：<strong>我身上有沒有一圈纏了很久的繩子？</strong>一個說不出口的癮，一句從小被罵到大、到今天還相信的話。把它帶到主面前，請他解開；需要的話，也找牧者、醫生或輔導陪你一起走。</p>"]],"con":[],"say":"本講義的立場：魔鬼是受造而墮落的，不是與神對等的另一位；約翰在意的是基督的目的——神的兒子顯現，為要解開、拆毀魔鬼的作為。屬靈爭戰不輕看、不誇大，焦點在已經得勝的基督；禱告不取代醫療。","care":"席上可能有家人被說成「被鬼壓」而延誤就醫的人，有從民間信仰背景出來、對靈界充滿恐懼的新信徒，也有正在服藥治療精神疾病、被教會的人勸停藥的人。不要說「你憂鬱是因為有破口」「吃藥就是不信」。要說：基督已經來了，他在解開；醫生、藥物、輔導都可以是他用來解開的手。"},{"id":"ISS03_4","t":"3:10「魔鬼的兒女」——可以這樣稱呼人嗎？","r":"3:10；約 8:44；弗 2:3","ch":[3],"why":"「魔鬼的兒女」是一個很重的詞。歷史上，基督徒曾拿約翰福音 8:44 和這一節去指控猶太人，造成可怕的迫害；今天教會裡也有人拿它罵反對自己的人、罵離開教會的人，甚至罵還沒信主的家人。這一題要問：約翰說這句話的用途是甚麼？我們可不可以拿它稱呼人？誰會受傷：被貼標籤的人，以及在權柄下不敢發聲的會眾。","pos":[["【一】經文問的是甚麼","","<p>「從此就顯出誰是神的兒女，誰是魔鬼的兒女。凡不行義的就不屬神，不愛弟兄的也是如此」（3:10）。約翰把人分成兩個家：神的兒女、魔鬼的兒女。主耶穌也曾對一群要殺他的人說：「你們是出於你們的父魔鬼」（約 8:44）。</p><p>但保羅說：「我們從前也都在他們中間……本為可怒之子，和別人一樣」（弗 2:3）。會眾會問：約翰是在給我們一張名單嗎？我們可以指著某個人說「他是魔鬼的兒女」嗎？<strong>經文問的是：這個分類的用途是甚麼——是用來認識自己，還是用來審判別人。</strong></p>"],["身分分類說：約翰在描述兩種屬靈的歸屬","","<p>這一說認為約翰是在講一個屬靈的事實：每個人不是屬神，就是屬那惡者，沒有中間地帶。ἐκ τοῦ διαβόλου（出於魔鬼）與 ἐκ τοῦ θεοῦ（從神生）相對，ἐκ 指來源與歸屬。這一說的長處是嚴肅：罪不是中性的習慣，它有一個家譜；人需要從一個家被帶到另一個家。</p><p><strong>難處：</strong>若把「身分」講成固定不變的標籤，就忘了保羅說我們「從前」也是可怒之子；每一個神的兒女，都曾經在另一個家。更危險的是，講台一旦把這個分類交到人手裡，人就會開始替神分類別人。</p>"],["行為記號說：約翰給的是看果子的標準","","<p>約翰在 3:10 給的是兩個可以觀察的記號：行義、愛弟兄。他說「從此就顯出」，重點是「顯出」，是果子讓根顯明。這一說把經文讀成實踐的：不是叫人研究誰的身分，是叫人看見生命會結出甚麼。3:7「不要被人誘惑」說明約翰的用途：讀者不要被一個說得好聽、卻不行義不愛人的教導騙了。</p><p><strong>難處：</strong>看果子的標準若用在別人身上，很快就變成論斷；而且果子需要時間，一次的失敗不能代表一個人的全部。約翰自己也提醒，「我們若說自己無罪，便是自欺」（1:8）。</p>"],["處境警告說：約翰在對付當時的假教師","","<p>這一說認為約翰的對象很具體：那些離開教會、否認耶穌基督成了肉身、輕看罪、不愛弟兄的假教師（2:19、22；4:3）。「魔鬼的兒女」是對這群人的教導與生活所下的判斷，目的是保護留下的信徒不被迷惑。這一說的長處，是把一句很重的話放回它的處境。</p><p><strong>難處：</strong>如果只讀成「說的是當時的別人」，今天的讀者就不必自省了；而這段的「我們」與「小子們」，明明是對教會內的人說的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:10 是真實而嚴肅的分辨標準，但它的用途是自省與分辨教導，不是給人貼標籤；講台與信徒都不可以拿「魔鬼的兒女」稱呼任何具體的人或群體。</strong></p><p>理由有三。第一，約翰給的是標準（行義、愛弟兄），不是名單；用這一節去恨人、罵人，本身就違反了它的第二個標準。第二，每一個神的兒女都曾經是「可怒之子」（弗 2:3），身分的轉變是恩典，不是我們比別人好。第三，歷史上這類經文被拿來迫害猶太人，教會要記得這個傷痕，不再重演。</p><p>所以這一節最好的用法，是轉回自己：我的生命顯出的，是哪一個家的樣子？我愛弟兄嗎？至於分辨教導，約翰給的標準是基督論，全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐懼，但該讓你看清楚。如果你曾被人用這句話罵過——因為你離開了某個教會、質疑了某位領袖、或還沒信主——請知道：那不是約翰的用法，也不是神看你的眼光。</p><p>如果你發現自己心裡常常給人分類，<strong>可以問：我上一次為一位我不喜歡的人禱告，是甚麼時候？</strong>3:10 的後半句是「不愛弟兄的也是如此」——這一節最先要量的，是量的那個人自己。</p>"]],"con":[],"say":"本講義的立場：3:10 是嚴肅的分辨標準——行義、愛弟兄——用途是自省與分辨教導，不是貼標籤。不可以拿「魔鬼的兒女」稱呼任何具體的人、群體、宗派或未信的家人；每一個神的兒女都曾是可怒之子。","care":"席上可能有曾經被前一間教會的領袖罵成「屬魔鬼」的人，有家人還沒信主、被弟兄姊妹說成「拜偶像的魔鬼兒女」而很受傷的人，也有正在質疑某些作法、卻不敢開口的會友。不要在講台上拿這一節影射任何人。要說：約翰要我們用這一節照自己，用愛弟兄來顯明我們是誰的孩子。"},{"id":"ISS03_5","t":"3:12 該隱「屬那惡者」——創世記第 4 章怎樣讀？","r":"3:12；創 4:3--8；來 11:4","ch":[3],"why":"該隱是全聖經第一個殺人的人，3:12 是新約唯一一處明說他「屬那惡者」。創世記本身並沒有直接說該隱為甚麼殺人，也沒有說他的供物錯在哪裡，於是講台上出現各種說法：因為他沒有獻血祭、因為他獻的不是最好的、因為他心不對。這一題要問：約翰怎樣讀創世記第 4 章？我們該怎樣讀？誰會受傷：在家庭衝突中被指為「該隱」的人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「不可像該隱；他是屬那惡者，殺了他的兄弟。為甚麼殺了他呢？因自己的行為是惡的，兄弟的行為是善的」（3:12）。創世記的記載是：耶和華「看中了亞伯和他的供物，只是看不中該隱和他的供物。該隱就大大地發怒，變了臉色」（創 4:4–5）；神警告他：「罪就伏在門前。它必戀慕你，你卻要制伏它」（創 4:7）；然後「該隱起來打他兄弟亞伯，把他殺了」（創 4:8）。</p><p>希伯來書則說：「亞伯因著信，獻祭與神，比該隱所獻的更美」（來 11:4）。<strong>經文問的是：該隱的問題出在哪裡——供物、內心，還是行為？約翰為甚麼在講彼此相愛時，舉這個例子？</strong></p>"],["供物種類說：亞伯獻血祭，該隱獻地裡的出產","","<p>許多傳統講法認為，亞伯獻的是羊群中頭生的，有流血；該隱獻的是地裡的出產，沒有流血。既然「若不流血，罪就不得赦免了」（來 9:22），亞伯的祭預表基督，該隱的祭則是人憑自己的行為來到神面前。這一說的長處，是把故事連到整本聖經的贖罪主題。</p><p><strong>難處：</strong>創世記第 4 章沒有說神要求血祭；後來的律法裡，素祭（穀物）也是蒙悅納的祭。把這一點講成定論，是把後來的神學讀進這段經文。說「這使我們想起」可以，說「這是預表」就超過了經文。</p>"],["供物品質說：亞伯獻頭生的和脂油，該隱只是隨便獻","","<p>經文細節的對比：亞伯獻的是「羊群中頭生的和羊的脂油」（創 4:4），是最好的；該隱只說「地裡的出產」，沒有說是初熟的。所以問題在於獻的態度：一個獻最好的，一個隨便獻。這一說貼近經文的文字，也對今天的敬拜有提醒。</p><p><strong>難處：</strong>這個對比是從經文的「沒有說」推出來的，論證力有限；而且容易把故事講成「奉獻要多、要好」的勸募，偏離了約翰引用的重點。</p>"],["內心與信心說：問題在人，不在祭物","","<p>希伯來書說亞伯是「因著信」獻祭（來 11:4）；神看中的是「亞伯和他的供物」，先提人再提物。神對該隱說「你若行得好，豈不蒙悅納」（創 4:7），問題在該隱這個人。約翰的讀法正是這條線：「因自己的行為是惡的」（3:12）。這一說把焦點放在內心與生命的走向。</p><p><strong>難處：</strong>「內心」看不見，講得不小心會變成各人自由發揮的心理分析；必須守住經文給的線索：信心（來 11:4）、行為（3:12）、神的警告（創 4:7）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採內心與信心說，因為這是新約自己的讀法——該隱的問題在人，不在祭物的種類。</strong>希伯來書看信心，約翰看行為，兩者指向同一件事：該隱的生命方向是惡的，亞伯的是義的。</p><p>約翰在講「彼此相愛」（3:11）時舉這個例子，重點是恨的起點：該隱不是被亞伯傷害，是被亞伯的好刺痛。別人的光照出了我的暗，我不肯改自己，就想除掉那道光——這就是嫉妒。原文 σφάζω 是屠宰的字，新約另外只見於啟示錄，其中好幾處說的是被殺的羔羊；這使我們想起：該隱殺了義人，神的羔羊被殺，為要救殺人的人。</p><p>還有一個常被忽略的細節：神在該隱殺人以前，親自對他說話、警告他；殺人以後，仍然問他「你兄弟亞伯在哪裡」，還給他立了一個記號，免得人殺他。門一直開著。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。創世記沒有交代的細節，各家有不同的推想，這不影響你對神的認識。重要的不是猜出該隱的供物錯在哪裡，而是聽見約翰的警告。</p><p>可以問：<strong>最近有沒有一個人做得好，讓我心裡不舒服？</strong>那份不舒服是門前的警告，不是定罪。把它向神承認，也許為那個人禱告一次，求神祝福他。這樣，嫉妒就失去了它的刀。</p>"]],"con":[],"say":"本講義的立場：該隱的問題在人，不在祭物的種類——希伯來書看信心，約翰看行為。約翰舉該隱，是要我們在嫉妒剛起頭時就警醒；神在罪伏在門前時就對人說話，門一直開著。","care":"席上可能有正和兄弟姊妹為遺產、照顧父母而關係緊繃的人，也有從小被拿來和兄姊比較、心裡藏著苦毒的人。不要用該隱替任何一方定性，說「你們家總有一個是該隱」。要說：嫉妒的根很深，每個人都可能有；把它帶到神面前，也可以找可信的長輩或專業人士協助調解。"},{"id":"ISS03_6","t":"3:15「凡恨他弟兄的，就是殺人的」——心裡的怒氣也是罪嗎？","r":"3:15；太 5:21--22；弗 4:26","ch":[3],"why":"「凡恨他弟兄的，就是殺人的」（3:15）是約翰最重的一句話之一。認真的信徒讀了會害怕：我對某人有怒氣，是不是就失去永生了？更危險的是，這句話常被拿來對受害者說：「你還在生氣，就是殺人的，要馬上放下。」這一題要分清楚：恨與怒氣是不是同一件事？受害者的憤怒該怎樣看？誰會受傷：受過侵害、心裡還在痛的人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「凡恨他弟兄的，就是殺人的；你們曉得凡殺人的，沒有永生存在他裡面」（3:15）。主耶穌在山上也說：「凡殺人的難免受審判」，「只是我告訴你們，凡向弟兄動怒的，難免受審判」（太 5:21–22）。保羅卻說：「生氣卻不要犯罪；不可含怒到日落」（弗 4:26）。主耶穌自己也曾「怒目周圍看他們，憂愁他們的心剛硬」（可 3:5）。</p><p>原文 ἀνθρωποκτόνος（殺人者）在新約只出現在這裡和約翰福音 8:44，主說魔鬼「從起初是殺人的」。ὁ μισῶν（恨的人）是現在分詞。<strong>經文問的是：心裡的恨在神眼中有多重——而它和一般的怒氣、受傷者的憤怒有甚麼不同。</strong></p>"],["等罪說：在神眼中，恨與殺人同罪","","<p>這一說照字面讀：約翰說「就是殺人的」，主耶穌也把動怒與殺人並列。神看人的心，心裡的恨與手上的血在神面前一樣是罪。這一說的長處，是把罪的根挖出來，不讓人以為只要沒動手就是好人。</p><p><strong>難處：</strong>人間的法律與後果明顯不同；把恨與殺人講成在每一方面都完全相等，會失去分寸，也可能讓一個已經心懷怨恨的人覺得「反正一樣，乾脆……」。聖經本身也區分罪的輕重（約 19:11）。</p>"],["根源說：恨是殺人的種子","","<p>這一說認為約翰與主耶穌講的是根與果的關係：殺人不是從刀開始的，是從心裡開始的；恨是種子，殺人是長成的樹。該隱就是例子：先是大大地發怒，變了臉色，神警告他罪伏在門前，最後才是田間的那一擊。這一說既保住了警告，也保住了分寸。</p><p><strong>難處：</strong>若只講「種子」，可能削弱了約翰「就是」的力道，讓人以為恨只是一個尚未成熟的問題，不必急著處理。</p>"],["本質說：恨就是希望對方不存在","","<p>這一說抓住「恨」的本質：恨不是一時的情緒，而是心裡一個定住的願望——「他最好不存在」。這正是殺人的本質，只差在有沒有機會、敢不敢下手。ὁ μισῶν 是現在分詞，描寫一種持續的心志，一個人住在恨裡，把恨當成家。這一說也解釋了下一句：沒有永生存在他裡面，因為生命與這種願望不能同住。</p><p><strong>難處：</strong>必須清楚分辨恨與怒氣，否則每一個生氣的人都會被嚇到；也要分辨受害者面對加害者時的憤怒，那常常是傷口在說話，不是殺人的願望。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：取根源說與本質說——約翰說的恨，是一種定住的心志，心裡希望對方不存在；不是一陣的怒氣，更不是受害者對不義的憤怒。</strong></p><p>聖經沒有說一切怒氣都是罪：主耶穌會發怒，保羅說「生氣卻不要犯罪」。對不義的憤怒，甚至可以是愛的一部分——因為你在乎那個被傷害的人，包括你自己。危險在於「含怒到日落」：讓怒氣住下來，長成一個願望。</p><p>對受害者，本講義要說清楚：你不必假裝不痛、不氣，也不必立刻原諒或和好。把憤怒帶到神面前，讓他作審判者——「伸冤在我，我必報應」（羅 12:19）；同時可以尋求法律的公義與專業的陪伴。原諒是一個過程，交給神；和好需要對方的悔改與安全。愛與界線的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐懼。如果你只是生過氣、甚至現在還在氣，這節經文不是在宣告你失去永生，而是在提醒你：不要讓它住下來。</p><p>可以問：<strong>有沒有一個名字，我一想到就希望他消失？</strong>不必馬上解決，先承認它。告訴神：這份恨太重，我背不動。出死入生的人，不必再住在死的屋子裡。若這份恨來自很深的傷害，請找一位可信的牧者或輔導陪你一起走。</p>"]],"con":[],"say":"本講義的立場：約翰說的恨，是心裡定住的、希望對方不存在的心志，是殺人的根與本質；不是一陣的怒氣，也不是受害者對不義的憤怒。生氣卻不要犯罪——把怒氣帶到神面前，不讓它住下來。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。","care":"席上可能有被性侵、家暴、霸凌過的人，想到加害者仍會發抖、會憤怒；不要對他說「你還在恨，就是殺人的」「快點原諒，不然沒有永生」。要說：你的憤怒神看見了，你可以帶到他面前，也可以尋求保護與公義。也會有心裡藏著多年怨恨、自己都不敢承認的人，要溫柔地邀請他承認，交給神。"},{"id":"ISS03_7","t":"3:16「我們也當為弟兄捨命」——要為傷害我的人捨命嗎？愛有沒有界線？","r":"3:16--18；約 15:13；4:20","ch":[3],"why":"3:16 是全卷最高的愛的定義：「主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命」（3:16）。但這節經文也最容易被拿來傷害人：被家暴的妻子聽到「要像主一樣捨命」，被控制的同工聽到「愛就是忍耐到底」，被性侵的孩子被要求「為了家人的面子不要說」。這一題必須講清楚愛的方向與界線。誰會受傷：正在不安全關係裡的人，以及勸他們留下的人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命」（3:16），緊接著說：「小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上」（3:18）。主耶穌也說：「人為朋友捨命，人的愛心沒有比這個大的」（約 15:13）。下一章還要說：「人若說『我愛神』，卻恨他的弟兄，就是說謊話的」（4:20）。</p><p>會眾會問：要為傷害我的人捨命嗎？愛就是一直忍、一直回到原來的關係嗎？原諒是不是就等於和好？<strong>經文問的是：主捨命的愛有甚麼方向——而「為弟兄捨命」在受傷的關係裡是甚麼意思。</strong></p>"],["無條件順服說：愛就是忍到底、不離開","","<p>這是許多華人教會沒有說出口、卻常常這樣做的講法：愛是捨己，捨己就是不計較、不反抗、不離開；「凡事包容，凡事忍耐」，所以被打要忍，被控制要順服，為了見證、為了孩子、為了教會的名聲，不要張揚。它引的是真實的經文，也看重了愛的代價。</p><p><strong>難處：</strong>主捨命是為了救人脫離罪，不是為了讓罪繼續傷人。讓加害者繼續施暴，不是愛他，是讓他在罪中越陷越深；讓受害者留在危險裡，更不是愛。這個講法已經在教會裡造成許多真實的傷害，本講義不採用。</p>"],["愛有界線說：愛要在誠實上，誠實包括說不","","<p>這一說抓住 3:18 的「誠實」：原文 ἀλήθεια 不只是「真心」，是在真實裡。誠實的愛不演戲，有時要說出真相、說「不」、設下界線。主耶穌自己也有界線：他離開要推他下山崖的人，躲避要提早捉拿他的人；他捨命是自己捨的——「沒有人奪我的命去，是我自己捨的」（約 10:18）——不是被人奪去的。</p><p><strong>難處：</strong>界線若被講成自我保護的口號，可能變成拒絕一切付出、逃避一切不舒服的藉口。約翰的命令仍然是真實的：要捨，要付代價，要在行為上愛人。</p>"],["原諒與和好分開說","","<p>這一說區分兩件事：原諒是我在神面前放下報復的權利，把審判交給他；和好是兩個人的關係恢復，需要對方真實的悔改、行為的改變與安全的保障。主教導「倘若你的弟兄得罪你，你就去……指出他的錯來」（太 18:15），和好是一個有程序、有真相的過程。保羅也說「若是能行，總要盡力與眾人和睦」（羅 12:18）——「若是能行」承認有時不能。</p><p><strong>難處：</strong>這個區分需要時間與陪伴才能走，不能變成講台上一句輕鬆的口訣；受傷的人也可能需要很久才能談原諒，不能被催促。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：主捨命的愛是主動的、有方向的——為了救人脫離罪，為了對方真正的好；為弟兄捨命，不等於留在不安全的關係裡，更不是讓罪繼續傷人。</strong>愛要在行為和誠實上；原諒交給神，和好需要對方的悔改與安全。</p><p><strong>家暴、性侵、虐待，要鼓勵當事人向可信的人與相關機構求助；涉及刑事，建議報警。</strong>教會不可以為了名聲隱瞞，不可以要求受害者「先原諒、再處理」，也不可以讓加害者在未經處理下繼續擔任服事。保護受害者，正是 3:18「在行為和誠實上」的愛。</p><p>那麼「為弟兄捨命」落在哪裡？大多數人一生不會被要求真的替人去死，但捨命可以一點一點地捨：捨一個晚上陪剛失業的弟兄，捨一份面子先去道歉，捨一筆錢讓別人的孩子交得起學費——約翰自己下一節就把捨命落到錢包上。321 的落點：謙卑不是讓人踐踏，是回到本位——讓神作審判者，讓自己作被愛的人。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你以為神要你留在危險裡。如果你正在一段讓你害怕的關係裡，愛的第一步可能是離開危險、告訴一個可信的人、聯絡求助專線；這不違背 3:16，正是主捨命所要救你脫離的。</p><p>如果你是安全的，<strong>可以問：這一週，我可以為哪一位弟兄姊妹，捨下一點甚麼？</strong>一個晚上、一份面子、一筆錢。主先捨，我們才學著捨；這樣的捨，是把自己倒給主，不是讓人把你榨乾。</p>"]],"con":[],"say":"本講義的立場：主捨命的愛是主動、有方向的，為了救人脫離罪；為弟兄捨命，不是留在不安全的關係裡。愛要在行為和誠實上，原諒交給神，和好需要悔改與安全；家暴、性侵、虐待要向可信的人與機構求助，涉及刑事建議報警。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。","care":"席上可能有正在被配偶毆打、卻被長輩勸「為了孩子要忍」的姊妹，有被教會領袖控制或性騷擾、不敢說出來的弟兄姊妹，也有曾經被要求「先原諒加害者」的受害者。不要說「主為你捨命，你也要為他捨」「報警會羞辱主的名」。要陪他到安全的地方，協助聯絡專業機構，必要時報警；原諒的事，交給神慢慢做。"},{"id":"ISS03_8","t":"3:17「看見弟兄窮乏」——基督徒的財物要怎樣對待窮乏的弟兄？","r":"3:17；雅 2:15--16；徒 4:32--35","ch":[3],"why":"3:17 把愛落到錢包上，是全卷最具體的一節。它同時面對兩種誤用：一種是把它講成募款的壓力，「你不認獻就是塞住憐恤的心」；一種是把它講空，「我為他禱告就是愛了」。華人教會也常在「該不該借錢給弟兄」「接濟會不會養懶人」之間拉扯。這一題要問：基督徒的財物要怎樣對待窮乏的弟兄？誰會受傷：經濟困難卻不敢開口的家庭，和被罪疚壓著奉獻的人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「凡有世上財物的，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能存在他裡面呢？」（3:17）雅各也說：「若是弟兄或是姊妹，赤身露體，又缺了日用的飲食；你們中間有人對他們說：『平平安安地去吧！願你們穿得暖，吃得飽』，卻不給他們身體所需用的，這有甚麼益處呢？」（雅 2:15–16）初代教會更是「沒有一人說他的東西有一樣是自己的，都是大家公用」（徒 4:32）。</p><p>原文「財物」是 βίος，過日子要用的東西，和 2:16「今生的驕傲」同一個字；「看見」是 θεωρέω，看清楚了；「塞住」是關上。<strong>經文問的是：看見弟兄窮乏時，信徒的財物該怎樣流動——要給到甚麼程度，又要怎樣給。</strong></p>"],["凡物公用說：初代教會是教會經濟的榜樣","","<p>這一說認為使徒行傳 4 章是教會的理想：「人人將田產房屋都賣了，把所賣的價銀拿來，放在使徒腳前，照各人所需用的，分給各人」（徒 4:34–35）。3:17 的要求是同一個精神：有的要與沒有的分享，教會內不該有人缺乏。歷史上許多修道團體與某些宗派以此為生活方式。</p><p><strong>難處：</strong>使徒行傳 5 章彼得對亞拿尼亞說：「田地還沒有賣，不是你自己的嗎？既賣了，價銀不是你作主嗎？」（徒 5:4）——財產私有並沒有被廢除，凡物公用是自願的。把它講成強制的標準，容易被濫用來控制信徒的財產。</p>"],["個人憐恤說：重點是心不關門，給多少由人自己決定","","<p>這一說把重點放在「塞住憐恤的心」：約翰責備的不是給得不夠多，是看見了卻關門。給多少、怎樣給，由各人照能力決定——「各人要隨本心所酌定的，不要作難，不要勉強」（林後 9:7）；「乃是照他所有的，並不是照他所無的」（林後 8:12）。這一說保護了個人的自由，也防止奉獻變成壓力。</p><p><strong>難處：</strong>若只講「心」，很容易變成只有感覺、沒有行動；約翰下一節就說「不要只在言語和舌頭上」（3:18）。「我心裡很同情他」不能取代一袋米。</p>"],["教會互助說：個人與群體一起承擔","","<p>這一說認為新約的模式是個人憐恤加上群體的安排：初代教會設立執事照顧寡婦（徒 6 章），保羅為耶路撒冷的窮人募捐（林後 8–9 章），又提醒「有了機會就當向眾人行善，向信徒一家的人更當這樣」（加 6:10）。同時也有分辨：「若有人不肯做工，就不可吃飯」（帖後 3:10）；照顧家人是首要的責任（提前 5:8）。</p><p><strong>難處：</strong>制度化的互助若沒有愛，會變成冷冰冰的申請流程，讓窮乏的人感到羞辱；分辨若過了頭，也會成為一律關門的藉口。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:17 要求的是一顆不關門的心，落實在具體的行動上；給多少照各人所有的，不勉強，也不以分辨為藉口一律關門。教會應當同時有個人的憐恤與群體的互助。</strong></p><p>三個分寸。第一，3:17 說的是「看見弟兄窮乏」，是具體的人、具體的缺乏，不是一般性的募款；講台不可以用這一節為建堂、為事工施壓。第二，分辨是需要的，但分辨的目的是讓幫助真正有益，不是保護自己的錢包；有時最好的幫助不是給錢，是陪他找工作、找社福資源。第三，接受幫助不羞恥；教會要建立安靜、有尊嚴的互助管道，讓窮乏的人不必在台前開口。</p><p>經文講完，321 在末端認出 920 的樣子：對身邊那一個人，在行為和誠實上去愛。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你被罪疚壓垮。如果你自己正在經濟困難裡，這一節不是在責備你捐得不夠，你也是 3:17 裡那位該被看見的弟兄。接受弟兄姊妹的幫助，是讓他們有機會愛。</p><p>如果你有餘力，<strong>可以問：最近我看見了誰的缺乏，卻把門關上了？</strong>想一個名字，想一件具體的事，這一週去做。不必告訴別人；那位看見的父，看見了。</p>"]],"con":[],"say":"本講義的立場：3:17 要求的是看見窮乏時不關門的心，落實在具體的行動上；給多少照各人所有的，不勉強，分辨不可成為一律關門的藉口。這一節不是募款工具；教會應有個人憐恤與群體互助，讓接受幫助的人保有尊嚴。","care":"席上可能有剛失業、付不出房租卻不敢說的家庭，有單親、有長期病痛、醫藥費壓得喘不過氣的人，也有被反覆要求認獻、已經入不敷出的弟兄姊妹。不要說「不奉獻就是不愛神」，也不要當眾點名誰需要幫助。要建立安靜的互助管道，讓有需要的人可以私下開口，讓給的人也照所有的、甘心地給。"},{"id":"ISS03_9","t":"3:20「神比我們的心大」——心一直責備自己的人，怎樣在神面前安穩？","r":"3:19--22；羅 8:1；羅 8:33--34","ch":[3],"why":"3:19–22 是寫給失眠的人的經文。有些人的心像一個從不下班的檢察官：做錯一件事，可以在心裡審自己十年；反覆認罪，仍不確定神有沒有赦免。他們讀到 3:9 最先受傷，讀到 3:18 最先覺得自己不夠。這段經文怎樣讀，直接決定他們是得安慰，還是被加上一層控告。誰會受傷：自責、良心過敏、有宗教性強迫症狀的人。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「從此就知道我們是屬真理的，並且我們的心在神面前可以安穩。我們的心若責備我們，神比我們的心大，一切事沒有不知道的。親愛的弟兄啊，我們的心若不責備我們，就可以向神坦然無懼了」（3:19–21）。保羅也說：「如今，那些在基督耶穌裡的就不定罪了」（羅 8:1）；「誰能控告神所揀選的人呢？有神稱他們為義了」（羅 8:33）。</p><p>原文「安穩」是 πείσομεν，「說服、安撫」；「責備」是 καταγινώσκω，字面是「知道不利的事」，就是定罪。<strong>經文問的是：「神比我們的心大」是警告還是安慰——一顆一直控告自己的心，怎樣在神面前安穩下來。</strong></p>"],["警告讀：神比我們的心更嚴","","<p>古來有人這樣讀：連我們自己的心都定我們的罪，神比我們的心更大、知道得更多，他的審判必定更重。這一說的長處，是嚴肅看待良心的聲音，不讓人輕易把不安關掉；神確實「一切事沒有不知道的」，包括我們藏起來的事。</p><p><strong>難處：</strong>它與上下文不合：前一句說「我們的心在神面前可以安穩」（3:19），後一句說「坦然無懼」（3:21），約翰要說服的心，是被安撫，不是被嚇。而且這個讀法會把本來就自責的人推得更深，正好與約翰全卷要給的確據（5:13）背道而馳。</p>"],["安慰讀：最後判斷的是神，不是我們的心","","<p>今天多數註釋家採這一讀：我們的心會控告，但最後說話的不是我們的心，是神；他知道一切，包括我們的罪，也包括我們對他的愛、我們在黑夜裡的眼淚、我們想回頭的那份心。彼得三次不認主以後，只能說：「主啊，你是無所不知的；你知道我愛你」（約 21:17）——他不能拿自己的表現作證，只能拿主的知道作證。</p><p><strong>難處：</strong>若講得太快，會被拿來安撫一個刻意不悔改的良心：「神比你的心大，不安就不必理。」所以約翰把安慰給的是「屬真理的」（3:19）人——就是在行為和誠實上回應愛的人。</p>"],["良心分辨說：良心是好的僕人，不是最高的法官","","<p>這一說從牧養的角度補充：良心是神放在人裡面的提醒，需要被尊重，卻不是絕對可靠；它可能太遲鈍，也可能太敏感，可能被聖靈喚醒，也可能被創傷、家庭、文化扭曲。所以 3:20 的意思是：良心要被帶到神面前，由那位比它更大的神來校正——該認的罪，照 1:9 認；已經認過的、已經被赦免的，不必再審。</p><p><strong>難處：</strong>這一說需要智慧與陪伴才能落實；有些反覆的自責屬於宗教性強迫症狀或創傷反應，不是靠一次講道或一句經文就能解決，需要醫療與專業輔導。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採安慰讀，吸收良心分辨說——神比我們的心大，最後說話的是他，不是我們的心；這安慰是給屬真理的人，就是在行為和誠實上回應愛、願意在光中認罪的人。</strong></p><p>對自責的人，本講義要說三件事。第一，心責備你，不等於神責備你；「在基督耶穌裡的就不定罪了」（羅 8:1）。第二，自責與良心過敏不是信心不夠，有時是需要被醫治的傷，禱告不取代醫療與輔導。第三，安穩的根據不是你終於覺得自己夠好了，是神知道一切，而他仍然叫你作兒女（3:1）。</p><p>對良心已經麻木的人，這段也有提醒：安慰給的是屬真理的人。依著神的意思憂愁，「就生出沒有後悔的懊悔來，以致得救」（林後 7:10）。321 的落點是「用心靠聖靈」：用心，是不逃避良心的聲音；靠聖靈，是讓那位比我們的心更大的神說最後一句話。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你常常被自己的心控告，這段經文是寫給你的：神沒有比你的心更兇，他比你的心更大。你的心記得你的罪，他也記得——而且他記得十字架。</p><p>今晚若心又開始審你，<strong>可以問：這件事，我已經照 1:9 向神認過了嗎？</strong>若還沒有，現在就認；若已經認過，就把它交給那位「一切事沒有不知道的」神，說：你知道一切。然後安心睡覺。若這種審判已經持續很久、影響睡眠與生活，請找醫生或輔導，那也是神的幫助。</p>"]],"con":[],"say":"本講義的立場：「神比我們的心大」是安慰——最後說話的是神，不是我們的心；他知道我們的罪，也知道我們的愛。這安慰給的是屬真理的人；自責與良心過敏不是信心不夠，禱告不取代醫療與輔導。","care":"席上有反覆認同一件罪、仍然睡不著的人，有從小在嚴厲責罵中長大、內心永遠有個聲音說「你不夠好」的人，也有可能患有宗教性強迫症的弟兄姊妹。不要說「你一直覺得被定罪，就是信心不夠」「神早就赦免了，你還在想就是不信」。要說：神比你的心大；也陪他找醫生、找輔導，讓神藉著這些手醫治他。"},{"id":"ISS04_1","t":"4:1「試驗那些靈」——怎樣分辨？靈恩、預言與先知恩賜怎麼看？","r":"4:1--6；帖前 5:19--21；林前 12:10","ch":[4],"why":"華人教會在這一題上常常兩極：有的教會一聽到「預言」「異象」就緊張，凡是說「神感動我」的都當成可疑；有的教會把每一句「主給我一句話」都當成神諭，甚至用它來決定婚姻、工作與奉獻。夾在中間受傷的，是被一句「預言」綁住多年的人，以及因為有過屬靈經歷而被當成異類的人。4:1 是分辨的根本經文，必須讀出約翰真正給的標準。","pos":[["【一】經文問的是甚麼","","<p>「親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於神的不是，因為世上有許多假先知已經出來了」（4:1）。約翰接著給了一個標準：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）。保羅也有同樣的平衡：「不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗；善美的要持守」（帖前 5:19--21），而且「辨別諸靈」本身就是聖靈所賜的恩賜（林前 12:10）。</p><p>會眾會問三件事：①今天還有先知、預言這類恩賜嗎？②如果有，要怎樣分辨？③有人對我說「神告訴我你應該……」，我要聽嗎？<strong>經文問的不是「有沒有屬靈經歷」，而是「這一個聲音的源頭是不是神」。</strong></p>"],["終止論：先知與啟示性恩賜已經隨使徒時代結束","","<p>許多改革宗與時代論傳統認為，新約正典完成之後，帶著啟示性質的先知恩賜已經停止；今天的「預言」頂多是講道與勸勉。4:1 的試驗，在今天主要就是用聖經檢驗一切教導。這一說的長處是高舉聖經的充足，保護會眾不被層出不窮的「新啟示」牽著走。</p><p><strong>難處：</strong>新約並沒有一節經文明說這些恩賜何時停止；「不要藐視先知的講論」（帖前 5:20）是對一般教會說的。若講得太硬，會讓有過真實屬靈經歷的弟兄姊妹被懷疑、被排擠，也可能把聖靈的引導縮小成只剩下頭腦的工作。</p>"],["延續論：恩賜仍在，但一切預言都要受檢驗","","<p>五旬宗、靈恩派與許多福音派認為，聖靈的恩賜今天仍在運行；新約的預言是「造就、安慰、勸勉人」（林前 14:3），不是在聖經之外另立正典。正因為恩賜仍在，才更需要 4:1 的試驗，保羅也說「其餘的就當慎思明辨」（林前 14:29）。這一說的長處是對聖靈的工作保持開放，也正視約翰說的「試驗」預設了今天仍有需要被試驗的發言。</p><p><strong>難處：</strong>實際操作上，「試驗」常被省略，一句「主告訴我」就壓過了長執會、壓過了當事人的良心，甚至壓過了聖經；有人因為一句婚姻預言多年不敢離開危險的關係，或不敢接受另一段合宜的婚姻。延續論若沒有清楚的檢驗機制，很容易變成屬靈操控。</p>"],["謹慎開放：不禁止，不神化，以基督與聖經為準","","<p>許多宗派採取中間的立場：不武斷說恩賜已經停止，也不把任何現代預言放在聖經的層次；任何「神的話」都要經過幾道檢驗——它高舉的是不是成了肉身的耶穌基督（4:2）？它合不合聖經？它結出的果子是愛與安靜，還是懼怕與混亂（「神不是叫人混亂，乃是叫人安靜」，林前 14:33）？它有沒有在群體中被印證，而不是由一個人說了算？</p><p><strong>難處：</strong>這一說被批評「兩邊都不得罪」，在具體事件上仍需要判斷；而且它的檢驗機制要靠成熟的領袖與健康的群體，在缺少這兩樣的地方，它可能退化成兩個極端之一。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：在先知恩賜是否延續的問題上，本講義不裁判宗派之爭，採取謹慎開放；但 4:1 的試驗對每一個傳統都有效，而約翰給的第一個標準是基督論——認不認耶穌基督是成了肉身來的。</strong></p><p>具體說，一句「神的話」要過四道門：①它讓耶穌更清楚，還是更模糊？②它和聖經作對嗎？聖靈的引導不會和聖經作對。③它是在群體中被印證，還是只有一個人說了算？④它帶來的是被愛的安靜，還是被控制的懼怕？任何人都不可用「預言」決定別人的婚姻、財務，或要求人留在不安全的地方。</p><p>同時，分辨不是獵巫。δοκιμάζω 是驗金子的字，是為了認可而試；約翰不叫我們在新聞裡找誰是假先知，也不叫我們把「敵基督」貼在任何政治人物、國家或宗派身上。他在一世紀就說「如今是末時了」（2:18），每一代都要試驗，沒有一代被授權去算日子。</p>"],["【四】這件事該不該影響你的信心","","<p>宗派對恩賜的看法不同，不該影響你的信心；不論哪一個傳統，真正的聖靈都在高舉同一位耶穌。</p><p>但有一件事該問：<strong>我是靠一個人的「感動」在過信仰生活，還是靠那位成了肉身的主與他的話？</strong>如果你曾被一句「預言」綁住、害怕不照著做會受懲罰，你可以把它帶回聖經與耶穌面前重新試驗。那在你裡面的，比那在世界上的更大（4:4）。</p>"]],"con":[],"say":"本講義的立場：恩賜是否延續不在本卷裁判，但每一句「神的話」都要試驗：是否高舉成了肉身的耶穌、是否合乎聖經、是否在群體中被印證、是否帶來安靜而非控制；不點名、不算日子、不貼標籤。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。","care":"會眾席上可能有人多年前被一句「預言」說中了婚姻或疾病，從此活在不安裡；也可能有人有過真實的屬靈經歷，卻在教會裡不敢說。不要嘲笑任何一方，也不要說「你不照神給你的話去做就會受咒詛」。陪他把那句話帶回經文與群體去試；若有人用「神的話」控制他的財務、婚姻或人身，要協助他離開那個控制，必要時尋求專業協助。"},{"id":"ISS04_2","t":"4:3 是「不認耶穌」還是「分解耶穌」？","r":"4:2--3；2:22--23","ch":[4],"why":"這是本章唯一牽涉到經文異文的題目。有人在網上讀到「古卷作『分解耶穌』」，便懷疑和合本譯錯了，甚至懷疑聖經到底可不可信；也有人反過來把「分解耶穌」當成更屬靈、更深奧的版本來講。這一題要誠實交代證據，也要讓會眾知道：異文不動搖信仰的核心，反而讓我們更看清約翰在爭甚麼。","pos":[["【一】經文問的是甚麼","","<p>4:3 和合本作「凡靈不認耶穌，就不是出於神」。SBLGNT 與 WH、Treg、NA28 作 μὴ ὁμολογεῖ τὸν Ἰησοῦν（mē homologei ton Iēsoun）「不承認那位耶穌」；拜占庭傳統（RP）少了冠詞，並補上 Χριστὸν ἐν σαρκὶ ἐληλυθότα，與 4:2 對齊。另外有一個讀法 λύει τὸν Ἰησοῦν（lyei ton Iēsoun）「分解耶穌」「拆散耶穌」，這是 SBLGNT 附錄裡看不到的讀法。</p><p>經文要問的是：①約翰原來寫的是哪一個？②如果是「不認」，「分解」這個讀法從哪裡來？③兩個讀法對今天的分辨有甚麼不同？</p>"],["「不認」說：μὴ ὁμολογεῖ 是原文","","<p>今天絕大多數校勘本與譯本都採「不認」。理由是外證：所有現存的希臘文抄本都以某種形式的 ὁμολογεῖ 來讀這一節，沒有一份希臘文抄本的正文寫作 λύει。內證也支持：4:2 剛說「凡靈認」，4:3 說「凡靈不認」，正反對稱，是約翰慣用的筆法（參 2:22--23「不認子的，就沒有父；認子的，連父也有了」，2:23）。和合本、新譯本、多數英文譯本都照這個讀法。</p><p><strong>難處：</strong>μὴ 加直說語氣在古典希臘文裡不太尋常，有學者認為這個略顯生硬的語法，反而可能是後來抄寫者「修順」的痕跡，因此不排除另有更早的形式；而且「不認」比較籠統，沒有像「分解」那樣說出錯誤的具體內容。</p>"],["「分解」說：λύει 保存了更早的讀法","","<p>少數學者（例如二十世紀有幾位德國學者）認為「分解耶穌」才是原文，因為它是「較難的讀法」，抄寫者比較可能把它改成與 4:2 對稱的「不認」，而不是反過來。這個讀法的見證主要來自拉丁傳統與早期教父：愛任紐著作的拉丁譯本、俄利根的引用，以及武加大譯本的 solvit（分解）。它也準確描寫了當時的錯誤——把「屬天的基督」和「人耶穌」拆開。</p><p><strong>難處：</strong>λύει 沒有希臘文抄本直接支持，只能靠譯本與教父引用；而早期教父在引用時本來就常帶著解釋，很可能是在「說明」這一節反對的是甚麼，而不是在抄寫原文。它更像一個古老而精準的註解，而不是約翰的原話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：本講義採 μὴ ὁμολογεῖ（不認），與和合本一致。</strong>外證強烈支持這個讀法；λύει 沒有希臘文抄本直接支持，主要來自愛任紐拉丁譯本、俄利根與武加大譯本 solvit。</p><p>但 λύει 雖不是原文，卻是一個很好的提醒：約翰反對的那種「不認」，不是完全不提耶穌，而是把耶穌拆開——要屬天的基督，不要有血有肉的耶穌；要能力，不要十字架。照教會的傳統，當時的錯誤（相傳與克林妥有關）就是這樣拆的。約翰在約貳也用同一個標準：「他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的」（約貳 1:7）。</p><p>所以分辨的時候，可以問兩個問題：這篇道「認」耶穌嗎？它有沒有把耶穌「拆開」？</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你的信心。新約的異文大多是拼字、語序、冠詞的差別；這一處算是比較有份量的，但兩個讀法講的是同一件事——不承認成了肉身的耶穌，就不是出於神。沒有任何一項基督教的基本信仰，是靠這一個字撐起來的。</p><p>反倒是這個異文讓我們更確知：從一世紀起，教會就一直在守護同一個核心——道成了肉身。你手上的和合本，在這一節忠實地照著最好的證據翻譯。</p>"]],"con":[],"say":"本講義的立場：採 μὴ ὁμολογεῖ「不認耶穌」，與和合本一致；λύει「分解耶穌」沒有希臘文抄本直接支持，主要來自愛任紐拉丁譯本、俄利根與武加大譯本 solvit，可視為說明錯誤性質的古老註解。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。","care":"會眾席上可能有理性型、愛查考的弟兄姊妹，也可能有剛信主、一聽到「抄本不同」就心慌的人。講台不需要詳述校勘細節，但不要迴避；可以簡單說明證據，然後把焦點帶回成了肉身的耶穌。對心慌的人，要讓他知道：教會兩千年來守的，正是這一位不被拆開的主。"},{"id":"ISS04_3","t":"4:4「那在你們裡面的，比那在世界上的更大」——屬靈爭戰要怎樣面對懼怕？","r":"4:4；5:18--19；弗 6:10--12","ch":[4],"why":"華人教會對屬靈爭戰的態度差異很大：有人完全不談魔鬼，好像屬靈世界只是比喻；有人把失眠、生病、夫妻吵架、孩子叛逆都說成「邪靈攻擊」，天天活在驚恐裡。兩種人都會受傷——前者在真實的試探前毫無防備，後者被懼怕吞吃，甚至延誤就醫。4:4 是一句叫人放心的話，常被講成叫人緊張的話。","pos":[["【一】經文問的是甚麼","","<p>「小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大」（4:4）。「勝了」νενικήκατε 是完成式：不是「要努力去勝」，而是「已經勝了」。約翰在同一卷也說「全世界都臥在那惡者手下」（5:19），又說「從神生的必保守自己，那惡者也就無法害他」（5:18）。保羅則說「我們並不是與屬血氣的爭戰」（弗 6:12），要「靠著主，倚賴他的大能大力作剛強的人」（弗 6:10）。</p><p>經文要問的是：屬靈爭戰是真實的嗎？如果是，信徒要用甚麼心態面對？<strong>4:4 的重點是爭戰本身，還是那位更大的？</strong></p>"],["權能對抗說：以宣告、斥責與釋放事工積極爭戰","","<p>許多靈恩與第三波運動的教會，強調信徒有權柄斥責邪靈，提倡屬靈地圖、地域性邪靈、宣告與釋放事工；4:4 被讀成信徒權柄的宣言。這一說的長處是認真看待新約裡真實的屬靈世界——耶穌確實趕鬼，保羅也說要「抵擋魔鬼的詭計」（弗 6:11）——並且相信基督已經得勝。</p><p><strong>難處：</strong>若沒有節制，它容易把一切難處都歸因於邪靈，讓人忽略醫療、心理、關係與自己該負的責任；也可能把信徒養在高度警戒裡，看甚麼都像攻擊。新約對魔鬼的描寫是真實的，但篇幅遠少於對基督的高舉；4:4 要人看的是那位「更大的」，不是那位較小的。</p>"],["去神話說：魔鬼是象徵，爭戰是社會與心理的","","<p>一部分自由派與現代神學傾向把「那惡者」「世界」讀成象徵：指罪惡的社會結構、人心的黑暗、群體的偏見。這一說的長處是提醒我們，邪惡也會藏在制度與文化裡，不只是個別的「鬼」；它也避免了把每一件事都靈異化。</p><p><strong>難處：</strong>這不是約翰的世界觀。約翰說魔鬼「從起初就犯罪」（3:8），神的兒子顯現是要除滅他的作為；福音書裡耶穌面對的也是真實的敵對勢力。把屬靈爭戰完全去神話，會讓信徒在真實的試探與控告面前失去經文給的保護與確信。</p>"],["基督得勝說：爭戰真實，但信徒站在已得勝的基督裡","","<p>許多福音派傳統認為，屬靈爭戰是真實的，但它的中心不是技巧，而是位置：基督已經「仗著十字架誇勝」（西 2:15），信徒在他裡面，所以爭戰的方式是順服神、持守真理、禱告、在群體中彼此扶持；「務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（雅 4:7）的前一句是「你們要順服神」（雅 4:7）。</p><p><strong>難處：</strong>這一說在面對嚴重的屬靈困擾時，有時被批評太「溫和」，缺少具體的牧養方法；在實務上，仍需要成熟的同工分辨，何時是屬靈問題、何時是醫療問題、何時兩者都有，必要時與醫療及心理專業合作。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：屬靈爭戰是真實的，但 4:4 的重點不在爭戰，而在那位更大的。信徒面對屬靈爭戰的基本姿態，是確信，不是驚恐。</strong>約翰說「已經勝了」，理由不是信徒膽子大，而是「那在你們裡面的」更大——照 3:24 與 4:13，約翰常把這個同在和神所賜的聖靈連在一起講。</p><p>所以分辨不是出於懼怕，是出於確信；爭戰也不是靠技巧，是靠住在他裡面。實際上，不把每一件難處都歸給邪靈：失眠、憂鬱、疾病，要看醫生；婚姻衝突，要誠實面對關係裡的責任；同時也不輕看禱告、神的話與群體扶持的力量。這兩者不是二選一。</p><p>這也接上 4:18：一個天天怕被攻擊的人，其實還活在懼怕裡；愛既完全，就把懼怕除去。</p>"],["【四】這件事該不該影響你的信心","","<p>對屬靈爭戰的看法有許多派別，這些討論不該動搖你的信心。約翰給「小子們」的不是一套方法，是一句話：你們是屬神的。</p><p>但該問：<strong>我面對看不見的世界，是被懼怕牽著走，還是知道那更大的一位住在我裡面？</strong>如果你常常害怕被攻擊、睡不著，請把 4:4 慢慢唸幾次；也請告訴一位可信任的人，必要時就醫。安靜的確信，比大聲的宣告更是得勝的記號。</p>"]],"con":[],"say":"本講義的立場：屬靈爭戰是真實的，但 4:4 的重點是那位更大的；信徒的姿態是確信而非驚恐，不把一切難處都歸給邪靈，禱告與就醫、面對關係責任不是二選一。","care":"會眾席上可能有人曾被說成「被鬼附」而受到傷害，也可能有人正被奇怪的恐懼困擾、夜裡不敢關燈。不要嘲笑他，也不要立刻替他「趕鬼」。先聽、先陪，留意是否有醫療或心理的需要，必要時協助轉介；同時陪他讀 4:4 與 4:18，讓他知道住在他裡面的那一位更大。"},{"id":"ISS04_4","t":"4:8「神就是愛」——那審判與忿怒呢？「愛就是神」對不對？","r":"4:8；4:16；1:5；約 3:36","ch":[4],"why":"「神就是愛」是華人社會最熟悉的一句經文，也最常被誤用。有人用它推論神不會審判任何人，一切宗教、一切選擇都一樣好；也有人在教會裡只聽見審判與忿怒，從小怕神，覺得「神就是愛」只是一句漂亮話。前者失去了聖潔，後者失去了恩典；兩者都需要被這一節重新校準。","pos":[["【一】經文問的是甚麼","","<p>「神就是愛」在本章出現兩次（4:8、16）。原文 ὁ θεὸς ἀγάπη ἐστίν，主詞「神」有冠詞，「愛」沒有冠詞，是述詞，說的是神的本性。同一位約翰也說「神就是光，在他毫無黑暗」（1:5），又在福音書記下「不信子的人得不著永生……
