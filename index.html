<title>321約翰一書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){

  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){

}, 8000);
</script>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"神就是光","sub":"摸、光、認","lv":"A","arc":"光","sec":[["1:1--4","我們所聽見、所看見、親手摸過的：生命之道與相交"],["1:5--7","神就是光：在光明中行，彼此相交"],["1:8--10","我們若認自己的罪：信實的，公義的"]],"serm":{"pts":[["親手摸過","1:1--4","「親眼看過、親手摸過的」——信仰不是我們想出來的一套道理，是我們碰到的一個人；約翰寫信的目的，是要叫人進入相交，喜樂充足"],["神就是光","1:5--7","「神就是光，在他毫無黑暗」——光不是叫人躲起來，是叫人走出來；在光明中行的人彼此相交，耶穌的血洗淨一切的罪"],["若認自己的罪","1:8--10","「我們若認自己的罪，神是信實的，是公義的」——三次「若說」是嘴上的，一次「若認」是回到本位；回到本位的人，遇見的是信實公義、必要赦免的神"]]},"q":"凌晨一點，手機螢幕還亮著。你刪掉了瀏覽紀錄，關了燈，躺在床上，心裡那個熟悉的聲音又來了：信主都十幾年了，怎麼還是這樣？明天早上是線上禱告會，你已經想好要說「最近還好」。\n也許你的黑暗不是這一種。也許是一句說出去收不回來的話，一筆一直沒有講清楚的帳，或是一段你從來不敢在小組裡提的往事。你不是不信神，你只是越來越會躲。\n這一章要問的是：神就是光，那麼像我這樣的人，走到光裡，是要被揭穿，還是可以被接住？","truth":"「神就是光，在他毫無黑暗」（1:5）；光不是為了揭穿我們，是為了叫我們走出來。\n「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（1:9）；赦免的把握不在我們認得多徹底，在他守住自己的應許，而耶穌的血洗淨我們一切的罪（1:7）。","mv":{"t":"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。","r":"約壹1:9"},"card":["全卷五個字「光・住・兒・愛・勝」，第一章是光。約翰沒有問安，一開口就伸出手：我們親手摸過的那一位，是真的。他寫信不是要人多知道一點，是要人進入相交——先與父和子，再彼此；喜樂要等大家都回到桌前才充足。接著是光：神毫無黑暗，光不是叫人躲，是叫人走出來。最後是三次「若說」與一次「若認」：替自己辯護的人把真理關在門外，回到本位的人遇見信實公義的神。","這一章的主詞，越讀越是神。生命「已經顯現出來」（1:2），是神自己走下來讓人看見，不是人爬上去找到他；神就是光，在他毫無黑暗（1:5）；他兒子耶穌的血正在洗淨我們一切的罪（1:7）；他是信實的，是公義的，必要赦免、洗淨（1:9）。連我們能夠彼此相交，也是因為先有「與父並他兒子耶穌基督」（1:3）的相交。人在這一章只做一件事：不再用嘴替自己辯護，用嘴說出神早已說過的話。","1:9 的「認」，原文 ὁμολογέω（homologeō），由「相同」和「說」組成：說一樣的話。本卷也用同一個字說「認」耶穌基督是成了肉身來的（4:2）。認罪不是把自己罵到一文不值，也不是寫一份長長的悔過書；是神說這是罪，我也說這是罪。這改變今天的讀法：認罪的重心不在我的情緒夠不夠痛，在我的話終於和神的話一致。不再換名字，不再找理由，然後把結果交給那位信實的神。","小組分享時間輪到你，你說：「最近還好，就是有點忙。」這句話很安全，沒有一個字是假的，也沒有一個字是真的。這一章照出來的有己，就藏在這種很會說話的嘴裡：「我個性就是這樣」「比起某某，我算不錯了」。三次「若說」都是嘴上的功夫；只有一次「若認」，是把嘴交還給光。","全章最該被記住的，是 1:9 的主詞換了。前半句是「我們若認」，後半句立刻變成「神是信實的，是公義的」。我們以為赦免掛在自己認得夠不夠徹底、哭得夠不夠真；約翰卻把把握掛在神的品格上。翻轉在這裡：下一次你認完罪，心裡仍然不踏實的時候，不必再認一次來安慰自己，先問：他是信實的嗎？他說過的話算不算數？感覺會退潮，他的信實不會。","這一週，每天晚上睡前留三分鐘。第一分鐘，求光照：今天有哪一件事，我一直替它找理由？第二分鐘，用它本來的名字叫它，對神說：主啊，你說得對，這是罪。第三分鐘，唸一次 1:9，把「我們」換成「我」。如果那件事得罪了某一個人，在安全的前提下，這一週找時間向他說一句真話；如果是長年捆綁你的事，告訴一位可信任的屬靈同伴。","最終整合：七十八歲的陳伯，每一次領聖餐以前，都會低頭認同一件罪。\n那是五十年前的事。他在工廠管帳，挪用了一筆錢給病重的母親買藥，後來一點一點補了回去，卻從來沒有人知道。信主那一年，他跪在床邊把這件事告訴了神。可是之後每個月的聖餐，他還是再認一次。五十年，六百多次。\n去年，他開始在國度321空中團契的線上小組聚會。有一晚讀約翰一書第一章，帶領的人請大家圈出 1:9 後半句的主詞。陳伯戴著老花眼鏡，在螢幕前看了很久，然後打開麥克風：「我一直以為，這一節的重點是我要認得夠誠懇。原來後半句的主詞是神。」\n他說，這五十年，他其實不是在認罪，是在檢查神有沒有算數。\n那一晚，他把一句經文抄在卡片上，夾在聖經裡：「神是信實的，是公義的，必要赦免我們的罪」（1:9）。下一個月的聖餐，他沒有再提那件事，只說了一句：主啊，謝謝你守住你的話。\n赦免不是在第六百次才生效的。五十年前那個晚上，他還跪在床邊發抖的時候，神就已經信實地算清楚了。改變的不是神，是陳伯終於肯相信他。"],"self":"這一章照出來的「有己」，是一張不肯讓光照到的臉。我們不一定公開說謊，只是很會替自己的黑暗取別的名字；在聚會裡說「還好」，在小組裡談別人的軟弱，自己的卻收得很緊。最深的驕傲不是自誇能幹，是覺得自己不需要被赦免。\n底下是同一件事：焦點在自己身上。焦點在自己的面子，人就會躲；焦點在自己的失敗，人就會一直自責。這一章叫我們把眼睛移開，移到那位就是光、又信實公義的神身上。","t321":{"k":"耶穌是我的榜樣：約翰說「親手摸過的」（1:1），這句話背後是一位肯讓人摸到的主。他伸手摸過長大痲瘋的人，讓患血漏的婦人摸他的衣裳，復活以後還對門徒說「摸我看看！」（路 24:39），連疑惑的多馬也讓他伸出指頭來。永遠的生命沒有站在遠處叫人仰望，是走進人群、被人碰到。他也是在光明中行的：沒有藏起來的算計，沒有兩套說法。我們跟隨他，不是先把自己修到完美，是學他不躲——讓自己成為一個可以被認識、被碰到的人，在小組裡說真話，也伸手去碰那些很久沒有人碰過的人。","g":"讓耶穌作王：這一章要人交出來的，是心裡躲在暗處的那一角。三次「若說」，都是我們替那一角拉上窗簾：我沒有罪，那不算罪，我沒有犯過。神就是光（1:5），光不是來抄家的，是來接人出來的。讓耶穌作王，是把窗簾交給他拉開，讓他的道作最後的定義——他說是罪，我也說是罪，這就是 1:9 的「認」。也有人窗簾拉開了，卻還坐在角落不肯出來，一遍又一遍認同一件神早已赦免的事。光照進來，是要人走到桌前相交，不是留在角落。今晚關燈以前，把那一角的名字說給神聽；若他早已洗淨，就謝謝他，然後安心睡覺。","p":"建立屬神的體系：「我們若在光明中行，如同神在光明中，就彼此相交」（1:7）。相交是從光裡長出來的：先與父並他兒子相交，再彼此相交（1:3）；這使我們想起 235 的「2」：屬靈同伴。國度321空中團契散在臺灣、馬來西亞、新加坡、紐西蘭各地，大部分時間隔著螢幕。螢幕可以承載真實的相交，但要刻意建構：小組不宜太大，讓每個人都被叫得出名字；每位組員配一位固定的禱告同伴，每週私下問一次近況；同一城市的人，一年至少見面幾次、一起吃飯擘餅；有人生病、搬家、失業，附近的弟兄姊妹要能真的出現在門口。光照進來的地方，人不必再一個人躲著；相交的源頭在父與子，形狀卻要有名字、有時間、有手。"},"grp":["【一、破冰】小時候停電的夜晚，你家用甚麼照明？蠟燭、手電筒還是煤油燈？燈亮起來的那一刻，你第一眼看見的是甚麼？","【二、扎心】約翰說：「我們若說自己無罪，便是自欺」（1:8）。說出一件你最常替自己找理由的事——不必說細節，只說你最常用的那一句理由，例如「我個性就是這樣」「是他先的」。你第一次發現自己在替它辯護，是甚麼時候？","【三、福音】經文說：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（1:9）。說出一次你真正經歷被赦免的時刻：那時你幾歲、在哪裡、是誰或哪一句話讓你相信神真的算數了？","【四、行動】說出這一週你要做的一件事，二選一：每晚三分鐘的認罪禱告（說出你要在幾點、在哪裡做）；或約一位可信任的屬靈同伴，用電話或見面說一句真話（說出他的名字和哪一天）。","【五、代禱】為三種人指名禱告：一位長年被同一個罪捆綁、很想放棄的弟兄姊妹，求主讓他在光裡被接住，也有可信的同伴與專業的幫助；一位認了罪卻一直不能原諒自己的人，求主讓他相信神的信實；一位只在網上聽道、很久沒有被人叫出名字的人，求主差人找著他。"],"prac":{"main":"這一週，我不再替黑暗取別的名字；我走進光裡說實話，相信神的信實比我的感覺更可靠。","items":["對神：每天晚上用三分鐘禱告：求光照、說出一件事的本名、唸一次 1:9。每天早上讀 1:5，對神說：你是光，在你毫無黑暗，今天我不躲。週末把這一週回想一次，為每一件已經被赦免的事說一聲謝謝。","對自己：這七天，留意自己替自己辯護時最常用的三句話，寫在手機備忘錄裡。週末讀一遍，不責備自己，只問：這一句話保護的是我的面子，還是事實？若認了罪仍天天自責，也寫下來，帶到 1:9 的後半句面前。","對人：找一位可信、能保守秘密的屬靈同伴，約一次電話或見面，說一句平常不說的真話。若你得罪了某人，在安全的前提下向他承認、請求原諒，該補償的就補償；若對方曾傷害你、使你不安全，先與牧者或專業人士商量，不要獨自面對。","對生活：檢查一個讓你習慣躲藏的生活角落——深夜的螢幕、沒有對帳的花費、刪掉的訊息——為它設一道光：手機放在客廳充電、讓配偶或同伴知道你的帳目、或請人陪你問責。長年的成癮與捆綁，請預約輔導或專業協助。","對使命：這一週在小組或線上團契裡，帶頭說一句「我也是這樣」，讓人知道這裡可以說真話。再挑一位很久沒有出聲的組員，私下打一通電話或傳一則訊息，叫出他的名字，問他最近好不好。"]},"safe":["① 用 1:8 合理化刻意、持續的不悔改：「反正人人都有罪，我也沒辦法」「約翰都說了我們有罪，所以不必改」。","約翰寫 1:8，是要人走到 1:9 去認罪，下一章更說寫這些話「是要叫你們不犯罪」（2:1）。把罪的普遍當成停在罪裡的許可證，是三次「若說」的另一種講法：嘴上承認有罪，腳卻留在黑暗裡（紅線一；議題見〈1:8--10 與 3:6--9——基督徒還會犯罪嗎？〉；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位正在外遇、或長期欺騙家人的人聽完，是更清楚自己要轉身、要認罪，還是更放心地繼續下去？","② 反過來，用罪讓人失去確據：「真基督徒不會一再跌倒」「你還在同一個罪上掙扎，可能根本沒有重生」。","1:8 說的正好相反：看得見自己的罪、為它難過，說明真理在你裡面作工；真正自欺的人是看不見的。約翰給跌倒之人的話是「若有人犯罪，在父那裡我們有一位中保」（2:1），是一條回家的路，而非一張判決書（紅線一；議題見〈1:8--10 與 3:6--9——基督徒還會犯罪嗎？〉；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位多年與某個試探搏鬥、常常失敗又回來的弟兄姊妹聽完，是更有勇氣再一次回到神面前，還是開始懷疑自己到底是不是神的孩子？","③ 把 1:9 的認罪變成公開羞辱：要人在台上、在群組裡、在直播鏡頭前把隱私說出來，才算「真正悔改」。","1:9 的對象是神，因為「神是信實的」（1:9）；赦免的條件是向神認，不是向群眾曝光。公開的羞辱不會帶來洗淨，只會帶來恐懼，讓人以後更會躲；也可能再次傷害事件裡的其他人，特別是受害者（議題見〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉）。","檢驗標準：一位有難以啟齒過去的弟兄姊妹聽完，是更願意先到神面前、再找一個安全的人說，還是更害怕被要求當眾交代、乾脆不來了？","④ 用 1:9 或雅 5:16 強迫人向某一個人認罪：「不向我（或向牧者、向小組長）交代，神就不會赦免你」，藉此掌握別人的秘密。","雅各說「彼此認罪，互相代求」（雅 5:16），是互相的，為了代求與醫治，不是單向向某個有權柄的人交出秘密。向人承認，是得罪了人、或需要扶持時的智慧，並非赦免的條件；把它變成條件，就為屬靈控制開了門。受害者更不需要為別人加在他身上的惡「認罪」（議題見〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉）。","檢驗標準：這樣的教導，是讓人更自由地到神面前，還是讓某一個人手上握著越來越多別人的秘密？","⑤ 把「在光明中行」講成無罪完全：「在光中的人就不再犯罪」「你還會犯錯，表示你還在黑暗裡」。","1:7 自己說，在光明中行的人，耶穌的血「也洗淨我們一切的罪」（1:7）——現在式，正在洗；若在光中就沒有罪，就不需要血了。下一節緊接著說「我們若說自己無罪，便是自欺」（1:8）。在光中行是不再躲，不是不再跌（議題見〈1:7「在光明中行」——是無罪完全，還是誠實透明？〉）。","檢驗標準：會眾聽完，是更願意帶著還沒洗淨的部分走進光裡，還是覺得要先把自己弄乾淨了才配走進來？","⑥ 把「誠實透明」講成沒有界線的全盤公開：「在光中就是甚麼都要說」「小組沒有秘密，每個人的事大家都該知道」。","在光中行是在神面前不躲，並且在可信、安全的關係裡說真話；不是把每一件私事攤給所有人，也不是逼別人說他還沒準備好說的事。保守秘密是光中相交的一部分；把別人在小組裡的分享轉述出去，是把光變成了探照燈（議題見〈1:7「在光明中行」——是無罪完全，還是誠實透明？〉）。","檢驗標準：這個小組，是讓人越來越敢說真話，還是讓人學會只說安全的話、把真正的事留在外面？","⑦ 用 1:3 貶低網上群體：「只在網路上聚會不算相交」「沒有實體教會的人，信仰都是假的」。","相交的源頭是「與父並他兒子耶穌基督」（1:3），不在同一個房間；約翰自己也是用一封信，隔著距離把人帶進相交。許多人因為病痛、年老、移居、輪班，或在教會受過傷，網上聚會是他們此刻唯一到得了的地方。輕看他們，等於說神的恩典被網速限制（議題見〈1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？〉）。","檢驗標準：一位臥病在床、只能用手機參加聚會的長輩聽完，是覺得自己真的在家裡，還是覺得自己是次等的基督徒？","⑧ 反過來，用網上聚會取代一切相交：「我每週有看直播，這樣就夠了」「相交就是在群組裡按讚」。","約翰說的 κοινωνία 是一同有分，要有名字、有近況、有在難處裡伸出的手；約翰自己也盼望「與你們當面談論」（約貳 1:12）。只看不說、只按讚不同行，是觀眾，還不是相交；能見面的時候刻意不見，也要問問自己在躲甚麼（議題見〈1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？〉）。","檢驗標準：這一週，有沒有一位弟兄姊妹叫得出你的名字、知道你最近的難處、也曾為你具體禱告過？","⑨ 把 1:1「親手摸過」講成神祕經驗的追求：「你要摸到神、感覺到他的觸碰，才算真的信」「沒有異象、沒有感覺的人，信仰還不夠深」。","約翰說的是歷史：一群目擊者親眼看見、親手摸過道成肉身的耶穌。他講這些，正是要讀者的信不必建立在自己的感覺上，而是建立在見證人所傳的事實上。把見證講成一種要人複製的體驗，會讓沒有特別感覺的人懷疑自己，也讓人追逐越來越強的刺激（議題見〈1:1「親手摸過」——本卷要對付的錯誤是甚麼？〉）。","檢驗標準：一位信主多年、從來沒有過特別屬靈經驗的弟兄姊妹聽完，是更確定他所信的是真的，還是開始懷疑自己少了甚麼？","⑩ 用 1:5「神就是光」嚇人：「神在看著你，一點都逃不掉」，把光講成監視器，把神講成等著抓錯的人。","光確實照出一切，但約翰接下去說的是光裡有彼此相交、光裡有血的洗淨（1:7）；同一封信也說「神就是愛」（4:8）。只講被看見、不講被洗淨，會讓已經很自責的人更不敢靠近神（議題見〈1:5「神就是光」與 4:8「神就是愛」怎樣合看？〉）。","檢驗標準：一位從小被嚴厲管教、一聽到「神在看」就發抖的弟兄姊妹聽完，是更想走近光，還是更想躲起來？","⑪ 用「赦免」取消後果與責任：「神都赦免了，你們為甚麼還要追究」「認了罪就該馬上恢復職分，受害者就該馬上信任他」。","1:9 的赦免恢復的是與神的關係，不自動抹去後果：大衛蒙赦免，孩子仍然死了（撒下 12:14）；撒該蒙恩之後，主動還人四倍（路 19:8）。涉及侵害、虐待、詐欺的事，赦免不取代法律責任，也不取代對受害者的保護；信任需要時間與行動重建，受害者不必被催著回到不安全的關係（紅線三；議題見〈1:9 認罪得赦免之後，後果與信任怎麼辦？〉；全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：一位曾被教會裡的人傷害的弟兄姊妹聽完，是感到被保護、知道自己的安全被看重，還是感到被催著原諒、被要求當作沒事？","⑫ 把認罪講成一次就夠、以後不必再說：「信主那一天所有的罪都赦免了，以後還認罪就是不信」。","稱義是一次完成的，這是真的；但 1:9 的「認」是現在式，是神兒女一再回到父面前的生活。已經得救的人認罪，不是為了重新得救，是為了回到相交裡，像孩子做錯事回家把話說清楚。不肯認罪的人，關係會變冷，良心會變硬（議題見〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉）。","檢驗標準：會眾聽完，是更自在地天天回到神面前說實話，還是覺得認罪是信心軟弱的表現、乾脆不說了？","⑬ 反過來，把認罪講成焦慮的儀式：「每一件罪都要逐一認清，漏了一件就沒有被赦免」「認完了心裡還不平安，就是沒認乾淨」。","1:9 的末句是「洗淨我們一切的不義」（1:9），連我們想不起來的也包括在內；赦免掛在神的信實，不掛在我們的清單夠不夠完整。對有強迫思想、宗教性焦慮的人，反覆認同一件罪不是敬虔，是需要被溫柔陪伴、必要時轉介輔導與就醫的痛苦（議題見〈1:8--10 與 3:6--9——基督徒還會犯罪嗎？〉）。","檢驗標準：一位每天反覆認同一件罪、仍然睡不著的弟兄姊妹聽完，是得著安息，還是又多了一張要逐條核對的清單？","⑭ 用三次「若說」審查別人：「某某教會、某某牧師就是 1:6 說的那種說謊的人」，把經文當成貼標籤的工具。","三次「若說」的主詞是「我們」，約翰先把自己放進去；1:6 是一面鏡子，不是放大鏡。這些口號或許出自離開的人，但約翰沒有點名，講台也不必點名；拿經文審查別人的人，往往正落在 1:8 的自欺裡（紅線五；全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉）。","檢驗標準：會眾聽完，第一個想到的是自己的生命，還是坐在旁邊的某一個人？","⑮ 把 1:9 和 321 術語直接劃上等號：「認罪就是 321 的回到本位」，或說「1:3 的相交就是 235」，讓經文變成 321 的插圖。","先讓經文自己講完：1:9 講的是神的信實與公義，1:3 講的是與父和子、與見證人的相交；321 只在末端認出其中的樣子——認罪有謙卑、回到本位的形狀，1:3 使我們想起 235 的「2」屬靈同伴。順序一顛倒，會眾記得的是課程術語，不是那位信實的神。","檢驗標準：會眾聽完，記得的是 321 的口訣，還是那位認罪的人可以投靠的神？","⑯ 用處境取消原則，或把處境硬搬：「這是寫給一世紀對付異端的，跟今天的我們無關」；或把每一個與我們意見不同的人都當成約翰的對手。","書信三問要走完：處境是一個剛經歷分裂、留下的人心裡發慌的群體，對手否認耶穌有真實的血肉；原則是信仰建立在道成肉身的歷史上，神是光，在光中的人彼此相交，認罪的人遇見信實的神；今天這些原則落在每一個躲在螢幕後、躲在「還好」後面的人身上（全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉）。","檢驗標準：會眾聽完，能不能說出這一章在他自己的家、公司、小組裡要改變甚麼，而不是只記得一段教會史？"]},{"n":2,"t":"你們要住在主裡面","sub":"保、世、膏","lv":"A","arc":"住","sec":[["2:1--6","若有人犯罪，我們有一位中保：遵守他的道"],["2:7--11","舊命令，也是新命令：在光明中與在黑暗裡"],["2:12--14","小子們、父老、少年人：三種屬靈年齡"],["2:15--17","不要愛世界：惟獨遵行神旨意的，是永遠常存"],["2:18--27","如今是末時了：敵基督的與恩膏"],["2:28--29","你們要住在主裡面：坦然無懼"]],"serm":{"pts":[["一位中保","2:1--11","「若有人犯罪，在父那裡我們有一位中保」——方向是不犯罪，跌倒時有中保；認識他的人照主所行的去行，愛弟兄的就是住在光明中"],["不要愛世界","2:12--17","「不要愛世界和世界上的事」——小子、少年人、父老都被寫信叮嚀；肉體的情慾、眼目的情慾、今生的驕傲都要過去，惟獨遵行神旨意的是永遠常存"],["住在主裡面","2:18--29","「小子們哪，你們要住在主裡面」——有人從我們中間出去，留下來的人有從主所受的恩膏；不是去追更新的，是住在從起初所聽見的裡面"]]},"q":"那個小組原本有十二個人。一位很會講的弟兄說他領受了「更深的亮光」，半年之內，帶走了七個人，連帶領的姊妹最好的朋友也走了。留下來的五個人，每週在客廳裡坐得更散，誰都不敢先開口。\n帶領的姊妹私下問：是不是我們錯了？是不是他們看得比較清楚？另一位弟兄則是自己跌倒了，覺得沒臉再來，打算等「好一點」再回小組。\n這一章要回答的是：有人出去了，有人跌倒了，新的聲音一直在叫，我們憑甚麼留下來？住在主裡面，到底是甚麼意思？","truth":"住在主裡面，不是靠自己站得穩，是因為「在父那裡我們有一位中保」（2:1）。\n世界和其上的情慾都要過去，「惟獨遵行神旨意的，是永遠常存」（2:17）；所以不必追新的、不必因人出去而慌，「你們要住在主裡面」（2:28），他顯現的時候，我們可以坦然無懼。","mv":{"t":"小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。","r":"約壹2:28"},"card":["全卷五個字「光・住・兒・愛・勝」，第二章是住。約翰先給跌倒的人一位中保，再說認識他的人照主所行的去行、愛弟兄的住在光明中；然後停下來對小子、少年人、父老說：你們已經被赦免、已經得勝；接著提醒不要愛那正在過去的世界；最後面對有人出去、有人引誘，叫留下的人住在從起初所聽見的道裡。整章收在一句：住下來。","這一章的主詞，常常是神。是那義者耶穌基督在父那裡替我們說話（2:1）；是他為我們的罪作了挽回祭，夠普天下人用（2:2）；是神的愛在遵守主道的人身上走完全程（2:5）；是真光已經照耀（2:8）；是罪藉著主名得了赦免（2:12）；是那聖者賜下恩膏（2:20）；是主應許了永生（2:25）。人在這一章做的每件事——遵守、相愛、不愛世界、住下來——都是站在他已經做成的事上。","2:28 的「住」原文是 μένω（menō），本章用了十次上下，和合本譯作「住」「常存」「存在」「同在」。它不是一個衝刺的字，是一個回家的字：每天晚上回到同一個門口。約翰福音的葡萄樹用的也是它：「你們要常在我裡面，我也常在你們裡面」（約 15:4）。這改變今天的讀法：屬靈長進不是一直換地方，是在同一位主裡面越扎越深。枝子不用每天證明自己還連著，連著就會結果子。","像一個房客，行李一直沒有拆開：說是住在主裡面，卻隨時準備搬走。有人靠擁有站住，拿事工大小、孩子成績替自己命名；有人靠「更深的亮光」站住，對留下來的人帶著一點看不起。行李不拆，是因為心裡還不信這裡是家。「你們要住在主裡面」（2:28），就是把箱子打開，承認自己不必再靠甚麼撐著。","全章最該被記住的，是 2:1 的那個「我們」。「若有人犯罪，在父那裡我們有一位中保」（2:1）。年老的使徒沒有說「你們若犯罪」，他把自己也放進去。所以下一次你跌倒了，不要先躲起來，等自己好一點再回來；正是跌倒的時候，最需要那位在父那裡替你說話的。回家不是因為你乾淨了，是回家才會乾淨。住在主裡面，從回家開始。","這一週，每天早上讀 2:28 一次，問自己：今天我在哪一件事上想要「出去」——去追一個新的說法、躲開一個難愛的人、或是因為跌倒而不想禱告？然後做一件「住下來」的小事：把當初信主時最打動你的一節經文找出來再讀一次；或打電話給小組裡一位最近很少出現的弟兄姊妹，只問候，不追問原因。","最終整合：貨櫃船的輪機艙，凌晨兩點，印度洋上。\n建國是二管輪，一年有十個月在海上。信主八年，他在岸上的教會只坐過幾十個主日。每次靠港，他都覺得自己像一個逃學的學生，不好意思回小組，怕人問：「你最近有讀經嗎？」\n他心裡一直有一個畫面：主再來的那一天，像船長突擊檢查，自己的艙房一團亂，只能低著頭。\n那一夜風浪很大，機器出了狀況，他忙到手上全是油，才坐下來，在手機裡打開一節離港前抄下的經文：「小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼」（2:28）。\n他盯著「住」這個字很久。他一直以為住在主裡面是住在某一間教會、某一張椅子上，所以一出海就覺得自己被趕出去了。可是同一章前面寫著：「在父那裡我們有一位中保」（2:1）。那位中保沒有留在岸上。\n他在油污的手套旁邊低聲禱告：主啊，我在這裡。\n他沒有因此變成一個更厲害的基督徒。只是從那一夜起，他不再把主的顯現當成檢查，而是當成一個一直在等他的人終於回來。坦然不是因為艙房整齊，是因為那一位從來沒有離開這條船。"],"self":"這一章照出來的「有己」，常常很安靜：我用擁有的定義自己，我比別人懂得多一點，我跌倒了就躲，好像要等自己修好了才配回到神面前。有人走了，我先問的是「是不是我不夠好」，或是「他們早就不屬靈」。\n底下是同一件事：焦點在自己——自己的擁有、自己的知道、自己的失敗。這一章把眼睛移到 2:1 與 2:28：在父那裡有一位中保，住下來的根據在他；焦點一轉，人就不必追、不必躲，也不必比。","t321":{"k":"耶穌是我的榜樣：約翰說「人若說他住在主裡面，就該自己照主所行的去行」（2:6）。照主所行的，是看著他怎麼走：他在井旁和一個被人避開的婦人說話，在最後晚餐先為門徒洗腳，在十字架上為釘他的人禱告。他也是那個不離開的人：「從此，他門徒中多有退去的」（約 6:66），他沒有追著討好，也沒有咒詛離開的人，只轉身問留下的十二個人：「你們也要去嗎？」（約 6:67）跟隨這位榜樣，是學他走得穩、愛得真，不拿人的去留來決定自己的方向。","g":"讓耶穌作王：「住」是住進一個地方，也是把鑰匙交出去。這一章要人交出的，是住處的主權。2:16 說的今生的驕傲，是讓擁有替我命名；2:26 那些引誘人的，是讓更新的說法替我作主——都是想自己保管鑰匙，誰的話合意就讓誰進門。約翰叫我們把起初所聽見的存在心裡（2:24）：耶穌是基督，他為我們的罪死，神愛我們。讓耶穌作王，就是讓他作這個家的主人，不再讓世界的眼光、也不再讓最新的聲音決定哪一間房開、哪一間房鎖；世界正在過去，惟獨遵行神旨意的永遠常存。翻一翻自己的鑰匙圈：哪一把，你還握在手裡？","p":"建立屬神的體系：「你們要按這恩膏的教訓住在主裡面」（2:27）。「住」是一個家的字：屬神的體系不是一個留住人的機制，是一群住在主裡面、也彼此相顧的人。所以有人離開時，小組不散播猜測，不論斷他屬不屬神，而是留一張空椅子，繼續為他禱告，願意的話送去一句真心的問候；有人自稱有更高的恩膏時，大家一起回到聖經查考，不讓任何一個人壟斷解經——約翰自己正在寫信教導，恩膏是給全體的。住處的燈要一直亮著：在海上、在夜班、在遠方的人，哪一天回來，門都是開的。"},"grp":["【一、破冰】你搬過幾次家？說出一個你住得最久、最有「家」的感覺的地方：在哪一個城市、住了幾年、那裡有誰在等你回去。","【二、扎心】經文說：「若有人犯罪，在父那裡我們有一位中保」（2:1）。說出最近一次你跌倒以後，第一個反應是躲起來、不想禱告或不想來小組的時候：那是哪一天？你躲了多久？","【三、福音】讀一遍「他為我們的罪作了挽回祭」（2:2）。說出你第一次清楚知道「我的罪藉著主名得了赦免」的那一天：你在哪裡、幾歲、是誰陪著你？","【四、行動】說出一位最近很少出現在聚會或小組裡的弟兄姊妹的名字，和你這一週要做的一件小事：哪一天打電話或傳訊息、只問候不追問。如果你自己就是那個想離開的人，可以說「我這一週願意再來一次」。","【五、代禱】為三種人指名禱告：一位離開了教會、可能在教會受過傷的人，求主親自看顧他，也醫治我們曾經的虧欠；一位正被新說法吸引、心裡搖動的人，求主的恩膏叫他認得真道；一位在跌倒裡不敢回來的人，求那位中保把他帶回家。"],"prac":{"main":"這一週，我不追新的，也不躲起來；跌倒了就回到中保那裡，住在從起初所聽見的道裡。","items":["對神：每天早上讀 2:28，說一句：「主啊，今天我住在你裡面。」每天晚上讀 2:1，把當天跌倒的地方直接告訴他，不必等自己先處理好；記得在父那裡有一位替你說話的。","對自己：這七天，記下每一次你想用擁有、成就或「我比較懂」來讓自己站穩的時候。週末讀一遍，不責備自己，只問：那一刻，我是讓世界替我命名，還是讓父替我命名？","對人：選一位最近很少出現的弟兄姊妹，傳一則問候，只說「想到你，為你禱告」，不追問他為甚麼沒來，也不評論他的去留。若他在教會受過傷，先聽，不急著解釋。","對生活：挑一樣你最想讓人知道的擁有——車子、職位、孩子的成績、事工的規模——這一週刻意不提它；同時好好享受一頓飯、一段音樂、一次散步，帶著感謝領受神所造的好東西。","對使命：用三句話把 2:1–2 講給一位教會外的朋友聽：人都會跌倒；有一位義者在父那裡替我們說話；他的祭夠普天下人用，也夠你用。並為一位剛信主、正被各種說法拉扯的人禱告。"]},"safe":["① 把 2:1「若有人犯罪，我們有一位中保」講成犯罪的許可：「反正有中保，跌倒沒關係」「神會赦免，所以不必太認真」。","2:1 的前半句是「是要叫你們不犯罪」，方向沒有打折；中保是給跌倒的人回家的路，不是給刻意、持續不悔改的人的掩護。把恩典講成許可，會叫人一面說住在主裡面、一面照舊走自己的路，正是 2:4「人若說」要照出來的那一種（紅線一；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位正在某個罪裡反覆、卻想找理由不改的弟兄姊妹聽完，是更想回到中保那裡認罪、轉向，還是更安心地繼續下去？","② 用 2:3–4 審查信徒的得救：「你還會發脾氣，證明你根本不認識他」「遵守得不夠的，都是說謊話的」。","遵守命令是認識他的記號，不是得救的條件；同一章一開頭就說「若有人犯罪，在父那裡我們有一位中保」（2:1）。第一章的三次「我們若說」，約翰先把自己放進去，是給每個人先照自己的鏡子，不是拿去量別人。仍在學習順服、仍會跌倒的人，需要的是回到中保那裡（紅線一；議題見〈2:3--6 遵守命令與得救確據——是靠行為得救嗎？〉）。","檢驗標準：一位信主多年、仍常在某件事上跌倒的弟兄姊妹聽完，是更確知自己有一位中保，還是開始懷疑自己從來沒有認識過主？","③ 用 2:9–11「恨弟兄的在黑暗裡」逼受傷的人立刻和好：「你不肯見他，就是恨弟兄」「心裡還有傷，就表示你還在黑暗裡」。","μισέω 在這裡是不顧、冷漠，與受傷後保持安全距離不是同一件事。愛要「在行為和誠實上」（3:18），原諒可以交給神，和好卻需要對方的悔改與安全。把 2:9 當成逼人回到傷害裡的工具，會讓受害者在傷上再加一層罪疚（紅線三；全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：一位曾被教會同工傷害、對方從未認錯的弟兄姊妹聽完，是知道可以把對方交給神、在安全裡慢慢學愛，還是覺得不立刻去握手就是住在黑暗裡？","④ 把 2:12–14 的三種稱呼直接等同於 321 的課程：「小子、少年人、父老就是 235 的 3」「約翰在這裡教我們建立屬靈父母兒女的制度」。","先讓經文自己講完：約翰在這裡宣告的是身分——罪已赦免、已經認識父、已經勝了那惡者；三種稱呼很可能是每個信徒身上的三個面向。經文講完，321 才在末端認出屬靈傳承的亮光；用「就是」把經文和術語綁在一起，會讓人記得課程，卻忘了這段的主詞是神的作為（議題見〈2:12--14 小子、少年人、父老——三種屬靈年齡，還是全體信徒的三個面向？〉）。","檢驗標準：會眾聽完，記得的是「我的罪藉著主名得了赦免、我已經得勝」，還是只記得一套屬靈年齡的分級？","⑤ 用 2:12–14 把信徒分等級：「你還是小子，沒資格說話」「父老才算成熟，少年人要閉嘴」。","約翰對三種人說的話，每一句「因為」後面都是一件已經成就的恩典，沒有一句是考核；τεκνία 在全卷稱呼所有讀者。把稱呼變成階級，會讓剛信主的人不敢發問，也讓資深的人以為自己不必再學（議題見〈2:12--14 小子、少年人、父老——三種屬靈年齡，還是全體信徒的三個面向？〉）。","檢驗標準：一位剛信主三個月、問題很多的弟兄姊妹聽完，是覺得自己被約翰溫柔地稱為「小子」，還是覺得自己被排在最低一級？","⑥ 用 2:15「不要愛世界」叫人厭世：「電影、流行音樂、小說都是世界，基督徒都不可碰」「關心社會、參與公共事務就是愛世界」。","2:16 自己下了定義：世界是肉體的情慾、眼目的情慾、今生的驕傲，不是受造界，也不是世人。同一位約翰寫下「神愛世人」（約 3:16），也說「神差他獨生子到世間來」（4:9）。把一切文化都貼上「世界」的標籤，會叫人逃避社會責任、輕看身體與家庭，也讓福音離鄰舍越來越遠（紅線九；議題見〈2:15「不要愛世界」與約 3:16「神愛世人」——基督徒可以享受文化、參與社會嗎？〉）。","檢驗標準：一位在電影業、音樂界或公部門工作的弟兄姊妹聽完，是更知道怎樣在自己的崗位上不被世界佔有，還是覺得自己必須辭職才算愛父？","⑦ 反過來，把 2:15–17 講得只剩外在清單，卻放過最隱密的那一樣：「只要不去夜店、不看不好的節目，就沒有愛世界」。","約翰列的第三樣是今生的驕傲 ἀλαζονεία τοῦ βίου，是用擁有來定義自己；它可以穿著屬靈的衣服——事工的規模、奉獻的數字、孩子進了哪間學校。只談外在禁令，會讓人在教會裡照樣比較、照樣誇口，卻以為自己很分別為聖（紅線九）。","檢驗標準：會眾聽完，是開始察看自己用甚麼來定義自己，還是只多了一份不可以去的地方的清單？","⑧ 用 2:18、22 在講台上點名：「某位政治人物就是那敵基督」「某個國家、某個宗派就是約翰說的那一群」。","約翰給的標準是基督論——認不認耶穌是基督、是成了肉身來的——不是政治立場、國籍或宗派。他說「現在已經有好些敵基督的出來了」（2:18），指的是一世紀那些否認基督的教師，沒有交給我們一張名單。把名號貼在人身上，會讓講台變成黨派的工具（紅線四；議題見〈2:18--22「敵基督」是一個人、一種靈、還是很多人？「末時」是今天嗎？〉；全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉）。","檢驗標準：一位政治立場和講員不同的弟兄姊妹聽完，是更清楚怎樣用「他怎樣看耶穌」來分辨教導，還是覺得自己被劃到敵基督那一邊？","⑨ 用 2:18「如今是末時了」推算主再來的日子：「照這些徵兆，主一定在這幾年回來」「趕快變賣家產準備」。","約翰在一世紀就說「如今是末時了」（2:18）；末時是從基督第一次來到他再來的整段日子。主自己說那日子那時辰「沒有人知道」（太 24:36）。算日子會製造恐慌，算錯了又讓人失望離開信仰；約翰要的不是驚慌，是住在主裡面，好在他顯現時坦然無懼（紅線四；議題見〈2:18--22「敵基督」是一個人、一種靈、還是很多人？「末時」是今天嗎？〉）。","檢驗標準：會眾聽完，是更安靜地住在主裡面、照常愛人做工，還是開始在新聞裡找徵兆、算年份？","⑩ 用 2:19「他們從我們中間出去」論斷離開的人：「離開我們教會的，都不屬神」「走了的人，證明他從來沒有得救」。","2:19 說的是一世紀那一群否認基督、帶著另一套教導離開的教師，是約翰給留下來的人的安慰，不是交給我們量每一個不再來聚會的人的尺。人離開一間教會有許多原因：搬家、受傷、信仰掙扎、甚至是逃離不健康的帶領。約翰從來沒有給我們權柄宣判誰屬神（紅線五；議題見〈2:19「他們從我們中間出去」——怎樣看待離開教會的人？〉）。","檢驗標準：如果一位在教會受過傷、已經離開的人的家人就坐在台下，他聽完是覺得這間教會願意為他禱告、等他，還是覺得他的家人已經被定罪了？","⑪ 用 2:19 建立控制：「離開這個小組就是離開神」「轉去別的教會，就是背叛屬靈遮蓋」。","約翰沒有把「屬我們」等同於某一間地方教會的會籍；他在意的是有沒有認耶穌是基督。用這節經文綁住人，會讓不健康的帶領得到保護，也讓真正需要離開危險的人不敢走。健康的教會可以讓人帶著祝福轉到別處（紅線五；議題見〈2:19「他們從我們中間出去」——怎樣看待離開教會的人？〉）。","檢驗標準：一位正在考慮轉到另一間教會的弟兄姊妹聽完，是能誠實地和牧者談、帶著祝福做決定，還是害怕一開口就被說成不屬神？","⑫ 用 2:27「並不用人教訓你們」拒絕一切教導：「我有聖靈，不必聽講道、不必查經班」「牧師說的我自己禱告就知道對不對，不用學」。","約翰自己正在寫信教導他們，而且寫了五章；新約也說主賜下「牧師和教師」（弗 4:11）。這裡的「人」是 2:26 那些引誘人的教師，自稱帶來你們沒有的新知識。恩膏不是拒絕教導的理由，是叫人認得真教導的能力；它把人帶回從起初所聽見的道（紅線六；議題見〈2:20、27「恩膏」與「不用人教訓你們」——還需要教會的教導嗎？〉）。","檢驗標準：會眾聽完，是更願意和弟兄姊妹一起查考聖經、在群體裡受教，還是更覺得自己一個人禱告就夠了？","⑬ 用 2:20、27 以「我有恩膏」壟斷屬靈權柄：「我是受膏的，我說的就是神說的」「質疑我，就是摸神的受膏者」。","2:20 的「你們」是複數，原文很可能是「你們眾人都知道」——恩膏是給全體信徒的，不是少數人的牌子。那些自稱有獨家亮光的人，正是約翰要信徒分辨的；檢驗一切教導的標準是使徒傳下、寫在聖經裡的道，不是某一個人的感覺（紅線六；議題見〈2:20、27「恩膏」與「不用人教訓你們」——還需要教會的教導嗎？〉）。","檢驗標準：會眾聽完，是更願意像庇哩亞人一樣拿聖經考查講台上的話，還是更不敢對任何自稱有恩膏的人提出問題？","⑭ 把 2:2「普天下人的罪」講成普救論：「基督為所有人死了，所以不管信不信，人人終必得救」。","2:2 說的是這祭夠大、不只為一小群人；但同一章也說「凡不認子的，就沒有父」（2:23）。普救論拿掉了信的必要，也拿掉了傳福音的急迫。有限救贖與無限救贖之爭，本卷不作裁判；可以確定的是，這祭是神自己預備的，邀請是真誠向每一個人發出的（議題見〈2:2「普天下人的罪」——基督為所有人死了嗎？人人都會得救嗎？〉；全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉）。","檢驗標準：會眾聽完，是更確知這祭也夠自己用、也更想把福音告訴還沒信的家人，還是覺得信不信都無所謂？","⑮ 把 2:24「從起初所聽見的」講成拒絕一切更深的研讀，或反過來把「住下來」講成待在原地、不必長進。","約翰叫人不要追那些離開福音核心的「新」，不是叫人停止認識神；「住」是在同一位主裡面越扎越深，像葡萄樹的枝子連著才多結果子（約 15:5）。把「起初」當成不學習的藉口，或把「新亮光」當成離開福音的藉口，都誤解了約翰。","檢驗標準：會眾聽完，是更渴望在耶穌是基督、他為我們死、神愛我們這些起初的真理裡扎根更深，還是只得到一個不必再學的理由，或一個去追新說法的理由？","⑯ 用處境取消原則，或把處境硬搬：「這是寫給一世紀分裂後的教會，今天不必分辨」；或「每一間和我們看法不同的教會，都是那一群出去的人」。","書信三問要走完：處境是一群剛經歷分裂、被自稱有更高知識的人攪亂的弟兄姊妹；原則是住在從起初所聽見、認耶穌是基督的道裡，並且彼此相愛；今天這原則落在每一個被網路上新說法拉扯、因有人離開而動搖、因跌倒而想躲起來的人身上，不是拿來劃分教會陣營（全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉）。","檢驗標準：會眾聽完，能不能說出這一章在他的小組、家庭、網路生活裡要改變甚麼，而不是只記得「那是約翰那時候的事」或「那是別間教會的問題」？"]},{"n":3,"t":"我們得稱為神的兒女","sub":"看、生、捨","lv":"A","arc":"兒","sec":[["3:1--3","你看父賜給我們是何等的慈愛：我們必要像他"],["3:4--10","凡從神生的，就不犯罪：除滅魔鬼的作為"],["3:11--15","不可像該隱：出死入生"],["3:16--18","主為我們捨命：在行為和誠實上"],["3:19--24","神比我們的心大：坦然無懼與遵守命令"]],"serm":{"pts":[["何等的慈愛","3:1--3","「你看父賜給我們是何等的慈愛」——全卷唯一的驚嘆；現在已經是神的兒女，將來必要像他，有這指望的人就潔淨自己"],["從神生的","3:4--15","「凡從神生的，就不犯罪」——這是兒女的本性與方向，不是叫掙扎的人懷疑自己；跌倒的人有中保（2:1），恨弟兄的人卻像該隱，仍住在死中"],["神比我們的心大","3:16--24","「我們的心若責備我們，神比我們的心大」——主為我們捨命，我們從此知道何為愛；愛要在行為和誠實上，被自己定罪的心，可以在神面前安穩"]]},"q":"凌晨一點，她又醒了。白天在小組裡，有人分享「凡從神生的，就不犯罪」（3:9），大家都點頭；她低著頭，想起昨晚對孩子吼的那幾句，想起戒了三次又回頭的那個習慣。她在心裡問：我真的是神的孩子嗎？還是我一直在騙自己？\n另一個城市，一位弟兄也睡不著。他從小聽的是「你怎麼不像你哥哥」，信主十年，服事很賣力，卻從來不敢叫神一聲「父」，總覺得自己是寄住的，隨時會被請出去。\n這一章要回答的是：我們憑甚麼說自己是神的兒女？當我們的心一直責備自己，最後是誰說了算？","truth":"父賜給我們何等的慈愛，使我們得稱為神的兒女，我們也真是他的兒女（3:1）——身分是父給的，不是我們掙的。\n從神生的人，方向是離開罪，跌倒時有中保（2:1）；主為我們捨命，我們從此知道何為愛（3:16）。被愛的兒女，開始在行為和誠實上去愛人。","mv":{"t":"你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。","r":"約壹3:1"},"card":["全卷五個字「光・住・兒・愛・勝」，第三章是兒。約翰寫到「他所生的」，自己先停下來驚嘆：你看，父給了我們何等的愛。接著他講兒女的本性：從神生的，方向是離開罪；兒女的記號：不像該隱，彼此相愛；兒女的樣子：主為我們捨命，我們就在行為和誠實上去愛；最後是兒女的安穩：我們的心若責備我們，神比我們的心大。","這一章的主詞，越讀越是神。父賜下慈愛，親口叫我們作兒女（3:1）；主顯現，是要除掉人的罪（3:5）；神的兒子顯現，為要除滅魔鬼的作為（3:8）；神把他的種存在人心裡（3:9）；主為我們捨命（3:16）；神比我們的心大，一切事沒有不知道的（3:20）；神把他的靈賜給我們（3:24）。人在這一章最重要的身分，是一個被父叫名字的孩子。","3:1 的「何等的」，原文 ποταπός（potapos），早期是問出身地的字：這是從哪一國來的？到新約，它已經轉成驚嘆「何等驚人的」，字源的味道還在：這愛不是地上出產的，是從另一個國度來的。接著是完成式 δέδωκεν（dedōken）：父已經給了，給了就留在那裡。所以你不必每天重新爭取被愛；你要做的，是每天重新抬頭，看一看父已經給了你甚麼。","一個孩子要怎樣才算是這家的孩子？考第一名嗎？從不惹父母生氣嗎？這一章照出來的有己，常常拿這種問題問自己：跌倒一次，就懷疑一次身分，把自己的心當成最高法院。也有人反過來，把身分當成證書掛在牆上，看見弟兄窮乏，照樣塞住憐恤的心。3:1 的回答很短：「我們也真是他的兒女」（3:1）。","全章最該被記住的，是 3:1 的「你看」。約翰沒有說「你要努力成為神的兒女」，他先叫我們看父給了甚麼。翻轉在這裡：我們以為身分要靠表現換來，約翰說次序相反，先是兒女，然後才慢慢長得像。所以下一次你又跌倒、又在心裡審自己的時候，不必先問「我還算不算」，先抬頭看：父給的，他沒有收回。","這一週，每天早上起床，先唸一次 3:1，在「我們」的地方換成自己的名字；然後問自己：今天我要以神的兒女的身分去做哪一件事？另外選一個你身邊缺乏的人，用一件具體的事去愛他——一袋米、一次接送、一通電話——不必告訴別人。晚上心若又開始責備你，把 3:20 唸出來，再把那件事交給神。","最終整合：她的身分證上，名字原本是「罔市」。\n她是家裡第四個女兒。父親去報戶口那天，嘆了一口氣說：「罔市啦。」台語的意思是：姑且養著吧。她從小就知道，這個名字是一聲失望。上學被同學笑，嫁人以後連婆婆也拿來開玩笑。她做事比誰都快，說話比誰都小聲，好像一直在替這個名字賠不是。\n五十八歲那年，市場裡一位賣菜的姊妹帶她去教會。第一次查經讀到：「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1），她停在「得稱」兩個字上，問帶查經的人：「是誰叫的？」對方說：「是父親自叫的。」\n她回家想了一整夜。一輩子叫她名字的聲音都在嘆氣；原來有一位，叫她的時候是歡喜的。\n受洗以後，她去戶政事務所改了名字，新名字裡有一個「恩」字。走出門口，她對陪她去的女兒說：「其實不改也可以了，他早就換過我的名字。」\n後來她常唸：「我們現在是神的兒女，將來如何，還未顯明」（3:2）。她說：「我七十歲了，還是會講錯話、發脾氣；可是我將來的樣子，不是我爸爸說了算，也不是我自己說了算。」\n約翰那一聲「你看」，不是叫我們看她改得多好，是叫我們一起抬頭：那位叫我們名字的父，聲音裡沒有嘆氣。"],"self":"這一章照出來的「有己」，是一顆不肯讓神說最後一句話的心。驕傲的時候，它說：我已經是神的兒女，不必再潔淨自己，也不必為弟兄打開錢包。自責的時候，它說：我的心定了我的罪，神也一定這樣看我。兩種聲音都把自己放在審判席上。\n焦點的轉移，是把眼睛從自己移到父身上：看他給了甚麼，看主怎樣捨命，讓那位比我們的心大的神來下判斷。","t321":{"k":"耶穌是我的榜樣：「主為我們捨命，我們從此就知道何為愛」（3:16）。約翰不給愛下定義，他指著十字架。主的捨是主動的——「沒有人奪我的命去，是我自己捨的」（約 10:18）；主的捨也是有方向的，是為了救人脫離罪，不是讓罪繼續傷人。所以我們學他捨，也學他的方向：捨一個晚上陪剛失業的弟兄，捨一份面子先去道歉，捨一筆錢讓別人的孩子交得起學費。捨不是被人榨乾，是像主一樣，為了對方真正的好，甘心把自己放下來。","g":"讓耶穌作王：這一章說，神的兒子顯現出來，為要除滅魔鬼的作為（3:8）；「除滅」原文是解開、拆毀。讓耶穌作王，第一是承認我自己解不開：纏了多年的癮、從小被罵到大的那一句話、心裡那個希望某人消失的名字，都交給那位已經得勝的王來拆。第二是讓出審判席：我的心若責備我，最後判斷的是神，不是我（3:20）；我看別人時，也不替神宣判誰屬哪一家。這一週，當那句從小聽到大的話又在耳邊響起，試著用 3:1 回答它：「我們也真是他的兒女」（3:1）。","p":"建立屬神的體系：「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1）。有了同一位父，就有了一個家；約翰緊接著說「我們應當彼此相愛」（3:11）。這使我們想起 920：對身邊那一個人，在行為和誠實上去愛。落到教會的體系，第一，要有看得見窮乏的眼睛：小組可以設一個安靜的互助管道，讓失業、生病、單親的家庭不必在台前開口。第二，愛要誠實：有人一再越界傷人，要有人說出真相，也要有保護受傷者的流程。第三，讓在原生家庭沒被疼過的人，在這個家裡第一次被當成兒女，被叫名字，也有人記得他的生日。"},"grp":["【一、破冰】你的名字是誰取的？背後有甚麼故事？小時候有沒有一個大人常叫你的小名——他是誰？你記得他叫你時的聲音嗎？","【二、扎心】經文說：「我們的心若責備我們，神比我們的心大」（3:20）。說出一件你到今天還常在心裡審自己的事（只說大概，不必說細節）——大約是哪一年、在哪裡發生的？你通常在一天的甚麼時候想起它？","【三、福音】約翰說：「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1）。說出你第一次覺得「神真的是我的父」的時刻：幾歲、在哪裡、當時發生了甚麼、是誰陪著你？","【四、行動】「凡有世上財物的，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能存在他裡面呢？」（3:17）說出一位你身邊正在缺乏的人（可以只說稱呼），以及這一週你要為他做的一件具體的事：哪一天、做甚麼、帶甚麼去。","【五、代禱】為三種人指名禱告：一位常常懷疑自己得救、心一直責備自己的弟兄姊妹，求主叫他在神面前安穩，也有好的輔導陪伴；一位正處在不安全關係裡的人，求主保護他，讓他找到可信的人與機構幫助；一位從小沒有被父親疼愛過的人，求天父親自叫他的名字。"],"prac":{"main":"這一週，我先抬頭看父給了甚麼，再用行為和誠實去愛一個人；我的心若責備我，讓比我的心大的神說最後一句話。","items":["對神：每天早上讀 3:1，把「我們」換成自己的名字唸出來，說一聲「父啊，謝謝你叫我作你的孩子」；每天晚上讀 3:20，把今天心裡最重的一句責備說給神聽，然後說：「你知道一切。」","對自己：這七天，每次跌倒或心裡開始審自己，就記下時間和那一句責備的話。週末讀一遍，分成兩欄：哪些需要向神認罪、向人道歉（1:9）？哪些只是舊的控告，可以交給比我的心大的神？","對人：選一位你身邊正在缺乏的人，這一週用一件具體的事去愛他：一袋米、一次接送、一筆學費、一頓飯，不必告訴別人。同時想一想：你是不是欠某個人一句誠實的話，或一次遲來的道歉？","對生活：如果你身處的關係讓你害怕、受傷或被控制，這一週把情況告訴一位可信任的人，或聯絡相關的求助專線；涉及暴力，請報警。若你長期被反覆的自責與失眠困擾，預約一次醫生或輔導。","對使命：用三句話向一位教會外的朋友說 3:1：神不只是造物主，他願意作父；這個身分不是掙來的，是他給的；耶穌捨命，叫我們知道甚麼是愛。並在小組提一個具體的互助安排。"]},"safe":["① 用 3:6、9 對仍在掙扎的信徒說：「你還會犯罪，表示你根本沒有從神生」「真基督徒是不能犯罪的，你要檢查自己是不是假信徒」。","約翰在同一封信說「我們若說自己無罪，便是自欺」（1:8），也說「若有人犯罪，在父那裡我們有一位中保」（2:1）；3:9 講的是從神生的人的本性與方向，種還在，跌倒時有中保。只讀 3:9 不讀 2:1，會讓最認真、最敏感的人在夜裡懷疑自己的身分（紅線一；議題見〈3:6、9「凡從神生的，就不犯罪」——各家怎樣解？〉，全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位昨晚又跌倒、今天帶著羞愧來聚會的弟兄姊妹聽完，是知道種還在、中保還在、可以回到父那裡，還是開始懷疑自己從來沒有得救？","② 反過來，用 1:8 和 2:1 合理化刻意、持續的罪：「反正人人都會犯罪，神會赦免」「我有中保，這件事改不改沒關係」。","2:1 的前半句是「我將這些話寫給你們，是要叫你們不犯罪」（2:1）；中保是給跌倒的人回家的路，不是繼續住在罪裡的許可證。3:4 說罪就是不法，是心裡那一句「我自己作主」；3:3 說有這指望的人就潔淨自己。把恩典講成放縱，是輕看主顯現要除掉罪（紅線一；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位明知自己正在一段不該有的關係或習慣裡的人聽完，是聽見回頭的邀請和回頭的路，還是覺得反正有中保、可以慢慢來？","③ 用 3:10 給人貼標籤：「那個人不行義，就是魔鬼的兒女」「反對牧師的人都是屬魔鬼的」；或拿這一節罵還沒信主的家人。","約翰給的是標準（行義、愛弟兄），用途是自省與分辨教導，不是發一張名單讓我們去分誰屬哪一家；保羅也說我們從前「本為可怒之子，和別人一樣」（弗 2:3）。拿這一節貼人標籤，會把愛弟兄的命令變成定罪的工具，也會傷害離開教會的人與未信的家人（紅線五；議題見〈3:10「魔鬼的兒女」——可以這樣稱呼人嗎？〉）。","檢驗標準：會眾聽完，是更省察自己有沒有愛弟兄，還是更會在心裡把別人分類、替神宣判誰屬哪一家？","④ 用 3:8 把一切都說成魔鬼作怪：「你憂鬱是被鬼壓」「孩子生病是家裡有破口，要趕鬼，不必看醫生」；或反過來把魔鬼講成只是一種比喻。","約翰在意的不是魔鬼的起源與排場，是神的兒子顯現的目的：解開、拆毀魔鬼的作為。把一切病痛歸給魔鬼，會讓人延誤就醫，也在家人身上加上屬靈的羞辱；把魔鬼講成不存在，又輕看了約翰說的屬靈真實。焦點在那位已經得勝的基督（議題見〈3:8「魔鬼從起初就犯罪」——魔鬼從哪裡來？「除滅魔鬼的作為」是甚麼意思？〉）。","檢驗標準：一位正在服藥治療憂鬱症的弟兄姊妹聽完，是更知道基督在他身邊、可以安心繼續就醫，還是開始懷疑自己被鬼附、想把藥停掉？","⑤ 用 3:16 要求受傷的人留在不安全的關係裡：「主為我們捨命，你也要為你先生捨，被打就忍下來」「為了孩子、為了見證，不要報警、不要張揚」。","主的捨命是主動的，是為了救人脫離罪，不是為了讓罪繼續傷人；愛要「在行為和誠實上」（3:18），誠實的愛包括說出真相與設下界線。原諒可以交給神，和好需要對方真實的悔改與安全。家暴、性侵、虐待，要鼓勵當事人向可信的人與相關機構求助，涉及刑事建議報警（紅線三；議題見〈3:16「我們也當為弟兄捨命」——要為傷害我的人捨命嗎？愛有沒有界線？〉，全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：一位正在家暴裡、今天偷偷來聚會的姊妹聽完，是知道神不要她留在危險裡、可以求助、可以報警，還是覺得忍下去才算像主一樣捨命？","⑥ 用 3:20 責備長期自責、良心過敏的人：「你一直覺得被定罪，就是信心不夠」「神早就赦免你了，你還在想，表示你不信」。","約翰在這裡是安慰心在控告的人，不是再加一層控告；「安穩」原文是說服、安撫。有些人反覆認罪、反覆懷疑得救，背後是需要醫治的強迫思想或創傷，禱告不取代醫療與輔導。把他們的掙扎說成信心問題，等於把「神比我們的心大」講成神比我們的心更兇（紅線二；議題見〈3:20「神比我們的心大」——心一直責備自己的人，怎樣在神面前安穩？〉）。","檢驗標準：一位會為同一件事認罪幾十次、仍然睡不著的弟兄姊妹聽完，是感到神比他的心大、願意接受幫助，還是覺得自己連相信都做不好？","⑦ 反過來，用 3:20 安撫刻意不悔改的良心：「神比你的心大，良心不安不必理會」「感覺被責備，一律是撒但的控告」。","3:19–20 的安慰是給「屬真理的」（3:19）人，就是在行為和誠實上回應愛的人；良心的聲音有時是聖靈的提醒，有時是舊的控告，要分辨，不可一律關掉。依著神的意思憂愁，是「生出沒有後悔的懊悔來，以致得救」（林後 7:10）（紅線一；議題見〈3:20「神比我們的心大」——心一直責備自己的人，怎樣在神面前安穩？〉）。","檢驗標準：會眾聽完，是更知道怎樣把良心的不安帶到神面前分辨、該認的罪就認，還是學會用一句經文把良心關掉？","⑧ 把「我們必要像他」（3:2）講成人終要變成神：「你裡面有神性，修到最後就和神一樣」；或講成基督徒現在就應當完美無瑕。","ὅμοιοι 是「相似」，不是「同一」；我們要像復活得榮的基督，卻永遠是受造的兒女。而且那是主顯現時的事，「將來如何，還未顯明」（3:2）。把得榮講成現在的完美，會讓人假裝；講成變成神，會模糊創造主與受造者的分別（議題見〈3:2「我們必要像他」——基督徒會變成神嗎？〉）。","檢驗標準：會眾聽完，是更謙卑、也更有盼望地等候主顯現，還是開始追求某種「神性」，或對自己的不完全更加焦躁？","⑨ 用 3:12 該隱的故事替家庭衝突定性：「兄弟不和，總有一個是該隱」「你會嫉妒，所以你就是殺人的」。","約翰用該隱說明恨從比較與嫉妒開始，是要我們在門前就警醒——「罪就伏在門前。它必戀慕你，你卻要制伏它」（創 4:7）；神那時還在對該隱說話，門還開著。拿這個故事替家人定性，會把一場需要聆聽與調解的衝突，變成一場宣判（議題見〈3:12 該隱「屬那惡者」——創世記第 4 章怎樣讀？〉）。","檢驗標準：一位正和兄弟姊妹為了遺產或照顧父母而關係緊繃的人聽完，是更願意省察自己的嫉妒、也願意尋求調解，還是開始在心裡指認誰是該隱？","⑩ 用 3:15 叫被傷害的人不准生氣：「你對他還有怒氣，就是殺人的」「受了傷要馬上放下，不然你就沒有永生」。","約翰說的恨是一種定住的心志，是心裡希望對方不存在；被傷害的人心裡有憤怒，是傷口在說話，可以帶到神面前——「生氣卻不要犯罪」（弗 4:26）。逼受害者立刻放下，會讓傷口化膿，也替加害者免去了責任（紅線三；議題見〈3:15「凡恨他弟兄的，就是殺人的」——心裡的怒氣也是罪嗎？〉，全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：一位曾被性侵或霸凌、至今想起來仍會發抖的弟兄姊妹聽完，是知道可以把憤怒帶到神面前、不必假裝，還是覺得自己因為生氣而失去了永生？","⑪ 用 3:17 向會眾施壓奉獻或斂財：「你不為建堂認獻，就是塞住憐恤的心」；或要人把自己的家掏空才算愛。","3:17 說的是「看見弟兄窮乏」（3:17），是具體的人、具體的缺乏，不是一般性的募款；保羅也說奉獻「乃是照他所有的，並不是照他所無的」（林後 8:12），又說「不要作難，不要勉強」（林後 9:7）。把憐恤講成罪疚，會讓窮的人更窮，也讓同工濫用權柄（議題見〈3:17「看見弟兄窮乏」——基督徒的財物要怎樣對待窮乏的弟兄？〉）。","檢驗標準：一位正在付房貸和醫藥費的家庭聽完，是知道自己可以照所有的去愛、也可以接受幫助，還是因為捐不出來而羞愧得不想再來？","⑫ 反過來，把 3:17–18 講成只要心裡有愛就好：「我為他禱告就是愛了」「誰知道他是不是騙人，所以不必給」。","約翰說的不是看不見，是看清楚了然後關上；愛「不要只在言語和舌頭上」（3:18）。分辨是需要的，分辨卻不能成為一律關門的藉口；雅各也問，只說「平平安安地去吧」（雅 2:16），卻不給身體所需用的，有甚麼益處（議題見〈3:17「看見弟兄窮乏」——基督徒的財物要怎樣對待窮乏的弟兄？〉）？","檢驗標準：會眾聽完，能不能說出一個缺乏者的名字，以及這一週要為他做的一件具體的事？","⑬ 用 3:22「一切所求的，就從他得著」教成功神學：「你求不到，就是命令守得不夠」「多奉獻、多守規條，禱告就靈」。","約翰說的是一個住在父心意裡的孩子，所求的漸漸變成父所喜悅的；5:14 補上條件「若照他的旨意求甚麼」（5:14）。這使我們想起主在客西馬尼園的禱告：「不要照我的意思，只要照你的意思」（太 26:39）。把禱告講成交易，會讓病中、失業中的人在苦上再加一層罪疚。","檢驗標準：一位為病重的家人禱告了一年、病仍沒有好轉的弟兄姊妹聽完，是更認識那位與他同在的父，還是開始懷疑自己哪一條命令沒守好？","⑭ 用 3:13「世人若恨你們」把一切人際衝突都說成逼迫：「同事不喜歡你，是因為你屬神」「家人反對，就是世界在恨你」。","約翰說的是該隱式的恨：因為兄弟的行為是善的而恨，不是一切的不和。有時別人不喜歡我們，是因為我們的態度、失誤或論斷；把它全叫作逼迫，會讓人不再省察，也把家人正常的擔心推得更遠。","檢驗標準：會眾聽完，是更能分辨自己受的冷淡是為義還是為己，還是學會把每一次衝突都解讀成自己屬靈的證明？","⑮ 把 3:18 講成 321 的證明：「3:18 就是 920」「約翰早就在教 321」，讓經文變成 321 的插圖。","要先讓經文自己講完：3:18 說的是被主捨命之愛愛過的人，開始在行為和誠實上去愛弟兄。321 在末端認出 920 的樣子——對身邊那一個人去愛——這使我們想起，而不是等於。用一個「就是」把經文和術語綁在一起，會讓人記得口號，忘了十字架。","檢驗標準：會眾聽完，記得的是主為我們捨命的愛，還是只記得一個數字口號？","⑯ 用處境取消原則，或把處境硬搬：「這是寫給一世紀被假教師攪擾的教會，和我們無關」；或「教會分裂時留下的才是神的兒女」。","書信三問要走完：處境是一個剛經歷分裂、有人離去、信徒被假教導動搖的教會；原則是兒女的身分是父給的，兒女的方向是離開罪、彼此相愛，兒女的安穩在於神比我們的心大；今天這原則落在每一個懷疑自己、自責、或只在嘴上愛人的信徒身上（紅線五；全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉）。","檢驗標準：會眾聽完，能不能說出這一章在他自己的家、職場、小組裡要改變甚麼，而不是只記得一世紀的爭論？"]},{"n":4,"t":"神就是愛","sub":"試、先、懼","lv":"A","arc":"愛","sec":[["4:1--6","總要試驗那些靈：在你們裡面的，比在世界上的更大"],["4:7--12","神就是愛：不是我們愛神，乃是神愛我們"],["4:13--16","住在愛裡面的，就是住在神裡面"],["4:17--21","愛裡沒有懼怕：我們愛，因為神先愛我們"]],"serm":{"pts":[["試驗那些靈","4:1--6","「那在你們裡面的，比那在世界上的更大」——分辨的標準是基督論：認耶穌基督是成了肉身來的；分辨不是出於懼怕，是出於屬神的確信"],["乃是神愛我們","4:7--16","「不是我們愛神，乃是神愛我們」——全卷樞紐：命令不是門檻，是回應；看不見的神，在彼此相愛的人中間被看見"],["神先愛我們","4:17--21","「我們愛，因為神先愛我們」——愛裡沒有懼怕，是因為審判的懼怕被神的愛除去；愛神的，也當愛弟兄"]]},"q":"她在教會長大，詩歌都會唱，也背得出「神就是愛」。可是每一次犯了錯，她心裡就有一個聲音說：這一次，神大概真的不要你了。她更努力服事，更早到、更晚走，好像要用表現換一張不會被趕出去的通行證。\n坐在她後面的那位弟兄，是另一種怕：他在上一間教會被一位長執公開羞辱，到今天看見那個人的名字還會手心冒汗；有人引 4:20 對他說，不肯和好，就是不愛神。\n這一章要回答的是：神的愛到底是一張要先考及格的門票，還是一個已經為我們打開的家？被愛的人，要怎樣在誠實與安全裡去愛人？","truth":"愛的起點不在我們：「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了」（4:10）。\n所以一切的命令都不是門檻，是回應——「我們愛，因為神先愛我們」（4:19）；被愛的人，審判的懼怕被除去，也開始學會愛看得見的弟兄。","mv":{"t":"不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。","r":"約壹4:10"},"card":["全卷五個字「光・住・兒・愛・勝」，第四章是愛，也是全卷的樞紐。約翰先叫我們試驗諸靈，標準是成了肉身的耶穌；再告訴我們愛的源頭——神就是愛，他差兒子作挽回祭；然後說看不見的神，在彼此相愛的人中間被看見；最後落在兩件事上：愛把審判的懼怕除去，愛神的也當愛弟兄。整章的順序只有一個：他先。","這一章的主詞，越讀越是神。愛是從神來的（4:7）；神就是愛（4:8、16）；神差他獨生子到世間來，使我們藉著他得生（4:9）；不是我們愛神，乃是神愛我們（4:10）；神將他的靈賜給我們（4:13）；父差子作世人的救主（4:14）；神先愛我們（4:19）。連「那在你們裡面的，比那在世界上的更大」（4:4），也是在說他。人在這一章做的每一件事——試驗、相愛、認信、不懼怕——都是第二個動作。","4:19 原文只有幾個字：ἡμεῖς ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς。「我們愛」沒有受詞——不只是愛神，也不只是愛人，是被愛的人身上長出來的整個愛的能力。πρῶτος（prōtos）「先」放在「他」旁邊，像一個父親搶先伸出手。這改變今天的讀法：你不必先檢查自己的愛夠不夠熱，才敢確定神愛你；順序是他先，你後。你的愛是回聲，不是原聲；回聲小一點、慢一點，原聲都還在。","「我愛神，只是不想跟那位弟兄說話。」這句話很少有人說出口，卻常常在心裡。這一章照出來的有己，是把愛當成可以挑對象的東西：對看不見的神很熱，對坐在旁邊、讓我失望的人很冷；或是把愛當成交易，愛得夠多才敢確定神會一直要我。4:20 不是叫人裝熱，是叫人先承認：我還需要先被愛。","全章最該被記住的，是 4:10 的那個「乃是」。我們以為信仰是先愛神、再被接納；約翰說反了。不是我們愛神，乃是神愛我們；不是我們去平息他，是他自己預備了挽回祭。所以下一次你又覺得自己不夠好、怕被丟下的時候，不必先問「我愛他夠不夠」，先問「他怎樣愛了我」。答案在十字架上，不在你今天的表現裡。","這一週，每天早上讀 4:10 一次，把「我們」換成「我」唸出來。然後挑一個你看得見、卻一直不太想愛的弟兄姊妹，做一件安全而具體的小事：一則問候、一次代禱、一頓飯。如果那個人曾經傷害你、靠近並不安全，就不要勉強見面，只在神面前為他禱告一句，把審判交給神。晚上寫兩行：今天我在哪裡被神先愛了？","最終整合：寄養家庭的客廳，晚上十點。\n小凱七歲，來這個家第四個月。他從來不說謝謝，吃飯時把麵包塞進口袋，夜裡常醒來確認門有沒有鎖。社工說，他搬過五個家，學會的第一件事是不要讓任何人靠近。\n寄養媽媽每天晚上做同一件事：替他蓋被子，說一句「明天我還在」。他每次都轉過身去，一百多個晚上，沒有回過一句話。\n那天她發燒，躺在沙發上起不來。她聽見廚房有聲音，接著一隻小手把一杯水放在她旁邊，水灑了一半。小凱站在那裡，不看她，小聲說：「明天我還在。」\n她哭了。不是因為自己做得多好，是因為她忽然認出了自己。很多年前，她也是那個轉過身去的孩子，對神不說謝謝，口袋裡塞滿了自己的保障。是神一個晚上又一個晚上地說「我還在」，直到有一天，她也學會了回話。\n「我們愛，因為神先愛我們」（4:19）。\n小凱那杯灑了一半的水，不是他的成績，是他被愛到一個地步的回聲。我們對神的愛也是。先說話的，從來都是他。"],"self":"這一章照出來的「有己」，常常穿著屬靈的衣服：我要先愛得夠好，才配被愛；我要先把懼怕處理掉，才敢靠近神；我說我愛神，卻只愛那些好相處的人。我們把愛變成考核，又把考核拿去量別人。\n底下是同一件事：焦點在自己。焦點在自己的表現，人就會怕；焦點在別人的虧欠，人就會恨。這一章叫我們把眼睛移到 4:10——是他先愛，是他預備了挽回祭；眼睛一轉，懼怕退去，愛才開始流動。","t321":{"k":"耶穌是我的榜樣：約翰說「因為他如何，我們在這世上也如何」（4:17）。耶穌怎樣愛？他先愛。門徒還沒有洗腳，他先拿起手巾；彼得三次不認主，他先在岸邊生了炭火，預備了早飯，然後三次問「你愛我嗎」（約 21:17）。他的愛也有真理：他沒有假裝猶大的事沒有發生，也沒有把自己交在還沒到時候的危險裡：人要拿他，他「逃出他們的手走了」（約 10:39）。跟隨這位榜樣，是學他先伸出手，也學他的誠實：愛不是假裝沒有受傷，是在真理裡給出自己。","g":"讓耶穌作王：「不是我們愛神，乃是神愛我們」（4:10）。這一章要人讓出來的，是愛的主詞。一種人把自己放在主詞的位置上量自己：今天愛得夠不夠，越量越怕神會翻臉；另一種人拿著自己的愛去量別人：誰屬靈、誰是假先知、誰不配被愛。約翰說，主詞先是他：審判的日子是他的，挽回祭也是他預備的。讓耶穌作王，就是承認那在我們裡面的比世界上的更大（4:4），把懼怕交給他，把傷害過我們的人也交給他。主詞換回來，人才回到被愛的位置——先被愛，然後去愛。下一次開口禱告時，留意第一個字：是「你」，還是「我」？","p":"建立屬神的體系：「從來沒有人見過神，我們若彼此相愛，神就住在我們裡面」（4:12）。看不見的神，要在一群人怎樣相待裡被看見；屬神的體系不是先有一套組織，是先有一群被神先愛、也彼此相愛的人。所以小組要成為安全的地方：有人說出焦慮與創傷，不被說成愛不夠完全，而是被陪伴、被轉介；教會要有保護弱勢的機制，碰到侵害不遮掩，協助求助與通報；分辨教導時有清楚的基督論標準，不靠某一個人的感覺。第一次走進來的人未必聽得懂講台，卻看得見我們怎樣對待最軟弱的那一位——神在那裡被看見。"},"grp":["【一、破冰】小時候，誰是第一個讓你覺得「我被人放在心上」的人？說出他的稱呼和一件具體的事——在哪裡、你幾歲、他做了甚麼。","【二、扎心】經文說：「愛裡沒有懼怕；愛既完全，就把懼怕除去」（4:18）。說出你心裡最常出現的一句「神大概不要我了」，是在甚麼時候出現的？那一刻你用甚麼方法想讓自己重新被接納？","【三、福音】讀一遍「不是我們愛神，乃是神愛我們」（4:10）。說出一次你還沒有愛神、甚至在遠離他的時候，卻發現他已經先愛了你的經歷：那時候你在哪裡、發生了甚麼、他用了誰來找你？","【四、行動】說出一位你看得見、這一週要去愛的弟兄姊妹：他的名字、你要做的一件事、哪一天做。如果你想到的是一位傷害過你的人，可以只說「我要把他交給神」，不必說名字，也不必見面。","【五、代禱】為三種人指名禱告：一位正在焦慮、恐懼或創傷裡、仍在就醫的弟兄姊妹，求主的愛除去他對審判的懼怕，也賜他好的醫生與陪伴；一位在教會或家裡受過傷的人，求主保守他的安全與心；一位你這一週要去愛的人，求主先愛他，也先愛你。"],"prac":{"main":"這一週，我不再先量自己的愛夠不夠，只回到他先愛我；被愛之後，在誠實與安全裡去愛一個看得見的人。","items":["對神：每天早上讀 4:10，把「我們」換成「我」唸出來；每天晚上讀 4:19，說一句：「今天你先愛了我，我在這裡回應你。」若心裡有對審判的懼怕，就直接告訴他，不必先把它處理好。","對自己：這七天，每當你發現自己在用表現換取被接納——多做一件事、怕被說不夠屬靈——就記下來。週末讀一遍，不責備自己，只問：那一刻，我忘了是誰先愛我？","對人：選一位看得見、卻一直不太想愛的弟兄姊妹，做一件安全而具體的小事：問候、代禱、送一份點心。若對方曾傷害你、靠近不安全，就只在禱告裡把他交給神，不勉強見面。","對生活：如果你長期焦慮、失眠、恐慌，這一週預約一次醫生或輔導，或告訴一位可信任的人；若正在服藥，繼續按醫囑就醫。神的愛也常常藉著醫生、藥物與陪伴臨到你。","對使命：用三句話把 4:10 講給一位教會外的朋友聽：神先愛我們、他差兒子為我們的罪死、所以我們不必先變好才來。並在小組裡提議一件讓看不見的神被看見的事，例如輪流探訪一位病人。"]},"safe":["① 用 4:18 責備焦慮、恐慌、憂鬱或受過創傷的人：「你會怕，就表示你的愛不完全」「真正住在愛裡的人不會焦慮」。","4:18 的懼怕約翰自己定義了：「懼怕裡含著刑罰」（4:18），是對審判、對被定罪的懼怕，不是心理診斷；焦慮症、恐慌、創傷後的驚嚇有身體、經歷與環境的成因。把這節當成責備，會叫受苦的人在病上再加一層羞恥，把病藏起來（紅線二；議題見〈4:18「愛裡沒有懼怕」——那「敬畏神」呢？有焦慮的人是愛不完全嗎？〉）。","檢驗標準：一位恐慌發作時連聚會都坐不住的弟兄姊妹聽完，是更確知自己被神愛著，還是更覺得自己是一個不合格的基督徒？","② 把 4:18 講成只要禱告、不必就醫：「愛既完全就把懼怕除去，把藥停了才是信靠神」「看輔導就是不信神的愛」。","禱告很寶貴，但禱告不取代醫療與輔導；神所賜的平安常常正是藉著醫生、藥物、專業輔導與弟兄姊妹的陪伴臨到。有人在服藥，要肯定他繼續就醫，不叫他自行停藥；聽見自傷的念頭，立即連結醫療與危機資源（紅線二）。","檢驗標準：一位正在服用抗焦慮藥物、每週看輔導的弟兄姊妹聽完，是更願意繼續就醫、也更願意禱告，還是想偷偷把藥停掉？","③ 把 4:18 講成「要更努力去愛，懼怕才會離開」：「你怕神，是因為你愛他愛得不夠多，回去加倍服事」。","這把順序弄反了。除去懼怕的，是「完全的愛」，而這愛的源頭是 4:10——神愛我們，差兒子作挽回祭；審判的刑罰已經落在他兒子身上。答案不是自己更努力，是更確知被愛。叫人用表現去趕走懼怕，只會讓懼怕更深（紅線二；全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉）。","檢驗標準：一位信主多年、仍常覺得神隨時會翻臉的弟兄姊妹聽完，是把眼睛移到十字架上，還是給自己排了更多的服事來證明自己？","④ 用 4:20 要求受傷的人回到不安全的關係：「你不肯回家，就是恨弟兄」「愛神的人一定要回到那個人身邊」。","約翰說的愛要「在行為和誠實上」（3:18）；誠實的愛承認傷害是真的，也不假裝一個危險的人已經安全。為了保護自己和孩子而保持距離、設下界線，不等於 4:20 的恨。叫受害者為了屬靈的理由留在危險裡，是把命令變成枷鎖（紅線三；全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：一位正在家暴裡、坐在後排的姊妹聽完，是更知道神不要她留在侵害裡、可以求助，還是更覺得離開就是不愛神？","⑤ 把原諒和和好講成同一件事，用「說謊話的」逼人立刻和好：「原諒了就要像以前一樣」「你還不想見他，就是說謊話的」。","原諒可以交給神，是把審判的權柄還給那位公義的審判者；和好卻需要對方真實的悔改，也需要安全與時間，有時候在地上一直走不到。「若是能行，總要盡力與眾人和睦」（羅 12:18）本身就承認了限度。把兩件事混在一起，會逼受傷的人在還沒有安全時假裝沒事（紅線三；議題見〈4:20「人若說我愛神，卻恨他的弟兄」——在教會受過傷、無法與某人和好的人怎麼辦？〉）。","檢驗標準：一位曾被同工公開羞辱、對方至今沒有認錯的弟兄聽完，是知道可以把對方交給神、自己慢慢得醫治，還是覺得自己必須馬上去握手才算愛神？","⑥ 用 4:21「愛神的，也當愛弟兄」要求教會裡的侵害「家醜不外揚」：「都是弟兄姊妹，不要報警，私下處理就好」「告上法院就是不愛弟兄」。","愛弟兄包括保護被傷害的弟兄姊妹。遇到家暴、性侵、虐待，要鼓勵當事人向可信的人與相關機構求助；涉及刑事的，建議報警，教會配合調查，不遮掩、不施壓。把愛講成沉默，被犧牲的永遠是最弱的那一個（紅線三；全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。","檢驗標準：如果受害者或他的家人就坐在台下，他聽完是覺得教會會站在他這一邊、陪他求助，還是覺得說出來就是破壞教會的愛？","⑦ 用 4:1–3 在講台上點名：「某某政治人物就是那敵基督」「某個宗派、某個國家就是假先知」。","約翰給的標準是基督論——認不認耶穌基督是成了肉身來的——不是政治立場、國籍或宗派標籤；他說的是一種「靈」、一種教導，沒有叫讀者去猜那個人是誰。把經文貼在人身上，會讓講台變成黨派的工具，也讓會眾把分辨變成仇恨（紅線四；全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉）。","檢驗標準：一位政治立場和講員不同的弟兄姊妹聽完，是更清楚怎樣用耶穌基督來分辨教導，還是覺得自己被劃到敵基督那一邊？","⑧ 用 4:3「現在已經在世上了」算日子：「敵基督的靈越來越明顯，主再來的日期快到了」「照這些徵兆推下去，就在這幾年」。","約翰在一世紀就說「如今是末時了」（2:18），4:3 的「現在」是約翰那時候的現在；每一代教會都要分辨，沒有一代被授權去推算日期。算日子會讓人恐慌、讓人失望，也讓人忘了約翰真正要的：被愛的人安靜地試、安靜地站住（紅線四；議題見〈4:1「試驗那些靈」——怎樣分辨？靈恩、預言與先知恩賜怎麼看？〉）。","檢驗標準：會眾聽完，是更懂得每一次聽道都回到耶穌基督去試，還是開始在新聞裡找徵兆、算年份？","⑨ 把「試驗那些靈」講成懷疑一切、獵巫：「凡有人說神感動他，都先當作假的」「別的教會都要提防」；或反過來說「凡有感動就是聖靈」。","δοκιμάζω 是驗金子的字，是為了認可而試，目的是找出可以持守的，不是找人攻擊；保羅同時說「不要藐視先知的講論」（帖前 5:20），又說「但要凡事察驗」（帖前 5:21）。一律否定與照單全收，都是逃避分辨的功課（議題見〈4:1「試驗那些靈」——怎樣分辨？靈恩、預言與先知恩賜怎麼看？〉；全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉）。","檢驗標準：一位剛聽朋友說「主給我一句話要給你」的弟兄姊妹聽完，是知道怎樣帶著這句話回到聖經和耶穌去試，還是只剩下全信或全不信兩條路？","⑩ 用 4:6「認識神的就聽從我們」建立講員的絕對權柄：「不聽我的，就是不屬神」「質疑牧師，就是謬妄的靈」。","4:6 的「我們」較好的讀法是使徒見證人——那些親眼看見、親手摸過的人；檢驗教導的標準是使徒傳下來、今天寫在新約裡的見證，不是任何一個今天的講員。把這節拿來保護自己，正好落在約翰要人分辨的那一種靈裡（紅線六）。","檢驗標準：會眾聽完，是更願意拿聖經來查考講台上的話，還是更不敢對講員提出任何問題？","⑪ 把「神就是愛」倒過來讀成「愛就是神」：「凡是愛都是神，只要相愛就好，不必管真理」「神就是愛，所以不會審判任何人」。","ὁ θεὸς ἀγάπη ἐστίν 說的是神的本性，不是等號；同一位約翰也說「神就是光」（1:5），也記下「神的震怒常在他身上」（約 3:36）。人間許多打著愛的名號的放縱、操控、沒有界線的委屈，都不是從他來的；要知道愛是甚麼，得看 4:10 的十字架（議題見〈4:8「神就是愛」——那審判與忿怒呢？「愛就是神」對不對？〉）。","檢驗標準：會眾聽完，是更認識一位又聖潔又愛人的神，還是只記得一句可以拿來包裝任何事的標語？","⑫ 把 4:10 的挽回祭講成兒子去平息一位不情願、生氣的父親：「耶穌替我們擋住了父神的怒氣，父本來不想救我們」。","4:10 的主詞從頭到尾是神：他愛了我們，他差了兒子，他使兒子作挽回祭。不論採平息忿怒或除罪的理解，祭都是神自己預備的，不是人或兒子去說服一位冷漠的神。把父與子對立，會讓人愛耶穌、卻一輩子怕天父（全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉）。","檢驗標準：一位從小怕嚴厲父親、也怕天父的弟兄姊妹聽完，是更確知差兒子的就是天父的愛，還是更覺得天父是需要被擋住的那一位？","⑬ 用 4:8「沒有愛心的，就不認識神」審查人有沒有得救：「你對某某還有氣，證明你根本沒有重生」「愛不出來的人都是假信徒」。","這一節說明認識神不可能只停在頭腦，不是一把量別人得救的尺；約翰寫信是要叫信的人「知道自己有永生」（5:13）。仍在學愛、仍在掙扎的人，需要的是回到源頭——愛是從神來的——而不是被宣判（紅線一；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位正努力學習原諒、卻還常常心裡有氣的弟兄姊妹聽完，是更想回到神那裡領受愛，還是開始懷疑自己根本不是神的兒女？","⑭ 用 4:4 把屬靈爭戰講成到處都是鬼、到處都要驚恐：「你失眠、生病、夫妻吵架，都是邪靈攻擊，要趕鬼」「不天天宣告，魔鬼就會吞吃你」。","4:4 的重點是「已經勝了」，因為那在你們裡面的更大；屬靈爭戰是真實的，但約翰給的是確信，不是驚恐。把一切難處都歸給邪靈，會叫人忽略醫療、忽略關係裡該負的責任，也把會眾養在懼怕裡，正與 4:18 相反（議題見〈4:4「那在你們裡面的，比那在世界上的更大」——屬靈爭戰要怎樣面對懼怕？〉）。","檢驗標準：會眾聽完，是更安靜地知道自己屬神、那更大的一位與他同在，還是更緊張、看甚麼都像攻擊？","⑮ 把經文當成 321 的插圖：「4:12 就是建立屬神的體系」「4:4 正是 321 得勝者的口號」，好像約翰是在替我們的課程背書。","先讓經文自己講完：4:12 講的是看不見的神在彼此相愛的人中間被看見，4:4 講的是那位更大的住在信徒裡面。經文講完，321 才在末端認出這些亮光；把經文和 321 術語用「就是」綁在一起，會讓會眾記得課程，卻忘了經文的主詞是神。","檢驗標準：會眾聽完，記得的是「神先愛我們」，還是只記得 321 的幾個口號？","⑯ 用處境取消原則，或把處境硬搬：「這是寫給一世紀分裂後的教會，今天不必試驗甚麼」；或「每一間和我們不同的教會，都是那一群出去的人」。","書信三問要走完：處境是一群剛經歷分裂、被自稱有靈感的人攪亂的弟兄姊妹；原則是以成了肉身的耶穌來分辨，並且因為神先愛我們而彼此相愛；今天這原則落在每一個常聽到「神告訴我」、心裡怕被丟下、在關係裡受過傷的人身上，不是拿來劃分教會陣營（全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉）。","檢驗標準：會眾聽完，能不能說出這一章在他的小組、家庭、網路生活裡要改變甚麼，而不是只記得「那是約翰那時候的事」或「那是別間教會的問題」？"]},{"n":5,"t":"使我們勝了世界的，就是我們的信心","sub":"勝、證、知","lv":"A","arc":"勝","sec":[["5:1--5","凡從神生的，就勝過世界：他的誡命不是難守的"],["5:6--12","水、血與聖靈：人有了神的兒子就有生命"],["5:13--17","要叫你們知道自己有永生：照他的旨意求"],["5:18--21","我們知道：那位真實的，與遠避偶像"]],"serm":{"pts":[["勝過世界","5:1--5","「使我們勝了世界的，就是我們的信心」——得勝的主詞是從神生的人，方法是信，對象是世界；不是打敗別人，是不再被肉體的情慾、眼目的情慾、今生的驕傲牽著走"],["有子就有生命","5:6--12","「人有了神的兒子就有生命」——水、血與聖靈三樣歸於一，神為他兒子作見證；永生不是一種經歷，是在他兒子裡面"],["我們知道","5:13--21","「要叫你們知道自己有永生」——全卷的寫作目的；照他的旨意求，為弟兄祈求，最後一句是：你們要自守，遠避偶像"]]},"q":"告別式散了，殯儀館的工作人員開始把折疊椅一排一排收起來。一位姊妹還站在先生的遺照前，等牧師走近，才小聲問：「他走之前好幾年沒來教會。有人跟我說，約翰一書有一種罪是不必為他禱告的。他是不是……」她說不下去，手裡的白花被捏得發皺。\n同一個星期，一位弟兄在醫院的停車場坐了很久：他為母親的病禱告了三年，母親還是走了，小組裡有人說是他的信心有問題。還有一位年輕人，信主五年，每次聽到「得救的確據」就胃痛，因為他不知道自己算不算數。\n這一章要回答的是：信耶穌的人，可以確實知道自己有永生嗎？得勝、禱告、為人祈求，是靠我們的信心有多大，還是靠我們所信的那一位？","truth":"約翰在全卷末了說出寫信的目的：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。\n確據不在我們的表現，在神為他兒子所作的見證；得勝也不靠我們有多強：「使我們勝了世界的，就是我們的信心」（5:4）——信心的力量，來自所信的那一位。","mv":{"t":"我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。","r":"約壹5:13"},"card":["全卷五個字「光・住・兒・愛・勝」，第五章是勝，也是全卷的終點。約翰先把信、從神生、愛三條線打成一個結，說從神生的人勝過世界；再講水、血與聖靈三樣見證，神為他兒子作見證，人有了兒子就有生命；然後說出寫信的目的——要叫你們知道自己有永生；最後落在三個「我們知道」，和一句遠避偶像。這一章不是叫人更用力，是叫人更確定。","這一章的主詞，仍然是神。是神生了信的人（5:1）；是神為他兒子作見證，而且神的見證比人的更大（5:9）；是神賜給我們永生，這永生在他兒子裡面（5:11）；是他聽我們照他旨意的禱告（5:14）；是神把生命賜給被代禱的弟兄（5:16）；是那從神生的保護他（照和合本小字的讀法），那惡者也就無法害他（5:18）；是神的兒子已經來到，將智慧賜給我們（5:20）。連得勝，也是基督先勝了世界，我們的信才接上去。","5:4 的 νίκη（nikē）「得勝」這個名詞，全新約只出現在這裡；πίστις（pistis）「信心」這個名詞，約翰福音一次也沒有用，約翰書信也只有這一次。約翰把兩個難得的字放在一起，像刻在石頭上。ἡ νικήσασα（hē nikēsasa）是不定過去式：那場勝利已經發生了，主說「我已經勝了世界」（約 16:33）。所以信心不是你自己再去打一場仗，是接上一場已經打贏的仗。今天你覺得自己輸了，不等於他輸了。","深夜，一個人又把自己的屬靈紀錄翻出來點算：這個月讀經幾天、禱告多久、跌倒幾次，算完才決定自己今天有沒有永生。另一個人算的是別人：他的禱告為甚麼落空，他過世的父親算不算數。兩本帳簿都不是約翰給的。5:9 說，神已經為他兒子作了見證；確據寫在神的帳上，不在我們手裡。","全章最該被記住的，是 5:13 的那個「知道」。福音書說「但記這些事要叫你們信耶穌是基督」（約 20:31），書信說「要叫你們知道自己有永生」（5:13）。約翰不是要你一輩子站在門口猜自己進不進得去，他寫信就是要你確定。根據不是你今天的感覺，是前一節那一句：「人有了神的兒子就有生命」（5:12）。所以懷疑來的時候，不要先問我夠不夠好，先問：我有沒有他？","這一週，每天早上讀 5:11--13，把「你們」換成自己的名字唸出來。挑一個你一直掛心、卻很久沒有為他禱告的人——一位離開教會的弟兄、一位病中的家人——每天為他禱告一句，照經文說的「就當為他祈求」（5:16）。再挑一樣最近常坐上神位子的東西：手機、存款、別人的眼光，給它一個界線。晚上寫兩行：今天我在哪裡知道自己是屬神的？","最終整合：阿德五十二歲，開了二十年的遊覽車，信主也快二十年了。\n可是他決志過十一次。每一次佈道會、每一次退修會，講員一說「願意接受耶穌的請舉手」，他就舉手。不是不信，是怕。他總覺得上一次大概不算數：那天心不夠誠，後來又發了脾氣，又跟以前的朋友去喝了酒。\n去年冬天，他載一團客人上合歡山看星星，自己留在停車場的車上等。他打開置物箱找手電筒，摸到太太塞在裡面的一本小本新約，書籤夾在約翰一書第五章。5:13 底下有她用原子筆畫的線，旁邊寫著：「阿德，這是寫給你的。」他就著駕駛座的小燈，用粗粗的手指順著那行字讀：「信奉神兒子之名的人」（5:13）；再往下：「要叫你們知道」（5:13）。\n他坐了很久，才傳訊息給太太：「原來這封信是寫給我的。不是寫給感覺很好的人，是寫給信他的人。」\n太太只回了前一節：「人有了神的兒子就有生命」（5:12）。阿德回她：「我一直以為要有夠多的感覺才有生命，原來是要有他。」\n今年的退修會，講員又發出呼召。阿德沒有舉手。他走到最後一排，坐在一位第一次舉手、正在發抖的年輕司機旁邊，按著他的肩膀說：「兄弟，不是你抓住他，是他抓住你。」\n二十年來，改變的不是神的見證——神早就為他兒子作了見證（5:9--11）；改變的是阿德終於肯相信神所說的，過於相信自己的心情。"],"self":"這一章照出來的「有己」，常常藏在兩個極端裡：一端是不敢確定，一直量自己的信心夠不夠大、禱告夠不夠多、得勝的紀錄夠不夠好；另一端是太會確定，確定自己得救，也確定別人沒有，確定「他禱告沒蒙應允是因為信心不夠」。\n底下是同一件事：焦點在自己的信心，不在所信的那一位。5:4 的信心有一個對象，5:12 的生命有一個名字。眼睛從自己的信心移到神的兒子身上，人才能又安息、又謙卑。","t321":{"k":"耶穌是我的榜樣：主在被賣的那一夜說：「我已經勝了世界」（約 16:33）。他說這句話的時候，前面是客西馬尼園，再前面是十字架；他的得勝不是避開苦難，是走過苦難。也在那一夜，他禱告說：「然而，不要照我的意思，只要照你的意思」（太 26:39）。這是 5:14 最好的註腳：照他的旨意求，不是禱告的退路，是兒子對父親的信任。學他的樣式，是在苦難中仍說「他已經勝了」，在禱告沒有照我所想的成就時，仍說「照你的意思」；也是像他在十字架上為人代求那樣，為走遠的人繼續祈求。","g":"讓耶穌作王：這一章最後一句話是「小子們哪，你們要自守，遠避偶像」（5:21）。偶像就是坐在神位子上的東西。以弗所人拜亞底米，今天的人拜的可能是業績、子女的成績、別人的眼光，甚至是自己的屬靈紀錄。約翰沒有給一張偶像清單，他先指出那位真實的：「這是真神，也是永生」（5:20）。讓耶穌作王，不是靠意志把偶像一個一個打倒，是認識了真神，假的就坐不穩了；他的誡命不是難守的，因為作王的那一位不壓垮人。偶像的位置，常常可以從一件事認出來：失去它，你就覺得自己也不算數了。這一週，把那樣東西的名字寫下來，放在 5:20 旁邊讀一次。","p":"建立屬神的體系：「作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一」（5:8）。神的見證從來不是一個孤單的聲音；一個人的確據，也常常是在一群人的代禱裡被扶穩的。所以「人若看見弟兄犯了不至於死的罪，就當為他祈求」（5:16）：看見弟兄跌倒，不議論、不轉傳、不劃清界線，先為他祈求。小組要有代禱的習慣，也要有保密的界線；教會要讓喪親的人、害怕自己犯了不得赦免之罪的人，有牧者可以談、有專業協助可以轉介。國度321空中團契散在各國，那一份代禱名單，是我們彼此相屬的記號。"},"grp":["【一、破冰】你小時候贏過的一場比賽或考試是甚麼？說出那一年你幾歲、在哪裡、誰在旁邊為你高興。","【二、扎心】經文說：「要叫你們知道自己有永生」（5:13）。說出你最近一次懷疑自己是否真的得救，是在甚麼時候、發生了甚麼事？那時候你抓住的是自己的感覺，還是神的話？","【三、福音】讀一遍「人有了神的兒子就有生命」（5:12）。說出你第一次確知自己有了神的兒子，是在哪裡、幾歲、是誰把耶穌介紹給你的？","【四、行動】說出一位你這一週要每天為他祈求的人：他的名字（或只說稱呼），和你要為他求的一件事。再說出一樣這一週要給它界線的偶像，和你要怎麼做。","【五、代禱】為三種人指名禱告：一位禱告了很久、還沒看見答案的弟兄姊妹，求主在等待中親自安慰他；一位為過世家人憂傷或掛心的人，求主擁抱他，也賜他牧者與專業的陪伴；一位離開教會的弟兄姊妹，求神將生命賜給他。"],"prac":{"main":"這一週，我不再用自己的感覺量確據，只回到神為他兒子的見證；被確定的人，為弟兄祈求，也遠避偶像。","items":["對神：每天早上讀 5:11--13，把「你們」換成自己的名字唸出來；禱告時先說「照你的旨意」，再把所求的告訴他，不必先把信心累積到某個份量才敢開口。","對自己：這七天，每當你發現自己在用感覺量得救——今天跌倒就覺得不算數——就記下來，然後讀一次 2:1 和 5:13。週末回頭看：我的確據是放在自己身上，還是放在神的兒子身上？","對人：選一位你常掛心、卻很少為他禱告的人，每天為他祈求一句。若他是已經過世的家人，就把他交在公義又憐憫的神手裡，把自己的憂傷也告訴神，不必替任何人下結論。","對生活：找出最近最常坐上神位子的一樣東西——手機、業績、存款、別人的評價——給它一個具體的界線，例如每晚十點後手機不進臥室，或每週有一天不查帳戶。","對使命：用三句話把 5:11--12 講給一位教會外的朋友聽：神賜下永生、這永生在他兒子裡面、人有了他就有生命。並邀請小組建立一份彼此代禱、也彼此保密的名單。"]},"safe":["① 把 5:4 當成 321 的口號：「5:4 就是 321 得勝者的定義」「約翰早就在替得勝者課程背書」。","先讓經文自己講完：5:4 得勝的主詞是從神生的人，方法是信，勝利是基督已經得的；經文講完，321 才在末端認出得勝者的樣子——從神生的、信耶穌是神兒子的人。用「就是」把經文和課程綁在一起，會眾會記得口號，卻忘了得勝的主詞是神。","檢驗標準：會眾聽完，記得的是「基督已經勝了世界」，還是只記得 321 的一個名稱？","② 把「勝過世界」講成成功學或打敗別人：「得勝的基督徒升職、賺錢、不生病」「信心夠就不會輸」；或說「得勝者就是不再跌倒的人」。","5:4 的世界是 2:16 所說的三種慾望與驕傲，得勝是不再被它們牽著走，不是在世上贏過別人；5:5 說勝過世界的是那信耶穌是神兒子的，不是表現最好的人。把得勝講成成績，跌倒的人會以為自己不屬神，這不是約翰的意思（紅線一）。","檢驗標準：一位這個月剛失業、又跌倒了一次的弟兄姊妹聽完，是知道自己仍可以靠所信的那一位站起來，還是覺得自己是輸家？","③ 用 5:3「他的誡命不是難守的」責備覺得難的人：「你覺得難，表示你沒有真的重生」「真愛神的人遵守起來一點都不累」。","βαρεῖαι 是「沉重、壓垮人」，約翰說誡命不壓垮人，是因為遵守的人有了新生命，不是說不必費力；保羅也寫過立志為善由得我、行出來由不得我。把覺得難當成不屬神的證據，會把真心走這條路的人推出門外（紅線一；議題見〈5:3「他的誡命不是難守的」——那為甚麼我覺得很難？〉）。","檢驗標準：一位天天和同一個試探掙扎的弟兄姊妹聽完，是更願意靠著新生命再走一步，還是開始懷疑自己根本不是神的兒女？","④ 講約翰短句時說：「5:7 是三位一體最清楚的證據，和合本把它刪掉了」；或反過來嘲笑讀欽定本的弟兄姊妹「無知、守舊」。","這段話不見於早期希臘文抄本，後來才在拉丁傳統中出現，再經十六世紀的印本進入公認經文與欽定本；和合本沒有收，是忠於早期抄本，不是刪改聖經。三一論有整本聖經的根據，不靠這一句；使用欽定本傳統的弟兄姊妹愛主、敬重聖經的心是真的，不可嘲笑（議題見〈5:7--8「約翰短句」——三一論靠這一節嗎？〉）。","檢驗標準：一位讀欽定本長大的長輩聽完，是更確信三一真理有整本聖經的根據，還是覺得自己被笑了？","⑤ 用 5:10 說有疑問的人就是把神當作說謊的：「你有疑問，就是不信」「再問問題就是褻瀆」。","約翰指的是聽過神為兒子作的見證、卻定意拒絕的人（「將神當作說謊的」「不信」都用完成式，描寫已定的立場），特別是否認耶穌是基督的教師；正在掙扎的人，聖經的態度是憐憫：那位父親說「我信！但我信不足，求主幫助」（可 9:24），主沒有拒絕他（議題見〈5:10「不信神的，就是將神當作說謊的」——懷疑就是不信嗎？〉）。","檢驗標準：一位心裡有很多問題、卻還想信的人聽完，是敢把疑問帶到神面前，還是決定以後再也不開口？","⑥ 用 5:12 替沒有聽過福音的人、或已經過世而未信的家人宣判：「你阿公沒有信，一定在地獄」「沒聽過福音的人都已經定案了」。","5:12 是對已經信的人講確據（下一節就說明），不是一張替別人宣判的名單；福音的獨一是真的（徒 4:12），但每一個人最後的審判，交在公義又憐憫的神手裡。在喪禮或探訪時用這一節宣判，只會讓人離他更遠（議題見〈5:12「沒有神的兒子就沒有生命」——那沒有聽過福音的人呢？〉）。","檢驗標準：一位剛失去未信父親的弟兄姊妹聽完，是更願意把父親交在神手裡、也更想把福音傳給還活著的家人，還是只剩下絕望？","⑦ 把 5:13 的確據講成驕傲或放縱：「我知道我得救了，怎麼活都可以」「我確定、你不確定，所以你一定有問題」；或反過來說「沒有人能知道自己得救，說知道就是驕傲」。","5:13 的「知道」根據在神的見證（5:9--11），不在我的表現；知道有永生的人倚靠他，自以為站得穩的人倚靠自己（林前 10:12）。把確據講成放縱，違背 2:1 的方向；說沒有人能知道，又讓約翰寫信的目的落空（議題見〈5:13 可以「知道」自己得救嗎？確據與驕傲的界線在哪裡？〉；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：會眾聽完，是更安息、也更謙卑，還是更驕傲或更不安？","⑧ 用 5:14--15 教成功神學：「只要宣告，就一定得著」「把『照他的旨意』跳過去，相信就有」。","約翰給禱告的條件是「照他的旨意」（5:14）；主在客西馬尼園求杯離開，最後說「然而，不要照我的意思，只要照你的意思」（太 26:39），保羅三次求去掉那根刺，得著的回答是恩典夠用。把條件拿掉，禱告就從兒子對父親的信任，變成操控神的工具（紅線七；議題見〈5:14--15「照他的旨意求，他就聽我們」——禱告沒有應允是信心不夠嗎？〉）。","檢驗標準：一位禱告了三年、病仍沒有好的弟兄姊妹聽完，是更敢把一切告訴神，還是更懷疑自己禱告的方法錯了？","⑨ 對禱告沒有蒙應允的人說是信心不夠：「你母親沒有好，是因為你的信心不夠」「一定是有罪沒認清，禱告才不靈」。","5:15 的「得著」用現在式：所求的在他手中，何時、用甚麼方式給，由他決定；主耶穌和保羅的禱告都沒有照他們所求的成就，他們並不缺少信心。對正在喪親、久病的人說這種話，是在傷口上再加一層罪疚（紅線七；議題見〈5:14--15「照他的旨意求，他就聽我們」——禱告沒有應允是信心不夠嗎？〉）。","檢驗標準：一位為過世的家人禱告過很久的弟兄姊妹聽完，是在神面前得著安慰，還是更責怪自己？","⑩ 用 5:16 宣判某一個人，包括已經過世的人：「他自殺了，那就是至於死的罪」「某某離開教會後死了，他犯的就是不能為他禱告的那種罪」。","約翰沒有說至於死的罪是哪一種，講台也不說；任何人都沒有權柄替另一個人下這個結論，更不可對一個正在喪親的家庭這樣說。這一節的重心是「就當為他祈求」（5:16），而審判全地的主必行公義（紅線八；議題見〈5:16--17「至於死的罪」是甚麼罪？可以不為某人禱告嗎？〉）。","檢驗標準：一位家人自殺離世的弟兄姊妹聽完，是感到被神與教會擁抱，還是再一次被定罪？","⑪ 讓自責的人陷在恐懼裡：「你可能已經犯了不得赦免的罪」「你一直擔心，說不定就是犯了」。","會擔心自己犯了這罪的人，本身就說明他的心仍向著神；褻瀆聖靈與至於死的罪，經文描寫的都是硬心的拒絕，不是痛悔中的害怕。反覆出現、停不下來的這類恐懼，常與焦慮或強迫思維有關，除了禱告，也要鼓勵他找牧者談，並尋求專業協助（紅線八、紅線二；議題見〈5:16--17「至於死的罪」是甚麼罪？可以不為某人禱告嗎？〉）。","檢驗標準：一位晚上常因怕自己犯了不得赦免之罪而睡不著的弟兄姊妹聽完，是更確定神接納痛悔的人，還是更害怕？","⑫ 用 5:16 後半拒絕為人禱告：「這個人沒救了，不用為他禱告」「約翰說不必為這種人求，我們就不要再求了」。","約翰對至於死的罪只說「我不說當為這罪祈求」（5:16），沒有下禁令；既然我們看不透人心，就該照前半節繼續為人祈求。神「不願有一人沉淪，乃願人人都悔改」（彼後 3:9），代禱的門不要由我們關上（紅線八；議題見〈5:16--17「至於死的罪」是甚麼罪？可以不為某人禱告嗎？〉）。","檢驗標準：會眾聽完，是更願意為那些看來已經走遠的人繼續禱告，還是開始在心裡替人劃上句點？","⑬ 用 5:18「必不犯罪」叫跌倒的信徒懷疑得救：「真從神生的就不會再犯罪，你還犯，證明你沒有重生」。","「必不犯罪」（5:18）用現在式，與 3:9 相同，指不以罪為生活方向，不是說信徒永遠不會跌倒；約翰早就說過「若有人犯罪，在父那裡我們有一位中保」（2:1）。同時，這一節也不容許人把刻意、持續的不悔改說成小事（紅線一；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉）。","檢驗標準：一位剛剛又跌倒、正在認罪的弟兄姊妹聽完，是更快回到中保那裡，還是更懷疑自己不屬神？","⑭ 用 5:19「全世界都臥在那惡者手下」叫人厭世：「世上的工作、文化、藝術、娛樂都屬那惡者，基督徒最好全都避開」「家人不信，就少來往」。","5:19 說的是一個被動、不自知的處境，像睡在別人懷裡，不是叫信徒逃離世界；主禱告說「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15），而且「神愛世人」（約 3:16），差他兒子作世人的救主（4:14）。2:16 定義的世界是慾望與驕傲，不是受造界、工作和家庭（紅線九；議題見〈5:21「遠避偶像」——今日的偶像是甚麼？〉）。","檢驗標準：一位在職場上、在藝術圈裡工作的弟兄姊妹聽完，是更知道怎樣在世界中作屬神的人，還是覺得要離開自己的崗位才算屬靈？","⑮ 把 5:21 的偶像只講成別人的神像，或拿來羞辱家人的傳統：「拜偶像的是那些燒香的人」「你家人拜拜，他們就是約翰說的那種人」。","5:21 緊接 5:20 的真神：偶像是一切坐上神位子的東西，在以弗所是亞底米廟，在今天也包括業績、金錢、子女、別人的眼光，甚至自己的屬靈形象。對拜偶像的家人，要有分辨，也要有尊重與愛，不是先羞辱再傳福音（議題見〈5:21「遠避偶像」——今日的偶像是甚麼？〉）。","檢驗標準：會眾聽完，是先看見自己心裡的偶像，還是只看見別人家的香爐？","⑯ 用處境取消原則，或把處境硬搬：「這是寫給一世紀以弗所教會的，今天沒有偶像的問題」；或「凡和我們不同的教會，都是那些不信神兒子的人」。","書信三問要走完：處境是一群剛經歷分裂、被假教師動搖確據的弟兄姊妹；原則是確據建立在神為他兒子的見證上，得勝靠所信的那一位，彼此代禱、遠避偶像；今天這原則落在每一個不確定自己是否得救、禱告等不到答案、為家人掛心的人身上，不是用來劃分教會陣營（全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉）。","檢驗標準：會眾聽完，能不能說出這一章這一週要在他的禱告、他的確據、他的偶像上改變甚麼？"]}],"txt":{"1":["論到從起初原有的生命之道，就是我們所聽見、所看見、親眼看過、親手摸過的。","（這生命已經顯現出來，我們也看見過，現在又作見證，將原與父同在、且顯現與我們那永遠的生命傳給你們。）","我們將所看見、所聽見的傳給你們，使你們與我們相交。我們乃是與父並他兒子耶穌基督相交的。","我們將這些話寫給你們，使你們的喜樂充足。","神就是光，在他毫無黑暗。這是我們從主所聽見、又報給你們的信息。","我們若說是與神相交，卻仍在黑暗裡行，就是說謊話，不行真理了。","我們若在光明中行，如同神在光明中，就彼此相交，他兒子耶穌的血也洗淨我們一切的罪。","我們若說自己無罪，便是自欺，真理不在我們心裡了。","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。","我們若說自己沒有犯過罪，便是以神為說謊的，他的道也不在我們心裡了。"],"2":["我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。","他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪。","我們若遵守他的誡命，就曉得是認識他。","人若說「我認識他」，卻不遵守他的誡命，便是說謊話的，真理也不在他心裡了。","凡遵守主道的，愛神的心在他裡面實在是完全的。從此，我們知道我們是在主裡面。","人若說他住在主裡面，就該自己照主所行的去行。","親愛的弟兄啊，我寫給你們的，不是一條新命令，乃是你們從起初所受的舊命令；這舊命令就是你們所聽見的道。","再者，我寫給你們的，是一條新命令，在主是真的，在你們也是真的；因為黑暗漸漸過去，真光已經照耀。","人若說自己在光明中，卻恨他的弟兄，他到如今還是在黑暗裡。","愛弟兄的，就是住在光明中，在他並沒有絆跌的緣由。","惟獨恨弟兄的，是在黑暗裡，且在黑暗裡行，也不知道往哪裡去，因為黑暗叫他眼睛瞎了。","小子們哪，我寫信給你們，因為你們的罪藉著主名得了赦免。","父老啊，我寫信給你們，因為你們認識那從起初原有的。少年人哪，我寫信給你們，因為你們勝了那惡者。","小子們哪，我曾寫信給你們，因為你們認識父。父老啊，我曾寫信給你們，因為你們認識那從起初原有的。少年人哪，我曾寫信給你們；因為你們剛強，神的道常存在你們心裡；你們也勝了那惡者。","不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。","因為，凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。","這世界和其上的情慾都要過去，惟獨遵行神旨意的，是永遠常存。","小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來；現在已經有好些敵基督的出來了，從此我們就知道如今是末時了。","他們從我們中間出去，卻不是屬我們的；若是屬我們的，就必仍舊與我們同在；他們出去，顯明都不是屬我們的。","你們從那聖者受了恩膏，並且知道這一切的事。","我寫信給你們，不是因你們不知道真理，正是因你們知道，並且知道沒有虛謊是從真理出來的。","誰是說謊話的呢？不是那不認耶穌為基督的嗎？不認父與子的，這就是敵基督的。","凡不認子的，就沒有父；認子的，連父也有了。","論到你們，務要將那從起初所聽見的，常存在心裡。若將從起初所聽見的存在心裡，你們就必住在子裡面，也必住在父裡面。","主所應許我們的就是永生。","我將這些話寫給你們，是指著那引誘你們的人說的。","你們從主所受的恩膏常存在你們心裡，並不用人教訓你們，自有主的恩膏在凡事上教訓你們。這恩膏是真的，不是假的；你們要按這恩膏的教訓住在主裡面。","小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。","你們若知道他是公義的，就知道凡行公義之人都是他所生的。"],"3":["你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。","親愛的弟兄啊，我們現在是神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體。","凡向他有這指望的，就潔淨自己，像他潔淨一樣。","凡犯罪的，就是違背律法；違背律法就是罪。","你們知道主曾顯現，是要除掉人的罪，在他並沒有罪。","凡住在他裡面的，就不犯罪；凡犯罪的，是未曾看見他，也未曾認識他。","小子們哪，不要被人誘惑。行義的才是義人，正如主是義的一樣。","犯罪的是屬魔鬼，因為魔鬼從起初就犯罪。神的兒子顯現出來，為要除滅魔鬼的作為。","凡從神生的，就不犯罪，因神的道存在他心裡；他也不能犯罪，因為他是由神生的。","從此就顯出誰是神的兒女，誰是魔鬼的兒女。凡不行義的就不屬神，不愛弟兄的也是如此。","我們應當彼此相愛。這就是你們從起初所聽見的命令。","不可像該隱；他是屬那惡者，殺了他的兄弟。為甚麼殺了他呢？因自己的行為是惡的，兄弟的行為是善的。","弟兄們，世人若恨你們，不要以為希奇。","我們因為愛弟兄，就曉得是已經出死入生了。沒有愛心的，仍住在死中。","凡恨他弟兄的，就是殺人的；你們曉得凡殺人的，沒有永生存在他裡面。","主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命。","凡有世上財物的，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能存在他裡面呢？","小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。","從此就知道我們是屬真理的，並且我們的心在神面前可以安穩。","我們的心若責備我們，神比我們的心大，一切事沒有不知道的。","親愛的弟兄啊，我們的心若不責備我們，就可以向神坦然無懼了。","並且我們一切所求的，就從他得著；因為我們遵守他的命令，行他所喜悅的事。","神的命令就是叫我們信他兒子耶穌基督的名，且照他所賜給我們的命令彼此相愛。","遵守神命令的，就住在神裡面，神也住在他裡面。我們所以知道神住在我們裡面是因他所賜給我們的聖靈。"],"4":["親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於神的不是，因為世上有許多假先知已經出來了。","凡靈認耶穌基督是成了肉身來的，就是出於神的；從此你們可以認出神的靈來。","凡靈不認耶穌，就不是出於神，這是那敵基督者的靈。你們從前聽見他要來，現在已經在世上了。","小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。","他們是屬世界的，所以論世界的事，世人也聽從他們。","我們是屬神的，認識神的就聽從我們；不屬神的就不聽從我們。從此我們可以認出真理的靈和謬妄的靈來。","親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的。凡有愛心的，都是由神而生，並且認識神。","沒有愛心的，就不認識神，因為神就是愛。","神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了。","不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。","親愛的弟兄啊，神既是這樣愛我們，我們也當彼此相愛。","從來沒有人見過神，我們若彼此相愛，神就住在我們裡面，愛他的心在我們裡面得以完全了。","神將他的靈賜給我們，從此就知道我們是住在他裡面，他也住在我們裡面。","父差子作世人的救主；這是我們所看見且作見證的。","凡認耶穌為神兒子的，神就住在他裡面，他也住在神裡面。","神愛我們的心，我們也知道也信。神就是愛；住在愛裡面的，就是住在神裡面，神也住在他裡面。","這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼。因為他如何，我們在這世上也如何。","愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰，懼怕的人在愛裡未得完全。","我們愛，因為神先愛我們。","人若說「我愛神」，卻恨他的弟兄，就是說謊話的；不愛他所看見的弟兄，就不能愛沒有看見的神。","愛神的，也當愛弟兄，這是我們從神所受的命令。"],"5":["凡信耶穌是基督的，都是從神而生，凡愛生他之神的，也必愛從神生的。","我們若愛神，又遵守他的誡命，從此就知道我們愛神的兒女。","我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的。","因為凡從神生的，就勝過世界；使我們勝了世界的，就是我們的信心。","勝過世界的是誰呢？不是那信耶穌是神兒子的嗎？","這藉著水和血而來的，就是耶穌基督；不是單用水，乃是用水又用血，","並且有聖靈作見證，因為聖靈就是真理。","作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一。","我們既領受人的見證，神的見證更該領受了，因神的見證是為他兒子作的。","信神兒子的，就有這見證在他心裡；不信神的，就是將神當作說謊的，因不信神為他兒子作的見證。","這見證就是神賜給我們永生；這永生也是在他兒子裡面。","人有了神的兒子就有生命，沒有神的兒子就沒有生命。","我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。","我們若照他的旨意求甚麼，他就聽我們，這是我們向他所存坦然無懼的心。","既然知道他聽我們一切所求的，就知道我們所求於他的，無不得著。","人若看見弟兄犯了不至於死的罪，就當為他祈求，神必將生命賜給他；有至於死的罪，我不說當為這罪祈求。","凡不義的事都是罪，也有不至於死的罪。","我們知道凡從神生的，必不犯罪，從神生的，必保守自己，那惡者也就無法害他。","我們知道，我們是屬神的，全世界都臥在那惡者手下。","我們也知道，神的兒子已經來到，且將智慧賜給我們，使我們認識那位真實的，我們也在那位真實的裡面，就是在他兒子耶穌基督裡面。這是真神，也是永生。","小子們哪，你們要自守，遠避偶像！"]},"blk":{"1":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—</p><p lang=\"grc\">καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—</p>","lit":"<p>那從起初就有的，那我們所聽見的，那我們用自己的眼睛所看見的，那我們所注視的、我們的手所摸過的——是關於生命的道——</p><p>（這生命被顯明了，我們看見了，並且作見證，又向你們傳揚那永遠的生命，就是那原與父同在、又向我們顯明的——）</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὃ ἦν ἀπ’ ἀρχῆς</td><td>Ho ēn ap' archēs</td><td>那從起初就有的</td><td>中性代名詞：先說「那個」，名字最後才出來</td></tr><tr><td>ἀκηκόαμεν／ἑωράκαμεν</td><td>akēkoamen / heōrakamen</td><td>我們聽見了／看見了</td><td>完成式：聽見看見的，至今還在</td></tr><tr><td>ἐθεασάμεθα</td><td>etheasametha</td><td>我們注視過</td><td>約 1:14「見過他的榮光」同一個字</td></tr><tr><td>αἱ χεῖρες ἡμῶν ἐψηλάφησαν</td><td>hai cheires hēmōn epsēlaphēsan</td><td>我們的手摸過</td><td>ψηλαφάω 摸索、驗明；復活的主說「摸我看看」</td></tr><tr><td>περὶ τοῦ λόγου τῆς ζωῆς</td><td>peri tou logou tēs zōēs</td><td>關於生命的道</td><td>道是一個人，也是傳出去的信息</td></tr><tr><td>ἐφανερώθη</td><td>ephanerōthē</td><td>被顯明了</td><td>被動語態：不是人找到的，是神顯出來的</td></tr><tr><td>μαρτυροῦμεν καὶ ἀπαγγέλλομεν</td><td>martyroumen kai apangellomen</td><td>我們作見證，並且傳揚</td><td>法庭見證人的用語</td></tr><tr><td>πρὸς τὸν πατέρα</td><td>pros ton patera</td><td>向著父、與父同在</td><td>約 1:1「道與神同在」的回聲</td></tr></table>","gram":"<p><strong>主詞最後才出來。</strong>1:1 連用四個中性關係代名詞 Ὃ（ho）「那……的」，到句末才說「關於生命的道」；主要動詞還要等到 1:3 的 ἀπαγγέλλομεν（apangellomen）「我們傳」。中間 1:2 整節是插入語，和合本用括號表示。約翰故意讓讀者先碰到「那個」，再知道他是誰。</p><p><strong>時態在說話。</strong>ἀκηκόαμεν（akēkoamen）、ἑωράκαμεν（heōrakamen）是完成式：聽見、看見的事，效果一直留到今天。ἐθεασάμεθα（etheasametha）、ἐψηλάφησαν（epsēlaphēsan）是簡單過去式，指向那些具體的時刻。ψηλαφάω（psēlaphaō）在新約只出現四次（路 24:39；徒 17:27；來 12:18；以及這裡），常帶「摸索、驗明」的意思。</p><p><strong>「起初」是哪一個起初？</strong>一說指創造以前，呼應約翰福音的「太初」；一說指福音傳開的起頭，本卷 2:7、24 的「從起初」就是這個用法。Ὃ ἦν（ho ēn）「原有的」用未完成式，指早已存在，較支持前者；但「我們所聽見」又把它拉進歷史。兩者不必二選一：那位從永遠就在的，在歷史中被聽見、被摸到。</p><p>「我們」是一群目擊者，還是作者的自稱？兩說並存，詳見 〈1:1 作者是誰？「我們」是誰？〉；本講義的全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉。</p>","exp":"<p>〔約〕約 1:1--14（約翰福音講義第 1 章）</p><p>「論到從起初原有的生命之道，就是我們所聽見、所看見、親眼看過、親手摸過的。」（1:1）這封信沒有問安，沒有署名，一開口就是見證。約翰福音的開頭是「太初有道，道與神同在，道就是神」（約 1:1），從永恆說起；這封信也從「起初」說起，卻很快落到耳朵、眼睛和手上。</p><p>為甚麼要說得這麼具體？照教會的傳統，約翰晚年住在以弗所。那時有人教導：神的兒子不可能真有血肉之軀，耶穌只是看起來像人；相傳克林妥一派更說，基督在受洗時降在耶穌身上，受難以前又離開了。分裂已經發生（2:19），留下來的人心裡發慌：我們信的那一位，到底是不是真的？</p><p>約翰不先跟他們辯論，先伸出手來。「親手摸過」，原文 ἐψηλάφησαν，是摸索、觸碰的字。復活的主也用這個字對門徒說：「摸我看看！」（路 24:39）約翰就是那個在最後晚餐「側身挨近耶穌的懷裡」（約 13:23）的門徒。他摸過的不是一個觀念，是一個人的身體。</p><p>1:2 是插進來的一段括號，像老人講到一半，忍不住再強調一次：這生命已經顯現出來，我們看見過，現在作見證。「顯現」是被動的：不是人爬上去找到神，是神自己走下來，讓人看見。</p><p>今天我們摸不到他。但我們的信，不是建立在自己的感覺上，有感動時才算數；它建立在一群人親眼看過、親手摸過的事實上。灰心的日子，感覺會退潮；那雙摸過主的手留下的見證，不會退潮。</p>"},{"a":3,"z":3,"star":2,"grk":"<p lang=\"grc\">ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·</p>","lit":"<p>那我們所看見、所聽見的，我們也傳給你們，好叫你們也與我們有相交；而我們的相交，是與父，也與他的兒子耶穌基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃ ἑωράκαμεν καὶ ἀκηκόαμεν</td><td>ho heōrakamen kai akēkoamen</td><td>我們所看見、所聽見的</td><td>1:1 的話倒過來重說，主要動詞終於出現</td></tr><tr><td>ἀπαγγέλλομεν καὶ ὑμῖν</td><td>apangellomen kai hymin</td><td>我們也傳給你們</td><td>「也」：沒有見過的人也被算進來</td></tr><tr><td>ἵνα καὶ ὑμεῖς</td><td>hina kai hymeis</td><td>好叫你們也</td><td>傳的目的不是資訊，是有分</td></tr><tr><td>κοινωνίαν ἔχητε</td><td>koinōnian echēte</td><td>你們有相交</td><td>κοινωνία：一同有分，共同擁有同一樣東西</td></tr><tr><td>μεθ’ ἡμῶν</td><td>meth' hēmōn</td><td>與我們</td><td>先與見證人的群體</td></tr><tr><td>ἡ κοινωνία δὲ ἡ ἡμετέρα</td><td>hē koinōnia de hē hēmetera</td><td>而我們的相交</td><td>δέ 帶出強調：這不是一個社團</td></tr><tr><td>μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ</td><td>meta tou patros kai meta tou huiou</td><td>與父，也與子</td><td>μετά 重複兩次：父與子各自被提名</td></tr><tr><td>Ἰησοῦ Χριστοῦ</td><td>Iēsou Christou</td><td>耶穌基督</td><td>全卷第一次出現名字：「那個」原來是他</td></tr></table>","gram":"<p><strong>主要動詞出現。</strong>1:1 開始懸著的句子，在這裡用 ἀπαγγέλλομεν（apangellomen）「我們傳」接上，並把 1:1 的兩個動詞倒過來重說。RP 少了 καὶ ὑμῖν 的 καί（kai）「也」；WH、Treg、NA28 都有。有這個「也」，語氣更清楚：沒有親眼見過的你們，「也」有分。</p><p><strong>κοινωνία 不是氣氛。</strong>κοινωνία（koinōnia）的核心是共同擁有。保羅用它說捐獻（林後 8:4），說同心興旺福音（腓 1:5）；約翰在本章用了四次（1:3 兩次、1:6、1:7），約翰福音卻一次也沒有用。它不是聚在一起的熱度，是一同有分於一個生命。</p><p><strong>哪一個先？</strong>一說，文法先說「與我們」，表示與神的相交要經過使徒的見證與群體，沒有脫離群體的獨自屬靈；一說，δέ（de）加上 ἡ ἡμετέρα（hē hēmetera）的強調，表示真正的根是「與父並子」，彼此相交是果子。μετά（meta）重複兩次，把父與子分別提名，也為後文「神的兒子」的基督論鋪路。</p><blockquote>本講義的判斷：源頭是父與子，入口是見證人的信息，形狀是彼此相交。三者是同一個相交，不是先後兩件事；詳見 〈1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？〉。</blockquote>","exp":"<p>「我們將所看見、所聽見的傳給你們，使你們與我們相交。我們乃是與父並他兒子耶穌基督相交的。」（1:3）三節長的一句話，到這裡才說出寫信的目的。不是要讀者多知道一點，是要他們進來。</p><p>「相交」原文 κοινωνία，意思是一同有分：幾個人共同擁有同一樣東西。約翰年輕時在加利利打魚，路加說他和彼得是合夥的（路 5:10），用的就是這個字根。信仰的相交，像同一條船上的人，網一起撒，魚一起分。</p><p>注意次序。約翰先說「與我們」，再說「我們乃是與父並他兒子」。分裂之後，留下的人很容易兩頭落空：有人說，有神就夠了，不需要教會；也有人把團契當成俱樂部，熱鬧，卻沒有神。約翰把兩條線綁在一起：與見證人相交，就被帶進與父和子的相交；與父和子相交的人，也不會一個人走。</p><p>這是一個邀請，不是一張會員卡。後來的人沒有摸過他，卻可以和摸過他的人坐在同一張桌子旁。</p><p>今天許多人在螢幕前聚會。隔著網路，能不能有這樣的相交（〈1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？〉）？相交的源頭不在同一個房間，在父與子；但相交也需要名字，需要知道彼此的近況，需要在難處裡伸出手。321 在末端認出，這裡是「建立屬神的體系」的起點：先與父，再彼此。這個次序不能顛倒，兩條線也不能剪斷。</p>"},{"a":4,"z":4,"star":1,"grk":"<p lang=\"grc\">καὶ ταῦτα γράφομεν ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.</p>","lit":"<p>並且這些事，是我們寫的，好叫我們的喜樂成為滿足的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ταῦτα γράφομεν</td><td>tauta graphomen</td><td>這些事我們寫</td><td>全卷第一次「寫」；2:1、2:12--14、5:13 都會回來</td></tr><tr><td>ἡμεῖς</td><td>hēmeis</td><td>我們（強調）</td><td>主詞代名詞特別寫出：見證人親自執筆</td></tr><tr><td>ἵνα ἡ χαρά</td><td>hina hē chara</td><td>好叫喜樂</td><td>寫信的第二個目的</td></tr><tr><td>ἡμῶν／ὑμῶν</td><td>hēmōn / hymōn</td><td>我們的／你們的</td><td>異文：一個字母之差</td></tr><tr><td>χαρὰ … πεπληρωμένη</td><td>chara … peplērōmenē</td><td>喜樂……被充滿</td><td>約 15:11；16:24；約貳 12 同一說法</td></tr><tr><td>ᾖ πεπληρωμένη</td><td>ē peplērōmenē</td><td>成為被充滿的</td><td>完成式被動：滿了，而且一直滿著</td></tr></table>","gram":"<p><strong>兩處異文，一個字母。</strong>SBLGNT 附錄在本節只記一處：WH、Treg、NA28 作 ἡμεῖς（hēmeis）「我們（寫）」，RP 作 ὑμῖν（hymin）「（寫）給你們」。另一處是喜樂屬於誰：各家校勘本文都作 ἡμῶν（hēmōn）「我們的」，部分抄本與公認經文（TR）作 ὑμῶν（hymōn）「你們的」，KJV 的 your joy 即依此；RP 在附錄中沒有另列，表示它也作 ἡμῶν；和合本正文作「你們」，旁註「有古卷：我們」。這一處附錄沒有列出，讀者可對照和合本的註。</p><p><strong>怎樣判斷？</strong>主張「你們的」：上下文一直說「傳給你們」，約 15:11、16:24 也都是「你們的喜樂」。主張「我們的」：抄寫的人容易把它改成順著上下文和福音書的「你們」，反過來改的動機少；較難的讀法常是原來的讀法。校勘學者多據較早的抄本採 ἡμῶν。</p><blockquote>本講義採 ἡμῶν「我們的」，但兩種讀法並不衝突：見證人的喜樂，要等收信的人進入相交才滿足。詳見 〈1:4 是「你們的」還是「我們的」喜樂充足？〉。</blockquote><p>ᾖ πεπληρωμένη（ē peplērōmenē）是完成式被動分詞的迂說，強調一種被填滿、而且持續滿著的狀態。</p>","exp":"<p>「我們將這些話寫給你們，使你們的喜樂充足。」（1:4）序言的最後一句，落在喜樂上。這封信後面有很重的話：罪、敵基督、離開的人。但約翰先說，他寫信是為了喜樂。</p><p>和合本旁邊註著「有古卷：我們」。這不只是抄本的細節，也透露一個牧者的心：見證人的喜樂，要等到你們也進來才滿。父母做好一桌菜，自己先吃不算團圓；要等孩子都回到桌前，那頓飯才叫滿足。約翰在另一封短信裡說：「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。」（約參 1:4）</p><p>這也是耶穌的心願。他在最後一晚對門徒說，要「叫你們的喜樂可以滿足」（約 15:11）。約翰把主的話接過來，寫成了信。原文是完成式被動：喜樂「被充滿了」，而且一直滿著。喜樂不是自己擠出來的，是被一個生命填滿的。</p><p>許多基督徒很認真，卻不太喜樂；守規矩、盡本分，心裡卻乾。約翰沒有叫人更努力地快樂，他叫人回到相交裡：與父，與子，也與一起被愛的人。如果你的信仰只剩下責任，可以從這一節重新開始。神要的不只是你的順服，也是你的喜樂。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ἐν αὐτῷ οὐκ ἔστιν οὐδεμία.</p>","lit":"<p>而這就是我們從他所聽見、又向你們傳報的信息：神是光，在他裡面，黑暗一點也沒有。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ ἀγγελία</td><td>hē angelia</td><td>信息</td><td>新約只見於本書（1:5；3:11）</td></tr><tr><td>ἀκηκόαμεν ἀπ’ αὐτοῦ</td><td>akēkoamen ap' autou</td><td>我們從他聽見</td><td>不是我們的神學結論，是聽來的</td></tr><tr><td>ἀναγγέλλομεν ὑμῖν</td><td>anangellomen hymin</td><td>我們向你們傳報</td><td>把聽到的原樣交出去</td></tr><tr><td>ὁ θεὸς φῶς ἐστιν</td><td>ho theos phōs estin</td><td>神是光</td><td>φῶς 無冠詞：說神的本性</td></tr><tr><td>φῶς／σκοτία</td><td>phōs / skotia</td><td>光／黑暗</td><td>約翰福音的一對字（約 1:5）</td></tr><tr><td>ἐν αὐτῷ</td><td>en autō</td><td>在他裡面</td><td>字序異文：WH、Treg 放在句末</td></tr><tr><td>οὐκ ἔστιν οὐδεμία</td><td>ouk estin oudemia</td><td>沒有，一點也沒有</td><td>雙重否定加強：絕對沒有</td></tr></table>","gram":"<p><strong>φῶς 沒有冠詞。</strong>ὁ θεὸς φῶς ἐστιν（ho theos phōs estin）的 φῶς（phōs）沒有冠詞，是在說神的本性，和約 4:24 說神是靈、本卷 4:8「神就是愛」同一個句型。這不是說神等於某一道光，也不是說光就是神。</p><p><strong>光指甚麼？</strong>一說指聖潔：神在道德上完全純淨，所以 1:6 立刻談「在黑暗裡行」；一說指啟示：光使人看見，神主動顯明自己（參 1:2 的「顯現」）；一說指生命：「生命就是人的光」（約 1:4）。本段上下文以「行」來說光，聖潔與真實是主調；但三者在約翰筆下本來連在一起，不必切開。</p><p><strong>光與愛。</strong>本卷說神是光，也說神就是愛。不是兩位神，也不是兩種輪流出現的性情：神的愛是聖潔的愛，神的光是為了救人而照。詳見 〈1:5「神就是光」與 4:8「神就是愛」怎樣合看？〉。</p><p><strong>「從主」。</strong>原文只說 ἀπ’ αὐτοῦ（ap' autou）「從他」，指 1:3 剛提到的耶穌基督；和合本譯作「從主」，是正確的解釋。WH、Treg 把 ἐν αὐτῷ（en autō）放在 οὐκ ἔστιν 之後，字序不同，意思一樣。</p>","exp":"<p>〔舊約〕創 1:3（創世記講義第 1 章）</p><p>「神就是光，在他毫無黑暗。這是我們從主所聽見、又報給你們的信息。」（1:5）序言講完相交，第一個信息就是光。聖經裡記下神說的第一句話，也是要有光（創 1:3）。</p><p>約翰說「毫無黑暗」，原文是雙重否定，直譯是「黑暗在他裡面沒有，一點也沒有」。我們認識的人，再好也有陰影；我們自己更是。神不是這樣。他不是大部分是光、偶爾有暗的時候；他沒有陰晴不定的情緒，沒有藏起來的算計。這句話先是對神的認識，然後才是對我們的要求。</p><p>這信息是「從主所聽見」的。耶穌說過：「我是世界的光。跟從我的，就不在黑暗裡走」（約 8:12）。約翰沒有發明新的神學，他只是把聽見的交出來。</p><p>光會帶來兩種反應。有人怕光：「凡作惡的便恨光，並不來就光，恐怕他的行為受責備。」（約 3:20）也有人被光吸引，像寒夜裡看見一扇亮著燈的窗。光照出灰塵，也照出回家的路。神是光，不是要叫人躲起來，是要叫人走出來。</p><p>如果你一聽到「神是光」就緊張，好像要被抓包，請看約翰接下去怎麼說：光裡有彼此相交，光裡有血的洗淨（1:7）。光照到你，是因為他要醫治你，不是要羞辱你。今天有甚麼事，一直放在燈照不到的角落？可以把它帶到這光裡來。</p>"},{"a":6,"z":6,"star":1,"grk":"<p lang=\"grc\">ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·</p>","lit":"<p>我們若說我們與他有相交，卻在黑暗中行，我們就是在說謊，也沒有在行真理；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐὰν εἴπωμεν</td><td>ean eipōmen</td><td>我們若說</td><td>三次「若說」的第一次；主詞是「我們」</td></tr><tr><td>κοινωνίαν ἔχομεν μετ’ αὐτοῦ</td><td>koinōnian echomen met' autou</td><td>我們與他有相交</td><td>口號正確，生活不對</td></tr><tr><td>ἐν τῷ σκότει</td><td>en tō skotei</td><td>在黑暗中</td><td>σκότος：與 σκοτία 同字根</td></tr><tr><td>περιπατῶμεν</td><td>peripatōmen</td><td>我們行走</td><td>走路＝生活方式；現在式：持續的方向</td></tr><tr><td>ψευδόμεθα</td><td>pseudometha</td><td>我們說謊</td><td>不是搞錯，是話與生活分家</td></tr><tr><td>οὐ ποιοῦμεν τὴν ἀλήθειαν</td><td>ou poioumen tēn alētheian</td><td>不行真理</td><td>真理是要「行」的（約 3:21）</td></tr></table>","gram":"<p><strong>三對條件句。</strong>1:6--10 有五個 ἐάν（ean）「若」，排成對照：1:6「若說」對 1:7「若行」；1:8「若說」對 1:9「若認」；1:10 再一次「若說」。三次 ἐὰν εἴπωμεν（ean eipōmen）都是嘴上的宣稱，兩次正面的條件都是生活與回應。約翰用結構就把重點講了：問題不在說了甚麼，在走了甚麼路。</p><p><strong>是誰在說？</strong>一說，三句「若說」引用的是分離者的口號（參 2:19），他們自稱與神相交、自稱無罪；一說，這是約翰對整個群體的普遍提醒，每個信徒都可能這樣自欺。前者有本卷處境的支持，後者有主詞「我們」的支持。</p><blockquote>本講義的判斷：口號可能出自離開的人，但約翰刻意用「我們」，把自己和留下的人一起放在鏡子前。這些經文是用來省察自己的，不是用來審查別人的。</blockquote><p>ψευδόμεθα（pseudometha）「我們說謊」與 οὐ ποιοῦμεν τὴν ἀλήθειαν（ou poioumen tēn alētheian）「不行真理」並列：一個在嘴上，一個在生活裡，說的是同一件事的兩面。</p>","exp":"<p>「我們若說是與神相交，卻仍在黑暗裡行，就是說謊話，不行真理了。」（1:6）這是三次「若說」的第一次。注意主詞：不是「他們若說」，是「我們若說」。約翰先把自己放進去。</p><p>分裂的教會裡，很可能有人掛著漂亮的口號：我們與神有特別的相交，我們已經超越了。可是生活卻在黑暗裡：不愛弟兄（2:9），說一套、做一套。約翰說，這叫說謊。不是神學上搞錯一點，是嘴巴和腳走在兩條路上。</p><p>「行」原文 περιπατέω，是走路。希伯來人用走路說生活：你往哪裡走，你就是怎樣的人。現在式說的是持續的方向，不是某一天絆了一跤。一個人可能在光的路上跌倒；另一個人卻舒舒服服地住在黑暗裡，還說自己天天與神同行。約翰揭露的是後者。</p><p>「不行真理」，真理在約翰筆下是要行出來的。耶穌說：「但行真理的必來就光」（約 3:21）。真理不只放在頭腦裡同意，也要走在腳下。</p><p>這一節不是拿去審查別人的放大鏡，是一面鏡子。我嘴上說的，和我週一到週六走的路，是同一條嗎？如果答案讓你心裡一沉，不要急著定自己的罪，也不要急著辯解；下一節，約翰立刻把路打開了。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.</p>","lit":"<p>但我們若在光中行，如同他在光中，我們就彼此有相交，並且他兒子耶穌的血，潔淨我們脫離一切的罪。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τῷ φωτὶ περιπατῶμεν</td><td>en tō phōti peripatōmen</td><td>我們在光中行</td><td>不是「無罪地行」，是「在被照見的地方行」</td></tr><tr><td>ὡς αὐτός ἐστιν ἐν τῷ φωτί</td><td>hōs autos estin en tō phōti</td><td>如同他在光中</td><td>神是光，也在光中；人只能行在光中</td></tr><tr><td>κοινωνίαν ἔχομεν μετ’ ἀλλήλων</td><td>koinōnian echomen met' allēlōn</td><td>我們彼此有相交</td><td>預期「與他」，約翰卻說「彼此」</td></tr><tr><td>τὸ αἷμα Ἰησοῦ</td><td>to haima Iēsou</td><td>耶穌的血</td><td>真實流過血的身體，回到 1:1 的手</td></tr><tr><td>καθαρίζει</td><td>katharizei</td><td>正在潔淨</td><td>καθαρίζω 現在式：持續的潔淨</td></tr><tr><td>ἀπὸ πάσης ἁμαρτίας</td><td>apo pasēs hamartias</td><td>脫離一切罪</td><td>單數 ἁμαρτία：罪的全部</td></tr></table>","gram":"<p><strong>「在光明中行」是甚麼意思？</strong>歷來有三種讀法。①無罪完全：在光中行就是不再犯罪。難處是下一節緊接著說「若說自己無罪，便是自欺」（1:8），而且本節自己說血仍在潔淨。②誠實透明：不躲藏，讓神的光照到生命的每個角落；這與 1:9 的「認」最接近。③順從啟示：照著神所顯明的真理與誡命生活，2:9--11 把它具體化為愛弟兄。</p><blockquote>本講義的判斷：②與③合讀。在光中行不是沒有罪，是不再躲；不躲的人會面對自己的罪，也會走向弟兄。證據就在本節：在光中行的人，仍然需要血正在潔淨。詳見 〈1:7「在光明中行」——是無罪完全，還是誠實透明？〉。</blockquote><p><strong>神「是」光，也「在」光中。</strong>1:5 說神是光，這裡說 αὐτός ἐστιν ἐν τῷ φωτί（autos estin en tō phōti）「他在光中」；人不是光，只能 περιπατῶμεν（peripatōmen）「行」在光中。καθαρίζει（katharizei）是現在式，指持續的潔淨；ἀπὸ πάσης ἁμαρτίας（apo pasēs hamartias）用單數，指罪的全部。</p><p><strong>異文。</strong>RP 在「耶穌」後加「基督」；NA28 省去開頭的 δέ（de）「但」，WH、Treg、NA27、RP 都有。兩處都不影響意思。</p>","exp":"<p>「我們若在光明中行，如同神在光明中，就彼此相交，他兒子耶穌的血也洗淨我們一切的罪。」（1:7）這一節有一個意外。我們以為約翰會說：在光明中行，就與神相交。他卻說：「就彼此相交」（1:7）。</p><p>光裡最先發生的事，是人與人之間的牆倒下來。在黑暗裡，每個人都在演；在光裡，大家都被看見了，也就不必再假裝。小組裡第一個說「我也是這樣」的人，往往讓整個房間鬆一口氣。誠實是會傳染的。</p><p>然後是血。在光明中行的人，仍然需要耶穌的血來洗淨。這句話很重要：在光中行不等於沒有罪，否則就不需要血了。動詞是現在式，正在洗淨，像流動的泉水，不是一次用完的肥皂。被光照出來的污點，立刻被血洗淨；光不是為了展示我們的骯髒，是為了讓洗淨可以發生。</p><p>「耶穌的血」也回到 1:1。一個只是看起來像人的耶穌，不會流血。約翰堅持主有血肉之軀，不是在爭學術，是因為我們的洗淨就繫在那真實流出來的血上。</p><p>在光中行，不是等自己乾淨了才敢走進光，是帶著還沒洗淨的部分走進來。可以從一個安全的人開始：一位可信的屬靈同伴，或小組裡一個能保守秘密的人。在那裡說真話，你會發現，光裡不只有被看見，還有被接納。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν.</p>","lit":"<p>我們若說我們沒有罪，我們就是在使自己走迷，真理也不在我們裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐὰν εἴπωμεν</td><td>ean eipōmen</td><td>我們若說</td><td>第二次「若說」</td></tr><tr><td>ἁμαρτίαν οὐκ ἔχομεν</td><td>hamartian ouk echomen</td><td>我們沒有罪</td><td>「有罪」：罪是仍在身上的事實與罪責</td></tr><tr><td>ἑαυτοὺς πλανῶμεν</td><td>heautous planōmen</td><td>我們使自己走迷</td><td>πλανάω 領人走錯路；騙得最成功的是自己</td></tr><tr><td>ἡ ἀλήθεια</td><td>hē alētheia</td><td>真理</td><td>與 1:6「行真理」是同一個真實</td></tr><tr><td>οὐκ ἔστιν ἐν ἡμῖν</td><td>ouk estin en hēmin</td><td>不在我們裡面</td><td>Treg 字序作 ἐν ἡμῖν οὐκ ἔστιν，意思一樣</td></tr></table>","gram":"<p><strong>「有罪」與「不犯罪」。</strong>ἁμαρτίαν οὐκ ἔχομεν（hamartian ouk echomen）「我們沒有罪」；「有罪」在約翰筆下指罪仍是一個在身上的事實與罪責（參約 9:41；15:22）。可是本卷又說「凡從神生的，就不犯罪」（3:9）。同一封信，怎樣同時成立？歷來有四種讀法：</p><p>①<strong>現在式持續說</strong>：3:6、9 的現在式指習慣性、持續地犯罪，1:8--10 說的是個別的罪。難處：現在式不一定帶持續的意思，1:8 的「有罪」本身也是現在式。②<strong>兩種罪說</strong>：3:9 說的是某一種罪（例如 5:16 那種，或故意背道），1:8 說的是一般的過犯。難處：3:9 的上下文沒有這樣限定。③<strong>身分與方向說</strong>：從神生的人，生命的方向已經改變，罪不再是他的歸屬；1:8 防的是驕傲，3:9 防的是放縱。難處：仍要解釋「不能犯罪」這樣強的說法。④<strong>針對假教師說</strong>：1:8 對付自稱已經無罪的人，3:6--9 對付說行為無關緊要的人，兩處對準不同的錯誤。難處：對手的面貌只能從信中推想。</p><blockquote>本講義的判斷：以③為主，①④可以補充。落點在 2:1：「我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保」（2:1）。方向是不犯罪，跌倒時有中保；兩句都要講，少一句都會傷人。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉；本章議題見〈1:8--10 與 3:6--9——基督徒還會犯罪嗎？〉。</blockquote>","exp":"<p>「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（1:8）這是全章最低的地方。不是因為有人犯了大罪，是因為有人覺得自己不需要被赦免。</p><p>「自欺」原文是「使自己走迷」。騙別人難，騙自己最容易。我們會把罪換個名字：那是個性，那是壓力太大，那是他先對不起我。我們也會拿別人來比：比起某某，我算不錯了。慢慢地，連自己都信了。約翰說，到了這一步，真理就不在我們裡面了；不是真理消失了，是我們把它關在門外。</p><p>這一節常被兩種人誤用。一種人拿它當藉口：反正人人都有罪，我也沒辦法。但約翰寫這句話，是要人來認罪（1:9），不是要人安心留在罪裡；下一章他就說，寫這些話「是要叫你們不犯罪」（2:1）。刻意、持續地不肯悔改，在這一節找不到掩護。</p><p>另一種人剛好相反：每次看見自己的罪，就懷疑自己到底是不是神的孩子。對這樣的人，1:8 其實是好消息。你看得見自己的罪，為它難過，正說明真理在你裡面作工；真正自欺的人，是看不見的。</p><p>321 在末端認出這裡的「有己與驕傲」：最深的驕傲不是自誇能幹，是覺得自己不需要恩典。落地的一步很簡單：今天，把一件你一直替它找理由的事，停止辯護，用它本來的名字叫它。</p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.</p>","lit":"<p>我們若承認我們的罪，他是信實的、公
