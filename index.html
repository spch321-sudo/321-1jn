義的，以致赦免我們的罪，並潔淨我們脫離一切的不義。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁμολογῶμεν</td><td>homologōmen</td><td>我們承認</td><td>ὁμολογέω：ὁμο-「相同」＋λέγω「說」——說一樣的話</td></tr><tr><td>τὰς ἁμαρτίας ἡμῶν</td><td>tas hamartias hēmōn</td><td>我們的罪（複數）</td><td>1:8 是單數的罪，這裡是一件一件的罪</td></tr><tr><td>πιστός ἐστιν</td><td>pistos estin</td><td>他是信實的</td><td>守住自己的應許，不看我們的表現</td></tr><tr><td>καὶ δίκαιος</td><td>kai dikaios</td><td>也是公義的</td><td>赦免不是放水：血已經付上（1:7；2:2）</td></tr><tr><td>ἵνα ἀφῇ ἡμῖν</td><td>hina aphē hēmin</td><td>以致赦免我們</td><td>ἀφίημι：放開、免去債務</td></tr><tr><td>καθαρίσῃ ἡμᾶς</td><td>katharisē hēmas</td><td>潔淨我們</td><td>接續 1:7 的 καθαρίζω</td></tr><tr><td>ἀπὸ πάσης ἀδικίας</td><td>apo pasēs adikias</td><td>脫離一切不義</td><td>「一切」：沒有一件留在外面</td></tr></table>","gram":"<p><strong>ὁμολογέω：說一樣的話。</strong>ὁμολογῶμεν（homologōmen）由 ὁμο-（homo-）「相同」與 λέγω（legō）「說」組成；本卷也用這個字說「認」耶穌：認他是成了肉身來的（4:2），認他為神的兒子（4:15）。認罪與認主用同一個字：都是讓自己的話與神的話一致。現在式假設語氣，表示這是一再發生的生活，不是一生只做一次的動作。</p><p><strong>向誰認？</strong>一說，向神認，因為赦罪的是神（詩 32:5）；一說，也要在群體中彼此承認（雅 5:16），後來有的傳統更發展成向神職人員告解；一說，得罪了人，就要向那個人承認。</p><blockquote>本講義的判斷：1:9 的對象是神，因為「他是信實的」。向人承認，是在得罪了人、或需要代禱與扶持時的智慧，不是赦免的條件；也不可要求人在不安全的場合公開隱私。詳見 〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉。</blockquote><p><strong>ἵνα 的用法。</strong>πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ（pistos estin kai dikaios hina aphē）的 ἵνα（hina）不是一般的「為了」，是說明神的信實與公義會帶出甚麼結果：他信實、公義，以致赦免。ἀφίημι（aphiēmi）是放開、免去債務；καθαρίσῃ（katharisē）回到 1:7 的 καθαρίζω（katharizō）。赦免處理的是關係，潔淨處理的是生命，兩樣他都給。</p>","exp":"<p>「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」（1:9）三次「若說」之間，只有這一次「若認」。全章從最低處，升到最高處。</p><p>「認」原文 ὁμολογέω，由「相同」和「說」組成，意思是說一樣的話。認罪不是把自己罵到一文不值，也不是寫一份長長的悔過書，是對神說：你說這是罪，我也說這是罪。不再換名字，不再找理由。讓神作神，他是光；讓人作人，我們有罪。</p><p>然後看神。約翰沒有說神是慈悲的所以會赦免，他說神「是信實的，是公義的」（1:9）。信實，是神守住他自己的應許，不看我們今天表現如何，也不看他今天心情如何。公義，好像反而叫人害怕；可是赦免正是公義的，因為代價已經付了：耶穌的血（1:7），他為我們的罪作了挽回祭（2:2）。神赦免你，不是放水，是算清楚了。</p><p>赦免是完整的：「洗淨我們一切的不義」（1:9），沒有一件留在外面。這不表示罪的後果一定消失。大衛認罪時，拿單說「耶和華已經除掉你的罪」（撒下 12:13），後果卻仍然臨到他的家；撒該蒙恩以後，自己提出要還人四倍（路 19:8）。赦免恢復的是與神的關係；與人之間的信任，需要時間和行動慢慢重建（〈1:9 認罪得赦免之後，後果與信任怎麼辦？〉）。</p><p>已經信主的人，還需要認罪嗎？需要。不是為了重新得救，是為了回到相交裡，像孩子做錯了事，回家跟父親說清楚（〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉）。今晚就可以做：一件事，一句話，「主啊，你說得對，這是罪。」然後相信他的信實比你的感覺更可靠。321 在末端認出這裡有「謙卑、回到本位」的樣子。</p>"},{"a":10,"z":10,"star":1,"grk":"<p lang=\"grc\">ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.</p>","lit":"<p>我們若說我們沒有犯過罪，我們就是使他成為說謊者，他的道也不在我們裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐὰν εἴπωμεν</td><td>ean eipōmen</td><td>我們若說</td><td>第三次「若說」，最重的一次</td></tr><tr><td>οὐχ ἡμαρτήκαμεν</td><td>ouch hēmartēkamen</td><td>我們沒有犯過罪</td><td>完成式：否認從過去到現在的整段紀錄</td></tr><tr><td>ψεύστην ποιοῦμεν αὐτόν</td><td>pseustēn poioumen auton</td><td>我們使他成為說謊者</td><td>從自欺（1:8）升到以神為說謊的</td></tr><tr><td>ὁ λόγος αὐτοῦ</td><td>ho logos autou</td><td>他的道</td><td>回到 1:1「生命之道」：開頭與結尾同一個字</td></tr><tr><td>οὐκ ἔστιν ἐν ἡμῖν</td><td>ouk estin en hēmin</td><td>不在我們裡面</td><td>與 1:8「真理不在」平行</td></tr></table>","gram":"<p><strong>三次「若說」的遞進。</strong>1:6 ψευδόμεθα（pseudometha）「我們說謊」，1:8 ἑαυτοὺς πλανῶμεν（heautous planōmen）「我們使自己走迷」，1:10 ψεύστην ποιοῦμεν αὐτόν（pseustēn poioumen auton）「我們使他成為說謊者」。從說謊、到騙自己、到把神當成說謊的，一層比一層深。</p><p><strong>1:8 與 1:10 有甚麼不同？</strong>1:8 用現在式「沒有罪」，1:10 用完成式 οὐχ ἡμαρτήκαμεν（ouch hēmartēkamen）「沒有犯過罪」。一說，1:8 否認的是罪性（裡面仍有犯罪的傾向），1:10 否認的是罪行（過去到現在的紀錄）；一說，兩句是同一件事的重說，是約翰慣用的平行句。前者把時態的差別看得較重，後者提醒我們約翰的文體本來喜歡重複。不論哪一種，兩句都在堵住同一條退路：人不能站在恩典外面，說自己不需要恩典。</p><p><strong>首尾呼應。</strong>ὁ λόγος αὐτοῦ（ho logos autou）「他的道」回到 1:1 τοῦ λόγου τῆς ζωῆς（tou logou tēs zōēs）「生命之道」。全章被同一個字包起來：生命之道從起初就在，人卻可能讓它不在自己裡面。</p>","exp":"<p>「我們若說自己沒有犯過罪，便是以神為說謊的，他的道也不在我們心裡了。」（1:10）第三次「若說」，也是最重的一次。1:6 是說謊，1:8 是自欺，到這裡，竟然是把神當成說謊的。</p><p>為甚麼這麼嚴重？因為神已經說了話。他說世人都犯了罪，他為了這罪差他的兒子來，流血、作挽回祭。一個人若說自己沒有犯過罪，等於說：神白白差了他的兒子，十字架是多餘的。本卷後面也用同樣的話說不信的人：「就是將神當作說謊的」（5:10）。</p><p>這一章從「生命之道」開始（1:1），在「他的道也不在我們心裡」（1:10）結束。人若拒絕承認自己需要那道，那摸得到、看得見的生命，就與他擦肩而過。</p><p>可是約翰沒有停在這裡。翻過去，下一句是：「我小子們哪」（2:1）。剛說完最嚴厲的話，馬上是最溫柔的稱呼。他寫這些，不是要把人推出門外，是要把人叫回家。</p><p>整章走完，我們手上有兩條路。一條是三次「若說」：替自己辯護，保住面子，卻把真理、把道關在外面。一條是一次「若認」：放下辯護，回到本位，遇見信實公義的神。不需要等到你更好一點，才走第二條路。今天就可以。</p>"}],"2":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,</p><p lang=\"grc\">καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.</p>","lit":"<p>我的小孩子們，這些事我寫給你們，為要叫你們不犯罪。若有人犯了罪，我們在父面前有一位辯護者，就是義的耶穌基督；</p><p>他自己就是為我們的罪的挽回祭；不但為我們的，也為全世界的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τεκνία μου</td><td>Teknia mou</td><td>我的小孩子們</td><td>指小詞；老牧人的口吻</td></tr><tr><td>ἵνα μὴ ἁμάρτητε</td><td>hina mē hamartēte</td><td>為要你們不犯罪</td><td>方向沒有打折</td></tr><tr><td>ἐάν τις ἁμάρτῃ</td><td>ean tis hamartē</td><td>若有人犯了罪</td><td>同一個時態：真的跌倒了</td></tr><tr><td>παράκλητον</td><td>paraklēton</td><td>被叫到身旁的那一位</td><td>與約 14:16「保惠師」同字；這裡是辯護者</td></tr><tr><td>πρὸς τὸν πατέρα</td><td>pros ton patera</td><td>面向父</td><td>與約 1:1「道與神同在」同一介系詞</td></tr><tr><td>Ἰησοῦν Χριστὸν δίκαιον</td><td>Iēsoun Christon dikaion</td><td>義的耶穌基督</td><td>替我們說話的，自己是義的</td></tr><tr><td>ἱλασμός</td><td>hilasmos</td><td>挽回祭</td><td>新約只在 2:2、4:10；現在式「他就是」</td></tr><tr><td>περὶ ὅλου τοῦ κόσμου</td><td>peri holou tou kosmou</td><td>為全世界</td><td>和合本「普天下人」</td></tr></table>","gram":"<p><strong>παράκλητος（paraklētos） 在新約只有約翰用。</strong>約翰福音四次指聖靈（約 14:16、26；15:26；16:7），和合本譯「保惠師」；這裡是唯一一次指耶穌，和合本譯「中保」。字面是「被叫到身旁的人」，在法庭上就是替人說話的辯護者。主在約 14:16 說「另外」一位保惠師，表示他自己是第一位：子在父那裡為我們辯護，靈在我們裡面陪伴我們。</p><p><strong>ἱλασμός（hilasmos）：propitiation 還是 expiation？</strong>一說譯為「平息」（propitiation），強調罪惹動神的忿怒，基督的祭使忿怒得以平息；一說譯為「除罪、潔淨」（expiation），強調罪被遮蓋、被除去，七十士譯本常用同字根講贖罪日（這使我們想起利 16:30）。兩說各有根據。決定性的是 4:10：差子作挽回祭的是神自己。不論取哪一個譯法，都不是人去平息一位生氣的神，是神親自預備了祭。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。</p><p><strong>「普天下人」（2:2）。</strong>普救論認為人人終必得救，本講義不採，因為「凡不認子的，就沒有父」（2:23）；有限救贖認為「全世界」指各族各方的選民；無限救贖認為基督的祭足夠全人類，卻要藉著信才得著。後兩者之爭，本卷不作裁判。</p><blockquote>約翰要小子們知道：這祭不是只夠我們這一小群人用的。</blockquote>","exp":"<p>〔約〕約 14:16（約翰福音講義第 14 章）</p><p>〔舊約〕利 16:30（利未記講義第 16 章）</p><p>「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。」（2:1）第一章剛說完「我們若說自己無罪，便是自欺」（1:8），有人可能會想：既然人人都有罪，那就算了吧。約翰立刻把方向轉回來：我寫信，是要你們不犯罪。方向沒有打折。</p><p>可是他馬上接著說：「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）注意那個「我們」。使徒沒有說「你們若犯罪」，他把自己也放進去。跌倒的時候，我們在父那裡不是沒有人說話。替我們說話的那一位，自己是義的；他不是替我們找藉口，是用自己的祭替我們說話。</p><p>這祭是誰預備的？約翰到第四章才講完：是神「差他的兒子為我們的罪作了挽回祭」（4:10）。贖罪日的大祭司一年一次進到至聖所，為百姓贖罪，「使你們潔淨」（利 16:30）；現在不必等一年一次，中保一直在父那裡。而且這祭夠大，「不是單為我們的罪，也是為普天下人的罪」（2:2）。</p><p>這兩節是給兩種人的。給想隨便的人：方向是不犯罪。給已經跌倒、不敢回頭的人：你有一位中保。很多弟兄姊妹跌倒以後第一個反應是躲起來，覺得等自己好一點再來見神。約翰說，正是跌倒的時候，才需要中保。不是等你乾淨了才回家，是回家才會乾淨。</p>"},{"a":3,"z":6,"star":2,"grk":"<p lang=\"grc\">Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.</p><p lang=\"grc\">ὁ λέγων ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·</p><p lang=\"grc\">ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·</p><p lang=\"grc\">ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ αὐτὸς περιπατεῖν.</p>","lit":"<p>在這事上我們知道我們已經認識了他，就是我們若持守他的命令。</p><p>那說「我已經認識他」卻不持守他命令的，是說謊的人，真理也不在這人裡面；</p><p>但凡持守他話語的，神的愛在這人裡面真實地已經被完全了。在這事上我們知道我們是在他裡面：</p><p>那說自己住在他裡面的，就應當照著那一位怎樣行，自己也怎樣行。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τούτῳ γινώσκομεν</td><td>en toutō ginōskomen</td><td>在這事上我們知道</td><td>全卷常用的確據句式</td></tr><tr><td>ἐγνώκαμεν αὐτόν</td><td>egnōkamen auton</td><td>我們已經認識了他</td><td>完成式：認識已經發生、持續到今天</td></tr><tr><td>τὰς ἐντολὰς αὐτοῦ τηρῶμεν</td><td>tas entolas autou tērōmen</td><td>我們持守他的命令</td><td>τηρέω：看守、珍惜，不只是照做</td></tr><tr><td>ὁ λέγων</td><td>ho legōn</td><td>那說……的</td><td>2:4、6、9 三次；接 1:6、8、10「人若說」</td></tr><tr><td>ψεύστης</td><td>pseustēs</td><td>說謊的人</td><td>話和生命分了家</td></tr><tr><td>ἡ ἀγάπη τοῦ θεοῦ τετελείωται</td><td>hē agapē tou theou teteleiōtai</td><td>神的愛已經被完全了</td><td>完成式被動；主詞是神的愛</td></tr><tr><td>μένειν</td><td>menein</td><td>住、留下</td><td>本章第一次出現 μένω</td></tr><tr><td>καθὼς ἐκεῖνος περιεπάτησεν</td><td>kathōs ekeinos periepatēsen</td><td>照著那一位所行的</td><td>ἐκεῖνος：約翰書信對耶穌的特稱</td></tr></table>","gram":"<p><strong>2:5「愛神的心」是誰的愛？</strong>ἡ ἀγάπη τοῦ θεοῦ（hē agapē tou theou） 的屬格有三種讀法：①受詞屬格，人對神的愛，和合本「愛神的心」取此；②主詞屬格，神對人的愛在這人身上達到了目的；③性質屬格，神那一種的愛。4:12 說「愛他的心在我們裡面得以完全了」（4:12），上下文又是「乃是神愛我們」（4:10），所以第二種讀法很有分量：神的愛在遵守他道的人身上走完了全程。三種讀法可以並存，但起點是神的愛。</p><p><strong>遵守與確據。</strong>γινώσκομεν（ginōskomen） 是現在式「我們知道」，ἐγνώκαμεν（egnōkamen） 是完成式「我們已經認識」。遵守命令不是認識他的條件，是認識他的記號：像樹上的果子證明樹是活的，卻不是叫樹活的原因（這使我們想起弗 2:8--10）。τηρέω（tēreō） 是看守、珍惜，帶著愛。</p><p><strong>異文。</strong>2:6 句末 NA28、RP 多一個 οὕτως（houtōs）「也這樣」，意思不變；2:4 RP 缺 ὅτι（hoti），只是引語標記的差別。</p>","exp":"<p>「我們若遵守他的誡命，就曉得是認識他。」（2:3）約翰的讀者剛經歷過一場分裂。有一群人離開了（2:19），他們很可能自稱有更高的「認識」，卻不在乎怎麼活。約翰回答：認識神不是腦子裡多一套知識，是生命裡多了一位主。</p><p>所以他寫「人若說」：「人若說『我認識他』，卻不遵守他的誡命，便是說謊話的」（2:4）。這句話不是拿來量別人的尺。約翰在第一章先把「我們」放進去，這裡也一樣：每個人都要先問自己，我的話和我的生命有沒有分家。</p><p>這段很容易被讀成考卷：遵守得夠多才算得救。可是 2:5 的主詞是「愛神的心」——更深一層，是神的愛在人身上走完了全程。像一封寄出去的信送到了收件人手上：遵守主道，是神的愛送到了。遵守不是我們換得認識的代價，是被愛的人自然長出來的樣子。</p><p>然後是本章第一個「住」：「人若說他住在主裡面，就該自己照主所行的去行。」（2:6）照主所行的，就是看著他怎麼走，我也怎麼走：他怎麼對待井旁的撒瑪利亞婦人，怎麼為門徒洗腳，怎麼在十字架上為釘他的人禱告。這不是一次考過的考試，是一條一輩子走的路。</p><p>如果你讀到這裡心裡發緊，覺得自己差得太遠，請記得上一段：若有人犯罪，我們有一位中保。方向是照主所行的去行；跌倒時，中保在父那裡。321 在這裡認出「耶穌是我的榜樣」：榜樣不是用來壓垮人的，是給一個走得慢的人一個看得見的背影。</p>"},{"a":7,"z":8,"star":1,"grk":"<p lang=\"grc\">Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ἠκούσατε.</p><p lang=\"grc\">πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.</p>","lit":"<p>蒙愛的人哪，我寫給你們的不是新命令，乃是你們從起初就有的舊命令；這舊命令就是你們所聽見的話語。</p><p>再者，我寫給你們的是新命令，這在他裡面是真的，在你們裡面也是真的，因為黑暗正在過去，那真光已經在照耀。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>蒙愛的人</td><td>RP 作「弟兄們」</td></tr><tr><td>ἐντολὴν καινὴν</td><td>entolēn kainēn</td><td>新的命令</td><td>καινός：品質上新，不是剛發明</td></tr><tr><td>ἐντολὴν παλαιὰν</td><td>entolēn palaian</td><td>舊的命令</td><td>利 19:18 早就說了</td></tr><tr><td>ἀπ’ ἀρχῆς</td><td>ap' archēs</td><td>從起初</td><td>他們初聽福音的時候</td></tr><tr><td>ἐν αὐτῷ καὶ ἐν ὑμῖν</td><td>en autō kai en hymin</td><td>在他裡面也在你們裡面</td><td>先在主身上成真，再在我們身上</td></tr><tr><td>ἡ σκοτία παράγεται</td><td>hē skotia paragetai</td><td>黑暗正在過去</td><td>現在式；2:17 世界也「過去」，同字</td></tr><tr><td>τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει</td><td>to phōs to alēthinon ēdē phainei</td><td>真光已經在照</td><td>與約 1:9「真光」同字</td></tr></table>","gram":"<p><strong>為甚麼既舊又新？</strong>解經家大致有三種說法：①舊，是讀者從信主的起初就聽見的；新，是主耶穌在約 13:34 賜下的「新命令」。②舊，是利 19:18 的愛人如己；新，是主加上「我怎樣愛你們」（約 13:34）這個尺度。③新，是時代的新：黑暗正在過去，真光已經照耀，這命令屬於已經開始的新世界。三說不互斥。καινός（kainos） 指品質上的新，不是剛發明出來；所以同一條命令可以既古老又常新。</p><p><strong>ὅ ἐστιν ἀληθὲς（ho estin alēthes）。</strong>ὅ 是中性關係代名詞，不直接接陰性的「命令」，而是指「這件事」：這條命令的新，先在主身上成了真，現在也在你們身上成真。παράγεται（paragetai） 是現在式，黑暗還沒有完全過去，但正在過去；ἤδη（ēdē）「已經」說光已經在照。這是約翰的「已經／還沒有」。</p><p><strong>異文。</strong>RP 2:7 作 Ἀδελφοί（Adelphoi）「弟兄們」，句末又加 ἀπ’ ἀρχῆς（ap' archēs）；和合本「親愛的弟兄」像是兩者合譯。意思沒有改變。</p>","exp":"<p>〔約〕約 13:34--35（約翰福音講義第 13 章）</p><p>「親愛的弟兄啊，我寫給你們的，不是一條新命令，乃是你們從起初所受的舊命令」（2:7）。下一節又說：「我寫給你們的，是一條新命令」（2:8）。約翰不是寫錯，是故意的。</p><p>那條命令是甚麼，他到 2:10 才點名：愛弟兄。這命令很舊。摩西的律法就說「卻要愛人如己」（利 19:18）；讀者從信主的第一天就聽過。約翰不想給他們新的花樣，那些離開的人正在兜售更新的東西。約翰說：不必去追新的，舊的那一條還沒有活完。</p><p>可是這命令又是新的。最後晚餐那一夜，主說：「我賜給你們一條新命令，乃是叫你們彼此相愛；我怎樣愛你們，你們也要怎樣相愛。」（約 13:34）新的不是內容，是尺度：我怎樣愛你們。主先洗了他們的腳，才說這句話。這命令先在主身上活出來；「在你們也是真的」（2:8），現在也要在你們身上活出來。主還說，眾人要因此認出誰是他的門徒（約 13:35）。</p><p>所以新命令不是重擔，是一盞燈。「黑暗漸漸過去，真光已經照耀。」（2:8）天還沒有全亮，但東邊已經白了。你身邊那個很難愛的人，你也許還沒有學會愛他；但光已經照進來了。今天你能做的，是在已經亮的那一小塊地方，照主愛你的方式，多走一步。</p>"},{"a":9,"z":11,"star":1,"grk":"<p lang=\"grc\">ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.</p><p lang=\"grc\">ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·</p><p lang=\"grc\">ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.</p>","lit":"<p>那說自己在光中卻恨他弟兄的，直到如今還在黑暗中。</p><p>那愛他弟兄的，住在光中，在他裡面沒有絆跌的東西；</p><p>但那恨他弟兄的，在黑暗中，也在黑暗中行走，並不知道自己往哪裡去，因為黑暗弄瞎了他的眼睛。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τῷ φωτὶ εἶναι</td><td>en tō phōti einai</td><td>在光中</td><td>第三次「那說……的」</td></tr><tr><td>μισῶν</td><td>misōn</td><td>恨</td><td>約翰沒有中間地帶：不愛就落在恨這一邊</td></tr><tr><td>ἕως ἄρτι</td><td>heōs arti</td><td>直到如今</td><td>自以為走出來了，其實還在原地</td></tr><tr><td>ἐν τῷ φωτὶ μένει</td><td>en tō phōti menei</td><td>住在光中</td><td>μένω 再出現</td></tr><tr><td>σκάνδαλον</td><td>skandalon</td><td>絆腳的東西</td><td>原指捕獸機關的觸發桿</td></tr><tr><td>ἐτύφλωσεν</td><td>etyphlōsen</td><td>弄瞎了</td><td>不定過去式：黑暗已經下了手</td></tr><tr><td>οὐκ οἶδεν ποῦ ὑπάγει</td><td>ouk oiden pou hypagei</td><td>不知道往哪裡去</td><td>回聲約 12:35</td></tr></table>","gram":"<p><strong>σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν（skandalon en autō ouk estin） 有兩種讀法。</strong>①「在他裡面」沒有叫他自己絆跌的東西：愛弟兄的人走在光中，看得見路，所以不跌倒（對照 2:11 恨弟兄的人看不見路）；②「在他身上」沒有叫別人絆跌的東西：他不成為弟兄的絆腳石。上下文對照的是看不見路，第一種讀法比較順；但兩者其實相連：自己不跌倒的人，也比較不會絆倒別人。</p><p><strong>「恨」的意思。</strong>μισέω（miseō） 在聖經的閃族用法裡，常常不是激烈的情緒，而是不愛、不顧、放在後面。約翰的世界只有光和暗兩邊，沒有中立地帶：對弟兄冷漠、不顧，在他眼中已經站到黑暗那一邊。3:15 會把這個字推到最深處。</p><p><strong>「弟兄」是誰？</strong>ἀδελφός（adelphos） 在約翰書信主要指信徒群體。這不是把愛限制在教會裡；約翰同樣記得神「差子作世人的救主」（4:14）。只是愛要從最近、最常碰面、也最容易摩擦的人開始。</p>","exp":"<p>「人若說自己在光明中，卻恨他的弟兄，他到如今還是在黑暗裡。」（2:9）這是本段第三次「人若說」。前兩次是說認識他、說住在主裡面，這一次是說自己在光明中。三句話都很屬靈，三句話都可以只是嘴上說說。約翰拿來試驗的，不是一個人禱告得多好，是他怎麼對待坐在旁邊的那個弟兄。</p><p>約翰說得很重：恨弟兄的人「到如今」還在黑暗裡。他也許以為自己早就走出來了，信主很多年，事奉很多年；可是心裡那一份對某個人的冷漠和怨氣，讓他一直停在原地。</p><p>2:11 描寫一個在黑暗裡走路的人：「且在黑暗裡行，也不知道往哪裡去，因為黑暗叫他眼睛瞎了。」（2:11）恨最可怕的地方，不只是傷了別人，是讓自己看不見。一個人心裡記恨，看甚麼都歪：對方說甚麼都像在攻擊，教會做甚麼都不對。主耶穌也說過：「那在黑暗裡行走的，不知道往何處去。」（約 12:35）</p><p>相反地，「愛弟兄的，就是住在光明中，在他並沒有絆跌的緣由。」（2:10）愛不是叫人變笨，是叫人看得清楚。這裡的愛不是要人假裝沒有受過傷，也不是要人沒有界線地回到傷害裡；愛是在光中，把那個人帶到神面前，不再讓恨替我決定路怎麼走。這一週，你可以先為那一位很難愛的弟兄姊妹，說出一句真實的祝福禱告。光，常常就從這一句開始。</p>"},{"a":12,"z":14,"star":2,"grk":"<p lang=\"grc\">Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·</p><p lang=\"grc\">γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.</p><p lang=\"grc\">ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.</p>","lit":"<p>小孩子們，我寫給你們，因為你們的罪藉著他的名已經得了赦免。</p><p>父老們，我寫給你們，因為你們已經認識了那從起初就有的。少年人，我寫給你們，因為你們已經勝過了那惡者。</p><p>孩子們，我曾寫給你們，因為你們已經認識了父。父老們，我曾寫給你們，因為你們已經認識了那從起初就有的。少年人，我曾寫給你們，因為你們是剛強的，神的話語住在你們裡面，你們也已經勝過了那惡者。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τεκνία</td><td>teknia</td><td>小孩子們</td><td>指小詞；全卷用來稱呼所有讀者</td></tr><tr><td>παιδία</td><td>paidia</td><td>孩子們</td><td>2:14、2:18 再用；也是全體的稱呼</td></tr><tr><td>πατέρες</td><td>pateres</td><td>父老們</td><td>認識那從起初原有的</td></tr><tr><td>νεανίσκοι</td><td>neaniskoi</td><td>少年人</td><td>勝了那惡者、剛強</td></tr><tr><td>γράφω／ἔγραψα</td><td>graphō / egrapsa</td><td>我寫／我曾寫</td><td>現在式轉成不定過去式</td></tr><tr><td>ἀφέωνται</td><td>apheōntai</td><td>已經得了赦免</td><td>完成式被動：赦免是定局</td></tr><tr><td>διὰ τὸ ὄνομα αὐτοῦ</td><td>dia to onoma autou</td><td>因著他的名</td><td>赦免的根據在他，不在我們</td></tr><tr><td>νενικήκατε τὸν πονηρόν</td><td>nenikēkate ton ponēron</td><td>你們已經勝了那惡者</td><td>完成式：得勝已經發生</td></tr><tr><td>ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει</td><td>ho logos tou theou en hymin menei</td><td>神的道住在你們裡面</td><td>剛強的來源</td></tr></table>","gram":"<p><strong>兩輪稱呼。</strong>2:12–13 是三句現在式「我寫」，依次對小子們（τεκνία）、父老、少年人；2:14 是三句不定過去式「我曾寫」，依次對小子們（παιδία）、父老、少年人。兩輪次序相同，第二輪對少年人的話最長。</p><p><strong>三種稱呼指誰？</strong>①年齡或屬靈階段說：教會裡真有剛信主的、正在爭戰的、成熟的。②全體三面向說：τεκνία（teknia） 與 παιδία（paidia） 在全卷都稱呼所有讀者（2:1、18、28），所以每個信徒都是蒙赦免的孩子，都要像少年人爭戰，也都要像父老認識那從起初原有的。③兩組說：小子指全體，父老、少年人是其中兩群。第二說最合全卷用法，第一說保留了牧養上的真實。本講義以第二說為主，也承認教會裡確有不同階段的人。</p><p><strong>γράφω 與 ἔγραψα。</strong>①前指本信，後指先前的信或約翰福音；②書信式不定過去式，從收信人讀信的角度說「我寫了」，指的仍是同一封信；③修辭上的變化，加重語氣。第二、三說最自然。RP 在 2:14 開頭對「小子們」那一句作 Γράφω。</p><p><strong>ὅτι（hoti）</strong>可讀「因為」，也可讀「就是」。兩讀都是宣告身分，不是提出條件。</p>","exp":"<p>「小子們哪，我寫信給你們，因為你們的罪藉著主名得了赦免。」（2:12）講到這裡，約翰忽然停下來，像一位老牧人放下講稿，抬頭看著會眾。他連說六句「我寫信給你們」，叫了三種稱呼：小子、父老、少年人。</p><p>前面兩段話很重：要遵守誡命，要愛弟兄，恨弟兄的在黑暗裡。有人聽了可能開始懷疑：那我到底算不算？約翰在這裡說：我寫這些，不是因為我懷疑你們，是因為你們已經是。每一句「因為」後面，都是一件已經成就的事：罪已經赦免，已經認識父，已經勝了那惡者。</p><p>三種稱呼，可以讀成教會裡三種人，也可以讀成每一個信徒身上的三個面向。兩種讀法都帶著安慰。剛信主的人聽見：你的罪是藉著主名得了赦免，根據不在你有多好。正在爭戰的人聽見：你「勝了那惡者」（2:13），那是完成式，仗已經在十字架上打贏了，你是從得勝的地方出發。走了很久的人聽見：你認識那從起初原有的，你沒有白走。</p><p>得勝的少年人，祕訣只有一句：「因為你們剛強，神的道常存在你們心裡」（2:14）。剛強不是性格，是道住在裡面。</p><p>321 在末端認出「235」裡面的「3」：屬靈父母與屬靈兒女，一代接一代。但經文本身先講的是身分，不是制度。今天不論你是哪一種人，約翰都寫信給你：你是被赦免、被認識、已經得勝的人。</p>"},{"a":15,"z":17,"star":2,"grk":"<p lang=\"grc\">Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·</p><p lang=\"grc\">ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·</p><p lang=\"grc\">καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.</p>","lit":"<p>不要愛世界，也不要愛世界裡的東西。若有人愛世界，父的愛就不在他裡面；</p><p>因為凡在世界裡的——肉體的慾望、眼睛的慾望、生活的誇耀——都不是出於父，而是出於世界。</p><p>並且世界和它的慾望正在過去，但遵行神旨意的人住到永遠。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μὴ ἀγαπᾶτε τὸν κόσμον</td><td>Mē agapate ton kosmon</td><td>不要愛世界</td><td>現在式命令：不要持續地愛</td></tr><tr><td>κόσμος</td><td>kosmos</td><td>世界</td><td>這裡指離開神的價值體系，不是受造界</td></tr><tr><td>ἡ ἀγάπη τοῦ πατρός</td><td>hē agapē tou patros</td><td>父的愛</td><td>心裡只有一個中心</td></tr><tr><td>ἐπιθυμία τῆς σαρκὸς</td><td>epithymia tēs sarkos</td><td>肉體的慾望</td><td>我想要</td></tr><tr><td>ἐπιθυμία τῶν ὀφθαλμῶν</td><td>epithymia tōn ophthalmōn</td><td>眼睛的慾望</td><td>我看見了，我也要</td></tr><tr><td>ἀλαζονεία τοῦ βίου</td><td>alazoneia tou biou</td><td>生活的誇耀</td><td>和合本「今生的驕傲」；βίος 指身家財物</td></tr><tr><td>παράγεται</td><td>paragetai</td><td>正在過去</td><td>與 2:8 黑暗「過去」同字</td></tr><tr><td>μένει εἰς τὸν αἰῶνα</td><td>menei eis ton aiōna</td><td>住到永遠</td><td>世界過去，遵行神旨意的留下</td></tr></table>","gram":"<p><strong>κόσμος（kosmos） 在約翰筆下有三個意思。</strong>①受造的世界：「世界也是藉著他造的」（約 1:10）；②世上的人：「神愛世人」（約 3:16），本書 2:2「普天下人」也是這一層；③離開神、自成一套的價值體系。2:15 的世界是第三義，2:16 自己下了定義：三種慾望與驕傲。所以這節經文不是叫人恨受造界，也不是叫人不愛世人；神「差他獨生子到世間來」（4:9），正是因為愛世人。</p><p><strong>三樣東西。</strong>ἐπιθυμία（epithymia） 本是中性的渴望，在這裡是脫離了父的渴望。有人把三樣對照創 3:6，也有人對照主在曠野受的三個試探；兩種對照都只能說「這使我們想起」，約翰沒有明說。第三樣 ἀλαζονεία τοῦ βίου（alazoneia tou biou） 最值得留意：ἀλαζών 是說的比有的多的誇口者；βίος（bios） 不是永生的 ζωή（zōē），是生計、財物、身家。今生的驕傲，是用我擁有的來定義我是誰。</p><blockquote>情慾是想要更多；驕傲是要別人知道我有更多。</blockquote><p>2:17 的 παράγεται（paragetai） 是現在式：世界不是將來才過去，是正在過去。</p>","exp":"<p>「不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。」（2:15）這節經文被用錯過很多次。有人因此不敢聽音樂、不看電影、不讀小說，把一切文化都當成危險；也有人因此輕看身體、冷落家人、不關心社會。這都不是約翰的意思。</p><p>約翰自己下了定義：「凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的」（2:16）。他要我們不愛的，不是山、不是海、不是一頓好飯，也不是鄰舍；是那一套叫人離開父的慾望與驕傲。神自己「愛世人」（約 3:16），也差子「作世人的救主」（4:14）。基督徒不是逃離世界的人，是在世界裡不被世界佔有的人。</p><p>肉體的情慾，是我想要；眼目的情慾，是我看見了，我也要；今生的驕傲，是我有，你要知道我有。第三樣最隱密，它可以穿著很屬靈的衣服：我的事工比較大，我的孩子比較好，我的房子在哪一區。一個人用擁有的東西來定義自己，就是讓世界替他命名。</p><p>約翰給的不是一份禁止清單，是一個比較：「這世界和其上的情慾都要過去，惟獨遵行神旨意的，是永遠常存。」（2:17）在一座快要拆的房子裡裝潢，再漂亮也會被拆掉。世界正在過去，遵行神旨意的人卻常存——又是 μένω，住下來的那個字。</p><p>321 在這裡認出「有己與驕傲」：今生的驕傲，是自己坐在中間。解藥不是更恨世界，是更被父的愛充滿；被父的愛佔滿的心，世界的東西自然退到該在的位置。這一週，可以把一樣你最想讓人知道的擁有，安靜地交給神。</p>"},{"a":18,"z":19,"star":2,"grk":"<p lang=\"grc\">Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.</p><p lang=\"grc\">ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.</p>","lit":"<p>孩子們，這是最後的時刻；正如你們聽見敵基督要來，現在也已經有許多敵基督出現了；因此我們知道這是最後的時刻。</p><p>他們從我們中間出去，但他們本來就不屬於我們；因為他們若屬於我們，就會一直與我們同住；但這是為要顯明，他們都不是屬於我們的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παιδία</td><td>Paidia</td><td>孩子們</td><td>對著不安的群體，先叫一聲孩子</td></tr><tr><td>ἐσχάτη ὥρα</td><td>eschatē hōra</td><td>最後的時刻</td><td>無冠詞；一世紀就說了</td></tr><tr><td>ἀντίχριστος ἔρχεται</td><td>antichristos erchetai</td><td>敵基督要來</td><td>他們早已聽過的教導</td></tr><tr><td>ἀντίχριστοι πολλοὶ γεγόνασιν</td><td>antichristoi polloi gegonasin</td><td>許多敵基督已經出現</td><td>完成式：已經在了</td></tr><tr><td>ἐξ ἡμῶν ἐξῆλθαν</td><td>ex hēmōn exēlthan</td><td>從我們中間出去</td><td>分裂已經發生</td></tr><tr><td>μεμενήκεισαν ἂν μεθ’ ἡμῶν</td><td>memenēkeisan an meth' hēmōn</td><td>就會一直與我們同住</td><td>μένω 的過去完成式</td></tr><tr><td>ἵνα φανερωθῶσιν</td><td>hina phanerōthōsin</td><td>為要被顯明</td><td>顯明的是方向，不是我們手中的判決</td></tr></table>","gram":"<p><strong>ἀντίχριστος（antichristos）：一人、一靈，還是很多人？</strong>ἀντί 可以是「對抗」，也可以是「取代」；敵基督既反對基督，也冒充基督。①一人說：讀者曾聽見那一位要來，這使我們想起帖後 2:3--4 的「大罪人」，指末後一個具體的人物。②一靈說：「這是那敵基督者的靈」（4:3），重點是一種貫穿歷史的屬靈勢力。③很多人說：本節明說「現在已經有好些敵基督的出來了」（2:18），指那些否認耶穌是基督的教師。約翰並不否認第一說，但焦點放在已經出現的很多人；他給的辨認標準不是日期、不是地點，是基督論（2:22）。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。</p><p><strong>「末時」。</strong>ἐσχάτη ὥρα（eschatē hōra） 沒有冠詞。約翰在一世紀就說「如今是末時了」（2:18），新約也說神「在這末世藉著他兒子曉諭我們」（來 1:2）。末時是從基督第一次來到他再來的整段日子；每一代都活在末時，所以每一代都要警醒、都要分辨，卻沒有一代受託去計算日子。</p><p><strong>2:19 的句法</strong>是與事實相反的條件句：若屬我們（其實不是），就會留下（其實沒有）。μεμενήκεισαν（memenēkeisan） 是 μένω 的過去完成式。RP 把 ἐξ ἡμῶν ἦσαν 語序調換，意思不變。</p>","exp":"<p>〔彼後〕彼後 2:1（彼得後書講義第 2 章）</p><p>「小子們哪，如今是末時了。」（2:18）約翰在一世紀就這樣說。所以這節經文不是給人算日子用的，也不是要我們把那個名號貼在今天任何一個人、一個國家、一個群體身上。約翰自己給了標準，在 2:22：不認耶穌是基督的。那是基督是誰的問題，不是誰的政治立場的問題。</p><p>約翰的讀者面對的是很具體的痛：「他們從我們中間出去」（2:19）。一起敬拜過、一起擘餅過的人，帶著另一套說法走了，可能還帶走了一些朋友。彼得也預先說過，「將來在你們中間也必有假師傅」（彼後 2:1）。留下來的人會問：是不是我們錯了？是不是他們才看得比較清楚？</p><p>2:19 是約翰對留下的人說的安慰：你們沒有錯，你們不必因他們的離開而懷疑自己所信的。這節經文說的是那一群否認基督的教師，不是交給我們一把尺，去量每一個不再來聚會的人。今天人離開一間教會有許多原因，有人是受了傷，有人是搬了家，有人是在掙扎裡暫時走不進來。約翰從來沒有給我們權柄，去宣判誰屬神、誰不屬神。</p><p>所以這兩節最該留下的，不是警報，是一聲「小子們哪」。末時不是叫人驚慌的時候，是叫人留在主身邊的時候。不要急著去追誰走了、誰是誰；要問的是：我自己今天，有沒有住在主裡面？</p>"},{"a":20,"z":21,"star":1,"grk":"<p lang=\"grc\">καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου καὶ οἴδατε πάντες·</p><p lang=\"grc\">οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.</p>","lit":"<p>而你們有從那聖者來的膏抹，並且你們眾人都知道。</p><p>我寫給你們，不是因為你們不知道真理，乃是因為你們知道它，也知道凡虛謊都不是出於真理。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καὶ ὑμεῖς</td><td>kai hymeis</td><td>而你們</td><td>強調的「你們」：與出去的人對照</td></tr><tr><td>χρῖσμα</td><td>chrisma</td><td>膏抹、膏油</td><td>與 Χριστός「受膏者」同字根</td></tr><tr><td>ἀπὸ τοῦ ἁγίου</td><td>apo tou hagiou</td><td>從那聖者</td><td>多指基督，也可指父</td></tr><tr><td>οἴδατε πάντες</td><td>oidate pantes</td><td>你們眾人都知道</td><td>WH NA28；Treg RP 作 πάντα「一切」</td></tr><tr><td>οὐκ ἔγραψα … ὅτι οὐκ οἴδατε</td><td>ouk egrapsa ... hoti ouk oidate</td><td>我寫信不是因你們不知道</td><td>書信式不定過去式</td></tr><tr><td>πᾶν ψεῦδος</td><td>pan pseudos</td><td>凡虛謊</td><td>虛謊不會從真理生出來</td></tr></table>","gram":"<p><strong>2:20 的異文：πάντες 還是 πάντα？</strong>WH、NA28 作 οἴδατε πάντες（oidate pantes）「你們眾人都知道」；Treg、RP 作 οἴδατε πάντα（oidate panta）「你們知道一切」。和合本正文「知道這一切的事」跟的是 πάντα，小字「或譯：都有知識」接近 πάντες。現代校勘本多取 πάντες：抄本證據較強，而 πάντα 像是後人為「知道」補上受詞。更要緊的是語意：那些出去的人很可能自稱有少數人才懂的知識，約翰回答，不是少數人，是你們眾人都知道。本講義取 πάντες。WH 另缺句首的 καί。</p><p><strong>χρῖσμα（chrisma） 是甚麼？</strong>這字在新約只出現在 2:20、27。①聖靈說：主應許保惠師「要將一切的事指教你們」（約 14:26），與恩膏「在凡事上教訓你們」（2:27）對應；②神的道說：「從起初所聽見的」（2:24）常存心裡，與「恩膏常存在你們心裡」（2:27）句型平行；③合讀：聖靈藉著福音的道在信徒裡面作工。第三說最能兼顧上下文。χρῖσμα 與 Χριστός（Christos）同字根：敵基督否認受膏者，信徒卻有從受膏者來的膏。</p><p>ἀπὸ τοῦ ἁγίου（apo tou hagiou）「那聖者」，這使我們想起「你是神的聖者」（約 6:69）；2:27 說「從主所受的」，多數解經家取基督。</p>","exp":"<p>「你們從那聖者受了恩膏，並且知道這一切的事。」（2:20）上一節剛說有人出去了，這一節第一個字就把鏡頭轉回來：你們。出去的人有他們的說法，留下的你們有恩膏。</p><p>恩膏，在舊約是倒在君王、祭司、先知頭上的油，表示神揀選、神裝備。新約的信徒，每一個人都有這膏——不是少數領袖，是全體。和合本小字說「或譯：都有知識」，原文很可能是「你們眾人都知道」。在一個有人自稱擁有更高知識的時代，這是一句很大的安慰：真理不是少數人的祕密，是每一個屬主的人都領受了的。</p><p>所以約翰說：「我寫信給你們，不是因你們不知道真理，正是因你們知道」（2:21）。這是牧者的語氣。他不是寫信去補一群無知的人，是寫信去堅固一群已經知道、卻被搖動的人。他相信他們。有時候我們需要的不是新的資訊，是有人提醒我們：你本來就知道，你沒有被騙，你所信的是真的。</p><p>這個詞也不是給任何人用來高舉自己的。這裡的「你們」是複數，膏是給全體的，沒有誰可以獨佔。同時，約翰正在寫信教導他們；恩膏不是拒絕教導的理由，是叫人認得真教導的能力。</p><p>今天，若你覺得自己讀經不夠、懂得不多，請聽約翰這一句：你們眾人都知道。那位聖者沒有漏掉你。</p>"},{"a":22,"z":23,"star":1,"grk":"<p lang=\"grc\">τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.</p><p lang=\"grc\">πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει.</p>","lit":"<p>誰是那說謊的，若不是那否認耶穌是基督的呢？這人就是那敵基督，否認父和子的。</p><p>凡否認子的，也沒有父；那承認子的，也有父。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τίς ἐστιν ὁ ψεύστης</td><td>tis estin ho pseustēs</td><td>誰是那說謊的</td><td>有冠詞：那典型的說謊者</td></tr><tr><td>ὁ ἀρνούμενος</td><td>ho arnoumenos</td><td>那否認的</td><td>現在式分詞：持續的立場</td></tr><tr><td>Ἰησοῦς οὐκ ἔστιν ὁ χριστός</td><td>Iēsous ouk estin ho christos</td><td>耶穌不是基督</td><td>把人耶穌和基督分開</td></tr><tr><td>ὁ ἀντίχριστος</td><td>ho antichristos</td><td>那敵基督</td><td>這裡的定義是基督論</td></tr><tr><td>τὸν πατέρα καὶ τὸν υἱόν</td><td>ton patera kai ton huion</td><td>父和子</td><td>不能只要一位</td></tr><tr><td>ὁ ὁμολογῶν</td><td>ho homologōn</td><td>那承認的</td><td>與 1:9「認罪」同字：說一樣的話</td></tr><tr><td>τὸν πατέρα ἔχει</td><td>ton patera echei</td><td>有父</td><td>不只是知道父，是擁有這關係</td></tr></table>","gram":"<p><strong>他們否認的是甚麼？</strong>「不認耶穌為基督」（2:22）可能有三種背景：①猶太會堂的立場，否認拿撒勒人耶穌是彌賽亞；②早期幻影說，認為神聖的基督不可能真有肉身；③照教會的傳統，以弗所有一位克林妥，教導屬天的基督在受洗時降在人耶穌身上，受難前又離開。「耶穌基督是成了肉身來的」（4:2）比較支持後兩者：問題不在承不承認有一位基督，而在承不承認那位基督就是成了肉身、死在十字架上的耶穌。三種背景都只是重建，約翰沒有點名。</p><p><strong>ἀρνέομαι／ὁμολογέω。</strong>ἀρνούμενος（arnoumenos）「否認」與 ὁμολογῶν（homologōn）「承認」是一組對句。ὁμολογέω 就是 1:9「認罪」的那個字，字面是「說一樣的話」：認罪是對罪說神所說的話，認子是對耶穌說神所說的話。</p><p><strong>異文。</strong>2:23 後半「認子的，連父也有了」（2:23）RP 沒有；兩個子句都以 τὸν πατέρα ἔχει（ton patera echei） 結尾，很可能是抄寫時眼睛跳行漏掉。和合本與現代校勘本都保留。</p>","exp":"<p>「誰是說謊話的呢？不是那不認耶穌為基督的嗎？不認父與子的，這就是敵基督的。」（2:22）這是全章最清楚的一把尺。約翰辨認的方法，不看一個人從哪裡來、屬於哪一國、站哪一邊，只問一件事：他怎樣看耶穌。</p><p>這一點很重要。歷史上每一個世代，都有人急著指認那一位，把名字貼在皇帝、政敵、別的宗派身上，結果常常是恐懼多了，愛少了，教會分裂了。約翰沒有給我們那樣的名單。他給的是一個基督論的問題：耶穌是不是基督，是不是成了肉身來的神的兒子。這問題每一代都要回答，也每一代都要先拿來問自己的講台。</p><p>2:23 把話說到底：「凡不認子的，就沒有父；認子的，連父也有了。」（2:23）不能說：我要神，但不要耶穌。父和子是一起的。這對今天許多人也是一個溫柔的邀請：你若在尋找神，不必繞遠路，到耶穌面前來，你就找到了父。主自己說過：「若不藉著我，沒有人能到父那裡去。」（約 14:6）</p><p>「認」這個字，就是 1:9「認罪」的同一個字：說神所說的話。認罪，是對我的罪說神說的話；認子，是對耶穌說神說的話。每天這樣認，也是住在主裡面的一種樣子。今天你可以安靜地說一句：耶穌是基督，是神的兒子，也是我的主。說出來，就有了父。</p>"},{"a":24,"z":25,"star":1,"grk":"<p lang=\"grc\">ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.</p><p lang=\"grc\">καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.</p>","lit":"<p>至於你們，你們從起初所聽見的，要讓它住在你們裡面。若你們從起初所聽見的住在你們裡面，你們也必住在子裡面和父裡面。</p><p>而這就是他親自應許我們的應許：那永遠的生命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς</td><td>hymeis ho ēkousate ap' archēs</td><td>你們，那從起初聽見的</td><td>「你們」提前，強調</td></tr><tr><td>ἐν ὑμῖν μενέτω</td><td>en hymin menetō</td><td>讓它住在你們裡面</td><td>第三人稱命令式</td></tr><tr><td>ἐὰν … μείνῃ</td><td>ean ... meinē</td><td>若它住</td><td>條件：道住在人裡面</td></tr><tr><td>ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε</td><td>en tō huiō kai en tō patri meneite</td><td>你們必住在子和父裡面</td><td>未來式：結果</td></tr><tr><td>ἡ ἐπαγγελία</td><td>hē epangelia</td><td>應許</td><td>約翰書信只此一次</td></tr><tr><td>τὴν ζωὴν τὴν αἰώνιον</td><td>tēn zōēn tēn aiōnion</td><td>那永遠的生命</td><td>回到 1:2</td></tr></table>","gram":"<p><strong>句首的 ὑμεῖς（hymeis）。</strong>這是懸置的主格：先把「你們」單獨提出來，再說事情。和合本「論到你們」譯得很好。它與 2:18--19 那些出去的人形成對照。RP 在後面多一個 οὖν（oun）「所以」，意思不變。</p><p><strong>μένω 在一節裡出現三次。</strong>先是 μενέτω（menetō） 第三人稱命令式，讓那從起初所聽見的住在你們裡面；再是條件 μείνῃ（meinē）；最後是結果 μενεῖτε（meneite）：你們必住在子裡面，也住在父裡面。道住在人裡面，人就住在神裡面。這是約翰福音葡萄樹比喻的互住：「你們要常在我裡面，我也常在你們裡面」（約 15:4）。子在父之前，與 2:23 一致：通往父的路是子。</p><p><strong>ἀπ’ ἀρχῆς（ap' archēs）「從起初」</strong>在這裡不是 1:1 的宇宙起初，而是讀者初聽福音的時候。與那些標榜更新的教導相比，約翰要他們回到起初。</p><p><strong>2:25 的 αὕτη（hautē）</strong>指向後面：應許的內容就是永生。τὴν ζωὴν τὴν αἰώνιον 用賓格，是被前面的關係子句吸引的同位語。</p>","exp":"<p>「論到你們，務要將那從起初所聽見的，常存在心裡。」（2:24）有人出去追新的了，約翰對留下的人說：不要追，要存。</p><p>這是一個很反潮流的勸勉。我們很容易以為，屬靈長進就是不斷聽到新的東西：新的啟示、新的方法、新的講員。約翰卻說，你最需要的，是你在起初就聽見的那個福音：耶穌是基督，他為你的罪死，神愛你。不是你已經聽過，就可以往下一個去了；是你還沒有讓它住滿你。</p><p>常存，就是住。約翰在一節經文裡用了三次：讓道住在你裡面，你就住在子裡面，也住在父裡面。這像一棵樹住在土裡。樹不會每天換一塊土來證明自己在長大；它把根往同一塊土裡越扎越深。</p><p>然後約翰說了一句很短的話：「主所應許我們的就是永生。」（2:25）住下來的人得著的，不是一套更高的知識，是生命，而且是永遠的生命。這生命在第一章已經向使徒們顯明，就是那位成了肉身的主自己。</p><p>321 在這裡認出「聖經是我的準則」：準則不是一直換的，是從起初就聽見、到今天還站得住的。這一週，可以把你當初信主時最打動你的那一節經文找出來，再讀一次，讓它重新住進心裡。</p>"},{"a":26,"z":27,"star":2,"grk":"<p lang=\"grc\">Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.</p><p lang=\"grc\">καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ μένει ἐν ὑμῖν, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, μένετε ἐν αὐτῷ.</p>","lit":"<p>這些事我寫給你們，是關於那些要使你們走迷的人。</p><p>至於你們，你們從他所領受的膏抹住在你們裡面，你們並不需要有人教導你們；乃是如同他的膏抹在一切事上教導你們，而且是真的，不是虛謊，並且照著它怎樣教導了你們，你們就要住在他裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>περὶ τῶν πλανώντων ὑμᾶς</td><td>peri tōn planōntōn hymas</td><td>關於那些叫你們走迷的人</td><td>現在式：還在進行</td></tr><tr><td>τὸ χρῖσμα ὃ ἐλάβετε</td><td>to chrisma ho elabete</td><td>你們所領受的膏</td><td>不定過去式：信主時已經領受</td></tr><tr><td>μένει ἐν ὑμῖν</td><td>menei en hymin</td><td>住在你們裡面</td><td>膏也是住下來的</td></tr><tr><td>οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς</td><td>ou chreian echete hina tis didaskē hymas</td><td>不需要有人教導你們</td><td>對著那些引誘人的教師說</td></tr><tr><td>διδάσκει ὑμᾶς περὶ πάντων</td><td>didaskei hymas peri pantōn</td><td>在凡事上教導你們</td><td>與約 14:26 同一應許</td></tr><tr><td>ἀληθές … οὐκ ἔστιν ψεῦδος</td><td>alēthes ... ouk estin pseudos</td><td>是真的，不是假的</td><td>對照 2:21、22 的說謊</td></tr><tr><td>μένετε ἐν αὐτῷ</td><td>menete en autō</td><td>你們要住在他裡面</td><td>RP 作未來式 μενεῖτε</td></tr></table>","gram":"<p><strong>「並不用人教訓你們」（2:27）是甚麼意思？</strong>①個人主義的讀法：有了聖靈就不需要任何教導。這讀法站不住，因為約翰正在寫一整封信教導他們，新約也說主賜下「牧師和教師」（弗 4:11）。②處境的讀法：這裡的「人」指 2:26 那些引誘人的教師，他們自稱帶來你們沒有的新知識；約翰說，你們不需要他們來補充。③新約應許的讀法：這使我們想起耶 31:34，從最小的到至大的都必認識神；信徒與神有直接的關係，但這並不取消教會裡的教導。本講義取②與③合讀。</p><blockquote>恩膏不是拒絕教導的理由，是分辨教導的能力；它也從來不是一個人壟斷解經的憑據。</blockquote><p><strong>μένετε（menete）：陳述還是命令？</strong>這個形式可讀「你們住在他裡面」，也可讀「你們要住在他裡面」。下一節 2:28 明顯是命令，和合本兩處都取命令。RP 作未來式 μενεῖτε（meneite）「你們必住」，又把 αὐτοῦ 作 αὐτό，都是小差異。</p><p>καθὼς ἐδίδαξεν（kathōs edidaxen） 是不定過去式：恩膏已經教導過你們——就是那從起初所聽見的福音。恩膏不教新福音，它教人住在原有的福音裡。</p>","exp":"<p>「你們從主所受的恩膏常存在你們心裡，並不用人教訓你們」（2:27）。這句話很容易被拿去用錯。有人說：我有聖靈，講道、查經都可以省了。也有人反過來說：我有恩膏，我說的就是神說的，你們都要聽我的。兩種講法都把恩膏變成了自己的牌子。</p><p>先看約翰在做甚麼：他正在寫信教導他們。一個說「你們不需要人教導」的人，寫了五章信來教導，可見他的意思不是取消教導。他說的是那些「引誘你們的人」（2:26）：自稱帶來更高啟示、要你們離開起初所聽見之道的教師。對這種新教導，你們不需要；你們裡面那位，早就教過你們真的。</p><p>恩膏的作用，像一個人對親人聲音的熟悉。電話那頭有人冒充你的母親，你不需要上一堂課，一聽就知道不對。這不是因為你比較聰明，是因為你跟她住得夠久。聖靈在信徒裡面作的，也是這樣：叫我們認得真道的聲音，也認得假的。</p><p>所以約翰最後不是叫人各自去想，而是說：「你們要按這恩膏的教訓住在主裡面」（2:27）。恩膏把人帶回主那裡，不是帶到自己的意見那裡。這膏是給你們全體的，所以在群體裡、在聖經裡、在彼此的印證裡最清楚。</p><p>321 在末端認出「聖靈是我的引導」：聖靈引導人的方向，總是更深地住在主裡面，也更願意和弟兄姊妹一起受教。</p>"},{"a":28,"z":29,"star":3,"grk":"<p lang=\"grc\">Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ἐὰν φανερωθῇ σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.</p><p lang=\"grc\">ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.</p>","lit":"<p>現在，小孩子們，你們要住在他裡面，好叫他若顯現，我們可以有坦然，在他來臨的時候不至於羞愧而離開他。</p><p>你們若知道他是公義的，就知道凡行公義的人都是從他生的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Καὶ νῦν, τεκνία</td><td>Kai nyn, teknia</td><td>現在，小孩子們</td><td>收束前面全部的勸勉</td></tr><tr><td>μένετε ἐν αὐτῷ</td><td>menete en autō</td><td>你們要住在他裡面</td><td>本章的主命令</td></tr><tr><td>ἐὰν φανερωθῇ</td><td>ean phanerōthē</td><td>若他顯現</td><td>不表懷疑，近乎「當他顯現」</td></tr><tr><td>σχῶμεν παρρησίαν</td><td>schōmen parrēsian</td><td>我們可以有坦然</td><td>παρρησία：無所隱藏、可以直說</td></tr><tr><td>μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ</td><td>mē aischynthōmen ap' autou</td><td>不至於羞愧離開他</td><td>ἀπό：羞愧得退縮</td></tr><tr><td>ἐν τῇ παρουσίᾳ αὐτοῦ</td><td>en tē parousia autou</td><td>在他來臨的時候</td><td>約翰書信唯一一次用 παρουσία</td></tr><tr><td>ἐξ αὐτοῦ γεγέννηται</td><td>ex autou gegennētai</td><td>是從他生的</td><td>完成式；本卷第一次出現「從神生」</td></tr></table>","gram":"<p><strong>παρρησία（parrēsia）。</strong>這個字原是希臘城邦公民在議會裡把話說完的自由，後來指在大人物面前無所隱藏、可以直說的坦然。約翰書信用了四次：主顯現時的坦然（2:28；4:17），禱告時的坦然（3:21；5:14）。在主再來的日子能坦然，與今天在禱告裡能坦然，是同一份關係。</p><p><strong>μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ（mē aischynthōmen ap' autou）。</strong>被動語態加上 ἀπό（apo），字面是被羞愧推得離開他，像亞當在園中躲起來。坦然是往前走近，羞愧是往後退。留意約翰在這裡從「你們」換成「我們」：他和小子們一起站在主面前。</p><p><strong>2:29 的「他」是誰？</strong>δίκαιός ἐστιν（dikaios estin）「他是公義的」，自然接回「那義者耶穌基督」（2:1）；但「從他生」通常說的是從神生（3:9；5:1）。約翰在父與子之間自然轉換，因為認子的連父也有了（2:23）。γεγέννηται（gegennētai） 是完成式：先是從神生，然後行公義。行公義是兒女的記號，不是成為兒女的代價。</p><p><strong>異文。</strong>RP 2:28 作 ὅταν（hotan）「當……時」、ἔχωμεν（echōmen）；NA28、Treg 2:29 多一個 καί（kai）「也」。和合本「他若顯現」譯的是 ἐάν；「當他來的時候」譯的是 ἐν τῇ παρουσίᾳ αὐτοῦ，不是異文。</p>","exp":"<p>「小子們哪，你們要住在主裡面。」（2:28）整章走到這裡，收成一句話。中保、新命令、三種稱呼、世界的過去、有人的出去、恩膏的教訓，全都是為了這一句：住下來。</p><p>住，是約翰最喜歡的字。它不是激烈的字，是安靜的字；不是一次的衝刺，是每天的回家。那些出去的人以為往外走才會長大，約翰說，住下來的人才會結果子。這不是叫人原地不動，是叫人在同一位主裡面越扎越深。</p><p>住下來的結果是：「他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。」（2:28）坦然無懼，是在他面前不必躲。亞當犯罪以後躲在樹後面；住在主裡面的人，到主再來的那一天，可以往前走。這份坦然不是因為我們從來沒有跌倒，是因為我們一直沒有離開那位中保。本章從 2:1 的中保開始，到 2:28 的坦然結束，中間是一條住的路。</p><p>約翰說「我們」，不是「你們」。年老的使徒把自己也放進去：我也要在那一天站在他面前，我也要住在他裡面。2:29 接著打開第三章的門：「凡行公義之人都是他所生的。」（2:29）住在主裡面的人，會漸漸像他，因為他們是他所生的。</p><p>如果你這一週只記得一句，就記這一句：住下來。不要因為別人離開就慌，不要因為新的聲音就追，也不要因為自己跌倒就躲。回到主那裡，住在他裡面。那一天他顯現的時候，你會發現他一直在等你，你不必慚愧。</p>"}],"3":[{"a":1,"z":1,"star":3,"grk":"<p lang=\"grc\">ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, καὶ ἐσμέν. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.</p>","lit":"<p>你們看哪，父已經賜給我們何等的愛，叫我們被稱為神的兒女；而我們也真是。因此世界不認識我們，因為它不曾認識他。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἴδετε</td><td>idete</td><td>你們看（複數命令）</td><td>叫全教會一起停下來</td></tr><tr><td>ποταπὴν ἀγάπην</td><td>potapēn agapēn</td><td>何等的愛（字源：從哪一國來的）</td><td>不是這世界出產的愛</td></tr><tr><td>δέδωκεν</td><td>dedōken</td><td>已經賜下（完成式）</td><td>給了，而且一直在</td></tr><tr><td>τέκνα θεοῦ κληθῶμεν</td><td>tekna theou klēthōmen</td><td>被稱為神的兒女</td><td>名字是父親叫出來的</td></tr><tr><td>καὶ ἐσμέν</td><td>kai esmen</td><td>而我們也真是</td><td>不只是名義，是事實</td></tr><tr><td>ὁ κόσμος οὐ γινώσκει ἡμᾶς</td><td>ho kosmos ou ginōskei hēmas</td><td>世界不認識我們</td><td>不被認出，不等於不是</td></tr></table>","gram":"<p><strong>ποταπός（potapos）原來是「從哪一國來的」。</strong>這個字早期的形式是問出身地的：這人是哪裡來的？到新約時代，它已經轉成「何等樣的、何等驚人的」，常帶著驚訝；門徒在船上看見風和海都聽從主，問的「這是怎樣的人」，用的就是它。字源的味道還在：這愛不是本地出產的，是從另一個國度來的。</p><p>δέδωκεν（dedōken）是完成式：父已經給了，給了就留在那裡。ἵνα τέκνα θεοῦ κληθῶμεν 的 ἵνα 說明這愛的目的；被動的「被稱為」，叫名字的是父。約翰用 τέκνα（tekna，孩子）稱信徒，把 υἱός（huios，兒子）留給耶穌一人；τέκνον 帶著「生出來」的味道，接回 2:29 的「他所生的」，也接到 3:9。</p><p><strong>異文：</strong>καὶ ἐσμέν（kai esmen）「我們也真是」，WH、Treg、NA28 都有，RP（拜占庭本）沒有，欽定本所根據的公認經文也沒有這一句。抄本的證據支持保留；和合本照收：「我們也真是他的兒女」（3:1）。短短兩個字，像父親在領養文件上簽完名，又補一句：這是真的。</p>","exp":"<p>〔約〕約 1:12--13（約翰福音講義第 1 章）</p><p>「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1）。整封約翰一書沒有一首頌讚詩，沒有一段「願榮耀歸給他」；這是全卷唯一的驚嘆。寫到這裡，老使徒停筆了。他剛說完凡行公義的人「都是他所生的」（2:29），一提到「生」，他自己先被震住：我們是他生的？</p><p>我們也在這裡停一下。不急著往下讀。</p><p>「你看」是複數。他不是對一個人說，是對整個剛經歷分裂、有人離去的教會說：大家一起看。看的不是自己的表現，不是誰留下、誰走了，是父給了甚麼。約翰福音講義第 1 章讀過：「凡接待他的……就賜他們權柄作神的兒女」（約 1:12），這等人「乃是從神生的」（約 1:13）。福音書講的是權柄，書信講的是驚訝：這權柄真的落在我們身上了。</p><p>世界不認識我們，不必奇怪，世界也不認識他。一個孩子在學校沒人知道他爸爸是誰，他仍然是那家的孩子。被不被認出，不改變出生證明。</p><p>有人一輩子在找一個願意叫他名字的父親；有人從小聽的是「你怎麼不像你哥哥」。對這樣的心，約翰不先給命令，先給一個名字：神的兒女。而且他補了一句，我們也真是。321 說「讓耶穌得著一切的榮耀」，在這一節不必多講，一聲「你看」就是頌讚。今天，在一切要做的事以前，先停下來，看一看父給了你甚麼。</p>"},{"a":2,"z":2,"star":2,"grk":"<p lang=\"grc\">ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.</p>","lit":"<p>親愛的，我們現在是神的兒女，而我們將要成為甚麼，還沒有顯明。我們知道，他若顯明出來，我們必要與他相似，因為我們必要看見他，正如他所是的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀγαπητοί</td><td>agapētoi</td><td>被愛的人們</td><td>稱呼本身就是 3:1 的回音</td></tr><tr><td>νῦν τέκνα θεοῦ ἐσμεν</td><td>nyn tekna theou esmen</td><td>現在是神的兒女</td><td>不必等到天上才算數</td></tr><tr><td>οὔπω ἐφανερώθη</td><td>oupō ephanerōthē</td><td>還沒有被顯明</td><td>未完成，不是不確定</td></tr><tr><td>ἐὰν φανερωθῇ</td><td>ean phanerōthē</td><td>他（或「它」）若顯明</td><td>2:28 同一句，指主再來</td></tr><tr><td>ὅμοιοι αὐτῷ</td><td>homoioi autō</td><td>與他相似</td><td>像他，不是變成他</td></tr><tr><td>ὀψόμεθα αὐτὸν καθώς ἐστιν</td><td>opsometha auton kathōs estin</td><td>要看見他，如他所是</td><td>看見本身會改變人</td></tr></table>","gram":"<p><strong>「顯現」的主詞是誰？</strong>ἐὰν φανερωθῇ（ean phanerōthē）可以讀成「它（我們將來的樣子）若顯明」，也可以讀成「他（主）若顯現」。前半句剛說將來如何還未顯明，似乎支持前者；但 2:28 用一模一樣的話指主的再來，3:5、8 也都以基督為主詞。和合本譯「主若顯現」，是較好的讀法。</p><p><strong>「像他」像到甚麼地步？</strong>這裡有一條成聖與得榮的界線，各家說法不同：</p><ul><li>神化說（東方教會的 theosis）：引「得與神的性情有分」（彼後 1:4），說人終要分享神的生命。難處：講得不小心，會模糊創造主與受造者的分別。</li><li>道德相似說：像他只指品格聖潔。難處：保羅說主要叫我們的身體「和他自己榮耀的身體相似」（腓 3:21），不只是品格。</li><li>看見而改變說：照「到那時就要面對面了」（林前 13:12），看見他就被改變。難處：經文的 ὅτι 可以讀成原因，也可以讀成證明，不能只取一邊。</li></ul><blockquote>ὅμοιοι 是「相似」，不是「同一」。我們要像復活得榮的基督，卻永遠是受造的兒女，不會變成神。現在的成聖是開始（3:3），主顯現時的得榮是完成；中間的距離，靠的是盼望，不是焦慮。詳見 〈3:2「我們必要像他」——基督徒會變成神嗎？〉。</blockquote>","exp":"<p>「親愛的弟兄啊，我們現在是神的兒女，將來如何，還未顯明」（3:2）。約翰把時間切成兩段：現在，和還沒有。現在已經是；將來還沒看見。</p><p>很多信徒把次序弄反了。他們以為要先變好，有一天才配作神的兒女。約翰說：不，先是兒女，然後才慢慢長得像。就像一個被領養的孩子，文件簽好那天就姓了這家的姓；說話的口氣、走路的樣子越來越像爸爸，是在這家裡住久了以後的事。</p><p>將來是甚麼樣子，約翰承認他也不知道細節。「還未顯明」是誠實的話。但有一件事他知道：「主若顯現，我們必要像他，因為必得見他的真體」（3:2）。不是我們努力爬到他那裡，是他顯現的那一刻，看見他，就改變了我們。</p><p>這是給疲倦的人的應許。你今天看自己，可能只看見還沒長好的地方：老脾氣、舊傷口、改了又犯的習慣。約翰沒有說這些不重要，他說這些不是終點。321 說「改變觀點」，從地上看到天上：你現在的樣子不是你最後的樣子。今天你可以帶著還沒完成的自己來到他面前，因為完成這件事的，是他的顯現，不是你的焦慮。</p>"},{"a":3,"z":3,"star":1,"grk":"<p lang=\"grc\">καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.</p>","lit":"<p>凡在他身上存著這盼望的，就使自己潔淨，正如那一位是潔淨的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην</td><td>pas ho echōn tēn elpida tautēn</td><td>凡持有這盼望的</td><td>盼望是握在手裡的</td></tr><tr><td>ἐπ’ αὐτῷ</td><td>ep’ autō</td><td>在他身上</td><td>盼望的根基在基督，不在自己</td></tr><tr><td>ἁγνίζει ἑαυτόν</td><td>hagnizei heauton</td><td>使自己潔淨（現在式）</td><td>每天的功課，不是一次了事</td></tr><tr><td>ἁγνίζω</td><td>hagnizō</td><td>潔淨、預備自己</td><td>原是過節以前的潔淨</td></tr><tr><td>καθὼς ἐκεῖνος</td><td>kathōs ekeinos</td><td>正如那一位</td><td>約翰一書稱基督的慣用語</td></tr><tr><td>ἁγνός ἐστιν</td><td>hagnos estin</td><td>是潔淨的（現在式）</td><td>他現在就是，不是曾經是</td></tr></table>","gram":"<p><strong>ἁγνίζω（hagnizō）是過節以前的字。</strong>約翰福音記載逾越節近了，「有許多人從鄉下上耶路撒冷去，要在節前潔淨自己」（約 11:55），用的就是這個動詞。在七十士譯本裡，它多半是禮儀上的潔淨：赴會以前、見神以前，先把自己預備好。約翰把它借來，放在主顯現以前：要去見他的人，現在就開始預備。</p><p>要分清楚兩個「潔淨」。1:7、9 的 καθαρίζω（katharizō）主詞是神：「他兒子耶穌的血也洗淨我們一切的罪」（1:7）；這裡的 ἁγνίζω 主詞是我們：潔淨自己。先被洗淨，然後才自己整理。次序反了，就成了律法主義；只有前半，就成了廉價的恩典。</p><p>ἐκεῖνος（ekeinos，那一位）是約翰一書指基督的慣用語（2:6；3:5、7、16；4:17）。ἁγνός ἐστιν 是現在式：基督不是曾經聖潔過，他現在就是。盼望不是逃避現在的理由，是整理現在的動力。</p>","exp":"<p>「凡向他有這指望的，就潔淨自己，像他潔淨一樣。」（3:3）上一節是應許，這一節是回應。注意次序：先有指望，然後潔淨。不是潔淨了才准有指望。</p><p>想像一個要出嫁的女子。婚期定了，她開始挑衣服、整理房間、學新家的口味。沒有人逼她，是那個日子吸引她。約翰說的潔淨就是這樣：知道要見誰，就開始預備。被恐嚇出來的潔淨是累的，被盼望吸引出來的潔淨是輕的。</p><p>「潔淨自己」聽起來好像全靠自己。但約翰在 1:9 已經說過，赦免和洗淨是神的工作。這裡講的是兒女的配合：把被洗淨的生命繼續保持乾淨，像洗好的衣服不再故意往泥裡滾。這也不是一次完成；動詞是現在式，是每天的功課。今天改一點，明天再改一點。</p><p>有人聽到「潔淨」就緊張，以為又要被要求完美。標準雖然是「像他潔淨一樣」（3:3），力量卻是盼望。你不是為了被接納而潔淨，你是因為已經被接納、而且就要見他，所以潔淨。今天可以選一件小事整理：一個不該再打開的網站，一句該收回的話，一筆該還的帳。不是為了換取愛，是為了迎接愛。</p>"},{"a":4,"z":5,"star":1,"grk":"<p lang=\"grc\">Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.</p><p lang=\"grc\">καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.</p>","lit":"<p>凡行罪的，也是在行不法；罪就是不法。</p><p>你們也知道，那一位顯明出來，是為要除去眾罪；在他裡面沒有罪。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ ποιῶν τὴν ἁμαρτίαν</td><td>ho poiōn tēn hamartian</td><td>行那罪的（現在分詞）</td><td>把罪當作生活的做法</td></tr><tr><td>ἀνομία</td><td>anomia</td><td>不法、沒有法</td><td>不只是違規，是拒絕神的權柄</td></tr><tr><td>ἡ ἁμαρτία ἐστὶν ἡ ἀνομία</td><td>hē hamartia estin hē anomia</td><td>罪就是不法</td><td>兩個冠詞：兩者是同一件事</td></tr><tr><td>ἐφανερώθη</td><td>ephanerōthē</td><td>被顯明（不定過去式）</td><td>道成肉身那一次的顯現</td></tr><tr><td>ἵνα τὰς ἁμαρτίας ἄρῃ</td><td>hina tas hamartias arē</td><td>為要拿走眾罪</td><td>約 1:29 同一個動詞</td></tr><tr><td>ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν</td><td>hamartia en autō ouk estin</td><td>罪在他裡面沒有</td><td>除罪的那一位，自己沒有罪</td></tr></table>","gram":"<p><strong>ἀνομία（anomia）比「違背律法」重。</strong>字面是「沒有法」，但在新約它常帶末世的色彩：主耶穌說末世「不法的事增多」（太 24:12）；帖後 2:3 的「大罪人」，許多古卷作「不法的人」。所以約翰不是在說罪就是違反某一條規定，而是說：罪的本質是背叛，是不要神作王。</p><p>這可能是針對當時的一種說法：有人以為自己已經有了屬靈的知識，罪只是身體的事，不影響靈。約翰用兩個帶冠詞的名詞把這條路堵住：ἡ ἁμαρτία ἐστὶν ἡ ἀνομία，罪就是不法，兩者可以互換。沒有「無害的罪」。</p><p>3:5 的 ἄρῃ（arē）出自 αἴρω（airō）「舉起、拿走」。施洗約翰指著耶穌說「神的羔羊，除去世人罪孽的」（約 1:29），用的是同一個字。ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν 是現在式：他過去、現在都沒有罪，所以他能替人背罪。<strong>異文：</strong>RP 在 ἁμαρτίας 後加 ἡμῶν（我們的），WH、NA28 沒有；意思沒有大差別。</p>","exp":"<p>「凡犯罪的，就是違背律法；違背律法就是罪。」（3:4）這一節聽起來像在繞圈子，其實是在揭開罪的真面目。</p><p>我們常把罪想成小事：一句謊話、一點脾氣、一次放縱。約翰說，罪的核心不是那件事有多大，而是那件事在說甚麼：我自己作主。小孩子偷吃一顆糖，糖很小，但他心裡說的是「我不聽爸爸的」。不法，就是心裡那一句。</p><p>當時很可能有人說，懂了屬靈道理的人，身體做甚麼都無所謂。今天也有類似的聲音：「神愛我，所以這件事沒關係。」約翰不同意。罪不是無害的，因為它拒絕的是那位愛我們的神。</p><p>但約翰沒有停在指控上。下一句立刻是福音：「你們知道主曾顯現，是要除掉人的罪，在他並沒有罪」（3:5）。認識罪有多重，是為了看見主的顯現有多大。他來，不是為了觀察我們的罪，是為了把它拿走。一個自己沒有罪的人，才能替別人背罪。</p><p>所以讀這兩節，不是要我們活在罪疚裡，而是要我們換一個眼光看罪：它不是小毛病，也不是過不去的牆，它是主已經來拿走的東西。今天若有一件你一直說「沒關係」的事，可以把它叫回它真正的名字，然後交給那位來除掉罪的主。</p>"},{"a":6,"z":7,"star":1,"grk":"<p lang=\"grc\">πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.</p><p lang=\"grc\">τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·</p>","lit":"<p>凡住在他裡面的，不犯罪；凡犯罪的，沒有看見過他，也沒有認識過他。</p><p>孩子們，不要讓任何人迷惑你們。行義的人是義的，正如那一位是義的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ ἐν αὐτῷ μένων</td><td>ho en autō menōn</td><td>住在他裡面的</td><td>2:28 的命令在這裡成了身分</td></tr><tr><td>οὐχ ἁμαρτάνει</td><td>ouch hamartanei</td><td>不犯罪（現在式）</td><td>講的是生命的走向</td></tr><tr><td>ὁ ἁμαρτάνων</td><td>ho hamartanōn</td><td>犯罪的（現在分詞）</td><td>以犯罪為常態的人</td></tr><tr><td>οὐχ ἑώρακεν … οὐδὲ ἔγνωκεν</td><td>ouch heōraken … oude egnōken</td><td>沒有看見過、也沒有認識過（完成式）</td><td>自稱認識，其實沒有</td></tr><tr><td>τεκνία</td><td>teknia</td><td>小孩子們</td><td>NA28 作 παιδία；都是溫柔的稱呼</td></tr><tr><td>μηδεὶς πλανάτω ὑμᾶς</td><td>mēdeis planatō hymas</td><td>不要讓任何人迷惑你們</td><td>有人正在教別的</td></tr><tr><td>ὁ ποιῶν τὴν δικαιοσύνην</td><td>ho poiōn tēn dikaiosynēn</td><td>行義的</td><td>行為顯出身分，不製造身分</td></tr></table>","gram":"<p><strong>現在式要讀得準，也不要讀過頭。</strong>μένων、ἁμαρτάνει、ἁμαρτάνων 都是現在式，許多譯本因此譯成「不繼續犯罪」「以犯罪為常」。這個觀察有幫助：約翰說的是生命的走向，不是某一次跌倒。但光靠時態撐不住全部重量，因為約翰在 5:16 也用現在分詞說「弟兄犯了不至於死的罪」（5:16）。3:6–9 的各種讀法，留到 3:9 一併並陳。</p><p>ἑώρακεν、ἔγνωκεν 是完成式，與 1:3「所看見、所聽見的」（1:3）的見證呼應。在約翰的用法裡，「看見」與「認識」不只是知識，是相交：一個真的見過他的人，生命會被那一眼改變。</p><p>3:7 的 πλανάω（planaō，迷惑）指出處境：有人正在教「行義不重要，認識才重要」。約翰把次序擺正：ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν，行義的「是」義人，行為是果子，不是根（參 2:29）。這一句也要和 2:1 一起讀：我們的義，最後的根據是「那義者耶穌基督」（2:1）。</p>","exp":"<p>「凡住在他裡面的，就不犯罪；凡犯罪的，是未曾看見他，也未曾認識他。」（3:6）這是本章最容易讓人心慌的經文之一。讀到這裡，很多誠實的基督徒會問：那我呢？我昨天才發了脾氣。</p><p>先別急著下結論。約翰在同一封信裡說過：「我們若說自己無罪，便是自欺」（1:8），也說過：「若有人犯罪，在父那裡我們有一位中保」（2:1）。同一位作者不會在幾段之後推翻自己。所以 3:6 一定不是說基督徒從此一次也不會跌倒。</p><p>他在說方向。住在主裡面的人，生命的走向是離開罪；罪可能絆倒他，卻不再是他的家。一個人搬家以後，偶爾走錯路回到舊街口，但他不會再住在那裡。</p><p>「小子們哪，不要被人誘惑」（3:7）。當時很可能有人在教導：只要有屬靈的知識，怎樣生活都無所謂。約翰的回答很簡單：看果子。行義的才是義人。這不是叫我們拿尺去量別人，而是叫我們不要被好聽的理論騙了。</p><p>如果你讀這一節覺得難過，那份難過本身是好消息。不在乎的人不會難過。你會為罪憂傷，說明你裡面有一位叫你不安的聖靈。今天不必懷疑自己的身分，帶著那份難過回到 1:9：認罪，領受赦免，再站起來往前走。</p>"},{"a":8,"z":8,"star":1,"grk":"<p lang=\"grc\">ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.</p>","lit":"<p>行罪的是出於魔鬼，因為魔鬼從起初就一直犯罪。神的兒子為此顯明出來，為要拆毀魔鬼的作為。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐκ τοῦ διαβόλου ἐστίν</td><td>ek tou diabolou estin</td><td>是出於魔鬼的</td><td>說的是來源與歸屬</td></tr><tr><td>ἀπ’ ἀρχῆς</td><td>ap’ archēs</td><td>從起初</td><td>從伊甸園就開始</td></tr><tr><td>ἁμαρτάνει</td><td>hamartanei</td><td>犯罪（現在式）</td><td>魔鬼的罪從未停過</td></tr><tr><td>εἰς τοῦτο ἐφανερώθη</td><td>eis touto ephanerōthē</td><td>為此而顯明</td><td>道成肉身的目的</td></tr><tr><td>ὁ υἱὸς τοῦ θεοῦ</td><td>ho huios tou theou</td><td>神的兒子</td><td>與 3:1「神的兒女」相對</td></tr><tr><td>λύσῃ（λύω）</td><td>lysē (lyō)</td><td>解開、拆毀</td><td>約 2:19「拆毀」、約 11:44「解開」同字</td></tr><tr><td>τὰ ἔργα τοῦ διαβόλου</td><td>ta erga tou diabolou</td><td>魔鬼的作為</td><td>罪、謊言、殺害（約 8:44）</td></tr></table>","gram":"<p><strong>λύω（lyō）是「鬆開」。</strong>它可以指解開綁著的東西：拉撒路出來時，主說「解開，叫他走」（約 11:44）；也可以指拆毀建築：「你們拆毀這殿」（約 2:19）。兩個意思在這裡都用得上。魔鬼的作為像一座蓋了很久的建築，也像一圈一圈纏在人身上的布；神的兒子來，是要拆掉、解開。</p><p>ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει 用現在式：魔鬼從起初就犯罪，一直犯到現在。約翰福音記主的話：「他從起初是殺人的」（約 8:44），3:12 的該隱就要接上這條線。經文沒有交代魔鬼從哪裡來；約翰在意的不是魔鬼的起源，是基督的目的（詳見 〈3:8「魔鬼從起初就犯罪」——魔鬼從哪裡來？「除滅魔鬼的作為」是甚麼意思？〉）。</p><p>ἐκ τοῦ διαβόλου（出於魔鬼）的 ἐκ 指來源與歸屬，與 3:9 的 ἐκ τοῦ θεοῦ（從神生）相對。約翰把人生的走向分成兩個源頭，不是要我們給人貼標籤，是要我們看見：基督的顯現已經決定了這場對比的結局。</p>","exp":"<p>「犯罪的是屬魔鬼，因為魔鬼從起初就犯罪。神的兒子顯現出來，為要除滅魔鬼的作為。」（3:8）前半節很重，後半節很亮。約翰讓我們先看見黑暗有多深，再看見光有多強。</p><p>「屬魔鬼」不是一句罵人的話。約翰在說罪的源頭：罪不是中性的習慣，它有一個家譜，從起初就有。說謊、毀謗、仇恨、控告，都是那一家的手藝。我們犯罪時，其實是在替另一個主人做工。</p><p>但這一節的重心在後半：神的兒子顯現出來。他來，有一個明確的目的，「除滅」，原文是解開、拆毀。像一個人被繩子綁了很多年，習慣了，以為那就是自己的樣子；主來，一圈一圈把繩子解開。拉撒路從墳墓出來時還裹著布，主說：解開，叫他走。</p><p>這裡也帶出屬靈爭戰的分寸。我們不必把每次頭痛、每次塞車都說成魔鬼作怪，也不必活在對黑暗的恐懼裡。約翰把焦點放在基督身上：拆毀的工作是他做的，而且他已經來了。321 說「讓耶穌作王」，在這一節看得清楚：不是我們自己跟魔鬼摔角，是讓那位已經得勝的王來解開我們。</p><p>今天你身上有沒有一圈纏了很久的繩子？一個說不出口的癮，一句從小被罵到大、到今天還相信的話。把它帶到主面前，請他解開。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.</p><p lang=\"grc\">ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.</p>","lit":"<p>凡從神生的，不行罪，因為他的種存留在他裡面；他也不能犯罪，因為他是從神生的。</p><p>在這件事上，神的兒女和魔鬼的兒女就顯明了：凡不行義的，就不是出於神；不愛自己弟兄的，也是如此。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ γεγεννημένος ἐκ τοῦ θεοῦ</td><td>ho gegennēmenos ek tou theou</td><td>已經從神生的（完成式）</td><td>出生了，生命就一直在</td></tr><tr><td>ἁμαρτίαν οὐ ποιεῖ</td><td>hamartian ou poiei</td><td>不行罪</td><td>呼應 3:4 的「行罪」</td></tr><tr><td>σπέρμα αὐτοῦ</td><td>sperma autou</td><td>他的種</td><td>和合本：神的道（原文是種）</td></tr><tr><td>ἐν αὐτῷ μένει</td><td>en autō menei</td><td>存留在他裡面</td><td>種不會被收回</td></tr><tr><td>οὐ δύναται ἁμαρτάνειν</td><td>ou dynatai hamartanein</td><td>不能犯罪（現在不定詞）</td><td>不能以罪為生，不是不會跌倒</td></tr><tr><td>ὅτι ἐκ τοῦ θεοῦ γεγέννηται</td><td>hoti ek tou theou gegennētai</td><td>因為他是從神生的</td><td>理由在出生，不在表現</td></tr><tr><td>φανερά ἐστιν</td><td>phanera estin</td><td>是顯明的</td><td>果子把根顯出來</td></tr><tr><td>ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν</td><td>ho mē agapōn ton adelphon</td><td>不愛弟兄的</td><td>從「義」轉到「愛」的橋</td></tr></table>","gram":"<p><strong>σπέρμα（sperma，種）是甚麼？</strong>有人說是神的道（和合本採此，並註「原文是種」），有人說是聖靈，有人說是新生命本身。三者不必互相排斥：神藉著道、藉著聖靈，把他的生命種在人裡面。重點是 μένει：這種存留在裡面，不會被收回。</p><p><strong>「不能犯罪」怎樣與 1:8–10 並存？各家四讀：</strong></p><ol><li>現在式持續說：οὐ δύναται ἁμαρτάνειν 是現在不定詞，意思是不能持續活在罪中。難處：5:16 也用現在式講弟兄犯罪；單靠時態，撐不起全部的分別。</li><li>兩種罪說：這裡的罪專指 3:4 所說的不法，或至於死的罪（5:16），也就是背棄基督。難處：經文用的是一般的「罪」字；講不好，會把罪分成可以容忍與不可以兩類。</li><li>身分與方向說：約翰在說新生命的本性與走向；從神生的人，罪不再是他的本性與家。難處：若只講本性，容易變成一句理想，失去對生活的催逼。</li><li>針對假教師說：當時有人自稱認識神卻輕看罪，約翰說的是他們；1:8 則是對自稱無罪的人說的。難處：對手的面貌只能重建，而且經文不能只拿來量別人。</li></ol><blockquote>本講義以第三讀為主，吸收第一、第四讀的亮光：從神生的人，方向是不犯罪；跌倒的時候，「在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。3:9 講種的力量，2:1 講中保的恩典，兩節要一起讀。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉；本章詳見 〈3:6、9「凡從神生的，就不犯罪」——各家怎樣解？〉。</blockquote>","exp":"<p>「凡從神生的，就不犯罪，因神的道（原文是種）存在他心裡；他也不能犯罪，因為他是由神生的。」（3:9）這是全章最難的一節，也最常被用錯。</p><p>它被用錯的方式是這樣：一個認真的信徒又跌倒了，晚上讀到「不能犯罪」，心就沉下去，懷疑自己是不是根本沒有被神生過。約翰寫這節，不是為了製造這種夜晚。他在信的前面說，寫信是「要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。3:9 講方向，2:1 講跌倒時的出路。只讀一節，就會失衡。</p><p>種的比喻很美。一顆種子落在地裡，剛發芽時看不出甚麼，會被風吹歪，會被蟲咬；但它不會長成荊棘，因為種決定了它是甚麼。神把他的生命種在你裡面，這生命會往光長。偶爾被風吹倒，不改變它是哪一種植物。</p><p>接著約翰說：「從此就顯出誰是神的兒女，誰是魔鬼的兒女。」（3:10）這句話很強，但要讀清楚它的用途。約翰不是發給我們一張名單，讓我們去分誰屬哪一家。他給的標準是果子：行義、愛弟兄。而且他立刻把「愛」放進來，這一章從這裡轉向彼此相愛。</p><p>所以，若你為自己的罪難過，不要用 3:9 打自己。用 3:9 盼望：種還在。用 2:1 回家：中保還在。今天跌倒了，就今天回到父那裡。</p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·</p><p lang=\"grc\">οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.</p>","lit":"<p>因為這就是你們從起初所聽見的信息：我們要彼此相愛。</p><p>不要像該隱那樣，他是出於那惡者，宰殺了他的兄弟。他為甚麼宰殺他呢？因為他自己的作為是惡的，他兄弟的作為卻是義的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ ἀγγελία</td><td>hē angelia</td><td>信息</td><td>1:5「神就是光」也是這個字</td></tr><tr><td>ἀπ’ ἀρχῆς</td><td>ap’ archēs</td><td>從起初</td><td>從他們信主那天就聽過</td></tr><tr><td>ἵνα ἀγαπῶμεν ἀλλήλους</td><td>hina agapōmen allēlous</td><td>要我們彼此相愛</td><td>約 13:34 主的新命令</td></tr><tr><td>οὐ καθὼς Κάϊν</td><td>ou kathōs Kain</td><td>不要像該隱</td><td>全卷唯一點名的舊約人物</td></tr><tr><td>ἐκ τοῦ πονηροῦ</td><td>ek tou ponērou</td><td>出於那惡者</td><td>與「從神生」相對</td></tr><tr><td>ἔσφαξεν</td><td>esphaxen</td><td>宰殺</td><td>祭壇上的字；啟示錄用來說羔羊被殺</td></tr><tr><td>χάριν τίνος</td><td>charin tinos</td><td>為了甚麼緣故</td><td>約翰停下來問原因</td></tr><tr><td>τὰ ἔργα … πονηρὰ … δίκαια</td><td>ta erga … ponēra … dikaia</td><td>作為是惡的……義的</td><td>恨的根常是嫉妒</td></tr></table>","gram":"<p><strong>σφάζω（sphazō）是屠宰的字。</strong>新約除了這裡，只出現在啟示錄，其中好幾處說的是羔羊「像是被殺過的」（啟 5:6）。約翰用祭壇上的字說該隱：他把兄弟當牲畜一樣宰了。兩個畫面放在一起很驚人：該隱殺了義人；神的羔羊被殺，為要救殺人的人。</p><p>創世記沒有直接說該隱為甚麼殺人，只記神事先警告他：「罪就伏在門前。它必戀慕你，你卻要制伏它。」（創 4:7）約翰給了答案：χάριν τίνος，為了甚麼？因為自己的作為惡，兄弟的作為義。希伯來書也說亞伯是「因著信，獻祭與神，比該隱所獻的更美」（來 11:4）。恨，常常從比較開始：別人的光照出了我的暗。</p><p>3:11 的 ἀγγελία（angelia）在新約只見於約翰一書兩處：第一個信息是「神就是光」（1:5），第二個是彼此相愛。光與愛兩條線，在這裡會合。創世記第 4 章怎樣讀，見 〈3:12 該隱「屬那惡者」——創世記第 4 章怎樣讀？〉。</p>","exp":"<p>〔舊約〕創 4:8（創世記講義第 4 章）</p><p>「我們應當彼此相愛。這就是你們從起初所聽見的命令。」（3:11）約翰從「義」轉到「愛」，然後舉了全聖經第一對兄弟的故事，一個最壞的例子。</p><p>「不可像該隱；他是屬那惡者，殺了他的兄弟。」（3:12）這是全章的最低點。創世記講義第 4 章讀過那一幕：「該隱起來打他兄弟亞伯，把他殺了」（創 4:8）。人類第一個家庭，第一對兄弟，第一次流血。罪從伊甸園出來，第一個落腳處就在兄弟之間。</p><p>為甚麼？約翰問了，也答了：因為兄弟的行為是善的。該隱不是被亞伯傷害，是被亞伯的好刺痛。嫉妒就是這樣：別人的好照出了我的不好，我不肯改自己，就想除掉那道光。教會裡、家裡、同事之間，這個故事每天都在小規模地重演：不一定動刀，可能是一句冷話、一個故意不轉達的消息、一次背後的搖頭。</p><p>神曾經警告該隱：罪伏在門前，你要制伏它。那時門還開著。今天也是。如果你發現自己看見某個人做得好就不舒服，那是門前的警告，不是定罪。把那份不舒服向神承認，也許為那個人禱告一次，求神祝福他。這樣，嫉妒就失去了它的刀。</p>"},{"a":13,"z":15,"star":1,"grk":"<p lang=\"grc\">μὴ θαυμάζετε, ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.</p><p lang=\"grc\">ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ἀγαπῶν μένει ἐν τῷ θανάτῳ.</p><p lang=\"grc\">πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν αὐτῷ μένουσαν.</p>","lit":"<p>弟兄們，世界若恨你們，不要驚奇。</p><p>我們知道我們已經從死裡越過，進入生命，因為我們愛弟兄們。不愛的，仍住在死中。</p><p>凡恨他弟兄的，就是殺人者；你們也知道，凡殺人者，沒有永生存留在他裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ θαυμάζετε</td><td>mē thaumazete</td><td>不要驚奇</td><td>恨是預料中的</td></tr><tr><td>μισεῖ ὑμᾶς ὁ κόσμος</td><td>misei hymas ho kosmos</td><td>世界恨你們</td><td>約 15:18 主先說過</td></tr><tr><td>μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν</td><td>metabebēkamen ek tou thanatou eis tēn zōēn</td><td>我們已經從死越過進入生命（完成式）</td><td>搬過去，就住在那邊；約 5:24 同一句</td></tr><tr><td>ὅτι ἀγαπῶμεν</td><td>hoti agapōmen</td><td>因為我們愛</td><td>愛是證據，不是門票</td></tr><tr><td>μένει ἐν τῷ θανάτῳ</td><td>menei en tō thanatō</td><td>仍住在死中</td><td>「住」字的反面</td></tr><tr><td>ἀνθρωποκτόνος</td><td>anthrōpoktonos</td><td>殺人者（人＋殺）</td><td>新約只用於魔鬼（約 8:44）與這裡</td></tr><tr><td>ζωὴν αἰώνιον … μένουσαν</td><td>zōēn aiōnion … menousan</td><td>永生存留</td><td>恨與永生不住在同一個屋子</td></tr></table>","gram":"<p><strong>μεταβεβήκαμεν（metabebēkamen）是完成式。</strong>越過去，而且留在那邊。主在約翰福音說信的人「是已經出死入生了」（約 5:24），用的是同一個動詞。ὅτι ἀγαπῶμεν 說明我們怎樣「知道」：愛是出死入生的證據，不是原因。</p><p><strong>恨與殺人。</strong>ἀνθρωποκτόνος（anthrōpoktonos）在新約只出現在這裡，和主論魔鬼的話：「他從起初是殺人的」（約 8:44）。「恨就是殺人」怎樣理解？</p><ul><li>等罪說：在神眼中恨與殺人同罪。難處：人間的法律與後果明顯不同，講成完全相等，會失去分寸。</li><li>根源說：恨是殺人的種子，只是還沒長大（參太 5:21–22）。難處：削弱了約翰「就是」的力道。</li><li>本質說：恨是心裡希望對方不存在，這正是殺人的本質。難處：必須分清楚恨與怒氣。</li></ul><blockquote>本講義取根源說與本質說：ὁ μισῶν 是現在分詞，指一種定住的心志，不是一陣的怒氣；聖經也說「生氣卻不要犯罪」（弗 4:26）。受害者對加害者的憤怒，不等於這裡的恨；把它交給神，就不必住在裡面。詳見 〈3:15「凡恨他弟兄的，就是殺人的」——心裡的怒氣也是罪嗎？〉。</blockquote>","exp":"<p>〔約〕約 5:24（約翰福音講義第 5 章）</p><p>「弟兄們，世人若恨你們，不要以為希奇。」（3:13）約翰剛講完該隱，就轉向讀者：你們會遇到該隱式的恨，不要驚訝。主早說過：「世人若恨你們，你們知道，恨你們以先已經恨我了」（約 15:18）。</p><p>然後是一句確據：「我們因為愛弟兄，就曉得是已經出死入生了。」（3:14）注意次序。不是我們愛弟兄、所以得以出死入生；是因為愛弟兄，就曉得了。愛不是買生命的門票，是生命已經進來的記號。像一個剛做完心臟手術的人，摸到自己規律的脈搏，就知道手術成功了。脈搏不是手術，是手術的證據。</p><p>接著約翰說了一句很重的話：「凡恨他弟兄的，就是殺人的」（3:15）。主耶穌在山上也說過，向弟兄動怒、罵弟兄，都在審斷之下。殺人不是從刀開始的，是從心裡那句「他最好不存在」開始的。</p><p>這不是要叫每一個曾經生氣的人害怕。約翰說的是住在恨裡，把恨當成家。被傷害的人心裡有憤怒，那是傷口在說話，可以帶到神面前，不必假裝沒有。危險的是讓它住下來，長成一個願望。</p><p>今天可以問自己：有沒有一個名字，我一想到就希望他消失？不必馬上解決，先承認它。告訴神：這份恨太重，我背不動。出死入生的人，不必再住在死的屋子裡。</p>"},{"a":16,"z":16,"star":3,"grk":"<p lang=\"grc\">ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς θεῖναι.</p>","lit":"<p>在這件事上我們認識了愛：那一位為我們放下了他的性命；我們也應當為弟兄們放下性命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην</td><td>en toutō egnōkamen tēn agapēn</td><td>在此我們已經認識了愛（完成式）</td><td>愛有了一個定義</td></tr><tr><td>ἐκεῖνος</td><td>ekeinos</td><td>那一位</td><td>不必說名字，大家都知道是誰</td></tr><tr><td>ὑπὲρ ἡμῶν</td><td>hyper hēmōn</td><td>為了我們</td><td>替代，也是益處</td></tr><tr><td>τὴν ψυχὴν αὐτοῦ ἔθηκεν</td><td>tēn psychēn autou ethēken</td><td>把他的性命放下</td><td>約 10:11 好牧人為羊捨命</td></tr><tr><td>τίθημι</td><td>tithēmi</td><td>放下</td><td>約 13:4 洗腳前「脫了衣服」也是這字</td></tr><tr><td>ὀφείλομεν</td><td>opheilomen</td><td>我們欠、應當</td><td>回應，不是門檻</td></tr><tr><td>ὑπὲρ τῶν ἀδελφῶν</td><td>hyper tōn adelphōn</td><td>為了弟兄們</td><td>為對方真正的益處</td></tr></table>","gram":"<p><strong>τὴν ψυχὴν τιθέναι（tēn psychēn tithenai）是約翰特有的說法。</strong>字面是「把性命放下」，像把衣服脫下放在一邊。好牧人「為羊捨命」（約 10:11），主說「沒有人奪我的命去，是我自己捨的」（約 10:18）；洗門徒的腳以前，他「脫了衣服」（約 13:4），用的也是這個動詞。捨命是主動的，是愛的選擇，不是被逼的結果。</p><p>ἐγνώκαμεν 是完成式：我們已經認識了，而且一直知道。約翰不用抽象的定義講愛，他指著十字架說：那就是。ὑπέρ（hyper）「為了」帶著替代與益處兩層意思。</p><p>ὀφείλομεν（opheilomen）原是「欠債」。這不是叫人去償還十字架，那是還不起的；是被愛的人覺得自己欠了愛。4:11 用同一個字：「神既是這樣愛我們，我們也當彼此相愛」（4:11）。<strong>異文：</strong>θεῖναι（WH、NA28）與 τιθέναι（RP）只是時態的分別，意思不變。</p>","exp":"<p>〔約〕約 15:13（約翰福音講義第 15 章）</p><p>「主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命。」（3:16）若要從整卷約翰一書選出說明愛的經文，這一節和 4:10 是兩根柱子。約翰不給愛下一個哲學定義，他指著十字架：看，那就是。</p><p>約翰福音講義第 15 章讀過主的話：「人為朋友捨命，人的愛心沒有比這個大的」（約 15:13）。約翰那晚就在主身邊，聽見這句話；第二天，他站在十字架下，看見這句話成了真的。幾十年後他寫信，還是從那一幕開始講愛。</p><p>我們也當為弟兄捨命。大多數人一生不會被要求真的替人去死。但捨命可以一點一點地捨：捨一個晚上，陪一個剛失業的弟兄；捨一份面子，先去道歉；捨一筆錢，讓別人的孩子能交學費。下一節，約翰自己就把捨命落到錢包上。</p><p>這裡要說清楚一件事。為弟兄捨命，是為了對方真正的好。它不是叫一個被打、被欺負、被控制的人留在危險裡，說「我要像主一樣捨命」。主捨命是為了救人脫離罪，不是為了讓罪繼續傷人。如果你正在一段不安全的關係裡，愛的第一步可能是離開危險，向可信的人和相關機構求助；涉及暴力，應當報警。原諒可以交給神，和好需要對方真實的悔改與安全。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉；本章詳見 〈3:16「我們也當為弟兄捨命」——要為傷害我的人捨命嗎？愛有沒有界線？〉。</p><p>321 說「耶穌是我的榜樣」，在這一節最清楚：他先捨，我們才學著捨。今天你可以放下甚麼，讓一個人得益處？</p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;</p><p lang=\"grc\">Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.</p>","lit":"<p>但凡擁有這世界的生計，看見他的弟兄有缺乏，卻向他關閉自己心腸的，神的愛怎能存留在他裡面呢？</p><p>孩子們，我們相愛，不要用言語，也不要用舌頭，而要在行為和真實裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸν βίον τοῦ κόσμου</td><td>ton bion tou kosmou</td><td>這世界的生計</td><td>2:16「今生的驕傲」同一個 βίος</td></tr><tr><td>θεωρῇ</td><td>theōrē</td><td>注視、看見</td><td>不是瞄一眼，是看清楚了</td></tr><tr><td>χρείαν ἔχοντα</td><td>chreian echonta</td><td>有需要的</td><td>具體的缺乏</td></tr><tr><td>κλείσῃ τὰ σπλάγχνα</td><td>kleisē ta splanchna</td><td>關上心腸</td><td>門關起來的動作</td></tr><tr><td>σπλάγχνα</td><td>splanchna</td><td>內臟、心腸</td><td>憐憫在腹中翻動；路 15:20 父親「動了慈心」</td></tr><tr><td>ἡ ἀγάπη τοῦ θεοῦ</td><td>hē agapē tou theou</td><td>神的愛</td><td>可指神的愛，也可指對神的愛</td></tr><tr><td>λόγῳ μηδὲ τῇ γλώσσῃ</td><td>logō mēde tē glōssē</td><td>用言語、用舌頭</td><td>只停在嘴上</td></tr><tr><td>ἐν ἔργῳ καὶ ἀληθείᾳ</td><td>en ergō kai alētheia</td><td>在行為和真實裡</td><td>做出來，也不說假</td></tr></table>","gram":"<p><strong>σπλάγχνα（splanchna）是腹中的臟腑。</strong>古人覺得深的感情在腹中翻動，所以這個字成了「憐憫」。浪子回家時，父親「動了慈心」（路 15:20），用的是同字根的動詞。κλείσῃ（kleisē）是「關上」：憐憫本來會動，人卻把門關了。約翰說的不是看不見，是 θεωρῇ（theōrē）：看清楚了，然後關門。</p><p>βίος（bios）是生計、過日子要用的東西，「今生的驕傲」（2:16）就是這個字。同一份財物，可以成為驕傲，也可以成為憐恤。ἡ ἀγάπη τοῦ θεοῦ 的屬格可以讀成對神的愛（和合本作「愛神的心」（3:17）），也可以讀成神的愛；約翰的意思大概兩者都有：神的愛住在人裡面，就會流向人。財物怎樣對待窮乏的弟兄，見 〈3:17「看見弟兄窮乏」——基督徒的財物要怎樣對待窮乏的弟兄？〉。</p><p><strong>ἀλήθεια（alētheia）不只是「真心」。</strong>「在行為和誠實上」（3:18）的誠實，是在真實裡：愛不說假話。所以誠實的愛有時包括說出真相、說「不」、設下界線。愛要實際，也要真實；兩個字一起，才是約翰說的愛（參 〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉）。<strong>異文：</strong>RP 在 Τεκνία 後加 μου，意思不變。</p>","exp":"<p>「凡有世上財物的，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能存在他裡面呢？」（3:17）上一節講捨命，這一節講錢包。約翰知道，很多人說願意為主死，卻不願意為弟兄少吃一頓館子。</p><p>注意約翰沒有說看不見。他說看見了，然後塞住。憐恤的心本來會動，是我們自己把門關上的。關門的理由很多：他會不會亂花？我自己也不寬裕。下次再說。約翰沒有說每一個請求都要答應，也沒有說要把自己的家掏空；但他問了一個閃躲不了的問題：神的愛真的住在一個對窮乏關門的人裡面嗎？</p><p>「小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。」（3:18）愛有兩塊試金石。一塊是行為：不只說「我為你禱告」，也送一袋米去。雅各書問過同樣的問題：只說「平平安安地去吧」（雅 2:16），卻不給身體所需用的，有甚麼益處？另一塊是誠實：愛不演戲。誠實的愛有時是說真話：告訴一個朋友他正在傷害自己，告訴一個不斷越界的人「這樣不行」。不說真相的愛，常常只是怕衝突。</p><p>321 在末端可以認出 920 的樣子：對身邊那一個人，用行為和誠實去愛。今天想一個名字。他缺甚麼？你能做的一件具體的事是甚麼？還有，你是不是欠他一句真話？</p>"},{"a":19,"z":20,"star":2,"grk":"<p lang=\"grc\">ἐν τούτῳ γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν τὴν καρδίαν ἡμῶν</p><p lang=\"grc\">ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.</p>","lit":"<p>在這件事上，我們將知道我們是出於真理的，並且在他面前，我們要安撫我們的心——</p><p>就是無論我們的心在甚麼事上定我們的罪；因為神比我們的心大，他知道一切。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐκ τῆς ἀληθείας ἐσμέν</td><td>ek tēs alētheias esmen</td><td>我們是出於真理的</td><td>接回 3:18 的「誠實」</td></tr><tr><td>ἔμπροσθεν αὐτοῦ</td><td>emprosthen autou</td><td>在他面前</td><td>安穩的地方是神面前，不是人面前</td></tr><tr><td>πείσομεν τὴν καρδίαν</td><td>peisomen tēn kardian</td><td>我們要說服（安撫）我們的心</td><td>對自己的心說話</td></tr><tr><td>ὅτι ἐάν … ὅτι</td><td>hoti ean … hoti</td><td>兩個 ὅτι</td><td>第一個可讀作 ὅ τι ἐάν「無論甚麼」</td></tr><tr><td>καταγινώσκω</td><td>kataginōskō</td><td>知道不利於人的事、定罪</td><td>心像一個控告者</td></tr><tr><td>μείζων ἐστὶν ὁ θεός</td><td>meizōn estin ho theos</td><td>神是更大的</td><td>比我們的心大</td></tr><tr><td>γινώσκει πάντα</td><td>ginōskei panta</td><td>他知道一切</td><td>知道罪，也知道愛（約 21:17）</td></tr></table>","gram":"<p><strong>句法很難。</strong>3:19–20 連用兩個 ὅτι（hoti），第一個可以斷成 ὅ τι ἐάν（ho ti ean，「無論在甚麼事上」）。πείσομεν（peisomen）是「說服、安撫」，與 καταγινώσκω（kataginōskō，字面「知道不利的事」，即定罪）相對：心在控告，我們在神面前回應它。<strong>異文：</strong>3:19 開頭 Treg、NA28、RP 多一個 καί；RP 作 γινώσκομεν（現在式）；意思不受影響。</p><p><strong>「神比我們的心大」有兩種讀法：</strong></p><ul><li>警告讀：連我們的心都定我們的罪，神比我們的心更大、更知道，必定得更重。古來有人這樣讀。難處：與上文的「安穩」（3:19）和下文的「坦然無懼」（3:21）不合；約翰要說服的心，是被安撫，不是被嚇。</li><li>安慰讀：心會控告，但最後判斷的不是我們的心，是神；他知道一切，包括我們的罪，也包括我們對他的愛。今天多數註釋家採此。難處：若講得太快，會被拿來安撫一個刻意不悔改的良心。</li></ul><blockquote>本講義採安慰讀。安慰的對象是「屬真理的」（3:19）人，就是在行為和誠實上回應愛的人。神知道一切，彼得也是靠這句話站住的：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）詳見 〈3:20「神比我們的心大」——心一直責備自己的人，怎樣在神面前安穩？〉。</blockquote>","exp":"<p>「我們的心若責備我們，神比我們的心大，一切事沒有不知道的。」（3:20）這是本章第二個高點，是寫給失眠的人的經文。</p><p>有些人的心像一個從不下班的檢察官。做錯一件事，可以在心裡審自己十年。別人早忘了，自己還在重播。這樣的人讀到「凡從神生的，就不犯罪」（3:9），最先受傷；讀到愛要在行為上，最先覺得自己不夠。約翰知道會眾裡有這樣的人，所以他在這裡停下來，對他們的心說話。</p><p>他說：「從此就知道我們是屬真理的，並且我們的心在神面前可以安穩」（3:19）。「安穩」原文是說服、安撫。你的心在控告你，你可以在神面前回答它。怎麼回答？不是說「我其實沒那麼壞」，而是說：神比你大。</p><p>神比我們的心大，因為他知道一切。這句話對驕傲的人是警告，對被控告的人是安慰：他知道我的罪，比我的心知道得更清楚；他也知道我的愛，知道我在黑夜裡的眼淚，知道我想回頭的那份心。彼得三次不認主之後，在加利利海邊只能說：主啊，你是無所不知的，你知道我愛你。他不能拿自己的表現作證，只能拿主的知道作證。</p><p>321 說「用心靠聖靈」：用心，是不逃避良心的聲音；靠聖靈，是讓那位比我們的心更大的神說最後一句話。今晚若心又開始審你，可以把它帶到主面前，說：你知道一切。然後安心睡覺。</p>"},{"a":21,"z":24,"star":1,"grk":"<p lang=\"grc\">ἀγαπητοί, ἐὰν ἡ καρδία μὴ καταγινώσκῃ ἡμῶν, παρρησίαν ἔχομεν πρὸς τὸν θεόν,</p><p lang=\"grc\">καὶ ὃ ἐὰν αἰτῶμεν λαμβάνομεν ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.</p><p lang=\"grc\">καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ἡμῖν.</p><p lang=\"grc\">καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.</p>","lit":"<p>親愛的，如果我們的心不定我們的罪，我們就向神有坦然的膽量；</p><p>並且我們無論求甚麼，就從他那裡得著，因為我們遵守他的命令，又行在他面前蒙喜悅的事。</p><p>這就是他的命令：要我們信他兒子耶穌基督的名，並且彼此相愛，正如他給了我們命令。</p><p>遵守他命令的，就住在他裡面，他也住在這人裡面。在這件事上我們知道他住在我們裡面，是從他所賜給我們的那靈。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παρρησία</td><td>parrēsia</td><td>坦然、放膽說話</td><td>孩子對父親說話不必先排練</td></tr><tr><td>ὃ ἐὰν αἰτῶμεν λαμβάνομεν</td><td>ho ean aitōmen lambanomen</td><td>無論求甚麼，就得著</td><td>兒女照父的心意求（5:14）</td></tr><tr><td>τὰ ἀρεστὰ ἐνώπιον αὐτοῦ</td><td>ta aresta enōpion autou</td><td>在他面前蒙喜悅的事</td><td>約 8:29 主常做父所喜悅的事</td></tr><tr><td>ἡ ἐντολὴ αὐτοῦ</td><td>hē entolē autou</td><td>他的命令（單數）</td><td>信與愛是一條命令</td></tr><tr><td>πιστεύσωμεν τῷ ὀνόματι</td><td>pisteusōmen tō onomati</td><td>信他的名</td><td>本卷第一次出現「信」</td></tr><tr><td>ἀγαπῶμεν ἀλλήλους</td><td>agapōmen allēlous</td><td>彼此相愛</td><td>信的人自然會愛</td></tr><tr><td>ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ</td><td>en autō menei kai autos en autō</td><td>他住在神裡，神住在他裡</td><td>互相的「住」</td></tr><tr><td>ἐκ τοῦ πνεύματος</td><td>ek tou pneumatos</td><td>從那靈</td><td>本卷第一次明說聖靈</td></tr></table>","gram":"<p><strong>παρρησία（parrēsia）原是公民在議會裡放膽說話的權利。</strong>約翰一書用了四次：主再來時的坦然（2:28；4:17），禱告時的坦然（3:21；5:14）。它是兒女的特徵：孩子進父親的書房，不必先排隊、先排練。</p><p>3:22 的 ὅτι（因為）容易被讀成功德：因為我們守命令，所以禱告蒙應允。但約翰的邏輯是關係：一個住在父心意裡的孩子，所求的漸漸就是父所喜悅的。主說他「常做他所喜悅的事」（約 8:29），是同一個說法。5:14 會補上條件：「若照他的旨意求甚麼，他就聽我們」（5:14）。所以這不是一張可以隨意兌現的支票。</p><p>3:23 的 ἐντολή 是單數：信和愛是同一條命令的兩面。πιστεύσωμεν 是本卷第一次出現「信」，配上「名」字，表示信靠他這個人。3:24 是本卷第一次明說聖靈，接下來 4:1–6 就要講試驗諸靈。<strong>異文：</strong>3:21「我們的」各本位置不同；3:23 Treg 作現在式 πιστεύωμεν；意思都不受影響。</p>","exp":"<p>「親愛的弟兄啊，我們的心若不責備我們，就可以向神坦然無懼了。」（3:21）上一段是給心在控告的人，這一段是給心已經安靜下來的人。被神安撫過的心，可以抬起頭來向神說話。</p><p>坦然無懼是孩子的樣子。一個在家裡被愛的孩子，衝進父親的書房說「爸，我要……」，不會先寫一份報告。約翰說，禱告可以是這樣的。</p><p>「並且我們一切所求的，就從他得著」（3:22）。這句話常被拿來教人只要信，就要甚麼有甚麼。但約翰說的是一個住在父心意裡的孩子：他遵守父的命令，所以他求的漸漸變成父想給的。這使我們想起主在客西馬尼園的禱告，最後是照父的意思；最深的禱告，是學會要父所要的。禱告不是遙控器，是關係。</p><p>然後約翰把所有命令收成一句：「神的命令就是叫我們信他兒子耶穌基督的名，且照他所賜給我們的命令彼此相愛。」（3:23）信與愛，一條命令。信是向上抓住他，愛是向外流出去。只信不愛，信是乾的；只愛不信，愛會枯。</p><p>最後一節第一次提到聖靈：「我們所以知道神住在我們裡面是因他所賜給我們的聖靈」（3:24）。確據不是靠自己的感覺，也不是靠自己的表現，是靠那位住進來的靈。321 說「聖靈是我的引導」，在這裡認得出來。今天禱告時，不必先把自己整理好才開口；像孩子一樣說吧，那位在你裡面的靈會幫你。</p>"}],"4":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.</p>","lit":"<p>親愛的，不要每一個靈都信，倒要試驗那些靈是否出於神，因為許多假先知已經出去，進到世界裡了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>蒙愛的人</td><td>本章第一個字就屬於「愛」字群</td></tr><tr><td>μὴ παντὶ πνεύματι πιστεύετε</td><td>mē panti pneumati pisteuete</td><td>不要每一個靈都信</td><td>現在式命令：不要一聽就信</td></tr><tr><td>δοκιμάζετε</td><td>dokimazete</td><td>你們要試驗</td><td>驗金屬、驗錢幣的字；為了認可而試</td></tr><tr><td>τὰ πνεύματα</td><td>ta pneumata</td><td>那些靈</td><td>每一句屬靈的話背後都有一個源頭</td></tr><tr><td>ψευδοπροφῆται</td><td>pseudoprophētai</td><td>假先知</td><td>自稱替神說話，其實不是</td></tr><tr><td>ἐξεληλύθασιν εἰς τὸν κόσμον</td><td>exelēlythasin eis ton kosmon</td><td>已經出去，進入世界</td><td>完成式；叫人想起 2:19 的「出去」</td></tr></table>","gram":"<p><strong>「試驗」是為了認可，不是為了定罪。</strong>δοκιμάζω（dokimazō）原是驗金屬、驗錢幣的字：把金子放進火裡，看它是不是真金。保羅說「但要凡事察驗」（帖前 5:21），用的是同一個字。這個字的方向是正面的：試驗的目的是找出可以持守的，不是找出可以攻擊的人。現在式命令 πιστεύετε／δοκιμάζετε 表示這是持續的習慣：每一次聽見有人說「神告訴我」，都要試。</p><p><strong>「靈」為甚麼是複數？</strong>約翰說 τὰ πνεύματα（ta pneumata）「那些靈」。一說指在發言者背後運行的屬靈源頭（4:6 的真理的靈與謬妄的靈）；一說指先知說話時所宣稱的「靈感」，也就是每一個自稱受感的發言。兩說並不衝突：約翰關心的是，一句話的源頭是不是神。ψευδοπροφῆται（pseudoprophētai）「假先知」與 2:18–19 的敵基督者是同一批人；ἐξεληλύθασιν（exelēlythasin）的完成式，叫人想起他們「從我們中間出去」（2:19）。分辨的整體處理，本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉；靈恩與先知恩賜的問題見 〈4:1「試驗那些靈」——怎樣分辨？靈恩、預言與先知恩賜怎麼看？〉。</p>","exp":"<p>「親愛的弟兄啊，一切的靈，你們不可都信」（4:1）。約翰剛在 3:24 說到神「所賜給我們的聖靈」（3:24），馬上加一句提醒：不是每一個說自己有靈的，都出於神。愛不等於天真。被神愛的人，可以有一顆分辨的心。</p><p>當時的教會剛經歷一場分裂。有一些人從他們中間出去了，帶著一套「更高的屬靈知識」，說自己有靈感、有啟示。留下來的弟兄姊妹開始不安：他們說得那麼屬靈，會不會是我們錯了？約翰沒有叫他們害怕，也沒有叫他們甚麼都不信；他叫他們「試驗」。</p><p>試驗這個字，是銀匠驗銀子用的。銀匠不是為了燒掉銀子，是為了認出真銀子。分辨的目的，是認出神的聲音，好好持守；不是找人來貼標籤。約翰在一世紀就說「如今是末時了」（2:18），每一代教會都要試驗，不需要算日子，也不需要在新聞裡找誰是假先知。</p><p>今天的我們也常聽見「神告訴我」。也許是講台上的一句預言，也許是網路上的一段短片，也許是一位熱心的朋友說「主給我一句話要給你」。不必一律拒絕，也不必照單全收。先停一下，帶著這句話回到經文，回到耶穌。聖靈的引導不會和聖經作對；聖經是準則，聖靈是引導，在真正的屬靈生命裡，這兩樣指向同一個方向。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ἐν τούτῳ γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,</p><p lang=\"grc\">καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ τὸν Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.</p>","lit":"<p>在這件事上你們認識神的靈：凡承認耶穌基督是在肉身中已經來了的靈，是出於神的；</p><p>凡不承認那位耶穌的靈，就不是出於神；這是那敵基督者的〔靈〕，你們聽過他要來，現在已經在世界上了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τούτῳ γινώσκετε</td><td>en toutō ginōskete</td><td>在這件事上你們認識</td><td>可讀直說語氣，也可讀命令語氣</td></tr><tr><td>ὁμολογεῖ</td><td>homologei</td><td>承認、說一樣的話</td><td>1:9「認罪」也是這個字</td></tr><tr><td>Ἰησοῦν Χριστὸν</td><td>Iēsoun Christon</td><td>耶穌基督</td><td>歷史上的耶穌就是基督，不可拆開</td></tr><tr><td>ἐν σαρκὶ ἐληλυθότα</td><td>en sarki elēlythota</td><td>在肉身中已經來了的</td><td>完成式分詞：來了，而且一直是</td></tr><tr><td>μὴ ὁμολογεῖ τὸν Ἰησοῦν</td><td>mē homologei ton Iēsoun</td><td>不承認那位耶穌</td><td>冠詞指回剛剛那位成了肉身的耶穌</td></tr><tr><td>τὸ τοῦ ἀντιχρίστου</td><td>to tou antichristou</td><td>那敵基督者的</td><td>省略了「靈」字</td></tr><tr><td>νῦν … ἤδη</td><td>nyn … ēdē</td><td>現在……已經</td><td>不是遙遠的將來，是眼前的事</td></tr></table>","gram":"<p><strong>標準是基督論。</strong>約翰給的試金石不是異能、不是感動有多強、不是講員有多出名，而是一句宣認：ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα（homologei Iēsoun Christon en sarki elēlythota）。ἐληλυθότα 是完成式分詞，不只說他曾經來過，更說他來了、至今仍是那位取了肉身的主。照教會的傳統，當時有一類錯誤（相傳與克林妥有關）把「屬天的基督」和「人耶穌」拆開，說基督在受洗時降在耶穌身上，受難前又離開。約翰說，拆開的就不是出於神。這和約貳 1:7 的標準一致。</p><p><strong>4:3 的異文：μὴ ὁμολογεῖ 還是 λύει？</strong>SBLGNT 與 WH、Treg、NA28 作 μὴ ὁμολογεῖ τὸν Ἰησοῦν「不承認耶穌」；RP 代表的拜占庭傳統少了冠詞，並補上 Χριστὸν ἐν σαρκὶ ἐληλυθότα，與 4:2 對齊。另有一個讀法 λύει τὸν Ἰησοῦν「分解耶穌」，SBLGNT 附錄裡看不到，因為它幾乎沒有希臘文抄本的支持（只見於個別抄本的旁註），主要來自早期教父的引用（例如愛任紐著作的拉丁譯本、俄利根）和拉丁傳統（武加大譯本作 solvit）。</p><blockquote>判斷：外證強烈支持 μὴ ὁμολογεῖ，和合本「不認耶穌」也照這個讀法。λύει 雖不是原文，卻準確說出了錯誤的性質：把耶穌拆成兩半。詳見 〈4:3 是「不認耶穌」還是「分解耶穌」？〉；本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。</blockquote>","exp":"<p>「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）。約翰給的標準很短，短到可以寫在手心上。他沒有說：看誰的異能大，看誰的聚會人多，看誰說話讓你最感動。他說：看他怎樣講耶穌。</p><p>那些離開的人並不是不談耶穌。他們談得很多，只是他們的耶穌沒有真正的身體、沒有真正的十字架。對他們來說，肉身太粗糙，配不上屬靈的神。約翰卻一開卷就說，生命之道是我們「親手摸過的」（1:1）。神的兒子真的成了人，真的會累、會哭、會流血。拆掉肉身的耶穌，也就拆掉了十字架；拆掉了十字架，罪人就沒有地方可去了。</p><p>「這是那敵基督者的靈」（4:3），這句話很重，但約翰的用法很清楚：他講的是一種靈、一種教導，而且「現在已經在世上了」（4:3）。他沒有叫讀者去猜那個人是誰，也沒有點名哪個國家、哪個宗派。標準是耶穌基督。誰照著這個標準講耶穌，我們就在他身上認出神的靈；誰把耶穌拆開，不論他多有恩賜，我們都不必跟。</p><p>這對今天很實際。有一種講法只要屬天的能力，不要十字架的軟弱；另一種講法只要一位好老師，不要神的兒子。兩樣都是把耶穌拆開。分辨的時候，不必先看人，先問一句：這篇道講完，耶穌是更清楚，還是更模糊？這使我們想起 321 說的「焦點在耶穌」：分辨的眼睛，也要定睛在他身上。</p>"},{"a":4,"z":6,"star":2,"grk":"<p lang=\"grc\">ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·</p><p lang=\"grc\">αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.</p><p lang=\"grc\">ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.</p>","lit":"<p>你們是出於神的，孩子們，並且你們已經勝過了他們，因為那在你們裡面的，比那在世界裡的更大。</p><p>他們是出於世界的；因此他們從世界說話，世界也聽他們。</p><p>我們是出於神的；認識神的人聽我們，不出於神的人不聽我們。從此我們認出真理的靈和迷惑的靈。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τεκνία</td><td>teknia</td><td>小孩子們</td><td>長輩的稱呼，2:1、12、28 已出現</td></tr><tr><td>νενικήκατε αὐτούς</td><td>nenikēkate autous</td><td>你們已經勝過他們</td><td>完成式：勝利已經成立</td></tr><tr><td>μείζων</td><td>meizōn</td><td>更大的</td><td>比較級：不是對手不存在，是有更大的一位</td></tr><tr><td>ὁ ἐν ὑμῖν</td><td>ho en hymin</td><td>那在你們裡面的</td><td>神與他所賜的靈（3:24；4:13）</td></tr><tr><td>ὁ ἐν τῷ κόσμῳ</td><td>ho en tō kosmō</td><td>那在世界裡的</td><td>那惡者（5:19）</td></tr><tr><td>ἐκ τοῦ κόσμου λαλοῦσιν</td><td>ek tou kosmou lalousin</td><td>從世界說話</td><td>話的源頭與口味都是世界</td></tr><tr><td>ἀκούει ἡμῶν</td><td>akouei hēmōn</td><td>聽我們</td><td>「我們」是使徒見證人（1:1–3）</td></tr><tr><td>τὸ πνεῦμα τῆς πλάνης</td><td>to pneuma tēs planēs</td><td>迷惑的靈</td><td>與「真理的靈」相對</td></tr></table>","gram":"<p><strong>μείζων：勝利的根據不在我們。</strong>4:4 的「勝了」用完成式 νενικήκατε（nenikēkate）：不是「你們要努力去勝」，是「你們已經勝了」。理由是 ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν（hoti meizōn estin ho en hymin），那在你們裡面的更大。「在你們裡面的」是誰？有人說是父神，有人說是聖靈，有人說是基督；照 3:24 與 4:13 的上下文，約翰常把神的同在和所賜的聖靈連在一起講，不必強分。「在世界上的」則是那惡者，約翰說「全世界都臥在那惡者手下」（5:19）。屬靈爭戰與懼怕的問題見 〈4:4「那在你們裡面的，比那在世界上的更大」——屬靈爭戰要怎樣面對懼怕？〉。</p><p><strong>4:6「聽從我們」的「我們」是誰？</strong>一說是全體信徒；但照 1:1–3 的用法，較好的讀法是指使徒見證人，那些親眼看見、親手摸過的人。這不是說「凡我說的你都要聽」，而是說：檢驗教導的方法，是看它合不合使徒傳下來的見證。今天，那份見證寫在新約裡。</p>","exp":"<p>「小子們哪，你們是屬神的，並且勝了他們」（4:4）。說完假先知，約翰沒有讓讀者停在緊張裡。他換了一個稱呼，叫他們「小子們」，像老人家摸著孩子的頭說：別怕，你們是屬神的。</p><p>這群人其實很弱。教會剛分裂，人數變少；出去的那一群講得頭頭是道，「世人也聽從他們」（4:5）。留下來的人難免自問：是不是我們不夠屬靈？約翰的回答很簡單：要比大小，不要比你和他們，要比住在你們裡面的那一位，和在世界上的那一位。「那在你們裡面的，比那在世界上的更大」（4:4）。</p><p>注意，約翰說的是「已經勝了」。這不是一句叫人更用力的口號，是一個事實的宣告。屬靈爭戰不是靠我們膽子大，是靠那位更大的住在我們裡面。所以分辨不是出於懼怕，是出於確信。一個怕被騙的人，會看誰都可疑；一個知道自己屬神的人，才能安靜地聽、安靜地試。</p><p>人氣也不是真理的證據。「論世界的事，世人也聽從他們」（4:5），叫好叫座，常常只說明它合世界的口味。今天的你若因為信仰變得有點孤單，不必羨慕熱鬧。你屬神，那更大的一位住在你裡面。321 在這裡認出得勝者的樣子：不是不跌倒、不害怕的人，是從神生、靠著那更大的一位站住的人。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.</p><p lang=\"grc\">ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.</p>","lit":"<p>親愛的，讓我們彼此相愛，因為愛是出於神的；凡愛的人，都已經從神生了，並且認識神。</p><p>不愛的人，未曾認識神，因為神是愛。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀγαπῶμεν ἀλλήλους</td><td>agapōmen allēlous</td><td>讓我們彼此相愛</td><td>勸勉語氣，約翰把自己也算進去</td></tr><tr><td>ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν</td><td>hē agapē ek tou theou estin</td><td>愛是出於神的</td><td>愛的源頭不在人心</td></tr><tr><td>ἐκ τοῦ θεοῦ γεγέννηται</td><td>ek tou theou gegennētai</td><td>已經從神生了</td><td>完成式：愛是新生命的記號，不是取得新生命的條件</td></tr><tr><td>οὐκ ἔγνω τὸν θεόν</td><td>ouk egnō ton theon</td><td>未曾認識神</td><td>不定過去式：從來沒有真正認識</td></tr><tr><td>ὁ θεὸς ἀγάπη ἐστίν</td><td>ho theos agapē estin</td><td>神是愛</td><td>ἀγάπη 無冠詞：說神的本質，不能倒過來讀</td></tr><tr><td>ἀγάπη</td><td>agapē</td><td>愛</td><td>主動的、為對方好的委身，不只是感覺</td></tr></table>","gram":"<p><strong>「神就是愛」不可以倒過來讀。</strong>ὁ θεὸς ἀγάπη ἐστίν（ho theos agapē estin）裡，主詞 ὁ θεός 有冠詞，ἀγάπη 沒有冠詞，是述詞。這種句型說的是主詞的本質：神的本性是愛。它不是等號，所以不能倒成「愛就是神」：不是凡人間叫作愛的東西都是神，也不是我們覺得對的感覺就可以拿來定義神。要知道愛是甚麼，得從神身上看，4:10 馬上就會告訴我們。</p><p><strong>同一個句型，約翰用了三次。</strong>「神是個靈」（約 4:24）、「神就是光」（1:5）、「神就是愛」（4:8）。三句互相解釋：神是靈，所以不受地點限制；神是光，所以聖潔，在他毫無黑暗；神是愛，所以主動給出自己。光與愛不互相抵消。</p><p><strong>那審判與忿怒呢？</strong>有人以為「神就是愛」就不會審判；也有人把愛和忿怒看成神裡面兩個打架的部分。約翰的寫法是：愛不是神的一種心情，是他的本性；他的聖潔與公義也是。神的忿怒是聖潔的愛對罪的拒絕，正因為他愛，他不能對毀壞人的罪無動於衷。所以同一位約翰也記下「神的震怒常在他身上」（約 3:36）。</p><blockquote>判斷：「神就是愛」說的是本質，不是全部屬性的清單，也不是取消審判；最清楚的答案在 4:10，神親自預備了挽回祭。詳見 〈4:8「神就是愛」——那審判與忿怒呢？「愛就是神」對不對？〉。</blockquote>","exp":"<p>「親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的」（4:7）。從這一節開始，約翰一書進入全新約「愛」字最密的一段。4:7 到 4:21 這十五節裡，「愛」的名詞與動詞出現了二十七次。好像一位老人一講到這件事，就停不下來。</p><p>他先說愛從哪裡來。不是從個性來，不是從原生家庭來，也不是從努力來；「愛是從神來的」（4:7）。這對很多人是好消息。有人說：我天生不會愛，我家裡沒有人教我愛。約翰說，愛的源頭本來就不在你家，在神那裡。凡被神生下來的，身上就開始有他的樣子。</p><p>接著是一句很重的話：「沒有愛心的，就不認識神」（4:8）。這句話不是拿來測量誰有沒有得救的尺，是說明一件事：認識神，不可能只停在頭腦。神的本性是愛，真認識他的人，不會一點都不像他。就像一個孩子在愛裡長大，說話的口氣會慢慢像父親。</p><p>「神就是愛」（4:8）也不是一句甜甜的標語。這位愛的神也是光（1:5），他的愛有聖潔、有真理。所以人間有些打著「愛」的名號的東西，像放縱、操控、沒有界線的委屈，都不是從他來的。我們的愛要從他那裡學。</p><p>今天，如果你發現自己很難愛人，不必先定自己的罪。先回到源頭。愛不是從你身上擠出來的，是從神那裡流進來的。先被愛，才會愛；這是這一章要一路帶我們去的地方。</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.</p><p lang=\"grc\">ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.</p>","lit":"<p>在這件事上，神的愛在我們中間顯明了：神已經差遣他那獨一的兒子到世界裡，好叫我們藉著他活著。</p><p>愛就在於此：不是我們已經愛了神，而是他愛了我們，並且差遣他的兒子，為我們的罪作挽回祭。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐφανερώθη</td><td>ephanerōthē</td><td>被顯明了</td><td>愛不是藏在天上的情緒，在歷史中被看見</td></tr><tr><td>τὸν μονογενῆ</td><td>ton monogenē</td><td>那獨一的（獨生的）</td><td>無可取代的那一位；約 1:14、18；3:16</td></tr><tr><td>ἀπέσταλκεν</td><td>apestalken</td><td>已經差遣</td><td>完成式：差遣的果效至今還在</td></tr><tr><td>ἵνα ζήσωμεν δι’ αὐτοῦ</td><td>hina zēsōmen di' autou</td><td>好叫我們藉著他活</td><td>愛的目的是生命</td></tr><tr><td>οὐχ ὅτι ἡμεῖς ἠγαπήκαμεν</td><td>ouch hoti hēmeis ēgapēkamen</td><td>不是我們已經愛了</td><td>先否定人的愛作起點</td></tr><tr><td>ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς</td><td>all' hoti autos ēgapēsen hēmas</td><td>乃是他愛了我們</td><td>不定過去式：指向十字架那一次</td></tr><tr><td>ἱλασμὸν περὶ τῶν ἁμαρτιῶν</td><td>hilasmon peri tōn hamartiōn</td><td>為罪的挽回祭</td><td>2:2 已出現；這裡說明是誰預備的</td></tr></table>","gram":"<p><strong>μονογενής：獨生，還是獨一？</strong>傳統譯作「獨生」，以為字根是 γεννάω（生）；近代許多學者認為字根是 γένος（種類），意思是「獨一無二、只此一個」。希伯來書稱以撒為亞伯拉罕的 μονογενής（來 11:17），以撒並不是他唯一生的兒子，卻是唯一的應許之子。兩說各有理據；不論哪一說，重點都是無可取代、最寶貴的那一位。這字在約翰筆下另見約 1:14、18；3:16、18。</p><p><strong>ἱλασμός：挽回祭是誰獻給誰？</strong>這字在新約只出現兩次，都在本卷（2:2；4:10）。學者並陳兩種理解：propitiation（平息忿怒的祭），強調罪招來神聖潔的忿怒；expiation（除罪、遮罪的祭），強調罪被除去。4:10 的句子提供了決定性的框架：主詞從頭到尾是神。他愛了我們，他差了兒子，他使兒子作挽回祭。</p><blockquote>判斷：不論採哪一個譯法，這不是人拿祭物去平息一位生氣的神，而是神自己預備了祭，自己承擔了代價。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。</blockquote><p>另外，WH 與 NA28 作 ἠγαπήκαμεν（完成式），Treg 與 RP 作 ἠγαπήσαμεν（不定過去式），意思相同：起點不是人的愛。</p>","exp":"<p>〔約〕約 3:16（約翰福音講義第 3 章）</p><p>「神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了」（4:9）。剛剛約翰說「神就是愛」，現在他不讓這句話飄在空中。神的愛長甚麼樣子？看伯利恆，看各各他。愛有一個日期、一個地點、一個名字。</p><p>這一節的回聲是「神愛世人，甚至將他的獨生子賜給他們」（約 3:16）。福音書寫給還沒有信的人，叫他們信；書信寫給已經信的人，叫他們知道。同一份愛，約翰講了兩次，一次叫人進來，一次叫人住下。</p><p>然後是全卷的樞紐：「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了」（4:10）。約翰在這裡把順序擺正。我們常以為信仰是這樣的：我先愛神、先表現好，神才接納我。約翰說：反了。愛的起點不在我們。在我們還沒有愛他、甚至還作罪人的時候，他已經出手了。</p><p>所以這卷書裡所有的命令，要行在光中、要彼此相愛、要遵守誡命，都不是門檻，是回應。不是「做到了才被愛」，是「被愛了所以開始學」。這一節也拆掉了一個常見的誤會：十字架不是兒子去說服一位不情願的父親。差兒子的是父，預備祭的是神自己。</p><p>如果你今天覺得自己愛神愛得很少、很冷，先別急著加倍努力。抬頭看 4:10。愛的定義不是你給了神多少，是他給了你甚麼。連「愛」這個字的主詞，都先是他。321 在這裡認出「無己」的根：人不必站在中心，因為中心已經有一位先愛我們的神。</p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.</p><p lang=\"grc\">θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ἐν ἡμῖν τετελειωμένη ἐστιν.</p>","lit":"<p>親愛的，神既然這樣愛了我們，我們也應當彼此相愛。</p><p>神，從來沒有人看過；我們若彼此相愛，神就住在我們裡面，他的愛在我們裡面已經得以完成了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰ οὕτως</td><td>ei houtōs</td><td>既然這樣</td><td>第一類條件句：是事實，不是假設</td></tr><tr><td>ὀφείλομεν</td><td>opheilomen</td><td>我們欠著、應當</td><td>欠債的字：先收下，才有虧欠</td></tr><tr><td>θεὸν οὐδεὶς πώποτε τεθέαται</td><td>theon oudeis pōpote tetheatai</td><td>神，從來沒有人看過</td><td>與約 1:18 幾乎同一句</td></tr><tr><td>ὁ θεὸς ἐν ἡμῖν μένει</td><td>ho theos en hēmin menei</td><td>神住在我們裡面</td><td>μένω 追蹤：神住下來</td></tr><tr><td>τετελειωμένη ἐστιν</td><td>teteleiōmenē estin</td><td>已經被完成了</td><td>迂說完成式；「完全」是到達目的，不是零缺點</td></tr><tr><td>ἡ ἀγάπη αὐτοῦ</td><td>hē agapē autou</td><td>他的愛</td><td>可解為神愛我們的愛、我們愛神的愛，或神那樣的愛</td></tr></table>","gram":"<p><strong>「愛他的心」是誰的愛？</strong>ἡ ἀγάπη αὐτοῦ（hē agapē autou）直譯「他的愛」，文法上有三種讀法：一、受詞所有格，我們對神的愛（和合本「愛他的心」偏這個方向）；二、主詞所有格，神對我們的愛；三、性質所有格，神那一類的愛。照 4:9–11 的上下文，神愛我們是起點，所以第二、第三種讀法較順：神的愛流進我們，在我們彼此相愛時走完全程。</p><p><strong>τετελειωμένη：「完全」不是零缺點。</strong>τελειόω（teleioō）是「使達到目的、完成」。迂說完成式 τετελειωμένη ἐστιν 表示一個已經完成而持續的狀態。神的愛有一個目標：從他流到我們，再從我們流向弟兄。愛流到了該到的地方，就是「得以完全」。這和 2:5、4:17、4:18 是同一個字群。SBLGNT 與 NA28 的語序是 ἐν ἡμῖν τετελειωμένη ἐστιν，WH、Treg、RP 語序不同，意思不變。「從來沒有人見過神」與舊約見神經文的關係，見 〈4:12「從來沒有人見過神」——那舊約見神的經文呢？〉。</p>","exp":"<p>〔約〕約 1:18（約翰福音講義第 1 章）</p><p>「親愛的弟兄啊，神既是這樣愛我們，我們也當彼此相愛」（4:11）。照一般人的邏輯，這句話應該寫成：神既這樣愛我們，我們也當愛神。約翰卻寫「彼此相愛」。神的愛不是一個繞回原點的圈，是一條往外流的河。</p><p>「當」字在原文是欠債的字。我們欠的不是一筆要償還給神的錢，那是還不完的；我們是被愛多了，心裡開始有一份還不完的虧欠，於是轉身去愛身邊的人。</p><p>「從來沒有人見過神」（4:12）。這句話約翰在福音書寫過一次，接著說獨生子「將他表明出來」（約 1:18）。在這裡他接的卻是：「我們若彼此相愛，神就住在我們裡面」（4:12）。看不見的神，從前在耶穌身上被看見；如今，在彼此相愛的弟兄姊妹中間被看見。</p><p>這是很驚人的一句話。一個鄰居也許從來不讀聖經，但他看見一群人在他住院的時候輪流送飯，看見一個小組在某人失業時默默分擔房租，他就在那裡看見了神的影子。教會不只是講神的愛，教會是讓神的愛被看見的地方。</p><p>所以 321 說「建立屬神的體系」，起點不是先蓋一套組織，是先有一群被愛、也彼此相愛的人。神住在那裡，他的愛就在那裡走完它的路。今天你可以問自己：我身邊的哪一個人，因為我的愛，多看見了一點神？</p>"},{"a":13,"z":16,"star":1,"grk":"<p lang=\"grc\">Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.</p><p lang=\"grc\">καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.</p><p lang=\"grc\">ὃς ἐὰν ὁμολογήσῃ ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.</p><p lang=\"grc\">καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ μένει.</p>","lit":"<p>在這件事上我們知道我們住在他裡面，他也住在我們裡面，因為他已經從他的靈中賜給了我們。</p><p>我們也看過，並且作見證：父已經差遣子作世界的救主。</p><p>無論誰承認耶穌是神的兒子，神就住在他裡面，他也住在神裡面。</p><p>我們也已經認識並且已經相信神在我們身上所存的愛。神是愛；住在愛裡的，就住在神裡面，神也住在他裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν</td><td>ek tou pneumatos autou dedōken</td><td>他已從他的靈中賜給</td><td>分享他自己的靈</td></tr><tr><td>τεθεάμεθα καὶ μαρτυροῦμεν</td><td>tetheametha kai martyroumen</td><td>我們看過並且作見證</td><td>回到 1:1–3 的見證人</td></tr><tr><td>σωτῆρα τοῦ κόσμου</td><td>sōtēra tou kosmou</td><td>世界的救主</td><td>約 4:42 撒瑪利亞人的認信</td></tr><tr><td>ὁμολογήσῃ</td><td>homologēsē</td><td>承認</td><td>4:2 的標準再出現</td></tr><tr><td>ἐγνώκαμεν καὶ πεπιστεύκαμεν</td><td>egnōkamen kai pepisteukamen</td><td>我們已經知道也已經相信</td><td>兩個完成式：知道和信不分家</td></tr><tr><td>ὁ μένων ἐν τῇ ἀγάπῃ</td><td>ho menōn en tē agapē</td><td>那住在愛裡的</td><td>μένω：住進神的愛裡</td></tr><tr><td>ἐν τῷ θεῷ μένει</td><td>en tō theō menei</td><td>住在神裡面</td><td>互相內住</td></tr></table>","gram":"<p><strong>三個記號，扭成一股繩。</strong>4:13–16 把全卷的三條線放在一起：聖靈（4:13）、認信（4:15）、愛（4:16）。約翰不是給三張互不相干的檢查表，而是說一個住在神裡面的人，三樣會一起出現：有神所賜的靈，承認耶穌是神的兒子，並且住在愛裡。缺了認信的愛，會變成沒有根的好心；缺了愛的認信，會變成冷冰冰的正確。</p><p><strong>ἐκ τοῦ πνεύματος（ek tou pneumatos）的「從」。</strong>這個 ἐκ 可以讀作部分屬格（神把他的靈分給我們），也可以讀作來源。3:24 已說「是因他所賜給我們的聖靈」（3:24）。重點不在我們領了多少，而在住在我們裡面的是神自己的靈。</p><p>4:16 的 ἐγνώκαμεν καὶ πεπιστεύκαμεν（egnōkamen kai pepisteukamen）兩個完成式，和約 6:69 彼得的認信用的是同一對字：知道與相信不是兩條路，是同一個生命的兩面。4:15 WH 加 Χριστός；4:16 Treg 少了最後的 μένει，都不影響意思。</p>","exp":"<p>「神將他的靈賜給我們，從此就知道我們是住在他裡面，他也住在我們裡面」（4:13）。約翰一書是一卷講確據的書。讀者剛被假教師攪亂，心裡常問：我真的屬神嗎？約翰一次又一次地回答：你可以知道。</p><p>他給的不是一種神秘的感覺，而是幾樣可以指認的事。第一，神的靈住在我們裡面；第二，我們認「耶穌為神兒子」（4:15）；第三，我們住在愛裡。這三樣是一起的。約翰也把自己算在見證人裡：「父差子作世人的救主；這是我們所看見且作見證的」（4:14）。信仰不是從一個好想法開始，是從一位真實來過的救主開始。</p><p>注意「世人的救主」。這位救主不只屬於某一個族群、某一個教會，他是為世界來的。所以「不要愛世界」（2:15）從來不是叫我們厭世；神自己愛這個世界，差兒子來救它。</p><p>然後約翰說：「神愛我們的心，我們也知道也信」（4:16）。知道，也信。有些人頭腦知道神愛世人，心裡卻不敢相信神愛自己。約翰要我們兩樣都有：不只是背得出約 3:16，而是像一個孩子在父親懷裡，安心地相信。</p><p>「住在愛裡面的，就是住在神裡面」（4:16）。「住」是本卷的核心字。住下來的意思是不再流浪，不必每天重新證明自己有資格留下。你可以把行李放下了。今天不必再問「神今天還要不要我」；他的愛是一個家，你可以住進去。</p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.</p><p lang=\"grc\">φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.</p>","lit":"<p>在這件事上，愛在我們中間已經得以完成，好叫我們在審判的日子有坦然的膽量；因為那一位怎樣，我們在這世界上也怎樣。</p><p>懼怕不在愛裡；完全的愛把懼怕丟到外面，因為懼怕帶著刑罰，而懼怕的人在愛裡還沒有得以完成。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν</td><td>teteleiōtai hē agapē meth' hēmōn</td><td>愛在我們中間得以完全</td><td>愛走完了它的路</td></tr><tr><td>παρρησίαν</td><td>parrēsian</td><td>坦然、放膽說話</td><td>2:28 已出現；在君王面前敢開口</td></tr><tr><td>ἐν τῇ ἡμέρᾳ τῆς κρίσεως</td><td>en tē hēmera tēs kriseōs</td><td>在審判的日子</td><td>約翰沒有取消審判</td></tr><tr><td>καθὼς ἐκεῖνός ἐστιν</td><td>kathōs ekeinos estin</td><td>那一位怎樣</td><td>現在式：我們在基督裡的地位</td></tr><tr><td>φόβος</td><td>phobos</td><td>懼怕</td><td>這裡是怕被審判、怕被丟棄的懼怕</td></tr><tr><td>ἡ τελεία ἀγάπη ἔξω βάλλει</td><td>hē teleia agapē exō ballei</td><td>完全的愛丟到外面</td><td>像把不屬於家裡的東西趕出門</td></tr><tr><td>κόλασιν ἔχει</td><td>kolasin echei</td><td>帶著刑罰</td><td>κόλασις：懲罰；太 25:46 的「永刑」</td></tr><tr><td>ὁ φοβούμενος</td><td>ho phoboumenos</td><td>懼怕的人</td><td>還沒有讓愛走到底的人</td></tr></table>","gram":"<p><strong>這裡的懼怕是哪一種？</strong>φόβος（phobos）在新約可以是好的「敬畏」，也可以是壞的「驚恐」。4:18 的上下文自己下了定義：ὅτι ὁ φόβος κόλασιν ἔχει（hoti ho phobos kolasin echei），懼怕裡含著刑罰。κόλασις（kolasis）是懲罰，太 25:46 的「永刑」就是這個字；前一節剛講「審判的日子」（4:17）。所以這裡的懼怕，是罪人站在審判前、怕被定罪、怕被丟棄的懼怕。「含著刑罰」可以理解為這懼怕預嘗了刑罰的滋味，也可以理解為它的內容就是對刑罰的預期。基督徒是否還要受審判，見 〈4:17「在審判的日子可以坦然無懼」——基督徒還要受審判嗎？〉。</p><p><strong>這和「敬畏神」不同。</strong>舊約說「敬畏耶和華是知識的開端」（箴 1:7），保羅也說「當恐懼戰兢做成你們得救的工夫」（腓 2:12）。敬畏是兒女對聖潔父親的尊重，把神當神；4:18 的懼怕是奴僕怕主人的懲罰。保羅說我們所受的，「不是奴僕的心，仍舊害怕」（羅 8:15）。完全的愛除去的是後者，不是前者。</p><p><strong>這節不是心理診斷。</strong>焦慮症、恐慌、創傷後的驚嚇，有身體、經歷與環境的成因，不是約翰在這裡處理的題目。把這節拿來對受苦的人說「你的愛不完全」，是誤用。</p><blockquote>判斷：4:18 的答案不是叫人更努力去愛，而是叫人更確知被愛。詳見 〈4:18「愛裡沒有懼怕」——那「敬畏神」呢？有焦慮的人是愛不完全嗎？〉。</blockquote>","exp":"<p>「這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼」（4:17）。約翰沒有說沒有審判。他說有一個日子，人要站在神面前。可是他說，被愛的人可以坦然無懼地站在那裡，不是因為自己無可指摘，而是因為「他如何，我們在這世上也如何」（4:17）。我們在基督裡，父看我們，是透過他的兒子看。</p><p>接著是很多人背得出、卻也常被用錯的一節：「愛裡沒有懼怕；愛既完全，就把懼怕除去」（4:18）。這裡的懼怕是甚麼？約翰自己解釋：「因為懼怕裡含著刑罰」（4:18）。那是對審判的懼怕：怕神終究會算總帳，怕自己最後會被丟出去。很多基督徒心裡藏著這份怕，信主很多年，仍然覺得神隨時會翻臉。</p><p>約翰的答案不是「你要更努力地愛，才不會怕」。答案是神的愛。4:10 已經講過，挽回祭是神自己預備的。審判的刑罰已經落在他兒子身上，所以被愛的人可以把那份懼怕放下。愛把懼怕「除去」，原文是「丟到外面」，像一個父親把半夜闖進孩子房間的惡夢趕出門外。</p><p>這一節不可以拿來責備受苦的人。有些弟兄姊妹有焦慮症、有恐慌，有些人曾經受過傷，身體到今天還記得那份驚嚇。他們需要的是陪伴、醫療與專業輔導，而不是一句「你的愛不完全」。禱告很寶貴，但禱告不取代醫生和輔導；神也常常藉著他們來照顧我們。</p
