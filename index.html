神的震怒常在他身上」（約 3:36）。</p><p>經文要問的是兩件事：①神的愛與神的審判、忿怒是甚麼關係？②「神就是愛」可不可以倒過來說「愛就是神」？</p>"],["愛吞沒審判說：神既是愛，最終不會審判任何人","","<p>有些神學與大眾靈性把「神就是愛」當成總綱，認為忿怒與審判是古代的觀念，愛最終會勝過一切，所有人都會得救；或乾脆說凡有愛的地方就有神，「愛就是神」。這一說的長處是抓住了福音最溫暖的一面：神確實「不輕易發怒，並有豐盛的慈愛和誠實」（出 34:6）。</p><p><strong>難處：</strong>這不是約翰的寫法。他在同一卷說神是光，在同一章說有「審判的日子」（4:17），而且 4:10 的挽回祭若沒有真實的罪與審判，就失去了意義。把愛講成取消審判，反而貶低了十字架的代價；把「愛就是神」當成真理，會讓人間一切叫作愛的感覺——包括放縱與操控——都可以拿來定義神。</p>"],["張力說：神裡面愛與忿怒並存，彼此平衡","","<p>另一種講法把神的屬性排成天平：一邊是愛，一邊是公義與忿怒，十字架是兩者的妥協。這一說的長處是認真對待兩組經文，不讓任何一邊被取消；在華人教會，它也常用來提醒人不要把神的恩典當成廉價。</p><p><strong>難處：</strong>這個圖像容易讓人以為神裡面有兩股力量在拉扯，甚至以為父是忿怒的、子是慈愛的。4:10 不支持這種對立：差兒子作挽回祭的，正是愛我們的神自己。把屬性講成天平，會讓會眾不知道哪一天會碰到哪一邊的神。</p>"],["聖愛說：神的忿怒是聖潔的愛對罪的拒絕","","<p>許多福音派神學家認為，愛不是神眾多屬性之一，而是他本性的表達；他的聖潔與公義也是。神的忿怒不是失控的脾氣，而是聖潔的愛對毀壞人之罪的拒絕——正因為他愛，他不能對罪無動於衷，就像一位父親不會對傷害孩子的毒品「寬容」。所以十字架不是愛與公義的妥協，而是神在愛裡親自承擔了公義的審判。</p><p><strong>難處：</strong>這一說在概念上整合得很好，但在講台上很容易變得抽象；而且「神的忿怒是愛的一種表現」若講得不小心，也可能被受過暴力的人聽成「打你是因為愛你」，必須清楚分辨：神的忿怒對準的是罪，目的是拯救，絕不是人間施暴者的藉口。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「神就是愛」說的是神的本性，不是等號，不能倒成「愛就是神」；這愛是聖潔的愛，與神是光、神的審判並不衝突。</strong>要知道愛是甚麼，不從人的感覺定義，而是看 4:10：神愛我們，差他的兒子為我們的罪作了挽回祭。</p><p>所以審判是真的，因為罪是真的；但神面對罪的方式，是自己預備祭物、自己承擔代價。這不是一位生氣的神被兒子說服，而是同一位愛的神親自出手。挽回祭的詳細處理，本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。</p><p>這也保護了受傷的人：人間任何打著「愛」的名號的操控、暴力、沒有界線的委屈，都不是從他來的；神的愛有光，有真理。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題該讓你更安心，不是更害怕。神是愛，所以他找你；神是光，所以他不會讓罪繼續毀壞你。這兩樣在十字架上相遇。</p><p>如果你從小怕神，覺得他隨時會發怒，請把 4:8 和 4:10 放在一起讀：審判是真的，但承擔審判的，是他的兒子。如果你覺得「反正神是愛，怎樣都可以」，也請讀 1:5：愛你的那一位是光。</p>"]],"con":[],"say":"本講義的立場：「神就是愛」說的是神的本性，不是等號，不可倒成「愛就是神」；神的愛是聖潔的愛，與神是光、與審判並不衝突，最清楚的定義在 4:10 的挽回祭。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。","care":"會眾席上有從小在嚴厲家庭長大、把天父想像成一位隨時會打人的父親的人；也有人在家裡聽過「我打你是因為我愛你」。講「神的忿怒」時，務必說清楚它對準的是罪、目的是拯救，絕不是暴力的藉口。對懼怕神的人，先帶他看 4:10；對覺得怎樣都可以的人，溫柔地帶他看 1:5。"},{"id":"ISS04_5","t":"4:12「從來沒有人見過神」——那舊約見神的經文呢？","r":"4:12；約 1:18；出 33:20；賽 6:1","ch":[4],"why":"這一題看起來是讀經的技術問題，其實常常是慕道友與愛查考的信徒卡住的地方：聖經一面說「從來沒有人見過神」，一面又記雅各、摩西、以賽亞見了神，是不是自相矛盾？處理不好，有人因此懷疑聖經的可靠；處理得好，卻能把人帶到約翰最想說的地方——看見耶穌，就是看見父。","pos":[["【一】經文問的是甚麼","","<p>「從來沒有人見過神」（4:12）。約翰在福音書也說過：「從來沒有人看見神，只有在父懷裡的獨生子將他表明出來」（約 1:18）。可是舊約記雅各說「我面對面見了神」（創 32:30），以賽亞說「我見主坐在高高的寶座上」（賽 6:1），摩西與長老們「看見以色列的神」（出 24:10）；同時神又對摩西說「你不能看見我的面，因為人見我的面不能存活」（出 33:20）。</p><p>經文要問的是：「見神」在這些經文裡是同一個意思嗎？約翰在 4:12 說這句話，是為了解決舊約的難題，還是為了說另一件事？</p>"],["顯現說：舊約所見的是神的顯現，不是神的本質","","<p>多數解經傳統認為，舊約的「見神」是神俯就人的顯現——異象、雲柱火柱、人的形狀、榮耀的光輝；人看見的是神願意顯給人看的樣式，而不是神無限、屬靈的本體。以西結說得很小心：「這就是耶和華榮耀的形像」（結 1:28），他看見的是榮耀的形像。保羅也說神「是人未曾看見、也是不能看見的」（提前 6:16）。</p><p><strong>難處：</strong>這一說若只停在「本質與顯現」的分別，容易變成抽象的哲學區分，好像舊約聖徒看見的只是「次一級」的東西；它也需要說明為甚麼經文仍用「面對面」這種強烈的語言。</p>"],["基督顯現說：舊約的見神，多半是先存的基督顯現","","<p>許多教父與改革宗、福音派解經家認為，舊約中有形可見的神的顯現，很可能是先存的子的顯現；約翰自己說以賽亞「看見他的榮耀，就指著他說這話」（約 12:41），上下文指的是耶穌。這一說的長處是與約 1:18 吻合：從來只有子將父表明出來，不論在舊約還是在道成肉身之後。</p><p><strong>難處：</strong>舊約經文本身沒有每一處都明說是子；把每一次顯現都確定為基督，會超過經文所說的。比較穩妥的說法是：這使我們想起約 12:41，有些顯現可以這樣理解，但不必每一處都下定論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：4:12 與舊約見神的經文並不矛盾——舊約所見的是神俯就人的顯現與榮耀的形像，不是神無限的本體；而約翰說這句話的重點，不在解決舊約難題，而在接下去的那一句。</strong></p><p>同一句「從來沒有人見過神」，約翰寫過兩次，接的話卻不一樣。福音書接的是「只有在父懷裡的獨生子將他表明出來」（約 1:18）——看不見的神，在耶穌身上被看見；書信接的是「我們若彼此相愛，神就住在我們裡面」（4:12）——看不見的神，如今在彼此相愛的人中間被看見。耶穌說：「人看見了我，就是看見了父」（約 14:9）。</p><p>將來，「清心的人有福了！因為他們必得見神」（太 5:8）；「到那時就要面對面了」（林前 13:12）。現在，我們在耶穌身上、在彼此相愛的群體裡，先看見他的樣子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該影響你的信心。聖經的作者們自己很清楚這個分別，他們用「見神」時，常常同時說明那是榮耀、是形像、是異象。</p><p>真正該問的是約翰想問的：<strong>在我身邊的人，有沒有因為我們彼此相愛，多看見了一點那位看不見的神？</strong>這比解開一個讀經難題，更接近 4:12 的心。</p>"]],"con":[],"say":"本講義的立場：舊約所見的是神俯就人的顯現與榮耀的形像，不是神無限的本體，與 4:12 不矛盾；約翰的重點是看不見的神在耶穌身上被表明（約 1:18），如今在彼此相愛的群體中被看見。","care":"會眾席上可能有正在查考、對聖經有疑問的慕道友，也可能有人因為「從來沒見過神、也沒有特別經歷」而懷疑自己的信仰是不是真的。不要嘲笑疑問，也不要讓沒有異象的人覺得自己次等。告訴他：約翰說我們在耶穌身上、在彼此相愛的人中間看見神；他坐在這個群體裡，本身就是在看見。"},{"id":"ISS04_6","t":"4:17「在審判的日子可以坦然無懼」——基督徒還要受審判嗎？","r":"4:17；2:28；林後 5:10；約 5:24","ch":[4],"why":"有一種基督徒不敢想審判：信主多年，仍怕死後站在神面前被翻舊帳；另一種基督徒覺得審判跟自己無關，信了就好，怎樣活都沒差。前者活在懼怕裡，後者活在輕忽裡。4:17 說「在審判的日子坦然無懼」，同一本新約又說「我們眾人必要在基督臺前顯露出來」，這一題要把兩者放在一起讀。","pos":[["【一】經文問的是甚麼","","<p>「這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼。因為他如何，我們在這世上也如何」（4:17）。約翰在 2:28 也說「他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧」（2:28）。耶穌說信的人「不至於定罪，是已經出死入生了」（約 5:24）；保羅卻說「我們眾人必要在基督臺前顯露出來，叫各人按著本身所行的，或善或惡受報」（林後 5:10）。</p><p>經文要問的是：基督徒還要受審判嗎？如果要，為甚麼可以「坦然無懼」？</p>"],["賞賜審判說：信徒不受定罪的審判，但要受賞賜的審查","","<p>許多福音派傳統區分兩種審判：決定得救與否的定罪審判，信徒已經在基督裡越過了（約 5:24；羅 8:1）；但信徒仍要站在基督臺前，接受工作的審查與賞賜的評定（林後 5:10；林前 3:13--15）。這一說的長處是同時保住了確據與責任：救恩是白白的，生活卻是要交帳的。</p><p><strong>難處：</strong>若講得太細，例如把天上的賞賜描繪成等級分明的「獎金」，容易讓信徒在得救之後又活在另一種表現焦慮裡；也可能把神的稱讚講成功利的交換。</p>"],["同一審判說：所有人站在同一審判前，信徒因基督被稱義","","<p>另一些傳統（包括許多路德宗、改革宗與天主教神學家）認為只有一個最後審判，所有人都要站在其中；信徒在那審判中被宣告為義，是因為他在基督裡，而他的行為則是真實信心的證明。4:17「他如何，我們在這世上也如何」被讀成：我們與基督聯合，父看我們，是透過他的兒子看。</p><p><strong>難處：</strong>這一說若沒有說清楚，容易讓人以為最後還要看行為「及不及格」，又把確據拉回自己身上；而「行為是信心的證據」在敏感的人心裡，也可能變成無止境的自我檢查。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：審判是真的，信徒也要站在基督面前交帳；但在基督裡的人不被定罪，所以可以坦然無懼。這份無懼的根據不是自己無可指摘，而是 4:10 的挽回祭與 4:17 的「他如何，我們……也如何」。</strong></p><p>兩種解釋審判的框架，本講義不在本卷裁判；它們都同意兩件事：①信徒不會在審判中失去在基督裡的身分；②信徒的生活是要交帳的，這給我們嚴肅，不給我們恐懼。所以 4:18 說「懼怕裡含著刑罰」——那份對被定罪的懼怕，是完全的愛要除去的；刑罰已經落在他兒子身上了。罪與確據的整體處理，本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。</p><p>坦然無懼不是驕傲，是孩子回家時的放心。παρρησία（parrēsia）原是公民在議會裡「放膽直言」的字；被愛的人，可以抬起頭來見父。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題該讓你安心，也該讓你認真。安心，是因為你的確據掛在基督身上，不在你的成績單上；認真，是因為被這樣愛的人，願意活得對得起這份愛。</p><p>如果你一想到死後見主就發抖，請把 4:17 讀成一個應許，不是一個考題：「他如何，我們在這世上也如何。」你站在那裡的時候，是穿著他的義站著的。</p>"]],"con":[],"say":"本講義的立場：審判是真的，信徒要在基督面前交帳，但在基督裡不被定罪；坦然無懼的根據是挽回祭與「他如何，我們也如何」，不是自己無可指摘。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。","care":"會眾席上有因為過去的罪而怕死、怕見主的長輩，也有臨終病人的家屬在問「他會不會被審判」。不要用審判嚇人，也不要輕描淡寫說「反正不用怕」。陪他讀 4:10 與 4:17，讓他知道審判的刑罰已經由基督承擔；對仍在掙扎的人，給他時間，必要時陪他一起禱告、認罪，讓他在愛裡放下懼怕。"},{"id":"ISS04_7","t":"4:18「愛裡沒有懼怕」——那「敬畏神」呢？有焦慮的人是愛不完全嗎？","r":"4:18；箴 1:7；腓 2:12","ch":[4],"why":"這是本章最需要牧養溫度的一題。4:18「愛裡沒有懼怕」常被抄在卡片上送給病人，也常被拿來對焦慮症、恐慌症、創傷後壓力的弟兄姊妹說「你會怕，就是你的愛還不完全」。這句話會把人推進更深的羞恥：把病藏起來、偷偷停藥、不敢再來教會。同時，會眾也困惑：聖經不是叫我們「敬畏神」嗎，為甚麼又說「沒有懼怕」？","pos":[["【一】經文問的是甚麼","","<p>「愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰，懼怕的人在愛裡未得完全」（4:18）。約翰自己給這裡的懼怕下了定義：ὁ φόβος κόλασιν ἔχει，「懼怕裡含著刑罰」；κόλασις（kolasis）是懲罰，前一節剛講「審判的日子」（4:17）。另一方面，舊約說「敬畏耶和華是知識的開端」（箴 1:7），保羅說「就當恐懼戰兢做成你們得救的工夫」（腓 2:12），用的也是 φόβος 字群。</p><p>經文要問兩件事：①4:18 的「懼怕」和「敬畏神」是同一件事嗎？②一個有焦慮、恐慌、創傷反應的基督徒，是否就是「在愛裡未得完全」？</p>"],["情緒總稱說：把一切懼怕都讀成「愛還沒有完全」的記號","","<p>有些講台把 4:18 讀成對一切懼怕情緒的判斷：信徒若常常害怕、焦慮，就表示還沒有完全經歷神的愛，需要更多禱告、更多宣告、更多信心。這一說看見一件真實的事：神的愛確實能安慰驚恐的心，「我曾尋求耶和華，他就應允我，救我脫離了一切的恐懼」（詩 34:4），許多人在禱告中經歷過真實的平安。</p><p><strong>難處：</strong>這個讀法忽略了約翰自己的定義——他說的是「含著刑罰」的懼怕，也就是對審判、對被定罪的懼怕，不是心理診斷。焦慮症、恐慌、創傷後的驚嚇，有身體、經歷與環境的成因；把它們一律說成愛不完全，會叫受苦的人在病上再加一層羞恥，甚至延誤就醫。主耶穌在客西馬尼園也「甚是憂傷，幾乎要死」，這不是愛不完全。</p>"],["兩種懼怕說：審判的懼怕與兒女的敬畏","","<p>多數解經家認為，聖經裡的「懼怕」有兩種：一種是奴僕怕主人懲罰的懼怕，一種是兒女對聖潔父親的敬畏。保羅說：「你們所受的，不是奴僕的心，仍舊害怕；所受的，乃是兒子的心，因此我們呼叫：『阿爸！父！』」（羅 8:15）4:18 除去的是前者；箴 1:7 與腓 2:12 說的是後者——把神當神，尊重他的聖潔，嚴肅地活出救恩。</p><p><strong>難處：</strong>這一說在概念上清楚，但在實際生命裡，兩種懼怕常常糾纏在一起；有些人從小在嚴厲或暴力的家庭長大，一聽到「敬畏」就聽成「害怕被打」，需要更長的時間與陪伴才分得開。單單給出定義，不一定能醫治這樣的人。</p>"],["整全牧養說：神的愛也經由醫療、輔導與群體臨到","","<p>這一說在接受「兩種懼怕」的解經之外，進一步強調人是身、心、靈的整體：一個人可以真實地信靠神的愛，同時仍有焦慮症或創傷反應，需要醫生、藥物與專業輔導。神的愛除去審判的懼怕，常常也藉著這些管道，慢慢安撫一個受傷的身體。</p><p><strong>難處：</strong>若只談醫療，可能讓人覺得信仰對懼怕毫無話可說，忽略了神的話、禱告、敬拜與群體在醫治中真實的力量；也可能讓人把一切退縮都歸給「我的狀況」，不再把懼怕帶到神面前。整全，是兩邊都要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：4:18 的懼怕是「含著刑罰」的懼怕——罪人站在審判前、怕被定罪、怕被丟棄的懼怕；它的答案是神的愛（4:10 的挽回祭），不是自己更努力。這和敬畏神不同：完全的愛除去的是奴僕的懼怕，不是兒女的敬畏。</strong></p><p>這一節不是心理診斷。不可用 4:18 責備焦慮、恐懼或受過創傷的人「你的愛不完全」。有焦慮症、恐慌、創傷反應的弟兄姊妹，不是不屬靈；禱告很寶貴，但禱告不取代醫療與輔導，兩者不是二選一。有人正在服藥，要肯定他繼續就醫，不叫他自行停藥。神所賜的平安，常常正是藉著醫生、藥物、輔導與弟兄姊妹的陪伴臨到。</p><p>「懼怕的人在愛裡未得完全」說的是一個方向：神的愛還沒有在這個人身上走完它的路——不是一張成績單，是一個邀請。愛把懼怕「丟到外面」，像一位父親把半夜闖進孩子房間的惡夢趕出門外；趕出去的是他，不是孩子自己。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑自己的信仰。如果你心裡常有「神會不會不要我」的怕，請把 4:10 和 4:18 放在一起讀：你的平安不建立在你愛得多好，而建立在他先為你預備了挽回祭。那份怕不是你的家，愛才是。</p><p>如果你有焦慮症、恐慌或創傷，正在服藥、看輔導，你沒有背叛 4:18；你正在領受神用許多管道賜下的照顧。你可以帶著害怕來到神面前，不必先把害怕處理好。如果有傷害自己的念頭，請立刻告訴身邊的人，聯絡醫療或危機專線。</p>"]],"con":[],"say":"本講義的立場：4:18 的懼怕是「含著刑罰」的懼怕，答案是神先愛我們，不是自己更努力；它不同於敬畏神，也不是心理診斷。不可用它責備焦慮、恐懼或受過創傷的人，禱告不取代醫療與輔導；正在服藥的人，要肯定他繼續就醫。","care":"會眾席上一定有正在服用抗焦慮或抗憂鬱藥物的人，有恐慌發作時連聚會都坐不住、坐在最靠門邊位置的人，也有因為童年或婚姻裡的暴力，一聽到大聲說話就發抖的人。不要說「愛裡沒有懼怕，你怎麼還在怕」「把藥停了才是信靠神」。先聽，再陪；肯定他繼續就醫，必要時協助轉介專業輔導；若聽見自傷或輕生的念頭，不要獨自處理，立即連結醫療與危機資源，並讓可信任的家人知道。"},{"id":"ISS04_8","t":"4:19「我們愛，因為神先愛我們」——人能不能先愛神？","r":"4:19；4:10；羅 5:8","ch":[4],"why":"這一題看似是神學家的辯論，其實決定了一個人怎樣過信仰生活。若信仰的起點是「我先愛神」，人就會一輩子檢查自己的愛夠不夠熱，越檢查越冷；若信仰的起點是「神先愛我」，人才能在跌倒後仍然回家。4:19 是全卷最短的一節，卻把順序擺正了；會眾席上那些服事到累垮、卻仍覺得自己愛得不夠的人，最需要聽見這個順序。","pos":[["【一】經文問的是甚麼","","<p>「我們愛，因為神先愛我們」（4:19）。原文 ἡμεῖς ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς，沒有受詞；拜占庭傳統加上 αὐτόν「他」，讀成「我們愛他」。4:10 先說「不是我們愛神，乃是神愛我們」，保羅也說「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了」（羅 5:8）。</p><p>經文要問的是：人能不能憑自己先愛神、先尋求神？還是一切對神的愛，都是被神先愛之後的回應？這牽涉到恩典與人的回應之間的關係。</p>"],["恩典優先說（奧古斯丁—改革宗）：人的愛完全是神恩典的果子","","<p>奧古斯丁與改革宗傳統強調，墮落的人「沒有尋求神的」（羅 3:11），若不是父吸引，「就沒有能到我這裡來的」（約 6:44）；連人對神的愛與信心，都是神在人心裡動工的結果。4:19 被讀成恩典優先的明證：我們的愛是第二個，他的愛是第一個。</p><p><strong>難處：</strong>若講得太機械，可能讓人覺得自己的回應毫無份量，甚至產生「既然一切都是神做的，我等著就好」的被動；也容易把討論帶進預定論的爭辯，模糊了 4:19 原本溫柔的語氣。</p>"],["先在恩典說（衛斯理—阿民念）：神先施恩，人得以自由回應","","<p>衛斯理與阿民念傳統同樣承認人不能憑自己先愛神，但強調神的「先在恩典」臨到每一個人，使人有能力回應或拒絕；人的愛是被釋放出來的真實回應，不是被機械地產生。4:19 被讀成：神先愛，使我們能愛，而我們的愛是真的出於我們。</p><p><strong>難處：</strong>這一說要面對「為甚麼有人回應、有人不回應」的追問，若過度強調人的選擇，可能讓人把得救的確據又掛回自己回應得好不好上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：兩大傳統都同意，人不能憑自己先愛神；4:19 的順序是「他先，我們後」——我們的愛是回應，不是門檻，也不是交換。至於恩典與人的回應如何運作，本講義不在本卷裁判加爾文與阿民念之爭。</strong></p><p>原文的留白很寬：「我們愛」沒有受詞。這不只是說我們愛神，也是說我們愛弟兄、愛那個難愛的人；被愛的人身上長出來的整個愛的能力，都從他先愛我們而來。下一節馬上把「愛神」和「愛弟兄」綁在一起（4:20--21）。</p><p>這使我們想起申命記的話：「耶和華專愛你們……並非因你們的人數多於別民」（申 7:7），「只因耶和華愛你們」（申 7:8）。從舊約到新約，神的愛的理由都在他自己。耶穌也對門徒說：「不是你們揀選了我，是我揀選了你們」（約 15:16）。321 說「焦點在耶穌」，在這一節看得最清楚：不盯著自己的愛有多少，而定睛在那位先愛我們的主。</p>"],["【四】這件事該不該影響你的信心","","<p>宗派的分歧不該動搖你的信心；兩邊都同意你不是靠自己先愛神而得救。</p><p>但該問：<strong>我的信仰是建立在「我愛他夠不夠」，還是「他怎樣先愛了我」？</strong>如果你覺得自己愛不出來，不要先逼自己；回到 4:10 與 4:19，讓他先愛你。愛不是先從你身上擠出來的，是先被倒進來，才流得出去。</p>"]],"con":[],"say":"本講義的立場：人不能憑自己先愛神；4:19 的順序是他先、我們後，我們的愛是回應而非門檻。恩典與回應的細節不在本卷裁判加爾文與阿民念之爭。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。","care":"會眾席上有服事多年、卻常常覺得自己愛主不夠而疲憊不堪的同工，也有覺得自己「冷淡了」、不敢再來的人。不要說「你要更愛主一點」作為唯一的答案。先帶他回到 4:19：他先愛。讓疲憊的人可以休息，讓冷淡的人知道門還開著；被愛足夠了，愛會自己長出來。"},{"id":"ISS04_9","t":"4:20「人若說我愛神，卻恨他的弟兄」——在教會受過傷、無法與某人和好的人怎麼辦？","r":"4:20--21；3:18；羅 12:18","ch":[4],"why":"4:20 是全卷最常被拿來壓受傷者的經文之一。在家裡被暴力對待的人、在教會被領袖羞辱或性騷擾的人、被同工背叛的人，常常聽見「你不肯和好，就是不愛神」「人若說我愛神卻恨弟兄，就是說謊話的」。於是有人被逼回到危險的關係，有人帶著羞恥離開教會。這一題直接關係到人的安全，必須講清楚約翰說的「恨」是甚麼，「愛」又是甚麼。","pos":[["【一】經文問的是甚麼","","<p>「人若說『我愛神』，卻恨他的弟兄，就是說謊話的；不愛他所看見的弟兄，就不能愛沒有看見的神」（4:20）。「愛神的，也當愛弟兄，這是我們從神所受的命令」（4:21）。約翰在上一章說愛要「在行為和誠實上」（3:18）；保羅說「若是能行，總要盡力與眾人和睦」（羅 12:18）。</p><p>經文要問的是：①約翰說的「恨」是甚麼？受了傷、心裡有痛、需要和某人保持距離，算不算恨？②「愛弟兄」是否等於必須和好、回到原來的關係？③教會裡發生傷害時，愛要怎樣行出來？</p>"],["無條件和好說：愛弟兄就要立刻原諒並恢復關係","","<p>有些講台把 4:20 與「先去同弟兄和好，然後來獻禮物」（太 5:24）、「七十個七次」（太 18:22）放在一起，教導信徒必須立刻原諒、恢復關係，否則就是不愛神；華人「家和萬事興」「家醜不外揚」的文化，更讓這種講法顯得天經地義。這一說的長處是認真看待愛與饒恕的命令，不讓人以受傷為理由長期懷恨、拒絕一切和解。</p><p><strong>難處：</strong>它把原諒與和好混為一談，忽略了和好需要對方的悔改：「他若懊悔，就饒恕他」（路 17:3）。它也忽略了安全：大衛在掃羅的槍下「逃走，躲避了」（撒上 19:10），耶穌也「不將自己交託他們」（約 2:24）。叫受害者為了屬靈理由回到危險裡，是把命令變成枷鎖，也常讓施害者不必負責。</p>"],["內心饒恕說：饒恕是內心的事，關係可以不恢復","","<p>另一種講法強調，饒恕是在神面前放下報復的權利，把審判交給神（「伸冤在我，我必報應」，羅 12:19），但不必然恢復關係；保羅與巴拿巴也曾「彼此分開」（徒 15:39）。這一說的長處是保護了受傷的人，承認有些關係在地上走不到和好。</p><p><strong>難處：</strong>若只停在內心，可能讓人把「我已經饒恕了」當成迴避一切面對與修復的理由，甚至把冷漠稱為饒恕；它也需要回答 4:21 的命令：愛弟兄，仍然要有某種行動的樣子，即使那樣子是在遠處為他禱告、不以惡報惡。</p>"],["誠實的愛說：愛是命令，但愛在真理與安全中行出","","<p>這一說認為，4:20 的「恨」是持續的敵意——心裡決定不再願意對方好，甚至願他不存在（參 3:15）；受了傷、需要距離、設下界線，不等於恨。愛是命令，但愛要「在行為和誠實上」（3:18）：誠實的愛承認傷害是真的，不假裝危險的人已經安全；原諒可以交給神，和好卻需要對方真實的悔改，也需要安全與時間。</p><p><strong>難處：</strong>這一說在實務上需要分辨力：甚麼時候是保護自己的界線，甚麼時候已經變成苦毒？受傷的人也需要被陪伴，才不會在合理的距離裡慢慢被恨吞吃。它不是一條規則，而是一條需要群體陪著走的路。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：愛弟兄是命令，但愛要在行為和誠實上；原諒交給神，和好需要對方的悔改與安全。受了傷、需要距離、為保護自己與孩子設下界線，不等於 4:20 的恨；不可用這一節要求受傷者回到不安全的關係。</strong></p><p>遭遇家暴、性侵、虐待的人，要鼓勵他向可信的人與相關機構求助；涉及刑事的，建議報警。教會要站在受害者這一邊，配合調查，不遮掩、不施壓、不以「家醜不外揚」「都是弟兄姊妹」為理由要求私了。愛弟兄，包括保護那個被傷害的弟兄。</p><p>受傷的人也許暫時沒有力氣靠近，卻仍可以在神面前，把那個人交給那「按公義審判人的主」（彼前 2:23），求神保守自己的心不被苦毒吞吃；這樣的禱告，本身已經是愛的開始。321 說謙卑是回到本位：不是讓人踐踏，是讓神作審判者，讓自己作被愛的人。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題不該讓你懷疑自己愛不愛神。如果你在教會或家裡受過傷，至今無法和某人和好，你不是說謊的人；約翰的「人若說」先是一面照自己的鏡子，不是一把拿來壓你的尺。</p><p>但可以問：<strong>我是在保護自己的安全，還是已經讓恨在心裡住下來？</strong>前者神明白，後者神願意醫治。你可以從一句很小的禱告開始：「主，我把他交給你。」神先愛了你，也會一步一步教你，在安全裡學會愛。</p>"]],"con":[],"say":"本講義的立場：愛弟兄是命令，但愛要在行為和誠實上；原諒交給神，和好需要悔改與安全，受傷者需要距離與界線不等於恨，不可被要求回到不安全的關係。家暴、性侵、虐待要鼓勵求助，涉及刑事建議報警。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。","care":"會眾席上可能有正在家暴中的姊妹、曾被教會領袖性騷擾而離開又回來的人、被同工背叛多年仍會夜裡驚醒的人。不要說「你不和好就是不愛神」「為了見證不要報警」「都過去了，回家吧」。先相信他、先確保他的安全；協助他聯絡可信的人與相關機構，涉及刑事的陪他報警；不追問細節，不要求立刻原諒，讓他知道教會站在他這一邊。"},{"id":"ISS05_1","t":"5:3「他的誡命不是難守的」——那為甚麼我覺得很難？","r":"5:3--4；太 11:30；羅 7:18--25","ch":[5],"why":"「他的誡命不是難守的」（5:3）是一句安慰，卻常常被聽成一句責備。許多真心跟隨主的弟兄姊妹，天天和同一個試探、同一個脾氣、同一段難愛的關係掙扎；他們讀到這一節，心裡會問：既然不難，為甚麼我做不到？是不是我根本沒有重生？這一題若講不清楚，一節要叫人得力的經文，會變成壓垮人的重擔，正與約翰的意思相反。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的」（5:3）。緊接著說理由：「因為凡從神生的，就勝過世界」（5:4）。會眾的經驗卻是另一回事：保羅自己也說「立志為善由得我，只是行出來由不得我」（羅 7:18）。</p><p><strong>經文問的是：「不是難守的」是甚麼意思？是說遵守很容易，還是說另有一種力量使人不被壓垮？</strong>關鍵在 βαρεῖαι（bareiai）這個字：它不是「困難」，是「沉重、壓垮人」，主責備文士把「難擔的重擔」捆在人肩上用的就是同一字根。</p>"],["容易說：真重生的人遵守起來不費力","","<p>有些講法把這一節讀成經驗的描述：真正從神生的人，遵守誡命是自然而然、毫不費力的；如果你覺得很難，可能是還沒有真正重生，或是有隱藏的罪。這派的優點是認真看待新生命的能力，不讓人把「做不到」當成理所當然。</p><p><strong>難處：</strong>約翰沒有說「容易」，說的是「不沉重」。同一封信承認「我們若說自己無罪，便是自欺」（1:8），也說「若有人犯罪，在父那裡我們有一位中保」（2:1）；保羅在羅 7 的掙扎，多數解經家也認為包含信徒的經歷。把費力當成沒有重生的證據，會把真心在走這條路的人推出門外，這不是約翰寫信的目的（紅線一）。</p>"],["對比說：比起律法主義的重擔，主的誡命是輕省的","","<p>另一種讀法把重點放在對比上：主說「我的軛是容易的，我的擔子是輕省的」（太 11:30），法利賽人加在人身上的規條才是重擔；約翰的誡命歸結為信與愛（3:23），比起數百條人的規矩，當然不沉重。這派的優點是貼近主的教導，也能幫助從律法主義教會出來的人得釋放。</p><p><strong>難處：</strong>這個對比是真的，但約翰自己給的理由不在誡命的數量，而在 5:4 的「因為」：遵守的人換了一個生命。只講對比，容易讓人以為「誡命少一點就不難」，愛仇敵、捨己這些命令其實一點也不少，也不輕鬆。</p>"],["新生命說：誡命沒有變輕，是背的人換了生命","","<p>第三種讀法緊跟上下文：誡命不壓垮人，「因為凡從神生的，就勝過世界」（5:4），而得勝的是「我們的信心」。同一個背包，給五歲的孩子背是重擔，給他父親背就不算甚麼；背包沒有變輕，是背的人不同了。這也解釋了掙扎：新生命是真的，舊的情慾也還在拉扯，所以有爭戰；但這場爭戰不會把從神生的人壓垮。</p><p><strong>難處：</strong>這個讀法需要小心，不可以變成「你覺得難，是因為你沒有好好用新生命」，又回到責備。它也不回答每一個具體的掙扎為甚麼拖這麼久；約翰給的是方向與確據，不是一張解決所有難處的時間表。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>βαρεῖαι 是「壓垮人」，不是「困難」；誡命不壓垮人，是因為從神生的人有了新的生命，並且接上了基督已經得的勝利（5:4）。覺得難，不等於沒有重生；常常反而說明你是真心在走。</p><p>321 在末端認出「讓耶穌作王」的意思：讓他作王，不是背起一副更重的軛，而是把自己交在一位不壓垮人的王手裡。他吩咐的，他也加力量。</p>"],["【四】這件事該不該影響你的信心","","<p>不必因為覺得難而懷疑自己的得救。真正該問的不是「我覺得容易嗎」，而是「我背的時候，是靠自己的腿力，還是靠那一位已經勝了世界的主」？保羅在「我真是苦啊」之後接的是「感謝神，靠著我們的主耶穌基督就能脫離了」（羅 7:24--25）。</p>"]],"con":[],"say":"本講義的立場：5:3 的「不是難守的」原文是「不壓垮人」，不是「容易」；理由在 5:4——從神生的人有新生命，並接上基督的勝利。覺得難不等於沒有重生，掙扎的人要回到中保那裡，不是被定罪。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。","care":"席上一定有人帶著長年的掙扎來：一位戒不掉色情的弟兄、一位一再對孩子發脾氣的母親、一位很想原諒卻還在痛的姊妹。不要對他說「不難啊，是你不夠愛神」。陪他讀 5:3--4 和 2:1，承認路是真的難走，也確認那壓不垮他的力量是真的。涉及成癮或長期的情緒困擾，鼓勵他找牧者同行，也尋求專業協助。"},{"id":"ISS05_2","t":"5:6「藉著水和血而來」——是洗禮與十架、出生與受死，還是聖禮？","r":"5:6--8；約 19:34","ch":[5],"why":"「這藉著水和血而來的，就是耶穌基督」（5:6）是全卷最難解的一句之一。不同的讀法會把講台帶往不同方向：有人講成聖禮神學，有人講成耶穌的出生，有人連到十字架上流出的血和水。會眾常被不同講員的說法弄得困惑，甚至以為這是宗派之爭的關鍵。這一題要把各讀並陳，並把焦點拉回約翰真正要守住的那一件事：耶穌基督是真實受洗、也真實流血受死的那一位。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「這藉著水和血而來的，就是耶穌基督；不是單用水，乃是用水又用血」（5:6）。接著說：「作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一」（5:8）。</p><p><strong>經文問的是：「水」和「血」指甚麼？為甚麼約翰特別強調「不是單用水」？</strong>ἐλθών（elthōn）是不定過去式，指過去一次的「來」；而「不是單用水」像是在反駁某一種只承認一半的講法。</p>"],["洗禮與十架說：耶穌受洗與受死","","<p>水指耶穌在約旦河受洗，血指他在十字架上流血。照教會的傳統，愛任紐記載克林妥一類的教師主張「基督」在受洗時降在耶穌身上，受難以前就離開了；若是如此，受死的只是一個普通人。約翰說「不是單用水，乃是用水又用血」，正好對著這種講法：受了洗的那一位，也是死在十架上的那一位。</p><p><strong>難處：</strong>這個背景是從教父資料推回去的，信中沒有點名克林妥；而且「水」指受洗，需要讀者自己補上。不過它最能解釋「不是單用水」的語氣，與 4:2「耶穌基督是成了肉身來的」也一致。</p>"],["出生與受死說：真實的肉身","","<p>水指人出生時的羊水，血指受死；整句強調耶穌從出生到受死都是真實的人，對著那些否認基督有真肉身的人（4:2）。這派的優點是緊扣全卷對「成了肉身」的強調。</p><p><strong>難處：</strong>古代文獻少用「水」指出生；而且這一讀解釋不了為甚麼要強調「不是單用水」——否認肉身的人通常連出生也一起否認，不會只承認一半。</p>"],["聖禮說與約 19:34 說","","<p>有些傳統把水讀成洗禮、血讀成聖餐，說基督今天藉著聖禮臨到教會；也有人連到十字架上「隨即有血和水流出來」（約 19:34），約翰在那裡也強調親眼見證。兩者都看見了約翰著作中水與血的豐富意象。</p><p><strong>難處：</strong>聖禮說與不定過去式「來」不合，那是過去一次的事件，不是教會不斷舉行的禮儀；5:8 的「水和血」作見證，或可帶著聖禮的回聲，但不是 5:6 的第一層意思。約 19:34 次序相反，是一個事件，這裡是兩個記號；它比較像回聲，不是解答。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>以洗禮與十架說為主，約 19:34 是它在約翰福音裡的回聲：耶穌基督是受了洗的那一位，也是真實流了血、死了的那一位；不可以把「基督」和釘十字架的耶穌拆開。</p><p>聖禮的意義可以在別處講，但不從 5:6 建立聖禮神學；這節經文要守住的不是哪一種禮儀，是十字架的真實。沒有血，就沒有挽回祭（4:10），也就沒有我們的永生。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題的解法有好幾種，忠心的解經家看法不同，你不必因為無法確定「水」的意思而不安。但約翰要守住的那一件事不容含糊：為我們死的，就是神的兒子本身。這件事該影響你的信心——它是你得救的根基。</p>"]],"con":[],"say":"本講義的立場：5:6 的水與血以耶穌受洗與受死為主讀，約 19:34 是回聲；重點是受洗的與受死的是同一位耶穌基督，十字架是真實的。不從這一節建立聖禮神學，也不以此分宗派高下。","care":"席上有從不同宗派來的弟兄姊妹，有人重視聖禮，有人習慣象徵的理解。不要藉這一節嘲笑別的傳統，也不要讓會眾以為讀不懂這一節就讀不懂聖經。對剛信主的人，只要說清楚一件事：為你死的那一位，是真實的神的兒子；他流的血，是真的為你流的。"},{"id":"ISS05_3","t":"5:7--8「約翰短句」——三一論靠這一節嗎？","r":"5:7--8；太 28:19；林後 13:14","ch":[5],"why":"有些弟兄姊妹讀過英王欽定本或其他較舊的譯本，發現 5:7--8 多了一段「在天上作見證的是父、道與聖靈」，就以為和合本刪了聖經，或以為三一論只靠這一節。也有人知道這段不在早期抄本中，就輕看用欽定本的人。這一題同時關乎聖經的可信、三一論的根基，以及弟兄姊妹之間的尊重，必須誠實又溫柔地講。","pos":[["【一】經文問的是甚麼","","<p>和合本 5:7--8 說：「並且有聖靈作見證，因為聖靈就是真理。作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一」（5:7--8）。較晚的某些譯本在這裡多了一段，說在天上作見證的是父、道與聖靈，這三樣為一，在地上作見證的是聖靈、水與血。這一段稱為「約翰短句」。</p><p><strong>經文問的是：這段話是約翰原本寫的嗎？三位一體的教義是不是建立在這一節上？</strong></p>"],["公認經文說：應當保留","","<p>有些弟兄姊妹堅持使用公認經文與欽定本傳統，認為神保守了教會長期使用的經文；約翰短句在拉丁教會流傳了一千年，又在宗教改革時期進入印本，不應輕易拿掉。這派的優點是敬重聖經，警覺任何輕看神話語的態度，也提醒我們歷代教會使用經文的歷史。</p><p><strong>難處：</strong>抄本的事實很清楚：這段話不見於早期的希臘文抄本，第四世紀的希臘教父在激烈的三一論爭辯中也從未引用；它先出現在拉丁著作與後期的拉丁譯本抄本中，希臘文只見於少數很晚的抄本，有的還寫在旁註。十六世紀伊拉斯謨在第三版印本收入，由此進入公認經文與欽定本。敬重聖經，正是要尊重神怎樣把經文傳下來。</p>"],["經文鑑別說：原文沒有，應當不收","","<p>現代經文鑑別一致不收這段話，和合本也沒有收；多數現代譯本或略去，或加註說明。這派的優點是忠於早期抄本，誠實面對證據，也避免讓三一論倚靠一個有問題的經文。</p><p><strong>難處：</strong>這個立場本身沒有錯，難處在態度：有人藉此嘲笑讀欽定本的弟兄姊妹「無知、守舊」，或給人「聖經不可靠」的印象。其實經文鑑別的結果，正好說明新約抄本極其豐富，連一段這樣的插入都能被辨認出來。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>約翰短句不是約翰原本寫的，和合本沒有收，是忠於早期抄本，不是刪改聖經。三一論不需要倚靠這一句：父、子、聖靈的名並列在「奉父、子、聖靈的名給他們施洗」（太 28:19），也在「願主耶穌基督的恩惠、神的慈愛、聖靈的感動常與你們眾人同在」（林後 13:14）的祝福裡；整本新約都在講父差子、子顯明父、聖靈為子作見證。</p><p>用欽定本傳統讀經的弟兄姊妹，愛主、敬重聖經的心是真的；我們不嘲笑，只是誠實說明抄本的事實。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三一真理的根據比一節經文寬廣得多，教會在尼西亞與君士坦丁堡確認這信仰的時候，根本沒有用到這段話。反過來，知道聖經抄本經得起這樣仔細的檢驗，應當讓你更信靠神所保守的話。</p>"]],"con":[],"say":"本講義的立場：約翰短句不見於早期希臘文抄本，後期進入拉丁傳統與公認經文，和合本未收；三一論有整本聖經的根據（太 28:19；林後 13:14），不靠這一句。對使用欽定本傳統的弟兄姊妹，要尊重，不嘲笑。","care":"席上可能有讀欽定本長大的長輩，也有在網路上看到「和合本刪經文」而不安的年輕人。對長輩，先肯定他敬重聖經的心，再慢慢說明抄本的事實；對年輕人，讓他看見新約抄本的豐富正是聖經可信的證據。不要在講台上取笑任何一個譯本的讀者，也不要讓譯本之爭分裂小組。"},{"id":"ISS05_4","t":"5:10「不信神的，就是將神當作說謊的」——懷疑就是不信嗎？","r":"5:10；可 9:24；猶 22","ch":[5],"why":"「不信神的，就是將神當作說謊的」（5:10）是重話，約翰在全卷多次用「說謊」來描寫人與神的關係。有些心裡有疑問的弟兄姊妹聽到，會以為自己的每一個問號都是在指控神說謊，於是不敢再問、不敢再說，把疑問藏起來，最後連信仰一起藏起來。也有講台用這一節壓制問題。這一題要分清楚：刻意的拒絕與掙扎中的疑問，是兩回事。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「信神兒子的，就有這見證在他心裡；不信神的，就是將神當作說謊的，因不信神為他兒子作的見證」（5:10）。</p><p><strong>經文問的是：約翰說的「不信」是甚麼樣的不信？一個心裡有疑問、卻仍然想信的人，是不是也在「將神當作說謊的」？</strong>οὐ πεπίστευκεν（ou pepisteuken）是完成式，描寫一種已經定下來的立場，不是一時的疑問。</p>"],["一切疑問都是不信說","","<p>有些講法把信心和疑問看作截然對立：信就是毫不懷疑，有疑問就是不信，就是把神當作說謊的。這派的優點是認真看待神的話，不讓懷疑成為一種時髦的姿態。</p><p><strong>難處：</strong>聖經裡滿了帶著疑問來到神面前的人：約伯、詩篇的作者、施洗約翰在監牢裡差人問「那將要來的是你嗎」。那位父親喊著說：「我信！但我信不足，求主幫助」（可 9:24），主沒有拒絕他，反而醫治了他的孩子。把一切疑問都當成不信，會把誠實的人逼成假裝的人。</p>"],["定意拒絕說：指聽過見證卻刻意拒絕的人","","<p>從上下文看，約翰指的是聽過神為兒子作的見證、卻定意拒絕的人，特別是那些否認耶穌是基督的教師（2:22）；完成式強調的是一種已經定下來的立場。對正在掙扎的人，聖經的態度是另一種：「有些人存疑心，你們要憐憫他們」（猶 22）。這派緊貼文法與處境。</p><p><strong>難處：</strong>這一讀需要小心，不能讓人把「我只是有疑問」變成永遠不作決定的藉口。疑問可以被帶到神面前，但約翰也在呼喚人：神的見證比人的更大（5:9），總要回應。</p>"],["疑問的分辨說：理智、情緒與心意三種疑問","","<p>還有一種牧養上的讀法，把疑問分成三種：理智上的問題（聖經可信嗎？神為甚麼允許苦難？），情緒上的疑問（我感覺不到神，是不是他不在？），以及心意上的抗拒（我知道，卻不想讓他作主）。約翰在 5:10 對付的是第三種；前兩種需要的是陪伴、教導與時間。這派的優點是讓教會懂得用不同的方式回應不同的人。</p><p><strong>難處：</strong>三種疑問在真實生命裡常常糾纏在一起，不容易分得乾淨；有時理智的問題底下藏著一個受傷的經歷，有時情緒的低落其實與憂鬱有關，需要醫療的幫助。分類是為了更好地陪伴，不是為了給人貼標籤。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>5:10 指的是聽過神的見證、卻定意拒絕的立場，不是一個人在信心路上的疑問。懷疑可以是信心的一部分——把問題帶到神面前，本身就是一種信任。</p><p>教會要成為可以問問題的地方。疑問被壓下去，不會消失，只會躲起來；被帶到光中，常常成為信心長深的開始。</p>"],["【四】這件事該不該影響你的信心","","<p>不必因為有疑問就以為自己把神當作說謊的。要問的是方向：我的疑問是讓我轉身離開神，還是讓我更靠近他、向他求問？多馬說「我的主！我的神！」（約 20:28）之前，也經過了一週的疑惑；主是親自來找他的。</p>"]],"con":[],"say":"本講義的立場：5:10 的「不信」是聽過神為兒子的見證卻定意拒絕的立場（完成式），不是掙扎中的疑問；對存疑心的人要憐憫（猶 22）。教會要讓人可以把疑問帶到神面前。","care":"席上有讀了一些書、心裡起了許多問號的大學生，有經歷重大失落後問「神在哪裡」的人，也有長年信主卻偶爾懷疑的長輩。不要對他們說「有疑問就是不信」。邀請他們把問題說出來，陪他們一起讀經、一起禱告；有些問題可以約時間慢慢談，必要時推薦好的書與可信的牧者。"},{"id":"ISS05_5","t":"5:12「沒有神的兒子就沒有生命」——那沒有聽過福音的人呢？","r":"5:11--12；約 14:6；徒 4:12；羅 2:14--16","ch":[5],"why":"「人有了神的兒子就有生命，沒有神的兒子就沒有生命」（5:12）是福音最清楚的一句，也常被拿來問最痛的問題：那些沒有聽過福音的人呢？我那位一輩子沒有機會聽福音的祖母呢？在華人家庭裡，這不是抽象的神學，是每一場喪禮、每一次清明時心裡的痛。這一題要守住福音的獨一，也要守住神的公義與憐憫。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「這見證就是神賜給我們永生；這永生也是在他兒子裡面。人有了神的兒子就有生命，沒有神的兒子就沒有生命」（5:11--12）。主耶穌也說：「若不藉著我，沒有人能到父那裡去」（約 14:6）。</p><p><strong>經文問的是：5:12 是在替沒有聽過福音的人宣判嗎？還是在對已經信的人講確據？</strong>下一節立刻說明：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。</p>"],["排他說：未明確信基督的都無份","","<p>許多福音派傳統認為，救恩只在基督裡，而且需要聽見並相信福音；所以沒有聽過的人沒有得救的盼望。這派的優點是認真看待福音的獨一（徒 4:12），也帶來宣教的急迫感：「未曾聽見他，怎能信他呢」（羅 10:14）。</p><p><strong>難處：</strong>這個立場若講得太快、太冷，容易讓人在喪禮上替具體的人宣判，彷彿我們知道神在每一個人生命最後的時刻做了甚麼。聖經也說神「願意萬人得救」（提前 2:4），審判是交在神手裡的。</p>"],["普遍啟示說：神照人所得的光審判","","<p>有些解經家根據羅 2:14--16 與羅 1:20，認為神按著人所領受的光審判；沒有聽過福音的人，神有他公義的方式，救恩仍是因基督的工作，只是人未必明確知道他的名。這派的優點是看見神的公義與憐憫，也誠實承認聖經沒有把每一個問題都說盡。</p><p><strong>難處：</strong>羅 2 的主要目的是證明人人都在罪下、需要福音，不是提供另一條得救的路；這一讀若推得太遠，會削弱宣教的必要，也和 5:12 清楚的界線產生張力。</p>"],["交託說：福音是獨一的，審判交給神","","<p>第三種態度不想替神回答聖經沒有回答的問題：救恩只在基督裡，這是清楚的；神怎樣對待那些沒有機會聽福音的人，聖經沒有詳細說明，交在「審判全地的主豈不行公義嗎」（創 18:25）的那一位手裡。我們能做的，是把福音傳給還活著的人。</p><p><strong>難處：</strong>有人會覺得這是在迴避問題；它確實沒有給出一個讓人完全滿意的答案。但它誠實地停在聖經停下來的地方，也把焦點放回我們的責任上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>福音是獨一的——生命在神的兒子裡面，「除他以外，別無拯救」（徒 4:12）；但 5:12 在本處是對信的人講確據，不是一張替別人宣判的名單。神如何對待沒有聽過福音的人，交在公義又憐憫的神手裡。</p><p>這個問題最該帶出的，不是猜測，是行動：還活著、還沒聽過的人，就在我們身邊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你對自己的得救不確定；5:12 本來就是為了叫你確定。若你為已經過世、未信的家人難過，可以把他交在神手裡：神比你更愛他，也比你更公義。你可以把這份愛，轉成為還活著的家人禱告、傳福音的力量。</p>"]],"con":[],"say":"本講義的立場：5:12 守住福音的獨一——生命在神的兒子裡面；但它在本處是對信者講確據，不是替沒聽過福音或已過世的人宣判。他們的審判交在公義又憐憫的神手裡；我們的責任是把福音傳給還活著的人。","care":"席上有剛辦完未信父母喪禮的人，有每年清明心裡就痛的人，也有在宣教禾場掛心百姓的人。不要對喪親的人說「你父親一定在地獄」，也不要輕率保證「他一定在天堂」。陪他哭（約 11:35），把逝者交在神手裡，並在合適的時候，邀請他為還活著的家人一起禱告。"},{"id":"ISS05_6","t":"5:13 可以「知道」自己得救嗎？確據與驕傲的界線在哪裡？","r":"5:13；3:19--20；林前 10:12","ch":[5],"why":"「要叫你們知道自己有永生」（5:13）是全卷的終點。可是在華人教會裡，有兩種人最怕這一節：一種人從來不敢說「我知道」，覺得那是驕傲；另一種人說得太快，把確據變成可以隨便活的保證。前者活在不安裡，後者活在危險裡。這一題觸到救恩的確據，也觸到全卷立場 〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉 的落點，必須讓不安的人得安息，也讓放縱的人被提醒。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。福音書說「記這些事要叫你們信耶穌是基督」（約 20:31），書信說要叫信的人「知道」。εἰδῆτε（eidēte）出自 οἶδα（oida），是確實的知道。</p><p>但保羅也說：「自己以為站得穩的，須要謹慎，免得跌倒」（林前 10:12）。<strong>經文問的是：人可以確實知道自己得救嗎？確據和驕傲的界線在哪裡？</strong></p>"],["不可知說：今生無人能確知自己得救","","<p>有些傳統認為，人在今生不能確知自己必定得救，說「我知道」是僭越；要一生敬畏戰兢，直到最後。這派的優點是嚴肅看待罪與恆忍，提防廉價的恩典。</p><p><strong>難處：</strong>這與約翰寫信的目的正好相反：他寫信就是「要叫你們知道」。長期不敢確定，會讓人把信仰變成一場永遠考不完的試，也讓人難以從愛出發去愛人（4:18）。</p>"],["一次決志說：舉過手就一定得救","","<p>另一個極端把確據完全放在某一次決志上：只要曾經禱告接受主，不論之後怎樣活，都可以確定得救。這派的優點是強調救恩是恩典，不靠行為。</p><p><strong>難處：</strong>約翰給的確據有三重記號：信耶穌是神的兒子（5:1、13）、遵守他的命令（2:3）、愛弟兄（3:14）；這些不是得救的條件，是生命的記號。只看一次決志、不看生命方向，會把 5:13 從 2:1「是要叫你們不犯罪」的方向中切出來。</p>"],["見證與記號說：根據在神，記號在生命","","<p>第三種讀法跟著上下文：確據的根據是神為他兒子作的見證（5:9--11）——「人有了神的兒子就有生命」（5:12）；生命的記號（信、順服、愛）是確據的佐證，不是根據。所以良心不安時，「神比我們的心大」（3:20）；跌倒時，有中保（2:1）。</p><p><strong>難處：</strong>這一讀需要講得平衡：說太多記號，人又會去量自己的表現；說太少，又會變成放縱。牧養上要依對象調整重點。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>可以知道，而且神要我們知道；根據在神的見證與神的兒子，不在自己的表現。確據使人謙卑，不使人驕傲：知道有永生的人倚靠他，自以為站得穩的人倚靠自己。</p><p>林前 10:12 警告的是倚靠自己的人，不是倚靠神見證的人；落點與全卷立場相同——方向是不犯罪，跌倒時有中保（2:1）。</p><p>所以確據與驕傲的界線，不在說不說「我知道」，而在「我知道」的根據放在哪裡。根據放在自己的表現，人就會在好日子驕傲、在壞日子絕望；根據放在神的兒子，人在好日子感恩、在壞日子仍然站得住，也更願意彎下腰去扶起還在掙扎的人。</p>"],["【四】這件事該不該影響你的信心","","<p>這件事該問，也該問清楚：「我知道自己有永生嗎？」答案不在你今天的感覺，在你有沒有神的兒子。若你仍在跌倒中掙扎，回到 2:1；若你的心責備你，回到 3:20。確據不是你抓得多緊，是他抓得多緊（約 10:28）。</p>"]],"con":[],"say":"本講義的立場：5:13 要信的人「知道」自己有永生；根據在神為兒子的見證，生命的記號只是佐證。確據使人倚靠神而謙卑，不是放縱或驕傲。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。","care":"席上會有決志過許多次仍不確定的人，有因強迫思維反覆懷疑得救的人，也有說「我早就得救了」卻活得很隨便的人。對前兩種人，溫柔地陪他讀 5:11--13 與 3:20，必要時協助他尋求輔導；對後一種人，誠實地提醒 2:1 的方向。不要說「你感覺不到，就是沒有得救」，也不要說「決志過就隨便你怎麼活」。"},{"id":"ISS05_7","t":"5:14--15「照他的旨意求，他就聽我們」——禱告沒有應允是信心不夠嗎？","r":"5:14--15；3:22；太 26:39；林後 12:8--9","ch":[5],"why":"「我們若照他的旨意求甚麼，他就聽我們」（5:14）是極大的應許，也常被誤用。在成功神學的影響下，有人說只要信心夠、宣告夠，就一定得著；禱告沒有照所求的成就，就是信心不夠、有罪沒認清。這種話最傷的，是為病中家人禱告多年、最後仍失去他的人。這一題關乎紅線七，必須講清楚「照他的旨意」，也要讓禱告重新成為孩子對父親的信任。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「我們若照他的旨意求甚麼，他就聽我們，這是我們向他所存坦然無懼的心。既然知道他聽我們一切所求的，就知道我們所求於他的，無不得著」（5:14--15）。3:22 也說：「我們一切所求的，就從他得著；因為我們遵守他的命令」（3:22）。</p><p><strong>經文問的是：「無不得著」是無條件的應許嗎？禱告沒有照我們所想的成就，是信心出了問題嗎？</strong>παρρησία（parrēsia）「坦然無懼」原指公民在議會放膽直言的權利；這是孩子在父親面前開口的自由，不是操控父親的權柄。</p>"],["成功神學說：有信心地宣告，就一定得著","","<p>有些講法認為，神已經應許了健康、富足、順利；只要用信心宣告、不懷疑，就一定照所求的得著。沒有得著，是信心不夠，或是有罪沒有對付。這派的優點是相信神是好的，相信禱告真有能力。</p><p><strong>難處：</strong>這一讀把「照他的旨意」這個條件拿掉了。主耶穌在客西馬尼園求杯離開，最後說「然而，不要照我的意思，只要照你的意思」（太 26:39）；保羅三次求去掉那根刺，得著的回答是「我的恩典夠你用的」（林後 12:9）。他們都不缺少信心。本講義不採這一讀（紅線七）。</p>"],["限制條件說：神只成全合他旨意的求","","<p>另一讀把「照他的旨意」看成一個限制條件：神只成全合他旨意的禱告，其他的他不必成全。這派的優點是忠於經文的條件，守住神的主權。</p><p><strong>難處：</strong>這個讀法若講得太冷，會變成一句免責條款：禱告沒有應允，就說「不是神的旨意」，然後不再多說，讓人覺得禱告只是碰運氣。</p>"],["塑造說：禱告把我們的意願對準他的旨意","","<p>第三讀看重 3:22 的上下文：遵守命令、行他所喜悅之事的人，一切所求的就得著，因為他的所求已經被神的心塑造。禱告不只是把清單交給神，也是讓神改變我們想要甚麼。5:15 的 ἔχομεν（echomen）是現在式：所求的已經在他手中，何時、用甚麼方式給，由他決定。</p><p><strong>難處：</strong>這一讀要避免變成「你沒有得著，是因為你還不夠被塑造」，又回到責備。塑造是一生的過程，不是一張成績單。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>取限制條件說與塑造說合讀：禱告的條件是「照他的旨意」，而禱告本身也在把我們的心對準他的旨意。禱告沒有照我們所想的成就，不等於信心不夠，也不等於神沒有聽。</p><p>主自己在客西馬尼園示範了這樣的禱告：把心裡真實的願望說出來（「求你叫這杯離開我」），然後把結果交給父（「只要照你的意思」）。這不是軟弱的禱告，是兒子最大的坦然。</p>"],["【四】這件事該不該影響你的信心","","<p>禱告的結果不該決定你是否被神愛。你可以繼續求，也可以哭著求；你可以問神為甚麼。但不要讓任何人告訴你，所愛的人沒有好起來是你的錯。神的恩典夠你用，在軟弱中他的能力顯得完全。</p>"]],"con":[],"say":"本講義的立場：5:14 的條件是「照他的旨意」；禱告把我們的心對準他的旨意，所求的在他手中，何時、如何給由他決定。禱告沒有照所想成就，不等於信心不夠。本講義不採成功神學。","care":"席上有為母親禱告三年、母親仍然離世的人，有為不孕禱告多年的夫妻，有長年病痛的人。不要對他們說「你信心不夠」「一定有罪沒認清」「再多宣告就好了」。陪他們讀太 26:39 與林後 12:9，承認失望是真的，也讓他們知道神沒有離開。長期哀傷或憂鬱的人，鼓勵他們找牧者同行，也尋求專業協助。"},{"id":"ISS05_8","t":"5:16--17「至於死的罪」是甚麼罪？可以不為某人禱告嗎？","r":"5:16--17；可 3:28--29；來 6:4--6；徒 5:1--11","ch":[5],"why":"這是本章最需要牧養溫度的一題。「有至於死的罪，我不說當為這罪祈求」（5:16）讓許多人在深夜睡不著：有家人自殺或在罪中過世的人，擔心所愛的人犯了這罪；有人害怕自己曾經犯過不可赦免的罪，從此不敢禱告；也有人拿這節經文來判斷別人「沒救了」。這一題關乎紅線八——任何人都不可替另一個人下這個結論；而約翰真正的重心，是「就當為他祈求」。","pos":[["【一】經文問的是甚麼","","<p>約翰說：「人若看見弟兄犯了不至於死的罪，就當為他祈求，神必將生命賜給他；有至於死的罪，我不說當為這罪祈求。凡不義的事都是罪，也有不至於死的罪」（5:16--17）。</p><p><strong>經文問的是：「至於死的罪」是甚麼？約翰是在禁止我們為某些人禱告嗎？我們能不能、該不該判斷某個人犯了這罪？</strong>先注意這一段的重心：約翰用整整一句話叫我們代禱，對至於死的罪只說「我不說當為這罪祈求」，沒有下禁令。</p>"],["褻瀆聖靈說","","<p>有人把至於死的罪等同於主所說的：「凡褻瀆聖靈的，卻永不得赦免」（可 3:29）。這派的優點是用聖經解釋聖經，連到同一類「不得赦免」的語言。</p><p><strong>難處：</strong>約翰沒有用這個詞。福音書的背景是法利賽人親眼看見聖靈的工作，卻刻意把它說成鬼的工作，是一種硬心到底的拒絕，不是一時的失言或軟弱。害怕自己犯了這罪的人，本身就說明他的心仍向著神。</p>"],["背道說","","<p>有人連到希伯來書：蒙了光照以後「若是離棄道理，就不能叫他們重新懊悔了」（來 6:4--6）。至於死的罪是完全、定意地離棄基督。</p><p><strong>難處：</strong>希伯來書講的是整體的離棄，約翰這裡說的卻是「看見」某一種罪；而且我們看不透人心，無從判斷一個人是否已經到了不能回頭的地步。</p>"],["肉身之死說","","<p>有人認為指導致肉身死亡的管教，例如亞拿尼亞和撒非喇欺哄聖靈而死（徒 5:1--11），或林前 11:30 不按理吃喝主餐的人。這派的優點是有具體的新約例子。</p><p><strong>難處：</strong>本章的「生命」一直指永生（5:11--13），「死」恐怕也不只是肉身；而且即使是肉身的管教，也不等於永遠的定罪。</p>"],["公開離棄真道說","","<p>在約翰的處境裡，至於死的罪可能指那些離開教會、否認耶穌是基督、拒絕神為子作見證的人（2:19、22；5:10）。這一讀最貼近本卷的上下文。</p><p><strong>難處：</strong>這是從上下文推論，約翰自己沒有點明；而且即使如此，約翰也沒有授權讀者替任何一個具體的人下結論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>約翰沒有說是哪一種罪，講台也不說。這一段的重心是「就當為他祈求」（5:16）。約翰對至於死的罪只說「我不說當為這罪祈求」，沒有禁止；既然我們看不透人心，就該繼續為人祈求。</p><p>任何人都不可宣判另一個人犯了至於死的罪，包括已經過世的人。人在生命最後的時刻與神之間發生了甚麼，我們不知道；「審判全地的主豈不行公義嗎」（創 18:25）。自殺離世的人，教會不替他下永遠的結論，而是把他交在公義又憐憫的神手裡，並擁抱留下來的家人。</p><p>會擔心自己犯了這罪的人，本身就說明他的心仍向著神；經文所描寫的是硬心的拒絕，不是痛悔中的害怕。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你活在恐懼裡。如果你怕自己犯了不得赦免的罪，請記得：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（1:9）；主也說：「到我這裡來的，我總不丟棄他」（約 6:37）。如果你為過世的家人掛心，你可以把他交給比你更愛他的神，把你的眼淚也交給他。這類恐懼若反覆出現、停不下來，請告訴牧者，也尋求專業協助；那不是信心不夠，是你值得被好好陪伴。</p>"]],"con":[],"say":"本講義的立場：約翰沒有說至於死的罪是哪一種，講台也不說；重心是「就當為他祈求」，約翰並未禁止代禱。任何人都不可宣判別人（包括已過世的人）犯了這罪；擔心自己犯了的人，心仍向著神。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。","care":"席上可能有家人自殺離世的人，有親人在罪中過世的人，也有夜裡害怕自己犯了不得赦免之罪的人。對喪親的人，不說「他可能犯了至於死的罪」，只陪他哭，把逝者交給神，並在哀傷沉重時連結牧者與哀傷輔導。對害怕的人，告訴他：會怕，正說明你的心向著神；若恐懼反覆糾纏，邀請他找牧者談，也鼓勵他尋求專業協助。若他自己有輕生的念頭，立即陪他連結危機資源與醫療。"},{"id":"ISS05_9","t":"5:21「遠避偶像」——今日的偶像是甚麼？","r":"5:21；西 3:5；徒 19:23--27","ch":[5],"why":"「小子們哪，你們要自守，遠避偶像」（5:21）是全卷最後一句。有人只把它講成別人家的神像，拿來羞辱拜拜的家人；有人把一切文化、娛樂都說成偶像，叫人厭世；也有人覺得今天沒有偶像的問題。這一題要讓這句話先照亮聽的人自己，也關乎紅線九：遠避偶像不是逃離世界，而是在世界中讓真神坐在他的位子上。","pos":[["【一】經文問的是甚麼","","<p>約翰在說完「這是真神，也是永生」（5:20）之後，接著說：「小子們哪，你們要自守，遠避偶像」（5:21）。全信沒有問安、沒有祝福，就在這一句停住。</p><p>以弗所是亞底米女神的城，銀匠底米丟曾說保羅的教導使「大女神亞底米的廟也要被人輕忽」（徒 19:27）。<strong>經文問的是：約翰說的「偶像」指甚麼？今天的偶像又是甚麼？</strong></p>"],["字面神像說","","<p>偶像指實際的神像與相關的宗教活動：以弗所的亞底米廟、行會的拜神宴席、祭偶像之物，都是信徒每天要面對的事。保羅也說「你們要逃避拜偶像的事」（林前 10:14）。這一讀最貼近「偶像」在新約的通常用法。</p><p><strong>難處：</strong>本卷其他地方沒有提到拜偶像的問題；只讀成字面神像，容易讓今天沒有拜神像的信徒以為這句話與自己無關，或把焦點放在別人身上。</p>"],["假基督說","","<p>緊接著 5:20「那位真實的」，偶像就是一切不是真神的「神」，包括假教師所傳那位不是成了肉身的基督。約翰全卷都在分辨真假，最後一句收在「遠避」一切假的。這一讀與上下文扣得最緊。</p><p><strong>難處：</strong>「偶像」一詞在新約通常指實際的神像，把它完全讀成假教訓，需要較多推論。</p>"],["一切取代神的東西說","","<p>保羅說「貪婪就與拜偶像一樣」（西 3:5）。偶像不只是神像，也是一切坐上神位子、使我們依靠、懼怕、獻上自己的東西：金錢、業績、子女、別人的眼光，甚至自己的屬靈形象。這一讀幫助今天的人看見自己。</p><p><strong>難處：</strong>這是延伸應用，不是約翰的第一層意思；若講得太寬，又會把一切文化、娛樂都說成偶像，叫人厭世（紅線九）。受造之物本身是好的（提前 4:4），問題在它坐上了哪一個位子。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：</strong>由近而遠讀成三層：經文直接對照的是 5:20 的真神，偶像是一切假的神；在以弗所，它包括亞底米廟；在今天，它包括一切坐上神位子的東西。遠避偶像，是先認識那位真實的；認識了真神，假的就坐不穩了。</p><p>遠避偶像不是逃離世界。主禱告說「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）。工作、家庭、藝術與文化本身不是偶像；它們坐上神的位子時才是。</p>"],["【四】這件事該不該影響你的信心","","<p>這件事該影響你的生活，但方式不是恐懼，是轉向。不必列一張長長的禁令清單，先問一個問題：最近甚麼東西最讓我害怕失去？那裡，可能就是要讓給真神的位子。約翰用「小子們哪」開口，這是一位父親的提醒，不是審判官的宣判。</p><p>也記得約翰在說「遠避偶像」之前，先說了三次「我們知道」（5:18--20）：我們知道那惡者無法害我們，我們知道自己是屬神的，我們也知道神的兒子已經來到。遠避偶像的力量，不是來自我們的警覺有多高，是來自我們知道自己是誰的孩子、被誰保守著。被真神愛著的人，才捨得放下假神。</p>"]],"con":[],"say":"本講義的立場：5:21 的偶像由近而遠三層——5:20 真神的反面、以弗所的亞底米廟、今天一切坐上神位子的東西。遠避偶像是先認識真神，不是厭世，也不是羞辱拜偶像的家人。","care":"席上有家裡仍在拜拜、為此和家人關係緊張的人，有被業績與房貸壓得喘不過氣的人，也有從嚴格教會出來、被教導一切娛樂都是罪的人。不要藉這一節羞辱任何人的家人，也不要叫人離開他的崗位。陪他先找出自己心裡的偶像，再用愛與尊重活在家人中間。"}],"terrain":{"points":[[0.55,80,1,"親眼看過、親手摸過的",null],[1.25,18,8,"我們若說自己無罪，便是自欺","bot"],[1.35,88,9,"我們若認自己的罪，神是信實的","top"],[2.034,15,16,"今生的驕傲","bot"],[2.138,12,19,"他們從我們中間出去","bot"],[2.448,76,28,"你們要住在主裡面",null],[2.521,92,1,"你看父賜給我們是何等的慈愛","top"],[2.979,10,12,"不可像該隱","bot"],[3.312,72,20,"神比我們的心大",null],[3.952,96,10,"不是我們愛神，乃是神愛我們","top"],[4.667,90,4,"使我們勝了世界的，就是我們的信心",null],[5.095,98,13,"要叫你們知道自己有永生","top"]]},"tracks":[{"gk":"μένω","tr":"menō","gl":"住、常存、存在","code":"G3306","root":"μένω——留下、住下、持續存在；不是偶爾來訪，是長住。約翰一書用了二十四次，是新約書信中比例最高的書卷之一","ins":"μένω 是約翰一書最安靜、也最重要的一個字：不是來訪，是住下來。第一站，它先是一句宣稱：「人若說他住在主裡面，就該自己照主所行的去行」（2:6）——住，不是嘴上的地址。2:14 方向倒過來，是神的道住進少年人裡面：「神的道常存在你們心裡」。2:17 這個字走到永遠：「惟獨遵行神旨意的，是永遠常存」；可是 2:19 是谷底，有人沒有住下：「若是屬我們的，就必仍舊與我們同在」。2:24 給出住下的路：從起初所聽見的存在心裡，「你們就必住在子裡面，也必住在父裡面」；2:28 變成命令：「小子們哪，你們要住在主裡面」。3:14 是第一個翻轉——人也可能住錯地方：「沒有愛心的，仍住在死中」。3:24 第二個翻轉，住變成雙向：「遵守神命令的，就住在神裡面，神也住在他裡面」。終點在 4:16：「住在愛裡面的，就是住在神裡面，神也住在他裡面」。整條線從我說我住在他裡面，走到他住在我裡面——不出去，住下來，最後發現先搬進來的是他。","stops":[["2:6","人若說他住在主裡面，就該自己照主所行的去行",""],["2:14","神的道常存在你們心裡","top"],["2:17","惟獨遵行神旨意的，是永遠常存",""],["2:19","若是屬我們的，就必仍舊與我們同在","bot"],["2:24","你們就必住在子裡面，也必住在父裡面",""],["2:28","小子們哪，你們要住在主裡面","top"],["3:14","沒有愛心的，仍住在死中","bot"],["3:24","遵守神命令的，就住在神裡面，神也住在他裡面",""],["4:12","我們若彼此相愛，神就住在我們裡面",""],["4:16","住在愛裡面的，就是住在神裡面，神也住在他裡面","top"]]},{"gk":"ἀγάπη／ἀγαπάω／ἀγαπητός","tr":"agapē / agapaō / agapētos","gl":"愛、親愛的","code":"G26","root":"ἀγάπη——愛（名詞）；ἀγαπάω——愛（動詞）；ἀγαπητός——親愛的、被愛的。全卷名詞、動詞、形容詞合計五十二次","ins":"愛這個字在約翰一書出現五十多次，可是它真正的轉折只有一個：主詞換了。第一站，愛是人裡面要長成的東西：「愛神的心在他裡面實在是完全的」（2:5）。2:15 是谷底，愛可以愛錯對象：「不要愛世界和世界上的事」。3:1 約翰停下來驚嘆：「你看父賜給我們是何等的慈愛」——ποταπήν，哪一國來的愛。3:16 愛有了一個形狀：「主為我們捨命，我們從此就知道何為愛」；3:18 愛有了手腳：「不要只在言語和舌頭上，總要在行為和誠實上」。4:8 是全卷的宣告：「神就是愛」。4:10 是樞紐，也是這條線最大的翻轉：「不是我們愛神，乃是神愛我們」——愛的主詞從我們換成神。4:18 於是可以說「愛裡沒有懼怕」；4:19 是終點：「我們愛，因為神先愛我們」——連受詞都不用寫，我們整個人成了回應。4:20 回頭警告嘴上的愛；5:3 收在順服：「我們遵守神的誡命，這就是愛他了」。愛不是我們爬上去的梯子，是他先走下來的路。","stops":[["2:5","愛神的心在他裡面實在是完全的",""],["2:15","不要愛世界和世界上的事","bot"],["3:1","你看父賜給我們是何等的慈愛","top"],["3:16","主為我們捨命，我們從此就知道何為愛",""],["3:18","不要只在言語和舌頭上，總要在行為和誠實上",""],["4:8","神就是愛","top"],["4:10","不是我們愛神，乃是神愛我們","top"],["4:18","愛裡沒有懼怕",""],["4:19","我們愛，因為神先愛我們","top"],["4:20","人若說「我愛神」，卻恨他的弟兄，就是說謊話的","bot"],["5:3","我們遵守神的誡命，這就是愛他了",""]]},{"gk":"γινώσκω／οἶδα","tr":"ginōskō / oida","gl":"知道、認識、曉得","code":"G1097","root":"γινώσκω——在經驗中認識、曉得；οἶδα——確知。兩個字合計四十次：約翰一書是一封寫給被動搖的人、要把「知道」還給他們的信","ins":"約翰一書是一封要把「知道」還給被動搖的人的信，這兩個字出現四十次。第一站，知道有一個記號：「我們若遵守他的誡命，就曉得是認識他」（2:3）。2:13 父老的特徵是「認識那從起初原有的」——屬靈的年紀，看的是認識有多深。2:18 知道也包括清醒：「從此我們就知道如今是末時了」——知道是為了分辨，不是為了算日子。3:2 是第一個翻轉，知道的對象是未來：「但我們知道，主若顯現，我們必要像他」。3:14 知道有一個證據：「我們因為愛弟兄，就曉得是已經出死入生了」；3:20 當我們的心不確定時，知道的主詞換成神：「神比我們的心大，一切事沒有不知道的」。4:8 是谷底：「沒有愛心的，就不認識神」——認識不是資訊。4:16 知道與信並排：「神愛我們的心，我們也知道也信」。5:13 是全卷的寫作目的：「要叫你們知道自己有永生」；終點在 5:20：「我們也知道，神的兒子已經來到」。確據不在我們說了甚麼，在那一位已經來了。","stops":[["2:3","我們若遵守他的誡命，就曉得是認識他",""],["2:13","因為你們認識那從起初原有的",""],["2:18","從此我們就知道如今是末時了","bot"],["3:2","但我們知道，主若顯現，我們必要像他","top"],["3:14","我們因為愛弟兄，就曉得是已經出死入生了",""],["3:20","神比我們的心大，一切事沒有不知道的",""],["4:8","沒有愛心的，就不認識神","bot"],["4:16","神愛我們的心，我們也知道也信",""],["5:13","要叫你們知道自己有永生","top"],["5:20","我們也知道，神的兒子已經來到","top"]]},{"gk":"κόσμος","tr":"kosmos","gl":"世界、世人、世間","code":"G2889","root":"κόσμος——世界：可以指神所愛、基督為之死的世人，也可以指與神對立、以自己為中心的那一套價值。同一個字，兩種方向","ins":"同一個字，兩個方向：神愛的世界，與人不可愛的世界。第一站，世界是被愛的對象：基督的挽回祭「也是為普天下人的罪」（2:2）。2:15 方向轉了：「不要愛世界和世界上的事」；2:16 給這個「世界」下了定義，是谷底：「肉體的情慾、眼目的情慾，並今生的驕傲」——不是山川與文化，是以自己為中心的慾望與誇口。2:17 它的命運是「這世界和其上的情慾都要過去」。3:13 這個世界會恨屬神的人：「世人若恨你們，不要以為希奇」。4:4 是第一個翻轉：「那在你們裡面的，比那在世界上的更大」。4:9、4:14 是第二個翻轉，回到起點：「神差他獨生子到世間來」，「父差子作世人的救主」——神不愛世界的驕傲，卻愛世界上的人。5:4 是得勝：「因為凡從神生的，就勝過世界」；終點 5:19 卻冷靜得出奇：「全世界都臥在那惡者手下」。基督徒不逃離世界，也不愛世界；是在世界裡，被差進世界，靠信勝過世界。","stops":[["2:2","也是為普天下人的罪","top"],["2:15","不要愛世界和世界上的事",""],["2:16","肉體的情慾、眼目的情慾，並今生的驕傲","bot"],["2:17","這世界和其上的情慾都要過去",""],["3:13","世人若恨你們，不要以為希奇","bot"],["4:4","那在你們裡面的，比那在世界上的更大",""],["4:9","神差他獨生子到世間來","top"],["4:14","父差子作世人的救主","top"],["5:4","因為凡從神生的，就勝過世界","top"],["5:19","全世界都臥在那惡者手下","bot"]]},{"gk":"γεννάω ἐκ τοῦ θεοῦ ＋ τέκνα θεοῦ","tr":"gennaō ek tou theou + tekna theou","gl":"從神生、神的兒女","code":"G1080","root":"γεννάω——生（父親生子）；ἐκ τοῦ θεοῦ——出於神；τέκνον——孩子、兒女。約翰一書從不用 υἱός（兒子）稱信徒，只用 τέκνα：被生下來的孩子","ins":"約翰一書從不稱信徒為 υἱοί（兒子），只稱 τέκνα——被生下來的孩子。第一站，從神生的有一個家族相似：「凡行公義之人都是他所生的」（2:29）。3:1 是驚嘆：「使我們得稱為神的兒女」；3:2 是現在式：「我們現在是神的兒女」——不是將來要考上，是已經是。3:9 是這條線最難的一站，也是谷底：「凡從神生的，就不犯罪」——這是兒女的本性與方向，不是叫還在跌倒的人懷疑自己；同一位作者早就說了，「若有人犯罪，在父那裡我們有一位中保」（2:1）。3:10 兒女身分要顯出來：「從此就顯出誰是神的兒女，誰是魔鬼的兒女」。4:7 身分的記號是愛：「凡有愛心的，都是由神而生」；5:1 身分的入口是信：「凡信耶穌是基督的，都是從神而生」。5:4 是翻轉：從神生不是一個要求，是一個能力——「因為凡從神生的，就勝過世界」。終點 5:18：「從神生的，必保守自己」，和合本小字還有另一個讀法：那從神生的必保護他。我們是被生的，也是被保守的。","stops":[["2:29","凡行公義之人都是他所生的",""],["3:1","使我們得稱為神的兒女","top"],["3:2","我們現在是神的兒女","top"],["3:9","凡從神生的，就不犯罪","bot"],["3:10","從此就顯出誰是神的兒女，誰是魔鬼的兒女",""],["4:7","凡有愛心的，都是由神而生",""],["5:1","凡信耶穌是基督的，都是從神而生",""],["5:4","因為凡從神生的，就勝過世界","top"],["5:18","從神生的，必保守自己",""]]}],"lesson":{"1":{"no":1,"vol":"《321約翰一書講義》第一課·約翰一書第一章","title":"神就是光，在他毫無黑暗——相交、光中、認罪","chars":5055,"min":60,"deep":8,"dchars":1928,"tchars":1609,"blocks":[["h","一、櫃子後面的那面牆"],["p","弟兄姊妹平安。美玲姊住的是一間三十年的老公寓。去年梅雨季，臥室裡總有一股霉味，她買了除濕機，點了香氛，味道還是在。後來她請了一位做防水的師傅來看。師傅一進門，沒有先看天花板，先請她幫忙把靠牆的大衣櫃挪開。櫃子一移，美玲姊愣住了：整面牆從地板往上，一片黑綠的霉斑，油漆起泡、剝落。師傅打開手上的工作燈，貼著牆一寸一寸地照。美玲姊很不好意思：「我平常有在打掃，只是櫃子後面看不到。師傅，先刷一層防霉漆就好了吧？」師傅搖頭：「刷了，三個月又出來。我開燈不是要看你家多髒，是要找水從哪裡進來。找到了，才修得好。」"],["p","約翰一書第一章，講的就是那一盞燈。「神就是光，在他毫無黑暗。」（1:5）很多人一聽到這句，心裡是一緊的，好像自己家的櫃子要被挪開了。可是請先聽約翰怎樣開口。他沒有先講罪，他先講一雙手：「就是我們所聽見、所看見、親眼看過、親手摸過的。」（1:1）光照進來以前，那一位先走到我們身邊，近到伸手可及。"],["p","照教會的傳統，約翰晚年住在以弗所。那時教會剛經過一場分裂，有一群人走了（2:19），帶走一套聽起來很屬靈的說法：神的兒子不會真有血肉；我們與神有特別的相交；我們已經沒有罪了。留下的人心裡發慌。這封信沒有問安，一開口就是見證。"],["p","全卷五章可以用五個字記：光、住、兒、愛、勝。第一章是光：被看見，也被洗淨。這一課用三個詞走完第一章：相交、光中、認罪。一群摸過他的人，把同一條船上的位子讓給我們；一盞不是來抓人、是來修房子的燈；和一句跟神說一樣的話。"],["d",["這封信沒有署名，我們怎麼知道是使徒約翰寫的？","信裡沒有名字，但線索不少。第一，寫信的人說自己「親手摸過」，是目擊者的口吻。第二，用字和約翰福音非常接近：光與黑暗、生命、真理、住在、相交，前後呼應，連開頭的「起初」也像約翰福音的「太初」。第三，第二世紀起，教會的傳統就歸給使徒約翰。也有學者主張是約翰身邊的「長老約翰」，或是一個傳承約翰教導的群體。本講義沿用約翰福音講義的立場，認為是使徒約翰，也並陳其他看法；全卷立場見〈作者、年代與處境：誰寫的？在甚麼光景中寫的？〉。比名字更重要的是信裡的「我們」：信仰是一群親眼看過的人一手一手傳下來的。可以立刻做的：這一週把約翰一書第一章和約翰福音第一章並排讀一次。"]],["h","二、相交：同一條船上的位子"],["p","1:1 到 1:4 在原文是一個長句，主要動詞要等到第三節才出現：「我們將所看見、所聽見的傳給你們，使你們與我們相交。我們乃是與父並他兒子耶穌基督相交的。」（1:3）三節繞了一大圈，只為說出一個目的：不是要你多知道一點，是要你進來。"],["p","主日講章說過，「相交」原文 κοινωνία 是合夥的字，約翰年輕時和彼得在加利利合夥打魚。這一課要多看一筆次序。約翰先說「與我們」，再說「與父並他兒子」。源頭是父與子，入口是見證人傳下來的信息，形狀是一群彼此相交的人；三樣是同一個相交，不是先後兩件事。只要神、不要人的信仰，在約翰看來不完整；只要熱鬧、沒有神的團契，在約翰看來沒有根。"],["p","這對國度321空中團契特別切身。我們散在臺灣、馬來西亞、新加坡、紐西蘭和更多地方，許多時候是隔著螢幕見面。隔著螢幕，算不算相交？我想誠實地講兩面。一面是真實的：相交的源頭不在同一個房間，在父與子。在醫院陪床的姊妹，半夜聽見遠方的弟兄叫著她的名字禱告，那是真的相交。另一面是限度：螢幕很容易讓人只剩一個頭像，關掉鏡頭、按下靜音，聚完會就消失；網路也很難替人送一碗湯，陪人走進手術室。"],["p","所以不必貶低，也不必誇大，要把它做實。相交需要名字：螢幕關掉以後，你叫得出幾位弟兄姊妹的名字，知道他們這一週發生了甚麼？相交也需要能見面時就見面：同城的人約一頓飯；有人住院，請住得近的肢體去看一眼。聖經說重點在不停止、在彼此勸勉，不只在場地。"],["p","序言最後一句落在喜樂上：「我們將這些話寫給你們，使你們的喜樂充足。」（1:4）和合本正文作「你們」，旁邊小字註「有古卷：我們」。本講義採「我們的喜樂」。這樣讀，就看見一位老牧人的心：見證人的喜樂，要等你們也上了船才會滿。像年夜飯，菜都上桌了，還差一個在外地的孩子，那一桌就是不圓。線上那個很久沒亮的頭像，就是還沒回到桌前的孩子。"],["d",["我只參加網上聚會，從來沒有和弟兄姊妹見過面，這樣算有相交嗎？","算，而且可以更深。1:3 的相交，源頭在父與子，所以你在螢幕前和弟兄姊妹一同禱告、一同讀經，不是假的。可是約翰說的相交是「一同有分」，有分就要有內容：分擔重擔、分享生活、彼此勸勉，也彼此代禱。網上最容易缺的就是這些。實際可以做三件事。第一，這一週打開一次鏡頭，或用語音說一句真實的近況，不必說很深。第二，找一位同組的弟兄或姊妹，每週一對一通話十五分鐘，互問近況和代禱。第三，若你住的城市有團契的肢體或一間可信的地方教會，安排一次面對面的見面。本講義的看法見 〈1:3「相交」——與神相交、與人相交，哪一個先？只在網路上聚會算不算相交？〉：網上相交是真實的，也有限度；不必因為不能見面而自責，也不要因此就停在只看不說。"]],["d",["1:4 到底是「你們的」還是「我們的」喜樂？會不會改變意思？","這是抄本的問題，差一個希臘字母：ἡμῶν（hēmōn）「我們的」和 ὑμῶν（hymōn）「你們的」，在當時的讀音幾乎一樣，抄寫時很容易混。和合本正文採「你們」，小字註「有古卷：我們」；現代多數校勘本依較早的抄本作「我們」，本講義也採「我們的喜樂」。理由是：上下文一直說「傳給你們」，抄的人容易順手改成「你們」，反過來改的動機很少。兩種讀法並不衝突：見證人的喜樂，要等收信的人進入相交才滿；而你進來的時候，你的喜樂也滿了。這一處不影響任何要道。教學時一致地說：和合本作你們，本講義採我們，意思是牧人的喜樂繫在羊身上。詳見 〈1:4 是「你們的」還是「我們的」喜樂充足？〉。"]],["h","三、光中：燈是來修的，不是來抓的"],["p","「神就是光，在他毫無黑暗。這是我們從主所聽見、又報給你們的信息。」（1:5）相交講完，第一個信息就是光。「毫無黑暗」原文是雙重否定：黑暗在他裡面沒有，一點也沒有。我們認識的人再好，也有陰影；神沒有，他沒有藏起來的算計。這先是好消息：你可以完全信得過他。"],["p","可是光也會照到我們。美玲姊的反應很像我們：燈一照到牆，她先解釋，再想用油漆蓋掉。人在光面前，第一個本能是躲，第二個本能是蓋。伊甸園裡，人吃了那果子就藏在樹木中；可是神開口的第一句話是：「你在哪裡？」（創 3:9）那不是查案的問話，是一位來找人的父親。"],["p","接著是第一次「人若說」：「我們若說是與神相交，卻仍在黑暗裡行，就是說謊話，不行真理了。」（1:6）主詞是「我們」，約翰先把自己放進去。「行」是走路的字，說的是一條路的方向，不是某一天絆了一跤。這一節是鏡子，不是放大鏡，我們拿它照自己，不拿它查別人。"],["p","然後是一個意外：「我們若在光明中行，如同神在光明中，就彼此相交，他兒子耶穌的血也洗淨我們一切的罪。」（1:7）我們以為會讀到「與神相交」，約翰卻說「彼此相交」。光裡最先倒下的，是人和人之間的牆。"],["p","請特別留意這一節的下半句：在光明中行的人，仍然需要血。在光中行不是已經沒有罪，否則就不需要血了。「洗淨」是現在式，正在洗，像一道一直流著的泉水。在光中行，意思是不再躲：讓光照到櫃子後面，讓水路被找出來。師傅開燈，不是為了拍照傳到大樓群組，是為了動工；神的光照進來，也不是要展示我們的骯髒，是要讓洗淨可以發生。"],["d",["1:7 說要在光明中行，是不是表示我必須把所有的罪和過去，都在小組裡說出來？","不是，這是最容易被誤用的地方。在光明中行，首先是在神面前不躲：他本來就看見，我們不再假裝他沒看見。在人面前的誠實，要有智慧和分寸。雅各書說「你們要彼此認罪，互相代求，使你們可以得醫治」（雅 5:16），目的是代求和醫治，不是曝光。實際的分寸是：得罪了誰，就向那人承認、彌補；需要扶持的掙扎，向一兩位可信、會保密的肢體說；牽涉別人隱私，或說出來會傷害第三者的細節，不必在小組裡講；有人正在受傷害的事，要尋求牧者與專業協助。小組也要成為安全的地方：聽見的事不外傳、不議論。光裡的彼此相交，前提是被看見的人也被保護。詳見 〈1:7「在光明中行」——是無罪完全，還是誠實透明？〉、〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉。"]],["h","四、原文亮光：走迷、說一樣的話、中保"],["p","1:8 到 1:10 是本章最低、也最高的地方，有三個字要看清楚。第一個是 πλανῶμεν（planōmen），和合本譯「自欺」，原文是「使自己走迷」，像一個人拿著一張畫錯的地圖，還很有把握地往前走。「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（1:8）我們會替罪換名字：那是個性，那是壓力太大，那是他先對不起我。最深的驕傲，是覺得自己不需要恩典。"],["p","第二個字是本章的中心：ὁμολογῶμεν（homologōmen），「認」。它由「相同」和「說」兩部分組成，意思是說一樣的話。「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」（1:9）認罪不是把自己罵到一文不值，也不是寫一份越長越好的悔過書，是對神說：你說這是罪，我也說這是罪。美玲姊後來沒有再說「我有在打掃」，她對師傅說：「好，就是漏水，我們修吧。」那一句，就是說一樣的話。"],["p","說一樣的話，就是回到本位：讓神作神，他是光；讓人作人，我們有罪。三次「若說」，都是人坐上審判的位子，替自己判案；一次「若認」，是從那個位子下來，把判案交還給神。"],["p","然後看人下來以後，遇見的是誰。約翰沒有說神是慈悲的，所以會赦免；他說神是信實的，是公義的。信實，是神守住自己的應許，不看我們今天的表現。公義，是因為帳已經算清了：「他為我們的罪作了挽回祭」（2:2）。神赦免你不是放水，是那筆債已經有人付了。"],["p","第三個字在下一章的第一節，卻是讀 1:8–10 不能不帶上的：παράκλητον（paraklēton），「中保」。「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）這個字說的是被請到身邊來的那一位，站在你旁邊替你說話。約翰剛說完全章最重的話，馬上叫一聲「我小子們哪」。"],["p","所以這幾節要同時講兩面，少一面都會傷人。一面是：1:8 不給刻意、持續不肯悔改的人任何掩護；「反正人人都有罪」不是安心留在罪裡的理由，約翰寫這些話是要叫我們不犯罪。另一面是：一個看見自己的罪、為它難過、一次又一次回到神面前的人，不必懷疑自己有沒有得救。真正自欺的人是看不見的；你看得見，正說明光已經照進來，真理正在你裡面作工。方向是不犯罪，跌倒時有中保。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"],["d",["我已經信主得救了，為甚麼還需要認罪？不認的話會失去救恩嗎？","需要認罪，但不是為了重新得救。1:9 的動詞是現在式，說的是信徒一再發生的生活，不是一生只做一次的入門手續。像孩子做錯事回家跟父親說清楚，不是為了重新上戶口，是為了可以再看著父親的眼睛。身分是神賜的，認罪恢復的是相交。所以不必擔心漏認一件就不得救；赦免的根據是神的信實和耶穌的血，不是你的清單。但也不要把認罪當成可有可無：不肯說清楚的罪，像櫃子後面的濕氣，慢慢讓你和神、和人疏遠。實際的做法是：每晚睡前花兩分鐘，用這句禱告：「神啊，求你鑒察我，知道我的心思」（詩 139:23）。他提醒你甚麼，就說一樣的話；想不起來，就安心睡覺。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 1:8 當掩護：反正人人都有罪，我也沒辦法，於是一件明知不對的事，一做好幾年，還覺得很安心。這是錯的。約翰說這句話是要人來認，不是要人留下；刻意、持續地不肯悔改，在這一節找不到任何掩護。"],["p","第二個偏差剛好相反，是拿 1:8–10 和 3:9 去嚇仍在掙扎的信徒，對他說「你還會跌倒，可見你沒有得救」。這同樣是錯的。看見自己的罪而難過，是光照進來的記號；約翰下一句就說，若有人犯罪，我們有一位中保。講 3:9 的時候，必須同時講 2:1。"],["p","第三個偏差，是把 1:9 的認罪變成公開羞辱：要人在台上、在群組裡把細節一一說出來，或說真悔改就要向所有人認罪。ὁμολογέω 是向神說一樣的話；向人承認要有雅各書的分寸：對被你得罪的人，對可信的少數人，為了代求和醫治，不是為了讓眾人圍觀。"],["p","第四個偏差，是把 1:9 講成自動販賣機：嘴上認一句就結束，不改、不賠、不修復關係，還要求被傷害的人立刻當作甚麼都沒發生過。赦免是完整的，但後果與信任要另外面對；撒該蒙恩以後，自己說要還人四倍，那是赦免結出的果子，不是換來赦免的價錢。"],["p","第五個偏差，是把神的光講成一盞探照燈，好像神在天上等著抓你的錯；或者把三次「人若說」拿去檢查別人，誰說話不對，就貼上活在黑暗裡的標籤。光是來修的，不是來抓的；「人若說」的主詞是我們，那是照自己的鏡子。"],["d",["我信主十幾年，同一個罪一直改不掉，每次認了又犯，神會不會有一天不再赦免我？","先請你聽 1:9 的主詞：神是信實的。信實的意思是，他守住的是自己的應許，不是看你這一次認得夠不夠誠懇、隔了多久又犯。主耶穌教彼得饒恕要到七十個七次，他自己不會更小氣。同時，1:7 的「行」說的是方向：你恨這個罪，一次一次回來，正說明你的方向是往光裡走，而那位中保一直站在你旁邊。長期改不掉的罪，常常需要更多光，不只是更用力。第一，找一位可信的同性屬靈同伴，請他定期問你。第二，看清楚每次跌倒前的情境，先在那裡設一道門。第三，若牽涉成癮，例如色情、賭博、酒精或藥物，請尋求專業輔導或戒癮團體，這是領受幫助的方式。全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：認錯就輸了。華人很難說「是我錯」。作父親的很少對孩子說對不起，長輩錯了，常常一句「我是為你好」帶過。有一位七十歲的父親，在兒子婚禮前一晚，終於說了一句：「你小時候我打你那幾次，是爸爸錯了。」三十歲的兒子在陽台上哭了很久。面子是華人的櫃子，我們很會用它擋住那面牆。可是 1:9 的認，不是輸，是回到本位。在神面前先練習說一樣的話，在人面前才說得出口；而且不必在全家族面前檢討，一句短短的真話往往就夠了。"],["p","第二個問題：報喜不報憂。家族群組裡只傳風景照和好消息，生病、失業、婚姻出了問題，一個字也不提。到了線上小組也一樣，輪到自己就說「最近還好」。螢幕是最容易修圖的地方。1:7 說在光明中行就彼此相交，光裡的相交需要有人先說真話。組長可以先示範，說一件自己這一週真實的軟弱；組員也要學會聽完不急著給建議、不外傳。當一個人說「其實我這個月很糟」而沒有被議論，整個小組才開始有光。"],["h","七、活出321——讓光照到櫃子後面"],["p","經文先講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：神的兒子沒有站在遠處發光，他走近到讓人摸得到。復活以後他還對門徒說：「摸我看看！魂無骨無肉，你們看，我是有的。」（路 24:39）跟隨他的人，也要學他近到伸手可及：不只是按一個讚，是知道對方的名字和難處。"],["p","聖經是我的準則：1:5 的信息是「從主所聽見」的，不是約翰想出來的；1:10 說人若否認，「他的道」就不在心裡。罪叫甚麼名字，不由我取，由神的話定。說一樣的話，就是讓聖經作我的準則，不讓我的心情作準則。"],["p","聖靈是我的引導：第一章沒有直接提聖靈，可是「真理在我們心裡」這句話，使我們想起主應許聖靈來，要「叫世人為罪、為義、為審判，自己責備自己」（約 16:8）。叫我們看見櫃子後面那面牆的，是他；叫我們看見以後不絕望、而是轉向那位中保的，也是他。"],["p","讓耶穌作王：三次「若說」，都是人坐上審判台替自己判案；認罪是從那個位子下來，把判案交還給他。讓耶穌作王，在這一章最具體的樣子，就是不再替自己辯護，承認最後說了算的是他。"],["p","讓耶穌得著一切的榮耀：1:9 的主詞是神，信實的是他，公義的是他，赦免和洗淨的也是他。我們能做的只有說一樣的話；功勞全在那流出來的血，榮耀也全歸他。"],["p","建立屬神的體系：1:3 的相交先與父和子，再彼此。321 在末端認出，這是體系的起點：沒有父與子，團契只是俱樂部；沒有彼此，信仰只剩獨行。321 也在這裡認出 235 的「2」，屬靈同伴，一個可以對他說真話的人。散在各國的空中團契，更需要這樣一對一對、叫得出名字的同伴。"],["d",["我向神認罪了，也向被我傷害的人道歉了，可是對方還是不信任我，是不是神沒有真的赦免我？","不是。請把兩件事分開。神那一邊的赦免是完整的，1:9 說洗淨我們「一切」的不義，沒有一件留在外面。人這一邊的信任，需要時間和行動慢慢重建。大衛認罪的時候，拿單說：「耶和華已經除掉你的罪，你必不至於死。」（撒下 12:13）可是後果仍然臨到他的家。不要把對方的不信任當成神的懲罰，也不要說「神都赦免我了，你為甚麼還不放下」，那會再傷他一次。實際的是：問對方需要甚麼才覺得安全，並尊重他的回答，包括保持距離；該賠償的，具體地賠償；然後用一段長長的日子，讓言行一致替你說話。信任是對方的禮物，不是你的權利。詳見 〈1:9 認罪得赦免之後，後果與信任怎麼辦？〉。"]],["h","八、四種心，誰怕那盞燈"],["p","驕傲型的心，覺得自己不太需要認罪。不是沒有犯錯，是總有理由：個性、壓力、別人先開始的。1:8 就是寫給這顆心的：最深的驕傲，是覺得自己不需要恩典。請你試試看，這一週有一件事不再替它找理由。"],["p","恐懼型的心，一聽到「神是光」就緊張，好像要被抓包，認了罪也不敢相信真的被赦免。請你聽 1:9 的兩個形容詞：信實的，公義的。赦免不靠你的感覺，靠他的應許和已經付清的代價；你跌倒的那一刻，在父那裡有一位替你說話的中保。"],["p","羞恥型的心，最怕被人看見：過去的事、家裡的事、一直改不掉的事。你怕的不是罪本身，是被看見以後沒有人要你。請你聽 1:7：光裡最先發生的，是彼此相交。光不只有被看見，還有被接納。"],["p","受傷型的心，也許曾經被人逼著認錯，在教會被公開羞辱過，或者別人傷害了你，你卻被要求「先檢討自己」。請聽清楚：1:9 不是叫你替傷害你的人背他的罪。你受的傷不是你的罪；你可以帶著它來到光中，讓光醫治你，而把審判交給那位公義的神。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:5–9 一次，讀到 1:9 時停下來，把「我們」換成「我」唸一次，然後說：「主啊，謝謝你是信實的。」"],["p","第二，每晚睡前兩分鐘，作一次說一樣的話的禱告：主提醒一件，就用它本來的名字叫它，然後再讀一次 1:9 的後半句，相信他已經赦免。不挖、不翻舊帳。"],["p","第三，挪開一個櫃子：找出一件你替它找理由找了很久的事，這一週向神說清楚；若得罪了人，寫下要向誰說、哪一天說、要怎樣彌補。"],["p","第四，讓相交有名字：這一週在小組裡打開一次鏡頭，或用語音說一句真實的近況，並和一位組員約一次十五分鐘的一對一通話。"],["p","第五，若你正背著一件不敢對人說、而且已經影響生活的重擔，例如成癮、債務、一段不該有的關係，或你曾經受過的傷害，這一週找一位可信的牧者或輔導約一次談話。受過的傷不是你的罪，但你不必一個人扛。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神就是光，在他毫無黑暗；他的光照到我，是來找我、來修我，不是來抓我。"],["p","我宣告：我不再替我的罪換名字，我要和神說一樣的話；他是信實的，是公義的，必要赦免我。"],["p","我宣告：我跌倒的時候，在父那裡有一位中保，就是那義者耶穌基督，他為我說話。"],["p","我宣告：我要在光明中行，與弟兄姊妹彼此相交；我要叫得出他們的名字，也讓他們叫得出我的。"],["d",["小組長要大家每次聚會輪流公開認罪，說不出來就是不夠屬靈，這樣對嗎？","不對。雅各書確實說「你們要彼此認罪，互相代求」（雅 5:16），可是這句話有它的分寸：目的是代求和得醫治，前提是自願與安全。1:9 認罪的對象首先是神。強迫輪流公開認罪，常叫人為了交差編小罪，或把真正的事藏得更深，甚至說出隱私後被議論、被控制。健康的做法是：說多少由本人決定；組長先示範自己的真實，不點名要別人說；鼓勵每個人另外有一位一對一的屬靈同伴，比較深的事在那裡說；組裡聽見的話不外傳。組長若堅持，可以溫和地和他談；談不通，請牧者一起關心。詳見 〈1:9「認罪」——已經得救的人還需要認罪嗎？一定要向人認罪嗎？〉。"]],["h","十、結語"],["p","回到美玲姊家。師傅找到了：是外牆一道細細的裂縫，雨水沿著牆裡的鋼筋滲了好幾年。補好外牆，刮掉霉斑，重新上漆，那面牆終於乾了。最有意思的是，她沒有把大衣櫃推回去。她把櫃子移到另一邊，讓那面牆空著，窗簾拉開，早上的陽光可以一直照到牆角。她說：「以前最怕人看見那面牆，現在它是家裡最乾淨的一面。」"],["p","第一章從一雙手開始，在一句認罪結束；翻過去，是一聲「我小子們哪」。在光、住、兒、愛、勝這一條路上，這一章是起點：被看見，也被洗淨。"],["p","這一課的焦點，不在我們認得多誠懇、多徹底，也不在我們的牆有多髒；焦點在那位毫無黑暗、又是信實公義的神，和那位在父那裡為我們說話的中保。「神就是光，在他毫無黑暗。」（1:5）光不是來抓你的，是來找你、來修你的。請你不要更害怕光，請你更認識那一位拿著燈走進你家的主。"],["p","我們一起低頭禱告。毫無黑暗的父神，謝謝你，你沒有站在遠處發光，你差你的兒子走到我們身邊，讓人親手摸過。我們承認，我們很會躲，也很會蓋，很會替自己的罪換名字。今天我們願意和你說一樣的話：你說是罪的，我們也說是罪。謝謝你是信實的，是公義的，必要赦免我們，洗淨我們一切的不義。求你安慰那些一看見自己的罪就害怕的人，叫他們知道在你那裡有一位中保；也求你醫治那些曾經被人羞辱、被逼著認錯的人。求你使我們的團契，不論隔著螢幕或坐在一起，都成為一個有光、也安全的地方。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰的牆最乾淨，是讓每一個人在安全裡說一句真話，說出這一週要挪開的那一個櫃子，並說出一位要叫得出名字的同伴；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是相交、光中、認罪。席上可能有一看見罪就懷疑得救的人、長期掙扎的人，也有曾被逼著公開認錯的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：相交的源頭是父與子，形狀是彼此；神的光是來修的，不是來抓的；認罪是和神說一樣的話，跌倒時有中保。"],["n","1. ★ 美玲姊先解釋，再想刷漆蓋掉。你被人指出錯誤時，比較常是哪一種反應？說一次最近的例子，在哪裡、對誰。"],["n","2. ★★★ 請用自己的話說：ὁμολογέω「說一樣的話」是甚麼意思？為甚麼說三次「若說」是人坐上審判的位子，一次「若認」是回到本位？"],["n","3. ★★ 1:7 在光明中行的人，為甚麼仍然需要耶穌的血？這一點對「在光中行就是完全沒有罪」的想法，有甚麼提醒？"],["n","4. ★★ 1:8 不給誰掩護？2:1 又在安慰誰？請各用一句話說，並說說為甚麼兩句一定要一起講。"],["m","帶領提醒：有人問作者是誰、1:4 的異文或 3:9 的難題，一句指向議題頁，不在組裡辯論；提到 1:4 時一致地說：和合本作「你們」，本講義採「我們」。不用 1:6、1:8 評論任何人，包括不在場的人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人誠實看見自己的櫃子，在安全裡說一句真話，並且相信神的信實比自己的感覺更可靠。"],["t","【看】看見自己"],["n","5. ★★★ 你生命裡有沒有一個櫃子，一直擋著一面不想讓人看見的牆？不必說牆上是甚麼，只說這個櫃子擋了多久、你通常用甚麼理由不去挪它。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:5–9 和 2:1 兩遍。哪一個詞讓你停下來：毫無黑暗、彼此相交、信實、公義，還是中保？今天這個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡比較怕的是哪一樣：怕神不赦免，怕人知道以後看不起你，還是怕認了以後要付代價？那個怕是從哪一次經驗開始的？"],["t","【講】說出口"],["n","8. ★★ 請對神、也在組裡說一句：「主啊，你說得對。」後面要不要加上一件事由你決定，不必說細節。右手邊的人只回一句「他是信實的」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要挪開的那一個櫃子：哪一天、幾點、在哪裡向神說清楚；若需要向人承認或彌補，寫下對象的名字和方式；若是長期改不掉的事，也寫下要找哪一位同伴或輔導談。"],["m","帶領提醒：這一化可能碰到長期的罪疚、成癮、家庭傷害或受虐的經驗，以及曾被公開羞辱的痛。不追問細節，不要求任何人當場認罪，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；受害的人不必為別人的罪認罪。有人說出看見自己的罪就害怕，請帶他讀 1:9 和 2:1，不要用 1:8 或 3:9 加重他的懼怕。若有人透露傷害自己的念頭、正在危險中，或牽涉違法的傷害，不在組裡處理，會後單獨關心，必要時協助他尋求專業協助。組裡聽見的事不外傳。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個說一樣的話的節奏、一個要挪開的櫃子、一位叫得出名字的同伴、一位要講給他聽的朋友。"],["n","10. ★★ 這一週你每晚兩分鐘說一樣的話的禱告，是幾點、在哪裡？請左手邊的人週三傳訊問你一次。"],["n","11. ★ 說出一個你常說「最近還好」的場合，家族群組、線上小組或公司，這一週你準備在那裡說的那一句真話是甚麼？"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位這一週你要叫得出名字、主動聯絡的同伴，例如很久沒開鏡頭的組員，或報喜不報憂的家人。當場說出他的名字，說出哪一天、用甚麼方式和他通話十五分鐘，並和他一起讀 1:7。"],["n","13. ★ 誰曾在你最狼狽時接納你？說出他的名字，和這一週要傳給他的一句感謝。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人以為神是來抓錯的，其實他像一位拿著燈來修房子的師傅。第二句，認錯不是輸，是對他說一樣的話，承認問題在哪裡。第三句，聖經說只要我們承認，他是信實的，必要赦免，而且有一位替我們說話的耶穌。請把三句寫下來，這一週講給一個人聽，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案；不在組裡評論任何人的罪，也不評論任何離開團契的人。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要挪開的櫃子是哪一天動手，要叫得出名字的那一個人是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位一看見自己的罪就害怕的弟兄姊妹；一位在長期掙扎裡、需要同伴與幫助的人；一位曾經被羞辱或受傷、需要在光中被接納的人。"],["p","最後由組長慢慢讀一遍：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」（1:9）"]]},"2":{"no":2,"vol":"《321約翰一書講義》第二課·約翰一書第二章","title":"你們要住在主裡面——中保、世界、住下來","chars":4984,"min":60,"deep":8,"dchars":1967,"tchars":1634,"blocks":[["h","一、那一箱沒拆開的紙箱"],["p","弟兄姊妹平安。搬家公司的師傅把最後一個紙箱抬上樓，箱子側面用麥克筆寫著四個字：「雜物・暫放」。師傅隨口問了一句：「這箱又不拆喔？」屋主柏翰愣了一下。他三十六歲，是工程師，十二年裡從臺中搬到新竹，再到上海、蘇州、新加坡、吉隆坡，換了七份工作。每一次搬家都有很好的理由。這一箱跟著他搬了五次，膠帶一次也沒有撕開。"],["p","柏翰是愛主的人。每到一座城，他第一個週末就去找教會，也很快加入小組的群組；他的手機裡現在還存著四間教會的群組，最舊的那一個已經很久沒有人說話了。可是他心裡知道，自己在每一個地方都是「新朋友」：坐在靠門的位置，笑得很客氣，不太說自己真實的光景，因為反正過兩年又要走。他不是不信，他是一直沒有把行李打開。"],["p","今天請不要急著拿柏翰去比較誰。人換工作、換城市、換教會，有很多真實的原因，有的是生計，有的是家人，也有的是在原來的地方受了傷；這一課不是要論斷任何一個搬過家的人。這一課要問的是一件比地址更深的事：不管你住在哪一座城，你的心有沒有一個地方是拆箱的？"],["p","約翰一書第二章二十九節，是全卷最長的一章；它的章字是「住」。約翰在這一章裡用了好幾次同一個動詞，到了第二十八節收成一句：「小子們哪，你們要住在主裡面。」（2:28）這一課不逐節走，抓三樣東西：中保、世界、住下來。一位在你跌倒時站在旁邊的主，一個看起來很大卻正在過去的世界，和一個可以讓你拆箱的地方。"],["d",["我因為工作一直搬家，每兩三年就換一間教會，這樣是不是就不算「住在主裡面」？","不是。約翰說的「住」，原文 μένω，主詞和地點都是主：住在「他」裡面，不是住在某一個地址、某一張椅子上。相傳約翰晚年在以弗所牧養，收信的人可能散在亞細亞幾個城市，保羅一生也一直在移動；主耶穌自己說「人子沒有枕頭的地方」（路 9:58）。所以搬家本身不是屬靈問題。要問的是另一件事：你到了每一個地方，有沒有讓一群人真的認識你？住在主裡面，在地上常常是藉著一群看得見的弟兄姊妹活出來的。實際的做法是：不管你預計在這座城住多久，這一週主動告訴小組裡的一位：「我可能兩年後會調走，但這兩年我想認真住下來。」然後讓他知道你一件真實的近況。"]],["h","二、中保：跌倒的時候，旁邊有一位"],["p","這一章一開口，約翰先把方向講清楚：「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。」（2:1）上一章才說「我們若說自己無罪，便是自欺」（1:8），有人可能就此鬆懈：反正人人都有罪。約翰馬上把方向扳回來，寫信的目的是不犯罪，方向沒有打折。"],["p","可是同一節後半，老牧人接著說：「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）請留意那個「我們」，年老的使徒把自己也放進去了。這兩句話要一起聽：方向是不犯罪，跌倒時有中保。只聽前一句，人會被壓垮；只聽後一句，人會變隨便。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"],["p","中保替我們說話，憑的不是我們表現好，是他自己：「他為我們的罪作了挽回祭」（2:2）。這祭是誰預備的？約翰到第四章才講完：「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。」（4:10）不是人去平息一位生氣的神，是神自己預備了祭；而且這祭大到「也是為普天下人的罪」（2:2）。"],["p","回到柏翰。他每一次搬家，最怕的不是找房子，是在新教會被問「你以前在哪裡服事」。有幾年他其實跌倒得很厲害，工作壓力大，在網路上看了不該看的東西，也很久沒有禱告。每次換城市，他心裡都有一個念頭：重新開始吧，這裡沒有人知道。可是換地址洗不掉罪；只有中保可以。跌倒的人最常做的事是躲，等自己好一點再回來；約翰說的是：你跌倒的那一刻，已經有一位站在你旁邊了。"],["p","接著約翰說，認識他的人會照他所行的去行：「人若說他住在主裡面，就該自己照主所行的去行。」（2:6）這是本章第一個「住」。這不是一張考卷，第五節的主詞是「愛神的心」；遵守是被愛的人長出來的樣子，不是換得認識的代價。"],["p","恨最可怕的地方，是叫人看不見路：「因為黑暗叫他眼睛瞎了。」（2:11）這裡也要劃一條線。愛弟兄不是假裝沒有受過傷，也不是叫人沒有界線地回到危險裡；愛是在光裡，把那個人帶到神面前，不再讓恨替你決定往哪裡走。"],["d",["2:1 說有中保，那我是不是可以放心犯罪，反正有人替我說話？","不可以，而且這正是約翰在同一節先堵住的路。第一句是目的：「是要叫你們不犯罪」（2:1）；第二句才是安慰。中保是給跌倒的人，不是給打算跌倒的人。再看這位中保是誰：「那義者耶穌基督」，他替我們說話，用的是自己的血，不是替我們找藉口。一個真正明白自己的罪讓主付上甚麼代價的人，不會把這份恩典當作通行證。另一方面也不要走到另一端：如果你正在一個反覆跌倒的地方掙扎，掙扎本身說明你的心仍向著神。實際一點說，這一週找一位你信得過的同性肢體，說出那一個你一直在躲的範圍，請他每週問你一次。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"]],["h","三、世界：會過去的，和會留下的"],["p","講完光和黑暗，約翰忽然停下來，叫了三種人：小子、父老、少年人，連寫六次「我寫信給你們」。每一句後面都有一個「因為」：「因為你們的罪藉著主名得了赦免」（2:12）、「因為你們認識那從起初原有的」（2:13）、「因為你們勝了那惡者」（2:13）。約翰不是懷疑他們，是提醒他們已經是了。經文先講完，321 在末端認出 235 的 3：屬靈的父母兒女，一代扶著一代。"],["p","說完安慰，才有叮嚀：「不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。」（2:15）這節經文被用錯過很多次。有人因此不敢聽音樂、不看電影，把一切文化都當成危險；也有人因此冷落家人、輕看身體、不關心社會。這都不是約翰的意思。同一封信說：「神差他獨生子到世間來，使我們藉著他得生」（4:9），又說「父差子作世人的救主」（4:14）。神愛這個世界，愛到差兒子進來。"],["p","那約翰說的世界是甚麼？他自己下了定義：「因為，凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。」（2:16）不是山和海，不是一頓好飯，也不是你的鄰舍。肉體的情慾是「我想要」；眼目的情慾是「我看見了，我也要」；今生的驕傲是「我有，你要知道我有」。"],["p","第三樣最隱密。「驕傲」原文 ἀλαζονεία（alazoneia），古時用來形容走江湖、誇大其詞的人；「今生」是 βίος（bios），指家當、過日子的本錢。今生的驕傲，就是靠自己所有的來誇口。它可以很屬靈：我的職位、我的學區、我服事了幾年、我去過幾個國家宣教。柏翰後來承認，他每到一間新教會，最先說的一定是自己待過的公司和城市；那是他的名片，也是他的盔甲。321 在這裡認出一件事：驕傲是離開本位、抓住權力；謙卑是放下權力、回到本位。人本來的位置是被造的、被愛的、蒙赦免的小子。"],["p","約翰沒有開一張禁止清單，他給了一個比較：「這世界和其上的情慾都要過去，惟獨遵行神旨意的，是永遠常存。」（2:17）「過去」是現在式，正在過去。柏翰最懂：每搬一次家，帶不走的家具再貴也得留下。「常存」和「住在主裡面」的「住」是同一個字：世界在搬走，遵行神旨意的人留下來。"],["d",["2:15 說不要愛世界，那我喜歡看電影、追劇、聽流行音樂，是不是就是愛世界？","不一定，要用約翰自己的定義來量，不是用東西的種類來量。2:16 說世界是三樣：肉體的情慾、眼目的情慾、今生的驕傲。所以問題不是你看了甚麼類型，是那樣東西在你裡面做了甚麼：它是叫你更感謝神、更懂得人，還是叫你更想要、更比較、更不想回到父面前？主耶穌為門徒禱告：「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）。基督徒不是逃離世界的人，是在世界裡不被世界佔有的人。可以立刻做的是：這一週留意一樣你最常拿起來的娛樂，看完以後問自己一句：我現在離父近一點，還是遠一點？"]],["h","四、住下來：從原文看保、住、膏"],["p","第一個字是 παράκλητος（paraklētos），和合本在 2:1 譯「中保」。字面是「被叫到身旁的那一位」，在法庭上就是替你說話的辯護人。約翰福音裡主耶穌說：「父就另外賜給你們一位保惠師」（約 14:16），用的是同一個字。另外一位，表示已經有一位了：在地上，聖靈在我們旁邊；在父那裡，耶穌替我們說話。柏翰最孤單的時候，是每一次剛到一座新城的第一個月；那時他還沒有認識任何人，可是旁邊從來不是空的。"],["p","第二個字是 μένω（menō），住、常存、存在。這一章它出現了十次以上：2:6 住在主裡面，2:24 一節就有三次，2:27、2:28 又是命令「你們要住在主裡面」。它不是一個激烈的字，是一個安靜的字；不是一次的衝刺，是每天回家。主耶穌在葡萄樹的比喻裡說：「你們要常在我裡面，我也常在你們裡面。」（約 15:4）枝子不必拚命，只要不離開。住，就是把行李打開。"],["p","2:19 也用到這個字：「若是屬我們的，就必仍舊與我們同在」，「同在」原文就是「住下來」。約翰的讀者面對的是一群否認耶穌是基督、帶著另一套說法離開的教師；留下來的人晚上睡不著，懷疑是不是自己錯了。這一節是給留下的人的安慰，不是交給我們一把尺去量今天每一個不再來聚會的人。人離開教會有許多原因，有人搬家，有人在掙扎裡暫時走不進來，也有人是在教會裡受了傷。約翰從來沒有給我們權柄宣判誰屬神。"],["p","同樣的安靜也用在「末時」。約翰在第一世紀就說「小子們哪，如今是末時了」（2:18）；所以這句話不是給我們算日子的，也不是叫我們把「敵基督」貼在任何人、國家或宗派身上。約翰給的標準是基督論：「誰是說謊話的呢？不是那不認耶穌為基督的嗎？」（2:22）他問的不是你站哪一邊，是你怎樣看耶穌。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。"],["p","第三個字是 χρῖσμα（chrisma），恩膏。「你們從那聖者受了恩膏」（2:20），舊約膏油倒在君王、祭司、先知頭上；這裡的「你們」是複數，在全體身上，不是在少數人身上。2:27 說「並不用人教訓你們」，可是請想一想，約翰自己正在寫信教導他們，一寫就是五章。他的意思不是拒絕一切教導，是那些「引誘你們的人」（2:26）帶來的新說法，你們不需要。恩膏像櫃員對真鈔的熟悉：假鈔一過手就知道不對，因為真的摸得夠久。"],["p","所以約翰對留下的人說的不是「去追更新的」，是「務要將那從起初所聽見的，常存在心裡」（2:24）。耶穌是基督，他為你的罪死，神愛你。不是你已經聽過、可以往下一個去了，是你還沒有讓它住滿你。然後整章收成一句：「小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。」（2:28）坦然，不是因為從來沒有跌倒，是因為一直沒有離開那位中保。"],["d",["2:27 說「不用人教訓你們」，那我自己讀經、靠聖靈就好，還需要去教會聽道嗎？","需要，而且約翰自己就是答案。一個說「不用人教訓你們」的人，正在寫一封五章的信教導他們；2:21 他還說「我寫信給你們，不是因你們不知道真理，正是因你們知道」。他反對的是 2:26「那引誘你們的人」帶來的新說法，不是一切教導。保羅也說主賜下教導的恩賜，「為要成全聖徒，各盡其職，建立基督的身體」（弗 4:12）。還有一件事：恩膏在「你們」全體身上，不在某一個人身上。所以它在群體裡、在弟兄姊妹彼此的印證裡最清楚。反過來，若有人說「我有恩膏，我說的就是神說的」，那也是把恩膏變成招牌，一樣不合 2:27。實際的做法是：這一週把你自己讀經最有感動的一句，帶到小組裡說出來，讓別人一起看看。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。"]],["d",["我曾經在教會受了很深的傷，後來離開了，讀到 2:19「他們從我們中間出去」很害怕，我是不是就是那種人？","不是。請先看約翰說的是誰：2:22 講得很清楚，是「不認耶穌為基督」、否認父與子的人，是帶著另一套基督論出去、還回頭引誘信徒的教師（2:26）。你因為受傷而離開一個群體，和否認基督是兩回事。2:19 是寫給留下的人的安慰，不是給任何人拿來量你的尺；人離開教會有許多原因，在教會受傷是真實的一種。你會因為這一節害怕，正說明你的心仍向著主。住在主裡面，首先是住在他裡面，不是住在傷害你的地方。若那個環境涉及權力的控制或任何形式的侵害，請向可信的人與相關機構求助。等你準備好，可以先找一位你信得過的基督徒，喝一次咖啡，不必馬上回到任何聚會。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 2:1 前半句壓人，好像真基督徒就不會跌倒；或反過來只抓後半句，把中保當成可以隨便犯罪的保險。兩樣都錯了。方向是不犯罪，跌倒時有中保，兩句要一起講。"],["p","第二個偏差，是用 2:15 叫人厭世：不聽音樂、不碰文化、冷落家人、不關心社會，把一切都貼上「世界」的標籤。這不是約翰的意思。世界照 2:16 定義，是三種慾望和驕傲；同一封信說神差他獨生子到世間來，作世人的救主（4:9、14）。"],["p","第三個偏差，是拿 2:18 算日子，或把「敵基督」貼在某個政治人物、國家、宗派身上。約翰在一世紀就說如今是末時了；他給的標準不是時事，是基督論：認不認耶穌是基督（2:22）。"],["p","第四個偏差，是用 2:19 論斷離開教會的人，甚至建立「離開我們就是不屬神」的控制。這是誤用。2:19 是寫給留下的人的安慰；人離開教會有許多原因，包括在教會受傷。"],["p","第五個偏差，是用 2:27 拒絕一切教導，或反過來，有人自稱「我有恩膏」，要別人只聽他的。兩樣都不對。約翰自己正在寫信教導；恩膏在「你們」全體身上，不是某一個人的招牌。"],["d",["2:12--14 說的小子、少年人、父老，是不是就是教會裡要分成三級來培訓？","不能這樣直接等同。經文先講的是身分和安慰：每一級後面都有一個「因為」，說的是已經成就的事，赦免、認識、得勝。解經上有兩種讀法：一種讀成教會裡三種屬靈年齡，一種讀成每一位信徒身上同時有的三個面向；而且約翰在 2:1、2:28 把所有人都叫成「小子們」，連父老也是小子。321 在末端認出 235 的 3，屬靈父母兒女一代扶著一代，這是從經文得到的提醒，不是用經文來證明一套制度。實際一點說：這一週想一想，誰是在信仰上扶過你的「父老」？誰又是你可以去扶一把的「小子」？各說出一個名字，給前者一句感謝，給後者一次問候。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：一直在移動的一代。華人這一代很多人像柏翰，為了工作、為了孩子的學校、為了父母的醫療，在兩岸、在東南亞、在紐澳之間搬來搬去。我們很容易一輩子都當「新朋友」：客氣、周到、不麻煩人，也不讓人真的認識。約翰說的「住」，在這樣的處境裡要更刻意：每到一個地方，先問的不是這間教會的節目好不好，是我願不願意讓這一群人知道我真實的光景。線上團契也一樣，鏡頭可以開，心也要開。"],["p","第二個問題：用擁有來介紹自己。華人見面常問「在哪裡高就」「孩子讀哪一間」「住哪一區」，教會裡也會變成「在哪裡服事」「信主幾年」。這就是 2:16 今生的驕傲最常穿的衣服：用手上有的來定義自己是誰。反面的危險也有，有人因為沒有可以說的東西，就不敢來、不敢開口。約翰對所有人的第一句介紹都是「小子們」，你的罪藉著主名得了赦免。下一次在小組自我介紹，試試先說一件神在你身上做的事，再說你的職業。"],["h","七、活出321——把行李打開"],["p","經文先講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：「人若說他住在主裡面，就該自己照主所行的去行。」（2:6）他怎樣蹲下來為門徒洗腳，怎樣在十字架上為釘他的人禱告，我們就照著走。榜樣不是一根量人的尺，是一條跟著走的路；他自己也是「道成了肉身，住在我們中間」（約 1:14），先住進我們裡面來。"],["p","聖經是我的準則：「務要將那從起初所聽見的，常存在心裡。」（2:24）準則不是一直追新的說法，是讓起初的福音住滿我。"],["p","聖靈是我的引導：2:27 說恩膏「在凡事上教訓你們」。聖靈引導的方向，總是更深地住在主裡面，也更願意和弟兄姊妹一起受教，不是叫人越來越不需要別人。"],["p","讓耶穌作王：少年人「勝了那惡者」（2:13），原文是完成式，仗已經在十字架上打贏了。世界的情慾在過去，作王的是那位顯現時我們要見的主；我不必再讓擁有替我作王。"],["p","讓耶穌得著一切的榮耀：「你們的罪藉著主名得了赦免」（2:12），是藉著他的名，不是我的資歷。連我服事了幾年、走過幾個國家，都不必拿來誇口；今生的驕傲放下了，榮耀才回到他身上。"],["p","建立屬神的體系：2:19 有人出去，約翰沒有叫留下的人去追究，而是叫他們彼此住在一起，在同一個恩膏裡互相印證。屬神的體系不是一個不讓人離開的組織，是一群讓人可以拆箱的人；321 在末端認出 235 的 3，父老扶著少年人，少年人扶著小子。"],["d",["我們是散在各國的線上團契，大家常常換城市、換時區，要怎樣在這裡「住下來」？","住下來不一定是不搬家，是在搬來搬去之中，有一群人一直知道你。線上團契可以做三件事。第一，固定：同一個小組、同一個時段，盡量不換；換了城市也帶著原來的小組走，時差再調。第二，交接：有人要搬到新的城市，小組長主動幫他聯絡當地一位弟兄姊妹或一間教會，讓他落地的第一個主日不是一個人。第三，真實：每次聚會留一段時間，讓每個人用一句話說真實的近況，不是工作報告。一個人在螢幕上已經三週沒有開口，請指定一位組員私下傳訊問候，不是點名，是告訴他：你的位置我們還留著。"]],["h","八、四種心，誰的箱子最重"],["p","驕傲型的心，箱子裡裝滿了名片：待過的公司、讀過的學校、服事過的崗位。這一章對你說的是 2:16 今生的驕傲，也是父老那一句：你認識那從起初原有的。到了父老這一級，要的不是更多，是更深。把名片放下，你仍然是被愛的小子。"],["p","恐懼型的心，一聽到末時、敵基督就睡不著，或怕自己哪一天也會「出去」。約翰寫這一章，是要叫人「坦然無懼」（2:28）。你的安全不在你看懂了多少時事，在那位替你說話的中保；如果恐懼已經影響睡眠和生活，請找醫生或輔導談一談，禱告和就醫不是二選一。"],["p","羞恥型的心，像柏翰一樣，想換一個地方重新開始，因為那裡沒有人知道你跌倒過。請聽 2:1：「在父那裡我們有一位中保」。2:28 說的「不至於慚愧」，不是因為你把過去藏好了，是因為你一直沒有離開他。"],["p","受傷型的心，也許正是因為在一間教會受了傷，才一直在換地方。你的傷是真的，2:19 不是在說你。住在主裡面，首先是住在他裡面，不是勉強自己回到不安全的地方；先讓一兩位信得過的人陪你，慢慢再說。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 2:28，把「你們」換成自己的名字唸出來，然後用一句話告訴主：我今天在這裡，住在你裡面。"],["p","第二，如果你這一陣子跌倒了，不要等好一點再回來；這一週用 2:1 禱告一次，必要時找一位信得過的同性肢體說出來。"],["p","第三，留意一樣你最常用來介紹自己的「擁有」，這一週在一次自我介紹或聊天裡，先說一件神在你身上做的事。"],["p","第四，拆一個箱子：說出一個你一直只當「新朋友」的群體，這一週在那裡讓一個人知道你一件真實的近況。"],["p","第五，說出一位因為搬家、受傷或掙扎而很久沒有來聚會的人，這一週傳一則不帶勸說的問候給他，只說：我想到你，為你禱告。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我若跌倒，在父那裡我有一位中保，就是那義者耶穌基督；我不必躲。"],["p","我宣告：這世界和其上的情慾都要過去，我不靠自己所有的誇口，我是蒙赦免的小子。"],["p","我宣告：我要將那從起初所聽見的常存在心裡，也願意和弟兄姊妹一起受教。"],["p","我宣告：不論我住在哪一座城，我都要住在主裡面，他顯現的時候，我可以坦然無懼。"],["d",["「住在主裡面」聽起來很抽象，一個上班族每天具體可以怎麼做？","可以從三個很小的「回家」開始。早上出門前，在電梯或車上，用一句話把這一天交給主：主啊，我今天住在你裡面。中午吃飯前，停十秒，想一想上午哪一件事讓你離開了他，是一句氣話、一個比較，還是一份焦慮，用 2:1 把它交給中保。晚上睡前，讀一節經文，不求多，只求讓它住一晚；這一週可以就是 2:28 一節。主耶穌說：「常在我裡面的，我也常在他裡面，這人就多結果子」（約 15:5）。枝子不是靠用力，是靠不離開。另外，住在主裡面也包括住在他的家裡：這一週找一位弟兄姊妹，固定一個時間互相傳一句代禱。請不要把這些變成新的考卷，漏了一天，就從下一頓飯再回家。"]],["h","十、結語"],["p","那一天晚上，柏翰拿美工刀劃開了那個寫著「雜物・暫放」的紙箱。裡面是幾本舊筆記、一張大學團契的合照，還有一本封面已經泛黃的聖經，扉頁上有他信主那年寫的一行字。他還是可能兩年後被調走，這一次他在小組裡先說了；組長說：「那這兩年就是真的。」"],["p","這一課的焦點，不在柏翰最後住在哪一座城，也不在我們夠不夠穩定，焦點在那一位一直住在我們身邊的主。跌倒的時候，他是中保；世界在過去的時候，他是常存的那一位；有人出去、新的聲音在叫的時候，他的恩膏把起初的福音一直留在我們心裡。不是我們先抓住他，是他先住進我們中間。請你更認識這一位。"],["p","我們一起低頭禱告。天父，謝謝你，在我們跌倒的時候，在你那裡有一位中保，就是那義者耶穌基督。求你赦免我們靠自己所有的誇口，叫我們看見世界和其上的情慾都要過去。求你保守那些一直在搬家、一直在換地方的弟兄姊妹，不論到哪一座城，都有一個可以拆箱的家；也安慰那些在教會受過傷的人，讓他們知道你沒有離開。求你叫我們把起初所聽見的常存在心裡，住在你裡面，等你顯現的時候，可以坦然無懼。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰最穩定、誰信主最久，是讓每一個人誠實說出自己還沒拆開的那一箱，說出自己跌倒時想躲的地方，並說出這一週要住下來的第一個動作；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是中保、世界、住下來。席上可能有因工作常常搬家的人，有剛從別的教會轉來、甚至在教會受過傷的人，也可能有正在反覆跌倒、不敢說的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：方向是不犯罪，跌倒時有中保；世界照 2:16 定義，正在過去；住在主裡面是住在從起初所聽見的福音裡，不是去追更新的。"],["n","1. ★ 開場柏翰那一箱「暫放」跟著他搬了五次。你這一生搬過幾次家？哪一個地方是你最像「拆了箱」的地方？那時你幾歲、在哪一座城？"],["n","2. ★★★ 請用自己的話說：2:1 的前半句和後半句，為甚麼一定要一起講？只講其中一句，會讓人變成甚麼樣子？"],["n","3. ★★ 2:16 的三樣：「我想要」「我看見了，我也要」「我有，你要知道我有」。哪一樣在你的職場或家族聚會裡最常見？說一個場景，不必說名字。"],["n","4. ★★ 2:27 說「不用人教訓你們」，約翰卻正在寫信教導。請用一句話說明，恩膏和教會的教導是甚麼關係。"],["m","帶領提醒：有人問挽回祭、普救論、敵基督是誰或末日的時間表，一句指向議題頁，不在組裡辯論；不在組裡評論任何離開教會的人或任何一間教會。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人誠實說出自己還沒拆開的那一箱、跌倒時想躲的地方，並說出這一週住下來的第一個動作。"],["t","【看】看見自己"],["n","5. ★★★ 在現在這個小組或教會，你比較像拆了箱的家人，還是客氣的「新朋友」？是甚麼讓你一直沒有把行李打開：怕又要走、怕被看見，還是曾經受過傷？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:1 和 2:28 兩遍。哪一個詞讓你停下來：中保、那義者、住、坦然無懼，還是不至於慚愧？今天這個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你最常用來介紹自己的一樣「擁有」是甚麼？職位、學歷、孩子、住的地方，還是服事的年資？如果把它拿掉，你會怎麼介紹自己？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我跌倒的時候，在父那裡我有一位中保。」並說出一個你曾經想「換個地方重新開始」來逃避的時刻，不必說細節。右手邊的人只回一句「你不必躲」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你住下來的第一個動作：哪一天、幾點、在哪裡、對誰說哪一件真實的近況；若你最近跌倒了，也寫下這一週要找哪一位同性肢體談。"],["m","帶領提醒：這一化可能碰到在教會受傷的經歷、長期的孤單、反覆的跌倒與羞恥，也可能碰到權力控制或侵害的往事。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不用 2:19 暗示任何人「不屬我們」；有人提到仍在不安全的處境裡，不在組裡處理，會後單獨關心，必要時協助他尋求專業協助，涉及侵害請鼓勵向可信的人與相關機構求助。分享時不點名、不影射任何離開的人。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個每天回家的節奏、一次拆箱的真話、一個要去問候的人、一位要講給他聽的朋友。"],["n","10. ★★ 這一週你每天讀 2:28 的時間是幾點、在哪裡？請右手邊的人週三傳訊問你一次：今天住下來了嗎？"],["n","11. ★ 說出一個你常用擁有來介紹自己的場合和在場的人，這一週你準備先說的那一件神在你身上做的事是甚麼？"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位剛搬到新城市、剛轉來教會、很久沒來聚會，或曾在教會受傷的人。當場說出他的名字，說出這一週哪一天、用甚麼方式問候他，只帶問候、不帶勸說，並和他一起讀 2:1。"],["n","13. ★ 誰是曾經讓你在一個地方「拆了箱」的人？說出他的名字，和這一週你要傳給他的那一句感謝。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人一輩子搬來搬去，心裡總有一箱東西沒有打開。第二句，耶穌是那一位在你跌倒時不走開、還替你說話的朋友。第三句，你手上擁有的都會過去，但住在他裡面的人可以留下來。請先把這三句寫下來，這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案；問候很久沒來的人時，不追問原因、不轉述給別人，也不在組裡評論任何一間教會。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週住下來的第一個動作是甚麼，要去問候的那一個人是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位剛搬家、還在當「新朋友」的弟兄姊妹；一位正在反覆跌倒、不敢說的人；一位曾在教會受傷、暫時沒有聚會的人。"],["p","最後由組長慢慢讀一遍：「小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。」（2:28）"]]},"3":{"no":3,"vol":"《321約翰一書講義》第三課·約翰一書第三章","title":"使我們得稱為神的兒女——名分、種子、安穩","chars":5131,"min":60,"deep":8,"dchars":1835,"tchars":1633,"blocks":[["h","一、會跌，是因為他在走"],["p","弟兄姊妹平安。一個星期六早上，社區公園的草地上，一個一歲兩個月的小男孩正在學走路，家裡叫他豆豆。爸爸蹲在三步外，張開兩隻手；媽媽在後面，手虛虛地護著。豆豆搖搖晃晃走了兩步，咚一聲坐在草地上，愣了一下，哭了。爸爸沒有走過去抱他，只是把手張得更開：「來，再來。」豆豆爬起來，又走一步，又跌。長椅上一位阿嬤笑著說：「會跌，是因為他在走啊。坐著不動的孩子，才不會跌。」"],["p","那天早上豆豆跌了二十幾次，幾乎每一次都往前跌，往爸爸那邊跌。他的腳還不聽話，可是他的臉一直朝著那雙手。沒有人懷疑這個一直跌倒的孩子是不是那個男人的兒子；大家只看見他在往爸爸那裡去。"],["p","約翰一書第三章是一章講「兒女」的經文。全卷五章五個字：光、住、兒、愛、勝，第三章就是那個「兒」字。這一章有全卷唯一的一聲驚嘆：「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1）；也有全卷最容易把人嚇壞的一句：「凡從神生的，就不犯罪」（3:9）。許多人讀到第二句就愣住了：我上週又跌了，還算是他的孩子嗎？"],["p","這一課我們用三個詞走完第三章：名分、種子、安穩。名分，是父先叫我們孩子，然後我們才慢慢長得像他；種子，是神的生命種在我們裡面，決定我們往哪裡長；安穩，是當我們的心一直定自己的罪的時候，神比我們的心大。"],["d",["我從小沒有被父親好好疼愛過，甚至被他打罵長大，一讀到「父」這個字心裡就發緊，3:1 對我有甚麼意思？","這是很多人心裡真實的卡點，不必為這樣的感覺自責。約翰說「父賜給我們」，不是叫你把地上那位父親的樣子貼到神身上，而是反過來：讓天上的父重新定義「父」這個字。主耶穌說：「人看見了我，就是看見了父。」（約 14:9）所以要認識這位父，不從你的童年開始，從耶穌開始：他抱小孩子，對跌倒的彼得說「你餵養我的羊」。可以慢慢來，先用「主耶穌」禱告也可以。這一週讀約翰福音第 14 章，把每一處「父」圈起來，看耶穌怎樣講他。若童年的傷至今還常常影響你的睡眠、情緒或關係，請考慮找一位信得過的輔導陪你走一段，這不是信心小，是讓傷口被好好照顧。"]],["h","二、名分：先是兒女，才長得像"],["p","「你看」，原文 ἴδετε 是複數命令。約翰不是對一個人說，是對整個教會說：大家一起停下來看。教會剛經歷分裂，留下來的人又累又受傷；約翰不叫他們回頭看誰走了，也不叫他們低頭檢查表現，他叫他們抬頭：看父給了你們甚麼。"],["p","他給的是一個名字。「得稱為神的兒女」是被動語態，叫名字的是父。就像豆豆不是因為走得好才被叫兒子，他還不會走路以前，名字早就登記在戶口名簿上了。約翰又補一句：「我們也真是他的兒女。」（3:1）不只是名義，是事實。"],["p","接著他把時間切成兩段：「我們現在是神的兒女，將來如何，還未顯明」（3:2）。現在，已經是；將來，還沒有看見。很多人把次序弄反了，以為要先變好才配作兒女。約翰說：先是兒女，然後才長得像。豆豆走路連那一點外八字都像他爸爸，不是模仿出來的，是天天看著爸爸長出來的。"],["p","所以約翰說：「但我們知道，主若顯現，我們必要像他，因為必得見他的真體。」（3:2）請留意，是「像他」，不是變成他；我們永遠是受造的兒女。今天你照鏡子，只看見還沒長好的地方：老脾氣、舊傷口、改了又犯的習慣。約翰沒有說這些不要緊，他說這些不是終點。你現在的樣子，不是你最後的樣子。"],["p","然後才是：「凡向他有這指望的，就潔淨自己，像他潔淨一樣。」（3:3）次序又一次很重要：先有指望，然後潔淨。這裡的「潔淨」是過節以前整理自己的字；1:7 的洗淨主詞是神，這裡主詞才是我們。先被洗淨，然後自己整理。被恐嚇出來的潔淨很累，被盼望吸引出來的潔淨很輕。"],["d",["3:2 說「我們必要像他」，我聽過有人說，基督徒最後會變成神，這樣講對嗎？","這一節很容易被講過頭。原文 ὅμοιοι 是「相似」，不是「同一」。約翰說的是像他，不是變成他。我們要像那位復活得榮的基督：身體不再朽壞，品格不再有罪，保羅說主要叫我們的身體「和他自己榮耀的身體相似」（腓 3:21）。但創造主和受造者的分別永遠不會消失；我們在天上仍然是敬拜的那一方，不是被敬拜的那一方。本講義的立場是：成聖是現在的開始（3:3），得榮是主顯現時的完成，中間靠的是盼望，不是焦慮。詳見 〈3:2「我們必要像他」——基督徒會變成神嗎？〉。"]],["h","三、種子：跌倒的孩子，仍朝著父"],["p","看完了，約翰立刻講罪。「凡犯罪的，就是違背律法；違背律法就是罪。」（3:4）「違背律法」原文是「不法」，罪的核心不是那件事大不大，是那件事在說甚麼：我自己作主。可是他沒有停在控告上，下一句就是福音：「你們知道主曾顯現，是要除掉人的罪，在他並沒有罪。」（3:5）他來，是要把罪拿走。"],["p","接下來是這一章最難的兩節：「凡住在他裡面的，就不犯罪」（3:6）；「凡從神生的，就不犯罪，因神的道（原文是種）存在他心裡；他也不能犯罪，因為他是由神生的。」（3:9）只讀這兩節，誠實的人都會坐倒在草地上。請把同一位作者的另兩句放在旁邊：「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（1:8）「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）同一位約翰，不會在幾段之後推翻自己。"],["p","那麼 3:9 在說甚麼？歷代有四種讀法：現在式持續說，指不持續活在罪中；兩種罪說，專指背棄基督；身分與方向說，講新生命的本性與走向；針對假教師說，指自稱認識神卻輕看罪的人。本講義以第三種為主，吸收第一、第四種的亮光，全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"],["p","用豆豆來說。從神生的人，罪不再是他的方向，也不再是他的家；他會跌，可是他朝著父。和合本小字說「道」原文是「種」：一顆種子剛發芽時很弱，會被風吹歪，會被蟲咬，但它不會長成荊棘，因為種決定了它是甚麼。3:9 講種的力量，2:1 講中保的恩典；用 3:9 盼望，種還在；用 2:1 回家，中保還在。"],["p","可是也要誠實講另一面。豆豆跌倒是一回事；如果有一天他已經會跑了，爸爸在後面喊「停」，他卻笑著頭也不回往馬路上衝，沒有爸爸會說：沒關係。他會衝過去把孩子抱回來。1:8 是叫我們承認，不是叫我們安頓。一個人明知是罪、刻意持續、也不想回頭，卻拿「反正人人都有罪」當擋箭牌，3:6 對他是一聲真實的警告：「凡犯罪的，是未曾看見他，也未曾認識他。」（3:6）跌倒的人需要中保，刻意不回頭的人需要悔改；兩種人都可以今天回到父那裡。"],["p","中間約翰還說：「神的兒子顯現出來，為要除滅魔鬼的作為。」（3:8）「除滅」原文是解開，像主對拉撒路說：「解開，叫他走！」（約 11:44）纏了多年的布，不是你一個人和黑暗摔角，是主一圈一圈替你解開。3:10 說的兩種兒女，是兩種源頭與方向，不是貼在別人身上的標籤。"],["p","然後約翰從義轉到愛，舉出全聖經第一對兄弟：「不可像該隱；他是屬那惡者，殺了他的兄弟。」（3:12）該隱不是被亞伯傷害了，是被亞伯的好刺痛了。神警告過他：「罪就伏在門前。它必戀慕你，你卻要制伏它。」（創 4:7）今天你看見某人做得好就不舒服，那是門前的警告，不是定罪。接著是確據：「我們因為愛弟兄，就曉得是已經出死入生了。」（3:14）愛不是門票，是生命已經進來的記號。至於恨弟兄就是殺人，指的是盼望對方不存在的心志；被傷害的人心裡的憤怒是傷口在說話，可以帶到神面前。"],["d",["我讀到 3:9「凡從神生的，就不犯罪」，想到自己上週又在同一件事上跌倒，就開始懷疑我是不是根本沒有被神生過？","請先把 2:1 讀出聲來：「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）這句話是寫給信徒的，約翰是預備我們會跌倒的。3:9 講的是新生命的本性和方向：罪不再是你的家，你裡面那顆種會往光長；它沒有說一次跌倒就證明你不是兒女。你會為這件事難過，本身就是好消息。實際的做法有三步。第一，跌倒的當天就回到父面前，照 1:9 把那件事說出來。第二，若是同一件事一再發生，這一週找一位你信得過的同性屬靈同伴，彼此認罪、互相代求（雅 5:16），讓光照進去。第三，問自己：我現在是朝著父，還是背著他？本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉；本章詳見 〈3:6、9「凡從神生的，就不犯罪」——各家怎樣解？〉。"]],["d",["有人說「1:8 已經說人人都有罪」，所以他一直活在某件明知不對的事裡也沒關係，這樣用經文對嗎？","不對，這正是紅線另一面要守住的。1:8 是叫人不要假裝自己無罪，下一節馬上接著說：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（1:9）。1:8 的出口是認罪，不是安頓在罪裡。2:1 也一樣，「中保」預設了一個想回家的人，不是給人一張可以繼續的通行證。3:6 對刻意持續、不想回頭的人，是一聲真實的警告。警告的目的是叫人回來；門還開著。如果這個人就是你自己，這一週就把那件事告訴一位信得過的屬靈同伴，並且訂下一個具體的、可以被問的改變。"]],["h","四、原文亮光：放下、真實、說服"],["p","第一個字是 τίθημι（tithēmi），「放下」。3:16「主為我們捨命」，字面是把性命放下，像把外衣脫下放在一邊。約翰在洗腳那一晚親眼看過這個動作：主「就離席站起來，脫了衣服」（約 13:4），用的就是這個字。主也說：「沒有人奪我的命去，是我自己捨的。」（約 10:18）捨是主動的，是愛的選擇，不是被逼出來的結果，更不是被人奪走。所以「我們也當為弟兄捨命」（3:16），是為對方真正的好甘心放下時間、面子、錢財，不是叫被打、被控制的人留在危險裡。主捨命是為了救人脫離罪，不是讓罪繼續傷人。"],["p","第二個字是 ἀλήθεια（alētheia），「真實」。「小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。」（3:18）前一節說，看見弟兄窮乏卻關上憐恤的心。「行為」是送一袋米去。「誠實」原文是在真實裡：愛不演戲。所以誠實的愛，有時是說出真相，告訴朋友「你正在傷害自己」；有時是說「不」，告訴一再越界的人「這樣不行」。不肯說真相的愛，常常只是怕衝突。321 在末端認出 920 的樣子：對身邊那一個「2」，用行為和誠實去愛；經文先講完了，321 才在這裡接上。"],["p","第三組字是 πείσομεν（peisomen）和 μείζων（meizōn）。3:19 說「我們的心在神面前可以安穩」（3:19），「安穩」原文是說服、安撫。3:20 的「責備」καταγινώσκω，字面是知道不利於你的事，像一個從不下班的檢察官。有人做錯一件事，可以在心裡審自己十年。約翰說，你可以在神面前回答它。怎麼回答？不是說「我其實沒那麼壞」，是說「神比我的心大」：「我們的心若責備我們，神比我們的心大，一切事沒有不知道的。」（3:20）μείζων 是更大。他知道我的罪，比我的心知道得更清楚；他也知道我的愛。彼得三次不認主之後，拿不出任何表現作證，只能說：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）他拿主的「知道」作證。"],["p","321 在這裡認出「用心靠聖靈」。用心，是不逃避良心的聲音，該認的認、該還的還；靠聖靈，是讓那位比我們的心更大的神說最後一句話，而不是讓腦子裡那位檢察官說最後一句話。本章最後一節，約翰第一次明說聖靈：「我們所以知道神住在我們裡面是因他所賜給我們的聖靈。」（3:24）確據最後不是靠我們把自己審查清楚，是那位住在裡面的靈，在我們心裡作見證。"],["d",["3:16 說「我們也當為弟兄捨命」，那我是不是應該回到一直打我、控制我的配偶身邊，像主一樣忍耐到底？","不是。請先保護你的安全。主捨命，是自己甘心放下，為的是救人脫離罪；不是讓罪繼續傷人，也不是叫受害的人留在危險裡。3:18 說愛要在誠實上，在一段暴力或控制的關係裡，誠實的愛是說出真相：這是錯的，我不能讓它繼續。原諒可以交給神；和好需要對方真實的悔改、時間的證明，也需要安全。實際的做法是：今天就把情況告訴一位可信的人，聯絡當地的家暴防治專線或社福機構；若有人身危險，請直接報警，這不是不屬靈。教會的責任是陪你、保護你。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉；本章詳見 〈3:16「我們也當為弟兄捨命」——要為傷害我的人捨命嗎？愛有沒有界線？〉。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 3:9 去量人：你還在跌倒，就證明你沒有重生。這是錯的。3:9 要和 2:1 一起讀，約翰預備了跌倒的人有中保；把一節經文拆出來當考卷，會叫最敏感、最想討神喜悅的人陷在得救的焦慮裡。"],["p","第二個偏差，是反過來拿 1:8 當擋箭牌：反正人人都有罪，我繼續活在那件事裡也沒關係。這也不是經文的意思。1:8 的出口是 1:9 的認罪，2:1 的中保是給想回家的人；刻意、持續、不想回頭，3:6 是警告。"],["p","第三個偏差，是把 3:10「魔鬼的兒女」貼到人身上：某某反對我，他就是魔鬼的兒女。約翰在說兩種源頭和方向，叫我們檢查自己往哪裡走，不是給我們一張標籤去貼別人、貼離開教會的人、貼另一個宗派。"],["p","第四個偏差，是把 3:16 講成沒有界線的愛：基督徒就要一直忍、一直給、一直回去。主的捨命是主動的、為了救人；3:18 的誠實包括說出真相、說「不」。叫受傷的人回到不安全的關係裡，不是愛，是把罪留在家裡繼續傷人。"],["p","第五個偏差，是把 3:20 講成「良心不重要，神都知道」，或者反過來，把 3:20 讀成「連你的心都定你罪，神更要重重定你罪」。兩樣都錯了。約翰的上下文是安穩（3:19）和坦然無懼（3:21），對象是在行為和誠實上回應愛的人；這節是給長期自責的人的安慰，不是給刻意不悔改的人的麻醉。"],["d",["3:20 說「神比我們的心大」，那是不是表示良心的不安可以不必理會，反正神都知道、都饒恕？","不是。約翰在 3:19 說安慰的對象是「屬真理的」人，也就是在行為和誠實上回應愛的人。良心的聲音大致有兩種。一種是具體的：我說了一句謊話、拿了不屬於我的東西、傷了某一個人。這種聲音要聽，照 1:9 認罪，能補償的去補償。另一種是籠統而反覆的：我就是不好，我永遠不夠，神一定很失望。這種聲音認了罪也不會停，3:20 就是寫給它的：神比你的心大。實際的分辨法是問自己：這個責備有沒有指出一件具體可以處理的事？有，就去處理；處理完了還在重播，就把 3:20 唸出聲來，讓神說最後一句話。本章詳見 〈3:20「神比我們的心大」——心一直責備自己的人，怎樣在神面前安穩？〉。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們的父親不太說愛。很多華人的爸爸一輩子沒說過一句「我以你為榮」，問得最多的是「考幾分」「怎麼不像你哥哥」。我們長大以後，不知不覺把天上的父也想成那個樣子：拿著成績單，皺著眉，等我們表現夠好才肯點頭。3:1 是對這種心的醫治。約翰沒有先給命令，先給一個名字；父叫我們孩子，不是在成績出來以後。教會能做的，是讓屬靈長輩對年輕人說一句具體的肯定，讓人在這個家裡第一次經驗到不靠表現被接納。"],["p","第二個問題：「家和萬事興」「忍一忍就過去了」。我們的文化很會忍，也很怕家醜外揚，於是 3:16 的捨命很容易被聽成：為了家庭的面子，你就繼續忍。親戚一次又一次來借錢不還，家人長期用言語羞辱你，甚至動手，你覺得說「不」就是不愛、不孝、不屬靈。請記得 3:18 的兩個字：行為和誠實。誠實的愛會說出真相，會設下界線；借錢可以幫，但也可以說「這一次我不能」；有暴力的地方，先保護安全，向可信的人與相關機構求助。界線不是愛的反面，往往是愛能夠長久的條件。"],["h","七、活出321——從「你看」開始"],["p","經文先講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：「主為我們捨命，我們從此就知道何為愛」（3:16）。約翰沒有給愛一個哲學定義，他指著十字架說：那就是。主不是被奪去性命，是自己放下；我們學的是那份甘心，為對方真正的好放下自己，而不是假裝沒有界線。"],["p","聖經是我的準則：「這就是你們從起初所聽見的命令。」（3:11）分裂的時代，新說法很多，約翰把人帶回起初所聽見的；3:23 又把命令濃縮成一條：信他兒子耶穌基督的名，且彼此相愛。準則不是越來越複雜，是回到起初那兩件事。"],["p","聖靈是我的引導：3:24 是本卷第一次明說聖靈。3:20 的落點也在這裡，用心靠聖靈：不用腦子裡那位檢察官作最後的判斷，讓那位住在裡面、比我們的心更大的神，替我們的心說話。"],["p","讓耶穌作王：罪的本質是不法（3:4），是我自己作主；而「神的兒子顯現出來，為要除滅魔鬼的作為」（3:8）。讓他作王，不是靠我咬牙把纏身的布一條一條扯掉，是把那一圈布交給他解開。"],["p","讓耶穌得著一切的榮耀：整封信沒有一首頌讚詩，3:1 那一聲「你看」就是頌讚。在一切要做的事以前，先抬頭看父給了甚麼；名分是他給的，像他也是他改變的，榮耀不歸給長得比較像的孩子，歸給那位父。"],["p","建立屬神的體系：「我們因為愛弟兄，就曉得是已經出死入生了。」（3:14）一個屬神的體系，識別它的記號不是規模，是愛：看見弟兄窮乏，不把憐恤的心關上（3:17）。321 在末端認出 920 的樣子，也認出 235 的「2」，屬靈同伴：在這個家裡，跌倒的人有人扶，窮乏的人有人看見。"],["d",["我們是散在各國的線上團契，3:17 說「看見弟兄窮乏」，見不到面，要怎樣具體做到不把憐恤的心關上？","約翰的動詞是「看見」，原文是看清楚了。線上團契第一件要做的，就是刻意看見。第一，建立一個安全的需要通道：每一個小組指定一位組員，私下收集組員的實際困難，例如失業、生病、家人過世、孩子學費，經本人同意才讓少數同工知道，不在大群組公開。第二，用同城的人當手：散在各國，卻常常有同城的弟兄姊妹；請組長整理一張同城名單，有人住院或搬家，同城的人去一趟，送一餐飯。第三，金錢的幫助經教會正式管道，有紀錄、有核對。財物怎樣對待窮乏的弟兄，見 〈3:17「看見弟兄窮乏」——基督徒的財物要怎樣對待窮乏的弟兄？〉。"]],["h","八、四種心，怎樣聽 3:9"],["p","驕傲型的心，聽 3:9 會點頭，覺得在說別人：我沒有那些人的大罪。請你在該隱身上停一下。該隱沒有被亞伯傷害，他是被亞伯的好刺痛了。驕傲常常不是公開的大罪，是別人做得好時心裡那一點不舒服。承認那一點，你就站到中保面前了。"],["p","恐懼型的心，聽 3:9 會發抖：我是不是根本沒得救？請你把 2:1 和 3:9 一起抄在同一張紙上。你會怕，表示你在乎；你在乎，表示那顆種還在。恐懼若已影響睡眠和生活，請尋求專業協助。"],["p","羞恥型的心，最怕有一件事被人知道：那個一再回去的地方、那段不敢說的過去。請你聽 3:20：神一切事沒有不知道的。你最怕被看穿的那一面，他早就看見了，仍然說「你看」，仍然叫你孩子。羞恥要藏，恩典要你走到光裡，找一位信得過的人說出來。"],["p","受傷型的心，也許聽過有人拿 3:16 對你說：要捨己，要忍，要回去。請你聽清楚：主捨命是甘心放下、為了救人，不是叫你留在危險裡。你的憤怒是傷口在說話，可以帶到神面前；你的界線不是不愛，是在誠實上愛。原諒交給神，安全先顧好。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 3:1，在「你看」之後停十秒，說出一件父給你、卻不是你掙來的東西，然後輕聲叫他一聲「父啊」。"],["p","第二，把 2:1 和 3:9 抄在同一張卡片上，放在手機殼或錢包裡。這一週跌倒的時候，先讀 2:1，當天就回到父面前，照 1:9 把那件事說清楚。"],["p","第三，如果有一件事你一再跌倒，這一週約一位信得過的同性屬靈同伴，說出來，彼此代禱，並約好下週他可以問你一句「怎麼樣了」。"],["p","第四，在行為和誠實上愛一個人：挑一位有實際需要的弟兄姊妹，送一樣具體的東西過去；或者對一位一再越界的人，溫和而清楚地說一次「不」。"],["p","第五，心又開始審你的時候，把 3:20 唸出聲來；具體的事去處理，處理完了還在重播的，交給比你的心更大的神。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：父賜給我何等的慈愛，叫我得稱為神的兒女；我現在就是他的孩子，不是表現好了才是。"],["p","我宣告：神的種存在我心裡，我的方向是不犯罪；我跌倒的時候，在父那裡有一位中保，就是那義者耶穌基督。"],["p","我宣告：主為我捨命，我要在行為和誠實上愛人，也要在誠實裡說出真相、守住界線。"],["p","我宣告：我的心若責備我，神比我的心大，一切事沒有不知道的；我要用心靠聖靈，在他面前安穩。"],["d",["我常常在半夜一直重播自己做錯的事，連很小、早就認過罪的事也停不下來，3:20 可以怎麼幫我？","3:20 是為你寫的：「我們的心若責備我們，神比我們的心大」（3:20）。你的心只記你的錯，不記主的血；神知道一切，包括你的罪，也包括你想討他喜悅的那份心。實際上可以這樣做：第一，把那件事寫下來，若已經認過罪、能處理的也處理了，就在紙上寫「已交給主，1:9」和日期。第二，半夜它再回來時，不和它辯論，只唸一次 3:20 和羅 8:1：「如今，那些在基督耶穌裡的就不定罪了。」（羅 8:1）然後專心呼吸、禱告一句。若這種重播已經持續很久、影響睡眠與工作，請尋求專業的協助，強迫性的自責有時需要醫生和輔導一起照顧，這和你的信心無關。"]],["h","十、結語"],["p","那天早上，豆豆最後一次跌倒，離爸爸只剩一步。他沒有哭，自己撐著草地爬起來，往前一撲，正好撲進那雙一直張開的手裡。爸爸把他舉得高高的，笑得比誰都大聲。晚上爸爸在家族群組傳了影片：「今天跌了二十幾次，可是每一次都往我這邊跌。」沒有人在底下留言問：跌了那麼多次，他真的是你兒子嗎？"],["p","第三章就是這樣一章。開頭是「你看」，父先叫我們孩子；中間是一顆種，叫我們朝著他長，跌倒時有中保；結尾是一顆會控告自己的心，被一位更大的神安撫。在光、住、兒、愛、勝這一條路上，這一章是「兒」：先知道自己是誰的孩子，才學得會愛。"],["p","這一課的焦點，不在我們今天跌了幾次，也不在我們走得有多穩，焦點在那雙一直張開的手。「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。」（3:1）請你不要更佩服那些走得穩的人，請你更認識那位一直等你撲過去的父。"],["p","我們一起低頭禱告。天上的父，謝謝你，在我們還不會走的時候，你就叫我們孩子。我們承認，我們常常跌倒；謝謝你，在你那裡我們有一位中保，就是那義者耶穌基督。求你叫你種在我們裡面的生命往光長，叫我們跌倒的時候朝著你，不背著你。求你使我們在行為和誠實上彼此相愛，也賜給正在不安全關係裡的弟兄姊妹保護和可信的幫助。求你安撫每一顆一直責備自己的心，因為你比我們的心大，一切事沒有不知道的。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰走得最穩，是讓每一個人誠實說出跌倒的地方和心裡最常控告自己的那一句話；以下三個化，請組長照次序帶。"],["m","帶領說明：本課主軸是名分、種子、安穩。席上可能有為得救焦慮、長期自責、在不安全關係裡的人，也可能有人拿 1:8 替自己辯護；請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：先是兒女，才長得像；3:9 講方向，2:1 講跌倒時的出路，兩節要一起讀；神比我們的心大，安穩在他面前，不在自己的表現。"],["n","1. ★ 開場的豆豆跌了二十幾次，每一次都往爸爸那邊跌。你小時候學會的哪一件事，是跌了很多次才學會的？那時是誰在旁邊陪你？"],["n","2. ★★★ 請用自己的話說：為甚麼 3:9「凡從神生的，就不犯罪」一定要和 2:1「在父那裡我們有一位中保」一起讀？只讀其中一節，各會變成甚麼樣子？"],["n","3. ★★ 3:2 說「現在是」神的兒女，「將來」必要像他。你過去比較常把次序想成哪一種：先變好才是兒女，還是先是兒女才變好？這兩種想法帶出的生活有甚麼不同？"],["n","4. ★★ 3:18 的「誠實」包括說出真相、說「不」。你見過哪一種「只在言語和舌頭上」的愛？說一個場景。"],["m","帶領提醒：有人問 3:9 各家讀法、基督徒會不會變成神、魔鬼從哪裡來，一句指向議題頁，不在組裡辯論；不要用 3:9 評論任何人有沒有得救，也不要用 3:10 給任何人貼標籤。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人誠實說出自己跌倒的方向、心裡最常控告自己的那一句話，並說出這一週朝著父走的第一步。"],["t","【看】看見自己"],["n","5. ★★★ 用豆豆來比喻，你現在比較像哪一個畫面：坐在草地上不敢再走、跌了又爬起來往前走、還是背過身往別的方向跑？說出一個具體領域，例如脾氣、手機、金錢。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:1 和 3:20 兩遍。哪一個詞讓你停下來：你看、何等的慈愛、真是他的兒女、神比我們的心大、一切事沒有不知道的？今天這個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你的心最常用哪一句話責備你？例如「你永遠不夠好」「你這樣也配叫他父親嗎」。這句話最早是從誰的口中、在哪一個時期聽到的？選一句說出來就好。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「神比我的心大，一切事沒有不知道的。」然後說出你這一週要交給他的那一句自責，不必說細節。右手邊的人只回一句「在父那裡有中保」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你朝著父走的第一步：哪一天、幾點、在哪裡、做甚麼；若有一件事一再跌倒，也寫下你要告訴的那一位屬靈同伴的名字，以及約他的時間。"],["m","帶領提醒：這一化可能碰到得救的焦慮、長期的自責、強迫性的重播，也可能碰到家庭暴力、被控制、童年被父親傷害的痛。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不用 3:9 或 3:16 責備任何人；有人透露正在不安全的關係裡，不在組裡勸他回去，會後單獨關心，必要時協助他尋求專業協助，有人身危險時協助報警。若有人拿 1:8 替刻意的罪辯護，不在組裡辯論，會後溫和地單獨約談。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個每天抬頭看的時刻、一個要愛的人、一位要講給他聽的朋友。"],["n","10. ★★ 這一週你每天讀 3:1、停十秒的時間是幾點、在哪裡？請左手邊的人週三傳訊問你一次。"],["n","11. ★ 你身邊有沒有一個關係，需要你在誠實上說一次真相或說一次「不」？只說是哪一種關係，以及你準備怎麼開口的第一句話。"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位看得見的、有實際需要的弟兄姊妹或朋友，可能是失業、生病，或正為得救而害怕的人。當場說出他的名字，說出這一週哪一天、用甚麼行為去愛他，帶甚麼去，並和他一起讀 3:18。"],["n","13. ★ 誰曾經在你跌倒的時候，沒有把你當外人，反而把手張開？說出他的名字，和這一週你要傳給他的那一句感謝。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經說神願意叫人作他的孩子，這是他先給的名分，不是表現好才換來的。第二句，孩子學走路會一直跌倒，重要的是他朝著父親走，跌倒時也有人扶。第三句，你的心如果一直責備你，聖經說神比你的心大，他甚麼都知道，也仍然愛你。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案；不在組裡評論任何人的得救、婚姻或家務事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週朝著父走的第一步是甚麼，要在行為和誠實上去愛的那一個人是誰。"],["p","然後為三種人指名禱告：一位為得救確據焦慮或長期自責的人；一位一再跌倒、願意回頭的人；一位在不安全關係裡、需要保護的人。"],["p","最後由組長慢慢讀一遍：「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。」（3:1）"]]},"4":{"no":4,"vol":"《321約翰一書講義》第四課·約翰一書第四章","title":"不是我們愛神，乃是神愛我們——試驗、先愛、懼怕","chars":5090,"min":60,"deep":8,"dchars":1888,"tchars":1622,"blocks":[["h","一、先盛一碗湯"],["p","弟兄姊妹平安。家豪是一位科技公司的專案經理，四十出頭，信主十幾年。他的手機裡有一張表，是自己設計的：每天一格，讀經打勾，禱告打勾，聚會打勾，全做到就是綠色，漏一樣就是紅色。他說這樣比較有紀律。去年秋天，他父親半夜中風，送進加護病房。那一個星期，他在醫院、公司和保險公司之間來回跑，表格連續七天全紅。第七天深夜，他坐在加護病房外面的走廊，想禱告，卻開不了口。他心裡只有一句話：一整個星期都沒有理神，出了事才來求他，好意思嗎？"],["p","隔天一早，七十多歲的母親提著保溫壺來了。她沒有問兒子這幾天睡了沒有、公司的事處理了沒有，也沒有算他這個星期回家幾次。她先打開蓋子，盛了一碗雞湯遞過來：「先喝。」家豪捧著那碗湯，在走廊上哭了。他後來說，那一刻他才發現，自己這些年待神的方式，好像神是一位要看報表的主管；可是他從小到大，母親從來不是這樣待他的。"],["p","約翰一書第四章要處理的，就是家豪那張表。全卷五章五個字：光、住、兒、愛、勝；第四章是「愛」，被愛的人開始會愛。這一章是全新約「愛」字最密的地方，4:7 到 4:21 短短十五節，愛的名詞和動詞出現了二十七次。而這一章最重要的一句話，正好把那張表翻過來：「不是我們愛神，乃是神愛我們」（4:10）。前三章的命令，行在光中、遵守誡命、彼此相愛，到了這裡才看清楚：命令不是門檻，是回應。"],["p","這一課用三個詞走完第四章：試驗、先愛、懼怕。先學會分辨甚麼是從神來的，再看清楚是誰先出手，最後看那一份藏在心底、怕神算總帳的懼怕，怎樣被愛丟到門外。"],["d",["我信主很多年，還是常常覺得自己愛神愛得很少、很冷，這是不是表示我根本沒有真的信？","先不要急著給自己下這個判決。約翰寫這一章，正是要把順序擺回來：「不是我們愛神，乃是神愛我們」（4:10）。你的確據不是建立在你的愛有多熱，而是建立在神已經做成的事上：他差兒子作了挽回祭。覺得自己愛得冷，常常不是信仰死了的證據，反而說明你心裡還在乎他。實際的做法是：這一週不要再量自己的愛，每天早上只讀 4:10 和 4:19 一次，然後寫下一件昨天神先愛你的事，一件就好。愛會從被愛的地方慢慢長出來。若你長期低落到影響睡眠和生活，也請找醫生或輔導談一談，那不是軟弱的證明。本講義的全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。"]],["h","二、試驗：看他怎樣講耶穌"],["p","很有意思，約翰還沒有開始講愛，先講分辨。「親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於神的不是，因為世上有許多假先知已經出來了。」（4:1）那時教會剛經歷分裂，出去的人帶著一套很屬靈的說法；留下來的人心裡發慌：會不會錯的是我們？"],["p","「試驗」這個字，是驗金屬的字。驗不是為了燒掉，是為了認出真的。用甚麼驗？約翰給的標準短到可以寫在手心上：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）。他沒有說看誰的異能大、誰的聚會人多。他說，看他怎樣講耶穌。離開的人也談耶穌，可是他們的耶穌沒有真正的身體。拆掉了肉身，就拆掉了十字架；拆掉了十字架，罪人就沒有地方可去了。"],["p","約翰說那是「敵基督者的靈」（4:3），這句話很重，可是請留意他的寫法：他講的是一種靈、一種教導，沒有叫讀者去猜那個人是誰。他給的是標準，不是名單。今天的講台和小組也照這個樣子，不拿這幾節去貼任何人、任何宗派、任何國家或政治人物的標籤，也不拿來算日子；約翰在一世紀就說過「如今是末時了」（2:18）。"],["p","分辨也落到每一個人的手機上。群組裡轉來一段「神告訴我」的影片，不必一律拒絕，也不必照單全收。問約翰教我們問的問題：聽完之後，耶穌是更清楚，還是更模糊？"],["p","然後約翰換了一個稱呼：「小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。」（4:4）出去的那一群聲勢反而比較大，約翰不叫留下的人去比人數，叫他們比住在裡面的那一位。「勝了」是完成式，是已經成就的事實，不是一句叫人更用力的口號。一個怕被騙的人，看誰都可疑，心裡很累；一個知道自己屬神的人，才能安靜地聽、安靜地試。分辨不是出於懼怕，是出於確信。"],["d",["群組裡有人轉傳「預言」，說某位領袖就是敵基督，還推算出主再來的日子，我該怎麼看？","這正是 4:1 要我們試驗的。約翰給的標準是基督論：這個信息怎樣講耶穌？是不是認耶穌基督是成了肉身來的，是不是把人帶回十字架？約翰在一世紀就說「如今是末時了」（2:18），可見末時不是一個可以推算的倒數，而是教會從那時起一直活在其中的光景；把那個稱號貼在某一個人或群體身上，帶來的往往是恐懼和分裂。實際的做法有三步：第一，不急著轉傳；第二，拿去問你的牧者或組長，一起回到經文；第三，問自己：讀完這段信息，我是更平安地信靠主，還是更焦躁地盯著新聞？前者才像是從神來的。本講義的全卷立場見〈分辨：誰是敵基督、假先知？怎樣試驗諸靈？〉。"]],["h","三、原文亮光：先愛的三個字"],["p","第四章的中心，可以用三個原文字打開。"],["p","第一個字是 ἀγάπη（agapē），愛。約翰兩次說「神就是愛」（4:8），原文是 ὁ θεὸς ἀγάπη ἐστίν（ho theos agapē estin）。「神」前面有冠詞，「愛」前面沒有。這種句型說的是主詞的本質，不是等號，所以不能倒過來讀成「愛就是神」。要知道愛是甚麼，得從神身上看。約翰用相近的句型說過神本質三面：「神是個靈」（約 4:24）、「神就是光」（1:5）、「神就是愛」（4:16）。光與愛不互相抵消；這位愛的神是聖潔的，所以放縱、操控、沒有界線的委屈，都不是從他來的。"],["p","第二個字是 ἱλασμός（hilasmos），挽回祭。「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。」（4:10）這個字在新約只出現兩次，都在約翰一書（2:2；4:10）。學者討論它是平息忿怒的祭，還是除去罪污的祭；可是 4:10 的主詞從頭到尾是神。他愛了我們，他差了兒子，他使兒子作挽回祭。十字架不是兒子去說服一位不情願的父親，也不是人捧著祭物去平息一位生氣的神，是神自己預備了祭，自己擔下了代價。連「愛」這個字的主詞，都先是他。本講義的全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉。"],["p","第三個字是 ἀγαπῶμεν（agapōmen），我們愛。「我們愛，因為神先愛我們。」（4:19）原文只有七個字：我們愛，因為他先愛了我們。最特別的是，原文沒有受詞，沒有說我們愛誰。後來有抄本替它補上「他」或「神」，可是主要的校勘本保留了留白，和合本也忠實地留白。這個留白很寬：我們會愛神、會愛弟兄、會愛那個難愛的人，這整個愛的能力，都是從他先愛我們那裡長出來的。愛不是我們的發明，是我們的回應。"],["p","這三個字放在一起，就把家豪那張表翻過來了。表格的邏輯是：我先做到，神才接納。4:10 和 4:19 的邏輯是：神先愛了，我才開始會愛。前者叫人越做越怕，越查越冷；後者叫人從被愛的地方慢慢暖起來。母親沒有等兒子交出報表才盛湯，這使我們想起那位更早出手的神。321 在末端認出這一節：焦點在耶穌，不在自己。不是盯著自己的愛有多少，是定睛在那位先愛我們的主；焦點一轉，愛就開始流動。"],["d",["「神就是愛」，那神還會審判嗎？會不會到最後每一個人都得救？","約翰沒有用「神就是愛」取消審判。同一章就說到「審判的日子」（4:17），同一位約翰也記下「神的震怒常在他身上」（約 3:36）。「神就是愛」說的是本質，不是一份全部屬性的清單；神的忿怒不是愛的反面，是聖潔的愛對罪的拒絕。正因為他愛，他不能對毀壞人的罪無動於衷。而這位愛的神解決審判的方法，就在 4:10：他自己差兒子作了挽回祭。所以答案不是「沒有審判」，而是「審判有人替我們擔了」。至於人人最後都得救的說法，本講義不採，全卷立場見〈挽回祭與救恩的範圍：基督為誰的罪死？〉；更要緊的是今天就把這份愛告訴還不認識他的人。實際一點：這一週想一位你掛念的未信親友，為他具體禱告三次。詳見 〈4:8「神就是愛」——那審判與忿怒呢？「愛就是神」對不對？〉。"]],["h","四、懼怕：愛把它丟到門外"],["p","「這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼。因為他如何，我們在這世上也如何。」（4:17）約翰沒有取消審判，可是被愛的人可以坦然站在那裡，憑的不是自己無可指摘，是因為我們在基督裡。"],["p","接著是很多人背得出、也最常被用錯的一節：「愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰，懼怕的人在愛裡未得完全。」（4:18）這裡的懼怕是哪一種？約翰自己下了定義：懼怕裡含著刑罰。「刑罰」原文 κόλασις（kolasis），是懲罰的字；前一節剛講審判的日子。所以這是罪人站在審判前的懼怕：怕神終究會算總帳，怕自己到最後被丟出去。家豪在醫院走廊開不了口，就是這一種：他怕神看他的報表。"],["p","約翰的答案，不是「你要更努力地愛，才不會怕」。答案是神的愛。挽回祭是神自己預備的，審判的刑罰已經落在他兒子身上。「除去」原文是「丟到外面」：不是你把懼怕趕走，是他的愛把它丟出門外。這也和敬畏神不同；敬畏是兒女尊重聖潔的父親，4:18 的懼怕是奴僕怕主人的鞭子。"],["p","這一節要很小心地教。它不是心理診斷，不是拿來量焦慮、恐慌、創傷的尺。有些弟兄姊妹有焦慮症，有些人受過傷，身體到今天還記得那份驚嚇；他們需要的是陪伴、醫療與專業輔導，不需要一句「你的愛不完全」。禱告很寶貴，可是禱告不取代醫生和輔導；有人正在服藥，請繼續就醫，有任何調整都先和醫生商量。神也常常藉著醫生和輔導，照顧他的孩子。"],["p","然後約翰把愛帶回看得見的地方：「人若說『我愛神』，卻恨他的弟兄，就是說謊話的」（4:20）。這不是一把量別人的尺，是一面先照自己的鏡子。說愛一位看不見的神很容易，愛一個每週坐在你旁邊、會讓你失望的人，才知道愛是真的。"],["p","可是這一節也最容易傷人。有人在家裡、在教會受了很深的傷，卻聽見有人引這一節說：你不肯回去，就是不愛神。這不是約翰的意思。約翰說愛要「在行為和誠實上」（3:18）。誠實的愛承認傷害是真的，也不假裝一個危險的人已經安全。原諒可以交給神，和好卻需要對方真實的悔改，也需要安全；為了保護自己和孩子保持距離、設下界線，不等於恨。若你正遭遇家暴、性侵或虐待，請向可信的人和相關機構求助；涉及犯罪的，請報警。讓神作審判者，讓自己作被愛的人；從那個位置，我們才有力氣按著誠實和界線，去愛那看得見的弟兄。"],["d",["我有焦慮症，正在吃藥，讀到 4:18 就很自責：是不是我的愛不完全，所以才會怕？","不是。請先看約翰自己怎樣定義這裡的懼怕：「懼怕裡含著刑罰」（4:18）。他處理的是對審判的懼怕，怕神終究不要我；不是醫學上的焦慮症，也不是創傷之後身體的驚嚇。這兩件事都真實，卻不是同一件事。就算是對審判的懼怕，約翰的答案也不是「你要更努力」，而是回到 4:10：挽回祭是神自己預備的。主耶穌在客西馬尼也說「我心裡甚是憂傷，幾乎要死」（太 26:38），憂傷本身不是罪。神常常藉著醫生、藥物和輔導照顧你，所以請不要因為這一節自行停藥，有任何調整先和醫生商量。若你有傷害自己的念頭，請今天就告訴一位信得過的人，並尋求專業協助。詳見 〈4:18「愛裡沒有懼怕」——那「敬畏神」呢？有焦慮的人是愛不完全嗎？〉。"]],["d",["我在教會被一位同工深深傷害過，到現在都沒辦法和他同坐一排，這樣算不算 4:20 說的恨弟兄？","不必急著給自己定罪。約翰說的恨，是心裡定意要對方不好、拒絕把他當人看；受傷之後需要距離，是另一回事。可以分三層來想。第一層是原諒：把討公道的權柄交給神，經上說「伸冤在我，我必報應」（羅 12:19），這是你和神之間的事，可以一點一點來。第二層是和好：需要對方承認、悔改，也需要安全，不是你一個人能決定的；保羅也只說「若是能行，總要盡力與眾人和睦」（羅 12:18）。第三層是界線：在對方真正改變以前，保持距離、請牧者或長執陪同處理，是在誠實上的愛。實際一點：這一週把這件事告訴一位你信得過的屬靈長輩，並為自己的心禱告一句：求你保守我不被苦毒吞吃。若傷害涉及性騷擾或暴力，請向相關機構求助，必要時報警。本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 4:18 去量焦慮、恐慌、受過創傷的人，說他們會怕是因為愛不完全。這是錯的。4:18 的懼怕是含著刑罰、對審判的懼怕；答案是神的愛，不是人更努力，更不是叫人把病藏起來、偷偷停藥。"],["p","第二個偏差，是拿 4:20 要求受傷的人無條件回到不安全的關係，說你不回去就是恨弟兄。這也錯了。愛要在誠實上；原諒交給神，和好需要悔改與安全，不叫任何人留在危險裡。"],["p","第三個偏差，是拿 4:1--3 去貼標籤或算日子，把那些稱號安在某個人、某個宗派、某個國家身上。約翰給的是標準，不是名單；標準是認不認耶穌基督是成了肉身來的。"],["p","第四個偏差，是把「神就是愛」倒過來讀成「愛就是神」：凡叫作愛的都對，神不會審判，也不在乎聖潔。可是這位愛的神也是光，他的愛是 4:10 那個十字架的形狀，不是任何感覺都可以冒用的名字。"],["p","第五個偏差，是把 4:7 以後的命令重新變回門檻：要先愛得夠多，才確定自己被神接納。這正好把 4:10 和 4:19 的順序弄反了。命令不是門檻，是回應；不是做到了才被愛，是被愛了才開始學。"],["d",["「凡有愛心的，都是由神而生」（4:7），那不信主卻很有愛心的人，算是從神生的嗎？","這一節要放在上下文裡讀。約翰不是在列一張得救的條件表，而是說明一件事：真正認識神的人，身上一定會長出愛來，因為神的本性是愛。所以這一節說的是從神生的人必有的記號，不是說凡做善事的人都已經從神生了。不信主的人能善良，因為各樣美善的恩賜都是從上頭來的（雅 1:17）；我們不必貶低朋友的愛，可以欣賞它，並告訴他源頭。實際一點：這一週對一位很有愛心的未信朋友說一句真心的感謝，並告訴他，你相信他的這份好，是從一位很愛他的神來的。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：愛在心裡口難開，愛要用表現來換。很多人在華人家庭長大，父母很少說「我愛你」，愛常常藏在成績、排名和一句「還可以更好」後面。考一百分才得到一個笑臉，考九十分先被問那十分去哪裡。這樣長大的孩子，很自然把同一套帶進信仰：神也在看我的成績單。家豪那張紅綠表格，其實是從小學的成績單長出來的。4:10 對這樣的人是好消息：在你還沒有交出任何一張成績單的時候，神已經差他的兒子來了。教會也可以學著把愛說出口。"],["p","第二個問題：孝道與傷害。有人小時候被父親打、被母親用話刺傷，如今父母老了，親戚說「天下無不是的父母」，教會裡也有人引 4:20 說：你連父母都不肯回去照顧，怎麼說你愛神？請記得，聖經叫人孝敬父母，也叫人在行為和誠實上愛人；孝敬不等於假裝傷害沒有發生，也不等於住進一個仍然危險的家。可以照顧，也可以有界線，例如在安全的地方探望、請可信的長輩或社工一起討論。若傷害仍在發生，涉及家暴或虐待，請向相關機構求助，必要時報警。原諒是你和神之間的路，可以慢慢走；和好需要對方的悔改與安全。教會的責任，是陪這樣的人走，不是替他的傷口下判決。"],["h","七、活出321——讓先愛我們的那一位站在中心"],["p","經文先講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：4:9 說神差他獨生子到世間來，4:2 說他是成了肉身來的。他沒有站在遠處愛我們，他走進來，會累、會哭、會流血。4:17 又說「他如何，我們在這世上也如何」（4:17）：我們跟著他，也走進一個個真實的人中間，不只在遠處為人禱告。"],["p","聖經是我的準則：4:1 叫我們試驗諸靈，標準不是感覺有多強，是使徒所傳、聖經所寫的那一位耶穌基督。一切「神告訴我」的話，都要回到經文前面被驗一驗。"],["p","聖靈是我的引導：「神將他的靈賜給我們，從此就知道我們是住在他裡面，他也住在我們裡面。」（4:13）叫我們知道自己被愛、叫我們認得出真假的，都是他所賜的靈；分辨不是靠自己的機警。"],["p","讓耶穌作王：「那在你們裡面的，比那在世界上的更大。」（4:4）作王的不是聲勢最大的那一群，也不是我心裡的懼怕。「父差子作世人的救主」（4:14），連那些還不認識他的人，也在他愛的範圍裡。"],["p","讓耶穌得著一切的榮耀：4:10 連「愛」這個字的主詞都先是他。我們的愛再多，也是回應；功勞不在回應的人，在先出手的那一位。"],["p","建立屬神的體系：「從來沒有人見過神，我們若彼此相愛，神就住在我們裡面」（4:12）。屬神的體系不是先蓋一套組織，是先有一群被愛、也彼此相愛的人；看不見的神，在他們中間被看見。國度321空中團契散在各國，見面不容易，更需要在行為和誠實上，把這份愛具體送到彼此手上。"],["d",["我們小組彼此不熟，每次聚會都很客氣，要怎樣開始在行為和誠實上彼此相愛？","這種愛很少從大事開始，多半從小而具體的事開始。可以試兩步。第一，記得：每次聚會結束前，每人說一件這週最需要代禱的事，指定一位記下來，下週第一句先問進展。第二，出手：組裡有人生病、搬家、失業、家裡有喪事，約定在三天之內至少有一個具體行動，一個便當、一通電話、一段錄給他的禱告語音。同時記得界線：關心不等於打聽，對方不想說的不追問，聽到的不外傳。被愛的人才會愛，所以組長自己先去愛組裡最安靜的那一位。"]],["h","八、四種心，誰最需要先被愛"],["p","驕傲型的心，會說「我愛神」，卻覺得某些弟兄姊妹不值得花時間：我讀經、我禱告、我服事，可是那個人太難相處了。4:20 是一面鏡子，不是為了定罪，是為了照見：愛那位看不見的神，要在愛那看得見的人身上顯出來。驕傲的藥不是更用力，是回到 4:10：我也是在還不可愛的時候被愛的。"],["p","恐懼型的心，常怕神有一天不要我，每跌倒一次，就覺得自己被推出門外一步。請把 4:10 和 4:18 放在一起讀：你的平安不建立在你愛得多好，是建立在他先預備了挽回祭。若你的恐懼已經大到影響睡眠和生活，去看醫生、找輔導，也是神照顧你的方式，那不是不屬靈。"],["p","羞恥型的心，覺得自己不值得被愛，人一靠近就想躲。請聽約翰的語氣，這一章他三次叫「親愛的弟兄啊」（4:1、7、11），原文就是「被愛的人哪」。神知道你最怕被看見的那一面，仍然先愛了你。「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。」（羅 5:8）"],["p","受傷型的心，也許正是被弟兄傷害的那一位，一讀到 4:20 就更痛。你不必假裝不痛，也不必急著回到危險裡。把那個人交給公義的審判者，讓自己先待在神的愛裡；愛會在安全和誠實裡慢慢恢復，不是用逼的。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 4:10 和 4:19，然後寫下一句「今天神先愛我的地方是……」，只寫一件，連續七天。"],["p","第二，如果你心裡或手機裡也有一張只記自己做到多少的表，這一週把它改一改：除了記你做了甚麼，也記神為你做了甚麼。"],["p","第三，帶著一則你最近聽到的「神告訴我」或轉傳的信息，問自己約翰的問題：它講的耶穌，是不是那位成了肉身、為我們作挽回祭的主？必要時拿去和牧者或組長一起查考。"],["p","第四，說出一位你很難愛、但相處安全的弟兄姊妹，這一週為他禱告三次，並做一件具體的小事；若你面對的是曾經傷害你、仍不安全的人，這一週的功課是設下界線，並把他交給神。"],["p","第五，如果你心裡長期被懼怕或焦慮壓著，這一週把它告訴一位信得過的人；需要的話，預約一次醫生或輔導。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：不是我愛神，乃是神愛我；他差他的兒子為我的罪作了挽回祭。"],["p","我宣告：我愛，因為神先愛我；我的愛是回應，不是門檻。"],["p","我宣告：那在我裡面的，比那在世界上的更大；我要用耶穌基督來試驗我所聽見的。"],["p","我宣告：神的愛要把審判的懼怕丟到門外；我要在行為和誠實上，去愛我看得見的弟兄。"],["d",["我很想照 4:19 讓神先愛我，可是具體來說，每天要怎樣讓他先愛我？","可以從一個很小、很固定的節奏開始。早上醒來，先不要拿手機看訊息，先用一分鐘慢慢讀一節經文：第一週輪流讀 4:9、4:10、4:16、4:19，讀的時候把「我們」換成「我」。然後安靜三十秒，不急著求甚麼，只是讓這句話落進心裡，像家豪捧著那碗湯，先喝。晚上睡前，回想一天裡神先愛你的一個地方：一頓飯、一個人的一句話、一次被保守的平安，寫一行。這不是另一張打卡表，漏了也不用自責，明天再來就好。一兩週之後你會發現，愛人的力氣不是逼出來的，是從被愛的地方流出來的。"]],["h","十、結語"],["p","第四章從分辨開始，在一位看得見的弟兄結束。光、住、兒、愛、勝，這一章站在全卷的中心：被愛的人開始會愛。前三章的命令，到這裡都有了源頭；第五章的得勝，也要從這裡長出來。"],["p","家豪後來沒有把那張表刪掉，他改了表頭。原來那一欄寫的是「我今天做到了沒有」，現在多了一欄：「今天他先愛我的地方」。他父親出院那天，他在那一欄寫下：媽媽的湯；護理師半夜幫爸爸翻身；小組輪流送來的七頓晚餐。他說，表上還是有紅格子，可是他不怕了。這一課的焦點，不在家豪變得多屬靈，也不在我們愛得多好，焦點在那一位先出手的神。「不是我們愛神，乃是神愛我們」（4:10）；「我們愛，因為神先愛我們」（4:19）。請你不要帶著更重的擔子離開，請你帶著被愛的確據離開。"],["p","我們一起低頭禱告。先愛我們的父神，謝謝你，在我們還沒有愛你的時候，你已經差你的兒子為我們的罪作了挽回祭。求你把我們心裡那張只記自己做到多少的表翻過來，讓我們先被你愛。求你賜我們分辨的心，用耶穌基督來試驗我們所聽見的；也求你把審判的懼怕丟到門外。求你看顧正在焦慮、恐慌、創傷裡的弟兄姊妹，賜他們好的醫生、好的陪伴和夠用的力量；也保護正在危險中的人，帶領他們找到可信的幫助。求你使我們在行為和誠實上，去愛那看得見的弟兄。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰愛得最多，是讓每一個人誠實說出自己心裡那張表、那份藏著的懼怕，並說出這一週要具體去愛的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是試驗、先愛、懼怕。席上可能有正在服藥、看輔導的弟兄姊妹，也可能有受過傷、被人用 4:20 壓過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：分辨的標準是怎樣講耶穌；命令不是門檻，是回應；4:18 的懼怕是對審判的懼怕，答案是神的愛，不是自己更
