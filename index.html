><p>如果你心裡常有「神會不會不要我」的怕，今天把 4:10 和 4:18 放在一起讀。你的平安不是建立在你愛得多好，是建立在他先為你預備了挽回祭。那份怕不是你的家，愛才是。</p>"},{"a":19,"z":19,"star":3,"grk":"<p lang=\"grc\">ἡμεῖς ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.</p>","lit":"<p>我們愛，因為他自己先愛了我們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡμεῖς ἀγαπῶμεν</td><td>hēmeis agapōmen</td><td>我們愛（或：讓我們愛）</td><td>主詞加重；原文沒有受詞</td></tr><tr><td>ὅτι</td><td>hoti</td><td>因為</td><td>愛的理由寫在後半句</td></tr><tr><td>αὐτὸς πρῶτος</td><td>autos prōtos</td><td>他自己首先</td><td>「先」是時間，也是源頭</td></tr><tr><td>ἠγάπησεν ἡμᾶς</td><td>ēgapēsen hēmas</td><td>愛了我們</td><td>不定過去式：十字架那一次已經發生</td></tr><tr><td>ἡμεῖς ἀγαπῶμεν ὅτι αὐτὸς πρῶτος ἠγάπησεν</td><td>hēmeis agapōmen hoti autos prōtos ēgapēsen</td><td>我們愛，因為他先愛了</td><td>全卷樞紐濃縮成一句</td></tr><tr><td>+ αὐτόν（RP）</td><td>+ auton</td><td>加上「他」</td><td>拜占庭讀法替動詞補了受詞</td></tr></table>","gram":"<p><strong>ἀγαπῶμεν：「我們愛」還是「讓我們愛」？</strong>ἀγαπῶμεν（agapōmen）這個形式，現在直說語氣和現在假設語氣拼法一樣。讀作直說，是陳述：我們愛，因為他先愛我們。讀作勸勉，是邀請：讓我們去愛吧，因為他先愛了我們（4:7 開頭同一個字，和合本譯作「應當彼此相愛」）。多數譯本與和合本採直說語氣，因為下半句的 ὅτι 給的是理由，整節像是 4:10 的總結。兩種讀法都通往同一個方向：我們的愛是第二個，他的愛是第一個。</p><p><strong>愛誰？原文沒有說。</strong>SBLGNT（與 WH、Treg、NA28 同）只有 ἡμεῖς ἀγαπῶμεν，沒有受詞；和合本「我們愛」也沒有受詞，忠實保留了這個留白。RP 代表的拜占庭傳統加了 αὐτόν「他」，也有抄本作「神」，把它讀成「我們愛神」。原文的留白更寬：我們愛神，也愛弟兄；愛的一切能力，都從他先愛我們而來。下一節馬上把「愛神」和「愛弟兄」綁在一起。</p><blockquote>判斷：保留無受詞的讀法。「我們愛」說的是被愛的人身上長出來的整個愛的能力。詳見 〈4:19「我們愛，因為神先愛我們」——人能不能先愛神？〉。</blockquote>","exp":"<p>「我們愛，因為神先愛我們」（4:19）。這是全卷最短、也最重的一節。原文只有七個字：我們愛，因為他先愛了我們。</p><p>注意，原文沒有說我們愛誰。不是只有「我們愛神」，也不是只有「我們愛人」。它說的是：我們之所以會愛，愛神、愛弟兄、愛那個難愛的人，是因為有一位先愛了我們。愛不是我們的發明，是我們的回應。</p><p>「先」這個字很溫柔。我們還沒有開口，他已經愛了；我們還在遠方，他已經出門迎接。很多人的信仰活得很累，是因為把順序弄反了：以為要先愛得夠多，才可以確定神愛自己。於是每天檢查自己的愛夠不夠熱，越檢查越冷。約翰把順序擺回來：他先。</p><p>想想一個嬰孩怎樣學會笑。不是父母教他笑的技巧，是父母一次又一次地對著他笑，有一天，他就笑回來了。我們的愛也是這樣，是被愛到一個地步，才笑回去的。</p><p>所以今天你若覺得自己愛不出來，不要先逼自己。回到這一節，讓他先愛你。在禱告裡安靜坐一會兒，讓那句「乃是神愛我們」（4:10）落進心裡。321 說「焦點在耶穌」，在這一節看得最清楚：不是盯著自己的愛有多少，是定睛在那位先愛我們的主。焦點一轉，愛就開始流動。</p>"},{"a":20,"z":21,"star":2,"grk":"<p lang=\"grc\">ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν οὐ δύναται ἀγαπᾶν.</p><p lang=\"grc\">καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.</p>","lit":"<p>如果有人說「我愛神」，卻恨他的弟兄，他是說謊的人；因為那不愛自己所看見之弟兄的，就不能愛他所沒有看見的神。</p><p>我們從他領受了這條命令：愛神的，也要愛他的弟兄。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐάν τις εἴπῃ</td><td>ean tis eipē</td><td>如果有人說</td><td>回到 1:6、8、10「若說」的句型</td></tr><tr><td>μισῇ</td><td>misē</td><td>恨</td><td>持續的敵意與拒絕；3:15 恨與殺人相連</td></tr><tr><td>ψεύστης</td><td>pseustēs</td><td>說謊的人</td><td>話和生命不一致</td></tr><tr><td>ὃν ἑώρακεν</td><td>hon heōraken</td><td>他已經看見的</td><td>看得見的弟兄是愛的試驗場</td></tr><tr><td>οὐ δύναται ἀγαπᾶν</td><td>ou dynatai agapan</td><td>不能愛</td><td>RP 作 πῶς「怎能」，即和合本古卷註</td></tr><tr><td>ταύτην τὴν ἐντολὴν</td><td>tautēn tēn entolēn</td><td>這條命令</td><td>約 13:34 的新命令</td></tr><tr><td>ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν</td><td>hina ho agapōn ton theon agapa kai ton adelphon</td><td>愛神的也要愛弟兄</td><td>兩條誡命綁成一條</td></tr></table>","gram":"<p><strong>「恨」是甚麼？</strong>μισέω（miseō）在約翰筆下不是一時的情緒，而是持續的敵意與拒絕：不願對方好，甚至願他不存在，所以約翰說「凡恨他弟兄的，就是殺人的」（3:15）。受了傷、心裡有痛、需要和某人保持距離，不等於這裡的「恨」。</p><p><strong>從看得見的到看不見的。</strong>4:20 是一個由小推大的論證：看得見的弟兄都不愛，怎麼能說愛看不見的神？和合本正文「就不能愛」照 SBLGNT 的 οὐ δύναται；古卷註「怎能愛沒有看見的神呢」照 RP 的 πῶς。兩個讀法意思一樣，一個是陳述，一個是反問。</p><p><strong>4:21 把兩條誡命綁在一起。</strong>「你要盡心、盡性、盡力愛耶和華」（申 6:5）和「愛人如己」（利 19:18），耶穌把它們並列；約翰更進一步，說它們是同一條命令。愛與界線、和好的處理，本講義的全卷立場見〈愛、界線與和好：受了傷還要愛嗎？愛就是回到原來的關係嗎？〉；本章見 〈4:20「人若說我愛神，卻恨他的弟兄」——在教會受過傷、無法與某人和好的人怎麼辦？〉。</p>","exp":"<p>〔舊約〕申 6:4--5（申命記講義第 6 章）</p><p>「人若說『我愛神』，卻恨他的弟兄，就是說謊話的」（4:20）。約翰又用了「人若說」。這個句型在第一章出現三次，主詞都是「我們」，他先把自己放進去。這不是一把拿來審查別人的尺，是一面先照自己的鏡子。</p><p>為甚麼愛神一定會帶出愛弟兄？因為神看不見，弟兄看得見。說愛一位看不見的神很容易，沒有人能檢查；愛一個每週坐在你旁邊、會說錯話、會讓你失望的人，才知道愛是真的還是假的。弟兄是愛神的試驗場。這和申命記「你要盡心、盡性、盡力愛耶和華」（申 6:5）是同一條線：愛神與愛人從來分不開。</p><p>但這一節常常被用錯。有人在家裡、在教會受了很深的傷，卻聽見人引這節說「你不肯回去，就是不愛神」。這不是約翰的意思。約翰說的愛，要「在行為和誠實上」（3:18）。誠實的愛，承認傷害是真實的；誠實的愛，也不假裝一個危險的人已經安全。原諒可以交給神，和好卻需要對方真實的悔改，也需要安全。為了保護自己和孩子而保持距離、設下界線，不等於恨。遭遇家暴、性侵或虐待的人，請向可信的人和相關機構求助；涉及犯罪的，應當報警。</p><p>那麼「恨」是甚麼？是心裡決定不再願意對方好。受傷的人也許暫時沒有力氣靠近，卻仍可以在神面前，把那個人交給公義的審判者，求神保守自己的心不被苦毒吞吃。這樣的禱告，本身已經是愛的開始。</p><p>「愛神的，也當愛弟兄，這是我們從神所受的命令」（4:21）。這命令不是壓在受傷者身上的重擔，是被愛的人一步一步學的路。321 說謙卑是回到本位：讓神作審判者，讓自己作被愛的人。從那個位置，我們才有力氣，按著誠實與界線，去愛那看得見的弟兄。</p>"}],"5":[{"a":1,"z":1,"star":1,"grk":"<p lang=\"grc\">Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.</p>","lit":"<p>凡相信耶穌是基督的，都已經從神生了；凡愛那生他的，也愛那從他所生的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πᾶς ὁ πιστεύων</td><td>Pas ho pisteuōn</td><td>凡正在信的</td><td>現在式分詞：一直信著</td></tr><tr><td>ὅτι Ἰησοῦς ἐστιν ὁ χριστός</td><td>hoti Iēsous estin ho christos</td><td>耶穌是基督</td><td>信的內容：歷史上的那一位就是彌賽亞</td></tr><tr><td>ἐκ τοῦ θεοῦ γεγέννηται</td><td>ek tou theou gegennētai</td><td>已經從神生了</td><td>完成式：生在先，信把它顯明出來</td></tr><tr><td>τὸν γεννήσαντα</td><td>ton gennēsanta</td><td>那生的</td><td>指父神</td></tr><tr><td>τὸν γεγεννημένον ἐξ αὐτοῦ</td><td>ton gegennēmenon ex autou</td><td>那從他所生的</td><td>單數：每一位弟兄姊妹</td></tr><tr><td>ἀγαπᾷ καὶ</td><td>agapa kai</td><td>也愛</td><td>直說語氣：一個家自然的事</td></tr></table>","gram":"<p><strong>信與新生，誰先誰後？</strong>πιστεύων（pisteuōn） 是現在式分詞，γεγέννηται（gegennētai） 是完成式：「凡一直信的，已經從神生了」。約翰慣用這個句型：2:29 行義的、4:7 愛人的，都是「從神生的」記號。有人據此主張新生在信之先，信是新生的果子；也有人認為兩者同時發生，約翰只是從果子推回根。約翰在這裡不是要排列救恩的次序，是要給確據：你今天信，說明神已經在你裡面動了工。這使我們想起約 1:12--13，凡接待他的，「乃是從神生的」（約 1:13）。</p><p>後半句像一句家常話：愛父親的，也愛父親的孩子。τὸν γεγεννημένον（ton gegennēmenon） 是單數，有人以為指基督；但下一節立刻說「神的兒女」（複數），最自然的讀法是指每一位信徒。WH 省略第二個 καί（kai），意思不變。</p>","exp":"<p>「凡信耶穌是基督的，都是從神而生，凡愛生他之神的，也必愛從神生的。」（5:1）第五章一開頭，約翰把全卷的三條線打成一個結：信、從神生、愛。前四章這三樣輪流出現，像三股繩子各自繞了幾圈；到這裡，一句話就收在一起。</p><p>先看信的內容：耶穌是基督。這不是一種對神的模糊好感，是認定拿撒勒那一位有血有肉的人，就是神所應許的那一位。約翰的教會剛經歷分裂，有人把「耶穌」和「基督」拆開講；約翰把它接回來。信對了這一位，就說明一件更深的事：這個人已經從神生了。</p><p>再看愛的邏輯。你愛一個朋友，不一定會愛他的兄弟；但在神的家裡，愛父親的人會愛父親的孩子，因為他們身上有同一位父親的樣子。約翰不是在加一條新規矩，是在描述一個家的自然：認了父，就認了這一家人。</p><p>教會裡總有你很難愛的人。約翰沒有要你先喜歡他，也沒有要你假裝沒有受過傷；愛要「在行為和誠實上」（3:18），也需要智慧與界線。他只是請你換一個角度看那個人：先不問他做了甚麼，先問他是誰生的。當你看見他和你有同一位父親，你看他的眼光就開始不一樣了。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ποιῶμεν·</p><p lang=\"grc\">αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,</p>","lit":"<p>在這事上我們知道我們愛神的兒女：每當我們愛神，並且遵行他的誡命。</p><p>因為這就是對神的愛：要我們遵守他的誡命；而他的誡命並不沉重，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τούτῳ γινώσκομεν</td><td>en toutō ginōskomen</td><td>在這事上我們知道</td><td>約翰的「試驗」句型，給確據不是給審查</td></tr><tr><td>ὅταν τὸν θεὸν ἀγαπῶμεν</td><td>hotan ton theon agapōmen</td><td>每當我們愛神</td><td>愛神與愛人互相驗證</td></tr><tr><td>ποιῶμεν</td><td>poiōmen</td><td>遵行</td><td>RP 作 τηρῶμεν「遵守」</td></tr><tr><td>ἡ ἀγάπη τοῦ θεοῦ</td><td>hē agapē tou theou</td><td>對神的愛</td><td>受詞屬格：我們向神的愛</td></tr><tr><td>ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν</td><td>hina tas entolas autou tērōmen</td><td>就是要我們遵守他的誡命</td><td>ἵνα 說明愛的內容</td></tr><tr><td>βαρεῖαι οὐκ εἰσίν</td><td>bareiai ouk eisin</td><td>不是沉重的</td><td>βαρύς：壓在肩上的重；太 23:4 同字根</td></tr><tr><td>αἱ ἐντολαὶ αὐτοῦ</td><td>hai entolai autou</td><td>他的誡命</td><td>3:23：信子的名，彼此相愛</td></tr></table>","gram":"<p><strong>這是循環論證嗎？</strong>4:20 說愛弟兄證明愛神；5:2 反過來，說愛神證明愛弟兄。有人認為約翰在繞圈子；更好的讀法是：兩樣是同一份愛的兩面，像一個人的兩條腿，誰也離不開誰。愛弟兄而不愛神，會變成人情；說愛神而不愛弟兄，會變成空話。約翰把兩樣互相扣住。</p><p><strong>βαρεῖαι（bareiai） 不是「容易」。</strong>這個字是重擔的重，主責備文士和法利賽人時用的就是同一字根：「他們把難擔的重擔捆起來，擱在人的肩上」（太 23:4）。約翰沒有說誡命輕鬆，是說它不壓垮人；這使我們想起主說「我的擔子是輕省的」（太 11:30）。接下來 5:4 的 ὅτι（hoti）「因為」說明理由：不是誡命變輕了，是遵守的人換了一個生命。5:2 RP 作 τηρῶμεν（tērōmen），WH、NA28 作 ποιῶμεν（poiōmen），意思相近。本章議題 〈5:3「他的誡命不是難守的」——那為甚麼我覺得很難？〉 處理「那為甚麼我覺得很難」。</p>","exp":"<p>「我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的。」（5:3）讀到這一句，許多弟兄姊妹心裡會有一個小小的聲音：可是我覺得很難。這個聲音不必壓下去，約翰也沒有說容易。</p><p>先看他怎樣定義愛：「這就是愛他了」。愛神不是一種氣氛，也不是聚會時的一陣感動，是照他的話去活。這聽起來很硬，其實很溫柔：孩子愛父親，不只是說「我愛你」，也是聽他的話。誡命不是愛的對手，是愛的形狀。</p><p>再看「不是難守的」。原文的意思是不沉重，不壓垮人。同一個背包，給五歲的孩子背是重擔，給他父親背卻不算甚麼；背包沒有變輕，是背的人不同了。下一節一開頭的「因為」就是答案：凡從神生的，就勝過世界。神沒有把誡命改輕，他給了人一個新的生命來背它。</p><p>所以覺得難的人，不必懷疑自己不是神的兒女。保羅也寫過立志為善由得我、只是行出來由不得我（這使我們想起羅 7:18）。覺得難，常常說明你是真心在走這條路；只是別忘了，這條路不是靠你自己的腿力走完的。</p><p>321 在末端認出「讓耶穌作王」的意思：讓他作王，不是背起一副更重的軛，是把自己交在一位不壓垮人的王手裡。他吩咐的，他也給力量去行。</p>"},{"a":4,"z":5,"star":3,"grk":"<p lang=\"grc\">ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·</p><p lang=\"grc\">τίς δέ ἐστιν ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;</p>","lit":"<p>因為凡從神所生的，都勝過世界；而這就是那已經勝過世界的得勝：我們的信。</p><p>誰是那勝過世界的呢？豈不就是那相信耶穌是神兒子的人嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶν τὸ γεγεννημένον</td><td>pan to gegennēmenon</td><td>凡所生的（中性）</td><td>中性：著重那從神而來的生命本身</td></tr><tr><td>νικᾷ τὸν κόσμον</td><td>nika ton kosmon</td><td>勝過世界</td><td>νικάω 現在式：持續的得勝</td></tr><tr><td>ἡ νίκη</td><td>hē nikē</td><td>得勝（名詞）</td><td>全新約只此一次</td></tr><tr><td>ἡ νικήσασα</td><td>hē nikēsasa</td><td>那已經勝過的</td><td>不定過去式：一次完成的勝利（約 16:33）</td></tr><tr><td>ἡ πίστις ἡμῶν</td><td>hē pistis hēmōn</td><td>我們的信</td><td>πίστις 名詞在約翰書信只此一次</td></tr><tr><td>τὸν κόσμον</td><td>ton kosmon</td><td>世界</td><td>2:16 定義的世界：情慾與驕傲</td></tr><tr><td>τίς … εἰ μὴ</td><td>tis … ei mē</td><td>誰……豈不是</td><td>修辭問句：答案只有一個</td></tr><tr><td>ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ</td><td>ho pisteuōn hoti Iēsous estin ho huios tou theou</td><td>那信耶穌是神兒子的</td><td>得勝者的定義</td></tr></table>","gram":"<p><strong>兩個難得的字。</strong>νίκη（nikē）「得勝」這個名詞，全新約只在這裡出現；πίστις（pistis）「信心」這個名詞，約翰福音一次也沒有用，約翰書信也只有這一次。約翰平常只用動詞「信」，這裡卻把「得勝」和「信心」兩個名詞放在一起，像把一句話刻在石頭上。</p><p><strong>ἡ νικήσασα（hē nikēsasa） 是不定過去式，指哪一次的勝利？</strong>①指每個人信主的那一刻，世界的轄制被打斷；②指十字架上基督的得勝，「我已經勝了世界」（約 16:33）用的是同一個動詞的完成式，信心是把我們接上那場勝利的手；③指讀者在分裂中站住、勝過了假教訓，4:4 說「並且勝了他們」（4:4）。</p><p><blockquote>本講義合讀：勝利是基督已經得的，信是接上這勝利的路，在約翰的處境裡就顯為不被假教訓帶走。得勝的主詞是從神生的人，方法是信，對象是世界。</blockquote></p><p>這裡的 κόσμος（kosmos） 是 2:16 所說的「肉體的情慾、眼目的情慾，並今生的驕傲」（2:16），不是受造界，也不是人群。</p>","exp":"<p>〔約〕約 16:33（約翰福音講義第 16 章）</p><p>「因為凡從神生的，就勝過世界；使我們勝了世界的，就是我們的信心。」（5:4）這是全卷主軸上的「得勝」一站。讀這一節，先把三件事看清楚：誰勝？勝甚麼？怎樣勝？</p><p>誰勝？「凡從神生的」。不是最能幹的人，不是最屬靈的人，是從神生的人。得勝不是一種等級，是一種出身。約翰在 5:5 再問一次：「勝過世界的是誰呢？」（5:5）答案不是一張成績單，是一個信仰告白：信耶穌是神兒子的。</p><p>勝甚麼？世界。約翰在 2:16 已經替世界下了定義：肉體的情慾、眼目的情慾、今生的驕傲。所以得勝不是打敗別人，不是在辯論、職場、選舉裡贏過誰，也不是厭棄神所造的世界；是不再被這三樣牽著鼻子走。一個人今晚放下手機裡沒完沒了的比較，安靜下來向神說話，這就是一次勝過世界。</p><p>怎樣勝？信。主在最後的晚餐說：「在世上，你們有苦難；但你們可以放心，我已經勝了世界。」（約 16:33）勝利已經在十字架上得著了；信，是把我們的手放進那隻得勝的手裡。所以得勝者不是不跌倒的人，是跌倒了仍然信、仍然回到他那裡的人。</p><p>321 在末端認出「得勝者」的樣子：不是一群不會失敗的英雄，是一群從神生的孩子，靠著所信的那一位，一天一天不被世界帶走。</p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι·</p>","lit":"<p>這一位就是那藉著水和血而來的，耶穌基督；不是只在水裡，而是在水裡也在血裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οὗτός ἐστιν ὁ ἐλθών</td><td>Houtos estin ho elthōn</td><td>這是那來的</td><td>不定過去式：歷史上的一次來</td></tr><tr><td>δι᾽ ὕδατος καὶ αἵματος</td><td>di' hydatos kai haimatos</td><td>藉著水和血</td><td>一個介系詞管兩樣：一位來者，兩個記號</td></tr><tr><td>Ἰησοῦς Χριστός</td><td>Iēsous Christos</td><td>耶穌基督</td><td>同位語：來的就是這一位，不可拆開</td></tr><tr><td>οὐκ ἐν τῷ ὕδατι μόνον</td><td>ouk en tō hydati monon</td><td>不是單在水裡</td><td>針對只要水、不要血的說法</td></tr><tr><td>ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι</td><td>en tō hydati kai en tō haimati</td><td>在那水裡，也在那血裡</td><td>冠詞：讀者都知道的那水、那血</td></tr><tr><td>ἐν / διά</td><td>en / dia</td><td>在……裡／藉著</td><td>RP 少第二個 ἐν，意思不變</td></tr></table>","gram":"<p><strong>水和血指甚麼？</strong>①<strong>洗禮與十架</strong>：水指耶穌在約旦河受洗，血指他在十字架上流血。相傳克林妥一類的教師主張「基督」在受洗時降在耶穌身上，受難以前就離開了；照教會的傳統，愛任紐記載過這種說法。「不是單用水」正好對著這種講法。難處：這是從教父資料推回去的背景，信中沒有點名。②<strong>出生與受死</strong>：水指人出生時的羊水，強調他真有肉身（4:2）。難處：古代少用「水」指出生。③<strong>聖禮</strong>：水指洗禮，血指聖餐。難處：ἐλθών（elthōn） 是不定過去式，指過去一次的「來」，不是教會不斷舉行的禮儀。④<strong>約 19:34 的血和水</strong>：兵丁扎他的肋旁，「隨即有血和水流出來」（約 19:34），約翰接著強調親眼見證。難處：次序相反，那裡是一個事件，這裡是兩個記號。</p><p><blockquote>本講義以①為主，④是它在約翰福音裡的回聲：他是受了洗的那一位，也是真實流了血、死了的那一位。本章議題見〈5:6「藉著水和血而來」——是洗禮與十架、出生與受死，還是聖禮？〉。</blockquote></p>","exp":"<p>「這藉著水和血而來的，就是耶穌基督；不是單用水，乃是用水又用血，」（5:6）這一節是全卷最難懂的句子之一，但約翰要說的事其實很簡單：耶穌基督是真的來了，也真的死了。</p><p>照教會的傳統，當時有人願意接受一位受洗的基督：天開了，聖靈降下，有聲音從天上來，這一切都很屬靈、很美；他們卻不能接受神的兒子會流血、會死。於是他們說，基督在受洗時降在耶穌身上，到十字架以前就離開了，死的只是一個人。約翰用一句話把門關上：不是單用水，乃是用水又用血。</p><p>為甚麼要這樣堅持？因為能洗淨我們的，不是一個榜樣，是一場犧牲。「他兒子耶穌的血也洗淨我們一切的罪。」（1:7）如果十字架上死的只是一個普通人，那血就洗不淨任何人的罪；如果神的兒子沒有真的死，挽回祭就沒有獻上（4:10）。</p><p>今天這種想法換了衣服回來。很多人喜歡一個有智慧的耶穌：好老師、好榜樣、說過許多美好的話。可是一提到血、罪、十字架，就覺得太重、太不現代。約翰會溫柔而堅定地說：只有水的耶穌，救不了你。</p><p>所以下一次你領受聖餐，手上拿著那一小杯，不妨想起這一節：他不是只來看看我們，他是用血來的。他的愛不是停在河邊的愛，是走到十字架上的愛。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.</p><p lang=\"grc\">ὅτι τρεῖς εἰσιν οἱ μαρτυροῦντες, τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.</p>","lit":"<p>而那作見證的是聖靈，因為聖靈就是真理。</p><p>因為作見證的有三：聖靈、水和血，而這三者歸於一。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν</td><td>to pneuma estin to martyroun</td><td>聖靈是那作見證的</td><td>現在式：至今仍在作見證</td></tr><tr><td>ἡ ἀλήθεια</td><td>hē alētheia</td><td>真理</td><td>約 14:17「真理的聖靈」</td></tr><tr><td>τρεῖς εἰσιν οἱ μαρτυροῦντες</td><td>treis eisin hoi martyrountes</td><td>作見證的有三</td><td>陽性分詞配中性名詞：當作證人看</td></tr><tr><td>τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα</td><td>to pneuma kai to hydōr kai to haima</td><td>聖靈、水與血</td><td>聖靈排在最前</td></tr><tr><td>εἰς τὸ ἕν εἰσιν</td><td>eis to hen eisin</td><td>歸於那一</td><td>指向同一個結論，不是說三者同質</td></tr><tr><td>μαρτυρέω / μαρτυρία</td><td>martyreō / martyria</td><td>作見證／見證</td><td>和合本 5:7--11 共出現十次</td></tr></table>","gram":"<p><strong>節界。</strong>和合本 5:7「並且有聖靈作見證，因為聖靈就是真理」，在 SBLGNT 是 5:6b；和合本 5:8 在 SBLGNT 是 5:7--8。本講義的原文欄已照和合本分節對齊，所以這一段的兩節原文，正是 SBLGNT 的 5:6b--8。</p><p><strong>約翰短句。</strong>有些較晚的譯本在這裡多出一段，說在天上作見證的是父、道與聖靈，這三樣為一，在地上作見證的是聖靈、水與血。這一段稱為「約翰短句」。它不見於早期的希臘文抄本，第四世紀的希臘教父在激烈的三一論爭辯中也從未引用；它先出現在拉丁文的著作與後期的拉丁譯本抄本中，希臘文只見於少數很晚的抄本，有的還寫在旁註。十六世紀伊拉斯謨編印希臘文新約，在第三版收入，由此進入公認經文，也進入英王欽定本。和合本沒有收，現代的經文鑑別也一致不收。</p><p><blockquote>三一論不需要倚靠這一句。父、子、聖靈的名並列在「奉父、子、聖靈的名給他們施洗」（太 28:19），也在林後 13:14 的祝福裡；整本新約都在講父差子、子顯明父、聖靈為子作見證。用欽定本傳統讀經的弟兄姊妹，愛主、敬重聖經的心是真的，我們不嘲笑，只是誠實說明抄本的事實。本章議題見〈5:7--8「約翰短句」——三一論靠這一節嗎？〉。</blockquote></p><p>οἱ τρεῖς（hoi treis） 用陽性，把聖靈、水、血看作出庭的證人；這使我們想起律法要求「總要憑兩三個人的口作見證才可定案」（申 19:15）。</p>","exp":"<p>「作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一。」（5:8）從這一節開始，約翰把讀者帶進一個法庭。被審的問題是：耶穌是不是神的兒子？出庭的證人有三位。</p><p>第一位是水。耶穌受洗的時候，施洗約翰說：「我曾看見聖靈，彷彿鴿子從天降下，住在他的身上。」（約 1:32）那一天，天上的聲音宣告他是神的愛子。第二位是血。十字架上，他真實地死了，為我們的罪作了挽回祭。第三位是聖靈，祂不是只在過去作證，今天仍在作見證，在每一個信的人心裡說：這一位是真的。</p><p>三位證人「歸於一」，意思是三個口供指向同一個結論。法庭上最可信的，不是一個證人說得很響，是幾個彼此獨立的證人說出同一件事。</p><p>這一段也牽涉一個抄本的問題。你若讀過某些舊譯本，會在這裡看到「在天上作見證的有父、道、聖靈」的字句。和合本沒有收，原因在原文欄的說明裡。有人聽到會不安：那三位一體是不是少了一節證據？不會。三一真理不是靠一節經文撐起來的柱子，是整座房子的結構；從馬太福音的大使命到保羅的祝福，到約翰福音主講保惠師的那幾章，處處都是。</p><p>對今天的我們，這一段最寶貴的是那句「聖靈就是真理」。當你心裡懷疑、軟弱、夜裡睡不著的時候，不必自己製造確信；有一位證人住在你裡面，祂作見證從來不說謊。</p>"},{"a":9,"z":10,"star":1,"grk":"<p lang=\"grc\">εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.</p><p lang=\"grc\">ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.</p>","lit":"<p>我們若接受人的見證，神的見證是更大的；因為這就是神的見證：他已經為他的兒子作了見證。</p><p>那信入神兒子的，在自己裡面有這見證；那不信神的，已經把他當作說謊的，因為他沒有信入神為他兒子所作的見證。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν</td><td>tēn martyrian tōn anthrōpōn lambanomen</td><td>我們接受人的見證</td><td>日常生活：靠別人的話過日子</td></tr><tr><td>ἡ μαρτυρία τοῦ θεοῦ μείζων</td><td>hē martyria tou theou meizōn</td><td>神的見證更大</td><td>和合本「更該領受」，註明原文是大</td></tr><tr><td>μεμαρτύρηκεν</td><td>memartyrēken</td><td>他已經作了見證</td><td>完成式：見證已經立定，至今有效</td></tr><tr><td>ὁ πιστεύων εἰς τὸν υἱόν</td><td>ho pisteuōn eis ton huion</td><td>那信入兒子的</td><td>εἰς：把自己交進一個人裡面</td></tr><tr><td>ἔχει τὴν μαρτυρίαν ἐν αὑτῷ</td><td>echei tēn martyrian en hautō</td><td>在自己裡面有這見證</td><td>外面的見證成了裡面的確信</td></tr><tr><td>ὁ μὴ πιστεύων τῷ θεῷ</td><td>ho mē pisteuōn tō theō</td><td>那不信神的</td><td>間接受格：不信神所說的話</td></tr><tr><td>ψεύστην πεποίηκεν αὐτόν</td><td>pseustēn pepoiēken auton</td><td>已經把他當作說謊的</td><td>1:10 同一說法</td></tr><tr><td>οὐ πεπίστευκεν</td><td>ou pepisteuken</td><td>沒有信</td><td>完成式：一種已經定下的拒絕</td></tr></table>","gram":"<p><strong>「信入」與「信」。</strong>5:10 前半用 πιστεύων εἰς（pisteuōn eis），是約翰最愛的說法，信「進入」一個人裡面，把自己交託給他；後半 πιστεύων τῷ θεῷ（pisteuōn tō theō） 用間接受格，指相信神所說的話。兩樣分不開：信他的話，就會把自己交給他。</p><p><strong>異文。</strong>5:9 的第二個 ὅτι（hoti），RP 作 ἥν（hēn）「他所作的見證」，意思相近。5:10 的 ἐν αὑτῷ（en hautō），WH 加送氣號讀作「在自己裡面」；NA28、RP 作 αὐτῷ（autō），可讀作「在他裡面」。多數譯本與和合本都理解為信徒心裡有這見證。</p><p><strong>懷疑就是不信嗎？</strong>「將神當作說謊的」是重話。從上下文看，約翰指的是聽過神的見證、卻刻意拒絕的人，特別是否認耶穌是基督的那些教師（2:22）；完成式 οὐ πεπίστευκεν（ou pepisteuken） 描寫一種已經定下來的立場，不是一時的疑問。正在掙扎的人，聖經的態度是另一種：「有些人存疑心，你們要憐憫他們」（猶 22）。本章議題見〈5:10「不信神的，就是將神當作說謊的」——懷疑就是不信嗎？〉。</p>","exp":"<p>「我們既領受人的見證，神的見證更該領受了，因神的見證是為他兒子作的。」（5:9）我們每天都靠別人的見證過日子。醫生說檢查沒事，我們就放心回家；地圖說前面左轉，我們就左轉；我們沒有親眼看過自己出生，卻相信父母告訴我們的生日。人的見證，我們天天領受。</p><p>約翰說，神的見證更大。不是因為神說得比較大聲，是因為他從不說錯，也從不說謊。他為他的兒子作了見證：在約旦河邊，在十字架上，在空的墳墓裡，也在聖靈不斷的工作裡。這見證是完成式，已經立定了，不會因為時代改變而作廢。</p><p>接著約翰寫：信的人，「就有這見證在他心裡」（5:10）。外面的見證，變成裡面的確信。就像一封寄出的信終於到了收信人手上，打開讀了，信裡的話就住在他心裡。</p><p>後半節很重：不信的，「就是將神當作說謊的」（5:10）。這話是對著那些聽過、看過、卻刻意轉身拒絕的人說的，不是對著一位夜裡流淚說「主啊，我信，但我信不足」的弟兄姊妹說的。主從來沒有拒絕那位喊著「我信！但我信不足，求主幫助。」（可 9:24）的父親。</p><p>所以，如果你今天心裡有疑問，不要躲起來，也不要假裝。把疑問帶到神面前，帶到可信的弟兄姊妹面前。懷疑可以是信心的走廊，只要你繼續往那位作見證的神走去。</p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ὁ θεὸς ἡμῖν, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.</p><p lang=\"grc\">ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.</p>","lit":"<p>而這就是那見證：神已經把永遠的生命賜給我們，而這生命是在他的兒子裡面。</p><p>那有兒子的，就有這生命；那沒有神兒子的，就沒有這生命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αὕτη ἐστὶν ἡ μαρτυρία</td><td>hautē estin hē martyria</td><td>這就是那見證</td><td>見證的內容在這裡說出來</td></tr><tr><td>ζωὴν αἰώνιον ἔδωκεν</td><td>zōēn aiōnion edōken</td><td>已經賜了永生</td><td>不定過去式：已經給了，不是待審</td></tr><tr><td>ἐν τῷ υἱῷ αὐτοῦ</td><td>en tō huiō autou</td><td>在他兒子裡面</td><td>生命的所在：在一位裡面</td></tr><tr><td>ὁ ἔχων τὸν υἱόν</td><td>ho echōn ton huion</td><td>那有兒子的</td><td>有的是一個人，不是一樣東西</td></tr><tr><td>ἔχει τὴν ζωήν</td><td>echei tēn zōēn</td><td>就有那生命</td><td>冠詞：指前面說的永生</td></tr><tr><td>ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ</td><td>ho mē echōn ton huion tou theou</td><td>那沒有神兒子的</td><td>反面加上「神的」：沒有的是誰</td></tr><tr><td>τὴν ζωὴν οὐκ ἔχει</td><td>tēn zōēn ouk echei</td><td>那生命他沒有</td><td>「沒有」放在句尾，語氣加重</td></tr></table>","gram":"<p><strong>「有」兒子。</strong>ὁ ἔχων τὸν υἱόν（ho echōn ton huion） 很特別：約翰不說「有永生的觀念」，也不說「有屬靈的經歷」，說「有兒子」。2:23 已經用過同一個動詞：「認子的，連父也有了」（2:23）。永生不是一件從神手裡領走、離開神也能保存的禮物，是在他兒子裡面的生命；有了他，就有了生命。這使我們想起主的禱告：「認識你─獨一的真神，並且認識你所差來的耶穌基督，這就是永生。」（約 17:3）</p><p>5:12 兩句對稱，正反兩面；反面多了 τοῦ θεοῦ（tou theou）「神的」，把焦點放在那位被拒絕的是誰。5:11 的語序，WH 作 ὁ θεὸς ἡμῖν，NA28、RP 作 ἡμῖν ὁ θεός，意思不變。</p><p><strong>那沒有聽過福音的人呢？</strong>這一句常被拿來問這個問題。約翰在這裡是對已經信的人講確據（下一節就說明），不是在替沒有聽過福音的人宣判；神如何審判他們，聖經另有論述（這使我們想起羅 2:14--16），也交在公義又憐憫的神手裡。本章議題見〈5:12「沒有神的兒子就沒有生命」——那沒有聽過福音的人呢？〉。</p>","exp":"<p>「人有了神的兒子就有生命，沒有神的兒子就沒有生命。」（5:12）這一節短得像一句格言，卻是全章的心臟。第五章的三個字「勝、證、知」，在這裡交會：神作的見證，內容就是這一句。</p><p>先看 5:11：「這見證就是神賜給我們永生；這永生也是在他兒子裡面。」（5:11）永生不是一包放在倉庫裡的貨物，可以領走、帶回家、自己保管。它有一個地址：在他兒子裡面。你要有那生命，就要有那一位。</p><p>這像一場婚禮。新娘並不是先拿到房子、姓氏、存款，然後才去認識新郎；她是得著了這個人，他的一切就成了她的。約翰說得很直接：有了兒子，就有生命。不是有了兒子再加上甚麼，也不是有了很多屬靈經歷就等於有了兒子。</p><p>這句話對兩種人都是好消息。對驕傲的人，它拆掉了一切自己加上去的條件：不是靠你多會讀經、多會服事。對自卑的人，它給了一個不會搖動的根基：你不必證明自己夠格，你只要有他。</p><p>有人問：那我怎麼知道自己「有」他？約翰在下一節就要回答。現在先停在這裡，讓這句話落進心裡：焦點不在我抓得多緊，在他是誰。321 說「焦點在耶穌」，5:12 是最短的說明。</p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">Ταῦτα ἔγραψα ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ἔχετε αἰώνιον, τοῖς πιστεύουσιν εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.</p>","lit":"<p>這些事我寫給你們，要叫你們知道你們有永遠的生命，就是給你們這些信入神兒子之名的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταῦτα ἔγραψα ὑμῖν</td><td>Tauta egrapsa hymin</td><td>這些事我寫給你們</td><td>書信式不定過去式：回看全卷</td></tr><tr><td>ἵνα εἰδῆτε</td><td>hina eidēte</td><td>好叫你們知道</td><td>οἶδα：確知，不是猜想</td></tr><tr><td>ὅτι ζωὴν ἔχετε αἰώνιον</td><td>hoti zōēn echete aiōnion</td><td>你們有永生</td><td>現在式：現在就有</td></tr><tr><td>τοῖς πιστεύουσιν</td><td>tois pisteuousin</td><td>給那些信的人</td><td>收信人已經信了</td></tr><tr><td>εἰς τὸ ὄνομα</td><td>eis to onoma</td><td>信入那名</td><td>3:23「信他兒子耶穌基督的名」</td></tr><tr><td>τοῦ υἱοῦ τοῦ θεοῦ</td><td>tou huiou tou theou</td><td>神的兒子</td><td>接回 5:12：有了兒子</td></tr></table>","gram":"<p><strong>「這些話」指甚麼？</strong>有人認為只指 5:1--12；多數解經家認為指全卷。ἔγραψα（egrapsa） 是書信式不定過去式，作者站在讀者讀信的時間回看全信。全卷說過「我們將這些話寫給你們」（1:4）、「是要叫你們不犯罪」（2:1）、「是指著那引誘你們的人說的」（2:26），到這裡才把最後的目的說出來。</p><p><strong>與約翰福音的對照。</strong>約翰福音結尾說：「記這些事要叫你們信耶穌是基督」（約 20:31）；約翰一書結尾說：要叫你們知道。福音書叫人「信」，書信叫信的人「知道」。εἰδῆτε（eidēte） 出自 οἶδα（oida），是確實的知道。RP 把句子改寫成「……要叫你們知道有永生，並且叫你們信入神兒子的名」，WH、NA28 的較短讀法較可靠。</p><p><blockquote>確據的根據不在我的表現，在神的見證（5:9--11）。所以「知道」不是驕傲；「自己以為站得穩的」（林前 10:12）人倚靠自己，知道有永生的人倚靠他。本章議題見〈5:13 可以「知道」自己得救嗎？確據與驕傲的界線在哪裡？〉；全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。</blockquote></p>","exp":"<p>〔約〕約 20:31（約翰福音講義第 20 章）</p><p>「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。」（5:13）這是全卷的終點，也是全卷的鑰匙。約翰寫了五章，到這裡才告訴我們，他為甚麼寫。</p><p>他不是寫給還沒有信的人，是寫給「信奉神兒子之名的人」。他的讀者剛經歷教會分裂，有些很會說話的人出去了，說他們才有真知識。留下的人心裡不安：我們是不是錯了？我們真的有永生嗎？約翰寫這封信，不是要叫他們更懷疑，是要叫他們知道。</p><p>這改變了我們讀整卷書的方式。那些「人若說」「我們知道」「從此就知道」，不是一道一道審查的關卡，是一盞一盞路燈：認罪、遵守主道、彼此相愛、信耶穌是神的兒子，這些記號是給你看見神已經在你裡面工作，不是給你拿去量別人的。</p><p>有許多弟兄姊妹信主多年，仍然不敢說自己有永生，好像說了就是驕傲。約翰卻說，知道是神要你有的。確據的根據不是你今天表現多好，是神為他兒子作的見證；你倚靠的若是他，知道就不是驕傲，是安息。</p><p>321 說「聖經是我的準則」，在這一節可以看得很清楚：約翰沒有叫讀者去找一種感覺來證明自己得救，他說「我將這些話寫給你們」。神把確據寫成文字，交在你手上。今晚你可以打開它，再讀一次，然後安心睡覺。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.</p><p lang=\"grc\">καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ἀπ’ αὐτοῦ.</p>","lit":"<p>而這就是我們向著他所有的坦然：我們若照著他的旨意求甚麼，他就聽我們。</p><p>而我們若知道他聽我們——無論我們求甚麼——我們就知道，我們已經有了我們向他所求的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ παρρησία</td><td>hē parrēsia</td><td>坦然、放膽直言</td><td>本卷第四次：2:28；3:21；4:17</td></tr><tr><td>πρὸς αὐτόν</td><td>pros auton</td><td>向著他</td><td>面對面</td></tr><tr><td>ἐάν τι αἰτώμεθα</td><td>ean ti aitōmetha</td><td>我們若求甚麼</td><td>關身語態：為自己的需要求</td></tr><tr><td>κατὰ τὸ θέλημα αὐτοῦ</td><td>kata to thelēma autou</td><td>照著他的旨意</td><td>條件，不是附註</td></tr><tr><td>ἀκούει ἡμῶν</td><td>akouei hēmōn</td><td>他聽我們</td><td>屬格：垂聽、接納，不只是聽到</td></tr><tr><td>ἐὰν οἴδαμεν</td><td>ean oidamen</td><td>我們若知道</td><td>ἐάν 配直說語氣：近乎「既然」</td></tr><tr><td>ἔχομεν τὰ αἰτήματα</td><td>echomen ta aitēmata</td><td>我們有了所求的</td><td>現在式：已經在他手中</td></tr><tr><td>ἃ ᾐτήκαμεν ἀπ᾽ αὐτοῦ</td><td>ha ētēkamen ap' autou</td><td>我們向他所求的</td><td>完成式；RP 作 παρ᾽ αὐτοῦ</td></tr></table>","gram":"<p><strong>παρρησία（parrēsia） 的四站。</strong>這個字原指公民在議會裡放膽直言的權利。本卷用了四次：2:28 主來時坦然無懼，3:21 心不責備就坦然，4:17 審判的日子坦然，這裡是禱告時的坦然。從末日到今天，孩子在父親面前都可以開口。</p><p><strong>「照他的旨意」怎樣理解？</strong>①<strong>成功神學</strong>：有人說只要有信心地宣告，就一定照所求的得著，沒有得著是信心不夠。難處：把「照他的旨意」這個條件拿掉了，也與主和保羅的禱告不合。本講義不採。②<strong>限制條件</strong>：神只成全合他旨意的求。難處：容易變成冷冷的免責條款。③<strong>塑造禱告的人</strong>：禱告是把我們的意願對準他的旨意；3:22 說遵守命令的人一切所求的就得著，因為他所求的已經被神的心塑造。</p><p><blockquote>本講義取②③合讀。這使我們想起客西馬尼園的禱告：「然而，不要照我的意思，只要照你的意思。」（太 26:39）保羅三次求去掉那根刺，得著的回答是「我的恩典夠你用的」（林後 12:9）。禱告沒有照我們所想的成就，不等於信心不夠。本章議題見〈5:14--15「照他的旨意求，他就聽我們」——禱告沒有應允是信心不夠嗎？〉。</blockquote></p><p>5:15 的 ἔχομεν（echomen） 是現在式：所求的已經在他手中，何時、用甚麼方式給，由他決定。</p>","exp":"<p>「我們若照他的旨意求甚麼，他就聽我們，這是我們向他所存坦然無懼的心。」（5:14）講完了確據，約翰立刻講禱告。知道自己有永生的人，最自然的事就是開口。</p><p>「坦然無懼」是孩子對父親說話的樣子。孩子不必先排練好措辭，也不必擔心開口就被趕出門。全卷講過，主來的時候我們可以坦然，審判的日子我們可以坦然；這裡說，今天晚上，你就可以坦然。</p><p>但這一節有一個不能省略的條件：照他的旨意。這不是一把鎖，是一條路。它不是說神很吝嗇，要你猜中密碼才肯給；是說禱告最深的目的，是讓我們的心跟上他的心。</p><p>這使我們想起客西馬尼園。神的兒子跪在地上，汗珠如大血點，他求：「我父啊，倘若可行，求你叫這杯離開我。」接著他說：「然而，不要照我的意思，只要照你的意思。」（太 26:39）那杯沒有離開他。這不是因為他信心不夠，而是因為父有更大的旨意：藉著那杯，救了全世界。</p><p>所以，如果你曾經為一位病重的家人迫切禱告，結果卻不是你所求的，請不要聽信任何人說「你信心不夠」。你的禱告神聽見了；他沒有照你的意思成就，不表示他沒有聽，也不表示你不夠好。5:15 說，所求的「無不得著」：有時是你求的那樣東西，有時是比它更深的恩典，例如在最痛的時候，他沒有離開你。</p><p>禱告不是叫神照我的意思做事，是讓我回到被愛的孩子的位置上，把我的意思交在他手裡。</p>"},{"a":16,"z":17,"star":2,"grk":"<p lang=\"grc\">ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.</p><p lang=\"grc\">πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.</p>","lit":"<p>若有人看見他的弟兄犯了不至於死的罪，他要祈求，神就要將生命賜給他——就是給那些犯了不至於死之罪的人。有至於死的罪；我不是說要為那罪去求問。</p><p>一切不義都是罪，也有不至於死的罪。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ</td><td>ean tis idē ton adelphon autou</td><td>若有人看見他的弟兄</td><td>看見了，就有了代求的責任</td></tr><tr><td>ἁμαρτίαν μὴ πρὸς θάνατον</td><td>hamartian mē pros thanaton</td><td>不至於死的罪</td><td>πρός：朝著、通向</td></tr><tr><td>αἰτήσει</td><td>aitēsei</td><td>他要祈求</td><td>未來式當命令用：就當為他祈求</td></tr><tr><td>δώσει αὐτῷ ζωήν</td><td>dōsei autō zōēn</td><td>將生命賜給他</td><td>主詞可能是神，也可能是禱告的人</td></tr><tr><td>ἔστιν ἁμαρτία πρὸς θάνατον</td><td>estin hamartia pros thanaton</td><td>有至於死的罪</td><td>約翰沒有說是哪一種</td></tr><tr><td>οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ</td><td>ou peri ekeinēs legō hina erōtēsē</td><td>我不是說要為那罪求問</td><td>沒有吩咐，也沒有禁止</td></tr><tr><td>αἰτέω / ἐρωτάω</td><td>aiteō / erōtaō</td><td>祈求／求問</td><td>後半換了動詞</td></tr><tr><td>πᾶσα ἀδικία ἁμαρτία ἐστίν</td><td>pasa adikia hamartia estin</td><td>一切不義都是罪</td><td>不讓人輕看任何罪</td></tr></table>","gram":"<p><strong>「至於死的罪」是甚麼？</strong>四種主要的說法：①<strong>褻瀆聖靈</strong>：「凡褻瀆聖靈的，卻永不得赦免」（可 3:29）。難處：約翰沒有用這個詞，福音書的背景是把聖靈的工作說成鬼的工作。②<strong>背道</strong>：蒙了光照以後「若是離棄道理，就不能叫他們重新懊悔了」（來 6:6）。難處：希伯來書講的是整體的離棄，約翰這裡說的是「看見」某一種罪。③<strong>導致肉身死亡的罪</strong>：如亞拿尼亞和撒非喇（徒 5:1--11），或林前 11:30 不按理吃喝主餐而死的人。難處：「生命」在本章一直指永生（5:11--13），「死」恐怕也不只是肉身。④<strong>公開離棄真道</strong>：在約翰的處境裡，指否認耶穌是基督、拒絕神為子作的見證（5:10）。難處：這是從上下文推論，約翰自己沒有點明。</p><p><blockquote>本講義的立場：約翰沒有說是哪一種，講台也不說。這一段的重心是「就當為他祈求」；約翰對至於死的罪只說「我不說當為這罪祈求」，沒有禁止。任何人都不可宣判另一個人，包括已經過世的人，犯了這罪。本章議題見〈5:16--17「至於死的罪」是甚麼罪？可以不為某人禱告嗎？〉。</blockquote></p><p>5:16 的 δώσει（dōsei） 文法上可以指禱告的人「把生命給他」（神藉著代禱賜下），多數譯本照和合本理解為神賜生命，兩者意思相合。</p>","exp":"<p>「人若看見弟兄犯了不至於死的罪，就當為他祈求，神必將生命賜給他」（5:16）上一段講照他的旨意求，這一段立刻給了一個例子：為跌倒的弟兄禱告。這幾乎可以肯定是合神旨意的禱告。</p><p>留意約翰的用字：「看見」。不是聽說，不是轉傳，是看見。你看見了一位弟兄跌倒，第一個反應應該是甚麼？約翰沒有說去議論，沒有說去分析他屬靈不屬靈，他說：就當為他祈求。看見，就是一個代禱的呼召。</p><p>然後約翰提到「至於死的罪」，只用了一句話帶過，而且他沒有說那是甚麼。兩千年來的解經家提出好幾種看法，原文欄已經並陳。我們要學約翰的節制：他沒有說，講台也不說。我們不知道誰的心在神面前到底怎樣，所以任何人都沒有權柄指著另一個人說，他的罪是至於死的，更不可對一位已經過世的親人這樣說。</p><p>也許有人讀到這裡，心裡一緊：我會不會就是犯了這種罪？如果你會這樣擔心，你的擔心本身就說明了一件事：你的心仍然向著神。真正離棄神的人，不會為這個失眠。請把這份懼怕帶到十字架前，主說：「到我這裡來的，我總不丟棄他。」（約 6:37）</p><p>5:17 補上一句平衡：「凡不義的事都是罪」（5:17）。約翰不叫人輕看罪，也不叫人被罪的分類嚇壞。他要我們做的事很清楚：看見弟兄跌倒，就為他祈求。今天你心裡想到哪一位？把他的名字帶到神面前。</p>"},{"a":18,"z":19,"star":1,"grk":"<p lang=\"grc\">Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.</p><p lang=\"grc\">οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.</p>","lit":"<p>我們知道，凡從神所生的都不犯罪；那從神而生的保守他，那惡者也不能碰他。</p><p>我們知道我們是出於神的，而全世界都躺臥在那惡者裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἴδαμεν</td><td>Oidamen</td><td>我們知道</td><td>5:18--20 連續三次</td></tr><tr><td>οὐχ ἁμαρτάνει</td><td>ouch hamartanei</td><td>不犯罪</td><td>現在式：不活在罪中（3:9）</td></tr><tr><td>ὁ γεννηθεὶς ἐκ τοῦ θεοῦ</td><td>ho gennētheis ek tou theou</td><td>那從神而生的</td><td>不定過去式，與前半的完成式不同</td></tr><tr><td>τηρεῖ αὐτόν</td><td>tērei auton</td><td>保守他</td><td>異文 ἑαυτόν：保守自己</td></tr><tr><td>οὐχ ἅπτεται αὐτοῦ</td><td>ouch haptetai autou</td><td>不能碰他</td><td>抓不住、據不了</td></tr><tr><td>ἐκ τοῦ θεοῦ ἐσμεν</td><td>ek tou theou esmen</td><td>我們是出於神的</td><td>身分的來源</td></tr><tr><td>ὁ κόσμος ὅλος</td><td>ho kosmos holos</td><td>全世界</td><td>2:16 的那個世界體系</td></tr><tr><td>κεῖται ἐν τῷ πονηρῷ</td><td>keitai en tō ponērō</td><td>躺臥在那惡者裡面</td><td>躺著：無力，像睡在他懷裡</td></tr></table>","gram":"<p><strong>5:18 的異文。</strong>WH、Treg、NA27 作 αὐτόν（auton）「保守他」；NA28、RP 作 ἑαυτόν（heauton）「保守自己」。和合本正文取「必保守自己」，旁註「有古卷：那從神生的必保護他」。①讀「自己」：信徒保守自己，與 5:21「你們要自守」呼應。②讀「他」：前半 ὁ γεγεννημένος（ho gegennēmenos） 是完成式，指信徒；後半 ὁ γεννηθείς（ho gennētheis） 改用不定過去式，多數解經家認為指神的獨生子，他保守信徒，正如主說「因你所賜給我的名保守了他們」（約 17:12）。</p><p><blockquote>兩種讀法都合乎整本聖經；本講義傾向②：那惡者無法害他，因為有一位比他更大的在保守。5:21 仍然呼召我們自守，兩者並不衝突。</blockquote></p><p>「必不犯罪」用現在式，與 3:9 相同，指不活在罪中、不以罪為生活方向，不是說信徒永遠不會跌倒；約翰早就說過「若有人犯罪，在父那裡我們有一位中保」（2:1）。全卷立場見〈罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？〉。κεῖται（keitai） 是「躺臥」，像一個人睡在另一個人懷裡，被動而不自知。</p>","exp":"<p>「我們知道凡從神生的，必不犯罪，從神生的，必保守自己（有古卷：那從神生的必保護他），那惡者也就無法害他。」（5:18）全卷最後一段，約翰連說三次「我們知道」。這是整封信的收音：講了那麼多，他要讀者帶走的是幾件確實知道的事。</p><p>第一件：從神生的，必不犯罪。這不是說基督徒不會跌倒。約翰在一開頭就說，「我們若說自己無罪，便是自欺」（1:8），又說「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。這裡說的是方向：從神生的人不再以罪為家。跌倒的時候，他知道往哪裡回。</p><p>為甚麼回得去？因為有一位保守他。不論你讀成「保守自己」或「保護他」，最終的保守者都是神。那惡者「無法害他」，原文是碰不著、抓不住。基督徒仍會受苦、受試探，但那惡者不能把他從父手裡奪走；主說過「誰也不能從我手裡把他們奪去」（約 10:28）。</p><p>第二件：「我們是屬神的，全世界都臥在那惡者手下」（5:19）。這不是叫我們害怕世界、遠離人群；「父差子作世人的救主」（4:14），神仍然愛這個世界。約翰描寫的是一種屬靈的光景：世界的價值體系像一個人睡在惡者懷裡，自己不知道。</p><p>所以，我們不是比世人高一等的人，是被叫醒的人。被叫醒的人，不是去嘲笑還在睡的人，是輕輕地叫醒他們。</p>"},{"a":20,"z":20,"star":2,"grk":"<p lang=\"grc\">οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.</p>","lit":"<p>而我們知道，神的兒子已經來了，並且已經賜給我們悟性，好叫我們認識那位真實的；而我們在那位真實的裡面，就是在他的兒子耶穌基督裡面。這一位是真實的神，也是永遠的生命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ υἱὸς τοῦ θεοῦ ἥκει</td><td>ho huios tou theou hēkei</td><td>神的兒子已經來到</td><td>ἥκω：來了，而且在這裡</td></tr><tr><td>δέδωκεν ἡμῖν διάνοιαν</td><td>dedōken hēmin dianoian</td><td>已經賜給我們悟性</td><td>διάνοια 約翰著作只此一次</td></tr><tr><td>ἵνα γινώσκωμεν</td><td>hina ginōskōmen</td><td>好叫我們認識</td><td>WH、Treg 作 γινώσκομεν</td></tr><tr><td>τὸν ἀληθινόν</td><td>ton alēthinon</td><td>那位真實的</td><td>真的，對照假的（5:21 偶像）</td></tr><tr><td>ἐσμὲν ἐν τῷ ἀληθινῷ</td><td>esmen en tō alēthinō</td><td>我們在那真實的裡面</td><td>「住」的終點</td></tr><tr><td>ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ</td><td>en tō huiō autou Iēsou Christō</td><td>在他兒子耶穌基督裡面</td><td>在父裡面，就是在子裡面</td></tr><tr><td>οὗτός ἐστιν ὁ ἀληθινὸς θεός</td><td>houtos estin ho alēthinos theos</td><td>這是真神</td><td>οὗτος 指父還是子</td></tr><tr><td>ζωὴ αἰώνιος</td><td>zōē aiōnios</td><td>永生</td><td>接回 1:2 那永遠的生命</td></tr></table>","gram":"<p><strong>「這是真神」的「這」指誰？</strong>①<strong>指父</strong>：同一節兩次說「那位真實的」都指父，主也稱父為「獨一的真神」（約 17:3）。難處：句子剛剛提到的是耶穌基督。②<strong>指子</strong>：οὗτος（houtos） 最自然是指最近的名字耶穌基督；「永生」在本卷是子的稱號，「將原與父同在、且顯現與我們那永遠的生命傳給你們」（1:2）；約翰福音也以多馬「我的主！我的神！」（約 20:28）作結。難處：文法上也能指較遠的主詞。</p><p><blockquote>本講義傾向②，全卷首尾相扣：一開頭是「生命之道」顯現，結尾是「這是真神，也是永生」。即使取①，約翰的意思仍然是：在子裡面，就是在真神裡面。三一真理不靠這一句的文法決定。</blockquote></p><p>ἥκει（hēkei） 是現在式，帶著完成的意思：他來了，而且還在這裡。διάνοια（dianoia） 是悟性、理解的能力，這個字在約翰著作只出現這一次；和合本譯作「智慧」。</p>","exp":"<p>「我們也知道，神的兒子已經來到，且將智慧賜給我們，使我們認識那位真實的」（5:20）這是第三個「我們知道」，也是整封信的頂點。全卷從「論到從起初原有的生命之道」（1:1）開始，在這裡收回到同一個人身上。</p><p>神的兒子「已經來到」。原文的意思是：他來了，而且還在。不是一位來過又走了的訪客，是住下來的那一位。約翰福音說「道成了肉身，住在我們中間」（約 1:14），約翰一書在最後再說一次：他已經來到。</p><p>他來，還帶了一份禮物：悟性。人靠自己認不出真神，就像瞎眼的人靠自己看不見光。他打開我們的心，使我們認識那位真實的。這「認識」不是多讀幾本神學書，是全卷一開頭說的相交：與父並與他兒子耶穌基督相交。</p><p>最美的一句是：「我們也在那位真實的裡面」（5:20）。全卷一直說要住在主裡面（2:28），到這裡，約翰說，我們已經在他裡面了。不是在門外排隊，是已經在家裡。</p><p>然後他說：「這是真神，也是永生。」（5:20）在一個滿城都是神像的地方，這一句話把所有假的都比下去了。你今天心裡最依靠的是甚麼？如果它不是那位真實的，它終究會讓你失望。只有在他兒子裡面，才有不會褪色的生命。</p>"},{"a":21,"z":21,"star":2,"grk":"<p lang=\"grc\">Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν εἰδώλων.</p>","lit":"<p>小孩子們，你們要看守自己，遠離偶像。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τεκνία</td><td>Teknia</td><td>小孩子們</td><td>全卷最後一次稱呼：父親的口吻</td></tr><tr><td>φυλάξατε</td><td>phylaxate</td><td>你們要看守</td><td>不定過去式命令：果斷地守住</td></tr><tr><td>ἑαυτά</td><td>heauta</td><td>你們自己</td><td>中性複數，配 τεκνία</td></tr><tr><td>ἀπὸ τῶν εἰδώλων</td><td>apo tōn eidōlōn</td><td>遠離偶像</td><td>εἴδωλον 本卷只此一次</td></tr><tr><td>τὸν ἀληθινόν ↔ εἴδωλα</td><td>ton alēthinon ↔ eidōla</td><td>真實的↔偶像</td><td>5:20 與 5:21 的對照</td></tr><tr><td>Ἀμήν</td><td>Amēn</td><td>阿們</td><td>RP 在句末加上，早期抄本沒有</td></tr></table>","gram":"<p><strong>「偶像」指甚麼？</strong>①<strong>字面的神像</strong>：以弗所是亞底米女神的城，祭偶像之物、行會的拜神宴席，都是信徒每天要面對的事。難處：本卷其他地方沒有提到拜偶像的問題。②<strong>假教師所傳的假基督</strong>：緊接 5:20「那位真實的」，偶像就是一切不是真神的「神」，包括否認耶穌是基督的教訓。難處：「偶像」一詞在新約通常指實際的神像。③<strong>一切取代神的東西</strong>：保羅說「貪婪就與拜偶像一樣」（西 3:5）。難處：這是延伸應用，不是約翰的第一層意思。</p><p><blockquote>本講義讀成由近而遠的三層：經文直接對照的是 5:20 的真神；在以弗所，它包括亞底米廟；在今天，它包括一切坐上神位子的東西。本章議題見〈5:21「遠避偶像」——今日的偶像是甚麼？〉。</blockquote></p><p>φυλάξατε（phylaxate） 是不定過去式命令，帶著果斷的意味。全信沒有問安、沒有祝福，在這一句戛然而止；RP 在句末加了 Ἀμήν（Amēn），早期抄本沒有。關於本卷為甚麼沒有書信的問安，見 〈約翰一書是書信還是講章？為甚麼沒有問安？〉。</p>","exp":"<p>〔背景〕徒 19:23--41（使徒行傳講義第 19 章）</p><p>「小子們哪，你們要自守，遠避偶像！」（5:21）這是全信的最後一句。沒有問安，沒有祝福，沒有阿們，像一位老父親送孩子出門時，站在門口說的最後一句話。</p><p>照教會的傳統，約翰晚年住在以弗所。本系列使徒行傳講義第 19 章講過那一場騷動：銀匠底米丟帶頭，滿城的人聚在戲園裡，喊著「大哉，以弗所人的亞底米啊！」（徒 19:28），如此約有兩小時（徒 19:34）。亞底米大廟就在那座城裡，是當時世界的奇觀之一。約翰的讀者每天走過它的影子。</p><p>但約翰寫這句話，前面剛說完「這是真神，也是永生」。偶像的意思，就是一切不是真神、卻坐上神位子的東西。在以弗所，它有柱子、有祭司、有銀匠的生意；在今天，它常常沒有形狀：一個職位、一筆存款、一段關係、孩子的成績、別人的肯定，甚至是我們的服事和名聲。保羅說貪婪就與拜偶像一樣。</p><p>這不是叫我們把一切文化、工作、藝術都貼上偶像的標籤。神所造的都是美好的；問題不在那樣東西，在它坐在哪裡。當它坐上了只有神能坐的位子，當我們沒有它就活不下去，它就成了偶像。</p><p>「自守」不是靠意志力咬緊牙關。上一段說，有一位從神生的在保守我們；我們自守的方法，就是常常回到那位真實的面前。321 在末端認出「有己與驕傲」的根：偶像最深的一層，往往是那個想要自己作主的我。讓他坐回中心，其他的東西就各回本位。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《神就是光》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書，約翰一書，第一章。"],["p","我想先問大家一個問題。"],["p","你有沒有在半夜停過電？"],["p","不是黃昏那種停電，是半夜。你醒過來，伸手不見五指。"],["p","你要去找手電筒，可是你甚麼也看不見。"],["p","你只好伸出手來。"],["q","摸。"],["p","摸床邊，摸牆壁，摸到桌角，膝蓋還重重撞了一下。"],["p","手在空中晃，一直在找，找一個可以抓住的東西。"],["p","今天這一章，有一個希臘字，說的就是這個動作。"],["q","ἐψηλάφησαν——摸。"],["p","這個字，新約用得不多。可是用到的地方，很有意思。"],["p","保羅在雅典，對一群哲學家講道，講到人類怎麼找神。"],["p","他說，神造了萬族的人，"],["q","「要叫他們尋求神，或者可以揣摩而得，其實他離我們各人不遠」（徒 17:27）"],["p","「揣摩」，原文就是這個字。"],["p","那是人在黑暗裡伸出手，摸來摸去，想要摸到神。"],["p","可是約翰一書一開口，用了同一個字，方向卻完全反過來。"],["q","「論到從起初原有的生命之道，就是我們所聽見、所看見、親眼看過、親手摸過的。」（1:1）"],["p","約翰說：我們摸到了。"],["p","不是我們在黑暗裡摸到了他，是他自己走到我們面前，讓我們摸。"],["p","弟兄姊妹，這就是整章的方向。"],["p","人在黑暗裡摸索神。神卻走進人的黑暗，讓人摸到他。"],["p","然後，約翰告訴我們，這一位是誰：神就是光。"],["p","這一章有三個字：摸，光，認。我們今天走三步。"],["q","第一步：親手摸過。"],["p","約翰寫這封信的時候，已經很老了。"],["p","照教會的傳統，他晚年住在以弗所。"],["p","當年和他一起跟隨耶穌的人，一個一個都走了。"],["p","這封信很特別。沒有問安，沒有署名，也沒有一句客套話。"],["p","一開口就是見證。好像一個老人等不及寒暄，直接把手伸出來。"],["p","你聽他的次序：聽見，看見，親眼看過，親手摸過。"],["p","一步比一步近。"],["p","聽見，可以隔著一條街。看見，要在同一個地方。"],["p","摸，就要近到伸手可及。"],["p","約翰，就是那個在最後的晚餐，側身靠在耶穌懷裡的門徒。"],["p","他聽過那個心跳。"],["p","為甚麼他要講得這麼具體？"],["p","因為那時候，教會出事了。"],["p","有一些人離開了，還帶走了一套說法。"],["p","他們說：神的兒子那麼聖潔，怎麼可能有血肉之軀？"],["p","耶穌只是看起來像人。像影子，像投在牆上的光影。"],["p","相傳還有一位克林妥說：基督在耶穌受洗時降在他身上，受難以前又離開了。"],["p","聽起來很屬靈。可是這樣一來，十字架上流血的，就不是神的兒子。"],["p","留下來的人，心裡發慌：我們信的那一位，到底是不是真的？"],["p","約翰沒有先跟他們辯論。他先伸出手來。"],["q","不是影子。我摸過他。"],["p","復活的那一晚，門徒驚慌害怕，以為看見了魂。"],["p","耶穌對他們說了一句話，用的就是這個字："],["q","「摸我看看！魂無骨無肉，你們看，我是有的。」（路 24:39）"],["p","弟兄姊妹，我們的信仰，不是一套我們想出來的道理。"],["p","是一群人碰到的一個人。"],["q","信仰的起點，不是我們找到了神，是神讓我們碰到他。"],["p","約翰在第二節，插進一段括號。"],["p","像老人講到一半，忍不住再說一次："],["p","這生命已經顯現出來，我們看見過，現在又作見證。"],["p","「顯現」這個字，是被動的。"],["p","不是人爬上去找到神，是神自己走下來，讓人看見。"],["p","停電的晚上，你在黑暗裡摸。忽然有人推開門，手裡拿著燈，走到你身邊。"],["p","你不必再摸了。他來了。"],["p","那麼，我們今天摸不到他，怎麼辦？"],["p","約翰在第三節，說出他寫信的目的。"],["q","「我們將所看見、所聽見的傳給你們，使你們與我們相交。我們乃是與父並他兒子耶穌基督相交的。」（1:3）"],["p","「相交」這個字，原文是 κοινωνία，意思是一同有分。"],["p","約翰年輕的時候，在加利利打魚。路加說，他和彼得是合夥的。"],["p","「合夥」，用的就是這個字根。"],["p","同一條船，網一起撒，魚一起分。"],["p","約翰是說：我們摸過他。現在，請你上我們的船。"],["q","你沒有摸過他，可是你可以和摸過他的人，坐在同一條船上。"],["p","請你留意次序。先說「與我們」，再說「與父並他兒子」。"],["p","有人說：我有神就夠了，不需要教會。"],["p","也有人把團契當成俱樂部，很熱鬧，卻沒有神。"],["p","約翰把兩條線綁在一起。"],["p","與父和子相交的人，不會一個人走。"],["p","與弟兄姊妹相交，源頭也不在熱鬧，在父與子。"],["p","我們是空中團契，很多時候，是隔著螢幕聚會。"],["p","隔著螢幕，能不能相交？"],["p","相交的源頭，不在同一個房間，在父與子。"],["p","可是相交也需要名字。"],["p","需要知道彼此這一週怎麼了，需要在難處裡伸出手。"],["p","螢幕關掉以後，你叫得出哪一位弟兄的名字？你為哪一位姊妹禱告過？"],["p","然後，序言的最後一句，落在一個字上。"],["q","「我們將這些話寫給你們，使你們的喜樂充足。」（1:4）"],["p","和合本旁邊有一個小註：有古卷作「我們」的喜樂。"],["p","兩種讀法放在一起，就看見一個牧者的心。"],["p","像父母做好一桌菜。自己先吃，不算團圓。"],["p","要等孩子都回到桌前，那頓飯才叫滿足。"],["p","約翰的喜樂，要等你也上了船，才會滿。"],["p","有的弟兄姊妹信主很認真，卻不太喜樂。守規矩，盡本分，心裡卻很乾。"],["p","約翰沒有叫你更努力地快樂。他叫你回到相交裡。"],["q","喜樂不是擠出來的，是被一個生命填滿的。"],["p","那麼，這位被摸過的生命，帶給我們的第一個信息是甚麼？"],["q","第二步：神就是光。"],["q","「神就是光，在他毫無黑暗。這是我們從主所聽見、又報給你們的信息。」（1:5）"],["p","聖經裡記下神說的第一句話，是甚麼？"],["p","創世記第一章：要有光。"],["p","約翰說：神不只是造了光。神就是光。"],["p","「毫無黑暗」，原文是雙重否定。"],["p","直譯是：黑暗在他裡面沒有，一點也沒有。"],["p","我們認識的人，再好，也有陰影。我們自己，更是如此。"],["p","神不是這樣。"],["p","他不是大部分是光，偶爾有暗的時候。"],["p","他沒有陰晴不定，沒有藏起來的算計。"],["q","你今天遇見的神，和他昨天、明天的樣子，是同一位。"],["p","可是弟兄姊妹，聽到「神是光」，有些人心裡是一緊的。"],["p","好像小時候做錯了事，聽見爸爸開燈的聲音。"],["p","燈一亮，就要被抓包了。"],["p","所以人的第一個反應，常常是躲。"],["p","伊甸園裡，人吃了那果子，聽見神的聲音，就藏在樹木中。"],["p","可是請你聽，神那時候開口的第一句話，不是「你做了甚麼」。"],["q","「你在哪裡？」（創 3:9）"],["p","那是一位來找人的神。"],["p","光帶來兩種反應。"],["p","有人怕光。"],["q","「凡作惡的便恨光，並不來就光，恐怕他的行為受責備。」（約 3:20）"],["p","也有人被光吸引。像寒夜走在路上，看見遠處一扇亮著燈的窗。"],["q","光照出灰塵，也照出回家的路。"],["p","接著，約翰說出這一章第一個「若說」。"],["q","「我們若說是與神相交，卻仍在黑暗裡行，就是說謊話，不行真理了。」（1:6）"],["p","請你聽清楚主詞。"],["p","不是「他們若說」。是「我們若說」。"],["p","約翰是使徒，是摸過主的人。他先把自己放進去。"],["q","這一節不是放大鏡，是一面鏡子。"],["p","那些離開的人，很可能掛著漂亮的口號：我們與神有特別的相交，我們已經超越了。"],["p","可是他們的生活，在黑暗裡走。不愛弟兄，說一套，做一套。"],["p","約翰說：這叫說謊。"],["p","「行」這個字，原文就是走路。"],["p","你往哪裡走，你就是怎樣的人。"],["p","這個字是現在式。說的是一條路的方向，不是某一天絆了一跤。"],["p","一個人，可能在光的路上跌倒。"],["p","另一個人，卻舒舒服服住在黑暗裡，還說自己天天與神同行。"],["p","約翰揭露的，是後者。"],["p","所以要問自己的，不是「我有沒有跌倒過」，是「我現在往哪裡走」。"],["p","我嘴上說的，和我週一到週六走的路，是同一條嗎？"],["p","如果這個問題讓你心裡一沉，先不要急著定自己的罪，也不要急著辯解。"],["p","因為下一節，約翰立刻把門打開了。"],["q","「我們若在光明中行，如同神在光明中，就彼此相交，他兒子耶穌的血也洗淨我們一切的罪。」（1:7）"],["p","這一節，有一個意外。"],["p","我們以為約翰會說：在光明中行，就與神相交。"],["p","他卻說：就彼此相交。"],["p","光裡最先發生的事，是人和人之間的牆倒下來。"],["p","在黑暗裡，每個人都在演。"],["p","在光裡，大家都被看見了，也就不必再假裝。"],["p","你有沒有這樣的經驗？小組裡，大家都在講好消息，氣氛很客氣。"],["p","然後有一個人說：其實，我這個月很糟。"],["p","整個房間，忽然鬆了一口氣。下一個人說：我也是。"],["q","誠實是會傳染的。"],["p","可是請你看這一節的下半句。"],["p","在光明中行的人，仍然需要耶穌的血來洗淨。"],["p","這句話很重要。在光中行，不等於沒有罪。不然，就不需要血了。"],["p","「洗淨」是現在式。正在洗。"],["p","不像一塊用完就沒有的肥皂，像一道一直在流的泉水。"],["p","光照出一個污點，血就洗淨一個污點。"],["q","光不是為了展示我們的骯髒，是為了讓洗淨可以發生。"],["p","而且，這是耶穌的血。"],["p","一個只是看起來像人的耶穌，是不會流血的。"],["p","所以約翰在第一節堅持「親手摸過」，不是在爭學術。"],["p","我們的洗淨，就繫在那真實流出來的血上。"],["p","在光中行，不是等自己乾淨了，才敢走進來。是帶著還沒洗淨的部分，走進來。"],["p","那麼，光照進來，照出了甚麼？約翰接下去，說了兩次「若說」，一次「若認」。"],["q","第三步：若認自己的罪。"],["q","「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（1:8）"],["p","這是全章最低的地方。"],["p","不是因為有人犯了大罪。是因為有人覺得，自己不需要被赦免。"],["p","「自欺」，原文是使自己走迷了路。"],["p","騙別人很難。騙自己，最容易。"],["p","我們很會替罪換名字。"],["p","那是我的個性。那是壓力太大。那是他先對不起我。"],["p","換久了，連自己都信了。"],["p","約翰說，到了這一步，真理就不在我們心裡了。"],["p","不是真理消失了，是我們把它關在門外。"],["q","最深的驕傲，不是自誇能幹，是覺得自己不需要恩典。"],["p","弟兄姊妹，這一節，常常被兩種人用錯。"],["p","第一種人，把它當藉口。"],["p","反正人人都有罪，我也沒辦法，就這樣吧。"],["p","可是約翰寫這句話，是要人來認罪，不是要人安心留在罪裡。"],["p","刻意、持續地不肯悔改，在這一節找不到掩護。"],["p","第二種人，剛好相反。"],["p","他們每次看見自己的罪，就很怕：我這樣，還算是神的孩子嗎？"],["p","如果你是這一種人，請你聽我說。"],["p","這一節對你，其實是好消息。"],["p","你看得見自己的罪，為它難過，正說明真理在你心裡作工。"],["p","真正自欺的人，是看不見的。"],["q","看見自己的罪，不是你被丟棄的記號，是光已經照進來的記號。"],["p","然後，在兩次「若說」中間，約翰放了一節不一樣的話。"],["p","全章，從最低的地方，升到最高的地方。"],["q","「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」（1:9）"],["p","「認」，原文是 ὁμολογέω。"],["p","這個字由兩部分組成：「相同」，和「說」。"],["p","意思是：說一樣的話。"],["p","認罪，不是把自己罵到一文不值。"],["p","也不是寫一份長長的悔過書，好讓神看見我多麼痛心。"],["p","認罪，是對神說：你說這是罪，我也說這是罪。"],["p","不再換名字。不再找理由。不再拿別人來比。"],["p","停電的那個晚上，燈終於亮了。你看見地上一攤水，杯子倒在旁邊。"],["p","你可以說：那攤水本來就在那裡。"],["p","你也可以說：是我打翻的。"],["q","若說，是保住自己。若認，是回到本位。"],["p","回到本位，就是讓神作神，讓人作人。"],["p","他是光。我們有罪。"],["p","三次「若說」，都是人坐上審判的位子，自己替自己判案。"],["p","一次「若認」，是從那個位子上下來，把判案交還給神。"],["p","然後請你看，人下來以後，遇見的是怎樣的神。"],["p","約翰沒有說：神是慈悲的，所以會赦免。"],["p","他說：神是信實的，是公義的。"],["p","信實，是神守住他自己的應許。"],["p","不看你今天的表現，也不看他今天的心情。剛才說過，他毫無黑暗。"],["p","公義，好像反而叫人害怕。一位公義的神，怎麼會放過我？"],["p","可是約翰說，赦免正是公義的。因為代價已經付了。"],["q","「他為我們的罪作了挽回祭」（2:2）"],["p","神赦免你，不是放水，是算清楚了。"],["p","那筆帳，耶穌已經用他的血付清了。"],["p","而且赦免是完整的。洗淨我們「一切」的不義，沒有一件留在外面。"],["p","也許有人會問：我已經信主了，還需要認罪嗎？"],["p","需要。不是為了重新得救。"],["p","是像一個孩子做錯了事，回家跟父親說清楚。"],["p","他本來就是這個家的孩子。說清楚，是為了回到餐桌旁，可以再看著父親的眼睛。"],["p","我也要誠實地說：赦免，不表示罪的後果一定消失。"],["p","大衛認罪的時候，拿單說：耶和華已經除掉你的罪。可是後果，仍然臨到他的家。"],["p","撒該蒙恩以後，自己說要還人四倍。"],["p","神那一邊，赦免是完整的。人這一邊的信任，需要時間和行動慢慢重建。"],["p","最後一次「若說」，是最重的一次。"],["q","「我們若說自己沒有犯過罪，便是以神為說謊的，他的道也不在我們心裡了。」（1:10）"],["p","為甚麼這麼重？因為神已經說了話。"],["p","他說世人都犯了罪，他為了這罪，差他的兒子來。"],["p","一個人若說，我沒有犯過罪，等於說：十字架是多餘的。"],["p","這一章從生命之道開始，到他的道不在我們心裡結束。"],["p","一章若停在這裡，就太重了。"],["p","可是約翰沒有停在這裡。翻過去，下一句是："],["q","「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）"],["p","剛說完最嚴厲的話，馬上是最溫柔的稱呼。"],["p","方向，是不犯罪。"],["p","跌倒的時候，有一位中保。"],["p","「中保」，是站在你旁邊、替你說話的那一位。"],["p","在父那裡，有一位不是在控告你，是在替你說話。"],["q","你跌倒的那一刻，天上沒有人嘆氣說「又是他」。有一位站在父面前說：我為他流過血。"],["p","弟兄姊妹，我們回到那個停電的晚上。"],["p","你在黑暗裡摸。摸牆壁，摸桌角，膝蓋撞得很痛。"],["p","人類幾千年，就是這樣在黑暗裡摸索神。"],["p","也許你今天也是這樣。"],["p","你在一段關係裡，摸不到出口。你在一個決定前面，摸不到方向。"],["p","你甚至在信仰裡，摸不到神。"],["p","可是約翰告訴我們：不是我們摸到了他。是他走進我們的黑暗，讓我們摸到他。"],["p","那雙讓約翰摸過的手，後來被釘在十字架上。"],["p","從那裡流出來的血，現在還在洗淨我們一切的罪。"],["q","神就是光。光不是來抓你的，是來找你的。"],["p","他今天問你的，還是那一句：你在哪裡？"],["p","你不必躲。你也不必先把自己弄乾淨。"],["p","你只要和他說一樣的話。"],["p","主啊，你說得對。這是罪。"],["p","然後，相信他的信實，比你的感覺更可靠。"],["p","也許有一件事，你替它找理由，找了很多年。今天，可以停止辯護，用它本來的名字叫它。"],["p","也許你需要一個安全的人。一位可信的屬靈同伴，一個會保守祕密的小組。"],["p","在那裡，說一句真話。"],["p","你會發現，光裡不只有被看見，還有被接納。"],["q","「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」（1:9）"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《你們要住在主裡面》"],["p","弟兄姊妹平安，今天我們讀約翰一書，第二章。"],["p","今天我只想先給大家一個數字。"],["q","三。"],["p","請你把這個數字放在心裡，等一下我們會一直回來找它。"],["p","你有沒有填過教會的會友資料表？"],["p","姓名，電話，住址。然後有一欄：信主幾年。"],["p","有人寫三年，有人寫三十年。"],["p","我們很習慣用這個數字，來看一個人屬靈有多大。"],["p","信主三十年，應該很成熟了吧。信主三年，還是個孩子吧。"],["p","可是約翰在這一章，給了我們另一種算法。"],["p","他忽然停下來，抬起頭，叫了三種人。"],["q","「小子們哪，我寫信給你們，因為你們的罪藉著主名得了赦免。」（2:12）"],["q","「父老啊，我寫信給你們，因為你們認識那從起初原有的。少年人哪，我寫信給你們，因為你們勝了那惡者。」（2:13）"],["p","小子，少年人，父老。"],["p","三種稱呼。很多人把它讀成三種屬靈的年齡。"],["p","你注意，約翰沒有問：你信主幾年。"],["p","他問的是：你認識神有多深。"],["p","小子知道自己被赦免了。少年人在爭戰裡站住了。父老認識那從起初原有的。"],["p","所以，有人信主三十年，還在原地打轉。"],["p","也有人信主三年，已經能扶別人一把。"],["p","屬靈年齡不是看年資，是看認識神有多深。"],["q","那麼，我想請你安靜一下，問自己一句：我今天在第幾級？"],["p","不要急著回答，也不要急著比較。"],["p","因為約翰對這三種人，說的第一句話都一樣：我寫信給你們。"],["p","沒有一種人被漏掉。"],["p","今天這一章很長，二十九節，是全卷最長的一章。"],["p","它有三個字：保，世，膏。我們跟著約翰走三段路。"],["q","第一段：一位中保。"],["p","這一章一開口，約翰叫了一聲："],["q","「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。」（2:1）"],["p","上一章剛說完，人若說自己無罪，便是自欺。"],["p","有人聽了就鬆一口氣：既然人人都有罪，那就算了吧。"],["p","約翰馬上把方向扳回來。"],["p","我寫信給你，是要你不犯罪。"],["p","方向沒有打折。"],["p","可是一位老牧人知道，羊還是會跌倒。"],["p","所以他接著說："],["q","「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）"],["p","請你聽那個「我們」。"],["p","他沒有說「你們若犯罪」。年老的使徒，把自己也放進去。"],["p","這兩句話要一起聽。"],["p","方向是不犯罪；跌倒的時候，有中保。"],["p","只聽前一句，人會被壓垮。只聽後一句，人會變隨便。"],["p","「中保」這個字，原文是 παράκλητος。"],["p","意思是被叫來站在你旁邊的那一位。"],["p","在法庭上，就是替你說話的辯護人。"],["p","約翰福音裡，主耶穌說要賜下「另外」一位保惠師，用的是同一個字。"],["p","另外一位，表示已經有一位了。"],["p","在地上，聖靈在我們旁邊；在父那裡，耶穌替我們說話。"],["p","這一位站在我們旁邊，不是替我們找藉口。"],["p","這一位是「那義者」。他是用自己的祭替我們說話。"],["q","「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪。」（2:2）"],["p","這祭是誰預備的？約翰到第四章才講完。"],["q","「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。」（4:10）"],["p","不是人去平息一位生氣的神。是神自己預備了祭。"],["p","而且這祭夠大，大到普天下。"],["p","弟兄姊妹，很多人跌倒以後，第一個反應是躲起來。"],["p","等我好一點，再回到神面前。"],["p","可是約翰告訴你：你不是一個人去面對父。"],["p","你跌倒的那一刻，有一位已經站在你旁邊了。"],["p","然後約翰講到認識他的人，會怎麼活。"],["q","「我們若遵守他的誡命，就曉得是認識他。」（2:3）"],["p","這句話很容易被讀成一張考卷：遵守得夠多，才算得救。"],["p","可是你聽第五節，主詞是甚麼？"],["p","愛神的心在他裡面，實在是完全的。"],["p","遵守，不是我們換得認識的代價。"],["p","遵守，是被愛的人自然長出來的樣子。"],["q","「人若說他住在主裡面，就該自己照主所行的去行。」（2:6）"],["p","這是本章第一個「住」。"],["p","照主所行的，就是看著他怎麼走，我也怎麼走。"],["p","他怎麼蹲下來，為門徒洗腳。"],["p","他怎麼在十字架上，為釘他的人禱告。"],["p","321 在這裡認出一句很熟悉的話：耶穌是我的榜樣。"],["p","可是榜樣不是一根量你的尺，是一條你跟著走的路。"],["p","接著，約翰講到一條命令。他說它是舊的，又說它是新的。"],["q","「親愛的弟兄啊，我寫給你們的，不是一條新命令，乃是你們從起初所受的舊命令」（2:7）"],["p","舊，是因為從起初就聽過：要彼此相愛。"],["p","新，是因為主在最後的晚餐，給了它一個新的尺度。"],["q","「我怎樣愛你們，你們也要怎樣相愛。」（約 13:34）"],["p","新的不是內容，是尺度：我怎樣愛你們。"],["p","然後是第三次「人若說」。"],["q","「人若說自己在光明中，卻恨他的弟兄，他到如今還是在黑暗裡。」（2:9）"],["p","三次「人若說」：說認識他，說住在主裡面，說自己在光明中。"],["p","三句話都很屬靈。三句話，也都可以只停在嘴上。"],["p","這不是拿來量別人的尺。約翰是要每一個人，先問自己。"],["p","恨最可怕的地方，是叫人看不見。"],["q","「因為黑暗叫他眼睛瞎了。」（2:11）"],["p","相反的，愛弟兄的，住在光明中。"],["p","愛不是要你假裝沒有受過傷，也不是叫你沒有界線地回到傷害裡。"],["p","愛是在光裡，把那個人帶到神面前，不再讓恨替你決定路怎麼走。"],["q","第二段：不要愛世界。"],["p","講完光和黑暗，約翰停下來，回到我們開頭那個數字。"],["p","三。"],["p","小子，父老，少年人。他連說了六次：我寫信給你們。"],["p","前面的話很重。要遵守誡命，要愛弟兄，恨弟兄的在黑暗裡。"],["p","有人聽到這裡，可能開始發慌：那我到底算不算？"],["p","所以約翰停下來。"],["p","你聽每一句後面的「因為」："],["p","因為你們的罪得了赦免。因為你們認識父。因為你們勝了那惡者。"],["p","每一個「因為」，後面都是一件已經成就的事。"],["p","約翰是在說：我寫這些，不是因為懷疑你們，是因為你們已經是了。"],["p","剛信主的小子，你要聽見：你的罪是藉著主名得了赦免。"],["p","根據不在你有多好，是在他的名。"],["p","正在爭戰的少年人，你要聽見：你們勝了那惡者。"],["p","在原文，那是完成式。仗已經在十字架上打贏了。"],["p","你不是去爭取得勝，你是從得勝的地方出發。"],["p","少年人得勝的祕訣，約翰只給了一句："],["q","「因為你們剛強，神的道常存在你們心裡」（2:14）"],["p","剛強不是性格，是神的道住在裡面。"],["p","走了很久的父老，你要聽見：你認識那從起初原有的。"],["p","約翰對父老，兩次說了同一句話。"],["p","他沒有加新的。因為到了父老這一級，要的不是更多，是更深。"],["p","你沒有白走。"],["p","這三種年齡，有人讀成教會裡三種人，也有人讀成每一個信徒身上的三個面向。"],["p","兩種讀法，都帶著安慰。"],["p","但約翰對這三種人說完安慰之後，緊接著，給了一句叮嚀。"],["q","「不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。」（2:15）"],["p","弟兄姊妹，這節經文被用錯過很多次。"],["p","有人因此不敢聽音樂，不看電影，不讀小說，把一切文化都當成危險。"],["p","也有人因此輕看身體，冷落家人，不關心社會。"],["p","這都不是約翰的意思。"],["p","因為同一位約翰，在同一封信裡說："],["q","「神差他獨生子到世間來，使我們藉著他得生」（4:9）"],["q","「父差子作世人的救主」（4:14）"],["p","神自己愛這個世界，愛到差他的兒子進來。"],["p","所以基督徒不是逃離世界的人，是在世界裡，不被世界佔有的人。"],["p","那約翰說的「世界」是甚麼？他自己下了定義。"],["q","「因為，凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。」（2:16）"],["p","你看，又是一個三。"],["p","前面是三種年齡，這裡是三樣東西。"],["p","不是山，不是海，不是一頓好飯，也不是你的鄰舍。"],["p","是那一套叫人離開父的慾望和驕傲。"],["p","肉體的情慾，是：我想要。"],["p","眼目的情慾，是：我看見了，我也要。"],["p","今生的驕傲，是：我有，你要知道我有。"],["p","「驕傲」這個字，原文是 ἀλαζονεία。"],["p","古時候，它是用來形容走江湖、誇大其詞的人。"],["p","「今生」這個字是 βίος，指的是你的家當，你過日子的本錢。"],["p","所以今生的驕傲，是靠著自己所擁有的來誇口。"],["p","這一樣最隱密。它可以穿著很屬靈的衣服。"],["p","我的事工比較大。我的孩子比較好。我住在哪一區。我服事了幾年。"],["p","一個人用自己擁有的東西來定義自己，就是讓世界替他命名。"],["p","你發現了嗎？三種年齡，是看你認識神有多深。"],["p","今生的驕傲，卻是看你手上抓了多少。"],["p","一個往裡面走，一個往外面抓。"],["p","321 在這裡認出一件事：驕傲，是離開本位，抓住權力。"],["p","人本來的位置，是被造的，是被愛的，是蒙赦免的小子。"],["p","可是驕傲叫人離開那個位置，伸手去抓本來不屬於他的榮耀。"],["p","連信主的年資，都可以變成一樣被抓在手裡的東西。"],["p","那怎麼辦？約翰沒有給一張禁止清單。他給了一個比較。"],["q","「這世界和其上的情慾都要過去，惟獨遵行神旨意的，是永遠常存。」（2:17）"],["p","在一棟快要拆的房子裡裝潢，再漂亮，也會被拆掉。"],["p","世界正在過去。"],["p","可是遵行神旨意的人，常存。"],["p","「常存」，和「住在主裡面」的「住」，是同一個字。"],["p","世界在過去，住在神裡面的人，留下來。"],["q","第三段：住在主裡面。"],["p","約翰接著說了一句，讓很多人緊張的話。"],["q","「小子們哪，如今是末時了。」（2:18）"],["p","請你注意，約翰在第一世紀就這樣說了。"],["p","所以這句話不是給我們拿來算日子的。"],["p","也不是要我們把「敵基督」這個名號，貼在任何一個人、一個國家、一個宗派身上。"],["p","約翰自己給了標準。"],["q","「誰是說謊話的呢？不是那不認耶穌為基督的嗎？不認父與子的，這就是敵基督的。」（2:22）"],["p","約翰問的，不是你站哪一邊，是你怎樣看耶穌。"],["p","那是一個基督論的問題，每一代都要回答。"],["p","約翰的讀者，面對的是一個很具體的痛。"],["q","「他們從我們中間出去，卻不是屬我們的」（2:19）"],["p","一起敬拜過，一起擘過餅的人，帶著另一套說法走了。"],["p","留下來的人，晚上睡不著：是不是我們錯了？是不是他們看得比較清楚？"],["p","這一節，是約翰寫給留下的人的安慰。"],["p","你們沒有錯。你們不必因為他們的離開，懷疑自己所信的。"],["p","可是弟兄姊妹，這一節不是交給我們一把尺，去量每一個不再來聚會的人。"],["p","約翰說的，是那一群否認基督的教師。"],["p","今天，人離開一間教會，有許多原因。"],["p","有人是搬了家。有人在掙扎裡，暫時走不進來。"],["p","也有人，是在教會裡受了傷。"],["p","約翰從來沒有給我們權柄，去宣判誰屬神、誰不屬神。"],["p","緊接著，約翰把鏡頭轉回來。"],["q","「你們從那聖者受了恩膏，並且知道這一切的事。」（2:20）"],["p","出去的人，有他們的說法。留下的你們，有恩膏。"],["p","在舊約，膏油是倒在君王、祭司、先知頭上的。"],["p","可是這裡的「你們」，是複數。不是少數領袖，是全體。"],["p","然後是這一章最容易被用錯的一句話。"],["q","「你們從主所受的恩膏常存在你們心裡，並不用人教訓你們」（2:27）"],["p","有人說：我有聖靈，講道、查經都可以省了。"],["p","也有人反過來說：我有恩膏，我說的就是神說的，你們都要聽我的。"],["p","兩種講法，都把恩膏變成了自己的招牌。"],["p","可是你想一想，約翰自己正在寫信教導他們。"],["p","一個說「你們不需要人教導」的人，寫了整整五章信來教導。"],["p","可見他的意思，不是拒絕一切教導。"],["p","他指的是那些「引誘你們的人」（2:26），要你們離開起初所聽見的道。"],["p","對那種新教導，你們不需要。你們裡面的那一位，早就教過你們真的。"],["p","恩膏像甚麼？像一個孩子對母親聲音的熟悉。"],["p","電話那頭有人冒充你的母親，你不必上一堂課，一聽就知道不對。"],["p","不是因為你比較聰明，是因為你跟她住得夠久。"],["p","而這恩膏在「你們」全體身上，不是在某一個人身上。"],["p","所以它在聖經裡，在群體裡，在弟兄姊妹彼此的印證裡，最清楚。"],["p","321 在末端認出：聖靈是我的引導。"],["p","聖靈引導的方向，總是更深地住在主裡面，也更願意和弟兄姊妹一起受教。"],["p","那要住在甚麼裡面？約翰說："],["q","「務要將那從起初所聽見的，常存在心裡。」（2:24）"],["p","有人出去追新的了。約翰對留下的人說：不要追，要存。"],["p","我們很容易以為，屬靈長進就是不斷聽到新的東西。"],["p","約翰卻說，你最需要的，是你起初聽見的那個福音。"],["p","耶穌是基督。他為你的罪死。神愛你。"],["p","不是你已經聽過，就可以往下一個去了。"],["p","是你還沒有讓它住滿你。"],["p","然後，整章走到這裡，收成一句話。"],["q","「小子們哪，你們要住在主裡面。這樣，他若顯現，我們就可以坦然無懼；當他來的時候，在他面前也不至於慚愧。」（2:28）"],["p","中保，新命令，三種年齡，世界的過去，有人的出去，恩膏的教訓。"],["p","全部都是為了這一句：住下來。"],["p","住，不是一個激烈的字。是一個安靜的字。"],["p","不是一次的衝刺，是每天的回家。"],["p","坦然無懼，是在他面前不必躲。"],["p","這份坦然，不是因為我們從來沒有跌倒。"],["p","是因為我們一直沒有離開那位中保。"],["p","這一章從第一節的中保開始，到第二十八節的坦然結束。"],["p","中間，是一條住的路。"],["p","弟兄姊妹，我們回到開頭那個數字。"],["p","三。小子，少年人，父老。"],["p","321 在這裡認出 235 的 3：屬靈的父母，屬靈的兒女，一代接著一代。"],["p","父老認識神，所以能陪少年人爭戰；少年人站穩了，就能扶起剛信主的小子。"],["p","可是經文先講的，是身分，不是制度。"],["p","所以我要請你再看一件事。"],["p","這一章的第一節，約翰怎麼稱呼他們？小子們。"],["p","這一章快結束的時候，第二十八節，他又怎麼稱呼他們？還是小子們。"],["p","中間，他分了三級。可是開頭和結尾，他把所有人都叫成小子。"],["p","父老也是小子。年老的使徒自己，也說「我們」。"],["q","在他面前，我們都是小子。"],["p","所以那個問題，我們還是可以問：我今天在第幾級？"],["p","可是請你不要拿這個問題，壓自己，也不要拿來量別人。"],["p","因為不管你在第幾級，約翰給你的，是同一句話：住在主裡面。"],["p","也許你是剛信主的小子，你常常跌倒，常常懷疑。"],["p","請你記得：在父那裡，你有一位中保。"],["p","也許你是正在爭戰的少年人，世界一直在拉你。"],["p","請你記得：世界正在過去，神的道住在你裡面，你是從得勝的地方出發。"],["p","也許你是走了很久的父老，可是心裡很累，甚至有一點驕傲，覺得自己甚麼都懂了。"],["p","請你記得：你最需要的，不是更多，是更深，是回到從起初所聽見的。"],["p","也許你是那個暫時離開的人，今天剛好聽到這篇道。"],["p","請你聽見，約翰叫的，還是那一聲：小子們哪。"],["q","不要因為別人離開就慌，不要因為新的聲音就追。"],["q","住下來。"],["p","住在那位中保裡面，住在那從起初所聽見的道裡面。"],["p","等到他顯現的那一天，你可以抬起頭，往前走。"],["q","「小子們哪，你們要住在主裡面。」（2:28）"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《我們得稱為神的兒女》"],["p","弟兄姊妹平安，今天我們讀約翰一書，第三章。"],["p","我想先給大家看一張照片。你不必真的看見它，聽我描述就好。"],["p","照片裡是一間很普通的辦公室。日光燈，灰色的桌子，一疊文件。"],["p","桌子一邊坐著一對中年夫妻，另一邊坐著一位社工。"],["p","那位先生剛剛把筆放下。最後一頁，最後一個簽名，簽好了。"],["p","桌子旁邊，站著一個五歲的小女孩。"],["p","她在育幼院住了三年。這三年裡，有很多大人來看過她，又走了。"],["p","她學會了一件事：不要太早開口叫人。"],["p","因為叫了，人還是會走。叫得越早，心就疼得越久。"],["p","所以每一次有人來看她，她都很乖，很有禮貌，可是不叫。"],["p","可是那一天，文件簽好了。社工說：好了，從今天起，你們是一家人了。"],["p","小女孩看著那個剛放下筆的男人，看了很久。"],["p","然後，她小小聲地叫了一聲："],["q","「爸爸。」"],["p","照片拍下來的，就是這一刻。"],["p","那位先生的臉，你看不太清楚。因為他用手摀著臉。"],["p","他哭了。"],["p","他等這一聲，等了很多年。他和太太跑了好多趟法院，填了好多份表格。"],["p","可是一直到這一聲，他才真的覺得：我是爸爸了。"],["p","弟兄姊妹，我們就把畫面停在這裡。"],["p","請你記住這張照片。因為今天這一章，約翰寫到一半，也停在一模一樣的地方。"],["p","這一章有三個字：看，生，捨。我們今天走三步。"],["q","第一步：你看。"],["p","約翰一書是一封很安靜的信。"],["p","它沒有一首頌讚詩，沒有一段「願榮耀歸給他」。"],["p","約翰一直在講道理：光和黑暗，真和假，住在主裡面。"],["p","可是寫到第三章第一節，這位老使徒忽然停筆了。"],["p","他剛寫完上一章最後一句：凡行公義的人，都是他所生的。"],["p","寫到「生」這個字，他自己先被震住了。"],["p","我們？是神生的？"],["p","於是他寫下全卷唯一的一聲驚嘆。"],["q","「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。」（3:1）"],["p","請大家在這裡，和我一起停一下。"],["p","不要急著往下讀。"],["q","你看。"],["p","「你看」，原文是複數。約翰不是對一個人說，是對整個教會說：大家一起看。"],["p","那時候的教會，剛剛經歷分裂。有人走了。留下來的人很受傷，也很疲倦。"],["p","約翰沒有叫他們看自己表現得好不好，也沒有叫他們看誰留下、誰走了。"],["p","他說：看父給了你們甚麼。"],["p","「何等的慈愛」，這個「何等」，原文的字很有意思。"],["p","它最早的意思，是問一個人的出身：這人是從哪一國來的？"],["p","到新約時代，它已經變成一聲驚訝：這是怎樣的愛！"],["p","可是字裡面那個味道還在：這愛不是本地出產的。"],["p","這世界沒有這種愛。它是從另一個國度來的。"],["p","「賜給」，是完成式。父已經給了。給了，就留在那裡，沒有收回去。"],["p","「得稱為神的兒女」，是被動的。叫你名字的，是父。"],["p","不是你替自己取了一個好聽的名字，是父親親口叫你：我的孩子。"],["p","然後約翰又補了一句：我們也真是他的兒女。"],["p","有些古卷沒有這一句。可是抄本的證據支持保留，和合本也照收了。"],["p","短短幾個字，好像那位父親在文件上簽好了名，抬起頭來又說一次：這是真的。"],["p","弟兄姊妹，有人一輩子在找一個肯叫他名字的父親。"],["p","有人從小聽到的是：你怎麼不像你哥哥？你怎麼這麼沒用？"],["p","對這樣的心，約翰不先給命令。他先給一個名字。"],["q","神的兒女。"],["p","那世界呢？約翰說，世人不認識我們，因為世人也不認識他。"],["p","一個孩子在學校，同學都不知道他爸爸是誰。他還是那個家的孩子。"],["p","被不被認出來，不改變出生證明。"],["p","接著約翰把時間切成兩段。"],["q","「我們現在是神的兒女，將來如何，還未顯明」（3:2）"],["p","現在，已經是。將來，還沒有看見。"],["p","很多信徒把次序弄反了。以為要先變好，有一天才配作神的兒女。"],["p","約翰說：不。先是兒女，然後才慢慢長得像。"],["p","就像照片裡那個小女孩。文件簽好那天，她就姓了這個家的姓。"],["p","說話的口氣、笑起來的樣子越來越像爸爸，那是在這個家住久了以後的事。"],["q","「但我們知道，主若顯現，我們必要像他，因為必得見他的真體。」（3:2）"],["p","「像他」，不是變成他。我們永遠是受造的兒女，不會變成神。"],["p","可是我們會像那位復活得榮的主。不是靠我們努力爬上去，是看見他的那一刻，就被改變了。"],["p","所以你今天看自己，只看見還沒長好的地方：老脾氣，舊傷口，改了又犯的習慣。"],["p","約翰沒有說這些不重要。他說，這些不是終點。"],["p","你現在的樣子，不是你最後的樣子。"],["p","然後才是第三節：凡向他有這指望的，就潔淨自己。"],["p","注意次序。先有指望，然後潔淨。不是潔淨了，才准有指望。"],["p","像一個要出嫁的女孩子。婚期定了，她開始整理房間，學新家的口味。"],["p","沒有人逼她。是那個日子在吸引她。"],["p","被恐嚇出來的潔淨，很累。被盼望吸引出來的潔淨，很輕。"],["p","弟兄姊妹，整封信只有這一聲驚嘆，這一聲就是頌讚。"],["p","321 在這裡認出「讓耶穌得著一切的榮耀」。不必多講。在一切要做的事以前，先抬頭看。"],["q","第二步：從神生的。"],["p","可是看完了，約翰立刻講到罪。"],["q","「凡犯罪的，就是違背律法；違背律法就是罪。」（3:4）"],["p","「違背律法」，原文是「不法」。意思不只是犯了某一條規定。"],["p","罪的核心，不是那件事有多大，是那件事在說甚麼：我自己作主。"],["p","小孩子偷吃一顆糖。糖很小。可是他心裡說的是：我不聽爸爸的。"],["p","那時候很可能有人在教導：懂了屬靈的道理，身體做甚麼都無所謂。"],["p","今天也有人說：神愛我，所以這件事沒關係。"],["p","約翰不同意。可是他沒有停在指控上，下一句就是福音："],["q","「你們知道主曾顯現，是要除掉人的罪，在他並沒有罪。」（3:5）"],["p","他來，不是來觀察我們的罪。他來，是要把它拿走。"],["p","接下來，是這一章最難的兩節。也是最常被用錯的兩節。"],["q","「凡從神生的，就不犯罪，因神的道（原文是種）存在他心裡；他也不能犯罪，因為他是由神生的。」（3:9）"],["p","我知道，今天會眾裡有人，一聽到這節就心沉下去。"],["p","你昨天才發了脾氣。你上個禮拜又回到那個你發誓不再回去的地方。"],["p","晚上讀到「不能犯罪」，你開始問：我是不是根本沒有被神生過？"],["p","弟兄姊妹，我要很清楚地說：約翰寫這一節，不是為了製造這樣的夜晚。"],["p","同一個約翰，在第一章說："],["q","「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（1:8）"],["p","在第二章一開頭又說："],["q","「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（2:1）"],["p","同一位作者，不會在幾段以後推翻自己。"],["p","所以這兩節一定要一起讀。3:9 講的是方向，2:1 講的是跌倒時的出路。"],["p","只讀一節，人就會失去平衡。"],["p","那 3:9 到底在說甚麼？歷代的解經家有幾種讀法。"],["p","有人說，動詞是現在式，意思是不持續活在罪中。"],["p","有人說，這裡的罪是特別的罪，就是背棄基督。"],["p","也有人說，約翰是針對那些自稱認識神、卻輕看罪的假教師。"],["p","本講義主要是這樣讀：約翰在講新生命的本性和方向。"],["p","從神生的人，罪不再是他的家。"],["p","就像一個人搬了家。偶爾還會走錯路，走回舊家的巷口。"],["p","可是他不會再住在那裡了。他的鑰匙，開的是新家的門。"],["p","約翰用了一個很美的字。和合本譯「道」，小字說，原文是「種」。"],["p","一顆種子落在地裡。剛發芽的時候很弱，會被風吹歪，會被蟲咬。"],["p","可是它不會長成荊棘。因為種，決定了它是甚麼。"],["p","神把他的生命種在你裡面。這生命會往光長。"],["p","被風吹倒一次，不改變它是哪一種植物。"],["p","所以，如果你讀到這裡覺得難過，那份難過本身是好消息。"],["p","不在乎的人，不會難過。"],["p","你會為罪憂傷，說明你裡面有一位叫你不安的聖靈。"],["q","用 3:9 盼望：種還在。用 2:1 回家：中保還在。"],["p","約翰在中間還說了一句："],["q","「神的兒子顯現出來，為要除滅魔鬼的作為。」（3:8）"],["p","「除滅」，原文是「解開」。"],["p","拉撒路從墳墓出來的時候，手腳還裹著布。主說：解開，叫他走。"],["p","也許你身上也有一圈纏了很多年的布。"],["p","不是你自己去跟黑暗摔角。是那位已經來了的主，一圈一圈替你解開。"],["p","然後約翰把話題一轉，從「義」轉到「愛」。他舉了全聖經第一對兄弟的例子。"],["q","「不可像該隱；他是屬那惡者，殺了他的兄弟。」（3:12）"],["p","這是全章的最低點。"],["p","人類第一個家庭，第一對兄弟，第一次流血。"],["p","為甚麼殺他？約翰自己問，自己答：因為自己的行為是惡的，兄弟的行為是善的。"],["p","該隱不是被亞伯傷害了。他是被亞伯的好刺痛了。"],["p","嫉妒就是這樣。別人的光，照出了我的暗。我不肯改自己，就想把那道光熄掉。"],["p","不一定動刀。可能是一句冷話，一個故意不轉達的消息，一次背後的搖頭。"],["p","當年神警告過該隱：罪就伏在門前，你卻要制伏它。那時候門還開著。"],["p","今天也是。看見某個人做得好，你心裡就不舒服？那是門前的警告，不是定罪。"],["p","接著約翰給了一句確據："],["q","「我們因為愛弟兄，就曉得是已經出死入生了。」（3:14）"],["p","注意，不是因為愛弟兄，才出死入生。是因為愛弟兄，就曉得了。"],["p","愛不是買生命的門票。愛是生命已經進來的記號。"],["p","約翰也說，恨弟兄的就是殺人的。殺人，是從心裡那一句「他最好不存在」開始的。"],["p","可是我要說清楚：被傷害的人心裡有憤怒，那是傷口在說話。"],["p","你可以把憤怒帶到神面前，不必假裝沒有。危險的是讓它住下來，長成一個願望。"],["q","第三步：神比我們的心大。"],["p","愛是甚麼？約翰不給我們一個哲學的定義。他指著十字架。"],["q","「主為我們捨命，我們從此就知道何為愛；我們也當為弟兄捨命。」（3:16）"],["p","約翰在那個晚上，親耳聽主說過："],["q","「人為朋友捨命，人的愛心沒有比這個大的。」（約 15:13）"],["p","第二天，他站在十字架底下，看見這句話成了真的。"],["p","幾十年過去了，他寫信講愛，還是從那一幕開始。"],["p","「捨命」，原文是把性命放下，像把一件外衣脫下來。"],["p","主說過，沒有人奪我的命去，是我自己捨的。"],["p","捨命不是被逼的。是愛的選擇。"],["p","我們大多數人，一輩子不會被要求真的替人去死。"],["p","可是捨命可以一點一點地捨。"],["p","捨一個晚上，陪一個剛失業的弟兄。捨一份面子，先去道歉。"],["p","捨一筆錢，讓別人的孩子交得出學費。"],["p","可是弟兄姊妹，這裡有一件事，我一定要講清楚。"],["p","為弟兄捨命，是為了對方真正的好。"],["p","它不是叫一個被打、被控制、被欺負的人留在危險裡，對自己說：我要像主一樣捨命。"],["p","主捨命，是為了救人脫離罪。不是為了讓罪繼續傷人。"],["p","如果你今天正在一段不安全的關係裡，愛的第一步，可能是離開危險。"],["p","去找一個可信的人，找相關的機構求助。涉及暴力，應當報警。"],["p","原諒，可以交給神。和好，需要對方真實的悔改，也需要安全。"],["p","這不是不愛。這正是約翰下一句說的："],["q","「小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。」（3:18）"],["p","愛有兩塊試金石。"],["p","第一塊是行為。約翰前一節才說，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能在他裡面？"],["p","他不是說沒看見。他說看見了，然後把門關上。"],["p","不只說「我為你禱告」，也送一袋米去。"],["p","第二塊是誠實。原文是「真實」。愛不演戲。"],["p","誠實的愛，有時候是說出真相。"],["p","告訴一個朋友：你正在傷害你自己。告訴一個一再越界的人：這樣不行。"],["p","不肯說真相的愛，常常只是怕衝突。"],["p","321 在末端認出 920 的樣子：對身邊那一個「2」，用行為和誠實去愛。"],["p","講到這裡，我猜有一些人心裡的聲音已經越來越大。"],["p","我捨得不夠。我愛得不夠。我剛才聽到的每一節，都在講我做不到的事。"],["p","弟兄姊妹，約翰知道你在這裡。所以他在這一章的最後，停下來對你的心說話。"],["q","「我們的心若責備我們，神比我們的心大，一切事沒有不知道的。」（3:20）"],["p","有些人的心，像一個從不下班的檢察官。"],["p","做錯一件事，可以在心裡審自己十年。"],["p","別人早就忘了，自己還在半夜重播。"],["p","約翰說，在神面前，我們的心可以安穩。"],["p","「安穩」原文是說服、安撫。你的心在控告你，你可以在神面前回答它。"],["p","怎麼回答？不是說「我其實沒那麼壞」。"],["p","是說：神比你大。"],["q","他知道我的罪，比我的心知道得更清楚。他也知道我的愛。"],["p","他知道你在黑夜裡的眼淚，知道你想回頭的那一份心。"],["p","彼得三次不認主以後，在加利利海邊，他拿不出任何表現來作證。"],["p","他只能這樣說："],["q","「主啊，你是無所不知的；你知道我愛你。」（約 21:17）"],["p","他沒有拿自己的心作證。他拿主的「知道」作證。"],["p","這句話，對一個刻意不肯悔改的人，是警告。"],["p","可是對一個一直被自己定罪的人，是安慰。"],["p","321 說「用心靠聖靈」。用心，是不逃避良心的聲音。靠聖靈，是讓那位比我們的心更大的神，說最後一句話。"],["p","約翰接著說，心若不責備我們，就可以向神坦然無懼了。"],["p","像一個在家裡被愛的孩子，衝進爸爸的書房說：爸，我要……"],["p","他不必先寫一份報告。"],["p","弟兄姊妹，我們回到那張照片。"],["p","那位先生在文件上簽名的時候，那個小女孩還不會叫他爸爸。"],["p","她還有很多壞習慣，還會在半夜哭，還會因為害怕而說謊。"],["p","可是他還是簽了。他不是因為她夠好才簽的。"],["p","他簽，是因為他已經決定要愛她。"],["p","後來那個女孩長大了。有好幾年，她一直不太相信自己真的屬於這個家。"],["p","每一次做錯事，她都以為，這一次他們會把她送回去。"],["p","有一天晚上，她又闖了禍，躲在房間裡哭。"],["p","那位父親敲門進來，坐在床邊，只說了一句話："],["q","你的名字，在那份文件上。我簽過了。"],["p","弟兄姊妹，你的心也許今晚又會開始審你。"],["p","它會說：你這樣，也配叫他父親嗎？"],["p","請你記得，父已經簽過名了。不是用墨水，是用他兒子的血。"],["q","你看。"],["q","「你看父賜給我們是何等的慈愛，使我們得稱為神的兒女」（3:1）"],["p","跌倒了，中保還在。心在控告，神比你的心大。"],["p","今晚，你可以像那個五歲的孩子一樣，小小聲地叫他一聲。"],["p","不必大聲。他聽得見。"],["p","也許你很久沒有這樣叫過他了。也許你從來沒有叫過。"],["p","他一直在等。不是等你變好，是等你回家。"],["q","「我們的心若責備我們，神比我們的心大，一切事沒有不知道的。」（3:20）"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《神就是愛》"],["p","弟兄姊妹平安，今天我們讀約翰一書，第四章。"],["p","今天，我想先帶你去一個地方。"],["q","以弗所。一間不大的屋子。弟兄姊妹已經坐滿了。"],["p","大家在等一個人。"],["p","門開了。幾個年輕人抬著一張椅子，慢慢走進來。"],["p","椅子上坐著一個老人。很老很老了。"],["p","他的腿已經走不動，聲音也很小。"],["p","照教會的傳統，這個老人，就是使徒約翰。"],["p","這不是聖經的記載，是教會一代一代傳下來的故事。"],["p","第四世紀，一位叫耶柔米的教父，把它寫了下來。"],["p","相傳，晚年的約翰，每一次被抬進聚會，都只說一句話。"],["q","「小子們哪，你們要彼此相愛。」"],["p","說完，就沒有了。"],["p","下一次聚會，又是這一句。再下一次，還是這一句。"],["p","終於有人忍不住了，問他：老師，你為甚麼總是說這一句？"],["p","相傳，約翰回答：這是主的命令。只要做到這一件，就夠了。"],["p","弟兄姊妹，你知道這個老人年輕的時候，是甚麼樣子嗎？"],["p","耶穌給他和他哥哥起了一個外號。"],["q","半尼其——雷子。"],["p","馬可福音記下這個外號，意思就是打雷的兒子。"],["p","有一次，一個撒瑪利亞的村莊不接待耶穌。"],["p","約翰和雅各說：主啊，要不要我們吩咐火從天上降下來，燒滅他們？"],["p","這是一個脾氣像打雷的人。"],["p","那麼，是甚麼，把一個雷子，變成一個只會說「彼此相愛」的老人？"],["p","今天這一章，約翰自己要告訴我們答案。"],["p","這一章，是全新約「愛」字最密的一段。"],["p","從第七節到第二十一節，短短十五節，愛這個字，名詞和動詞，出現了二十七次。"],["p","好像老人一講到這件事，就停不下來。"],["p","這一章有三個字：試，先，懼。我們今天走三步。"],["q","第一步：試驗那些靈。"],["p","可是很有意思。約翰還沒有開始講愛，先講分辨。"],["q","「親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於神的不是」（4:1）"],["p","為甚麼？"],["p","因為那時候的教會，剛剛經歷一場分裂。"],["p","有一群人走出去了，還帶著一套很屬靈的說法。"],["p","他們說自己有靈感，有啟示，有更高的知識。"],["p","留下來的人，心裡發慌：他們講得那麼屬靈，會不會是我們錯了？"],["p","約翰沒有叫他們害怕，也沒有叫他們甚麼都不信。"],["p","他叫他們試驗。"],["p","「試驗」這個字，是銀匠驗銀子用的。"],["p","銀匠把銀子放進火裡，不是要燒掉它，是要認出真的銀子。"],["q","分辨，不是為了給人貼標籤，是為了認出神的聲音。"],["p","那麼，用甚麼來驗？"],["p","約翰給的標準很短，短到可以寫在手心上。"],["q","「凡靈認耶穌基督是成了肉身來的，就是出於神的」（4:2）"],["p","請你留意，他沒有說甚麼。"],["p","他沒有說，看誰的異能大。沒有說，看誰的聚會人多。"],["p","也沒有說，看誰講得最讓你感動。"],["p","他說：看他怎樣講耶穌。"],["p","那些離開的人，不是不談耶穌。他們談得很多。"],["p","可是他們的耶穌，沒有真正的身體，也沒有真正的十字架。"],["p","他們覺得，肉身太粗糙，配不上屬靈的神。"],["p","可是神的兒子，真的成了人。真的會累，會哭，會流血。"],["p","拆掉了肉身，就拆掉了十字架。"],["p","拆掉了十字架，罪人就沒有地方可去了。"],["p","所以約翰說，那是敵基督者的靈。"],["p","這句話很重。可是你聽，他講的是一種靈，一種教導。"],["p","他沒有叫讀者去猜那個人是誰。"],["p","他沒有點名任何一個人，任何一個國家，任何一個宗派。"],["p","他給的，是一個標準：耶穌基督。"],["p","今天，我們也常聽見「神告訴我」。"],["p","也許是一段短片，也許是一位熱心的朋友，說主給他一句話要給你。"],["p","不必一律拒絕，也不必照單全收。"],["p","先停一下，帶著這句話回到經文，回到耶穌。"],["q","這篇道講完，耶穌是更清楚，還是更模糊？"],["p","這是約翰教我們問的問題。"],["p","然後，約翰換了一個稱呼。"],["q","「小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。」（4:4）"],["p","那時候的教會，其實很弱。"],["p","人變少了。出去的那一群，聲勢反而比較大。"],["p","約翰也承認：世人聽從他們。"],["p","留下來的人難免想：是不是我們不夠屬靈？"],["p","約翰說：不要比你和他們。要比住在你裡面的那一位。"],["p","你聽，他用的是完成式：你們已經勝了。"],["p","這不是一句叫你更用力的口號，是一個事實的宣告。"],["p","一個怕被騙的人，看誰都可疑，心裡很累。"],["p","一個知道自己屬神的人，才能安靜地聽，安靜地試。"],["q","分辨不是出於懼怕，是出於確信。"],["p","所以，如果你今天因為信仰，覺得有一點孤單。"],["p","不必羨慕熱鬧。叫好叫座，不等於是真理。"],["p","你屬神。那更大的一位，住在你裡面。"],["q","第二步：乃是神愛我們。"],["p","約翰講完分辨，口氣忽然變了。"],["q","「親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的。」（4:7）"],["p","你聽見了嗎？這幾乎就是那一句：小子們哪，你們要彼此相愛。"],["p","可是約翰接著說的，是愛從哪裡來。"],["p","不是從個性來。不是從原生家庭來。也不是從努力來。"],["q","愛是從神來的。"],["p","這對很多人，是好消息。"],["p","有人說：我天生不會愛。我家裡從來沒有人抱過我，沒有人跟我說過一句「我愛你」。"],["p","約翰說：愛的源頭，本來就不在你家，在神那裡。"],["p","然後，他說了一句很短的話。"],["q","「神就是愛」（4:8）"],["p","這不是一句甜甜的標語。"],["p","這位愛的神，約翰在第一章說過，也是光。"],["p","他的愛有聖潔，有真理。"],["p","所以世上有些打著愛的名號的東西，像放縱，像操控，都不是從他來的。"],["p","可是神的愛長甚麼樣子？約翰不讓這句話飄在空中。"],["q","「神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了。」（4:9）"],["p","愛有一個日期，一個地點，一個名字。"],["p","看伯利恆，看各各他。"],["p","然後，約翰寫下了整卷書的樞紐。"],["p","弟兄姊妹，如果今天你只帶走一節經文，請帶走這一節。"],["q","「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。」（4:10）"],["p","請你注意前半句：不是我們愛神。"],["p","我們常常以為，信仰是這樣的："],["p","我先愛神，先表現好，先讀經禱告，先不再犯錯。"],["p","然後，神才會接納我。"],["p","約翰說：反了。"],["p","愛的起點，不在我們。"],["p","在我們還沒有愛他的時候，他已經出手了。"],["q","「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。」（羅 5:8）"],["p","所以，這卷書裡所有的命令——要行在光中，要遵守誡命，要彼此相愛——"],["p","都不是門檻，是回應。"],["q","命令不是門檻，是回應。"],["p","不是做到了，才被愛。是被愛了，所以開始學。"],["p","再看後半句：差他的兒子，作了挽回祭。"],["p","誰差的？是父。誰預備的？是神自己。"],["p","十字架不是兒子去說服一位不情願的父親。"],["p","是那位愛我們的神，自己預備了祭，自己擔下了代價。"],["p","在這一節裡，連「愛」這個字的主詞，都先是他。"],["p","弟兄姊妹，你有沒有覺得，自己愛神愛得很少，很冷？"],["p","先別急著加倍努力。"],["p","抬頭，看四章十節。"],["p","愛的定義，不是你給了神多少，是他給了你甚麼。"],["p","接著，約翰說了一句出人意料的話。"],["q","「親愛的弟兄啊，神既是這樣愛我們，我們也當彼此相愛。」（4:11）"],["p","照一般人的想法，應該寫成：神既這樣愛我們，我們也當愛神。"],["p","約翰卻寫：彼此相愛。"],["p","神的愛，不是一個繞回原點的圈。是一條往外流的河。"],["q","「從來沒有人見過神，我們若彼此相愛，神就住在我們裡面」（4:12）"],["p","約翰在福音書說過，從來沒有人看見神，只有獨生子將他表明出來。"],["p","從前，看不見的神，在耶穌身上被看見。"],["p","現在，在彼此相愛的人中間被看見。"],["p","一個鄰居，也許從來不讀聖經。"],["p","可是他住院的時候，看見一群人輪流送飯。"],["p","他失業的時候，看見一個小組默默幫他分擔房租。"],["p","他就在那裡，看見了神的影子。"],["q","教會不只是講神的愛。教會是讓神的愛被看見的地方。"],["p","321 在這裡認出「建立屬神的體系」的起點。"],["p","不是先蓋一套組織，是先有一群被愛，也彼此相愛的人。"],["p","然後約翰說："],["q","「神愛我們的心，我們也知道也信。」（4:16）"],["p","知道，也信。"],["p","有些人頭腦知道神愛世人，心裡卻不敢相信神愛自己。"],["p","約翰要我們兩樣都有。"],["q","「住在愛裡面的，就是住在神裡面，神也住在他裡面。」（4:16）"],["p","「住」這個字，是這卷書的心跳。"],["p","住下來，就是不再流浪。不必每天重新證明，自己有資格留下。"],["p","你可以把行李放下了。"],["q","第三步：神先愛我們。"],["p","約翰接著講到一個日子。"],["q","「這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼。」（4:17）"],["p","他沒有說沒有審判。他說，有一天，人要站在神面前。"],["p","可是被愛的人，可以坦然站在那裡。"],["p","不是因為自己無可指摘，是因為我們在基督裡面。"],["p","然後，是很多人背得出，卻也常常被用錯的一節。"],["q","「愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰」（4:18）"],["p","這裡的懼怕，是甚麼懼怕？"],["p","約翰自己解釋了：懼怕裡含著刑罰。"],["p","那是對審判的懼怕。"],["p","怕神終究會算總帳。怕自己到最後，會被丟出去。"],["p","有人信主很多年，心裡還藏著這份怕。"],["p","好像神隨時會翻臉。好像每一次跌倒，都把自己往門外推了一步。"],["p","約翰的答案，不是你要更努力地愛，才不會怕。"],["p","答案是神的愛。"],["p","四章十節已經說了，挽回祭是神自己預備的。"],["p","審判的刑罰，已經落在他兒子身上。"],["p","「除去」這個字，原文是「丟到外面」。"],["p","像一個父親，半夜走進孩子的房間，把惡夢趕出門外。"],["q","不是你把懼怕趕走。是他的愛，把懼怕丟出去。"],["p","可是弟兄姊妹，我要在這裡停一下，說清楚一件事。"],["p","這一節，不是拿來責備受苦的人的。"],["p","有些弟兄姊妹有焦慮症，有恐慌，夜裡睡不著。"],["p","有些人曾經受過傷，身體到今天還記得那份驚嚇。"],["p","這不是他們的愛不完全。"],["p","他們需要的，是陪伴，是醫療，是專業的輔導。"],["p","不需要一句「你的愛不完全」。"],["p","禱告很寶貴，可是禱告不取代醫生，也不取代輔導。"],["p","神也常常藉著醫生和輔導，來照顧他的孩子。"],["p","約翰在這裡處理的，是另一種怕：怕神不要我。"],["p","如果你心裡有這種怕，今天把四章十節和十八節放在一起讀。"],["p","你的平安，不是建立在你愛得多好。"],["p","是建立在他，先為你預備了挽回祭。"],["p","然後，約翰寫下全卷最短，也最重的一節。"],["q","「我們愛，因為神先愛我們。」（4:19）"],["p","原文只有七個字。"],["p","請你留意，原文沒有說，我們愛誰。"],["p","不只是我們愛神，也不只是我們愛人。"],["p","是說：我們之所以會愛，是因為有一位先愛了我們。"],["q","愛不是我們的發明，是我們的回應。"],["p","你有沒有看過，一個嬰孩怎樣學會笑？"],["p","沒有人教他笑的技巧。"],["p","是爸爸媽媽，一次又一次，對著他笑。"],["p","有一天，他就笑回來了。"],["p","我們的愛也是這樣。是被愛到一個地步，才笑回去的。"],["p","很多人的信仰活得很累，是因為把順序弄反了。"],["p","以為要先愛得夠多，才可以確定神愛自己。"],["p","於是每天檢查自己的愛，夠不夠熱。越檢查，越冷。"],["p","約翰把順序擺回來：他先。"],["q","不是盯著自己的愛有多少，是定睛在那位先愛我們的主。"],["p","321 說「焦點在耶穌」，在這一節看得最清楚。"],["p","焦點一轉，愛就開始流動。"],["p","然後，約翰把愛帶回到看得見的地方。"],["q","「人若說『我愛神』，卻恨他的弟兄，就是說謊話的」（4:20）"],["p","又是「人若說」。第一章出現了三次，主詞都是「我們」。"],["p","約翰先把自己放進去。這不是一把審查別人的尺，是一面先照自己的鏡子。"],["p","神看不見，弟兄看得見。"],["p","說愛一位看不見的神，很容易，沒有人能檢查。"],["p","愛一個每週坐在你旁邊、會說錯話、會讓你失望的人，才知道愛是真的。"],["p","可是這一節，也常常被用錯。"],["p","有人在家裡，在教會，受了很深的傷。"],["p","卻聽見有人引這一節說：你不肯回去，就是不愛神。"],["p","這不是約翰的意思。"],["p","約翰說，愛要在行為和誠實上。"],["q","「小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。」（3:18）"],["p","誠實的愛，承認傷害是真實的。"],["p","誠實的愛，也不假裝一個危險的人已經安全。"],["p","原諒，可以交給神。和好，卻需要對方真實的悔改，也需要安全。"],["p","為了保護自己和孩子保持距離，設下界線，不等於恨。"],["p","如果你正遭遇家暴、性侵或虐待，請向可信的人和相關機構求助。涉及犯罪的，請報警。"],["p","受傷的人，也許暫時沒有力氣靠近。"],["p","可是你仍可以在神面前，把那個人交給公義的審判者。"],["p","求神保守你的心，不被苦毒吞吃。"],["q","這樣的禱告，本身已經是愛的開始。"],["p","讓神作審判者，讓自己作被愛的人。"],["p","從那個位置，我們才有力氣，按著誠實與界線，去愛那看得見的弟兄。"],["p","弟兄姊妹，我們再回到以弗所那間屋子。"],["p","那個被抬進來的老人，又說了那一句話：小子們哪，你們要彼此相愛。"],["p","現在，我們比較明白了。"],["p","那不是一個嚴厲的老師，一再拿同一條規矩來壓人。"],["p","那是一個被愛透了的人。"],["p","你知道約翰在他的福音書裡，怎麼稱呼自己嗎？"],["p","他從來不寫自己的名字。他說，我是「耶穌所愛的」那個門徒。"],["q","「有一個門徒，是耶穌所愛的，側身挨近耶穌的懷裡。」（約 13:23）"],["p","雷子沒有被規矩改變。雷子是被愛改變的。"],["p","他在主的懷裡，聽過那個心跳。"],["p","所以到了老年，他只剩下一句話要說。"],["q","他不是在說：你們要更努力。他是在說：你們已經被愛了。"],["p","弟兄姊妹，也許今天，你很難愛一個人。"],["p","也許你心裡有一份怕，怕神有一天不要你。"],["p","也許你已經很累，愛不出來了。"],["p","請你今天，不要先逼自己。"],["p","先停下來，讓他愛你。"],["p","在禱告裡，安靜坐一會兒，讓那一句話落進心裡：不是我們愛神，乃是神愛我們。"],["p","然後，愛就會從那裡，慢慢流出來。"],["p","流向你家裡的那一個人，流向小組裡那一個難愛的人。"],["p","用行為，用誠實。"],["q","「我們愛，因為神先愛我們。」（4:19）"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《使我們勝了世界的，就是我們的信心》"],["p","弟兄姊妹平安，今天我們讀約翰一書，第五章。這是這封信的最後一章。"],["p","今天，我想請你先看一樣東西。"],["p","它很大。大到你站在它前面，要把頭仰起來，才看得到頂。"],["q","以弗所城裡，亞底米女神的大廟。"],["p","照古人的記載，這座廟有一百二十多根大理石柱子，每一根都比好幾層樓還高。"],["p","它被列為古代世界七大奇觀之一。從地中海來的船，遠遠就能看見它在陽光下發亮。"],["p","城裡的人以它為榮。城裡的經濟，也繞著它轉。"],["p","使徒行傳第十九章記著，有一個銀匠，名叫底米丟，專門做亞底米的銀龕。"],["p","保羅在以弗所傳道，說了一句話。"],["q","「人手所做的，不是神。」（徒 19:26）"],["p","這句話，碰到了銀匠的飯碗。"],["p","底米丟一喊，滿城的人湧進戲園。"],["q","「大哉！以弗所人的亞底米啊。」（徒 19:34）"],["p","經文說，這樣喊了約有兩小時。"],["p","照教會的傳統，使徒約翰晚年，就住在這座城裡。"],["p","他的讀者，每天出門，都要走過這座廟的影子。"],["p","現在，請你把目光從這座廟，移到一張小小的羊皮紙上。"],["p","這是一封信。一封講了五章「愛」的信。"],["p","光、相交、認罪、兒女、彼此相愛。一章一章，講得很溫柔。"],["p","信的最後一句，是甚麼？"],["p","沒有問安，沒有祝福，沒有阿們。只有這一句。"],["q","「小子們哪，你們要自守，遠避偶像！」（5:21）"],["p","弟兄姊妹，這一句放在最後，不是突然想起來的。"],["p","一邊是一座看得見、摸得著、滿城都在拜的大廟。"],["p","一邊是一位看不見的神，和一群人數不多的信徒。"],["p","你說，誰會贏？"],["p","這一章，約翰要回答這個問題。"],["p","這一章有三個字：勝，證，知。我們今天走三步。"],["q","第一步：勝過世界。"],["p","約翰一開口，把全卷的三條線，打成一個結。"],["q","「凡信耶穌是基督的，都是從神而生，凡愛生他之神的，也必愛從神生的。」（5:1）"],["p","信，從神生，愛。前面四章，這三樣輪流出現。到這裡，一句話收在一起。"],["p","你愛一位朋友，不一定會愛他的兄弟。"],["p","可是在神的家裡，愛父親的人，會愛父親的孩子。"],["p","因為在他們身上，看得見同一位父親的樣子。"],["p","接著，約翰說了一句，很多人讀了心裡會不服氣的話。"],["q","「我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的。」（5:3）"],["p","不是難守的？"],["p","也許你心裡有一個小小的聲音：可是我覺得很難。"],["p","這個聲音，你不必壓下去。約翰也沒有說容易。"],["p","「難守」這個字，原文是沉重，壓垮人。"],["p","同一個背包，給五歲的孩子背，是重擔。給他父親背，就不算甚麼。"],["p","背包沒有變輕，是背的人不一樣了。"],["p","所以下一節，一開頭就是「因為」。"],["q","「因為凡從神生的，就勝過世界；使我們勝了世界的，就是我們的信心。」（5:4）"],["p","這是今天的章題。我們慢慢看，問三個問題。"],["q","誰勝？勝甚麼？怎樣勝？"],["p","先問：誰勝？"],["p","經文說：凡從神生的。"],["p","不是最能幹的人，不是最屬靈的人，是從神生的人。"],["p","得勝，不是一種等級。是一種出身。"],["p","約翰怕我們聽不清楚，下一節又問了一次。"],["q","「勝過世界的是誰呢？不是那信耶穌是神兒子的嗎？」（5:5）"],["p","答案不是一張成績單，是一句信仰告白。"],["p","再問：勝甚麼？"],["p","世界。可是約翰說的世界，是甚麼？"],["p","他在第二章，早就替世界下了定義。"],["q","「肉體的情慾、眼目的情慾，並今生的驕傲」（2:16）"],["p","所以得勝，不是打敗別人。"],["p","不是在辯論裡贏，不是在職場上贏，不是在選舉裡贏。"],["p","也不是討厭神所造的世界，躲到山上去。"],["p","神愛這個世界。他差他的兒子，作世人的救主。"],["p","得勝，是不再被這三樣牽著鼻子走。"],["p","一個人今天晚上，放下手機裡沒完沒了的比較，安靜下來，向神說幾句話。"],["q","那就是一次勝過世界。"],["p","最後問：怎樣勝？"],["p","經文說：信。"],["p","請你留意，「使我們勝了世界的」，原文是過去式，是一次已經發生的得勝。"],["p","是誰勝的？主在最後的晚餐說了。"],["q","「在世上，你們有苦難；但你們可以放心，我已經勝了世界。」（約 16:33）"],["p","勝利已經在十字架上得著了。"],["p","信，是把我們的手，放進那隻得勝的手裡。"],["p","回到那座大廟。"],["p","在以弗所，看起來，亞底米贏定了。柱子那麼高，人那麼多，錢那麼多。"],["p","可是約翰說：勝過世界的，是那些信耶穌是神兒子的小子們。"],["p","弟兄姊妹，我也要很清楚地說一句。"],["p","得勝者，不是不跌倒的人。"],["p","我們的群體很喜歡「得勝者」這個詞。可是這一節不是一句口號。"],["p","經文的主詞，是從神生的人。經文的方法，是信。"],["p","有人以為得勝的人，從來不軟弱，從來不失敗。"],["p","這不是約翰說的。"],["p","得勝者，是跌倒了，仍然信。是軟弱了，仍然回到他那裡的人。"],["q","不是我們抓住了勝利，是那位得勝的抓住了我們。"],["p","那麼，我們信的這一位，憑甚麼可信？"],["q","第二步：有子就有生命。"],["p","接下來這幾節，是全卷最難懂的句子之一。"],["q","「這藉著水和血而來的，就是耶穌基督；不是單用水，乃是用水又用血，」（5:6）"],["p","甚麼是水？甚麼是血？"],["p","照教會的傳統，當時有一種說法很流行。"],["p","他們願意接受一位受洗的基督：天開了，聖靈降下，有聲音從天上來。很屬靈，很美。"],["p","可是他們不能接受，神的兒子會流血，會死。"],["p","於是他們說：基督在受洗的時候降在耶穌身上，到十字架以前就離開了。死的，只是一個人。"],["p","約翰用一句話，把這扇門關上。"],["q","不是單用水，乃是用水又用血。"],["p","為甚麼要這樣堅持？"],["p","因為能洗淨我們的，不是一個榜樣。是一場犧牲。"],["q","「他兒子耶穌的血也洗淨我們一切的罪。」（1:7）"],["p","今天，這種想法換了一件衣服回來。"],["p","很多人喜歡一個有智慧的耶穌。好老師，好榜樣，說過很多美好的話。"],["p","可是一講到血，講到罪，講到十字架，就覺得太重了，太不現代了。"],["p","約翰會溫柔地，可是很堅定地說："],["q","只有水的耶穌，救不了你。"],["p","接著，約翰把我們帶進一個法庭。"],["p","被審的問題是：耶穌，是不是神的兒子？"],["q","「作見證的原來有三：就是聖靈、水，與血，這三樣也都歸於一。」（5:8）"],["p","第一位證人是水。耶穌受洗那一天，天上有聲音說：這是我的愛子。"],["p","第二位證人是血。十字架上，他真實地死了。"],["p","第三位證人是聖靈。他不只在過去作證，今天還在作證。"],["p","三個證人，說的是同一件事。"],["p","在法庭上，最可信的，不是一個證人說得很大聲。是幾個證人，說出同一個結論。"],["p","順便說一句。有些舊的譯本，在這裡多了一段，講天上作見證的有父、道、聖靈。"],["p","和合本沒有收，因為最早的原文抄本裡沒有這一段。用那些譯本長大的弟兄姊妹，不必因此不安。三位一體的真理，本來就不需要倚靠這一句，整本聖經處處都是。"],["p","我們回到法庭。約翰說："],["q","「我們既領受人的見證，神的見證更該領受了」（5:9）"],["p","我們每天都靠別人的見證過日子。"],["p","醫生說檢查沒事，我們就放心回家。"],["p","你沒有親眼看過自己出生，可是你相信父母告訴你的生日。"],["p","人的見證，我們天天領受。神的見證，更大。"],["p","因為他從來不說錯，也從來不說謊。"],["p","然後約翰說了一句很重的話。不信的，就是將神當作說謊的。"],["p","請你聽清楚，這句話是對著那些聽過、看過，卻刻意轉身拒絕的人說的。"],["p","不是對著一個半夜流淚、心裡還有疑問的弟兄姊妹說的。"],["p","福音書裡有一位父親，帶著生病的孩子來見耶穌。他喊著說："],["q","「我信！但我信不足，求主幫助。」（可 9:24）"],["p","主沒有把他趕走。主醫好了他的孩子。"],["p","如果你今天心裡有疑問，不要躲起來，也不要假裝。"],["p","把疑問帶到神面前。懷疑可以是一條走廊，只要你繼續往那位作見證的神走去。"],["p","那麼，神的見證，到底說了甚麼？"],["q","「這見證就是神賜給我們永生；這永生也是在他兒子裡面。」（5:11）"],["p","永生，不是一包放在倉庫裡的貨物。可以領走，帶回家，自己保管。"],["p","永生有一個地址：在他兒子裡面。"],["q","「人有了神的兒子就有生命，沒有神的兒子就沒有生命。」（5:12）"],["p","這一節，短得像一句格言。可是它是全章的心臟。"],["p","像一場婚禮。"],["p","新娘不是先拿到房子、姓氏、存款，再去認識新郎。"],["p","她是得著了這個人。他的一切，就成了她的。"],["p","有了兒子，就有生命。"],["p","不是有了兒子，再加上甚麼。也不是有了很多屬靈經歷，就等於有了兒子。"],["p","這句話，對兩種人都是好消息。"],["p","對驕傲的人，它拆掉了一切自己加上去的條件。"],["p","對自卑的人，它給了一個不會搖動的根基。你不必證明自己夠格，你只要有他。"],["q","焦點不在我抓得多緊，在他是誰。"],["p","可是有人會問：那我怎麼知道，我真的有他？"],["p","約翰說，這正是我寫這封信的原因。"],["q","第三步：我們知道。"],["p","現在，約翰把整封信的鑰匙，交到我們手上。"],["q","「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。」（5:13）"],["p","寫了五章，到這裡，約翰才告訴我們：他為甚麼寫。"],["p","他不是寫給還沒有信的人。是寫給已經信的人。"],["p","約翰在他的福音書最後，也寫過一句寫作目的。"],["q","「但記這些事要叫你們信耶穌是基督，是神的兒子」（約 20:31）"],["p","福音書，叫人信。這封信，叫信的人知道。"],["p","他的讀者剛剛經歷了教會的分裂。有一些很會說話的人出去了，說只有他們才有真知識。"],["p","留下來的人，心裡不安。我們是不是錯了？我們真的有永生嗎？"],["p","約翰寫信，不是要他們更懷疑。是要他們知道。"],["p","這改變了我們讀整封信的方式。"],["p","前面那些「人若說」，那些「從此就知道」，不是一道一道審查的關卡。"],["p","是一盞一盞的路燈。"],["p","不是給你拿去量別人的。是給你看見：神已經在你裡面工作了。"],["p","有許多弟兄姊妹，信主很多年，仍然不敢說自己有永生。好像說了，就是驕傲。"],["p","約翰卻說：知道，是神要你有的。"],["p","確據的根據，不是你今天表現多好。是神為他兒子作的見證。"],["p","你倚靠的若是他，知道就不是驕傲。是安息。"],["p","知道自己有永生的人，最自然的一件事，就是開口禱告。"],["q","「我們若照他的旨意求甚麼，他就聽我們，這是我們向他所存坦然無懼的心。」（5:14）"],["p","坦然無懼，是孩子對父親說話的樣子。不必先排練，也不必怕被趕出門。"],["p","可是這一節，有一個不能省略的條件。"],["q","照他的旨意。"],["p","有人說，只要你信心夠大，你要甚麼，神都會給你。"],["p","這不是約翰說的。"],["p","照他的旨意，不是一把鎖，要你猜中密碼。是一條路，讓我們的心，跟上他的心。"],["p","這使我們想起客西馬尼園。"],["p","神的兒子俯伏在地。他說："],["q","「我父啊，倘若可行，求你叫這杯離開我。然而，不要照我的意思，只要照你的意思。」（太 26:39）"],["p","那杯，沒有離開他。"],["p","不是因為他信心不夠。是因為父有更大的旨意。"],["p","所以，如果你曾經為一位病重的家人迫切禱告，結果卻不是你所求的。"],["p","請你不要相信那一句「你的信心不夠」。"],["p","神聽見了。他沒有照你的意思成就，不表示他沒有聽，也不表示你不夠好。"],["p","經文說，所求的「無不得著」。"],["p","有時候，是你求的那一樣。有時候，是比它更深的恩典。"],["p","例如，在最痛的那一夜，他沒有離開你。"],["p","接著，約翰給了一個合神旨意的禱告的例子。"],["q","「人若看見弟兄犯了不至於死的罪，就當為他祈求，神必將生命賜給他」（5:16）"],["p","請你留意那個詞：看見。"],["p","看見一位弟兄跌倒，第一個反應是甚麼？"],["p","約翰沒有說去議論，也沒有說去分析他屬靈不屬靈。他說："],["q","就當為他祈求。"],["p","然後約翰提到另一種罪，至於死的罪。他只用一句話帶過，而且他沒有說那是甚麼。"],["p","約翰沒有說，講台也不說。"],["p","我們不知道誰的心在神面前到底怎樣。所以沒有人有權柄，指著另一個人說他的罪是那一種。"],["p","更不可以對一位已經過世的親人，這樣說。"],["p","也許有人聽到這裡，心裡一緊：我會不會就是那一個？"],["p","如果你會這樣擔心，你的擔心本身就說明了一件事。"],["q","你的心，仍然向著神。"],["p","真正轉身離開神的人，不會為這件事失眠。"],["p","請把這份害怕，帶到十字架前。"],["q","「到我這裡來的，我總不丟棄他。」（約 6:37）"],["p","信的最後一段，約翰連說了三次：我們知道。"],["p","第一次，從神生的，必不犯罪。"],["p","這不是說基督徒不會跌倒。約翰在第二章說過了，若有人犯罪，在父那裡我們有一位中保。"],["p","這裡說的是方向。從神生的人，不再以罪為家。跌倒了，他知道往哪裡回。"],["p","而且有一位，在保守他。那惡者，碰不著他。"],["p","第二次，我們是屬神的，全世界都臥在那惡者手下。"],["p","我們不是比世人高一等的人。我們是被叫醒的人。"],["p","被叫醒的人，不去嘲笑還在睡的人。是輕輕地，把他們叫醒。"],["p","第三次，是整封信的頂點。"],["q","「我們也知道，神的兒子已經來到，且將智慧賜給我們，使我們認識那位真實的」（5:20）"],["p","「已經來到」，原文是：他來了，而且還在這裡。"],["p","然後約翰說：我們也在那位真實的裡面。"],["p","不是在門外排隊。是已經在家裡了。"],["q","「這是真神，也是永生。」（5:20）"],["p","弟兄姊妹，就在這一句後面，約翰寫下最後一句：遠避偶像。"],["p","現在你明白了。"],["p","偶像，就是一切不是真神，卻坐上神位子的東西。"],["p","在以弗所，它有柱子，有祭司，有銀匠的生意。"],["p","在今天，它常常沒有形狀。"],["p","一個職位，一筆存款，孩子的成績，別人的肯定。甚至是我們的服事，和我們的名聲。"],["p","這不是說，工作、家庭、文化、藝術都是偶像。神所造的，本來都是好的。"],["p","問題不在那樣東西。在它坐在哪裡。"],["p","當它坐上只有神能坐的位子，當你沒有它就活不下去，它就成了偶像。"],["p","偶像最深的一層，常常是那一個，想要自己作主的我。"],["p","「自守」，不是咬緊牙關。是常常回到那位真實的面前。"],["p","讓他坐回中心，其他的東西，就各回本位。"],["p","現在，我們最後再看一次那座大廟。"],["p","你今天去以弗所，那座廟已經不在了。"],["p","那一百多根柱子，倒了，被拆了，被搬走了。"],["p","今天，在一片低窪的濕地上，只剩下一根柱子，是後人撿起殘石，重新疊起來的。"],["p","柱頂上，常常有鸛鳥築巢。"],["q","滿城喊了兩小時的女神，今天只剩下一根柱子，和一個鳥巢。"],["p","可是那封小小的信，還在。"],["p","兩千年了，一代一代的小子們，還在讀它。"],["q","這是真神，也是永生。"],["p","弟兄姊妹，也許你心裡也有一座廟。很高，很亮，你每天都要走過它的影子。"],["p","也許你覺得自己很軟弱，勝不了。"],["p","也許你信主很久了，卻從來不敢說：我知道我有永生。"],["p","今天，請你聽約翰最後的話。"],["p","勝過世界的，不是你的力氣，是你所信的那一位。"],["p","你有了他，就有生命。"],["p","這封信，就是寫給你的。要叫你知道。"],["q","「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。」（5:13）"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者、年代與處境：誰寫的？在甚麼光景中寫的？","r":"1:1--4；2:19；4:1--3","ch":[],"why":"一、作者是使徒約翰，這封信寫在教會分裂之後，寫給留下來卻被動搖的人——本講義的全卷立場之一（作者沿用約翰福音講義；本卷補「分裂之後」的處境）。這封信沒有署名，卻一開口就是「我們所聽見、所看見、親眼看過、親手摸過的」（1:1）。作者是誰，決定 1:1 的「摸過」是見證還是修辭；處境是甚麼，決定這封信讀起來是安慰還是審查。約翰一書最容易被讀成一張檢查表：你有沒有愛、有沒有犯罪、有沒有信對。可是它原本是寫給一群剛經歷分裂、被人說「你們不夠屬靈」而動搖的弟兄姊妹。處境讀錯了，一封叫人「知道自己有永生」（5:13）的信，會被講成叫人懷疑自己的信。","pos":[["【一】經文問的是甚麼","","<p>約翰一書是新約裡少數沒有寫信人名字、沒有收信人、沒有問安的書卷。它一開口就是見證：「論到從起初原有的生命之道，就是我們所聽見、所看見、親眼看過、親手摸過的」（1:1）。到了第二章，處境才露出來：「他們從我們中間出去，卻不是屬我們的」（2:19）；第四章又說：「世上有許多假先知已經出來了」（4:1）。所以這一題其實是兩個問題：<strong>這個說「我們摸過」的人是誰？他寫信的時候，教會發生了甚麼事？</strong></p><p>經文自己給了幾條線索。①寫的人自稱是親眼見證的人，而且用「我們」說話（1:1--3）。②他稱讀者為「小子們」（2:1、12、28），口吻是一位年長的牧者。③信裡的用字與約翰福音極近：起初、生命、光、真理、住、見證、新命令——1:1 的「從起初」幾乎是約 1:1 的回聲。④有一批人已經離開了，而且他們的教訓牽涉到耶穌是誰（2:22；4:2--3）。</p>"],["使徒約翰說：作者是西庇太的兒子、耶穌所愛的那門徒","","<p>這是教會從第二世紀以來的主流說法，也是約翰福音講義的立場。愛任紐記載，主的門徒約翰晚年住在以弗所；照教會的傳統，他活到很老。支持的理由有三：1:1--3 的「親眼看過、親手摸過」最自然的讀法是親身見證；用字與思路和約翰福音一脈相承，而約翰福音說作見證的就是那位門徒：「為這些事作見證，並且記載這些事的就是這門徒」（約 21:24）；坡旅甲寫給腓立比教會的信很早就有與 4:2--3 相近的話，表示這封信很早就在眾教會流傳、被接受。</p><p><strong>難處：</strong>信裡沒有署名，「使徒」兩個字也沒有出現；早期教父的記載多半晚了幾十年，而且彼此引用，未必是各自獨立的證據。若把作者身分講得像信條一樣，會讓人以為信心要靠歷史考證撐住。</p>"],["長老約翰說：作者是帕皮亞提到的另一位約翰","","<p>第四世紀的優西比烏引用帕皮亞的話：帕皮亞列舉了幾位主的門徒之後，又提到一位「長老約翰」。優西比烏據此認為以弗所有兩位約翰，並把部分約翰著作歸給這位長老。約貳、約參的作者正自稱「作長老的」（約貳 1:1；約參 1:1），使這一說更有吸引力。它也提醒我們：初代教會的見證人不只十二位。</p><p><strong>難處：</strong>帕皮亞的原文只存在優西比烏的轉引裡，那句話可以讀成兩個人，也可以讀成同一個人換了稱呼；彼得也自稱長老（彼前 5:1），使徒自稱長老並不奇怪。而且即使作者是長老約翰，他仍在 1:1 宣稱自己是親眼見證的人，這封信的見證性質不因此減少。</p>"],["約翰群體說：作品出自以「愛徒」為源頭的群體傳承","","<p>二十世紀不少學者（例如布朗）主張，約翰福音與約翰書信出自一個以「耶穌所愛的那門徒」為源頭的群體：福音書先寫成，後來群體裡有人把福音書讀歪了，只講屬靈、輕看耶穌的肉身，於是分裂；約翰一書是群體中的長者寫來回應的。這一說的優點是把 2:19 的分裂放到前台，讓我們看見這封信是在傷口上寫的；1:1 的「我們」也可以讀成這個見證群體的聲音。</p><p><strong>難處：</strong>群體的重建大多是從經文反推出來的，細節越多越像小說；也容易讓「群體」取代具體的見證人，把 1:1 的「親手摸過」稀釋成群體的記憶。經文裡的「我們」與「你們」分得很清楚：「使你們與我們相交」（1:3）——寫的人站在見證者那一邊，不只是群體的代言人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒約翰——沿用約翰福音講義；長老約翰說與約翰群體說公平並陳，都不動搖經文的權威。本卷要補的是處境：這是一封「分裂之後」的信，寫給留下來、卻被動搖的人。</strong></p><p>「他們從我們中間出去」（2:19）——離開的人可能不少，也不是默默走的；他們有一套說法，聽起來更屬靈、更高深，讓留下的人開始懷疑：我們是不是錯了？我們真的認識神嗎？約翰的回答不是去罵出去的人，而是一次又一次對留下的人說「我們知道」，最後收在「要叫你們知道自己有永生」（5:13）。所以讀約翰一書，要讀出一位年老牧者的聲音：他不是在設關卡，是在扶起站不穩的羊。2:19 是給留下的人的安慰，不是用來論斷離開的人；人離開教會有許多原因，包括在教會裡受了傷。</p><p>至於約翰住在以弗所、活到晚年、被人抬進聚會只說「小子們哪，你們要彼此相愛」，都是照教會的傳統；講台可以用，但要說「相傳」，不講成確定的史實。年代與地點見 〈寫作年代與地點：約翰一書寫於何時何地？〉，三封書信的關係見 〈約翰一、二、三書是甚麼關係？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。作者是使徒約翰、長老約翰，還是群體中的長者，學者辯了兩百年，這封信照樣在每一個世代扶起了人。你不需要先解決作者問題，才能相信「神就是光」（1:5）、「神就是愛」（4:8）。</p><p>但處境這件事，值得放進你的信心裡。如果你曾經看著同伴一個一個離開，聽過「你們那裡不夠屬靈」「真理在我們這邊」，心裡開始搖晃——約翰一書正是寫給你的。約翰沒有叫你去追那些更高深的說法，他叫你回到「從起初所聽見的」（2:24），回到那位可以被看見、被摸著的耶穌。信心的根不在你多會辯論，而在你所信的那一位，曾經真的來過。</p>"]],"con":[],"say":"本講義的立場：作者是使徒約翰（沿用約翰福音講義），長老約翰說、約翰群體說並陳；本卷補「分裂之後」的處境——這封信寫給留下來卻被動搖的人，2:19 是安慰，不是論斷。以弗所、晚年等記載照教會的傳統，講台說「相傳」。","care":"席上可能有人剛經歷教會分裂，朋友一個一個走了，自己留下來卻很孤單；也可能有人自己離開過，帶著傷又回來。不要用 2:19 說走的人都不屬神，也不要把作者考據講成信心的門檻，讓不熟歷史的長輩覺得自己「信得不夠學術」。讓被動搖的人聽見：約翰寫這封信，是為了讓你知道，不是為了讓你害怕。對帶著傷回來的人，先說歡迎，不追問。"},{"id":"ISS00_2","t":"罪與確據：「若說自己無罪」與「從神生的就不犯罪」怎樣同時成立？","r":"1:8--10；2:1--2；3:6--9；5:16--18","ch":[],"why":"二、從神生的人方向是不犯罪，跌倒時有中保——本講義的全卷立場之二（本卷新立）。約翰一書同時說「我們若說自己無罪，便是自欺」（1:8），又說「凡從神生的，就不犯罪」（3:9）。這兩句若各講各的，會傷兩種人：敏感的良心讀到 3:9，以為自己一再跌倒，大概從來沒有被神生過，夜裡睡不著；刻意活在罪中的人讀到 1:8，說「反正人人都有罪」，替自己開脫。約翰把兩句放在同一封信裡，中間放了 2:1。這一題要在開卷講定，各章碰到罪與確據都回指這裡。","pos":[["【一】經文問的是甚麼","","<p>約翰一書裡有兩組看起來打架的話。第一組：「我們若說自己無罪，便是自欺，真理不在我們心裡了」（1:8）；「我們若說自己沒有犯過罪，便是以神為說謊的」（1:10）。第二組：「凡住在他裡面的，就不犯罪」（3:6）；「凡從神生的，就不犯罪……他也不能犯罪，因為他是由神生的」（3:9）；到了信末又說：「我們知道凡從神生的，必不犯罪」（5:18）。</p><p>同一位作者，同一封信，他不可能不知道自己前後說了甚麼。所以問題不是「約翰矛盾了沒有」，而是：<strong>他說「不犯罪」指的是甚麼？一個真實的、還會跌倒的信徒，要怎樣同時聽這兩組話，而不是只聽其中一組？</strong>而在兩組話中間，約翰放了一節樞紐：「我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（2:1）。</p>"],["現在式持續說：3:6、9 的「犯罪」是現在式，指持續、習慣性地活在罪中","","<p>這是英語福音派最常見的讀法，不少英譯本把 3:9 譯成「不繼續犯罪」。3:6、9 用的是現在式 ἁμαρτάνει、ἁμαρτίαν οὐ ποιεῖ、οὐ δύναται ἁμαρτάνειν，希臘文的現在式常表示持續的動作；而 2:1 的「叫你們不犯罪」「若有人犯罪」用的是不定過去式，指一次一次的行為。所以從神生的人仍會跌倒（2:1），卻不會以罪為生活的常態（3:9）。這一讀簡單、好講，也保護了 1:8。</p><p><strong>難處：</strong>希臘文法學者提醒，現在式本身不一定帶「習慣」的意思；約翰自己在 5:16 說「人若看見弟兄犯了不至於死的罪」（5:16），「犯了」用的也是現在式分詞 ἁμαρτάνοντα，指的是一位弟兄——單靠時態撐不起整個區分。更實際的難處是：甚麼叫習慣性？一個與同一個罪纏鬥了十年的弟兄，算不算「持續犯罪」？這一讀若講得粗，會把掙扎中的人推進另一種焦慮。</p>"],["兩種罪說：3:9 的罪指某一類罪，不是一切的罪","","<p>有些解經家把 3:4「違背律法就是罪」的 ἀνομία 讀成末世的「不法」——那種與敵基督站在一起、根本拒絕神的反叛；也有人把它連到 5:16--17 所分別的兩類罪。照這一讀，從神生的人不會犯那種根本性的叛逆，但仍會犯一般的罪，需要 1:9 的認罪。它的優點是認真看待約翰自己在 5:16--17 作的區分，也看重 3:4 的定義。</p><p><strong>難處：</strong>3:6、9 說的就是「犯罪」，沒有加限定詞；把它縮成某一類罪，是解經者加上去的。5:16 那一類罪，約翰沒有說是哪一種；拿它來解 3:9，等於用一個謎去解另一個謎。講台也很容易從這裡滑向宣判某人犯了那一類罪，那是本講義的紅線。</p>"],["身分與方向說：3:9 講從神生的人的本性與方向，1:8 講他仍有的實況","","<p>這一讀把重點放在 3:9 的理由句：「因神的道（原文是種）存在他心裡」（3:9）。σπέρμα 是神的生命種子；從神生的人裡面有一個新生命，這生命的本性與罪不相容——他會跌倒，卻不能安於罪，也不能把罪叫作義。就像一個孩子跌倒了會哭著找父親，不會坐在泥裡說泥就是家。1:8--10 講的是實況（我們仍有罪，要認），3:6--9 講的是身分與方向（我們不再屬罪），2:1 把兩者接起來。這一讀與約翰福音的重生語言一致，也與「將來如何，還未顯明」（3:2）的張力一致——已經是兒女，還沒有完全像他。</p><p><strong>難處：</strong>它不容易一句話講清楚；講得太抽象，會讓人覺得「方向」可以任意解釋，彷彿只要心裡想要好，行為怎樣都可以。所以這一讀必須同時講「行義的才是義人」（3:7）與「凡不行義的就不屬神」（3:10）——方向是會顯在行為上的。</p>"],["針對假教師說：1:8--10 與 3:6--9 都在回應分裂者的口號","","<p>這一讀從處境出發：1:6、8、10 三次「我們若說」，很可能是在引用離開之人的口號——我們與神相交、我們無罪、我們沒有犯過罪；他們自認屬靈境界高，已經超越罪的問題，或認為身體所做的與靈無關。約翰在 1:8--10 駁斥「無罪」的自我宣稱；在 3:6--9 則反過來說：真正從神生的人，不會把犯罪當作無所謂——「小子們哪，不要被人誘惑」（3:7）。這一讀幫助我們看見，兩段話對付的是同一種驕傲。</p><p><strong>難處：</strong>我們手上沒有離開者自己的文件，口號是從約翰的回應反推的；而且約翰在 1:6--10 用的主詞是「我們」，他先把自己放進去——這些話不只對外面的人說，也對信的人說。若只讀成「那是在講異端」，今天的讀者就會把兩段話都推給別人，自己不必面對。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：四讀並陳，講台以「身分與方向」為主軸，吸收現在式讀法的提醒與處境讀法的背景；落點在 2:1——從神生的人方向是不犯罪，跌倒時有中保。</strong></p><p>約翰寫信的目的，「是要叫你們不犯罪」（2:1）——方向不打折，不說「反正人人都有罪」。可是同一節緊接著說：「若有人犯罪，在父那裡我們有一位中保」（2:1）。「中保」原文 παράκλητος，就是約翰福音裡的「保惠師」——被請來站在你旁邊的那一位。他不是一位要你先證明自己沒有跌倒才肯幫你的律師；他是那義者耶穌基督，而且「他為我們的罪作了挽回祭」（2:2）。</p><p>所以講台有兩條線都要守住。<strong>對還在掙扎的信徒：</strong>3:6、9 不是用來叫你懷疑自己有沒有得救的；會因為跌倒而難過、而回頭認罪的心，本身就是神的種子在你裡面的記號——「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（1:9）。<strong>對刻意、持續不悔改的人：</strong>1:8 不是擋箭牌；「人人都有罪」是叫人來認罪的，不是叫人繼續犯的。約翰說得很直接：「小子們哪，不要被人誘惑。行義的才是義人」（3:7）。</p><p>最後，這一題收在確據：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（5:13）。確據不建立在「我最近表現得怎麼樣」，而建立在「人有了神的兒子就有生命」（5:12）。</p>"],["【四】這件事該不該影響你的信心","","<p>四種讀法之間的細節，不該動搖你的信心；它們都同意兩件事：神要我們不犯罪，基督為犯罪的人作了中保。</p><p>如果你是那種讀到 3:9 就心裡一沉的人，請聽約翰在同一封信裡說的另一句話：「我們的心若責備我們，神比我們的心大，一切事沒有不知道的」（3:20）。你的心會責備你，正說明你沒有對罪麻木。不要一個人關起門來審判自己，去找一位可信的弟兄姊妹或牧者，把事情說出來——「在光明中行」（1:7）本來就是一起走的。如果你發現自己其實是在拿「人人都有罪」安慰一件你不打算放下的事，那麼今天就是回頭的日子；中保還站在父那裡。</p>"]],"con":[],"say":"本講義的立場：1:8--10 與 3:6--9 四讀並陳，講台以身分與方向為主軸；落點在 2:1——從神生的人方向是不犯罪，跌倒時有中保。3:6、9 不叫掙扎的信徒懷疑得救，1:8 也不給刻意不悔改的人當擋箭牌；確據在神的兒子（5:12--13）。","care":"席上有人為同一個罪跌倒了很多次——色情、怒氣、酗酒、說謊——每次讀到 3:9 都心裡發冷；也有人長期與憂鬱、強迫思想纏鬥，把每一個念頭都當作罪。不要對他說「真正重生的人不會這樣」。陪他回到 2:1 與 1:9，也陪他找實際的幫助：成癮可以找專業戒治與互助小組，反覆的自責可以找輔導與醫療。對拿 1:8 替持續的外遇或欺壓開脫的人，也要溫柔而清楚地說：中保是給回頭的人的。"},{"id":"ISS00_3","t":"挽回祭與救恩的範圍：基督為誰的罪死？","r":"2:2；4:10；4:14","ch":[],"why":"三、挽回祭是神自己預備的；基督的死足夠為普天下人的罪，凡信的都可以來——本講義的全卷立場之三（本卷新立）。2:2 與 4:10 是約翰一書最濃縮的福音，也是兩場辯論的戰場（一場古老，一場近代）：挽回祭是平息神的忿怒，還是除去人的罪污？「普天下人的罪」是說人人終必得救、基督只為選民死，還是基督為所有人死？講錯了，會讓人以為神是一位要人去討好的暴君，或以為信不信都一樣；也可能讓一個人在深夜問：「基督到底有沒有為我死？」","pos":[["【一】經文問的是甚麼","","<p>約翰兩次用同一個字：「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪」（2:2）；「不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了」（4:10）。「挽回祭」原文 ἱλασμός（hilasmos），全新約只出現在這兩節。保羅用同字根的 ἱλαστήριον：「神設立耶穌作挽回祭」（羅 3:25）；希伯來書用動詞：「為百姓的罪獻上挽回祭」（來 2:17）。</p><p>這個字的舊約背景在七十士譯本。利未記 25:9 的「贖罪日」，七十士譯本譯作「挽回的日子」（ἡμέρα τοῦ ἱλασμοῦ）；民數記 5:8 的贖罪公羊、以西結書 44:27 的贖罪祭，也用這個字。「但在你有赦免之恩」（詩 130:4），這裡的「赦免」，七十士譯本（編號為詩 129:4）用的正是 ἱλασμός——這一處的主角是赦免人的神。利未記 16 章的贖罪日，大祭司把血帶進幔子內，彈在施恩座上，「因在這日要為你們贖罪，使你們潔淨」（利 16:30）。所以這一題有兩層：<strong>第一，挽回祭是向神平息忿怒，還是為人除去罪污？第二，2:2 說「普天下人的罪」，基督的死到底為了誰？</strong></p>"],["平息忿怒說（propitiation）：挽回祭是平息神對罪的公義忿怒","","<p>改革宗與許多福音派傳統把這個字譯作 propitiation。理由是：這個字群在希臘世界常指平息神明的怒氣；聖經也明說神對罪有忿怒：「不信子的人得不著永生……神的震怒常在他身上」（約 3:36）。照這一讀，基督的死承擔了神對罪的審判，神的公義得著滿足，所以神「是信實的，是公義的，必要赦免」（1:9）——赦免不是神睜一隻眼閉一隻眼，而是罪已經被處理了。二十世紀英國學者陶德（C. H. Dodd）主張這個字群只是「除去罪污」；莫理斯（Leon Morris）等學者則從七十士譯本回應：舊約的贖罪常與神的忿怒連在一起，例如有忿怒從耶和華那裡出來、瘟疫發作時，亞倫拿香爐跑到會中，「為百姓贖罪」（民 16:47），瘟疫就止住了。這一讀嚴肅看待罪，也嚴肅看待神的聖潔：「神就是光，在他毫無黑暗」（1:5）。</p><p><strong>難處：</strong>若講得粗糙，會變成異教式的圖畫：一位暴怒的父，一位溫柔的子，子去安撫父——彷彿神是被說服了才肯愛人。這正好與 4:10 相反。而且在七十士譯本裡，這個字群有時以神自己為主詞、以罪為對象（例如詩 130:4 的用例），意思接近遮蓋、赦免，不一定是「安撫某人」。</p>"],["除去罪污說（expiation）：挽回祭是把罪除去、使人潔淨","","<p>另一派把這個字譯作 expiation，二十世紀的陶德是代表。他們認為七十士譯本用這個字群時，重點在處理罪本身——遮蓋、洗淨、除去——不在改變神的情緒。約翰一書的上下文也支持「潔淨」：「他兒子耶穌的血也洗淨我們一切的罪」（1:7）；「洗淨我們一切的不義」（1:9）；「主曾顯現，是要除掉人的罪」（3:5）。施洗約翰也說：「看哪，神的羔羊，除去（或譯：背負）世人罪孽的」（約 1:29）。這一讀讓人看見十字架是一個潔淨、醫治的行動。</p><p><strong>難處：</strong>若完全拿掉神對罪的忿怒，罪就只剩下「髒」，不再是對一位聖潔之神的冒犯，十字架的代價也會變輕。約翰福音與約翰一書都沒有迴避審判：信裡說到「審判的日子」（4:17），也說到「懼怕裡含著刑罰」（4:18）。兩派其實各抓住了經文的一面。</p>"],["普救論：既為「普天下人的罪」，所有人終必得救","","<p>有人從 2:2 推論：基督既然為普天下人的罪作了挽回祭，所有人——不論信不信——最後都會得救。這一說看重神的愛的廣大，也回應了許多人心裡的痛：神怎麼能讓人滅亡？我那位沒有信主就過世的親人怎麼辦？</p><p><strong>難處：</strong>約翰一書本身就不支持這個推論。同一封信說：「人有了神的兒子就有生命，沒有神的兒子就沒有生命」（5:12）；約翰福音也說：「信子的人有永生」（約 3:36）。2:2 講的是挽回祭的足夠與廣度，不是說人可以不必信。<strong>本講義不採用普救論。</strong>至於已經過世的人，審判在神手中，講台不替神宣判任何人。</p>"],["有限救贖說與無限救贖說：「普天下」是萬族中的選民，還是每一個人","","<p><strong>有限救贖（特定救贖）：</strong>基督的死是為神所揀選的人，確實有效地拯救他們；2:2 的「普天下」是說不只猶太人、不只約翰的群體，而是各國各族的選民。約翰福音也有類似的說法：「並要將神四散的子民都聚集歸一」（約 11:52）。優點是強調十字架確實成就了救恩，不只是提供一個可能。<strong>難處：</strong>2:2 的對比是「不單為我們，也為普天下」，最自然的讀法是範圍比「我們」大；而約翰一書的「世界」常指與神為敵的人類（5:19），把它讀成選民有些勉強。</p><p><strong>無限救贖（普遍救贖）：</strong>基督的死足夠、也真實地為所有人預備了，人要藉著信領受。「父差子作世人的救主」（4:14），「神愛世人」（約 3:16）。優點是讓福音可以真誠地向每一個人傳。<strong>難處：</strong>若基督為每一個人死，而仍有人滅亡，十字架是否在某些人身上「失效」了？這一說要解釋救恩的預備與成就之間的關係，否則容易把得救的決定性移到人的選擇上。</p><p>許多傳統嘗試兩者兼顧：基督的死「足夠」為全人類，「有效」於信的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：挽回祭的兩面並陳，決定性的是 4:10——祭是神自己預備的，不是人去平息一位生氣的神；基督的死足夠為普天下人的罪，凡信的都可以來；普救論不採；有限與無限救贖之爭不在本卷裁判。</strong></p><p>4:10 把整件事的主詞定了：「不是我們愛神，乃是神愛我們，差他的兒子……作了挽回祭」（4:10）。在異教裡，是人帶祭物去平息神；在約翰一書裡，是神自己差兒子、自己預備祭。神對罪的忿怒是真的——光不能與黑暗相交；但處理這忿怒的，是神的愛。所以 propitiation 與 expiation 不必對立：神的聖潔要求罪被審判，神的愛親自承擔這審判，結果是罪被洗淨，人被帶回相交。中文「挽回」兩個字正好說出這件事：被挽回的，是關係。</p><p>至於 2:2b 的範圍，本講義不在約翰一書裁判加爾文與阿民念之爭；揀選的問題沿用以弗所書講義立場二。講台上要說的，是兩派都同意的兩件事：<strong>第一，基督的死沒有不夠的地方，沒有一個人的罪大到不在「普天下」之內；第二，這救恩要藉著信神的兒子領受（5:12）。</strong>這兩句話足夠讓傳福音的人放膽，也足夠讓來的人放心。</p>"],["【四】這件事該不該影響你的信心","","<p>挽回祭的兩面怎麼平衡、救贖的範圍怎麼表述，敬虔的信徒分在不同的傳統裡，已經討論了幾百年；這不該動搖你的信心。</p><p>但有一個問題比宗派之爭更貼近你：<strong>基督有沒有為我死？</strong>如果你曾經懷疑自己是不是「不在名單上」，請看約翰怎麼寫。他沒有叫你先查自己是不是選民，他叫你看神作了甚麼：「神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了」（4:9）。祭是神預備的，門是神開的；你能做的，是走進來。主耶穌說：「到我這裡來的，我總不丟棄他」（約 6:37）。</p>"]],"con":[],"say":"本講義的立場：挽回祭平息忿怒與除去罪污兩面並陳，決定性的
